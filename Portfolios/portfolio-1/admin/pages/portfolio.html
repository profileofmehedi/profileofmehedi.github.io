<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .portfolio-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #6366f1;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-10">
                <h2><i class="fas fa-images"></i> Portfolio Manager</h2>

                <div class="card mt-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="m-0">Add New Portfolio Item</h5>
                    </div>
                    <div class="card-body">
                        <form id="portfolioForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Project Title</label>
                                        <input type="text" class="form-control" id="portfolioTitle" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Category</label>
                                        <input type="text" class="form-control" id="portfolioCategory" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Icon (Font Awesome)</label>
                                        <input type="text" class="form-control" id="portfolioIcon"
                                            placeholder="fa-wallet" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Color (Hex)</label>
                                        <input type="color" class="form-control" id="portfolioColor" required>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Add Item</button>
                        </form>
                    </div>
                </div>

                <h4 class="mt-5">Portfolio Items</h4>
                <div id="portfolioList"></div>

                <a href="index.html" class="btn btn-secondary mt-4"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        function renderPortfolioList() {
            const list = document.getElementById('portfolioList');
            list.innerHTML = '';
            portfolioData.portfolio.forEach((item, index) => {
                list.innerHTML += `
                <div class="portfolio-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">${item.title}</h6>
                            <small class="text-muted">
                                <i class="fas ${item.icon}"></i> ${item.category} • Color: ${item.color}
                            </small>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="deletePortfolio(${index})">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `;
            });
        }

        function deletePortfolio(index) {
            if (confirm('Are you sure?')) {
                portfolioData.portfolio.splice(index, 1);
                saveData(portfolioData);
                renderPortfolioList();
                showAlert('Portfolio item deleted!', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderPortfolioList();

            document.getElementById('portfolioForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.portfolio.push({
                    title: document.getElementById('portfolioTitle').value,
                    category: document.getElementById('portfolioCategory').value,
                    icon: document.getElementById('portfolioIcon').value,
                    color: document.getElementById('portfolioColor').value
                });
                saveData(portfolioData);
                this.reset();
                renderPortfolioList();
                showAlert('Portfolio item added successfully!', 'success');
            });
        });
    </script>
</body>

</html>
