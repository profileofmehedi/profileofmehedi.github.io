<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Manager - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .skill-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #10b981;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-10">
                <h2><i class="fas fa-star"></i> Skills Manager</h2>

                <div class="card mt-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="m-0">Add New Skill</h5>
                    </div>
                    <div class="card-body">
                        <form id="skillForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Skill Name</label>
                                        <input type="text" class="form-control" id="skillName" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Proficiency (%)</label>
                                        <input type="number" class="form-control" id="skillPercentage" min="0" max="100"
                                            required>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Add Skill</button>
                        </form>
                    </div>
                </div>

                <h4 class="mt-5">Skills List</h4>
                <div id="skillList"></div>

                <a href="index.html" class="btn btn-secondary mt-4"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        function renderSkillList() {
            const list = document.getElementById('skillList');
            list.innerHTML = '';
            portfolioData.skills.forEach((item, index) => {
                list.innerHTML += `
                <div class="skill-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div style="flex: 1;">
                            <h6 class="mb-2">${item.name}</h6>
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar" style="width: ${item.percentage}%"></div>
                            </div>
                            <small class="text-muted">${item.percentage}%</small>
                        </div>
                        <button class="btn btn-sm btn-danger ms-3" onclick="deleteSkill(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            });
        }

        function deleteSkill(index) {
            if (confirm('Are you sure?')) {
                portfolioData.skills.splice(index, 1);
                saveData(portfolioData);
                renderSkillList();
                showAlert('Skill deleted!', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderSkillList();

            document.getElementById('skillForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.skills.push({
                    name: document.getElementById('skillName').value,
                    percentage: parseInt(document.getElementById('skillPercentage').value)
                });
                saveData(portfolioData);
                this.reset();
                renderSkillList();
                showAlert('Skill added successfully!', 'success');
            });
        });
    </script>
</body>

</html>
