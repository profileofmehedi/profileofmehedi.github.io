<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials Manager - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .testimonial-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-10">
                <h2><i class="fas fa-comments"></i> Testimonials Manager</h2>

                <div class="card mt-4">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="m-0">Add New Testimonial</h5>
                    </div>
                    <div class="card-body">
                        <form id="testimonialForm">
                            <div class="mb-3">
                                <label class="form-label">Testimonial Text</label>
                                <textarea class="form-control" id="testimonialText" rows="3" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Client Name</label>
                                        <input type="text" class="form-control" id="testimonialAuthor" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Position/Role</label>
                                        <input type="text" class="form-control" id="testimonialRole" required>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Add
                                Testimonial</button>
                        </form>
                    </div>
                </div>

                <h4 class="mt-5">Testimonials List</h4>
                <div id="testimonialList"></div>

                <a href="index.html" class="btn btn-secondary mt-4"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        function renderTestimonialList() {
            const list = document.getElementById('testimonialList');
            list.innerHTML = '';
            portfolioData.testimonials.forEach((item, index) => {
                list.innerHTML += `
                <div class="testimonial-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <p class="mb-2"><em>"${item.text}"</em></p>
                            <h6 class="mb-0">${item.author}</h6>
                            <small class="text-muted">${item.role}</small>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="deleteTestimonial(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            });
        }

        function deleteTestimonial(index) {
            if (confirm('Are you sure?')) {
                portfolioData.testimonials.splice(index, 1);
                saveData(portfolioData);
                renderTestimonialList();
                showAlert('Testimonial deleted!', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderTestimonialList();

            document.getElementById('testimonialForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.testimonials.push({
                    text: document.getElementById('testimonialText').value,
                    author: document.getElementById('testimonialAuthor').value,
                    role: document.getElementById('testimonialRole').value
                });
                saveData(portfolioData);
                this.reset();
                renderTestimonialList();
                showAlert('Testimonial added successfully!', 'success');
            });
        });
    </script>
</body>

</html>
