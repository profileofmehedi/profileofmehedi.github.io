<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <h2><i class="fas fa-phone"></i> Contact Information Editor</h2>
                <form id="contactForm" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" class="form-control" id="contactPhone" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" class="form-control" id="contactEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-map-marker-alt"></i> Office Location</label>
                        <input type="text" class="form-control" id="contactLocation" required>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                    <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to
                        Dashboard</a>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('contactPhone').value = portfolioData.contactPhone;
            document.getElementById('contactEmail').value = portfolioData.contactEmail;
            document.getElementById('contactLocation').value = portfolioData.contactLocation;

            document.getElementById('contactForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.contactPhone = document.getElementById('contactPhone').value;
                portfolioData.contactEmail = document.getElementById('contactEmail').value;
                portfolioData.contactLocation = document.getElementById('contactLocation').value;
                saveData(portfolioData);
                showAlert('Contact information updated successfully!', 'success');
            });
        });
    </script>
</body>

</html>
