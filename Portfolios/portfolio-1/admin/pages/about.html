<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Section - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <h2><i class="fas fa-user-circle"></i> About Section Editor</h2>
                <form id="aboutForm" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label">About Title</label>
                        <input type="text" class="form-control" id="aboutTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">About Description</label>
                        <textarea class="form-control" id="aboutDesc" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                    <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to
                        Dashboard</a>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('aboutTitle').value = portfolioData.aboutTitle;
            document.getElementById('aboutDesc').value = portfolioData.aboutDesc;

            document.getElementById('aboutForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.aboutTitle = document.getElementById('aboutTitle').value;
                portfolioData.aboutDesc = document.getElementById('aboutDesc').value;
                saveData(portfolioData);
                showAlert('About section updated successfully!', 'success');
            });
        });
    </script>
</body>

</html>
