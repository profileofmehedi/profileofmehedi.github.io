<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Manager - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .faq-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #8b5cf6;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-10">
                <h2><i class="fas fa-question-circle"></i> FAQ Manager</h2>

                <div class="card mt-4">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="m-0">Add New FAQ</h5>
                    </div>
                    <div class="card-body">
                        <form id="faqForm">
                            <div class="mb-3">
                                <label class="form-label">Question</label>
                                <input type="text" class="form-control" id="faqQuestion" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Answer</label>
                                <textarea class="form-control" id="faqAnswer" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Add FAQ</button>
                        </form>
                    </div>
                </div>

                <h4 class="mt-5">FAQs List</h4>
                <div id="faqList"></div>

                <a href="index.html" class="btn btn-secondary mt-4"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        function renderFAQList() {
            const list = document.getElementById('faqList');
            list.innerHTML = '';
            portfolioData.faq.forEach((item, index) => {
                list.innerHTML += `
                <div class="faq-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div style="flex: 1;">
                            <h6 class="mb-2"><i class="fas fa-question text-primary"></i> ${item.question}</h6>
                            <p class="text-muted mb-0">${item.answer}</p>
                        </div>
                        <button class="btn btn-sm btn-danger ms-3" onclick="deleteFAQ(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            });
        }

        function deleteFAQ(index) {
            if (confirm('Are you sure?')) {
                portfolioData.faq.splice(index, 1);
                saveData(portfolioData);
                renderFAQList();
                showAlert('FAQ deleted!', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderFAQList();

            document.getElementById('faqForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.faq.push({
                    question: document.getElementById('faqQuestion').value,
                    answer: document.getElementById('faqAnswer').value
                });
                saveData(portfolioData);
                this.reset();
                renderFAQList();
                showAlert('FAQ added successfully!', 'success');
            });
        });
    </script>
</body>

</html>
