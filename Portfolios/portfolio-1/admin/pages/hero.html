<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <h2><i class="fas fa-rocket"></i> Hero Section Editor</h2>
                <form id="heroForm" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label">Main Title</label>
                        <input type="text" class="form-control" id="heroTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subtitle</label>
                        <textarea class="form-control" id="heroSubtitle" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                    <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to
                        Dashboard</a>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('heroTitle').value = portfolioData.heroTitle;
            document.getElementById('heroSubtitle').value = portfolioData.heroSubtitle;

            document.getElementById('heroForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.heroTitle = document.getElementById('heroTitle').value;
                portfolioData.heroSubtitle = document.getElementById('heroSubtitle').value;
                saveData(portfolioData);
                showAlert('Hero section updated successfully!', 'success');
            });
        });
    </script>
</body>

</html>
