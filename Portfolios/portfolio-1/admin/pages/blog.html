<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .blog-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-10">
                <h2><i class="fas fa-blog"></i> Blog Manager</h2>

                <div class="card mt-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="m-0">Add New Blog Post</h5>
                    </div>
                    <div class="card-body">
                        <form id="blogForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Post Title</label>
                                        <input type="text" class="form-control" id="blogTitle" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Category</label>
                                        <input type="text" class="form-control" id="blogCategory" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Author</label>
                                        <input type="text" class="form-control" id="blogAuthor" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Date</label>
                                        <input type="date" class="form-control" id="blogDate" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Icon (Font Awesome)</label>
                                <input type="text" class="form-control" id="blogImage" placeholder="fa-eye" required>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Add Post</button>
                        </form>
                    </div>
                </div>

                <h4 class="mt-5">Blog Posts</h4>
                <div id="blogList"></div>

                <a href="index.html" class="btn btn-secondary mt-4"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        function renderBlogList() {
            const list = document.getElementById('blogList');
            list.innerHTML = '';
            portfolioData.blog.forEach((item, index) => {
                const dateObj = new Date(item.date);
                const formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

                list.innerHTML += `
                <div class="blog-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">${item.title}</h6>
                            <p class="text-muted mb-0 small">
                                <strong>${item.category}</strong> • ${formattedDate} • By ${item.author}
                            </p>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="deleteBlog(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            });
        }

        function deleteBlog(index) {
            if (confirm('Are you sure?')) {
                portfolioData.blog.splice(index, 1);
                saveData(portfolioData);
                renderBlogList();
                showAlert('Blog post deleted!', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderBlogList();

            document.getElementById('blogForm').addEventListener('submit', function (e) {
                e.preventDefault();

                const dateInput = document.getElementById('blogDate').value;
                const dateObj = new Date(dateInput);
                const formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

                portfolioData.blog.push({
                    title: document.getElementById('blogTitle').value,
                    category: document.getElementById('blogCategory').value,
                    image: document.getElementById('blogImage').value,
                    date: formattedDate,
                    author: document.getElementById('blogAuthor').value
                });
                saveData(portfolioData);
                this.reset();
                renderBlogList();
                showAlert('Blog post added successfully!', 'success');
            });
        });
    </script>
</body>

</html>
