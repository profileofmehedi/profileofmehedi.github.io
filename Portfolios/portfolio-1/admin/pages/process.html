<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Manager - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .process-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #06b6d4;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-10">
                <h2><i class="fas fa-project-diagram"></i> Process Manager</h2>

                <div class="card mt-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="m-0">Add New Process Step</h5>
                    </div>
                    <div class="card-body">
                        <form id="processForm">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="mb-3">
                                        <label class="form-label">Step Number</label>
                                        <input type="text" class="form-control" id="processStep" placeholder="01"
                                            required>
                                    </div>
                                </div>
                                <div class="col-md-9">
                                    <div class="mb-3">
                                        <label class="form-label">Step Title</label>
                                        <input type="text" class="form-control" id="processTitle" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Step Description</label>
                                <textarea class="form-control" id="processDesc" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Add Step</button>
                        </form>
                    </div>
                </div>

                <h4 class="mt-5">Process Steps</h4>
                <div id="processList"></div>

                <a href="index.html" class="btn btn-secondary mt-4"><i class="fas fa-arrow-left"></i> Back to
                    Dashboard</a>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script>
        function renderProcessList() {
            const list = document.getElementById('processList');
            list.innerHTML = '';
            portfolioData.process.forEach((item, index) => {
                list.innerHTML += `
                <div class="process-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                                <span style="background: #06b6d4; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                                    ${item.step}
                                </span>
                                <h6 class="mb-0">${item.title}</h6>
                            </div>
                            <p class="text-muted mb-0">${item.desc}</p>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="deleteProcess(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            });
        }

        function deleteProcess(index) {
            if (confirm('Are you sure?')) {
                portfolioData.process.splice(index, 1);
                saveData(portfolioData);
                renderProcessList();
                showAlert('Process step deleted!', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderProcessList();

            document.getElementById('processForm').addEventListener('submit', function (e) {
                e.preventDefault();
                portfolioData.process.push({
                    step: document.getElementById('processStep').value,
                    title: document.getElementById('processTitle').value,
                    desc: document.getElementById('processDesc').value
                });
                saveData(portfolioData);
                this.reset();
                renderProcessList();
                showAlert('Process step added successfully!', 'success');
            });
        });
    </script>
</body>

</html>
