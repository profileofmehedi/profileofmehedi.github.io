<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vision Pro</title>
    
    <!-- Import Google Font for professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4F46E5; /* Indigo */
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        /* Main Card Container */
        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            overflow: hidden;
        }

        /* Split Layout */
        .left-panel {
            width: 40%;
            padding: 30px;
            border-right: 1px solid var(--border-color);
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .right-panel {
            width: 60%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
        }

        /* Typography */
        h2 { margin-top: 0; color: var(--text-main); font-size: 1.5rem; }
        h3 { margin: 0 0 15px 0; color: var(--text-main); font-size: 1.2rem; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        /* Inputs */
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-main); font-size: 0.9rem; }
        
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* Drag and Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: white;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .drop-zone.dragover {
            border-color: var(--primary-color);
            background-color: #eef2ff;
        }

        .drop-zone p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
        .drop-zone svg { width: 40px; height: 40px; color: var(--text-muted); margin-bottom: 10px; }
        
        /* Hidden actual file input */
        #imageInput { display: none; }

        /* Image Preview */
        #preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Buttons */
        .btn-container { display: flex; gap: 10px; margin-top: auto; }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.98); }
        
        #generateBtn { background-color: var(--primary-color); color: white; }
        #generateBtn:hover { background-color: var(--primary-hover); }
        #generateBtn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #debugBtn { background-color: white; border: 1px solid var(--border-color); color: var(--text-muted); flex: 0.5;}
        #debugBtn:hover { background-color: #f3f4f6; }

        /* Results Area */
        #result-container {
            flex-grow: 1;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: #374151;
            white-space: pre-wrap; /* Keeps formatting */
        }

        /* Loading Spinner */
        .loader {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            text-align: center;
            font-weight: 600;
            color: var(--primary-color);
            width: 200px;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid rgba(79, 70, 229, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .main-card { flex-direction: column; height: auto; min-height: 100vh; border-radius: 0; }
            .left-panel, .right-panel { width: 100%; padding: 20px; height: auto; border-right: none; }
            #result-container { min-height: 300px; }
        }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>
<body>

    <div class="main-card">
        
        <!-- Left Side: Controls -->
        <div class="left-panel">
            <h2>Gemini Vision</h2>
            <p class="subtitle">Upload an image to analyze with AI.</p>

            <div class="input-group" style="display: none;">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" value="AIzaSyD9S9FuU90n15rN2sScQmrs6qpALrdgnOc" placeholder="Paste AIza... key here">
            </div>

            <div class="input-group">
                <label>Image Upload</label>
                <div class="drop-zone" id="dropZone">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p>Drag & drop or click to upload</p>
                    <input type="file" id="imageInput" accept="image/*">
                    <img id="preview" alt="Preview">
                </div>
            </div>

            <div class="input-group" style="display: none;">
                <label for="prompt">Prompt</label>
                <input type="text" id="prompt" value="Read carefully and give me the data as structured json format, I will just copy that" placeholder="Ask something about the image...">
            </div>

            <div class="btn-container">
                <button id="generateBtn">Analyze Image</button>
                <button id="debugBtn">Debug</button>
            </div>
        </div>

        <!-- Right Side: Results -->
        <div class="right-panel">
            <h3>Analysis Result</h3>
            
            <div id="result-container">
                Results will appear here...
            </div>
            
            <div id="loader" class="loader">
                <div class="spinner"></div>
                Processing...
            </div>
        </div>

    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const preview = document.getElementById('preview');
        const generateBtn = document.getElementById('generateBtn');
        const debugBtn = document.getElementById('debugBtn');
        const resultContainer = document.getElementById('result-container');
        const loader = document.getElementById('loader');
        const apiKeyInput = document.getElementById('apiKey');
        const dropText = dropZone.querySelector('p');
        const dropIcon = dropZone.querySelector('svg');

        let fileToUpload = null;

        // --- DRAG & DROP LOGIC ---
        dropZone.addEventListener('click', () => imageInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert("Please upload an image file.");
                return;
            }
            fileToUpload = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                dropText.style.display = 'none'; // Hide text to make room
                dropIcon.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }

        // --- API LOGIC ---

        async function fileToGenerativePart(file) {
            const base64EncodedDataPromise = new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });
            return {
                inlineData: {
                    data: await base64EncodedDataPromise,
                    mimeType: file.type,
                },
            };
        }

        generateBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) { alert("Please enter your API Key."); return; }
            if (!fileToUpload) { alert("Please upload an image."); return; }

            // UI Updates
            resultContainer.innerText = "";
            loader.style.display = 'block';
            generateBtn.disabled = true;
            resultContainer.style.opacity = "0.5";

            try {
                const genAI = new GoogleGenerativeAI(key);
                // Use 1.5-flash (Generic pointer to latest stable flash)
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

                const prompt = document.getElementById('prompt').value;
                const imagePart = await fileToGenerativePart(fileToUpload);

                const result = await model.generateContent([prompt, imagePart]);
                const response = await result.response;
                const text = response.text();

                resultContainer.innerText = text;

            } catch (error) {
                console.error(error);
                resultContainer.innerText = "Error: " + error.message;
                if(error.message.includes("404")) {
                     resultContainer.innerText += "\n\n(Model not found. Try clicking Debug to see available models.)";
                }
            } finally {
                loader.style.display = 'none';
                generateBtn.disabled = false;
                resultContainer.style.opacity = "1";
            }
        });

        debugBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) { alert("Enter API Key first."); return; }
            
            resultContainer.innerText = "Checking models...";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                let output = "Available Models:\n\n";
                data.models.forEach(m => {
                    if(m.supportedGenerationMethods?.includes("generateContent")) {
                        output += `• ${m.name.replace('models/', '')}\n`;
                    }
                });
                resultContainer.innerText = output;
            } catch (error) {
                resultContainer.innerText = "Debug Error: " + error.message;
            }
        });
    </script>

</body>
</html>
