<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Overview - Bangladesh Rice Research Institute</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/common-styles.css" />
    <link rel="stylesheet" href="shared/admin-styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <!-- Professional admin sidebar will be injected by JavaScript -->

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Navigation -->
      <div class="top-bar">
        <div class="d-flex align-items-center">
          <button class="sidebar-toggle me-3">
            <i class="bi bi-list"></i>
          </button>
          <h1 class="page-title">Dashboard Overview</h1>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input
              type="text"
              placeholder="Search applicants, jobs..."
              id="globalSearch"
            />
          </div>

          <button class="btn btn-outline-primary">
            <i class="bi bi-bell"></i>
            <span class="notification-badge">3</span>
          </button>

          <div class="dropdown">
            <button
              class="btn btn-link dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
            >
              <div class="user-avatar">HR</div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-person"></i> Profile</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-gear"></i> Settings</a
                >
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item" href="login.html"
                  ><i class="bi bi-box-arrow-right"></i> Logout</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <!-- Stats Grid -->
        <div class="row mb-4">
          <div class="col-lg-3 col-md-6 mb-4">
            <div class="stats-card">
              <div class="stats-icon bg-primary">
                <i class="bi bi-briefcase"></i>
              </div>
              <div class="stats-info">
                <h3 id="totalJobs">24</h3>
                <p>Active Job Postings</p>
                <small class="text-success">
                  <i class="bi bi-arrow-up"></i> +12% this month
                </small>
              </div>
            </div>
          </div>

          <div class="col-lg-3 col-md-6 mb-4">
            <div class="stats-card">
              <div class="stats-icon bg-info">
                <i class="bi bi-people"></i>
              </div>
              <div class="stats-info">
                <h3 id="totalApplicants">1,847</h3>
                <p>Total Applicants</p>
                <small class="text-success">
                  <i class="bi bi-arrow-up"></i> +8% this week
                </small>
              </div>
            </div>
          </div>

          <div class="col-lg-3 col-md-6 mb-4">
            <div class="stats-card">
              <div class="stats-icon bg-warning">
                <i class="bi bi-star"></i>
              </div>
              <div class="stats-info">
                <h3 id="shortlisted">342</h3>
                <p>Shortlisted Candidates</p>
                <small class="text-success">
                  <i class="bi bi-arrow-up"></i> +15% this month
                </small>
              </div>
            </div>
          </div>

          <div class="col-lg-3 col-md-6 mb-4">
            <div class="stats-card">
              <div class="stats-icon bg-success">
                <i class="bi bi-check-circle"></i>
              </div>
              <div class="stats-info">
                <h3 id="hired">67</h3>
                <p>Hired This Month</p>
                <small class="text-success">
                  <i class="bi bi-arrow-up"></i> +22% vs last month
                </small>
              </div>
            </div>
          </div>
        </div>

        <!-- Charts Grid -->
        <div class="row mb-4">
          <div class="col-lg-8">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">Application Trends</h5>
              </div>
              <div class="card-body">
                <canvas id="applicationChart"></canvas>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">Hiring Pipeline</h5>
              </div>
              <div class="card-body">
                <canvas id="pipelineChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h5 class="mb-0">Recent Activity</h5>
            <button
              class="btn btn-outline-primary btn-sm"
              id="refreshActivityBtn"
            >
              <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
          </div>
          <div class="card-body">
            <div class="activity-list" id="activityList">
              <!-- Activity items will be populated by JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="shared/common-scripts.js"></script>
    <script src="shared/admin-sidebar.js"></script>
    <script>
      $(document).ready(function () {
        // Initialize Dashboard
        initializeDashboard();

        function initializeDashboard() {
          // Initialize charts
          initializeApplicationChart();
          initializePipelineChart();
          loadRecentActivity();

          // Animate counters
          animateCounters();
        }

        function animateCounters() {
          $(".stats-card h3").each(function () {
            const $this = $(this);
            const countTo = parseInt($this.text().replace(/,/g, ""));

            $({ countNum: 0 }).animate(
              {
                countNum: countTo,
              },
              {
                duration: 2000,
                easing: "swing",
                step: function () {
                  $this.text(Math.floor(this.countNum).toLocaleString());
                },
                complete: function () {
                  $this.text(countTo.toLocaleString());
                },
              }
            );
          });
        }

        function initializeApplicationChart() {
          const ctx = document
            .getElementById("applicationChart")
            .getContext("2d");
          new Chart(ctx, {
            type: "line",
            data: {
              labels: [
                "Jan",
                "Feb",
                "Mar",
                "Apr",
                "May",
                "Jun",
                "Jul",
                "Aug",
                "Sep",
                "Oct",
              ],
              datasets: [
                {
                  label: "Applications Received",
                  data: [120, 190, 300, 500, 200, 300, 450, 600, 750, 850],
                  borderColor: "#0d6efd",
                  backgroundColor: "rgba(13, 110, 253, 0.1)",
                  tension: 0.4,
                  fill: true,
                  borderWidth: 2,
                },
                {
                  label: "Applications Processed",
                  data: [100, 150, 250, 400, 180, 250, 380, 520, 680, 780],
                  borderColor: "#198754",
                  backgroundColor: "rgba(25, 135, 84, 0.1)",
                  tension: 0.4,
                  fill: true,
                  borderWidth: 2,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: "top",
                },
              },
              scales: {
                y: {
                  beginAtZero: true,
                },
              },
            },
          });
        }

        function initializePipelineChart() {
          const ctx = document.getElementById("pipelineChart").getContext("2d");
          new Chart(ctx, {
            type: "doughnut",
            data: {
              labels: [
                "Applied",
                "Screening",
                "Interview",
                "Final Review",
                "Hired",
              ],
              datasets: [
                {
                  data: [450, 200, 80, 40, 20],
                  backgroundColor: [
                    "#0dcaf0",
                    "#6f42c1",
                    "#ffc107",
                    "#fd7e14",
                    "#198754",
                  ],
                  borderWidth: 2,
                  borderColor: "#fff",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: "bottom",
                },
              },
            },
          });
        }

        function loadRecentActivity() {
          const activities = [
            {
              type: "application",
              message: "New application received for Data Analyst position",
              time: "2 minutes ago",
              icon: "bi-person-plus",
              color: "success",
            },
            {
              type: "interview",
              message:
                "Interview scheduled with Dr. Ahmed Rahman for Research Assistant",
              time: "15 minutes ago",
              icon: "bi-calendar-check",
              color: "primary",
            },
            {
              type: "shortlist",
              message: "5 candidates shortlisted for Field Officer position",
              time: "1 hour ago",
              icon: "bi-star",
              color: "warning",
            },
            {
              type: "hire",
              message: "Ms. Fatima Khan hired as Senior Researcher",
              time: "3 hours ago",
              icon: "bi-check-circle",
              color: "success",
            },
            {
              type: "job",
              message: "New job posting created: Laboratory Technician",
              time: "5 hours ago",
              icon: "bi-briefcase",
              color: "info",
            },
            {
              type: "application",
              message:
                "Application deadline extended for Research Scientist position",
              time: "1 day ago",
              icon: "bi-clock",
              color: "warning",
            },
          ];

          const activityHtml = activities
            .map(
              (activity) => `
                    <div class="activity-item">
                        <div class="activity-icon bg-${activity.color}">
                            <i class="bi ${activity.icon}"></i>
                        </div>
                        <div class="activity-content">
                            <div class="activity-title">${activity.message}</div>
                            <small class="text-muted">${activity.time}</small>
                        </div>
                    </div>
                `
            )
            .join("");

          $("#activityList").html(activityHtml);
        }

        // Refresh activity button
        $("#refreshActivityBtn").on("click", function () {
          loadRecentActivity();
          showNotification("Activity refreshed", "success");
        });

        // Auto-refresh data every 30 seconds
        setInterval(function () {
          loadRecentActivity();
        }, 30000);
      });
    </script>

    <style>
      .stats-card {
        border-radius: 12px;
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
      }

      .stats-card:hover {
        transform: translateY(-2px);
      }

      .activity-item {
        display: flex;
        align-items: flex-start;
        padding: 1rem 0;
        border-bottom: 1px solid #e9ecef;
      }

      .activity-item:last-child {
        border-bottom: none;
      }

      .activity-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 1rem;
        color: white;
      }

      .activity-content {
        flex: 1;
      }

      .activity-title {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      canvas {
        height: 300px !important;
      }
    </style>
  </body>
</html>
