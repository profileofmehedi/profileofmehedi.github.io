<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            background-color: #0d6efd;
            color: white;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            padding: 20px;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
    </style>
</head>

<body>
    <div class="card login-card">
        <div class="card-header login-header text-center">
            <h4>Recruitment Portal Login</h4>
        </div>
        <div class="card-body p-4">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required placeholder="Enter your username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required
                        placeholder="Enter your password">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="#">Forgot Password?</a> | <a href="applicant_status.html">Check Application Status</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // Hardcoded user credentials
            const users = {
                "admin": { password: "123456", role: "admin" },
                "org": { password: "123456", role: "org" }
            };

            $("#loginForm").submit(function (e) {
                e.preventDefault();
                const email = $("#username").val();
                const password = $("#password").val();
                const user = users[email];

                if (user && user.password === password) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Successful!',
                        text: `Redirecting to ${user.role} dashboard...`,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        if (user.role === 'admin') {
                            window.location.href = 'admin_dashboard.html';
                        } else if (user.role === 'org') {
                            window.location.href = 'organization_dashboard.html';
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: 'Invalid email or password.',
                    });
                }
            });
        });
    </script>
</body>

</html>
