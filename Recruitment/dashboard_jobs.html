<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Management - Bangladesh Rice Research Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/common-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <!-- Advanced Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="bi bi-building"></i>
            </div>
            <div class="brand">BRRI Dashboard</div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-item">
                <a href="dashboard_overview.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span class="nav-text">Dashboard</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="dashboard_jobs.html" class="nav-link active">
                    <i class="bi bi-briefcase"></i>
                    <span class="nav-text">Job Management</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="dashboard_applicants.html" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span class="nav-text">Applicants</span>
                    <span class="notification-badge">12</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="dashboard_interviews.html" class="nav-link">
                    <i class="bi bi-calendar-check"></i>
                    <span class="nav-text">Interviews</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="dashboard_analytics.html" class="nav-link">
                    <i class="bi bi-graph-up"></i>
                    <span class="nav-text">Analytics</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="dashboard_reports.html" class="nav-link">
                    <i class="bi bi-file-earmark-text"></i>
                    <span class="nav-text">Reports</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="dashboard_settings.html" class="nav-link">
                    <i class="bi bi-gear"></i>
                    <span class="nav-text">Settings</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="login.html" class="nav-link">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="nav-text">Logout</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="top-nav-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">Job Management</h1>
            </div>

            <div class="top-nav-right">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search applicants, jobs..." id="globalSearch">
                </div>

                <button class="notification-icon" id="notificationBtn">
                    <i class="bi bi-bell"></i>
                    <span class="notification-badge">3</span>
                </button>

                <div class="user-menu" id="userMenu">
                    <div class="user-avatar">
                        HR
                    </div>
                    <div>
                        <div style="font-weight: 600;">HR Manager</div>
                        <div style="font-size: 0.875rem; color: var(--text-secondary);">admin@brri.gov.bd</div>
                    </div>
                    <i class="bi bi-chevron-down"></i>
                </div>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Job Management</h2>
                <button class="btn btn-primary" id="addJobBtn">
                    <i class="bi bi-plus-lg"></i> Create New Job
                </button>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <h3 class="card-title">Active Job Postings</h3>
                    <div class="d-flex gap-2">
                        <select class="form-select" id="departmentFilter" style="width: auto;">
                            <option value="">All Departments</option>
                            <option value="Research">Research</option>
                            <option value="Administration">Administration</option>
                            <option value="Field Operations">Field Operations</option>
                        </select>
                        <select class="form-select" id="statusFilter" style="width: auto;">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="closed">Closed</option>
                            <option value="draft">Draft</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm" id="refreshJobsBtn">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Job Title</th>
                                <th>Department</th>
                                <th>Applications</th>
                                <th>Shortlisted</th>
                                <th>Status</th>
                                <th>Posted Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="jobsTableBody">
                            <!-- Jobs will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Job Modal -->
    <div class="modal fade" id="jobModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Job Posting</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="jobForm">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Job Title</label>
                                <input type="text" class="form-control" id="jobTitle" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Department</label>
                                <select class="form-select" id="jobDepartment" required>
                                    <option value="">Select Department</option>
                                    <option value="research">Research</option>
                                    <option value="admin">Administration</option>
                                    <option value="field">Field Operations</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4">
                                <label class="form-label">Employment Type</label>
                                <select class="form-select" id="employmentType" required>
                                    <option value="">Select Type</option>
                                    <option value="full-time">Full Time</option>
                                    <option value="part-time">Part Time</option>
                                    <option value="contract">Contract</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Experience Level</label>
                                <select class="form-select" id="experienceLevel" required>
                                    <option value="">Select Level</option>
                                    <option value="entry">Entry Level</option>
                                    <option value="mid">Mid Level</option>
                                    <option value="senior">Senior Level</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Application Deadline</label>
                                <input type="date" class="form-control" id="deadline" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label">Job Description</label>
                            <textarea class="form-control" id="jobDescription" rows="4" required></textarea>
                        </div>
                        <div class="mt-3">
                            <label class="form-label">Requirements</label>
                            <textarea class="form-control" id="jobRequirements" rows="3" required></textarea>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label class="form-label">Minimum Salary</label>
                                <input type="number" class="form-control" id="minSalary">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Maximum Salary</label>
                                <input type="number" class="form-control" id="maxSalary">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-outline-primary" id="saveDraftBtn">Save as Draft</button>
                    <button type="button" class="btn btn-primary" id="publishJobBtn">Publish Job</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="shared/common-scripts.js"></script>
    <script>
        $(document).ready(function () {
            // Global variables
            let allJobs = [];
            let currentEditJobId = null;

            // Load jobs data on page load
            loadJobsData();

            // Jobs data with more comprehensive information
            function loadJobsData() {
                allJobs = [
                    {
                        id: 1,
                        title: 'Senior Research Scientist',
                        department: 'Research',
                        applications: 145,
                        shortlisted: 12,
                        status: 'active',
                        postedDate: '2024-10-01',
                        employmentType: 'full-time',
                        experienceLevel: 'senior',
                        deadline: '2024-11-15',
                        description: 'Lead research initiatives in rice genetics and breeding programs. Develop new varieties and improve existing ones.',
                        requirements: 'PhD in Plant Sciences, 5+ years research experience, publication record',
                        minSalary: 80000,
                        maxSalary: 120000
                    },
                    {
                        id: 2,
                        title: 'Data Analyst',
                        department: 'Administration',
                        applications: 89,
                        shortlisted: 8,
                        status: 'active',
                        postedDate: '2024-10-05',
                        employmentType: 'full-time',
                        experienceLevel: 'mid',
                        deadline: '2024-11-20',
                        description: 'Analyze research data and create reports for management decision making.',
                        requirements: 'Masters in Statistics/Data Science, 3+ years experience with R/Python',
                        minSalary: 45000,
                        maxSalary: 65000
                    },
                    {
                        id: 3,
                        title: 'Field Operations Manager',
                        department: 'Field Operations',
                        applications: 67,
                        shortlisted: 15,
                        status: 'closed',
                        postedDate: '2024-09-20',
                        employmentType: 'full-time',
                        experienceLevel: 'senior',
                        deadline: '2024-10-30',
                        description: 'Oversee field trials and coordinate with farmers for technology transfer.',
                        requirements: 'BSc Agriculture, 8+ years field experience, leadership skills',
                        minSalary: 55000,
                        maxSalary: 75000
                    },
                    {
                        id: 4,
                        title: 'Agricultural Extension Officer',
                        department: 'Field Operations',
                        applications: 234,
                        shortlisted: 25,
                        status: 'active',
                        postedDate: '2024-09-15',
                        employmentType: 'full-time',
                        experienceLevel: 'entry',
                        deadline: '2024-11-10',
                        description: 'Provide technical support to farmers and conduct training programs.',
                        requirements: 'BSc Agriculture, good communication skills, field experience preferred',
                        minSalary: 30000,
                        maxSalary: 45000
                    },
                    {
                        id: 5,
                        title: 'Laboratory Technician',
                        department: 'Research',
                        applications: 156,
                        shortlisted: 18,
                        status: 'draft',
                        postedDate: '2024-09-28',
                        employmentType: 'part-time',
                        experienceLevel: 'entry',
                        deadline: '2024-11-25',
                        description: 'Assist in laboratory experiments and maintain equipment.',
                        requirements: 'BSc Chemistry/Biology, laboratory experience, attention to detail',
                        minSalary: 25000,
                        maxSalary: 35000
                    }
                ];

                filterAndDisplayJobs();
            }

            // Filter and display jobs based on current filters
            function filterAndDisplayJobs() {
                const departmentFilter = $('#departmentFilter').val();
                const statusFilter = $('#statusFilter').val();
                const searchTerm = $('#globalSearch').val().toLowerCase();

                let filteredJobs = allJobs.filter(job => {
                    const matchesDepartment = !departmentFilter || job.department === departmentFilter;
                    const matchesStatus = !statusFilter || job.status === statusFilter;
                    const matchesSearch = !searchTerm ||
                        job.title.toLowerCase().includes(searchTerm) ||
                        job.department.toLowerCase().includes(searchTerm);

                    return matchesDepartment && matchesStatus && matchesSearch;
                });

                displayJobs(filteredJobs);
            }

            // Display jobs in the table
            function displayJobs(jobs) {
                const jobsHtml = jobs.map(job => `
                    <tr data-job-id="${job.id}">
                        <td>
                            <div class="fw-medium">${job.title}</div>
                            <small class="text-muted">ID: #${job.id}</small>
                        </td>
                        <td>${job.department}</td>
                        <td>
                            <span class="badge bg-light text-dark">${job.applications}</span>
                        </td>
                        <td>
                            <span class="badge bg-warning">${job.shortlisted}</span>
                        </td>
                        <td>
                            ${createStatusBadge(job.status)}
                        </td>
                        <td>${formatDate(job.postedDate)}</td>
                        <td>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm btn-outline-primary view-job-btn" data-id="${job.id}" title="View Details">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-secondary edit-job-btn" data-id="${job.id}" title="Edit Job">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-success duplicate-job-btn" data-id="${job.id}" title="Duplicate Job">
                                    <i class="bi bi-files"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-info status-job-btn" data-id="${job.id}" title="Change Status">
                                    <i class="bi bi-arrow-repeat"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger delete-job-btn" data-id="${job.id}" title="Delete Job">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');

                $('#jobsTableBody').html(jobsHtml);
            }

            // Helper functions
            function createStatusBadge(status) {
                const statusClasses = {
                    'active': 'status-badge active',
                    'closed': 'status-badge inactive',
                    'draft': 'status-badge pending'
                };
                return `<span class="${statusClasses[status] || 'status-badge'}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
            }

            function formatDate(dateString) {
                return new Date(dateString).toLocaleDateString();
            }

            function findJobById(id) {
                return allJobs.find(job => job.id === parseInt(id));
            }

            // Event Handlers

            // Filter handlers
            $('#departmentFilter, #statusFilter').on('change', function () {
                filterAndDisplayJobs();
            });

            // Search handler
            $('#globalSearch').on('input', function () {
                filterAndDisplayJobs();
            });

            // Refresh button
            $('#refreshJobsBtn').on('click', function () {
                loadJobsData();
                Swal.fire({
                    title: 'Refreshed!',
                    text: 'Job listings have been updated.',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                });
            });

            // Add new job button
            $('#addJobBtn').on('click', function () {
                currentEditJobId = null;
                $('#jobModal .modal-title').text('Create New Job Posting');
                resetJobForm();
                $('#jobModal').modal('show');
            });

            // View job details
            $(document).on('click', '.view-job-btn', function () {
                const jobId = $(this).data('id');
                const job = findJobById(jobId);

                if (job) {
                    Swal.fire({
                        title: job.title,
                        html: `
                            <div class="text-start">
                                <div class="row mb-3">
                                    <div class="col-md-6"><strong>Department:</strong> ${job.department}</div>
                                    <div class="col-md-6"><strong>Status:</strong> ${createStatusBadge(job.status)}</div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6"><strong>Employment Type:</strong> ${job.employmentType}</div>
                                    <div class="col-md-6"><strong>Experience Level:</strong> ${job.experienceLevel}</div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6"><strong>Posted Date:</strong> ${formatDate(job.postedDate)}</div>
                                    <div class="col-md-6"><strong>Deadline:</strong> ${formatDate(job.deadline)}</div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6"><strong>Salary Range:</strong> ৳${job.minSalary?.toLocaleString()} - ৳${job.maxSalary?.toLocaleString()}</div>
                                    <div class="col-md-6"><strong>Applications:</strong> ${job.applications} (${job.shortlisted} shortlisted)</div>
                                </div>
                                <div class="mb-3">
                                    <strong>Description:</strong><br>
                                    <p class="mt-2">${job.description}</p>
                                </div>
                                <div class="mb-3">
                                    <strong>Requirements:</strong><br>
                                    <p class="mt-2">${job.requirements}</p>
                                </div>
                            </div>
                        `,
                        width: 800,
                        showCloseButton: true,
                        showConfirmButton: false,
                        customClass: {
                            popup: 'text-start'
                        }
                    });
                }
            });

            // Edit job
            $(document).on('click', '.edit-job-btn', function () {
                const jobId = $(this).data('id');
                const job = findJobById(jobId);

                if (job) {
                    currentEditJobId = jobId;
                    $('#jobModal .modal-title').text('Edit Job Posting');
                    populateJobForm(job);
                    $('#jobModal').modal('show');
                }
            });

            // Duplicate job
            $(document).on('click', '.duplicate-job-btn', function () {
                const jobId = $(this).data('id');
                const job = findJobById(jobId);

                if (job) {
                    currentEditJobId = null;
                    $('#jobModal .modal-title').text('Duplicate Job Posting');
                    populateJobForm(job);
                    $('#jobTitle').val(job.title + ' (Copy)');
                    $('#jobModal').modal('show');
                }
            });

            // Change job status
            $(document).on('click', '.status-job-btn', function () {
                const jobId = $(this).data('id');
                const job = findJobById(jobId);

                if (job) {
                    Swal.fire({
                        title: 'Change Job Status',
                        html: `
                            <div class="text-start">
                                <label class="form-label">Current Status: ${createStatusBadge(job.status)}</label>
                                <select id="newStatus" class="form-select">
                                    <option value="active" ${job.status === 'active' ? 'selected' : ''}>Active</option>
                                    <option value="closed" ${job.status === 'closed' ? 'selected' : ''}>Closed</option>
                                    <option value="draft" ${job.status === 'draft' ? 'selected' : ''}>Draft</option>
                                </select>
                            </div>
                        `,
                        showCancelButton: true,
                        confirmButtonText: 'Update Status',
                        preConfirm: () => {
                            const newStatus = $('#newStatus').val();
                            if (newStatus === job.status) {
                                Swal.showValidationMessage('Please select a different status');
                                return false;
                            }
                            return newStatus;
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Update job status in the data
                            const jobIndex = allJobs.findIndex(j => j.id === parseInt(jobId));
                            if (jobIndex !== -1) {
                                allJobs[jobIndex].status = result.value;
                                filterAndDisplayJobs();
                                Swal.fire('Success!', 'Job status has been updated.', 'success');
                            }
                        }
                    });
                }
            });

            // Delete job
            $(document).on('click', '.delete-job-btn', function () {
                const jobId = $(this).data('id');
                const job = findJobById(jobId);

                if (job) {
                    Swal.fire({
                        title: 'Delete Job?',
                        html: `Are you sure you want to delete <strong>${job.title}</strong>?<br><small class="text-muted">This action cannot be undone.</small>`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'Yes, delete it!',
                        confirmButtonColor: '#dc3545'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Remove job from data
                            allJobs = allJobs.filter(j => j.id !== parseInt(jobId));
                            filterAndDisplayJobs();
                            Swal.fire('Deleted!', 'Job has been deleted.', 'success');
                        }
                    });
                }
            });

            // Form handling
            function resetJobForm() {
                $('#jobForm')[0].reset();
                $('#jobForm .is-invalid').removeClass('is-invalid');
            }

            function populateJobForm(job) {
                $('#jobTitle').val(job.title);
                $('#jobDepartment').val(job.department.toLowerCase());
                $('#employmentType').val(job.employmentType);
                $('#experienceLevel').val(job.experienceLevel);
                $('#deadline').val(job.deadline);
                $('#jobDescription').val(job.description);
                $('#jobRequirements').val(job.requirements);
                $('#minSalary').val(job.minSalary);
                $('#maxSalary').val(job.maxSalary);
            }

            function validateJobForm() {
                const requiredFields = ['jobTitle', 'jobDepartment', 'employmentType', 'experienceLevel', 'deadline', 'jobDescription', 'jobRequirements'];
                let isValid = true;

                requiredFields.forEach(field => {
                    const value = $(`#${field}`).val();
                    if (!value || value.trim() === '') {
                        $(`#${field}`).addClass('is-invalid');
                        isValid = false;
                    } else {
                        $(`#${field}`).removeClass('is-invalid');
                    }
                });

                // Validate deadline is in the future
                const deadline = new Date($('#deadline').val());
                const today = new Date();
                if (deadline <= today) {
                    $('#deadline').addClass('is-invalid');
                    isValid = false;
                }

                // Validate salary range
                const minSalary = parseFloat($('#minSalary').val()) || 0;
                const maxSalary = parseFloat($('#maxSalary').val()) || 0;
                if (maxSalary > 0 && minSalary > maxSalary) {
                    $('#minSalary, #maxSalary').addClass('is-invalid');
                    isValid = false;
                }

                if (!isValid) {
                    Swal.fire('Error', 'Please fill in all required fields correctly.', 'error');
                }

                return isValid;
            }

            function getJobFormData() {
                return {
                    title: $('#jobTitle').val(),
                    department: $('#jobDepartment option:selected').text(),
                    employmentType: $('#employmentType').val(),
                    experienceLevel: $('#experienceLevel').val(),
                    deadline: $('#deadline').val(),
                    description: $('#jobDescription').val(),
                    requirements: $('#jobRequirements').val(),
                    minSalary: parseFloat($('#minSalary').val()) || 0,
                    maxSalary: parseFloat($('#maxSalary').val()) || 0
                };
            }

            // Publish job
            $('#publishJobBtn').on('click', function () {
                if (validateJobForm()) {
                    const jobData = getJobFormData();
                    const isEditing = currentEditJobId !== null;

                    Swal.fire({
                        title: isEditing ? 'Update Job?' : 'Publish Job?',
                        text: isEditing ? 'This will update the existing job posting.' : 'This job will be visible to all applicants.',
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: isEditing ? 'Yes, update it!' : 'Yes, publish it!'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            if (isEditing) {
                                // Update existing job
                                const jobIndex = allJobs.findIndex(j => j.id === currentEditJobId);
                                if (jobIndex !== -1) {
                                    allJobs[jobIndex] = { ...allJobs[jobIndex], ...jobData, status: 'active' };
                                }
                                Swal.fire('Success!', 'Job has been updated successfully.', 'success');
                            } else {
                                // Add new job
                                const newJob = {
                                    id: Math.max(...allJobs.map(j => j.id)) + 1,
                                    ...jobData,
                                    status: 'active',
                                    postedDate: new Date().toISOString().split('T')[0],
                                    applications: 0,
                                    shortlisted: 0
                                };
                                allJobs.push(newJob);
                                Swal.fire('Success!', 'Job has been published successfully.', 'success');
                            }

                            $('#jobModal').modal('hide');
                            filterAndDisplayJobs();
                        }
                    });
                }
            });

            // Save as draft
            $('#saveDraftBtn').on('click', function () {
                if (validateJobForm()) {
                    const jobData = getJobFormData();
                    const isEditing = currentEditJobId !== null;

                    if (isEditing) {
                        // Update existing job as draft
                        const jobIndex = allJobs.findIndex(j => j.id === currentEditJobId);
                        if (jobIndex !== -1) {
                            allJobs[jobIndex] = { ...allJobs[jobIndex], ...jobData, status: 'draft' };
                        }
                        Swal.fire('Saved!', 'Job has been updated as draft.', 'success');
                    } else {
                        // Add new job as draft
                        const newJob = {
                            id: Math.max(...allJobs.map(j => j.id)) + 1,
                            ...jobData,
                            status: 'draft',
                            postedDate: new Date().toISOString().split('T')[0],
                            applications: 0,
                            shortlisted: 0
                        };
                        allJobs.push(newJob);
                        Swal.fire('Saved!', 'Job has been saved as draft.', 'success');
                    }

                    $('#jobModal').modal('hide');
                    filterAndDisplayJobs();
                }
            });

            // Modal reset on close
            $('#jobModal').on('hidden.bs.modal', function () {
                resetJobForm();
                currentEditJobId = null;
            });
        });
    </script>
</body>

</html>
