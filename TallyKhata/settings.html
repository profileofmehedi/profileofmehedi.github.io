<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - TallyKhata</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Use same CSS as customer_dashboard.html -->
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .sidebar {
        background-color: #fff;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      }
      .sidebar .navbar-brand {
        color: #0d6efd;
        font-weight: 600;
      }
      .sidebar .nav-link {
        color: #555;
        padding: 12px 15px;
        border-radius: 5px;
        margin-bottom: 5px;
      }
      .sidebar .nav-link:hover {
        background-color: #e9ecef;
      }
      .sidebar .nav-link.active {
        color: #fff;
        background-color: #0d6efd;
        font-weight: 500;
      }
      .topbar {
        background-color: #fff;
        height: 60px;
        position: fixed;
        top: 0;
        left: 250px;
        right: 0;
        z-index: 99;
        border-bottom: 1px solid #dee2e6;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 30px;
      }
      .lang-switcher {
        display: flex;
        background-color: #f8f9fa;
        border-radius: 6px;
        overflow: hidden;
      }
      .lang-btn {
        border: none;
        background: transparent;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        color: #6c757d;
        cursor: pointer;
        transition: all 0.2s;
      }
      .lang-btn.active {
        background-color: #0d6efd;
        color: white;
      }
      .lang-btn:hover:not(.active) {
        background-color: #e9ecef;
        color: #495057;
      }
      .main-content {
        margin-left: 250px;
        margin-top: 60px;
        padding: 30px;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
      <a class="navbar-brand d-block text-center mb-4" href="#">TallyKhata</a>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="customer_dashboard.html"
            ><i class="bi bi-grid-fill me-2"></i>
            <span data-lang="dashboard">ড্যাশবোর্ড</span></a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="customers_page.html"
            ><i class="bi bi-people-fill me-2"></i>
            <span data-lang="customers">গ্রাহকগণ</span></a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="suppliers_page.html"
            ><i class="bi bi-person-rolodex me-2"></i>
            <span data-lang="suppliers">সরবরাহকারী</span></a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reports_page.html"
            ><i class="bi bi-bar-chart-line-fill me-2"></i>
            <span data-lang="reports">রিপোর্ট</span></a
          >
        </li>
        <li class="nav-item mt-auto">
          <a class="nav-link" href="#" onclick="Auth.logout()"
            ><i class="bi bi-box-arrow-left me-2"></i>
            <span data-lang="logout">লগআউট</span></a
          >
        </li>
      </ul>
    </div>

    <!-- Top Bar -->
    <div class="topbar">
      <div class="lang-switcher">
        <button
          class="lang-btn active"
          data-lang-code="bn"
          onclick="LanguageManager.setLanguage('bn')"
        >
          বাংলা
        </button>
        <button
          class="lang-btn"
          data-lang-code="en"
          onclick="LanguageManager.setLanguage('en')"
        >
          English
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h3>Settings</h3>
      <div class="row mt-4">
        <div class="col-md-8">
          <!-- Business Profile Card -->
          <div class="card mb-4">
            <div class="card-header"><h4>Business Profile</h4></div>
            <div class="card-body">
              <form id="businessProfileForm">
                <div class="mb-3">
                  <label for="businessName" class="form-label"
                    >Business Name</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="businessName"
                    value="My Awesome Business"
                  />
                </div>
                <div class="mb-3">
                  <label for="businessAddress" class="form-label"
                    >Business Address</label
                  >
                  <textarea class="form-control" id="businessAddress" rows="3">
123 Main St, Anytown, USA</textarea
                  >
                </div>
                <button type="submit" class="btn btn-primary">
                  Save Changes
                </button>
              </form>
            </div>
          </div>

          <!-- Change Password Card -->
          <div class="card">
            <div class="card-header"><h4>Change Password</h4></div>
            <div class="card-body">
              <form id="changePasswordForm">
                <div class="mb-3">
                  <label for="currentPassword" class="form-label"
                    >Current Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="currentPassword"
                  />
                </div>
                <div class="mb-3">
                  <label for="newPassword" class="form-label"
                    >New Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="newPassword"
                  />
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >Confirm New Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                  />
                </div>
                <button type="submit" class="btn btn-primary">
                  Update Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
