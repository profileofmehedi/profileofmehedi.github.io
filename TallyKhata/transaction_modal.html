<!-- Universal Add/Edit Transaction Modal -->
<div
  class="modal fade"
  id="transactionModal"
  tabindex="-1"
  aria-labelledby="transactionModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="transactionModalLabel">
          Add New Transaction
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="transactionForm">
          <!-- Transaction Type Tabs -->
          <ul
            class="nav nav-pills nav-fill mb-4"
            id="transactionType"
            role="tablist"
          >
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="sale-tab"
                data-bs-toggle="tab"
                data-bs-target="#sale-pane"
                type="button"
                role="tab"
              >
                Sale / Revenue
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="expense-tab"
                data-bs-toggle="tab"
                data-bs-target="#expense-pane"
                type="button"
                role="tab"
              >
                Expense / Purchase
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="payment-tab"
                data-bs-toggle="tab"
                data-bs-target="#payment-pane"
                type="button"
                role="tab"
              >
                Payment In/Out
              </button>
            </li>
          </ul>

          <div class="tab-content" id="transactionTypeContent">
            <!-- Sale Pane -->
            <div
              class="tab-pane fade show active"
              id="sale-pane"
              role="tabpanel"
            >
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="saleCustomer" class="form-label">Customer</label>
                  <select class="form-select" id="saleCustomer">
                    <option selected>Select Customer...</option>
                    <option>John Doe</option>
                    <option>Jane Smith</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="saleAmount" class="form-label"
                    >Total Amount</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="saleAmount"
                    placeholder="0.00"
                    required
                  />
                </div>
              </div>
            </div>
            <!-- Expense Pane -->
            <div class="tab-pane fade" id="expense-pane" role="tabpanel">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="expenseSupplier" class="form-label"
                    >Supplier</label
                  >
                  <select class="form-select" id="expenseSupplier">
                    <option selected>Select Supplier...</option>
                    <option>Tech Supplies Inc.</option>
                    <option>Office Goods Ltd.</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="expenseAmount" class="form-label"
                    >Total Amount</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="expenseAmount"
                    placeholder="0.00"
                    required
                  />
                </div>
              </div>
            </div>
            <!-- Payment Pane -->
            <div class="tab-pane fade" id="payment-pane" role="tabpanel">
              <!-- Content for Payment In/Out -->
            </div>
          </div>

          <div class="mb-3">
            <label for="transactionDetails" class="form-label"
              >Details / Description</label
            >
            <textarea
              class="form-control"
              id="transactionDetails"
              rows="3"
              placeholder="e.g., Sale of Product X, Invoice #123"
            ></textarea>
          </div>

          <div class="mb-3">
            <label for="transactionDate" class="form-label">Date</label>
            <input
              type="date"
              class="form-control"
              id="transactionDate"
              value="2025-09-27"
            />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="saveTransaction">
          Save Transaction
        </button>
      </div>
    </div>
  </div>
</div>
