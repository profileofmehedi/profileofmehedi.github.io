<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Reports - TallyKhata Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Use same CSS as admin_dashboard.html -->
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .sidebar {
        background-color: #212529;
        color: white;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
      }
      .sidebar .navbar-brand {
        color: #fff;
        font-weight: 600;
      }
      .sidebar .nav-link {
        color: #adb5bd;
        padding: 12px 15px;
        border-radius: 5px;
        margin-bottom: 5px;
      }
      .sidebar .nav-link:hover {
        background-color: #343a40;
      }
      .sidebar .nav-link.active {
        color: #fff;
        background-color: #0d6efd;
        font-weight: 500;
      }
      .main-content {
        margin-left: 250px;
        padding: 30px;
      }
      .chart-placeholder {
        height: 350px;
        background: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <!-- Admin Sidebar -->
    <div class="sidebar p-3">
      <a class="navbar-brand d-block text-center mb-4" href="#"
        >TallyKhata Admin</a
      >
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="admin_dashboard.html"
            ><i class="bi bi-grid-fill me-2"></i> Dashboard</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin_manage_users.html"
            ><i class="bi bi-people-fill me-2"></i> Manage Users</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="admin_system_reports.html"
            ><i class="bi bi-file-earmark-text-fill me-2"></i> System Reports</a
          >
        </li>
        <li class="nav-item mt-auto">
          <a class="nav-link" href="#" onclick="Auth.logout()"
            ><i class="bi bi-box-arrow-left me-2"></i> Logout</a
          >
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h3>System-Wide Analytics</h3>
      <div class="row mt-4 g-4">
        <!-- User Growth Chart -->
        <div class="col-md-6">
          <div class="card">
            <div class="card-header"><h4>User Sign-ups Over Time</h4></div>
            <div class="card-body">
              <div class="chart-placeholder">
                <p>
                  <i class="bi bi-graph-up me-2"></i> User Growth Line Chart
                </p>
              </div>
            </div>
          </div>
        </div>
        <!-- Transaction Volume Chart -->
        <div class="col-md-6">
          <div class="card">
            <div class="card-header"><h4>Daily Transaction Volume</h4></div>
            <div class="card-body">
              <div class="chart-placeholder">
                <p>
                  <i class="bi bi-bar-chart-fill me-2"></i> Transaction Volume
                  Bar Chart
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Data Export Section -->
      <div class="card mt-5">
        <div class="card-header"><h4>Export Data</h4></div>
        <div class="card-body">
          <form class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="reportType" class="form-label">Report Type</label>
              <select class="form-select" id="reportType">
                <option selected>Choose...</option>
                <option value="1">All Users List</option>
                <option value="2">Transaction Log (Last 30 Days)</option>
                <option value="3">System Activity Log</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="format" class="form-label">Format</label>
              <select class="form-select" id="format">
                <option value="csv" selected>CSV</option>
                <option value="pdf">PDF</option>
              </select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">
                Generate & Download
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
