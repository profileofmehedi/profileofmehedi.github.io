<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4 Visa Interview Flashcards</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #059669;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        .language-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .language-btn {
            padding: 10px 30px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
        }

        .language-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .language-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 8px 20px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .category-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 12px 45px 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .flashcard-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 40px;
            min-height: 300px;
            box-shadow: var(--card-shadow);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .flashcard:hover {
            box-shadow: var(--card-hover);
            transform: translateY(-5px);
        }

        .flashcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .category-badge {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .answer {
            font-size: 1.1rem;
            color: #4b5563;
            line-height: 1.8;
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--success-color);
        }

        .answer-label {
            color: var(--success-color);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .nav-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .card-counter {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4b5563;
            padding: 10px 20px;
            background: #f3f4f6;
            border-radius: 10px;
        }

        .progress-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        .progress {
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
            transition: width 0.5s ease;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 1.2rem;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .action-btn {
            padding: 10px 25px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .action-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .flashcard {
                padding: 25px;
                min-height: 250px;
            }

            .question {
                font-size: 1.1rem;
            }

            .answer {
                font-size: 1rem;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }

            .category-filter {
                justify-content: center;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-passport"></i> H4 Visa Interview Flashcards</h1>
            <p>Comprehensive preparation guide for spouse visa interview</p>
        </div>

        <div class="controls">
            <h5 class="mb-3"><i class="fas fa-language"></i> Select Language</h5>
            <div class="language-toggle">
                <button class="language-btn active" data-lang="english">English</button>
                <button class="language-btn" data-lang="bangla">বাংলা</button>
            </div>

            <h5 class="mb-3 mt-4"><i class="fas fa-filter"></i> Filter by Category</h5>
            <div class="category-filter" id="categoryFilter">
                <button class="category-btn active" data-category="all">All Questions</button>
                <button class="category-btn" data-category="personal">Personal Plans</button>
                <button class="category-btn" data-category="marriage">Marriage</button>
                <button class="category-btn" data-category="husband">Husband's Details</button>
                <button class="category-btn" data-category="living">Living Arrangements</button>
                <button class="category-btn" data-category="ties">Bangladesh Ties</button>
            </div>

            <div class="search-box mt-3">
                <input type="text" id="searchInput" placeholder="Search questions...">
                <i class="fas fa-search"></i>
            </div>
        </div>

        <div class="progress-section">
            <div class="d-flex justify-content-between mb-2">
                <span><strong>Progress:</strong></span>
                <span id="progressText">0 of 0</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <div id="flashcardArea"></div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-arrow-left"></i> Previous</button>
            <div class="card-counter" id="cardCounter">1 / 1</div>
            <button class="nav-btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
        </div>

        <div class="action-buttons mt-4 text-center">
            <button class="action-btn" id="shuffleBtn"><i class="fas fa-random"></i> Shuffle Cards</button>
            <button class="action-btn" id="resetBtn"><i class="fas fa-redo"></i> Reset Progress</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

let currentIndex = 0;
let filteredCards = [...flashcardsData];
let viewedCards = new Set();
let currentLanguage = 'english';

function renderFlashcard() {
    if (filteredCards.length === 0) {
        $('#flashcardArea').html(`
            <div class="no-results fade-in">
                <i class="fas fa-search" style="font-size: 3rem; color: #d1d5db; margin-bottom: 20px;"></i>
                <p>No flashcards found matching your criteria.</p>
            </div>
        `);
        $('#prevBtn, #nextBtn').prop('disabled', true);
        $('#cardCounter').text('0 / 0');
        updateProgress();
        return;
    }

    const card = filteredCards[currentIndex];
    viewedCards.add(currentIndex);

    const categoryName = card.category.charAt(0).toUpperCase() + card.category.slice(1);
    const question = currentLanguage === 'english' ? card.questionEn : card.questionBn;
    const answer = currentLanguage === 'english' ? card.answerEn : card.answerBn;
    const answerLabel = currentLanguage === 'english' ? 'Answer' : 'উত্তর';
    
    $('#flashcardArea').html(`
        <div class="flashcard-container fade-in">
            <div class="flashcard">
                <span class="category-badge">${categoryName}</span>
                <div class="question">
                    <i class="fas fa-question-circle" style="color: var(--primary-color); margin-right: 10px;"></i>
                    ${question}
                </div>
                <div class="answer">
                    <div class="answer-label"><i class="fas fa-check-circle"></i> ${answerLabel}:</div>
                    ${answer}
                </div>
            </div>
        </div>
    `);

    $('#cardCounter').text(`${currentIndex + 1} / ${filteredCards.length}`);
    $('#prevBtn').prop('disabled', currentIndex === 0);
    $('#nextBtn').prop('disabled', currentIndex === filteredCards.length - 1);

    updateProgress();
}

function updateProgress() {
    const progress = filteredCards.length > 0 ? (viewedCards.size / filteredCards.length) * 100 : 0;
    $('#progressBar').css('width', progress + '%');
    $('#progressText').text(`${viewedCards.size} of ${filteredCards.length}`);
}

function filterCards(category) {
    if (category === 'all') {
        filteredCards = [...flashcardsData];
    } else {
        filteredCards = flashcardsData.filter(card => card.category === category);
    }
    currentIndex = 0;
    viewedCards.clear();
    renderFlashcard();
}

function searchCards(query) {
    const searchTerm = query.toLowerCase();
    if (searchTerm === '') {
        const activeCategory = $('.category-btn.active').data('category');
        filterCards(activeCategory);
    } else {
        const lang = currentLanguage;
        filteredCards = flashcardsData.filter(card => {
            const question = lang === 'english' ? card.questionEn : card.questionBn;
            const answer = lang === 'english' ? card.answerEn : card.answerBn;
            return question.toLowerCase().includes(searchTerm) || answer.toLowerCase().includes(searchTerm);
        });
        currentIndex = 0;
        viewedCards.clear();
        renderFlashcard();
    }
}

function shuffleCards() {
    for (let i = filteredCards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
    }
    currentIndex = 0;
    viewedCards.clear();
    renderFlashcard();
}

$(document).ready(function() {
    renderFlashcard();

    $('#nextBtn').click(function() {
        if (currentIndex < filteredCards.length - 1) {
            currentIndex++;
            renderFlashcard();
        }
    });

    $('#prevBtn').click(function() {
        if (currentIndex > 0) {
            currentIndex--;
            renderFlashcard();
        }
    });

    $('.language-btn').click(function() {
        $('.language-btn').removeClass('active');
        $(this).addClass('active');
        currentLanguage = $(this).data('lang');
        renderFlashcard();
    });

    $('.category-btn').click(function() {
        $('.category-btn').removeClass('active');
        $(this).addClass('active');
        const category = $(this).data('category');
        $('#searchInput').val('');
        filterCards(category);
    });

    $('#searchInput').on('input', function() {
        searchCards($(this).val());
    });

    $('#shuffleBtn').click(function() {
        shuffleCards();
    });

    $('#resetBtn').click(function() {
        viewedCards.clear();
        updateProgress();
    });

    $(document).keydown(function(e) {
        if (e.key === 'ArrowRight' && currentIndex < filteredCards.length - 1) {
            currentIndex++;
            renderFlashcard();
        } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
            currentIndex--;
            renderFlashcard();
        }
    });
});
        </script>
