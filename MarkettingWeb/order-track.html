<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ট্র্যাক | AppXen Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-shopping-basket text-success"></i> AppXen Mart
            </a>
            <a href="index.html" class="btn btn-outline-success rounded-pill px-4">হোমে ফিরে যান</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-lg rounded-4 p-4">
                    <div class="text-center mb-4">
                        <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                            <i class="fas fa-truck text-success fs-1"></i>
                        </div>
                        <h3 class="fw-bold">আপনার অর্ডার ট্র্যাক করুন</h3>
                        <p class="text-muted">অর্ডার আইডি এবং ইমেইল দিয়ে আপনার পণ্যের বর্তমান অবস্থা জানুন</p>
                    </div>
                    <form id="trackForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">অর্ডার আইডি (Order ID)</label>
                            <input type="text" class="form-control py-3" placeholder="উদাঃ ORD-12345" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">ইমেইল ঠিকানা</label>
                            <input type="email" class="form-control py-3" placeholder="আপনার ইমেইল দিন" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-pill">সার্চ করুন</button>
                    </form>
                    
                    <div id="trackResult" class="mt-5 d-none">
                        <hr>
                        <h5 class="fw-bold mb-4 text-center">অর্ডার স্ট্যাটাস: <span class="text-success">প্রসেসিং এ আছে</span></h5>
                        <div class="order-tracking">
                            <div class="d-flex justify-content-between mb-5 position-relative">
                                <div class="text-center" style="z-index: 1;">
                                    <div class="bg-success text-white rounded-circle p-2 mb-2" style="width: 40px; height: 40px;"><i class="fas fa-check"></i></div>
                                    <small class="fw-bold">অর্ডার কনফার্ম</small>
                                </div>
                                <div class="text-center" style="z-index: 1;">
                                    <div class="bg-success text-white rounded-circle p-2 mb-2" style="width: 40px; height: 40px;"><i class="fas fa-sync-alt fa-spin"></i></div>
                                    <small class="fw-bold">প্যাকিং</small>
                                </div>
                                <div class="text-center opacity-50" style="z-index: 1;">
                                    <div class="bg-secondary text-white rounded-circle p-2 mb-2" style="width: 40px; height: 40px;"><i class="fas fa-shipping-fast"></i></div>
                                    <small class="fw-bold">শিপিং</small>
                                </div>
                                <div class="text-center opacity-50" style="z-index: 1;">
                                    <div class="bg-secondary text-white rounded-circle p-2 mb-2" style="width: 40px; height: 40px;"><i class="fas fa-home"></i></div>
                                    <small class="fw-bold">ডেলিভারি</small>
                                </div>
                                <div class="position-absolute top-0 mt-3 start-0 w-100 bg-light" style="height: 2px; z-index: 0;">
                                    <div class="bg-success h-100" style="width: 40%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
        $('#trackForm').on('submit', function(e) {
            e.preventDefault();
            $('#trackResult').removeClass('d-none');
            $('html, body').animate({
                scrollTop: $("#trackResult").offset().top
            }, 500);
        });
    </script>
</body>
</html>
