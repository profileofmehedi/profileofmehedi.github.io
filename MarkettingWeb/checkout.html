<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট | AppXen Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="index.html">
                <i class="fas fa-shopping-basket text-success"></i> AppXen Mart
            </a>
            <span class="text-muted">সুরক্ষিত চেকআউট</span>
        </div>
    </nav>

    <div class="container pb-5">
        <form id="checkoutForm">
            <div class="row g-4">
                <!-- Shipping Info -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-header bg-white py-3">
                            <h5 class="fw-bold m-0"><i class="fas fa-map-marker-alt text-success me-2"></i> শিপিং ঠিকানা</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">পুরো নাম</label>
                                    <input type="text" class="form-control bg-light border-0" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">ফোন নম্বর</label>
                                    <input type="text" class="form-control bg-light border-0" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">ঠিকানা</label>
                                    <textarea class="form-control bg-light border-0" rows="2" placeholder="বাসা নং, রোড নং, এলাকা..." required></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">শহর</label>
                                    <select class="form-select bg-light border-0">
                                        <option>ঢাকা</option>
                                        <option>চট্টগ্রাম</option>
                                        <option>সিলেট</option>
                                        <option>অন্যান্য</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">এলাকা</label>
                                    <input type="text" class="form-control bg-light border-0">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white py-3">
                            <h5 class="fw-bold m-0"><i class="fas fa-wallet text-success me-2"></i> পেমেন্ট মেথড</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="form-check mb-3 border rounded p-3 cursor-pointer">
                                <input class="form-check-input" type="radio" name="payment" id="cod" checked>
                                <label class="form-check-label w-100 fw-bold" for="cod">
                                    ক্যাশ অন ডেলিভারি (COD)
                                    <small class="d-block text-muted fw-normal">পণ্য হাতে পেয়ে মূল্য পরিশোধ করুন</small>
                                </label>
                            </div>
                            <div class="form-check border rounded p-3 cursor-pointer">
                                <input class="form-check-input" type="radio" name="payment" id="bkash">
                                <label class="form-check-label w-100 fw-bold" for="bkash">
                                    মোবাইল ব্যাংকিং (বিকাশ/নগদ)
                                    <small class="d-block text-muted fw-normal">নিরাপদ ডিজিটাল পেমেন্ট</small>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white py-3">
                            <h5 class="fw-bold m-0">অর্ডার সারাংশ</h5>
                        </div>
                        <div class="card-body p-4">
                            <div id="checkout-items" class="mb-3" style="max-height: 200px; overflow-y: auto;">
                                <!-- Items injected via JS -->
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-2">
                                <span>সাব-টোটাল</span>
                                <span id="checkout-subtotal" class="fw-bold">৳0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>ডেলিভারি</span>
                                <span class="fw-bold">৳60</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-4">
                                <span class="fs-5 fw-bold">সর্বমোট</span>
                                <span id="checkout-total" class="fs-5 fw-bold text-success">৳0</span>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow">
                                অর্ডার কনফার্ম করুন
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        $(document).ready(function() {
            const cart = JSON.parse(localStorage.getItem('appxen_cart')) || [];
            const container = $('#checkout-items');
            let subtotal = 0;

            if(cart.length === 0) {
                window.location.href = 'index.html';
            }

            cart.forEach(item => {
                const total = item.price * item.quantity;
                subtotal += total;
                container.append(`
                    <div class="d-flex justify-content-between mb-2 small">
                        <span>${item.name} x ${item.quantity}</span>
                        <span class="fw-bold">৳${total}</span>
                    </div>
                `);
            });

            $('#checkout-subtotal').text('৳' + subtotal);
            $('#checkout-total').text('৳' + (subtotal + 60));

            $('#checkoutForm').on('submit', function(e) {
                e.preventDefault();
                Swal.fire({
                    title: 'অভিনন্দন!',
                    text: 'আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে। অর্ডার আইডি: #' + Math.floor(Math.random() * 100000),
                    icon: 'success',
                    confirmButtonColor: '#198754',
                    confirmButtonText: 'শপে ফিরে যান'
                }).then(() => {
                    localStorage.removeItem('appxen_cart');
                    window.location.href = 'index.html';
                });
            });
        });
    </script>
</body>
</html>
