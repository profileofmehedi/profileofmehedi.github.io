<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AppXen Mart</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .brand-logo {
            font-size: 2rem;
            color: #198754;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4">
        <div class="card-body text-center">
            <div class="brand-logo fw-bold">
                <i class="fas fa-shopping-basket"></i> AppXen Mart অ্যাডমিন
            </div>
            <h5 class="mb-4 text-muted">চালিয়ে যেতে সাইন ইন করুন</h5>
            
            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" value="admin@appxenmart.com" required>
                    <label for="email">ইমেইল ঠিকানা</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" value="admin123" required>
                    <label for="password">পাসওয়ার্ড</label>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">সাইন ইন</button>
                </div>
            </form>
            
            <div class="mt-4 text-muted small">
                <p>ডেমো ক্রিডেনশিয়াল:</p>
                <p>ইমেইল: admin@appxenmart.com</p>
                <p>পাসওয়ার্ড: admin123</p>
            </div>
            
            <div class="mt-3">
                 <a href="index.html" class="text-decoration-none text-success"><i class="fas fa-arrow-left"></i> শপে ফিরে যান</a>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
