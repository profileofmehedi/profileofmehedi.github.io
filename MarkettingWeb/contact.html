<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NaturoBD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">
                <i class="fas fa-leaf text-success"></i> নেচারোবিডি
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">শপ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">যোগাযোগ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center mb-5">
                <h2 class="section-title">যোগাযোগ করুন</h2>
                <p class="text-muted">আমাদের পণ্য সম্পর্কে আপনার কোন প্রশ্ন আছে? আমরা সাহায্য করতে এখানে আছি।</p>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">আপনার নাম</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ইমেইল ঠিকানা</label>
                                <input type="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">বিষয়</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">বার্তা</label>
                                <textarea class="form-control" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100 rounded-pill">বার্তা পাঠান</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 h-100 bg-light">
                    <div class="card-body p-4">
                        <h4 class="mb-4">যোগাযোগের তথ্য</h4>
                        <div class="d-flex align-items-start mb-3">
                            <i class="fas fa-map-marker-alt text-success mt-1 me-3 fs-5"></i>
                            <div>
                                <h6 class="fw-bold">ঠিকানা</h6>
                                <p class="mb-0 text-muted">বাড়ি ১২, রোড ৫, ধানমন্ডি,<br>ঢাকা, বাংলাদেশ</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-start mb-3">
                            <i class="fas fa-phone text-success mt-1 me-3 fs-5"></i>
                            <div>
                                <h6 class="fw-bold">ফোন</h6>
                                <p class="mb-0 text-muted">+৮৮০ ১,২৩৪,৫৬৭,৮৯০</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-start">
                            <i class="fas fa-envelope text-success mt-1 me-3 fs-5"></i>
                            <div>
                                <h6 class="fw-bold">ইমেইল</h6>
                                <p class="mb-0 text-muted">info@naturobd.com</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        $(document).ready(function() {
            $('#contactForm').on('submit', function(e) {
                e.preventDefault();
                Swal.fire({
                    title: 'Message Sent!',
                    text: 'We will get back to you shortly.',
                    icon: 'success',
                    confirmButtonColor: '#4CAF50'
                });
                this.reset();
            });
        });
    </script>
</body>
</html>
