<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Your Pharmacy - PharmaSuite Pro</title>
    <!-- Dependencies -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", "Hind Siliguri", sans-serif;
        background-color: #f0f4f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem 0;
      }
      .register-card {
        max-width: 650px;
        width: 100%;
        padding: 2.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border: none;
        border-radius: 15px;
      }
      .register-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .register-header h2 {
        font-weight: 700;
        color: #0d6efd;
      }
    </style>
  </head>
  <body>
    <div class="card register-card">
      <div class="register-header">
        <h2>Start Your Free Trial</h2>
        <p class="text-muted">
          Register your pharmacy and get started with PharmaSuite Pro today!
        </p>
      </div>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Pharmacy Name</label>
            <input type="text" class="form-control" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Owner's Full Name</label>
            <input type="text" class="form-control" required />
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Choose a Plan</label>
          <select class="form-select">
            <option>Basic Plan (Up to 500 products)</option>
            <option selected>Pro Plan (Unlimited products, Reporting)</option>
            <option>Enterprise Plan (Multiple Branches)</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label"
            >Choose a Password for Your Admin Account</label
          >
          <input type="password" class="form-control" required />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            Submit Registration
          </button>
        </div>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted"
          >Already registered? <a href="login.html">Log In</a></small
        >
      </div>
    </div>
  </body>
</html>
