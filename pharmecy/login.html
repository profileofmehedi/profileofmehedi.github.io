<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PharmaSuite Pro</title>
    <!-- Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; background-color: #f0f4f7; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { max-width: 450px; width: 100%; padding: 2.5rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); border: none; border-radius: 15px; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header img { width: 80px; margin-bottom: 1rem; }
        .login-header h2 { font-weight: 700; color: #0d6efd; }
        .btn-primary { background-color: #0d6efd; border-color: #0d6efd; padding: 0.75rem; font-weight: 600; }
        .footer-text { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #6c757d; }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <img src="https://i.ibb.co/6rZ4R0W/logo.png" alt="PharmaSuite Pro Logo">
            <h2>PharmaSuite Pro</h2>
            <p class="text-muted">The complete SaaS solution for your pharmacy.</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="userId" class="form-label">User ID</label>
                <input type="text" class="form-control" id="userId" placeholder="e.g., superadmin, bestpharma_admin" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" value="demopass" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <div class="footer-text">
            Want to run your pharmacy on our platform? <a href="saas_register.html">Sign Up Now</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                let userId = $('#userId').val().trim().toLowerCase();

                if (userId === 'superadmin') {
                    window.location.href = 'superadmin_dashboard.html';
                } else if (userId.includes('_admin')) {
                    window.location.href = 'admin_dashboard.html';
                } else if (userId) {
                    window.location.href = 'user_pos.html';
                }
            });
        });
    </script>
</body>
</html>
