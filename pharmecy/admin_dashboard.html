<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- (Copy <head> content from the previous admin_dashboard.html) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Best Pharmacy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", "Hind Siliguri", sans-serif;
        background-color: #f8f9fa;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        padding: 1rem;
        background-color: #212529;
        color: #f8f9fa;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 15px;
        padding-bottom: 1rem;
        border-bottom: 1px solid #495057;
        margin-bottom: 1rem;
      }
      .sidebar-header img {
        width: 40px;
      }
      .sidebar-nav .nav-link {
        color: #adb5bd;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 0.375rem;
        font-weight: 500;
      }
      .sidebar-nav .nav-link:hover,
      .sidebar-nav .nav-link.active {
        color: #ffffff;
        background-color: #495057;
      }
      .main-content {
        margin-left: 260px;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="https://i.ibb.co/6rZ4R0W/logo.png" alt="Logo" />
        <h5>Best Pharmacy</h5>
      </div>
      <ul class="nav flex-column sidebar-nav">
        <!-- (Same sidebar links as before: Dashboard, Inventory, Sales, Users, etc.) -->
        <li class="nav-item">
          <a class="nav-link active" href="admin_dashboard.html"
            ><i class="bi bi-grid-1x2-fill"></i> Dashboard</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin_inventory.html"
            ><i class="bi bi-box-seam-fill"></i> Inventory</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin_sales.html"
            ><i class="bi bi-cart-check-fill"></i> Sales</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin_users.html"
            ><i class="bi bi-person-badge-fill"></i> Staff Management</a
          >
        </li>
        <li class="nav-item mt-auto pt-3 border-top border-secondary">
          <a class="nav-link" href="login.html"
            ><i class="bi bi-box-arrow-left"></i> Logout</a
          >
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">My Dashboard</h2>
        <span>Welcome, <strong>Rahim Uddin (Admin)</strong></span>
      </div>
      <!-- (The rest of the dashboard content - stat cards, charts - is the same as the previous admin dashboard) -->
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- (Chart.js script is the same as before) -->
  </body>
</html>
