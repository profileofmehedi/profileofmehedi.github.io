<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory - Best Pharmacy</title>
    <!-- Dependencies -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", "Hind Siliguri", sans-serif;
        background-color: #f8f9fa;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        padding: 1rem;
        background-color: #212529;
        color: #f8f9fa;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 15px;
        padding-bottom: 1rem;
        border-bottom: 1px solid #495057;
        margin-bottom: 1rem;
      }
      .sidebar-header img {
        width: 40px;
      }
      .sidebar-nav .nav-link {
        color: #adb5bd;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 0.375rem;
        font-weight: 500;
      }
      .sidebar-nav .nav-link:hover,
      .sidebar-nav .nav-link.active {
        color: #ffffff;
        background-color: #495057;
      }
      .main-content {
        margin-left: 260px;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="https://i.ibb.co/6rZ4R0W/logo.png" alt="Logo" />
        <h5>Best Pharmacy</h5>
      </div>
      <ul class="nav flex-column sidebar-nav">
        <li class="nav-item">
          <a class="nav-link" href="admin_dashboard.html"
            ><i class="bi bi-grid-1x2-fill"></i> Dashboard</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="admin_inventory.html"
            ><i class="bi bi-box-seam-fill"></i> Inventory</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin_sales.html"
            ><i class="bi bi-cart-check-fill"></i> Sales</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin_users.html"
            ><i class="bi bi-person-badge-fill"></i> Staff Management</a
          >
        </li>
        <li class="nav-item mt-auto pt-3 border-top border-secondary">
          <a class="nav-link" href="login.html"
            ><i class="bi bi-box-arrow-left"></i> Logout</a
          >
        </li>
      </ul>
    </div>
    <!-- Main Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Inventory Management</h2>
        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#addProductModal"
        >
          <i class="bi bi-plus-circle-fill me-2"></i>Add Product
        </button>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>Name</th>
                  <th>Stock</th>
                  <th>Price (Sell)</th>
                  <th>Expiry Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Napa Extend</td>
                  <td><span class="badge bg-success">500 pcs</span></td>
                  <td>৳ 2.50</td>
                  <td>2027-12-31</td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-pencil-fill"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash-fill"></i>
                    </button>
                  </td>
                </tr>
                <tr>
                  <td>Seclo 20mg</td>
                  <td>
                    <span class="badge bg-warning text-dark">25 pcs</span>
                  </td>
                  <td>৳ 7.00</td>
                  <td>2026-05-31</td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-pencil-fill"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash-fill"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Product</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Product Name"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <input
                    type="number"
                    class="form-control"
                    placeholder="Stock Quantity"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <input
                    type="number"
                    class="form-control"
                    placeholder="Selling Price (৳)"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Expiry Date</label
                  ><input type="date" class="form-control" />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close</button
            ><button type="button" class="btn btn-primary">Save Product</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
