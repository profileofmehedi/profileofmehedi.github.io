<div class="page-header">
    <h3 class="page-title">Leave Management</h3>
    <button class="btn btn-primary me-2" onclick="Swal.fire('Info', 'Apply Leave form would open here', 'info')">
        <i class="fa-solid fa-plus"></i> Apply Leave
    </button>
    <button class="btn-instruction btn-show-instructions" 
            data-instruction="<p>Approve or Reject leave applications.</p>">
        <i class="fa-solid fa-circle-info"></i> Instructions
    </button>
</div>

                Casual Leave
                <div class="text-white-50 small">Available: 8 / 12</div>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-4">
        <div class="card bg-success text-white shadow">
            <div class="card-body">
                Medical Leave

        </div>
    </div>
</div>
