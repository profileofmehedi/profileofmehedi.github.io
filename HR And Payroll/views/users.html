<div class="page-header">
    <h3 class="page-title">User Management & Permissions</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
        <i class="fa-solid fa-user-plus"></i> New User
    </button>
    <button class="btn-instruction btn-show-instructions" 
            data-instruction="<p>Manage system access.</p><ul><li><b>Roles:</b> Admin, HR Manager, Employee.</li><li><b>Page Assign:</b> Control who sees what.</li></ul>">
        <i class="fa-solid fa-circle-info"></i> Instructions
    </button>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <table class="table table-bordered" id="dataTable">
            <thead class="table-light">
                <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Assigned Pages</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>admin@company.com</td>
                    <td><span class="badge bg-danger">Super Admin</span></td>
                    <td>All Access</td>
                    <td><span class="text-success">Active</span></td>
                    <td>
                        <button class="btn btn-sm btn-light border"><i class="fa-solid fa-gear"></i></button>
                    </td>
                </tr>
                 <tr>
                    <td>hr@company.com</td>
                    <td><span class="badge bg-primary">HR Manager</span></td>
                    <td>Employees, Payroll, Leave</td>
                    <td><span class="text-success">Active</span></td>
                    <td>
                        <button class="btn btn-sm btn-light border"><i class="fa-solid fa-gear"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create System User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select class="form-select">
                            <option>HR Manager</option>
                            <option>Accountant</option>
                            <option>Employee</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Page Assignments</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Employee Management</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Payroll</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">System Settings</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="Swal.fire('Created', 'User assigned successfully', 'success')">Create</button>
            </div>
        </div>
    </div>
</div>
