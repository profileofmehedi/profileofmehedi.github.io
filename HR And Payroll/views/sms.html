<div class="page-header">
    <h3 class="page-title">SMS Management</h3>
    <button class="btn-instruction btn-show-instructions" 
            data-instruction="<p>Send bulk SMS to employees.</p>">
        <i class="fa-solid fa-circle-info"></i> Instructions
    </button>
</div>

<div class="row">
    <div class="col-md-5">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Compose Message</h6>
            </div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Recipient Group</label>
                        <select class="form-select">
                            <option>All Employees</option>
                            <option>Engineering Dept</option>
                            <option>Managers Only</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="Enter notification here..."></textarea>
                        <div class="form-text">Max 160 characters.</div>
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="Swal.fire('Sent!', 'SMS broadcast initiated.', 'success')">
                        <i class="fa-solid fa-paper-plane"></i> Send Broadcast
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-7">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Recent Logs</h6>
            </div>
            <div class="card-body">
                <table class="table table-sm" id="dataTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Group</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>2025-10-18 10:00 AM</td>
                            <td>All Employees</td>
                            <td><span class="badge bg-success">Delivered (1250/1250)</span></td>
                        </tr>
                        <tr>
                            <td>2025-10-15 09:30 AM</td>
                            <td>Engineering</td>
                            <td><span class="badge bg-danger">Failed (Network)</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
