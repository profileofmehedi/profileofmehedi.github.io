<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">User Management</h3><button class="btn btn-primary" id="btnAddUser">New User</button></div>
        <div class="card shadow mb-4">
            <div class="card-body">
                <table class="table" id="tableUsers" width="100%">
                    <thead><tr><th>Email</th><th>Role</th><th>Last Login</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addUserModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">New System User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="new-user-email" class="form-control mb-2" placeholder="Email"><select id="new-user-role" class="form-select"><option>Super Admin</option><option>HR Manager</option><option>Accountant</option><option>Viewer</option></select></div><div class="modal-footer"><button class="btn btn-primary" id="btnSaveUser">Create User</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initUsers());</script>
</body>
</html>
