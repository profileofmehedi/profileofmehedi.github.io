<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex">
      <nav id="sidebar" class="sidebar bg-white border-end"></nav>
      <div class="flex-grow-1">
        <header id="topbar" class="topbar bg-light border-bottom"></header>
        <main class="main-content container py-4">
          <div
            class="page-header mb-4 d-flex justify-content-between align-items-center"
          >
            <h3 class="page-title">
              <i class="fa fa-users me-2"></i>User Management
            </h3>
            <button class="btn btn-primary" id="btnAddUser">
              <i class="fa fa-user-plus"></i> New User
            </button>
          </div>
          <div class="row mb-4">
            <div class="col-md-3 mb-2">
              <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-primary text-uppercase mb-1"
                      >
                        Total Users
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="userTotal"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-users fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-success text-uppercase mb-1"
                      >
                        Active
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="userActive"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-user-check fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-warning text-uppercase mb-1"
                      >
                        Pending
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="userPending"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-user-clock fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card border-left-danger shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-danger text-uppercase mb-1"
                      >
                        Inactive
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="userInactive"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-user-slash fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="card shadow mb-4">
            <div
              class="card-header bg-white d-flex flex-wrap gap-2 align-items-center"
            >
              <div class="input-group w-auto">
                <span class="input-group-text"
                  ><i class="fa fa-filter"></i
                ></span>
                <select id="filterRole" class="form-select form-select-sm">
                  <option value="">All Roles</option>
                  <option>Super Admin</option>
                  <option>HR Manager</option>
                  <option>Accountant</option>
                  <option>Viewer</option>
                </select>
              </div>
              <div class="input-group w-auto">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <input
                  type="text"
                  id="filterUser"
                  class="form-control form-control-sm"
                  placeholder="Email or Name"
                />
              </div>
              <button
                class="btn btn-outline-success btn-sm ms-auto"
                id="btnExportUsers"
              >
                <i class="fa fa-file-excel"></i> Export
              </button>
            </div>
            <div class="card-body">
              <table class="table" id="tableUsers" width="100%">
                <thead>
                  <tr>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Last Login</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="addUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">New System User</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input
              id="new-user-email"
              class="form-control mb-2"
              placeholder="Email"
            /><select id="new-user-role" class="form-select">
              <option>Super Admin</option>
              <option>HR Manager</option>
              <option>Accountant</option>
              <option>Viewer</option>
            </select>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" id="btnSaveUser">
              Create User
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(function () {
        if (typeof AppLayout !== "undefined") {
          $("#sidebar").html(AppLayout.render("users"));
          $("#topbar").html(`
                                <div class="container-fluid d-flex align-items-center justify-content-between">
                                        <div class="d-flex align-items-center gap-3">
                                                <button class="btn btn-link d-md-none" id="sidebarToggle"><i class="fa fa-bars"></i></button>
                                                <span class="fw-bold text-primary">User Management</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3">
                                                <span class="text-muted small">${localStorage.getItem("userName") || "Admin"}</span>
                                                <img src="assets/img/user.png" alt="User" class="rounded-circle" width="32" height="32">
                                        </div>
                                </div>
                        `);
        }
        AppController.initUsers && AppController.initUsers();
        // Summary cards
        const users = AppServices.getUsers ? AppServices.getUsers() : [];
        $("#userTotal").text(users.length);
        $("#userActive").text(
          users.filter((u) => u.status === "Active").length,
        );
        $("#userPending").text(
          users.filter((u) => u.status === "Pending").length,
        );
        $("#userInactive").text(
          users.filter((u) => u.status === "Inactive").length,
        );
        // Filter table
        $("#filterRole, #filterUser").on("input change", function () {
          const role = $("#filterRole").val();
          const user = $("#filterUser").val().toLowerCase();
          $("#tableUsers tbody tr").each(function () {
            const rowRole = $(this).find("td:eq(1)").text();
            const rowUser = $(this).find("td:eq(0)").text().toLowerCase();
            let show = true;
            if (role && rowRole !== role) show = false;
            if (user && !rowUser.includes(user)) show = false;
            $(this).toggle(show);
          });
        });
        // Export users
        $("#btnExportUsers").click(function () {
          let csv = "Email,Role,Last Login,Status\n";
          $("#tableUsers tbody tr").each(function () {
            let row = [];
            $(this)
              .find("td")
              .each(function () {
                row.push($(this).text());
              });
            csv += row.slice(0, 4).join(",") + "\n";
          });
          const blob = new Blob([csv], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "users.csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      });
    </script>
  </body>
</html>
