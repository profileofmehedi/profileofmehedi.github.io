<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Logs - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex">
      <nav id="sidebar" class="sidebar bg-white border-end"></nav>
      <div class="flex-grow-1">
        <header id="topbar" class="topbar bg-light border-bottom"></header>
        <main class="main-content container py-4">
          <div
            class="page-header mb-4 d-flex justify-content-between align-items-center"
          >
            <h3 class="page-title">
              <i class="fa fa-user-shield me-2"></i>User Access Logs
            </h3>
            <button
              class="btn btn-outline-primary"
              onclick="window.location = 'users.html'"
            >
              <i class="fa fa-users"></i> User List
            </button>
          </div>
          <div class="card shadow mb-4">
            <div
              class="card-header bg-white d-flex flex-wrap gap-2 align-items-center"
            >
              <div class="input-group w-auto">
                <span class="input-group-text"
                  ><i class="fa fa-filter"></i
                ></span>
                <select id="filterRole" class="form-select form-select-sm">
                  <option value="">All Roles</option>
                  <option>Super Admin</option>
                  <option>HR Manager</option>
                  <option>Accountant</option>
                  <option>Viewer</option>
                </select>
              </div>
              <div class="input-group w-auto">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <input
                  type="text"
                  id="filterUser"
                  class="form-control form-control-sm"
                  placeholder="User or IP"
                />
              </div>
              <button
                class="btn btn-outline-success btn-sm ms-auto"
                id="btnExportUsers"
              >
                <i class="fa fa-file-excel"></i> Export
              </button>
            </div>
            <div class="card-body">
              <table class="table" id="tableUsers">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Last Login</th>
                    <th>Status</th>
                    <th>IP Address</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(function () {
        if (typeof AppLayout !== "undefined") {
          $("#sidebar").html(AppLayout.render("users-report"));
          $("#topbar").html(`
                                <div class="container-fluid d-flex align-items-center justify-content-between">
                                        <div class="d-flex align-items-center gap-3">
                                                <button class="btn btn-link d-md-none" id="sidebarToggle"><i class="fa fa-bars"></i></button>
                                                <span class="fw-bold text-primary">User Access Logs</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3">
                                                <span class="text-muted small">${localStorage.getItem("userName") || "Admin"}</span>
                                                <img src="assets/img/user.png" alt="User" class="rounded-circle" width="32" height="32">
                                        </div>
                                </div>
                        `);
        }
        AppController.initUsersReport && AppController.initUsersReport();
        // Filter table
        $("#filterRole, #filterUser").on("input change", function () {
          const role = $("#filterRole").val();
          const user = $("#filterUser").val().toLowerCase();
          $("#tableUsers tbody tr").each(function () {
            const rowRole = $(this).find("td:eq(1)").text();
            const rowUser = $(this).find("td:eq(0)").text().toLowerCase();
            const rowIP = $(this).find("td:eq(4)").text().toLowerCase();
            let show = true;
            if (role && rowRole !== role) show = false;
            if (user && !(rowUser.includes(user) || rowIP.includes(user)))
              show = false;
            $(this).toggle(show);
          });
        });
        // Export users
        $("#btnExportUsers").click(function () {
          let csv = "User,Role,Last Login,Status,IP Address\n";
          $("#tableUsers tbody tr").each(function () {
            let row = [];
            $(this)
              .find("td")
              .each(function () {
                row.push($(this).text());
              });
            csv += row.join(",") + "\n";
          });
          const blob = new Blob([csv], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "user_access_logs.csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      });
    </script>
  </body>
</html>
