<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <h3 class="page-title">Employee Management</h3>
            <button class="btn btn-primary" id="btnOpenAddEmp"><i class="fa-solid fa-plus"></i> Add Employee</button>
        </div>
        <div class="card shadow mb-4">
            <div class="card-body">
                <table class="table table-bordered table-striped" id="tableEmployees" width="100%">
                    <thead class="table-dark"><tr><th>ID</th><th>Employee Profile</th><th>Role & Dept</th><th>Status</th><th>Location</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="addEmployeeModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Add Employee</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><ul class="nav nav-tabs mb-3"><li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab1">Personal</a></li><li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab2">Prof</a></li><li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab3">Finance</a></li></ul><form id="addEmployeeForm"><div class="tab-content"><div class="tab-pane active" id="tab1"><div class="row mb-2"><div class="col"><input id="add-fname" class="form-control" placeholder="First Name"></div><div class="col"><input id="add-lname" class="form-control" placeholder="Last Name"></div></div><div class="mb-2"><input id="add-email" class="form-control" placeholder="Email"></div></div><div class="tab-pane" id="tab2"><div class="row mb-2"><div class="col"><select id="add-dept" class="form-select"><option>Engineering</option><option>HR</option></select></div><div class="col"><input id="add-pos" class="form-control" placeholder="Position"></div></div><div class="row"><div class="col"><input id="add-salary" class="form-control" placeholder="Annual Salary"></div></div></div><div class="tab-pane" id="tab3"><div class="row"><div class="col"><input id="add-bank" class="form-control" placeholder="Bank"></div></div></div></div></form></div><div class="modal-footer"><button class="btn btn-primary" id="saveEmployeeBtn">Save</button></div></div></div></div>
    <div class="modal fade" id="structureModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Salary Structure</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><h6 id="struct-emp-name" class="mb-3"></h6><div id="struct-inputs"></div></div><div class="modal-footer"><button class="btn btn-primary" id="btnSaveStruct">Update</button></div></div></div></div>
    
    <!-- Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="profile-drawer" id="profileDrawer"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initEmployees());</script>
</body>
</html>
