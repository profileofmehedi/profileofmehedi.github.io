<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employees - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main-content">
      <div class="page-header">
        <h3 class="page-title">Employee Management</h3>
        <div>
          <a href="employee-add.html" class="btn btn-primary">
            <i class="fa-solid fa-user-plus"></i> Add New Employee
          </a>
          <button class="btn btn-outline-primary" id="btnRefreshTable">
            <i class="fa-solid fa-refresh"></i> Refresh
          </button>
          <button
            class="btn btn-outline-warning"
            id="btnResetData"
            title="Reset to demo data"
          >
            <i class="fa-solid fa-database"></i> Reset Data
          </button>
        </div>
      </div>
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <div class="row align-items-center">
            <div class="col-md-3">
              <input
                type="text"
                class="form-control"
                id="searchEmployee"
                placeholder="🔍 Search employees..."
              />
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterDept">
                <option value="">All Departments</option>
                <option>Engineering</option>
                <option>HR</option>
                <option>Finance</option>
                <option>Sales</option>
                <option>Marketing</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterStatus">
                <option value="">All Status</option>
                <option>Active</option>
                <option>On Leave</option>
                <option>Probation</option>
              </select>
            </div>
            <div class="col-md-3 text-end">
              <span class="badge bg-primary fs-6"
                >Total: <span id="totalEmployees">0</span></span
              >
            </div>
          </div>
        </div>
        <div class="card-body">
          <table
            class="table table-bordered table-striped"
            id="tableEmployees"
            width="100%"
          >
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Employee Profile</th>
                <th>Role & Dept</th>
                <th>Status</th>
                <th>Location</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Salary Structure Modal -->
    <div class="modal fade" id="structureModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Salary Structure</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <h6 id="struct-emp-name" class="mb-3"></h6>
            <div id="struct-inputs"></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" id="btnSaveStruct">Update</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="profile-drawer" id="profileDrawer"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(() => {
        AppController.initEmployees();

        // Refresh button
        $("#btnRefreshTable").click(() => {
          renderEmployees();
          $("#totalEmployees").text(AppServices.getEmployees().length);
          Swal.fire({
            title: "Refreshed!",
            text: "Employee list updated",
            icon: "success",
            timer: 1500,
            showConfirmButton: false,
          });
        });

        // Reset data button
        $("#btnResetData").click(() => {
          Swal.fire({
            title: "Reset Database?",
            text: "This will restore demo employees and clear any custom data",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#f39c12",
            cancelButtonColor: "#6c757d",
            confirmButtonText: "Yes, reset it!",
          }).then((result) => {
            if (result.isConfirmed) {
              // Clear localStorage to reset database
              localStorage.removeItem("hrAppDb");
              location.reload(); // Reload page to load fresh data
            }
          });
        });

        // Update total count
        const totalEmps = AppServices.getEmployees().length;
        $("#totalEmployees").text(totalEmps);

        // Show message if no employees
        if (totalEmps === 0) {
          Swal.fire({
            title: "No Employees Found",
            text: 'Click "Reset Data" to load demo employees',
            icon: "info",
            confirmButtonText: "Reset Now",
          }).then((result) => {
            if (result.isConfirmed) {
              localStorage.removeItem("hrAppDb");
              location.reload();
            }
          });
        }

        // Search functionality
        $("#searchEmployee").on("keyup", function () {
          $("#tableEmployees").DataTable().search(this.value).draw();
        });

        // Filter by department
        $("#filterDept").on("change", function () {
          $("#tableEmployees").DataTable().column(2).search(this.value).draw();
        });

        // Filter by status
        $("#filterStatus").on("change", function () {
          $("#tableEmployees").DataTable().column(3).search(this.value).draw();
        });
      });
    </script>
  </body>
</html>
