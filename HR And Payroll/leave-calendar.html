<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Calendar - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-content">
          <div
            class="page-header mb-4 d-flex justify-content-between align-items-center"
          >
            <h3 class="page-title">
              <i class="fas fa-calendar-alt me-2"></i>Leave Calendar
            </h3>
            <button
              class="btn btn-primary"
              onclick="window.location = 'leave.html'"
            >
              <i class="fas fa-list"></i> Manage Requests
            </button>
          </div>
          <div class="card mb-4">
            <div class="card-header bg-white">
              <b>All Leaves (Calendar View)</b>
            </div>
            <div class="card-body">
              <div id="leaveCalendar" style="min-height: 500px"></div>
            </div>
          </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(function () {
        if (window.FullCalendar) {
          const calendarEl = document.getElementById("leaveCalendar");
          const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            height: 500,
            events: AppServices.getLeaveCalendarEvents
              ? AppServices.getLeaveCalendarEvents()
              : [],
          });
          calendar.render();
        }
      });
    </script>
  </body>
</html>
