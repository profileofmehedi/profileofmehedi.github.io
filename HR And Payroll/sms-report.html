<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS Logs - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex">
      <nav id="sidebar" class="sidebar bg-white border-end"></nav>
      <div class="flex-grow-1">
        <header id="topbar" class="topbar bg-light border-bottom"></header>
        <main class="main-content container py-4">
          <div
            class="page-header mb-4 d-flex justify-content-between align-items-center"
          >
            <h3 class="page-title">
              <i class="fa fa-list me-2"></i>Delivery Logs & Analytics
            </h3>
            <button
              class="btn btn-outline-primary"
              onclick="window.location = 'sms.html'"
            >
              <i class="fa fa-paper-plane"></i> Compose SMS
            </button>
          </div>
          <!-- Summary Cards -->
          <div class="row mb-4">
            <div class="col-md-3 mb-2">
              <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-primary text-uppercase mb-1"
                      >
                        Total Sent
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="smsTotal"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-paper-plane fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-success text-uppercase mb-1"
                      >
                        Delivered
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="smsDelivered"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-check-circle fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-warning text-uppercase mb-1"
                      >
                        Pending
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="smsPending"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-hourglass-half fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="card border-left-danger shadow h-100 py-2">
                <div class="card-body">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div>
                      <div
                        class="text-xs font-weight-bold text-danger text-uppercase mb-1"
                      >
                        Failed
                      </div>
                      <div
                        class="h5 mb-0 font-weight-bold text-gray-800"
                        id="smsFailed"
                      >
                        0
                      </div>
                    </div>
                    <i class="fa fa-times-circle fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- Filters and Export -->
          <div class="card shadow mb-4">
            <div
              class="card-header bg-white d-flex flex-wrap gap-2 align-items-center"
            >
              <div class="input-group w-auto">
                <span class="input-group-text"
                  ><i class="fa fa-filter"></i
                ></span>
                <select id="filterStatus" class="form-select form-select-sm">
                  <option value="">All Status</option>
                  <option value="Delivered">Delivered</option>
                  <option value="Pending">Pending</option>
                  <option value="Failed">Failed</option>
                </select>
              </div>
              <div class="input-group w-auto">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <input
                  type="text"
                  id="filterGroup"
                  class="form-control form-control-sm"
                  placeholder="Group"
                />
              </div>
              <button
                class="btn btn-outline-success btn-sm ms-auto"
                id="btnExportSMS"
              >
                <i class="fa fa-file-excel"></i> Export
              </button>
            </div>
            <div class="card-body">
              <table class="table table-bordered align-middle" id="tableSMS">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Group</th>
                    <th>Message</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(function () {
        if (typeof AppLayout !== "undefined") {
          $("#sidebar").html(AppLayout.render("sms-report"));
          $("#topbar").html(`
                                <div class="container-fluid d-flex align-items-center justify-content-between">
                                        <div class="d-flex align-items-center gap-3">
                                                <button class="btn btn-link d-md-none" id="sidebarToggle"><i class="fa fa-bars"></i></button>
                                                <span class="fw-bold text-primary">Delivery Logs</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3">
                                                <span class="text-muted small">${localStorage.getItem("userName") || "Admin"}</span>
                                                <img src="assets/img/user.png" alt="User" class="rounded-circle" width="32" height="32">
                                        </div>
                                </div>
                        `);
        }
        AppController.initSMSReport && AppController.initSMSReport();
        // Summary cards
        const logs = AppServices.getSMSLogs ? AppServices.getSMSLogs() : [];
        $("#smsTotal").text(logs.length);
        $("#smsDelivered").text(
          logs.filter((l) => l.status === "Delivered").length,
        );
        $("#smsPending").text(
          logs.filter((l) => l.status === "Pending").length,
        );
        $("#smsFailed").text(logs.filter((l) => l.status === "Failed").length);
        // Filter table
        $("#filterStatus, #filterGroup").on("input change", function () {
          const status = $("#filterStatus").val();
          const group = $("#filterGroup").val().toLowerCase();
          $("#tableSMS tbody tr").each(function () {
            const rowStatus = $(this).find("td:eq(3)").text();
            const rowGroup = $(this).find("td:eq(1)").text().toLowerCase();
            let show = true;
            if (status && rowStatus !== status) show = false;
            if (group && !rowGroup.includes(group)) show = false;
            $(this).toggle(show);
          });
        });
        // Export logs
        $("#btnExportSMS").click(function () {
          let csv = "Date,Group,Message,Status\n";
          $("#tableSMS tbody tr").each(function () {
            let row = [];
            $(this)
              .find("td")
              .each(function () {
                row.push($(this).text());
              });
            csv += row.join(",") + "\n";
          });
          const blob = new Blob([csv], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "sms_logs.csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      });
    </script>
  </body>
</html>
