<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communication Logs - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main-content">
      <div class="page-header mb-4 d-flex justify-content-between align-items-center">
        <h3 class="page-title">
          <i class="fas fa-history me-2"></i>Communication Logs
        </h3>
        <button class="btn btn-primary" onclick="window.location='sms.html'">
            <i class="fas fa-pen me-1"></i> Compose New
        </button>
      </div>

      <div class="card shadow mb-4">
          <div class="card-header bg-white py-3">
              <div class="row g-2 align-items-center">
                  <div class="col-md-2">
                      <select class="form-select form-select-sm" id="filterChannel">
                          <option value="">All Channels</option>
                          <option value="SMS">SMS</option>
                          <option value="Email">Email</option>
                          <option value="Notification">Notification</option>
                      </select>
                  </div>
                  <div class="col-md-2">
                      <select class="form-select form-select-sm" id="filterStatus">
                          <option value="">All Status</option>
                          <option value="Sent">Sent</option>
                          <option value="Scheduled">Scheduled</option>
                          <option value="Failed">Failed</option>
                      </select>
                  </div>
                  <div class="col-md-3">
                      <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="Search message/recipient...">
                  </div>
                  <div class="col-md-5 text-end">
                      <button class="btn btn-sm btn-outline-success" id="btnExport"><i class="fas fa-file-excel me-1"></i> Export CSV</button>
                  </div>
              </div>
          </div>
          <div class="card-body">
              <table class="table table-hover table-bordered" id="tableLogs" width="100%">
                  <thead class="table-light">
                      <tr>
                          <th>Date/Time</th>
                          <th>Channel</th>
                          <th>Target</th>
                          <th>Subject/Preview</th>
                          <th>Status</th>
                          <th>Action</th>
                      </tr>
                  </thead>
                  <tbody></tbody>
              </table>
          </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(() => AppController.initCommunicationReport());
    </script>
  </body>
</html>
