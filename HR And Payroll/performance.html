<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Reviews - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">Performance Appraisals</h3><button class="btn btn-primary" id="btnNewReview">Start Review</button></div>
        <div class="card shadow"><div class="card-body"><table class="table table-bordered" id="tableReviews"><thead><tr><th>Employee</th><th>Period</th><th>Rating</th><th>Reviewer</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>
    </div>
    
    <div class="modal fade" id="reviewModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">New Review</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="review-emp" class="form-control mb-2" placeholder="Employee ID"><select id="review-period" class="form-select mb-2"><option>Q3 2025</option><option>Q4 2025</option></select><input id="review-rating" type="number" max="5" class="form-control mb-2" placeholder="Rating (1-5)"><textarea id="review-comment" class="form-control" placeholder="Comments"></textarea></div><div class="modal-footer"><button class="btn btn-primary" id="btnSaveReview">Submit</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initPerformance());</script>
</body>
</html>
