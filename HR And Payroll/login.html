<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HR & Payroll Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 900px; width: 100%; overflow: hidden; }
        .login-sidebar { background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%); color: white; display: flex; flex-direction: column; justify-content: center; padding: 40px; text-align: center; }
        .login-form-section { padding: 50px; background: white; }
        .brand-logo { font-size: 3rem; margin-bottom: 20px; }
        .btn-flow { position: fixed; bottom: 20px; right: 20px; z-index: 1000; border-radius: 50px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card login-card row flex-row mx-auto">
        <div class="col-md-5 login-sidebar d-none d-md-flex">
            <div class="brand-logo"><i class="fa-solid fa-users-gear"></i></div>
            <h3>HR & Payroll Pro</h3>
            <p class="mt-3">Enterprise Workforce Management Solution</p>
            <div class="mt-4"><small>© 2026 TechCorp Inc.</small></div>
        </div>

        <div class="col-md-7 login-form-section">
            <div id="loginForm">
                <h2 class="fw-bold mb-2">Welcome Back</h2>
                <p class="text-muted mb-4">Sign in to your account</p>
                <form id="actualLoginForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" value="admin@company.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" value="123456" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                    <div class="text-center">
                        <small class="text-muted">Demo: <b>admin@company.com</b> (Admin) or <b>employee@company.com</b> (Staff)</small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- User Flow Button -->
<button class="btn btn-dark btn-flow shadow" data-bs-toggle="modal" data-bs-target="#flowModal">
    <i class="fa-solid fa-diagram-project me-2"></i> User Flow
</button>

<!-- Flow Modal -->
<div class="modal fade" id="flowModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">System User Flow</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0 position-relative overflow-hidden" style="height: 75vh; cursor: grab; background: #f8f9fa;" id="flowContainer">
                <!-- Floating Toolbar -->
                <div class="position-absolute bottom-0 end-0 m-3 btn-group-vertical shadow" style="z-index: 1050;">
                    <button class="btn btn-light border" id="zoomIn" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
                    <button class="btn btn-light border" id="zoomOut" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
                    <button class="btn btn-light border" id="resetView" title="Reset View"><i class="fa-solid fa-compress"></i></button>
                    <button class="btn btn-primary" id="savePng" title="Download PNG"><i class="fa-solid fa-download"></i></button>
                </div>
                
                <div class="mermaid h-100 w-100 d-flex align-items-center justify-content-center" id="userFlowDiagram" style="transform-origin: center center; transition: transform 0.1s ease-out;">
                    <!-- Graph injected by JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
<script>
    $(document).ready(function() {
        mermaid.initialize({ startOnLoad: false });

        $('#actualLoginForm').submit(function(e) {
            e.preventDefault();
            const email = $('#email').val();
            const pass = $('#password').val();

            if(email && pass) {
                Swal.fire({
                    title: 'Authenticating...',
                    html: 'Checking credentials...',
                    timer: 1000,
                    timerProgressBar: true,
                    didOpen: () => { Swal.showLoading(); },
                }).then((result) => {
                    if (email.includes('employee')) {
                        localStorage.setItem('userRole', 'Employee');
                        localStorage.setItem('empId', 'EMP001');
                        localStorage.setItem('userName', 'Tiger Nixon');
                        window.location.href = 'emp-dashboard.html';
                    } else {
                        localStorage.setItem('userRole', 'Admin');
                        localStorage.setItem('userName', 'Admin User');
                        window.location.href = 'dashboard.html';
                    }
                });
            }
        });
        
        
        // Zoom & Pan Logic
        let currentZoom = 1;
        let panning = false;
        let pointX = 0, pointY = 0;
        let startX = 0, startY = 0;

        function updateTransform() {
            $('#userFlowDiagram').css('transform', `translate(${pointX}px, ${pointY}px) scale(${currentZoom})`);
        }

        $('#zoomIn').click(function() {
            currentZoom += 0.1;
            updateTransform();
        });
        
        $('#zoomOut').click(function() {
            if(currentZoom > 0.2) {
                currentZoom -= 0.1;
                updateTransform();
            }
        });

        $('#resetView').click(function() {
            currentZoom = 1; pointX = 0; pointY = 0;
            updateTransform();
        });

        // Save as PNG Logic
        $('#savePng').click(function() {
            const svgElement = document.querySelector("#userFlowDiagram svg");
            if (!svgElement) return;

            // 1. Serialize SVG to String
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgElement);
            
            // 2. Create Canvas
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const img = new Image();
            
            // 3. Set Dimensions (High Res)
            const svgSize = svgElement.getBoundingClientRect();
            canvas.width = svgSize.width * 2; // 2x Scale for quality
            canvas.height = svgSize.height * 2;
            
            // 4. Load Image and Download
            img.onload = function() {
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(2, 2);
                ctx.drawImage(img, 0, 0);
                
                const link = document.createElement('a');
                link.download = 'user-flow-diagram.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
        });

        const container = document.getElementById('flowContainer');
        
        container.addEventListener('mousedown', function(e) {
            // Only pan if clicking background, not buttons
            if(e.target.closest('button')) return;
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            panning = true;
            container.style.cursor = 'grabbing';
        });

        container.addEventListener('mouseup', function(e) {
            panning = false;
            container.style.cursor = 'grab';
        });

        container.addEventListener('mousemove', function(e) {
            e.preventDefault();
            if (!panning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateTransform();
        });

        // Dynamic Graph Injection
        $('#flowModal').on('shown.bs.modal', function () {
            currentZoom = 1; pointX = 0; pointY = 0; // Reset
            updateTransform();
            const graphDefinition = `graph TD
    %% Entry Point
    Start(("User Login")) --> Creds[Enter Credentials]
    Creds --> Auth{Valid?}
    Auth -->|No| Error[Show Error Alert]
    Auth -->|Yes| Role{Check Role}

    %% Admin Workflow
    Role -->|Admin| AdminDash[Admin Dashboard]
    
    subgraph Core_HR [Core HR Management]
        AdminDash --> EmpMod[Employees Module]
        EmpMod --> Onboard[Onboard New Hire]
        EmpMod --> Profiles[View/Edit Profiles]
        Onboard --> DB_Emp[(Database: Users)]
    end

    subgraph Finance [Payroll & Compensation]
        AdminDash --> PayMod[Payroll Module]
        PayMod --> Config[Setup Salary Structure]
        PayMod --> Calc[Process Monthly Payroll]
        Calc --> Slips[Generate Payslip PDFs]
        Slips --> DB_Fin[(Database: Finance)]
    end

    subgraph Operations [Daily Operations]
        AdminDash --> AttMod[Attendance Logs]
        AdminDash --> LeaveAdmin[Leave Management]
        
        LeaveAdmin --> Decision{Approve Request?}
        Decision -->|Yes| UpdateBal[Update Leave Balance]
        Decision -->|No| Notify[Notify Rejection]
        UpdateBal --> DB_Ops[(Database: Logs)]
    end

    subgraph Talent [Talent & Security]
        AdminDash --> RecMod[Recruitment ATS]
        AdminDash --> Audit[Audit & Security]
        RecMod --> Post[Post Jobs]
        Audit --> Logs[View System Access Logs]
    end

    %% Employee Workflow
    Role -->|Employee| EmpDash[Employee Portal]
    
    subgraph Self_Service [Employee Self-Service]
        EmpDash --> MyAtt[View My Attendance]
        EmpDash --> MyPay[Download Payslips]
        EmpDash --> ApplyLeave[Apply for Leave]
        
        ApplyLeave -->|Submit Request| LeaveAdmin
    end
    
    %% Styling
    classDef adminNode fill:#e3f2fd,stroke:#0d6efd,stroke-width:2px;
    classDef empNode fill:#f3e5f5,stroke:#ff9800,stroke-width:2px;
    classDef dbNode fill:#eee,stroke:#333,stroke-width:1px,stroke-dasharray: 5 5;
    
    class AdminDash,EmpMod,PayMod,AttMod,LeaveAdmin,RecMod,Audit adminNode;
    class EmpDash,MyAtt,MyPay,ApplyLeave empNode;
    class DB_Emp,DB_Fin,DB_Ops dbNode;`;
            
            const element = document.querySelector("#userFlowDiagram");
            element.innerHTML = graphDefinition;
            element.removeAttribute('data-processed'); 
            
            mermaid.run({
                nodes: [element]
            });
        });
    });
</script>
</body>
</html>
