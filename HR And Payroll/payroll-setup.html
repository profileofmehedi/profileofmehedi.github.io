<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Setup - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">Salary Component Configuration</h3><button class="btn btn-primary" id="btnAddHead">Add New Component</button></div>
        <div class="card shadow">
            <div class="card-body">
                <table class="table table-bordered" id="tableHeads">
                    <thead class="table-light"><tr><th>Component Name</th><th>Type</th><th>Calculation Mode</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="addHeadModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Add Component</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="head-name" class="form-control mb-2" placeholder="Name"><select id="head-type" class="form-select"><option>Earning</option><option>Deduction</option></select></div><div class="modal-footer"><button class="btn btn-primary" id="btnSaveHead">Save</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initPayrollSetup());</script>
</body>
</html>
