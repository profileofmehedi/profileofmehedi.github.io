<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Application - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main-content">
      <div class="page-header">
        <h3 class="page-title">
          <i class="fas fa-edit me-2"></i>Leave Application
        </h3>
        <button class="btn btn-outline-secondary" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Back
        </button>
      </div>

      <div class="row justify-content-center">
          <div class="col-md-8">
              <div class="card shadow">
                  <div class="card-header bg-white py-3">
                      <h6 class="m-0 font-weight-bold text-primary">New Leave Request</h6>
                  </div>
                  <div class="card-body">
                      <form id="leaveApplicationForm">
                          <!-- Employee Select (Visible only to Admin/Manager usually, but let's include it for flexibility) -->
                          <div class="mb-3">
                              <label class="form-label">Employee <span class="text-danger">*</span></label>
                              <select class="form-select" id="applyEmpId">
                                  <option value="">Select Employee</option>
                              </select>
                          </div>

                          <div class="row mb-3">
                              <div class="col-md-6">
                                  <label class="form-label">Leave Type <span class="text-danger">*</span></label>
                                  <select class="form-select" id="applyLeaveType">
                                      <option value="Casual">Casual Leave</option>
                                      <option value="Medical">Medical Leave</option>
                                      <option value="Earned">Earned Leave</option>
                                      <option value="Maternity">Maternity Leave</option>
                                      <option value="LWP">Leave Without Pay</option>
                                  </select>
                              </div>
                              <div class="col-md-6">
                                  <label class="form-label">Leave Balance (Current Year)</label>
                                  <input type="text" class="form-control bg-light" id="applyBalance" readonly value="-">
                              </div>
                          </div>

                          <div class="row mb-3">
                              <div class="col-md-6">
                                  <label class="form-label">From Date <span class="text-danger">*</span></label>
                                  <input type="date" class="form-control" id="applyFromDate">
                              </div>
                              <div class="col-md-6">
                                  <label class="form-label">To Date <span class="text-danger">*</span></label>
                                  <input type="date" class="form-control" id="applyToDate">
                              </div>
                          </div>

                          <div class="mb-3">
                              <label class="form-label">Total Days</label>
                              <input type="text" class="form-control bg-light" id="applyTotalDays" readonly value="0">
                          </div>

                          <div class="mb-3">
                              <label class="form-label">Reason <span class="text-danger">*</span></label>
                              <textarea class="form-control" id="applyReason" rows="3" placeholder="Enter detailed reason..."></textarea>
                          </div>

                          <div class="mb-3">
                              <label class="form-label">Attachment (Optional)</label>
                              <input type="file" class="form-control" id="applyAttachment">
                              <small class="text-muted">Medical certificate or other supporting docs.</small>
                          </div>

                          <div class="d-flex justify-content-end gap-2">
                              <button type="reset" class="btn btn-secondary">Reset</button>
                              <button type="button" class="btn btn-primary" id="btnSubmitApplication">
                                  <i class="fas fa-paper-plane me-1"></i> Submit Application
                              </button>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(() => AppController.initLeaveApplication());
    </script>
  </body>
</html>
