<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Lock View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; padding: 20px; }
        .page-title { color: #007bff; font-weight: bold; margin-bottom: 30px; }
        .lock-container { border: 2px solid black; padding: 30px; max-width: 900px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; }
        .form-group label { width: 200px; font-weight: 500; font-size: 16px; }
        .form-control, .form-select { border: 1px solid #666; }
        .btn-lock { background-color: #dc3545; color: white; width: 150px; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h4 class="page-title">Salary Lock View</h4>

    <div class="lock-container">
        <div class="form-group">
            <label>Salary Period</label>
            <select class="form-select">
                <option>Salary-November-2025</option>
            </select>
        </div>
        <div class="form-group">
            <label>Lock Level</label>
            <select class="form-select">
                <option>Lock</option>
                <option>Unlock</option>
            </select>
        </div>
        <div class="form-group">
            <label>Payment Date</label>
            <input type="date" class="form-control">
        </div>
        
        <div class="clearfix">
            <button class="btn btn-lock">Lock</button>
        </div>
    </div>
</div>

</body>
</html>
