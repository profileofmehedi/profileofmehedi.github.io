<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees Salary Process</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; font-size: 14px; }
        .page-title { margin: 20px 0; font-weight: 500; font-size: 18px; }
        .form-label { font-weight: 500; text-align: right; margin-top: 8px;}
        .required { color: red; }
        .btn-check-rent { background-color: #28a745; color: white; border: none; font-size: 12px;}
        .period-info-box { border: 1px solid #ddd; padding: 15px; border-radius: 4px; margin-top: 20px; }
        .period-header { color: #007bff; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .table-header { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h5 class="page-title">Employees Salary Process</h5>
    <hr>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form>
                <div class="row mb-2">
                    <label class="col-md-3 form-label">Salary Period <span class="required">*</span></label>
                    <div class="col-md-6">
                        <select class="form-select form-select-sm">
                            <option>Salary-December-2025</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="button" class="btn btn-sm btn-check-rent">Check Partial House Rent</button>
                    </div>
                </div>

                <div class="row mb-2">
                    <label class="col-md-3 form-label">Employee Name</label>
                    <div class="col-md-6">
                        <input type="text" class="form-control form-control-sm">
                    </div>
                </div>

                <div class="row mb-2">
                    <label class="col-md-3 form-label">Branch Name <span class="required">*</span></label>
                    <div class="col-md-6">
                        <select class="form-select form-select-sm">
                            <option>Ashulia Branch</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-2">
                    <label class="col-md-3 form-label">Zone Name <span class="required">*</span></label>
                    <div class="col-md-6">
                        <select class="form-select form-select-sm">
                            <option>Choose Zone</option>
                        </select>
                    </div>
                </div>
            </form>

            <div class="period-info-box bg-light">
                <div class="period-header">Salary Period Info</div>
                <table class="table table-bordered table-sm bg-white">
                    <thead class="table-header">
                        <tr>
                            <th>SL#</th>
                            <th>Period Name</th>
                            <th>Year</th>
                            <th>Month Name</th>
                            <th>Tax Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Salary-December-2025</td>
                            <td>2025</td>
                            <td>December</td>
                            <td>2025-2026</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <select class="form-select form-select-sm w-25">
                    <option>Please Select Report</option>
                </select>
                <div>
                    <button class="btn btn-sm btn-light border">Preview</button>
                    <button class="btn btn-sm btn-success">Process</button>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
