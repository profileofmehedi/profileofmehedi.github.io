<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Head</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
         body { background-color: #f4f6f9; font-size: 14px; }
         .page-title { color: #007bff; margin-bottom: 20px; font-weight: bold; }
         .btn-grid { float: right; }
         .form-container { background: white; padding: 20px; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
         .table-header { background-color: #f8f9fa; }
         .btn-action { margin: 0 2px; }
         .btn-excel { background-color: #17a2b8; color: white; border: none; }
         .btn-csv { background-color: #28a745; color: white; border: none; }
         .btn-print { background-color: #007bff; color: white; border: none; }
    </style>
</head>
<body>

<div class="container-fluid mt-3">
    <div class="d-flex justify-content-between">
        <h5 class="page-title">Salary Head</h5>
        <div>
             <button class="btn btn-sm btn-outline-success"><i class="fas fa-th"></i></button>
             <button class="btn btn-sm btn-info text-white"><i class="fas fa-angles-left"></i></button>
        </div>
    </div>

    <!-- Form Section -->
    <div class="form-container">
        <form>
            <div class="row mb-2">
                <div class="col-md-6">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">Head Name <span class="text-danger">*</span></label>
                        <div class="col-sm-8"><input type="text" class="form-control form-control-sm"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">Sort Order</label>
                        <div class="col-sm-8"><input type="number" class="form-control form-control-sm"></div>
                    </div>
                </div>
            </div>

            <div class="row mb-2">
                 <div class="col-md-6">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">Head Code</label>
                        <div class="col-sm-8"><input type="text" class="form-control form-control-sm"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">Is Income Tax? <span class="text-danger">*</span></label>
                        <div class="col-sm-8"><select class="form-select form-select-sm"><option>Select</option></select></div>
                    </div>
                </div>
            </div>

            <!-- Repeated Rows for other selects (truncated for brevity but structure remains) -->
            <div class="row mb-2">
                <div class="col-md-6">
                   <div class="row">
                       <label class="col-sm-4 col-form-label">Head Type <span class="text-danger">*</span></label>
                       <div class="col-sm-8"><select class="form-select form-select-sm"><option>Select</option></select></div>
                   </div>
               </div>
               <div class="col-md-6">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">Is Investments? <span class="text-danger">*</span></label>
                        <div class="col-sm-8"><select class="form-select form-select-sm"><option>Select</option></select></div>
                    </div>
                </div>
            </div>

            <div class="text-end mt-3">
                <button class="btn btn-success"><i class="fas fa-save"></i> Save</button>
            </div>
        </form>
    </div>

    <!-- Table List Section -->
    <h6 class="text-primary mb-3">Salary Head List</h6>
    
    <div class="d-flex justify-content-between mb-2">
        <div>
            <label>Show <select class="form-select d-inline-block w-auto form-select-sm"><option>10</option></select> entries</label>
        </div>
        <div>
            <button class="btn btn-sm btn-excel">Excel</button>
            <button class="btn btn-sm btn-csv">CSV</button>
            <button class="btn btn-sm btn-print">Print</button>
        </div>
        <div>
            <label>Search: <input type="search" class="form-control d-inline-block w-auto form-control-sm"></label>
        </div>
    </div>

    <table class="table table-bordered table-striped table-hover bg-white">
        <thead class="table-header">
            <tr>
                <th>Head Name</th>
                <th>Head Code</th>
                <th>Head Type</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arrear Adjustment(D)</td>
                <td>1000</td>
                <td>Deduction</td>
                <td>
                    <button class="btn btn-success btn-sm btn-action"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm btn-action"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
            <tr>
                <td>ArrearAddition</td>
                <td>1000</td>
                <td>Addition</td>
                <td>
                    <button class="btn btn-success btn-sm btn-action"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm btn-action"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
             <tr>
                <td>Basic</td>
                <td>1000</td>
                <td>Addition</td>
                <td>
                    <button class="btn btn-success btn-sm btn-action"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm btn-action"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
