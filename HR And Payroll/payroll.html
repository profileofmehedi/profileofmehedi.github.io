<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <h3 class="page-title">Payroll & Salary Structure</h3>
            <button class="btn btn-instruction btn-show-instructions" 
                    data-instruction="<p><b>Configuration:</b> Define salary heads (Basic, HRA, etc.).<br><b>Processing:</b> Select a month and click 'Run Calculation'.</p>">
                <i class="fa-solid fa-circle-info"></i> Help
            </button>
        </div>

        <ul class="nav nav-tabs mb-4" id="payrollTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-process">Processing</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-config">Configuration</a></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-process">
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center bg-white">
                        <div class="d-flex align-items-center gap-3">
                            <select class="form-select" id="payrollPeriodSelect" style="width: 200px;"></select>
                            <button class="btn btn-success" id="btnRunPayroll"><i class="fa-solid fa-calculator"></i> Run Calculation</button>
                        </div>
                        <button class="btn btn-secondary btn-sm" id="btnNewPeriod"><i class="fa-solid fa-plus"></i> New Month</button>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered" id="tablePayroll" width="100%">
                            <thead class="table-light"><tr><th>Employee</th><th>Dept</th><th>Earnings</th><th>Deductions</th><th>Net Pay</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-config">
                <div class="row"><div class="col-md-6"><div class="card shadow mb-4"><div class="card-header bg-white d-flex justify-content-between"><h6>Salary Heads</h6><button class="btn btn-sm btn-primary" id="btnAddHead">Add Head</button></div><div class="card-body"><table class="table table-sm" id="tableHeads"><thead><tr><th>Name</th><th>Type</th><th>Mode</th></tr></thead><tbody></tbody></table></div></div></div></div>
            </div>
        </div>
    </div>

    <!-- Add Head Modal -->
    <div class="modal fade" id="addHeadModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Add Head</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="head-name" class="form-control mb-2" placeholder="Name"><select id="head-type" class="form-select"><option>Earning</option><option>Deduction</option></select></div><div class="modal-footer"><button class="btn btn-primary" id="btnSaveHead">Save</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initPayroll());</script>
</body>
</html>
