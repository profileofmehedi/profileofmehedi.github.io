<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Manager - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">SMS Management</h3></div>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow p-4 mb-4">
                    <h5>Compose Message</h5>
                    <hr>
                    <label class="form-label">Recipient Group</label>
                    <select class="form-select mb-3" id="smsGroup"><option>All Employees</option><option>Engineering</option><option>Managers</option></select>
                    <label class="form-label">Message</label>
                    <textarea class="form-control mb-3" rows="4" id="smsMsg" placeholder="Enter SMS text..."></textarea>
                    <button class="btn btn-primary w-100" id="btnSendSMS"><i class="fa-solid fa-paper-plane me-2"></i> Send Broadcast</button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow mb-4">
                    <div class="card-header bg-white">Recent Delivery Logs</div>
                    <div class="card-body">
                        <table class="table table-sm" id="tableSMS">
                            <thead><tr><th>Date</th><th>Group</th><th>Message</th><th>Status</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initSMS());</script>
</body>
</html>
