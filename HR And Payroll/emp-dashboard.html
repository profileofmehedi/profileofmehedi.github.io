<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">Welcome, <span id="welcomeName">Employee</span></h3></div>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow border-0 border-start border-4 border-primary h-100">
                    <div class="card-body">
                        <h6 class="text-primary text-uppercase">Attendance (This Month)</h6>
                        <h3>22 Days</h3>
                        <small class="text-success">100% On Time</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow border-0 border-start border-4 border-warning h-100">
                    <div class="card-body">
                        <h6 class="text-warning text-uppercase">Leave Balance</h6>
                        <h3>12 Days</h3>
                        <small>Remaining</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow border-0 border-start border-4 border-success h-100">
                    <div class="card-body">
                        <h6 class="text-success text-uppercase">Next Payday</h6>
                        <h3>Nov 01</h3>
                        <small>In 6 Days</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-white">My Recent Activity</div>
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Check-in at 09:00 AM today</li>
                    <li class="list-group-item">Check-out at 06:00 PM yesterday</li>
                    <li class="list-group-item">Leave Request Approved (Nov 15)</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(() => {
            $('#welcomeName').text(localStorage.getItem('userName'));
        });
    </script>
</body>
</html>
