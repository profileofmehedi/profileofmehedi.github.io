<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Report - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex">
      <nav id="sidebar" class="sidebar bg-white border-end"></nav>
      <div class="flex-grow-1">
        <header id="topbar" class="topbar bg-light border-bottom"></header>
        <main class="main-content container py-4">
          <div
            class="page-header mb-4 d-flex justify-content-between align-items-center"
          >
            <h3 class="page-title">
              <i class="fa fa-file-shield me-2"></i>Security Report
            </h3>
            <button
              class="btn btn-outline-primary"
              onclick="window.location = 'audit.html'"
            >
              <i class="fa fa-shield-halved"></i> Activity Log
            </button>
          </div>
          <div class="card shadow mb-4">
            <div
              class="card-header bg-white d-flex flex-wrap gap-2 align-items-center"
            >
              <div class="input-group w-auto">
                <span class="input-group-text"
                  ><i class="fa fa-filter"></i
                ></span>
                <input
                  type="text"
                  id="filterAudit"
                  class="form-control form-control-sm"
                  placeholder="User, Action, or IP"
                />
              </div>
              <button
                class="btn btn-outline-success btn-sm ms-auto"
                id="btnExportAudit"
              >
                <i class="fa fa-file-excel"></i> Export
              </button>
            </div>
            <div class="card-body">
              <table
                class="table table-bordered table-striped align-middle"
                id="tableAudit"
              >
                <thead class="table-dark">
                  <tr>
                    <th>Timestamp</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Resource</th>
                    <th>IP Address</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(function () {
        if (typeof AppLayout !== "undefined") {
          $("#sidebar").html(AppLayout.render("audit-report"));
          $("#topbar").html(`
                                <div class="container-fluid d-flex align-items-center justify-content-between">
                                        <div class="d-flex align-items-center gap-3">
                                                <button class="btn btn-link d-md-none" id="sidebarToggle"><i class="fa fa-bars"></i></button>
                                                <span class="fw-bold text-primary">Security Report</span>
                                        </div>
                                        <div class="d-flex align-items-center gap-3">
                                                <span class="text-muted small">${localStorage.getItem("userName") || "Admin"}</span>
                                                <img src="assets/img/user.png" alt="User" class="rounded-circle" width="32" height="32">
                                        </div>
                                </div>
                        `);
        }
        AppController.initAuditReport && AppController.initAuditReport();
        // Filter table
        $("#filterAudit").on("input", function () {
          const val = $(this).val().toLowerCase();
          $("#tableAudit tbody tr").each(function () {
            const rowUser = $(this).find("td:eq(1)").text().toLowerCase();
            const rowAction = $(this).find("td:eq(2)").text().toLowerCase();
            const rowIP = $(this).find("td:eq(4)").text().toLowerCase();
            let show = true;
            if (
              val &&
              !(
                rowUser.includes(val) ||
                rowAction.includes(val) ||
                rowIP.includes(val)
              )
            )
              show = false;
            $(this).toggle(show);
          });
        });
        // Export audit
        $("#btnExportAudit").click(function () {
          let csv = "Timestamp,User,Action,Resource,IP Address\n";
          $("#tableAudit tbody tr").each(function () {
            let row = [];
            $(this)
              .find("td")
              .each(function () {
                row.push($(this).text());
              });
            csv += row.join(",") + "\n";
          });
          const blob = new Blob([csv], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "security_report.csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      });
    </script>
  </body>
</html>
