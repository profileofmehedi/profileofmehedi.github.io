<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboard Employee - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">Onboard New Employee</h3></div>
        <div class="card shadow">
            <div class="card-body p-4">
                <form id="addEmployeeForm">
                    <h5 class="mb-3 text-primary">Personal Details</h5>
                    <div class="row mb-3">
                        <div class="col-md-6"><label>First Name*</label><input id="add-fname" class="form-control" required></div>
                        <div class="col-md-6"><label>Last Name*</label><input id="add-lname" class="form-control" required></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label>Email*</label><input type="email" id="add-email" class="form-control" required></div>
                        <div class="col-md-6"><label>Phone</label><input id="add-phone" class="form-control"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label>DOB</label><input type="date" id="add-dob" class="form-control"></div>
                        <div class="col-md-6"><label>Gender</label><select id="add-gender" class="form-select"><option>Male</option><option>Female</option></select></div>
                    </div>
                    <hr>
                    <h5 class="mb-3 text-primary">Job Details</h5>
                    <div class="row mb-3">
                        <div class="col-md-6"><label>Department</label><select id="add-dept" class="form-select"><option>Engineering</option><option>HR</option><option>Finance</option></select></div>
                        <div class="col-md-6"><label>Position</label><input id="add-pos" class="form-control"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label>Join Date</label><input type="date" id="add-join" class="form-control"></div>
                        <div class="col-md-6"><label>Annual Salary</label><input type="number" id="add-salary" class="form-control"></div>
                    </div>
                    <hr>
                    <h5 class="mb-3 text-primary">Financial</h5>
                    <div class="row mb-3">
                        <div class="col-md-6"><label>Bank Name</label><input id="add-bank" class="form-control"></div>
                        <div class="col-md-6"><label>Account No</label><input id="add-acc" class="form-control"></div>
                    </div>
                    <button type="button" class="btn btn-primary w-100 py-2" id="saveEmployeeBtn">Complete Onboarding</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initEmployeeAdd());</script>
</body>
</html>
