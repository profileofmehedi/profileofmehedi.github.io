<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictions - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">Workforce Predictive Analytics</h3></div>
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header bg-white">Attrition Risk Model</div>
                    <div class="card-body"><canvas id="chartAttrition" style="height:300px"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header bg-white">Future Hiring Needs</div>
                    <div class="card-body p-4">
                        <h2 class="text-primary mb-3">Expected Growth: +15%</h2>
                        <p class="text-muted">Based on current project velocity and turnover rates, the AI recommends hiring:</p>
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center">Senior Developers <span class="badge bg-primary rounded-pill">3</span></li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">QA Engineers <span class="badge bg-primary rounded-pill">2</span></li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">Product Managers <span class="badge bg-primary rounded-pill">1</span></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initAIReport());</script>
</body>
</html>
