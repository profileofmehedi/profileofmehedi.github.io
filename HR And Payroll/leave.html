<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <h3 class="page-title">Leave Requests</h3>
            <button class="btn btn-primary" id="btnApplyLeave">Apply Leave</button>
        </div>
        <div class="card shadow mb-4">
            <div class="card-body">
                <table class="table table-bordered" id="tableLeave" width="100%">
                    <thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Apply Leave Modal -->
    <div class="modal fade" id="applyLeaveModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Apply Leave</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><select id="leaveType" class="form-select mb-2"><option>Casual</option><option>Medical</option></select><div class="row mb-2"><div class="col"><input type="date" id="leaveFrom" class="form-control"></div><div class="col"><input type="date" id="leaveTo" class="form-control"></div></div><textarea id="leaveReason" class="form-control" placeholder="Reason"></textarea></div><div class="modal-footer"><button class="btn btn-primary" id="submitLeaveBtn">Submit</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initLeave());</script>
</body>
</html>
