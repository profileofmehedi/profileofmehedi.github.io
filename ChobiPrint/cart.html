<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কার্ট - ছবিপ্রিন্ট</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark glass-header">
        <div class="container">
            <a class="navbar-brand font-fancy fs-3 text-primary" href="index.html">
                <i class="fas fa-camera-retro me-2"></i>ছবিপ্রিন্ট
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="track.html">ট্র্যাকিং</a></li>
                    <li class="nav-item"><a class="nav-link" href="upload.html">আপলোড</a></li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-sm btn-primary-custom ms-lg-3 px-3 position-relative active" href="cart.html">
                            <i class="fas fa-shopping-cart me-1"></i> কার্ট
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="py-5 mt-5">
        <div class="container mt-5">
            <div class="row mb-5">
                <div class="col-12 text-center" data-aos="fade-down">
                    <h1 class="display-5 fw-bold mb-3">আপনার <span class="text-primary">কার্ট</span></h1>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="glass-card p-4" data-aos="fade-up">
                        <div class="table-responsive">
                            <table class="table table-borderless text-white align-middle">
                                <thead class="border-bottom border-secondary">
                                    <tr>
                                        <th scope="col">ছবি</th>
                                        <th scope="col">বিবরণ</th>
                                        <th scope="col">সাইজ</th>
                                        <th scope="col">পরিমাণ</th>
                                        <th scope="col">দাম</th>
                                        <th scope="col">অ্যাকশন</th>
                                    </tr>
                                </thead>
                                <tbody id="cart-items">
                                    <!-- Cart Items will be injected here -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Empty Cart Message -->
                        <div id="empty-cart-msg" class="text-center py-5 d-none">
                            <i class="fas fa-shopping-basket fa-4x text-muted mb-3"></i>
                            <h3 class="text-muted">আপনার কার্ট খালি</h3>
                            <a href="upload.html" class="btn btn-primary-custom mt-3">ছবি আপলোড করুন</a>
                        </div>

                        <!-- Cart Summary -->
                        <div class="row mt-4 pt-4 border-top border-secondary" id="cart-summary">
                            <div class="col-md-6 offset-md-6">
                                <div class="d-flex justify-content-between mb-2">
                                    <span>সাবটোটাল:</span>
                                    <span class="fw-bold" id="subtotal">০ ৳</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>ডেলিভারি চার্জ:</span>
                                    <span class="fw-bold" id="delivery-charge">৬০ ৳</span>
                                </div>
                                <div class="d-flex justify-content-between mb-4 fs-4 border-top border-secondary pt-2">
                                    <span class="fw-bold text-primary">সর্বমোট:</span>
                                    <span class="fw-bold text-primary" id="total-price">৬০ ৳</span>
                                </div>
                                <div class="d-grid">
                                    <a href="checkout.html" class="btn btn-primary-custom btn-lg">চেকআউট পেজে যান</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
