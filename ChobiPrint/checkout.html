<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট - ছবিপ্রিন্ট</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark glass-header">
        <div class="container">
            <a class="navbar-brand font-fancy fs-3 text-primary" href="index.html">
                <i class="fas fa-camera-retro me-2"></i>ছবিপ্রিন্ট
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="track.html">ট্র্যাকিং</a></li>
                    <li class="nav-item"><a class="nav-link" href="upload.html">আপলোড</a></li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-sm btn-primary-custom ms-lg-3 px-3 position-relative" href="cart.html">
                            <i class="fas fa-shopping-cart me-1"></i> কার্ট
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Checkout Section -->
    <section class="py-5 mt-5">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="glass-card p-5" data-aos="fade-up">
                        <h2 class="mb-4 text-center text-dark">ডেলিভারি তথ্য দিন</h2>
                        
                        <form id="checkout-form">
                            <div class="mb-3">
                                <label for="name" class="form-label text-muted">আপনার নাম</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control bg-white border-secondary text-dark" id="name" required placeholder="পুরো নাম লিখুন">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="phone" class="form-label text-muted">মোবাইল নাম্বার</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control bg-white border-secondary text-dark" id="phone" required placeholder="017xxxxxxxx">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="address" class="form-label text-muted">ঠিকানা</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="fas fa-map-marker-alt"></i></span>
                                    <textarea class="form-control bg-white border-secondary text-dark" id="address" rows="3" required placeholder="বাসা নং, রোড নং, এলাকা..."></textarea>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="city" class="form-label text-muted">শহর</label>
                                    <select class="form-select bg-white border-secondary text-dark" id="city" required>
                                        <option value="" selected disabled>নির্বাচন করুন...</option>
                                        <option value="Dhaka">ঢাকা</option>
                                        <option value="Chittagong">চট্টগ্রাম</option>
                                        <option value="Sylhet">সিলেট</option>
                                        <option value="Rajshahi">রাজশাহী</option>
                                        <option value="Khulna">খুলনা</option>
                                        <option value="Barisal">বরিশাল</option>
                                        <option value="Rangpur">রংপুর</option>
                                        <option value="Mymensingh">ময়মনসিংহ</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="courier" class="form-label text-muted">কুরিয়ার সার্ভিস</label>
                                    <select class="form-select bg-white border-secondary text-dark" id="courier" required>
                                        <option value="Pathao">পাঠাও</option>
                                        <option value="RedX">রেডএক্স</option>
                                        <option value="SA Paribahan">এস এ পরিবহন</option>
                                        <option value="Sundarban">সুন্দরবন</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="border-secondary my-4">
                            
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 class="mb-0 text-dark">মোট বিল: <span class="text-primary fw-bold" id="final-total">0 ৳</span></h4>
                                <small class="text-muted">(ডেলিভারি চার্জ সহ)</small>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-custom btn-lg">অর্ডার কনফার্ম করুন</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
    <script>
        $(document).ready(function() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let subtotal = 0;
            const prices = { '4x6': 10, '5x7': 15, '8x10': 30, '10x12': 50 };
            
            if(cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }

            cart.forEach(item => {
                subtotal += (prices[item.printSize] || 10) * item.quantity;
            });
            
            $('#final-total').text((subtotal + 60) + ' ৳');

            $('#checkout-form').on('submit', function(e) {
                e.preventDefault();
                
                const trackId = 'CP-' + Math.floor(10000 + Math.random() * 90000);
                const orderData = {
                    id: trackId,
                    customer: {
                        name: $('#name').val(),
                        phone: $('#phone').val(),
                        address: $('#address').val(),
                        city: $('#city').val()
                    },
                    items: cart,
                    status: 'pending',
                    date: new Date().toLocaleDateString('bn-BD')
                };

                let orders = JSON.parse(localStorage.getItem('orders')) || [];
                orders.push(orderData);
                localStorage.setItem('orders', JSON.stringify(orders));

                const btn = $(this).find('button[type="submit"]');
                btn.html('<i class="fas fa-spinner fa-spin"></i> প্রসেসিং...');
                btn.prop('disabled', true);
                
                setTimeout(() => {
                    Swal.fire({
                        title: 'অর্ডার সফল হয়েছে!',
                        html: `আপনার ট্র্যাকিং আইডি: <b class="text-primary fs-4">${trackId}</b><br><br>অর্ডার ট্র্যাক করতে এই আইডিটি সংরক্ষণ করুন।`,
                        icon: 'success',
                        confirmButtonText: 'অর্ডার ট্র্যাক করুন',
                        background: '#fff',
                        color: '#000',
                        allowOutsideClick: false
                    }).then((result) => {
                        localStorage.removeItem('cart');
                        window.location.href = 'track.html';
                    });
                }, 1500);
            });
        });
    </script>
</body>
</html>
