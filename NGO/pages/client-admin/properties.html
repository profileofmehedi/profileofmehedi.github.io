<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Properties - Client Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="layout-sidebar"></div>
    <div class="main-content">
        <div id="layout-navbar"></div>
        <div class="container-fluid">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between py-3">
                    <h5 class="mb-0 text-primary">Properties (Houses/Mess)</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPropModal">
                        <i class="fa fa-plus"></i> Add Property
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="propertiesTable" class="table table-hover table-bordered" width="100%"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addPropModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Property</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPropForm">
                        <div class="mb-3">
                            <label>Property Name</label>
                            <input type="text" class="form-control" id="propName" placeholder="e.g. Rose Villa" required>
                        </div>
                        <div class="mb-3">
                            <label>Address</label>
                            <input type="text" class="form-control" id="propAddress" placeholder="Full Address" required>
                        </div>
                        <div class="mb-3">
                            <label>Number of Floors</label>
                            <input type="number" class="form-control" id="propFloors" value="1" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="ClientAdmin.saveProperty()">Save Property</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/core.js"></script>
    <script src="../../assets/js/client-admin.js"></script>
    <script>ClientAdmin.init('properties');</script>
</body>
</html>
