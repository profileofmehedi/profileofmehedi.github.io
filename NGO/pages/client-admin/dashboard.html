<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Client Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="layout-sidebar"></div>
    <div class="main-content">
        <div id="layout-navbar"></div>

        <div class="container-fluid">
            <!-- Stats -->
            <div class="row">
                <div class="col-md-4 col-xl-2">
                    <div class="card card-stats bg-primary text-white p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div><h6 class="mb-1">Properties</h6><h3 class="fw-bold" id="total-properties">0</h3></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-xl-2">
                    <div class="card card-stats bg-info text-white p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div><h6 class="mb-1">Total Units</h6><h3 class="fw-bold" id="total-units">0</h3></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-xl-2">
                    <div class="card card-stats bg-success text-white p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div><h6 class="mb-1">Occupied</h6><h3 class="fw-bold" id="occupied-units">0</h3></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-xl-2">
                    <div class="card card-stats bg-warning text-dark p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div><h6 class="mb-1">Vacant</h6><h3 class="fw-bold" id="vacant-units">0</h3></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-xl-2">
                     <div class="card card-stats bg-success text-white p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div><h6 class="mb-1">This Month</h6><h5 class="fw-bold" id="monthly-collection">0</h5></div>
                        </div>
                    </div>
                </div>
                 <div class="col-md-4 col-xl-2">
                     <div class="card card-stats bg-danger text-white p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div><h6 class="mb-1">Total Due</h6><h5 class="fw-bold" id="total-due">0</h5></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts / Recent can go here -->
            <div class="card">
                <div class="card-body text-center py-5">
                     <i class="fa-solid fa-chart-pie fa-3x text-muted mb-3"></i>
                     <p>Analytics charts would appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/core.js"></script>
    <script src="../../assets/js/client-admin.js"></script>
    <script>ClientAdmin.init('dashboard');</script>
</body>
</html>
