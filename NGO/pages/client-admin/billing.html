<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing - Client Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="layout-sidebar"></div>
    <div class="main-content">
        <div id="layout-navbar"></div>
        <div class="container-fluid">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 text-primary">Billing & Collection</h5>
                    <div class="d-flex gap-2">
                        <input type="month" class="form-control" id="billMonth" value="2026-02">
                        <button class="btn btn-success text-nowrap" onclick="ClientAdmin.generateBills()">
                            <i class="fa fa-cogs"></i> Generate Bills
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="alert alert-info small">
                        <i class="fa fa-info-circle"></i> Use "Generate Bills" to create monthly rent invoices for all active tenants.
                    </div>
                    <div class="table-responsive">
                        <table id="billsTable" class="table table-hover table-bordered" width="100%"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/core.js"></script>
    <script src="../../assets/js/client-admin.js"></script>
    <script>ClientAdmin.init('billing');</script>
</body>
</html>
