<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tenants - Client Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="layout-sidebar"></div>
    <div class="main-content">
        <div id="layout-navbar"></div>
        <div class="container-fluid">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between py-3">
                    <h5 class="mb-0 text-primary">Tenants</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTenantModal">
                        <i class="fa fa-user-plus"></i> Add Tenant
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="tenantsTable" class="table table-hover table-bordered" width="100%"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addTenantModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Register Tenant</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTenantForm">
                        <div class="mb-3">
                            <label>Full Name</label>
                            <input type="text" class="form-control" id="tenantName" required>
                        </div>
                        <div class="mb-3">
                            <label>Phone Number</label>
                            <input type="text" class="form-control" id="tenantPhone" required>
                        </div>
                        <div class="mb-3">
                            <label>Email (For Login)</label>
                            <input type="email" class="form-control" id="tenantEmail" required>
                        </div>
                        <div class="mb-3">
                            <label>Assign Unit</label>
                            <select class="form-select" id="tenantUnit">
                                <option value="">Select Vacant Unit...</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="ClientAdmin.saveTenant()">Save Tenant</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/core.js"></script>
    <script src="../../assets/js/client-admin.js"></script>
    <script>ClientAdmin.init('tenants');</script>
</body>
</html>
