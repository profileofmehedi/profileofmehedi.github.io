<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="layout-sidebar"></div>
    
    <div class="main-content">
        <div id="layout-navbar"></div>

        <div class="container-fluid">
            <div class="row">
                <div class="col-md-3">
                    <div class="card card-stats bg-primary text-white p-3 mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Total Clients</h6>
                                <h2 class="mb-0 fw-bold" id="total-clients">0</h2>
                            </div>
                            <i class="fa-solid fa-users icon-big"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stats bg-success text-white p-3 mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Active Subs</h6>
                                <h2 class="mb-0 fw-bold" id="active-subs">0</h2>
                            </div>
                            <i class="fa-solid fa-check-circle icon-big"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stats bg-info text-white p-3 mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Revenue (M)</h6>
                                <h2 class="mb-0 fw-bold" id="monthly-revenue">0</h2>
                            </div>
                            <i class="fa-solid fa-sack-dollar icon-big"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stats bg-danger text-white p-3 mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Expired</h6>
                                <h2 class="mb-0 fw-bold" id="expired-clients">0</h2>
                            </div>
                            <i class="fa-solid fa-triangle-exclamation icon-big"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header bg-white fw-bold">
                            Recent Activity
                        </div>
                        <div class="card-body">
                            <p class="text-muted">No recent system alerts.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/core.js"></script>
    <script src="../../assets/js/super-admin.js"></script>
    <script>
        $(document).ready(function() {
            SuperAdmin.init('dashboard');
        });
    </script>
</body>
</html>
