<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <title>মোল্লা বংশ</title>
  <link rel="icon" href="Data/img/people.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-row">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="5.5" r="2.4"></circle>
          <circle cx="7" cy="26.5" r="2.4"></circle>
          <circle cx="25" cy="26.5" r="2.4"></circle>
          <path d="M16 8.2V16.5M16 16.5H7.2V24M16 16.5H24.8V24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
        <div>
          <p class="eyebrow">পারিবারিক ইতিহাস</p>
          <h1 id="title">মোল্লা বংশ</h1>
        </div>
      </div>
      <p class="credit" id="credit"></p>
    </div>
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M16 16.5L20 20.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input id="q" type="search" placeholder="নাম লিখে খুঁজুন" aria-label="নাম খুঁজুন" autocomplete="off" spellcheck="false">
        <div id="results" class="results" hidden></div>
      </div>
      <div class="seg" role="group" aria-label="দেখার ধরন">
        <button type="button" id="viewPerson" aria-pressed="false">ব্যক্তি</button>
        <button type="button" id="viewTree" aria-pressed="false">গাছ</button>
      </div>
    </div>
  </header>

  <main id="app">
    <section id="personView" class="person-view" hidden></section>
    <section id="treeView" class="tree-view" hidden>
      <div class="legend" aria-hidden="true">
        <span><i class="mark male"></i> পুরুষ</span>
        <span><i class="mark female"></i> মেয়ে</span>
        <span><i class="swatch"></i> নাম নেই</span>
      </div>
      <div id="canvas" class="canvas">
        <div id="scaler">
          <div id="tree" class="tree"></div>
        </div>
      </div>
      <div class="zoombar">
        <div class="cluster">
          <button type="button" id="zoomOut" aria-label="ছোট করুন">−</button>
          <span id="zoomLabel">১০০%</span>
          <button type="button" id="zoomIn" aria-label="বড় করুন">+</button>
        </div>
        <button type="button" id="zoomFit">মানানসই</button>
        <button type="button" id="showLine">আমার লাইন</button>
        <button type="button" id="showAll">সব খুলুন</button>
        <button type="button" id="saveBranch" data-save-branch data-label="শাখার ছবি">শাখার ছবি</button>
      </div>
    </section>
    <aside id="panel" class="panel" hidden></aside>
  </main>

  <script src="Data/family.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
