<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Nano Lending Platform</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        background-color: #f0f2f5;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .register-container {
        max-width: 800px;
        margin-top: 3rem;
        margin-bottom: 3rem;
      }
      .card {
        border: none;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
        border-radius: 12px;
      }
      .card-header-custom {
        background-color: #1da1f2;
        color: white;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        padding: 20px;
        text-align: center;
      }
      .nav-tabs .nav-link {
        color: #6c757d;
        font-weight: 500;
      }
      .nav-tabs .nav-link.active {
        color: #1da1f2;
        border-color: #1da1f2 #1da1f2 #fff;
      }
    </style>
  </head>
  <body>
    <div class="container register-container">
      <div class="card">
        <div class="card-header-custom">
          <h2>🌾 Create Your Account</h2>
          <p>Join the future of agricultural finance</p>
        </div>
        <div class="card-body p-4">
          <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
              <button
                class="nav-link active"
                id="nav-farmer-tab"
                data-bs-toggle="tab"
                data-bs-target="#nav-farmer"
                type="button"
                role="tab"
              >
                <i class="fas fa-person-digging me-2"></i>I am a Farmer
              </button>
              <button
                class="nav-link"
                id="nav-supplier-tab"
                data-bs-toggle="tab"
                data-bs-target="#nav-supplier"
                type="button"
                role="tab"
              >
                <i class="fas fa-truck me-2"></i>I am a Supplier/Buyer
              </button>
            </div>
          </nav>
          <div class="tab-content p-3" id="nav-tabContent">
            <!-- Farmer Registration Form -->
            <div
              class="tab-pane fade show active"
              id="nav-farmer"
              role="tabpanel"
            >
              <h5 class="mt-2">Farmer Registration</h5>
              <form class="row g-3 mt-2">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone Number</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Upload National ID Photo</label
                  ><input type="file" class="form-control" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Take Selfie for Verification</label
                  ><input
                    type="file"
                    class="form-control"
                    accept="image/*"
                    capture
                  />
                </div>
                <div class="col-12">
                  <label class="form-label">Address (Land Location)</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Password</label
                  ><input type="password" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Confirm Password</label
                  ><input type="password" class="form-control" />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary">
                    Register as Farmer
                  </button>
                </div>
              </form>
            </div>
            <!-- Supplier/Buyer Registration Form -->
            <div class="tab-pane fade" id="nav-supplier" role="tabpanel">
              <h5 class="mt-2">Supplier / Buyer Registration</h5>
              <form class="row g-3 mt-2">
                <div class="col-md-12">
                  <label class="form-label">Company Name</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Trade License Number</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">VAT/TIN Number</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Contact Person</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Contact Phone</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Company Address</label
                  ><input type="text" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Password</label
                  ><input type="password" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Confirm Password</label
                  ><input type="password" class="form-control" />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary">
                    Register Business
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="card-footer text-center">
          <small
            >Already have an account? <a href="login.html">Sign In</a></small
          >
        </div>
      </div>
    </div>
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
