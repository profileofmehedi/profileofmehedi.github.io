<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer eKYC Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body {
            background: #f8f9fa;
        }

        .container {
            max-width: 600px;
            margin-top: 40px;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            background: linear-gradient(90deg, #f7fafd 60%, #e9f2fb 100%);
            font-weight: 600;
            color: #007bff;
            font-size: 1.2rem;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

        .btn {
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-header">eKYC Verification</div>
            <div class="card-body">
                <form id="ekycForm">
                    <div class="mb-3">
                        <label for="nid" class="form-label">National ID Number</label>
                        <input type="text" class="form-control" id="nid" required>
                    </div>
                    <div class="mb-3">
                        <label for="nidPhoto" class="form-label">Upload NID Photo</label>
                        <input type="file" class="form-control" id="nidPhoto" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label for="facePhoto" class="form-label">Live Face Photo</label>
                        <input type="file" class="form-control" id="facePhoto" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label for="fatherName" class="form-label">Father's Name</label>
                        <input type="text" class="form-control" id="fatherName" required>
                    </div>
                    <div class="mb-3">
                        <label for="motherName" class="form-label">Mother's Name</label>
                        <input type="text" class="form-control" id="motherName" required>
                    </div>
                    <div class="mb-3">
                        <label for="dob" class="form-label">Date of Birth (as per NID)</label>
                        <input type="date" class="form-control" id="dob" required>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Address (as per NID)</label>
                        <textarea class="form-control" id="address" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit for Verification</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $('#ekycForm').on('submit', function (e) {
            e.preventDefault();
            alert('eKYC submitted! Your identity will be verified soon.');
            // window.location.href = 'farmer_dashboard_main.html';
        });
    </script>
</body>

</html>
