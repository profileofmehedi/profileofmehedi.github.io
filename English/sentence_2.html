<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced English Flashcards (Part 2)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #c026d3; /* Fuchsia */
            --secondary-color: #86198f; /* Darker Fuchsia */
            --accent-color: #16a34a; /* Green */
            --completed-color: #2563eb; /* Blue */
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #5b21b6 0%, #1e1b4b 100%); /* Violet to Indigo */
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .flashcard-container {
            perspective: 1500px;
            margin-bottom: 25px;
            height: 350px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 3px solid transparent;
            transition: border-color 0.3s ease;
        }
        
        .flashcard.completed .flashcard-front {
            border-color: var(--completed-color);
        }
        
        .completed-icon {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.8rem;
            color: var(--completed-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .flashcard.completed .completed-icon {
            opacity: 1;
        }

        .flashcard-front {
            background: #ffffff;
        }
        
        .flashcard-back {
            background: #f0fdf4;
            transform: rotateY(180deg);
            border: 2px solid var(--accent-color);
        }

        #englishSentence {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1f2937;
        }
        
        #banglaTranslation {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1f2937;
        }

        .click-to-reveal {
            position: absolute;
            bottom: 20px;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .translation-label {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .listen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f3f4f6;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }
        .listen-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.1);
        }

        .progress-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
        }
        .progress { height: 15px; border-radius: 10px; }
        .progress-bar { background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 0;
            width: 120px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:disabled { background: #d1d5db; cursor: not-allowed; }

        .card-counter {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            padding: 10px 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .main-actions {
            margin-top: 20px;
            text-align: center;
        }
        
        #completeBtn {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        #completeBtn:hover {
            opacity: 0.9;
        }
        #completeBtn.completed {
            background-color: #f97316; /* Orange color for incomplete */
            border-color: #f97316;
        }

        .utility-buttons {
            display: flex; gap: 10px; justify-content: center; margin-top: 15px;
        }

        .utility-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            font-weight: 500;
        }
        .utility-btn:hover {
             background: rgba(255,255,255,0.3);
             border-color: white;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-graduation-cap"></i> Advanced English Sentences</h1>
            <p>Challenge yourself with 100 complex phrases</p>
        </div>

        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front">
                    <i class="fas fa-check-circle completed-icon"></i>
                    <button class="listen-btn" id="listenBtn" title="Listen"><i class="fas fa-volume-up"></i></button>
                    <p id="englishSentence">Loading...</p>
                    <span class="click-to-reveal"><i class="fas fa-mouse-pointer"></i> Click card to reveal</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <div class="translation-label">Bangla Translation</div>
                    <p id="banglaTranslation">লোড হচ্ছে...</p>
                </div>
            </div>
        </div>

        <div class="progress-section">
            <div class="status-bar">
                <span id="progressText">Progress: 0 of 100</span>
                <span id="scoreText">Score: 0</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>
        
        <div class="main-actions">
            <button class="btn btn-success" id="completeBtn"><i class="fas fa-check"></i> Mark as Completed</button>
        </div>

        <div class="navigation mt-3">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-arrow-left"></i> Previous</button>
            <div class="card-counter" id="cardCounter">1 / 100</div>
            <button class="nav-btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
        </div>
        
        <div class="utility-buttons">
            <button class="btn utility-btn" id="shuffleBtn"><i class="fas fa-random"></i> Shuffle</button>
            <button class="btn utility-btn" id="resetBtn"><i class="fas fa-redo"></i> Reset Progress</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            // --- DATA ---
            const initialFlashcardsData = [
                { english: "Despite the heavy traffic, we arrived on time.", bangla: "প্রচুর যানজট থাকা সত্ত্বেও, আমরা সময়মতো পৌঁছেছিলাম।" },
                { english: "He is considered a pioneer in the field of artificial intelligence.", bangla: "তাকে কৃত্রিম বুদ্ধিমত্তার ক্ষেত্রে একজন পথিকৃৎ হিসেবে বিবেচনা করা হয়।" },
                { english: "Had I known you were coming, I would have baked a cake.", bangla: "যদি আমি জানতাম তুমি আসছ, আমি একটি কেক বানাতাম।" },
                { english: "The new policy is intended to streamline the workflow.", bangla: "নতুন নীতিটির উদ্দেশ্য হলো কর্মপ্রবাহকে আরও কার্যকর করা।" },
                { english: "It's imperative that we address this issue immediately.", bangla: "আমাদের জন্য এই বিষয়টি অবিলম্বে সমাধান করা অপরিহার্য।" },
                { english: "She had to bite the bullet and admit her mistake.", bangla: "তাকে কঠিন সিদ্ধান্ত নিতে হয়েছিল এবং তার ভুল স্বীকার করতে হয়েছিল।" },
                { english: "The onus is on the management to ensure employee satisfaction.", bangla: "কর্মচারীদের সন্তুষ্টি নিশ্চিত করার দায়িত্ব ব্যবস্থাপনার উপর।" },
                { english: "They were on the fence about whether to move to a new city.", bangla: "তারা নতুন শহরে স্থানান্তরিত হবে কিনা তা নিয়ে দ্বিধায় ছিল।" },
                { english: "Let's not jump the gun; we need more information first.", bangla: "চলুন তাড়াহুড়ো না করি; আমাদের প্রথমে আরও তথ্য প্রয়োজন।" },
                { english: "The project was a resounding success, thanks to the team's effort.", bangla: "দলটির প্রচেষ্টার কারণে প্রকল্পটি একটি অসাধারণ সাফল্য ছিল।" },
                { english: "He has a vested interest in the company's success.", bangla: "কোম্পানির সাফল্যে তার একটি ব্যক্তিগত স্বার্থ রয়েছে।" },
                { english: "We need to weigh the pros and cons before making a decision.", bangla: "সিদ্ধান্ত নেওয়ার আগে আমাদের সুবিধা এবং অসুবিধাগুলো বিবেচনা করতে হবে।" },
                { english: "Her performance exceeded all our expectations.", bangla: "তার পারফরম্যান্স আমাদের সমস্ত প্রত্যাশা ছাড়িয়ে গেছে।" },
                { english: "It's a double-edged sword; it has both advantages and disadvantages.", bangla: "এটি একটি উভয়সঙ্কট; এর সুবিধাও আছে এবং অসুবিধাও আছে।" },
                { english: "The company is trying to get a foothold in the Asian market.", bangla: "কোম্পানিটি এশিয়ার বাজারে একটি শক্ত অবস্থান তৈরির চেষ্টা করছে।" },
                { english: "I'm inclined to agree with your assessment of the situation.", bangla: "আমি পরিস্থিতির বিষয়ে আপনার মূল্যায়নের সাথে একমত হতে আগ্রহী।" },
                { english: "The seminar provided a comprehensive overview of the topic.", bangla: "সেমিনারটি বিষয়টির একটি ব্যাপক ধারণা প্রদান করেছে।" },
                { english: "You'll have to take what he says with a grain of salt.", bangla: "তার কথা আপনাকে কিছুটা সন্দেহের সাথে নিতে হবে।" },
                { english: "The details of the plan are still up in the air.", bangla: "পরিকল্পনার বিবরণ এখনও অনিশ্চিত।" },
                { english: "He managed to kill two birds with one stone.", bangla: "সে এক ঢিলে দুই পাখি মারতে সক্ষম হয়েছিল।" },
                { english: "The issue at hand requires careful consideration.", bangla: "আলোচ্য বিষয়টি সতর্ক বিবেচনার দাবি রাখে।" },
                { english: "His claims are, for the most part, unsubstantiated.", bangla: "তার দাবিগুলো, বেশিরভাগ ক্ষেত্রে, অপ্রমাণিত।" },
                { english: "We should capitalize on this unique opportunity.", bangla: "আমাদের এই অনন্য সুযোগটির সদ্ব্যবহার করা উচিত।" },
                { english: "The politician's speech did not sit well with the audience.", bangla: "রাজনীতিবিদের বক্তৃতা দর্শকদের পছন্দ হয়নি।" },
                { english: "It's crucial to foster a culture of innovation.", bangla: "উদ্ভাবনের সংস্কৃতি গড়ে তোলা অত্যন্ত গুরুত্বপূর্ণ।" },
                { english: "I can't make heads or tails of this complex document.", bangla: "আমি এই জটিল নথির আগামাথা কিছুই বুঝতে পারছি না।" },
                { english: "The negotiations reached a stalemate yesterday.", bangla: "আলোচনা গতকাল একটি অচলাবস্থায় পৌঁছেছে।" },
                { english: "She gave a ballpark figure for the estimated costs.", bangla: "তিনি আনুমানিক খরচের একটি মোটাদাগের হিসাব দিয়েছেন।" },
                { english: "We need a contingency plan in case something goes wrong.", bangla: "যদি কিছু ভুল হয়ে যায় তার জন্য আমাদের একটি জরুরি পরিকল্পনা প্রয়োজন।" },
                { english: "His ambiguous response left us feeling uncertain.", bangla: "তার দ্ব্যর্থক উত্তর আমাদের অনিশ্চিত করে রেখেছিল।" },
                { english: "The company decided to outsource its customer service.", bangla: "কোম্পানিটি তার গ্রাহক পরিষেবা আউটসোর্স করার সিদ্ধান্ত নিয়েছে।" },
                { english: "It's a nuanced issue with no simple solution.", bangla: "এটি একটি সূক্ষ্ম বিষয় যার কোনো সহজ সমাধান নেই।" },
                { english: "They were working against the clock to meet the deadline.", bangla: "তারা সময়সীমা পূরণের জন্য দ্রুত কাজ করছিল।" },
                { english: "His dedication to his craft is truly commendable.", bangla: "তার কাজের প্রতি তার নিষ্ঠা সত্যিই প্রশংসনীয়।" },
                { english: "We have to address the root cause of the problem.", bangla: "আমাদের সমস্যার মূল কারণ খুঁজে বের করতে হবে।" },
                { english: "She has an innate talent for music.", bangla: "সংগীতে তার একটি সহজাত প্রতিভা রয়েছে।" },
                { english: "The preliminary results of the study are promising.", bangla: "গবেষণার প্রাথমিক ফলাফল আশাব্যঞ্জক।" },
                { english: "He tends to play devil's advocate in every discussion.", bangla: "সে প্রতিটি আলোচনায় ইচ্ছাকৃতভাবে বিরোধী পক্ষ নেয়।" },
                { english: "Their business venture eventually paid dividends.", bangla: "তাদের ব্যবসায়িক উদ্যোগ অবশেষে লাভজনক হয়েছিল।" },
                { english: "The new software is not compatible with our current system.", bangla: "নতুন সফটওয়্যারটি আমাদের বর্তমান সিস্টেমের সাথে সামঞ্জস্যপূর্ণ নয়।" },
                { english: "It's prudent to save money for a rainy day.", bangla: "দুর্দিনের জন্য টাকা জমানো বুদ্ধিমানের কাজ।" },
                { english: "The evidence to support his theory is tenuous at best.", bangla: "তার তত্ত্বকে সমর্থন করার প্রমাণ খুব দুর্বল।" },
                { english: "We must adhere to the safety guidelines at all times.", bangla: "আমাদের অবশ্যই সর্বদা নিরাপত্তা নির্দেশিকা মেনে চলতে হবে।" },
                { english: "The election result was a foregone conclusion.", bangla: "নির্বাচনের ফলাফল একটি পূর্বনির্ধারিত বিষয় ছিল।" },
                { english: "He made a compelling argument for his case.", bangla: "তিনি তার ক্ষেত্রের জন্য একটি জোরালো যুক্তি উপস্থাপন করেছেন।" },
                { english: "The market is saturated with similar products.", bangla: "বাজার একই ধরনের পণ্যে পরিপূর্ণ।" },
                { english: "She has a meticulous approach to her work.", bangla: "তার কাজের প্রতি একটি অত্যন্ত সতর্ক দৃষ্টিভঙ্গি রয়েছে।" },
                { english: "Let's not get bogged down in minor details.", bangla: "চলুন আমরা ছোটখাটো বিবরণে আটকে না যাই।" },
                { english: "The documentary provides a poignant look at the issue.", bangla: "তথ্যচিত্রটি বিষয়টির একটি মর্মস্পর্শী চিত্র তুলে ধরে।" },
                { english: "His promotion was a testament to his hard work.", bangla: "তার পদোন্নতি তার কঠোর পরিশ্রমের প্রমাণ ছিল।" },
                { english: "The two events happened in quick succession.", bangla: "দুটি ঘটনা খুব দ্রুত পরপর ঘটেছিল।" },
                { english: "It is incumbent upon us to protect the environment.", bangla: "পরিবেশ রক্ষা করা আমাদের উপর অর্পিত দায়িত্ব।" },
                { english: "The team's morale was at an all-time low after the defeat.", bangla: "পরাজয়ের পর দলের মনোবল সর্বকালের সর্বনিম্নে ছিল।" },
                { english: "We need to look at this problem from a different perspective.", bangla: "আমাদের এই সমস্যাটিকে একটি ভিন্ন দৃষ্টিকোণ থেকে দেখতে হবে।" },

                { english: "The treaty was ratified by all member states.", bangla: "চুক্তিটি সমস্ত সদস্য রাষ্ট্র দ্বারা অনুমোদিত হয়েছিল।" },
                { english: "She gave a succinct summary of the main points.", bangla: "তিনি মূল বিষয়গুলোর একটি সংক্ষিপ্ত সারসংক্ষেপ দিয়েছেন।" },
                { english: "The government implemented austerity measures to reduce debt.", bangla: "সরকার ঋণ কমাতে কঠোরতামূলক ব্যবস্থা গ্রহণ করেছে।" },
                { english: "His gregarious personality makes him popular at parties.", bangla: "তার মিশুক ব্যক্তিত্ব তাকে পার্টিতে জনপ্রিয় করে তোলে।" },
                { english: "The company's perennial problem is high employee turnover.", bangla: "কোম্পানির দীর্ঘস্থায়ী সমস্যা হলো উচ্চ কর্মচারী পরিবর্তন হার।" },
                { english: "He was ostracized by his community for his radical views.", bangla: "তার চরমপন্থী মতামতের জন্য তাকে তার সম্প্রদায় থেকে একঘরে করা হয়েছিল।" },
                { english: "The lecture was so esoteric that few could understand it.", bangla: "বক্তৃতাটি এতই দুর্বোধ্য ছিল যে খুব কম লোকই তা বুঝতে পেরেছিল।" },
                { english: "We need to expedite the approval process.", bangla: "আমাদের অনুমোদন প্রক্রিয়াটি দ্রুততর করতে হবে।" },
                { english: "The novel's protagonist is a quintessential anti-hero.", bangla: "উপন্যাসের প্রধান চরিত্র একজন আদর্শ খলনায়ক।" },
                { english: "Her nonchalant attitude during the crisis was surprising.", bangla: "সঙ্কটের সময় তার উদাসীন মনোভাব আশ্চর্যজনক ছিল।" },
                { english: "The evidence was irrefutable, leading to a conviction.", bangla: "প্রমাণটি অকাট্য ছিল, যার ফলে দোষী সাব্যস্ত হয়।" },
                { english: "The company is looking for a paradigm shift in its strategy.", bangla: "কোম্পানিটি তার কৌশলে একটি মৌলিক পরিবর্তনের সন্ধান করছে।" },
                { english: "He has an insatiable appetite for knowledge.", bangla: "জ্ঞানের প্রতি তার অতৃপ্ত ক্ষুধা রয়েছে।" },
                { english: "The politician's speech was full of platitudes and clichés.", bangla: "রাজনীতিবিদের বক্তৃতাটি গতানুগতিক ও মামুলি কথায় পূর্ণ ছিল।" },
                { english: "Their clandestine meetings were eventually discovered.", bangla: "তাদের গোপন বৈঠকগুলো অবশেষে আবিষ্কৃত হয়েছিল।" },
                { english: "The juxtaposition of old and new architecture is fascinating.", bangla: "পুরানো এবং নতুন স্থাপত্যের পাশাপাশি অবস্থান আকর্ষণীয়।" },
                { english: "He has a phlegmatic temperament, rarely showing emotion.", bangla: "তার একটি শান্ত মেজাজ আছে, তিনি খুব কমই আবেগ দেখান।" },
                { english: "The situation calls for a pragmatic approach, not an idealistic one.", bangla: "পরিস্থিতিটি একটি বাস্তববাদী পদ্ধতির দাবি করে, আদর্শবাদী নয়।" },
                { english: "The pandemic has exacerbated existing social inequalities.", bangla: "মহামারী বিদ্যমান সামাজিক বৈষম্যকে আরও বাড়িয়ে দিয়েছে।" },
                { english: "His languid movements suggested a state of utter exhaustion.", bangla: "তার ধীর গতিবিধি চরম ক্লান্তির অবস্থা নির্দেশ করছিল।" },
                { english: "She is a prolific writer with over fifty published novels.", bangla: "তিনি একজন উর্বর লেখক যার পঞ্চাশটিরও বেশি প্রকাশিত উপন্যাস রয়েছে।" },
                { english: "His hubris was the ultimate cause of his downfall.", bangla: "তার অহংকারই ছিল তার পতনের চূড়ান্ত কারণ।" }
            ];

            // --- STATE MANAGEMENT ---
            let appState = {
                cards: [],
                currentIndex: 0
            };

            function saveState() {
                localStorage.setItem('flashcardStateAdvanced', JSON.stringify(appState));
            }

            function loadState() {
                const savedState = localStorage.getItem('flashcardStateAdvanced');
                if (savedState) {
                    appState = JSON.parse(savedState);
                } else {
                    // Initialize for the first time
                    appState.cards = initialFlashcardsData.map((card, index) => ({
                        ...card,
                        id: index,
                        completed: false
                    }));
                    appState.currentIndex = 0;
                    saveState();
                }
            }

            // --- UI RENDERING ---
            function renderFlashcard() {
                $('#flashcard').removeClass('flipped');
                
                const card = appState.cards[appState.currentIndex];
                if (!card) return;

                $('.flashcard-face').fadeOut(150, function() {
                    $('#englishSentence').text(card.english);
                    $('#banglaTranslation').text(card.bangla);
                    $(this).fadeIn(150);
                });

                if (card.completed) {
                    $('#flashcard').addClass('completed');
                    $('#completeBtn').addClass('completed').html('<i class="fas fa-times"></i> Mark as Incomplete');
                } else {
                    $('#flashcard').removeClass('completed');
                    $('#completeBtn').removeClass('completed').html('<i class="fas fa-check"></i> Mark as Completed');
                }

                updateNavigationAndProgress();
            }
            
            function updateNavigationAndProgress() {
                const total = appState.cards.length;
                const score = appState.cards.filter(c => c.completed).length;

                $('#cardCounter').text(`${appState.currentIndex + 1} / ${total}`);
                $('#progressText').text(`Progress: ${appState.currentIndex + 1} of ${total}`);
                $('#scoreText').text(`Score: ${score}`);
                
                const progressPercentage = total > 0 ? ((appState.currentIndex + 1) / total) * 100 : 0;
                $('#progressBar').css('width', `${progressPercentage}%`);

                $('#prevBtn').prop('disabled', appState.currentIndex === 0);
                $('#nextBtn').prop('disabled', appState.currentIndex === total - 1);
            }

            // --- EVENT HANDLERS ---
            $('#flashcard').on('click', function() {
                $(this).toggleClass('flipped');
            });

            $('#nextBtn').on('click', () => {
                if (appState.currentIndex < appState.cards.length - 1) {
                    appState.currentIndex++;
                    saveState();
                    renderFlashcard();
                }
            });

            $('#prevBtn').on('click', () => {
                if (appState.currentIndex > 0) {
                    appState.currentIndex--;
                    saveState();
                    renderFlashcard();
                }
            });

            $('#completeBtn').on('click', () => {
                const card = appState.cards[appState.currentIndex];
                card.completed = !card.completed;
                saveState();
                renderFlashcard();
            });

            $('#shuffleBtn').on('click', () => {
                for (let i = appState.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [appState.cards[i], appState.cards[j]] = [appState.cards[j], appState.cards[i]];
                }
                appState.currentIndex = 0;
                saveState();
                renderFlashcard();
            });
            
            $('#resetBtn').on('click', () => {
                if (confirm('Are you sure you want to reset all your progress? This cannot be undone.')) {
                    localStorage.removeItem('flashcardStateAdvanced');
                    loadState(); 
                    renderFlashcard();
                }
            });

            $('#listenBtn').on('click', function(e) {
                e.stopPropagation(); 
                const text = $('#englishSentence').text();
                if ('speechSynthesis' in window && text) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert('Sorry, your browser does not support text-to-speech.');
                }
            });

            // --- INITIALIZATION ---
            loadState();
            renderFlashcard();
        });
    </script>
