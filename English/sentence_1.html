<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced English Learning Flashcards</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #312e81;
            --accent-color: #10b981;
            --completed-color: #22c55e;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #7158e2 0%, #341f97 100%);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .flashcard-container {
            perspective: 1500px;
            margin-bottom: 25px;
            height: 350px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 3px solid transparent;
            transition: border-color 0.3s ease;
        }
        
        .flashcard.completed .flashcard-front {
            border-color: var(--completed-color);
        }
        
        .completed-icon {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.8rem;
            color: var(--completed-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .flashcard.completed .completed-icon {
            opacity: 1;
        }


        .flashcard-front {
            background: #ffffff;
        }
        
        .flashcard-back {
            background: #f0fdf4;
            transform: rotateY(180deg);
            border: 2px solid var(--accent-color);
        }

        #englishSentence {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1f2937;
        }
        
        #banglaTranslation {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        .click-to-reveal {
            position: absolute;
            bottom: 20px;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .translation-label {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .listen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f3f4f6;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }
        .listen-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.1);
        }

        .progress-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
        }
        .progress { height: 15px; border-radius: 10px; }
        .progress-bar { background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 0;
            width: 120px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:disabled { background: #d1d5db; cursor: not-allowed; }

        .card-counter {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            padding: 10px 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .main-actions {
            margin-top: 20px;
            text-align: center;
        }
        
        #completeBtn {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        #completeBtn:hover {
            opacity: 0.9;
        }
        #completeBtn.completed {
            background-color: #f97316; /* Orange color for incomplete */
            border-color: #f97316;
        }

        .utility-buttons {
            display: flex; gap: 10px; justify-content: center; margin-top: 15px;
        }

        .utility-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            font-weight: 500;
        }
        .utility-btn:hover {
             background: rgba(255,255,255,0.3);
             border-color: white;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-comments"></i> Everyday English Sentences</h1>
            <p>Master 100 common phrases with Bangla translations</p>
        </div>

        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front">
                    <i class="fas fa-check-circle completed-icon"></i>
                    <button class="listen-btn" id="listenBtn" title="Listen"><i class="fas fa-volume-up"></i></button>
                    <p id="englishSentence">Loading...</p>
                    <span class="click-to-reveal"><i class="fas fa-mouse-pointer"></i> Click card to reveal</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <div class="translation-label">Bangla Translation</div>
                    <p id="banglaTranslation">লোড হচ্ছে...</p>
                </div>
            </div>
        </div>

        <div class="progress-section">
            <div class="status-bar">
                <span id="progressText">Progress: 0 of 100</span>
                <span id="scoreText">Score: 0</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>
        
        <div class="main-actions">
            <button class="btn btn-success" id="completeBtn"><i class="fas fa-check"></i> Mark as Completed</button>
        </div>

        <div class="navigation mt-3">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-arrow-left"></i> Previous</button>
            <div class="card-counter" id="cardCounter">1 / 100</div>
            <button class="nav-btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
        </div>
        
        <div class="utility-buttons">
            <button class="btn utility-btn" id="shuffleBtn"><i class="fas fa-random"></i> Shuffle</button>
            <button class="btn utility-btn" id="resetBtn"><i class="fas fa-redo"></i> Reset Progress</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>

                { english: "I'm on a tight budget.", bangla: "আমার বাজেট খুব সীমিত।" },
                { english: "It's a matter of opinion.", bangla: "এটা মতামতের বিষয়।" },
                { english: "I'm exhausted.", bangla: "আমি খুব ক্লান্ত।" },
                { english: "Let's take a break.", bangla: "চলুন একটা বিরতি নিই।" },
                { english: "Could you be more specific?", bangla: "আপনি কি আরও নির্দিষ্ট করে বলতে পারেন?" },
                { english: "I'll cross that bridge when I come to it.", bangla: "যখন সময় আসবে তখন এটা নিয়ে ভাবব।" },
                { english: "That's a relief.", bangla: "এটা একটা স্বস্তির বিষয়।" },
                { english: "I'm counting on you.", bangla: "আমি আপনার উপর নির্ভর করছি।" },
                { english: "Where are you from?", bangla: "আপনি কোথা থেকে এসেছেন?" },
                { english: "Have a great day!", bangla: "আপনার দিনটি শুভ হোক!" }
            ];

            // --- STATE MANAGEMENT ---
            let appState = {
                cards: [],
                currentIndex: 0
            };

            function saveState() {
                localStorage.setItem('flashcardState', JSON.stringify(appState));
            }

            function loadState() {
                const savedState = localStorage.getItem('flashcardState');
                if (savedState) {
                    appState = JSON.parse(savedState);
                } else {
                    // Initialize for the first time
                    appState.cards = initialFlashcardsData.map((card, index) => ({
                        ...card,
                        id: index,
                        completed: false
                    }));
                    appState.currentIndex = 0;
                    saveState();
                }
            }

            // --- UI RENDERING ---
            function renderFlashcard() {
                // Ensure the card is flipped back to the front on navigation
                $('#flashcard').removeClass('flipped');
                
                const card = appState.cards[appState.currentIndex];
                if (!card) return;

                // Fade out, update content, fade in
                $('.flashcard-face').fadeOut(150, function() {
                    $('#englishSentence').text(card.english);
                    $('#banglaTranslation').text(card.bangla);
                    $(this).fadeIn(150);
                });

                // Update UI based on completion status
                if (card.completed) {
                    $('#flashcard').addClass('completed');
                    $('#completeBtn').addClass('completed').html('<i class="fas fa-times"></i> Mark as Incomplete');
                } else {
                    $('#flashcard').removeClass('completed');
                    $('#completeBtn').removeClass('completed').html('<i class="fas fa-check"></i> Mark as Completed');
                }

                updateNavigationAndProgress();
            }
            
            function updateNavigationAndProgress() {
                const total = appState.cards.length;
                const score = appState.cards.filter(c => c.completed).length;

                $('#cardCounter').text(`${appState.currentIndex + 1} / ${total}`);
                $('#progressText').text(`Progress: ${appState.currentIndex + 1} of ${total}`);
                $('#scoreText').text(`Score: ${score}`);
                
                // Progress bar for cards viewed, not completed
                const progressPercentage = total > 0 ? ((appState.currentIndex + 1) / total) * 100 : 0;
                $('#progressBar').css('width', `${progressPercentage}%`);

                $('#prevBtn').prop('disabled', appState.currentIndex === 0);
                $('#nextBtn').prop('disabled', appState.currentIndex === total - 1);
            }

            // --- EVENT HANDLERS ---
            $('#flashcard').on('click', function() {
                $(this).toggleClass('flipped');
            });

            $('#nextBtn').on('click', () => {
                if (appState.currentIndex < appState.cards.length - 1) {
                    appState.currentIndex++;
                    saveState();
                    renderFlashcard();
                }
            });

            $('#prevBtn').on('click', () => {
                if (appState.currentIndex > 0) {
                    appState.currentIndex--;
                    saveState();
                    renderFlashcard();
                }
            });

            $('#completeBtn').on('click', () => {
                const card = appState.cards[appState.currentIndex];
                card.completed = !card.completed;
                saveState();
                renderFlashcard();
            });

            $('#shuffleBtn').on('click', () => {
                for (let i = appState.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [appState.cards[i], appState.cards[j]] = [appState.cards[j], appState.cards[i]];
                }
                appState.currentIndex = 0;
                saveState();
                renderFlashcard();
            });
            
            $('#resetBtn').on('click', () => {
                if (confirm('Are you sure you want to reset all your progress? This cannot be undone.')) {
                    localStorage.removeItem('flashcardState');
                    loadState(); // This will re-initialize the state
                    renderFlashcard();
                }
            });

            $('#listenBtn').on('click', function(e) {
                e.stopPropagation(); // Prevent card from flipping
                const text = $('#englishSentence').text();
                if ('speechSynthesis' in window && text) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert('Sorry, your browser does not support text-to-speech.');
                }
            });

            // --- INITIALIZATION ---
            loadState();
            renderFlashcard();
        });
    </script>
</body>
</html>
