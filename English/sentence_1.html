<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>English Learning Flashcards</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #312e81;
            --accent-color: #10b981;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #7158e2 0%, #341f97 100%);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .flashcard-container {
            perspective: 1500px;
            margin-bottom: 25px;
            height: 350px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }

        .flashcard-front {
            background: #ffffff;
        }
        
        .flashcard-back {
            background: #f0fdf4;
            transform: rotateY(180deg);
            border: 2px solid var(--accent-color);
        }

        #englishSentence {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1f2937;
        }
        
        #banglaTranslation {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        .click-to-reveal {
            position: absolute;
            bottom: 20px;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .translation-label {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .listen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f3f4f6;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }
        .listen-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.1);
        }

        .progress-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
        }
        .progress { height: 15px; border-radius: 10px; }
        .progress-bar { background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 0;
            width: 120px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:disabled { background: #d1d5db; cursor: not-allowed; }

        .card-counter {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            padding: 10px 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .action-buttons {
            display: flex; gap: 10px; justify-content: center; margin-top: 25px;
        }

        .action-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            font-weight: 500;
        }
        .action-btn:hover {
             background: rgba(255,255,255,0.3);
             border-color: white;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-comments"></i> Everyday English Sentences</h1>
            <p>Master 100 common phrases with Bangla translations</p>
        </div>

        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front">
                    <button class="listen-btn" id="listenBtn" title="Listen"><i class="fas fa-volume-up"></i></button>
                    <p id="englishSentence">Loading...</p>
                    <span class="click-to-reveal"><i class="fas fa-mouse-pointer"></i> Click card to reveal</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <div class="translation-label">Bangla Translation</div>
                    <p id="banglaTranslation">লোড হচ্ছে...</p>
                </div>
            </div>
        </div>

        <div class="progress-section">
            <div class="d-flex justify-content-between mb-2">
                <span><strong>Progress:</strong></span>
                <span id="progressText">0 of 100</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-arrow-left"></i> Previous</button>
            <div class="card-counter" id="cardCounter">1 / 100</div>
            <button class="nav-btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
        </div>
        
        <div class="action-buttons">
            <button class="btn action-btn" id="shuffleBtn"><i class="fas fa-random"></i> Shuffle</button>
            <button class="btn action-btn" id="resetBtn"><i class="fas fa-redo"></i> Reset</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            const flashcardsData = [

                { english: "How do I get to the nearest station?", bangla: "সবচেয়ে কাছের স্টেশনে কিভাবে যাব?" },
                { english: "I'm looking forward to it.", bangla: "আমি এটার জন্য অধীর আগ্রহে অপেক্ষা করছি।" },
                { english: "It's not a big deal.", bangla: "এটা কোনো বড় ব্যাপার না।" },

                { english: "Could we reschedule our meeting?", bangla: "আমরা কি আমাদের মিটিং পুনরায় নির্ধারণ করতে পারি?" },
                { english: "I see what you mean.", bangla: "আমি বুঝতে পারছি আপনি কি বলতে চাইছেন।" },
                { english: "Let's get down to business.", bangla: "চলুন আসল কাজ শুরু করা যাক।" },

                { english: "Could you speak a little slower?", bangla: "আপনি কি আরেকটু আস্তে কথা বলতে পারেন?" },
                { english: "I'll get back to you on that.", bangla: "আমি আপনাকে এ বিষয়ে পরে জানাব।" },
                { english: "It's a piece of cake.", bangla: "এটা খুব সহজ কাজ।" },
                { english: "Let's call it a day.", bangla: "চলুন আজকের মতো কাজ শেষ করি।" },

                { english: "I'm having second thoughts.", bangla: "আমি আবার ভাবছি।" },

                { english: "I'm open to suggestions.", bangla: "আমি পরামর্শের জন্য প্রস্তুত।" },

                { english: "I'll be there in five minutes.", bangla: "আমি পাঁচ মিনিটের মধ্যে সেখানে থাকব।" },

                { english: "It's a matter of opinion.", bangla: "এটা মতামতের বিষয়।" },
                { english: "I'm exhausted.", bangla: "আমি খুব ক্লান্ত।" },
                { english: "Let's take a break.", bangla: "চলুন একটা বিরতি নিই।" },
                { english: "Could you be more specific?", bangla: "আপনি কি আরও নির্দিষ্ট করে বলতে পারেন?" },
                { english: "I'll cross that bridge when I come to it.", bangla: "যখন সময় আসবে তখন এটা নিয়ে ভাবব।" },
                { english: "That's a relief.", bangla: "এটা একটা স্বস্তির বিষয়।" },
                { english: "I'm counting on you.", bangla: "আমি আপনার উপর নির্ভর করছি।" }
            ];

            let currentIndex = 0;
            let currentCards = [...flashcardsData];
            let isFlipped = false;

            function renderFlashcard() {
                isFlipped = false;
                $('#flashcard').removeClass('flipped');
                const card = currentCards[currentIndex];

                // Add a fade-out-in animation for a smoother transition
                $('.flashcard-face').fadeOut(150, function() {
                    $('#englishSentence').text(card.english);
                    $('#banglaTranslation').text(card.bangla);
                    $(this).fadeIn(150);
                });

                updateNavigation();
            }
            
            function updateNavigation() {
                const total = currentCards.length;
                $('#cardCounter').text(`${currentIndex + 1} / ${total}`);
                $('#progressText').text(`${currentIndex + 1} of ${total}`);
                $('#progressBar').css('width', `${((currentIndex + 1) / total) * 100}%`);
                $('#prevBtn').prop('disabled', currentIndex === 0);
                $('#nextBtn').prop('disabled', currentIndex === total - 1);
            }

            $('#flashcard').on('click', function() {
                $(this).toggleClass('flipped');
                isFlipped = !isFlipped;
            });

            $('#nextBtn').on('click', () => {
                if (currentIndex < currentCards.length - 1) {
                    currentIndex++;
                    renderFlashcard();
                }
            });

            $('#prevBtn').on('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderFlashcard();
                }
            });

            $('#shuffleBtn').on('click', () => {
                for (let i = currentCards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
                }
                currentIndex = 0;
                renderFlashcard();
            });
            
            $('#resetBtn').on('click', () => {
                currentCards = [...flashcardsData];
                currentIndex = 0;
                renderFlashcard();
            });

            $('#listenBtn').on('click', function(e) {
                e.stopPropagation(); // Prevents the card from flipping
                const text = $('#englishSentence').text();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            });

            // Initial Load
            renderFlashcard();
        });
    </script>
</body>
</html>
