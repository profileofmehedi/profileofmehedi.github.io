<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members - IsDB ProNet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">
          <i class="fas fa-network-wired"></i> IsDB ProNet
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html"
                ><i class="fas fa-home"></i> Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="members.html"
                ><i class="fas fa-users"></i> Network</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fas fa-briefcase"></i> Jobs</a
              >
            </li>
            <li class="nav-item ms-3">
              <a
                href="#"
                class="d-flex align-items-center text-decoration-none text-dark nav-user-profile-link"
              >
                <img
                  src=""
                  class="rounded-circle border nav-user-avatar"
                  width="35"
                  height="35"
                />
                <span class="ms-2 fw-bold d-none d-lg-block nav-user-name"
                  >Loading...</span
                >
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <!-- Hero Section -->
      <div class="row mb-5">
        <div class="col-12 text-center">
          <h1 class="display-4 fw-bold mb-3">
            <i class="fas fa-users text-primary"></i> Discover Professionals
          </h1>
          <p class="lead text-muted">
            Connect with talented IDB-BISEW alumni and grow your network
          </p>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="row g-3 mb-5">
        <div class="col-md-3">
          <div class="card text-center border-0 shadow-sm hover-lift">
            <div class="card-body">
              <i class="fas fa-users fa-2x text-primary mb-2"></i>
              <h3 class="mb-0 total-members">0</h3>
              <small class="text-muted">Total Members</small>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center border-0 shadow-sm hover-lift">
            <div class="card-body">
              <i class="fas fa-user-check fa-2x text-success mb-2"></i>
              <h3 class="mb-0 my-connections">0</h3>
              <small class="text-muted">Your Connections</small>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center border-0 shadow-sm hover-lift">
            <div class="card-body">
              <i class="fas fa-graduation-cap fa-2x text-info mb-2"></i>
              <h3 class="mb-0 batches-count">0</h3>
              <small class="text-muted">Batches</small>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center border-0 shadow-sm hover-lift">
            <div class="card-body">
              <i class="fas fa-code fa-2x text-warning mb-2"></i>
              <h3 class="mb-0 skills-count">0</h3>
              <small class="text-muted">Skills</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Filters and Search -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-5">
                  <label class="form-label small text-muted mb-1">
                    <i class="fas fa-search"></i> Search
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                      <i class="fas fa-search text-muted"></i>
                    </span>
                    <input
                      type="text"
                      id="member-search"
                      class="form-control border-start-0 ps-0"
                      placeholder="Search by name, skill, or batch..."
                    />
                  </div>
                </div>
                <div class="col-md-3">
                  <label class="form-label small text-muted mb-1">
                    <i class="fas fa-filter"></i> Filter by Batch
                  </label>
                  <select class="form-select" id="batch-filter">
                    <option value="">All Batches</option>
                    <option value="ESAD-CS/45">ESAD-CS/45</option>
                    <option value="ESAD-CS/46">ESAD-CS/46</option>
                    <option value="NT/32">NT/32</option>
                    <option value="GAVE/12">GAVE/12</option>
                    <option value="J2EE/40">J2EE/40</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <label class="form-label small text-muted mb-1">
                    <i class="fas fa-sort"></i> Sort By
                  </label>
                  <select class="form-select" id="sort-filter">
                    <option value="name">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="recent">Recently Joined</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <label class="form-label small text-muted mb-1">
                    <i class="fas fa-th"></i> Per Page
                  </label>
                  <select class="form-select" id="items-per-page">
                    <option value="6">6 items</option>
                    <option value="9" selected>9 items</option>
                    <option value="12">12 items</option>
                    <option value="all">Show All</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Results Info -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0">
          <span id="results-info">Showing results</span>
        </p>
        <div class="btn-group" role="group">
          <button
            class="btn btn-sm btn-outline-secondary active"
            id="view-grid"
          >
            <i class="fas fa-th"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary" id="view-list">
            <i class="fas fa-list"></i>
          </button>
        </div>
      </div>

      <!-- Members Grid -->
      <div class="row" id="members-grid">
        <!-- Members injected via JS -->
      </div>

      <!-- No Results Message -->
      <div id="no-results" class="text-center py-5 d-none">
        <i class="fas fa-user-slash fa-4x text-muted mb-3"></i>
        <h4 class="text-muted">No members found</h4>
        <p class="text-muted">Try adjusting your search or filters</p>
      </div>

      <!-- Pagination -->
      <nav aria-label="Members pagination" class="mt-5">
        <ul class="pagination justify-content-center" id="pagination">
          <!-- Pagination buttons injected via JS -->
        </ul>
      </nav>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
