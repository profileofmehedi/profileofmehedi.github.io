<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Leave Balance - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main-content">
      <div class="page-header">
        <h3 class="page-title">
          <i class="fas fa-plus-circle me-2"></i>Add Leave Balance (Yearly)
        </h3>
        <button class="btn btn-outline-secondary" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Back
        </button>
      </div>

      <div class="row justify-content-center">
          <div class="col-md-8">
              <div class="card shadow">
                  <div class="card-header bg-white py-3">
                      <h6 class="m-0 font-weight-bold text-primary">Configure Allocation</h6>
                  </div>
                  <div class="card-body">
                      <form id="leaveBalanceForm">
                          <div class="row mb-3">
                              <div class="col-md-6">
                                  <label class="form-label">Year <span class="text-danger">*</span></label>
                                  <select class="form-select" id="balanceYear">
                                      <option value="2025">2025</option>
                                      <option value="2026" selected>2026</option>
                                      <option value="2027">2027</option>
                                  </select>
                              </div>
                              <div class="col-md-6">
                                  <label class="form-label">Department (Optional Filter)</label>
                                  <select class="form-select" id="balanceDept">
                                      <option value="">All Departments</option>
                                      <option>Engineering</option>
                                      <option>HR</option>
                                      <option>Finance</option>
                                      <option>Sales</option>
                                  </select>
                              </div>
                          </div>

                          <div class="mb-3">
                              <label class="form-label">Employee <span class="text-danger">*</span></label>
                              <select class="form-select" id="balanceEmpId">
                                  <option value="">Select Employee</option>
                                  <option value="ALL">ALL EMPLOYEES (Bulk Allocation)</option>
                              </select>
                              <small class="text-muted">Select 'ALL' to apply this balance to everyone in the selected department (or all staff).</small>
                          </div>

                          <hr>

                          <h6 class="text-primary mb-3">Leave Entitlements</h6>
                          
                          <div class="row mb-2">
                              <div class="col-md-4">
                                  <label class="form-label">Casual Leave</label>
                                  <input type="number" class="form-control balance-input" data-type="Casual" value="14">
                              </div>
                              <div class="col-md-4">
                                  <label class="form-label">Medical Leave</label>
                                  <input type="number" class="form-control balance-input" data-type="Medical" value="14">
                              </div>
                              <div class="col-md-4">
                                  <label class="form-label">Earned Leave</label>
                                  <input type="number" class="form-control balance-input" data-type="Earned" value="14">
                              </div>
                          </div>
                          
                          <div class="row mb-3">
                              <div class="col-md-4">
                                  <label class="form-label">Maternity (Female)</label>
                                  <input type="number" class="form-control balance-input" data-type="Maternity" value="0">
                              </div>
                              <!-- Add more types if needed -->
                          </div>

                          <div class="d-flex justify-content-end gap-2 mt-4">
                              <button type="button" class="btn btn-success" id="btnSaveBalance">
                                  <i class="fas fa-save me-1"></i> Save Allocation
                              </button>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(() => AppController.initLeaveBalanceAdd());
    </script>
  </body>
</html>
