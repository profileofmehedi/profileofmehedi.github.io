<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Period</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-size: 14px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #eee; padding: 15px; }
        .page-title { color: #007bff; font-weight: bold; margin: 0; }
        .btn-back { background-color: #17a2b8; color: white; float: right; }
        .form-label { font-weight: 600; font-size: 13px; }
        .required { color: red; }
        .btn-custom-green { background-color: #28a745; color: white; border: none; }
        .btn-custom-green:hover { background-color: #218838; color: white; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="page-title">Salary Period</h5>
                <button class="btn btn-sm btn-back"><i class="fas fa-angles-left"></i> Back</button>
            </div>
        </div>
        <div class="card-body">
            <form id="periodForm">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Type <span class="required">*</span></label>
                        <select class="form-select">
                            <option>Salary</option>
                            <option>Bonus</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Month Name <span class="required">*</span></label>
                        <select class="form-select" id="monthSelect">
                            <option>January</option>
                            <option>February</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Salary Year <span class="required">*</span></label>
                        <select class="form-select" id="yearSelect">
                            <option>2025</option>
                            <option>2026</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Period Name <span class="required">*</span></label>
                        <input type="text" class="form-control" id="periodName" value="Salary-January-2025" readonly>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Tax Year <span class="required">*</span></label>
                        <select class="form-select">
                            <option>2019-2020</option>
                            <option>2025-2026</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Working Days <span class="required">*</span></label>
                        <input type="number" class="form-control" value="31">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Narration <span class="required">*</span></label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Affected Period Name</label>
                        <select class="form-select">
                            <option>Salary-October-2025</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="reset" class="btn btn-custom-green">Reset</button>
                    <button type="button" class="btn btn-custom-green">Merge</button>
                    <button type="submit" class="btn btn-custom-green"><i class="fas fa-save"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        // Simple script to auto-update Period Name based on Month/Year
        $('#monthSelect, #yearSelect').change(function() {
            let m = $('#monthSelect').val();
            let y = $('#yearSelect').val();
            $('#periodName').val(`Salary-${m}-${y}`);
        });
    });
</script>
</body>
</html>
