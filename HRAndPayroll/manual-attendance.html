<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manual Attendance Entry - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="d-flex">
      <nav id="sidebar" class="sidebar bg-white border-end"></nav>
      <div class="flex-grow-1">
        <header id="topbar" class="topbar bg-light border-bottom"></header>
        <main class="main-content container py-4">
          <div class="page-header mb-4">
            <h3 class="page-title">
              <i class="fas fa-user-edit me-2"></i>Manual Attendance Entry
            </h3>
          </div>
          <div class="card shadow mb-4">
            <div class="card-body">
              <form id="manualAttendanceForm">
                <div class="row g-3 align-items-end">
                  <div class="col-md-3">
                    <label class="form-label">Date *</label>
                    <input
                      type="date"
                      class="form-control"
                      id="manualAttDate"
                      required
                    />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Department</label>
                    <select class="form-select" id="manualAttDept">
                      <option value="">All Departments</option>
                      <option value="Finance">Finance</option>
                      <option value="HR">HR</option>
                      <option value="Engineering">Engineering</option>
                      <option value="Marketing">Marketing</option>
                      <option value="Sales">Sales</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Employee *</label>
                    <select
                      class="form-select"
                      id="manualAttEmp"
                      required
                    ></select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Status *</label>
                    <select class="form-select" id="manualAttStatus" required>
                      <option value="Present">Present</option>
                      <option value="Late">Late</option>
                      <option value="Half Day">Half Day</option>
                      <option value="On Leave">On Leave</option>
                      <option value="Absent">Absent</option>
                    </select>
                  </div>
                </div>
                <div class="row g-3 mt-2">
                  <div class="col-md-3">
                    <label class="form-label">Check In *</label>
                    <input
                      type="time"
                      class="form-control"
                      id="manualAttCheckIn"
                      required
                    />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Check Out *</label>
                    <input
                      type="time"
                      class="form-control"
                      id="manualAttCheckOut"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Notes</label>
                    <input
                      type="text"
                      class="form-control"
                      id="manualAttNotes"
                      placeholder="Optional notes..."
                    />
                  </div>
                </div>
                <div class="mt-4">
                  <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Submit Attendance
                  </button>
                  <button type="reset" class="btn btn-secondary ms-2">
                    Reset
                  </button>
                </div>
              </form>
            </div>
          </div>
          <div class="alert alert-info mt-4">
            <i class="fas fa-info-circle"></i> This page is for manual
            attendance entry only. To view all attendance records, go to the
            Attendance Log page.
          </div>
        </main>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(function () {
        // Render sidebar and topbar
        if (typeof AppLayout !== "undefined") {
          $("#sidebar").html(AppLayout.render("manual-attendance"));
          $("#topbar").html(`
                <div class="container-fluid d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-link d-md-none" id="sidebarToggle"><i class="fa fa-bars"></i></button>
                        <span class="fw-bold text-primary">Manual Attendance Entry</span>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-muted small">${localStorage.getItem("userName") || "Admin"}</span>
                        <img src="assets/img/user.png" alt="User" class="rounded-circle" width="32" height="32">
                    </div>
                </div>
            `);
        }
        // Populate employee dropdown
        function populateManualEmpDropdown() {
          const dept = $("#manualAttDept").val();
          let emps = AppServices.getEmployees();
          if (dept) emps = emps.filter((e) => e.dept === dept);
          let options = '<option value="">Select Employee</option>';
          emps.forEach((e) => {
            options += `<option value="${e.id}">${e.firstName} ${e.lastName} (${e.employeeId || e.id})</option>`;
          });
          $("#manualAttEmp").html(options);
        }
        populateManualEmpDropdown();
        $("#manualAttDept").on("change", populateManualEmpDropdown);

        // Handle form submit
        $("#manualAttendanceForm").on("submit", function (e) {
          e.preventDefault();
          const empId = $("#manualAttEmp").val();
          const emp = AppServices.getEmployeeById(empId);
          if (!emp) {
            alert("Please select an employee.");
            return;
          }
          const date = $("#manualAttDate").val();
          const checkIn = $("#manualAttCheckIn").val();
          const checkOut = $("#manualAttCheckOut").val();
          const status = $("#manualAttStatus").val();
          const notes = $("#manualAttNotes").val();
          if (!date || !checkIn || !checkOut || !status) {
            alert("Please fill all required fields.");
            return;
          }
          // Calculate work hours
          const hours = calculateWorkHours(checkIn, checkOut);
          AppServices.addAttendance({
            emp: `${emp.firstName} ${emp.lastName}`,
            empId: emp.employeeId || emp.id,
            dept: emp.dept,
            date: date,
            in: checkIn,
            out: checkOut,
            hours: hours,
            status: status,
            notes: notes,
            source: "manual",
          });
          alert("Attendance submitted!");
          $("#manualAttendanceForm")[0].reset();
        });
      });
    </script>
  </body>
</html>
