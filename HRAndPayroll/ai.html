<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights - HR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="main-content">
        <div class="page-header"><h3 class="page-title">AI Insights & Chat</h3></div>
        <div class="row">
            <div class="col-md-4">
                <div class="card bg-primary text-white p-4 mb-4">
                    <h4><i class="fa-solid fa-robot"></i> Prediction</h4>
                    <p>Retention risk is currently LOW. Employees in Engineering are showing high engagement scores.</p>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow" style="height: 500px;">
                    <div class="card-header bg-white">Chat with HR Assistant</div>
                    <div class="card-body d-flex flex-column">
                        <div id="aiChatBox" class="flex-grow-1 overflow-auto mb-3" style="border:1px solid #eee; padding: 15px; border-radius: 5px;">
                            <div class="text-start mb-2"><span class="d-inline-block p-2 rounded bg-light text-dark border">Hello! I am your AI HR Assistant. Ask me about payroll, employees, or leave stats.</span></div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="aiInput" class="form-control" placeholder="Type a message...">
                            <button class="btn btn-primary" id="btnAiSend"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>$(document).ready(() => AppController.initAI());</script>
</body>
</html>
