<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll Configuration - HR Pro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
        .bg-light-yellow { background-color: #fffcf0; padding: 20px; border-radius: 5px; border: 1px solid #eee; margin-bottom: 20px; }
        .table-head-blue { background-color: #d1ecf1; color: #0c5460; }
        .table-head-red { background-color: #f8d7da; color: #721c24; }
        .row-blue { background-color: #f0f7ff; }
        .row-red { background-color: #fff5f5; }
        .total-bar { background-color: #17a2b8; color: white; font-weight: bold; text-align: right; }
    </style>
  </head>
  <body>
    <div class="main-content">
      <div class="page-header">
        <h3 class="page-title">
          <i class="fas fa-cogs me-2"></i>Payroll Configuration
        </h3>
      </div>

      <!-- Navigation Tabs -->
      <ul class="nav nav-tabs mb-4" id="payrollTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="head-tab" data-bs-toggle="tab" data-bs-target="#tab-head" type="button"><i class="fas fa-list me-2"></i>Salary Heads</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="structure-tab" data-bs-toggle="tab" data-bs-target="#tab-structure" type="button"><i class="fas fa-users-cog me-2"></i>Salary Structure</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="period-tab" data-bs-toggle="tab" data-bs-target="#tab-period" type="button"><i class="fas fa-calendar-alt me-2"></i>Salary Period</button>
        </li>
      </ul>

      <div class="tab-content">
        
        <!-- TAB 1: SALARY HEADS -->
        <div class="tab-pane fade show active" id="tab-head">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form id="formSalaryHead">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Head Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="headName" placeholder="e.g. Basic Salary">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Head Code <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="headCode" placeholder="e.g. 1001">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Head Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="headType">
                                    <option value="Earning">Earning (Addition)</option>
                                    <option value="Deduction">Deduction</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Sort Order</label>
                                <input type="number" class="form-control" id="headSort" value="1">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">Is Income Tax?</label>
                                <select class="form-select" id="headTax">
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Is Investment?</label>
                                <select class="form-select" id="headInvest">
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-success" id="btnSaveHead"><i class="fas fa-save me-1"></i> Save Head</button>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <h5 class="text-primary mb-3">Salary Head List</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped" id="tableHeads">
                            <thead class="table-light">
                                <tr>
                                    <th>Code</th>
                                    <th>Head Name</th>
                                    <th>Type</th>
                                    <th>Taxable</th>
                                    <th>Sort</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: SALARY STRUCTURE -->
        <div class="tab-pane fade" id="tab-structure">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <!-- Employee Search -->
                    <div class="row mb-4 align-items-end">
                        <div class="col-md-6">
                            <label class="form-label">Select Employee</label>
                            <div class="input-group">
                                <select class="form-select" id="structEmpSelect">
                                    <option value="">Choose Employee...</option>
                                </select>
                                <button class="btn btn-primary" id="btnLoadStruct"><i class="fas fa-search"></i> Load</button>
                            </div>
                        </div>
                    </div>

                    <div id="structureEditor" style="display:none;">
                        <!-- Employee Info -->
                        <div class="bg-light-yellow">
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="small text-muted">Name</label>
                                    <div class="fw-bold" id="infoName">-</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="small text-muted">Designation</label>
                                    <div class="fw-bold" id="infoDesig">-</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="small text-muted">Department</label>
                                    <div class="fw-bold" id="infoDept">-</div>
                                </div>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Salary Grade</label>
                                    <input type="text" class="form-control form-control-sm" id="structGrade" placeholder="e.g. Grade 1">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Effective Date</label>
                                    <input type="date" class="form-control form-control-sm" id="structDate">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Bank Name</label>
                                    <input type="text" class="form-control form-control-sm" id="structBank">
                                </div>
                            </div>
                        </div>

                        <!-- Additions / Deductions Columns -->
                        <div class="row">
                            <div class="col-md-6">
                                <h6 class="text-success border-bottom pb-2">Additions (Earnings)</h6>
                                <table class="table table-sm table-bordered">
                                    <thead class="table-head-blue">
                                        <tr>
                                            <th>Head Name</th>
                                            <th width="150">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bodyAdditions"></tbody>
                                    <tfoot>
                                        <tr class="total-bar">
                                            <td>Total Addition</td>
                                            <td id="totalAdditions">0.00</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-danger border-bottom pb-2">Deductions</h6>
                                <table class="table table-sm table-bordered">
                                    <thead class="table-head-red">
                                        <tr>
                                            <th>Head Name</th>
                                            <th width="150">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bodyDeductions"></tbody>
                                    <tfoot>
                                        <tr class="total-bar bg-danger">
                                            <td>Total Deduction</td>
                                            <td id="totalDeductions">0.00</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3 p-3 border bg-light">
                            <h5 class="mb-0">Net Salary: <span id="netSalary" class="text-primary">0.00</span></h5>
                            <button class="btn btn-success px-4" id="btnSaveStructure"><i class="fas fa-save me-2"></i> Save Structure</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 3: SALARY PERIOD -->
        <div class="tab-pane fade" id="tab-period">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form id="formPeriod">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Month <span class="text-danger">*</span></label>
                                <select class="form-select" id="periodMonth">
                                    <option>January</option>
                                    <option>February</option>
                                    <option>March</option>
                                    <option>April</option>
                                    <option>May</option>
                                    <option>June</option>
                                    <option>July</option>
                                    <option>August</option>
                                    <option>September</option>
                                    <option>October</option>
                                    <option>November</option>
                                    <option>December</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Year <span class="text-danger">*</span></label>
                                <select class="form-select" id="periodYear">
                                    <option>2025</option>
                                    <option>2026</option>
                                    <option>2027</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Period Name</label>
                                <input type="text" class="form-control bg-light" id="periodName" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tax Year</label>
                                <select class="form-select" id="periodTaxYear">
                                    <option>2025-2026</option>
                                    <option>2026-2027</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Working Days</label>
                                <input type="number" class="form-control" id="periodDays" value="30">
                            </div>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-primary" id="btnSavePeriod"><i class="fas fa-plus-circle me-1"></i> Create Period</button>
                        </div>
                    </form>

                    <h5 class="text-primary mt-4 mb-3">Existing Periods</h5>
                    <table class="table table-bordered table-hover" id="tablePeriods">
                        <thead class="table-light">
                            <tr>
                                <th>Period Name</th>
                                <th>Month/Year</th>
                                <th>Working Days</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      $(document).ready(() => AppController.initPayrollSetup());
    </script>
  </body>
</html>
