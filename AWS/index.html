<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AWS Certified Solutions Architect (SAA-C03) & Cloud Practitioner | আলটিমেট মাস্টারক্লাস এনসাইক্লোপিডিয়া</title>

  <!-- Kalpurush & Google Bengali Fonts -->
  <link rel="stylesheet" href="https://fonts.maateen.me/kalpurush/font.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables for Dark Theme */
    :root[data-theme="dark"] {
      --bg-body: #070c18;
      --bg-header: rgba(15, 23, 42, 0.95);
      --bg-sidebar: #0e1628;
      --bg-surface: #1e293b;
      --bg-card: #121b2d;
      --bg-card-inner: #19253a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --aws-orange: #ff9900;
      --aws-amber: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      
      --svg-bg: #090f1d;
      --svg-rect-bg: #1e293b;
      --svg-rect-inner: #0f172a;
      --svg-stroke: #334155;
      --svg-text: #cbd5e1;
      --code-bg: #050a14;
      --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    /* CSS Variables for Light Theme */
    :root[data-theme="light"] {
      --bg-body: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.96);
      --bg-sidebar: #ffffff;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-inner: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --aws-orange: #ea580c;
      --aws-amber: #d97706;
      --accent-cyan: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-blue: #2563eb;
      --accent-purple: #9333ea;
      
      --svg-bg: #f8fafc;
      --svg-rect-bg: #ffffff;
      --svg-rect-inner: #edf2f7;
      --svg-stroke: #cbd5e1;
      --svg-text: #334155;
      --code-bg: #1e293b;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Kalpurush', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.25s, color 0.25s;
    }

    /* Header */
    .master-header {
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .menu-toggle-btn:hover {
      border-color: var(--aws-orange);
      color: var(--aws-orange);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Theme Button */
    .theme-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--aws-orange);
    }

    .global-progress {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    /* Top Progress Fill */
    .top-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border-color);
      position: sticky;
      top: 57px;
      z-index: 99;
    }

    .top-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--aws-orange), var(--accent-green));
      width: 2.5%;
      transition: width 0.3s ease;
    }

    /* Layout */
    .master-layout {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* Sidebar Drawer */
    .sidebar-drawer {
      width: 330px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 61px);
      position: sticky;
      top: 61px;
      overflow-y: auto;
      transition: transform 0.3s ease, margin-left 0.3s ease;
      z-index: 90;
    }

    .sidebar-drawer.closed {
      margin-left: -330px;
    }

    .sidebar-search {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--aws-orange);
    }

    .module-list {
      list-style: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .module-item {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .module-item:hover {
      background: var(--bg-card-inner);
      border-color: var(--border-color);
    }

    .module-item.active {
      background: rgba(255, 153, 0, 0.12);
      border-color: var(--aws-orange);
      color: var(--aws-orange);
      font-weight: 700;
    }

    .module-item-icon {
      font-size: 1.2rem;
      min-width: 26px;
      text-align: center;
    }

    .module-item-content h3 {
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .module-item-content span {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* Content Stage */
    .content-stage {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
    }

    .slide-wrapper {
      max-width: 1180px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s, border-color 0.25s;
    }

    .slide-body {
      padding: 30px 36px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .slide-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .badge-mod {
      background: rgba(255, 153, 0, 0.15);
      color: var(--aws-orange);
      border: 1px solid var(--aws-orange);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .slide-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .slide-subtitle {
      font-size: 1.02rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* 2-Column Grid */
    .slide-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: stretch;
      flex: 1;
    }

    .theory-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .concept-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .concept-card h4 {
      font-size: 1.05rem;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .concept-card p, .concept-card li {
      font-size: 0.98rem;
      color: var(--text-main);
      line-height: 1.65;
    }

    .concept-card ul, .concept-card ol {
      padding-left: 20px;
      margin-top: 6px;
    }

    .alert-box {
      border-left: 4px solid var(--aws-orange);
      background: rgba(255, 153, 0, 0.08);
      padding: 12px 16px;
      border-radius: 0 10px 10px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .alert-box.danger {
      border-left-color: var(--accent-red);
      background: rgba(239, 68, 68, 0.08);
    }

    .alert-box.success {
      border-left-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.08);
    }

    /* Infographic Frame */
    .infographic-frame {
      background: var(--svg-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .infographic-tag {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.7rem;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      font-weight: bold;
    }

    svg {
      max-width: 100%;
      height: auto;
    }

    /* Controller Bar */
    .stage-controller {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btns {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: var(--bg-card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--aws-orange);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      border-color: var(--border-color);
    }

    .btn-primary {
      background: var(--aws-orange);
      color: #fff;
      border-color: var(--aws-orange);
    }

    .btn-primary:hover {
      background: var(--aws-amber);
      box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
    }

    .dots-nav {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .dot-item {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-color);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot-item.active {
      background: var(--aws-orange);
      width: 24px;
      border-radius: 8px;
    }

    .swipe-notice {
      display: none;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 6px;
    }

    /* Mobile Responsive */
    @media (max-width: 960px) {
      .sidebar-drawer {
        position: fixed;
        left: 0;
        top: 61px;
        bottom: 0;
        height: auto;
        transform: translateX(0);
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      }

      .sidebar-drawer.closed {
        transform: translateX(-100%);
        margin-left: 0;
      }

      .content-stage {
        padding: 14px 10px;
      }

      .slide-body {
        padding: 20px 16px;
      }

      .slide-title {
        font-size: 1.35rem;
      }

      .slide-subtitle {
        font-size: 0.92rem;
        margin-bottom: 16px;
      }

      .slide-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .infographic-frame {
        order: -1;
      }

      .stage-controller {
        padding: 12px 16px;
        flex-direction: column-reverse;
        gap: 12px;
      }

      .ctrl-btns {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }

      .btn {
        flex: 1;
        justify-content: center;
      }

      .swipe-notice {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Top Classroom Master Header -->
  <header class="master-header">
    <div class="header-left">
      <button class="menu-toggle-btn" onclick="toggleSidebar()" title="মডিউল তালিকা খুলুন / বন্ধ করুন">
        <span>☰</span> <span id="sidebar-btn-text">মডিউলসমূহ</span>
      </button>

      <div class="brand-title">
        <h1>☁️ AWS আর্কিটেক্ট মাস্টারক্লাস এনসাইক্লোপিডিয়া</h1>
        <p>১৪টি সম্পূর্ণ মডিউল • ৪২টি মাস্টারক্লাস স্লাইড • ১০০% সিলেবাস কভারেজ</p>
      </div>

    <div class="header-right">

      </button>

      <div class="global-progress" id="module-counter-badge">মডিউল ১ / ১৪</div>
    </div>
  </header>

  <!-- Progress Bar Under Header -->
  <div class="top-progress-bar">
    <div class="top-progress-fill" id="top-progress-fill"></div>
  </div>

  <div class="swipe-notice">
    👉 স্ক্রিনে বামে বা ডানে সোয়াইপ (Swipe) করে স্লাইড পরিবর্তন করুন
  </div>

  <!-- Master Layout -->
  <div class="master-layout">

    <!-- Sidebar Drawer: All 14 Modules -->
    <aside class="sidebar-drawer" id="sidebar-drawer">
      <div class="sidebar-search">
        <input type="text" class="search-input" id="search-input" placeholder="🔍 সার্ভিস বা টপিক খুঁজুন (যেমন: ECS, S3, Aurora, VPC, DX)..." oninput="filterModules()">
      </div>
      <ul class="module-list" id="module-list">
        <!-- Rendered via JS -->
      </ul>
    </aside>

    <!-- Main Content Stage -->
    <main class="content-stage">
      <div class="slide-wrapper" id="slide-wrapper">
        <div class="slide-body" id="slide-body">
          <!-- Dynamic Content Rendered Here -->
        </div>

        <!-- Controller Bar -->
        <footer class="stage-controller">
          <div class="ctrl-btns">
            <button class="btn" id="prev-btn" onclick="prevSlide()">← পূর্ববর্তী</button>
            <button class="btn btn-primary" id="next-btn" onclick="nextSlide()">পরবর্তী →</button>
          </div>

          <div class="dots-nav" id="dots-nav">
            <!-- Dynamic Dots -->
          </div>
        </footer>
      </div>
    </main>

  </div>

  <script>
    // =========================================================================
    // EXHAUSTIVE 14-MODULE CURRICULUM WITH 42 IN-DEPTH SLIDES (ZERO TOPICS OMITTED)
    // =========================================================================
    const banglaNumbers = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    function toBn(num) {
      return num.toString().split('').map(d => banglaNumbers[d] || d).join('');
    }

    const courseData = [

            theory: `

                  <li><strong>Principle of Least Privilege:</strong> একজন ইউজারকে ঠিক যতটুকু অধিকার দেওয়া প্রয়োজন, তার বেশি এক বিন্দুও নয়।</li>
                </ul>
              </div>
              <div class="alert-box success">

              </div>
            `,
            svg: `

                <circle cx="70" cy="72" r="12" fill="#38bdf8"/>

                <text x="70" y="115" text-anchor="middle" fill="var(--svg-text)" font-size="10">User Request</text>
                
                <rect x="150" y="45" width="100" height="110" rx="8" fill="var(--svg-rect-bg)" stroke="var(--aws-orange)" stroke-width="2"/>
                <text x="200" y="70" text-anchor="middle" fill="var(--aws-orange)" font-size="12" font-weight="bold">IAM GATE</text>
                <text x="200" y="95" text-anchor="middle" fill="var(--svg-text)" font-size="9">Authentication</text>

                <path d="M255 75 L310 55" stroke="#10b981" stroke-width="2"/>

                <text x="335" y="58" text-anchor="middle" fill="#10b981" font-size="9" font-weight="bold">S3 OK</text>

                <path d="M255 105 L310 125" stroke="#ef4444" stroke-width="2"/>

                <rect x="290" y="40" width="70" height="180" rx="6" fill="var(--svg-rect-bg)" stroke="#ef4444"/>
                <text x="325" y="70" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">Active-Active</text>
                <text x="325" y="110" text-anchor="middle" fill="var(--svg-text)" font-size="8">Zero RTO</text>
                <text x="325" y="180" text-anchor="middle" fill="#ef4444" font-size="9">$$$$ Pricey</text>
              </svg>
            `
          },
          {
            title: "পরীক্ষার চূড়ান্ত এলিমিনেশন হ্যাকস ও কি-ওয়ার্ড ট্রিকস",
            desc: "৬৫টি প্রশ্নের প্রতিটিতে সঠিক উত্তর চিহ্নিত করার গোপন টেকনিক।",
            theory: `
              <div class="concept-card">
                <h4>🎯 গোল্ডেন এলিমিনেশন রুলস:</h4>
                <ul>
                  <li><strong>"Least Operational Overhead":</strong> যেকোনো স্ব-পরিচালিত EC2 স্ক্রিপ্ট বা ক্রনজব বাদ দিয়ে দিন! উত্তর হবে AWS Managed/Serverless সার্ভিস (S3, Lambda, Aurora)।</li>
                  <li><strong>"Most Cost-Effective":</strong> হাই-এন্ড প্রোভিশন্ড ডিস্ক বা মাল্টি-সাইট অপশন বাদ দিন। উত্তর হবে Spot Instance, S3 Intelligent-Tiering বা Serverless।</li>
                  <li><strong>"Near Real-Time Analytics":</strong> Kinesis Data Streams বা Firehose উত্তর হবে; ব্যাচ প্রসেসিং বা সাধারণ SQS বাদ পড়বে।</li>
                </ul>
              </div>
              <div class="alert-box success">
                <strong>🎓 অল দ্য বেস্ট:</strong> প্রতিদিন ২ ঘণ্টা প্র্যাকটিস করুন এবং মক টেস্টে ভুল হওয়া প্রতিটি প্রশ্ন রিভিউ করুন। আপনি অবশ্যই পাস করবেন!
              </div>
            `,
            svg: `
              <svg viewBox="0 0 400 280" width="100%">
                <rect x="15" y="15" width="370" height="250" rx="12" fill="var(--svg-bg)" stroke="var(--svg-stroke)"/>
                <rect x="35" y="40" width="330" height="50" rx="8" fill="var(--svg-rect-bg)" stroke="#10b981"/>
                <text x="50" y="65" fill="#10b981" font-size="11" font-weight="bold">1. Read the LAST Sentence first</text>
                <text x="50" y="80" fill="var(--svg-text)" font-size="9">মূল প্রশ্নটি আগে পড়লে বড় প্যারাগ্রাফের অপ্রয়োজনীয় তথ্য বাদ দেওয়া সহজ হয়</text>

                <rect x="35" y="105" width="330" height="50" rx="8" fill="var(--svg-rect-bg)" stroke="#38bdf8"/>
                <text x="50" y="130" fill="#38bdf8" font-size="11" font-weight="bold">2. Eliminate 2 Obvious Wrong Options</text>
                <text x="50" y="145" fill="var(--svg-text)" font-size="9">যে দুটি অপশন AWS বেস্ট প্র্যাকটিসের পরিপন্থী, সেগুলোকে প্রথমেই কেটে ফেলুন</text>

                <rect x="35" y="170" width="330" height="60" rx="8" fill="var(--svg-rect-bg)" stroke="var(--aws-orange)"/>
                <text x="50" y="195" fill="var(--aws-orange)" font-size="11" font-weight="bold">3. Time Budget: 2 Minutes Per Question</text>
                <text x="50" y="215" fill="var(--svg-text)" font-size="9">কোনো প্রশ্নে আটকে গেলে ফ্ল্যাগ (Flag) করে এগিয়ে যান। সময় নষ্ট করবেন না!</text>
              </svg>
            `
          }
        ]
      }
    ];

    // State
    let currentModuleIndex = 0;
    let currentSlideIndex = 0;

    // Render Module List in Sidebar
    function renderModuleList() {
      const listEl = document.getElementById('module-list');
      listEl.innerHTML = courseData.map((mod, idx) => `
        <li class="module-item ${idx === currentModuleIndex ? 'active' : ''}" onclick="selectModule(${idx})">
          <div class="module-item-icon">${mod.icon}</div>
          <div class="module-item-content">
            <h3>মডিউল ${toBn(idx + 1)}: ${mod.title}</h3>
            <span>${mod.short}</span>
          </div>
        </li>
      `).join('');
    }

    // Render Current Slide
    function renderSlide() {
      const mod = courseData[currentModuleIndex];
      const slide = mod.slides[currentSlideIndex];
      const bodyEl = document.getElementById('slide-body');

      bodyEl.innerHTML = `
        <div class="slide-breadcrumb">
          <span class="badge-mod">${mod.icon} মডিউল ${toBn(currentModuleIndex + 1)}</span>
          <span>•</span>
          <span>স্লাইড ${toBn(currentSlideIndex + 1)} / ${toBn(mod.slides.length)}</span>
        </div>
        <h2 class="slide-title">${slide.title}</h2>
        <p class="slide-subtitle">${slide.desc}</p>

        <div class="slide-grid">
          <div class="theory-box">
            ${slide.theory}
          </div>
          <div class="infographic-frame">
            <span class="infographic-tag">ARCHITECTURE DIAGRAM</span>
            ${slide.svg}
          </div>
        </div>
      `;

      // Update Dots Navigation
      const dotsNav = document.getElementById('dots-nav');
      dotsNav.innerHTML = mod.slides.map((_, idx) => `
        <div class="dot-item ${idx === currentSlideIndex ? 'active' : ''}" onclick="goToSlide(${idx})"></div>
      `).join('');

      // Update Controls
      document.getElementById('prev-btn').disabled = (currentModuleIndex === 0 && currentSlideIndex === 0);
      const nextBtn = document.getElementById('next-btn');
      const isLastSlide = (currentModuleIndex === courseData.length - 1 && currentSlideIndex === mod.slides.length - 1);
      nextBtn.innerText = isLastSlide ? 'কোর্স সম্পন্ন 🎓' : 'পরবর্তী →';

      // Update Top Progress Bar
      let totalSlidesCount = 0;
      let completedCount = 0;
      courseData.forEach((m, mIdx) => {
        m.slides.forEach((_, sIdx) => {
          totalSlidesCount++;
          if (mIdx < currentModuleIndex || (mIdx === currentModuleIndex && sIdx <= currentSlideIndex)) {
            completedCount++;
          }
        });
      });
      const pct = Math.round((completedCount / totalSlidesCount) * 100);
      document.getElementById('top-progress-fill').style.width = pct + '%';
      document.getElementById('module-counter-badge').innerText = `মডিউল ${toBn(currentModuleIndex + 1)} / ${toBn(courseData.length)} (${toBn(pct)}%)`;

      renderModuleList();
    }

    // Navigation Logic
    function selectModule(index) {
      currentModuleIndex = index;
      currentSlideIndex = 0;
      renderSlide();
      if (window.innerWidth <= 960) {
        toggleSidebar(false);
      }
    }

    function nextSlide() {
      const mod = courseData[currentModuleIndex];
      if (currentSlideIndex < mod.slides.length - 1) {
        currentSlideIndex++;
        renderSlide();
      } else if (currentModuleIndex < courseData.length - 1) {
        currentModuleIndex++;
        currentSlideIndex = 0;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide();
      } else if (currentModuleIndex > 0) {
        currentModuleIndex--;
        currentSlideIndex = courseData[currentModuleIndex].slides.length - 1;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentSlideIndex = idx;
      renderSlide();
    }

    // Sidebar Toggle
    function toggleSidebar(forceState) {
      const drawer = document.getElementById('sidebar-drawer');
      if (typeof forceState === 'boolean') {
        drawer.classList.toggle('closed', !forceState);
      } else {
        drawer.classList.toggle('closed');
      }
    }

    // Search filter for modules
    function filterModules() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const items = document.querySelectorAll('.module-item');
      courseData.forEach((mod, idx) => {
        const text = (mod.title + " " + mod.short).toLowerCase();
        if (text.includes(query)) {
          items[idx].style.display = 'flex';
        } else {
          items[idx].style.display = 'none';
        }
      });
    }

    // Theme Switcher
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', target);
      localStorage.setItem('aws_master_theme', target);
      updateThemeBtn(target);
    }

    function updateThemeBtn(theme) {
      document.getElementById('theme-icon').innerText = theme === 'light' ? '🌙' : '☀️';
      document.getElementById('theme-text').innerText = theme === 'light' ? 'ডার্ক' : 'লাইট';
    }

    // Touch Swipe for Mobile
    let touchStartX = 0;
    let touchEndX = 0;
    const stage = document.getElementById('slide-wrapper');

    stage.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX - touchStartX < -45) nextSlide();
      if (touchEndX - touchStartX > 45) prevSlide();
    }, { passive: true });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key.toLowerCase() === 'm') toggleSidebar();
    });

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('aws_master_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtn(savedTheme);

      renderModuleList();
      renderSlide();
    });
  </script>
</body>
</html>
