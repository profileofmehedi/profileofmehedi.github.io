<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AWS Certified Solutions Architect (SAA-C03) & Cloud Practitioner | আলটিমেট মাস্টারক্লাস এনসাইক্লোপিডিয়া</title>

  <!-- Google Bengali Fonts: Hind Siliguri, Noto Sans Bengali & Kalpurush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.maateen.me/kalpurush/font.css">

  <style>
    /* CSS Variables for Dark Theme */
    :root[data-theme="dark"] {
      --bg-body: #070c18;
      --bg-header: rgba(15, 23, 42, 0.95);
      --bg-sidebar: #0e1628;
      --bg-surface: #1e293b;
      --bg-card: #121b2d;
      --bg-card-inner: #19253a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --aws-orange: #ff9900;
      --aws-amber: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      
      --svg-bg: #090f1d;
      --svg-rect-bg: #1e293b;
      --svg-rect-inner: #0f172a;
      --svg-stroke: #334155;
      --svg-text: #cbd5e1;
      --code-bg: #050a14;
      --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    /* CSS Variables for Light Theme */
    :root[data-theme="light"] {
      --bg-body: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.96);
      --bg-sidebar: #ffffff;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-inner: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --aws-orange: #ea580c;
      --aws-amber: #d97706;
      --accent-cyan: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-blue: #2563eb;
      --accent-purple: #9333ea;
      
      --svg-bg: #f8fafc;
      --svg-rect-bg: #ffffff;
      --svg-rect-inner: #edf2f7;
      --svg-stroke: #cbd5e1;
      --svg-text: #334155;
      --code-bg: #1e293b;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 15px;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Kalpurush', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.25s, color 0.25s;
    }

    /* Header */
    .master-header {
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 14px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .menu-toggle-btn:hover {
      border-color: var(--aws-orange);
      color: var(--aws-orange);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title h1 {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
    }

    .brand-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Font Size Zoom Controller */
    .font-zoom-group {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 2px 4px;
      gap: 2px;
    }

    .font-zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .font-zoom-btn:hover {
      background: var(--bg-card-inner);
      color: var(--aws-orange);
    }

    /* Theme Button */
    .theme-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--aws-orange);
    }

    .global-progress {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 6px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    /* Top Progress Fill */
    .top-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border-color);
      position: sticky;
      top: 60px;
      z-index: 99;
    }

    .top-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--aws-orange), var(--accent-green));
      width: 1%;
      transition: width 0.3s ease;
    }

    /* Layout */
    .master-layout {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* Sidebar Drawer */
    .sidebar-drawer {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
      position: sticky;
      top: 65px;
      overflow-y: auto;
      transition: transform 0.3s ease, margin-left 0.3s ease;
      z-index: 90;
    }

    .sidebar-drawer.closed {
      margin-left: -320px;
    }

    .sidebar-search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 8px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--aws-orange);
    }

    .module-list {
      list-style: none;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .module-item {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .module-item:hover {
      background: var(--bg-card-inner);
      border-color: var(--border-color);
    }

    .module-item.active {
      background: rgba(255, 153, 0, 0.12);
      border-color: var(--aws-orange);
      color: var(--aws-orange);
      font-weight: 700;
    }

    .module-item-icon {
      font-size: 1.2rem;
      min-width: 26px;
      text-align: center;
    }

    .module-item-content h3 {
      font-size: 0.92rem;
      line-height: 1.35;
      font-weight: 600;
    }

    .module-item-content span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    /* Content Stage */
    .content-stage {
      flex: 1;
      padding: 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
    }

    .slide-wrapper {
      max-width: 1400px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s, border-color 0.25s;
    }

    .slide-body {
      padding: 24px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .slide-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .badge-mod {
      background: rgba(255, 153, 0, 0.15);
      color: var(--aws-orange);
      border: 1px solid var(--aws-orange);
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .slide-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .slide-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.55;
    }

    /* 2-Column Grid */
    .slide-grid {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 20px;
      align-items: stretch;
      flex: 1;
    }

    .theory-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .concept-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .concept-card h4 {
      font-size: 1.05rem;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .concept-card p, .concept-card li {
      font-size: 0.94rem;
      color: var(--text-main);
      line-height: 1.68;
    }

    .concept-card ul, .concept-card ol {
      padding-left: 20px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .concept-card code, .theory-box code {
      font-size: 0.86rem;
      background: rgba(255, 153, 0, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--aws-orange);
      font-family: 'Consolas', 'Monaco', monospace;
      font-weight: 600;
    }

    .alert-box {
      border-left: 4px solid var(--aws-orange);
      background: rgba(255, 153, 0, 0.08);
      padding: 12px 18px;
      border-radius: 0 10px 10px 0;
      font-size: 0.94rem;
      line-height: 1.65;
      color: var(--text-main);
    }

    .alert-box.danger {
      border-left-color: var(--accent-red);
      background: rgba(239, 68, 68, 0.09);
    }

    .alert-box.success {
      border-left-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.09);
    }

    /* Infographic Frame */
    .infographic-frame {
      background: var(--svg-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .infographic-tag {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.72rem;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.14);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.35);
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    svg {
      max-width: 100%;
      height: auto;
    }

    svg text {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
    }

    /* Controller Bar */
    .stage-controller {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .ctrl-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--bg-card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--aws-orange);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      border-color: var(--border-color);
    }

    .btn-primary {
      background: var(--aws-orange);
      color: #fff;
      border-color: var(--aws-orange);
    }

    .btn-primary:hover {
      background: var(--aws-amber);
      box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
    }

    .dots-nav {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dot-item {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--border-color);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot-item.active {
      background: var(--aws-orange);
      width: 22px;
      border-radius: 6px;
    }

    .swipe-notice {
      display: none;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 5px;
    }

    /* Enhanced Quiz & Interactive Styling */
    .exam-quiz-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px 20px;
      margin-top: 6px;
    }

    .quiz-badge {
      display: inline-block;
      background: rgba(255, 153, 0, 0.15);
      color: var(--aws-orange);
      border: 1px solid var(--aws-orange);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .quiz-question {
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 14px;
      color: var(--text-main);
      font-weight: 600;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .quiz-option {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .quiz-option:hover {
      border-color: var(--aws-orange);
      background: rgba(255, 153, 0, 0.06);
    }

    .opt-key {
      background: var(--border-color);
      color: var(--text-main);
      font-weight: bold;
      font-size: 0.85rem;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .opt-text {
      font-size: 0.94rem;
      line-height: 1.58;
      color: var(--text-main);
    }

    .quiz-option.correct {
      border-color: var(--accent-green) !important;
      background: rgba(16, 185, 129, 0.14) !important;
    }

    .quiz-option.correct .opt-key {
      background: var(--accent-green) !important;
      color: #fff !important;
    }

    .quiz-option.wrong {
      border-color: var(--accent-red) !important;
      background: rgba(239, 68, 68, 0.14) !important;
    }

    .quiz-option.wrong .opt-key {
      background: var(--accent-red) !important;
      color: #fff !important;
    }

    .quiz-feedback {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.92rem;
      line-height: 1.65;
      animation: fadeIn 0.25s ease-in;
    }

    .quiz-feedback.feedback-correct {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
    }

    .quiz-feedback.feedback-wrong {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Design */
    @media (max-width: 960px) {
      .sidebar-drawer {
        position: fixed;
        left: 0;
        top: 60px;
        bottom: 0;
        height: auto;
        transform: translateX(0);
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      }

      .sidebar-drawer.closed {
        transform: translateX(-100%);
        margin-left: 0;
      }

      .content-stage {
        padding: 14px 10px;
      }

      .slide-body {
        padding: 18px 14px;
      }

      .slide-title {
        font-size: 1.28rem;
      }

      .slide-subtitle {
        font-size: 0.88rem;
        margin-bottom: 14px;
      }

      .concept-card p, .concept-card li {
        font-size: 0.9rem;
        line-height: 1.62;
      }

      .slide-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .infographic-frame {
        order: -1;
      }

      .stage-controller {
        padding: 10px 14px;
        flex-direction: column-reverse;
        gap: 12px;
      }

      .ctrl-btns {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }

      .btn {
        flex: 1;
        justify-content: center;
        padding: 8px 14px;
        font-size: 0.88rem;
      }

      .swipe-notice {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Top Master Header -->
  <header class="master-header">
    <div class="header-left">
      <button class="menu-toggle-btn" onclick="toggleSidebar()" title="মডিউল তালিকা খুলুন / বন্ধ করুন">
        <span>☰</span> <span id="sidebar-btn-text">মডিউলসমূহ</span>
      </button>

      <div class="brand-title">
        <h1>☁️ AWS আর্কিটেক্ট মাস্টারক্লাস এনসাইক্লোপিডিয়া</h1>
        <p>১৬টি সম্পূর্ণ মডিউল • ১০৯টি এক্সাম-রেডি স্লাইড • SAA-C03 ও CLF-C02 ১০০% কভারেজ</p>
      </div>
    </div>

    <div class="header-right">
      <div class="font-zoom-group" title="লেখার আকার ছোট / বড় করুন">
        <button class="font-zoom-btn" onclick="changeFontSize(-1)" title="লেখা ছোট করুন">A−</button>
        <button class="font-zoom-btn" onclick="changeFontSize(0)" title="ডিফল্ট আকার" style="font-size: 0.74rem;">100%</button>
        <button class="font-zoom-btn" onclick="changeFontSize(1)" title="লেখা বড় করুন">A+</button>
      </div>

      <button class="theme-btn" onclick="toggleTheme()" title="থিম পরিবর্তন">
        <span id="theme-icon">☀️</span> <span id="theme-text">লাইট</span>
      </button>

      <div class="global-progress" id="module-counter-badge">মডিউল ১ / ১৬</div>
    </div>
  </header>

  <!-- Progress Bar Under Header -->
  <div class="top-progress-bar">
    <div class="top-progress-fill" id="top-progress-fill"></div>
  </div>

  <div class="swipe-notice">
    👉 স্ক্রিনে বামে বা ডানে সোয়াইপ (Swipe) করে স্লাইড পরিবর্তন করুন
  </div>

  <!-- Master Layout -->
  <div class="master-layout">

    <!-- Sidebar Drawer: All 16 Modules -->
    <aside class="sidebar-drawer" id="sidebar-drawer">
      <div class="sidebar-search">
        <input type="text" class="search-input" id="search-input" placeholder="🔍 সার্ভিস বা টপিক খুঁজুন (যেমন: ECS, S3, Aurora, VPC, DX)..." oninput="filterModules()">
      </div>
      <ul class="module-list" id="module-list">
        <!-- Rendered via JS -->
      </ul>

        "theory": "\n          <div class=\"concept-card\">\n            <h4>🏢 Service Control Policies (SCP) এর ক্ষমতা:</h4>\n            <ul>\n              <li><strong>অ্যাকাউন্ট গার্ডরেল:</strong> AWS Organizations-এ মেম্বার অ্যাকাউন্টগুলোর জন্য সর্বোচ্চ অনুমোদিত পারমিশন ঠিক করে।</li>\n              <li><strong>SCP নিজে কোনো পারমিশন দেয় না:</strong> এটি কেবল সর্বোচ্চ অনুমোদিত সীমানা (Filter) নির্ধারণ করে। মেম্বার অ্যাকাউন্টে কাজ করতে হলে IAM পলিসি দিয়ে আলাদাভাবে Allow দিতে হবে।</li>\n              <li><strong>রুট ইউজারকেও বাধা দেয়:</strong> SCP মেম্বার অ্যাকাউন্টের <strong>Root User-এর ক্ষমতাও সীমিত করতে পারে!</strong></li>\n            </ul>\n          </div>\n          <div class=\"alert-box danger\">\n            <strong>🚨 এক্সাম ট্র্যাপ:</strong> SCP কখনো মাস্টার বা ম্যানেজমেন্ট অ্যাকাউন্টের ওপর প্রযোজ্য হয় না; কেবল মেম্বার অ্যাকাউন্টে কাজ করে।\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"135\" y=\"35\" width=\"150\" height=\"45\" rx=\"6\" fill=\"var(--svg-rect-bg)\" stroke=\"var(--aws-orange)\" stroke-width=\"2\"/>\n            <text x=\"210\" y=\"62\" text-anchor=\"middle\" fill=\"var(--aws-orange)\" font-size=\"12\" font-weight=\"bold\">Master Account (SCP)</text>\n\n            <path d=\"M165 80 L95 125\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n            <path d=\"M255 80 L325 125\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n\n            <rect x=\"35\" y=\"125\" width=\"140\" height=\"85\" rx=\"8\" fill=\"var(--svg-rect-inner)\" stroke=\"#10b981\"/>\n            <text x=\"105\" y=\"152\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">Prod OU (SCP)</text>\n            <text x=\"105\" y=\"175\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"10\">Blocks S3 Delete</text>\n            <text x=\"105\" y=\"195\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"10\">Limits Even Root User</text>\n\n            <rect x=\"245\" y=\"125\" width=\"140\" height=\"85\" rx=\"8\" fill=\"var(--svg-rect-inner)\" stroke=\"#f59e0b\"/>\n            <text x=\"315\" y=\"152\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\">Dev OU (SCP)</text>\n            <text x=\"315\" y=\"175\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"10\">Limits Region to us-east-1</text>\n            <text x=\"315\" y=\"195\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"10\">Cost Guardrail</text>\n          </svg>\n        "

        "theory": "\n          <div class=\"concept-card\">\n            <h4>🛡️ Permission Boundary কেন ব্যবহার করবেন?</h4>\n            <ul>\n              <li><strong>Privilege Escalation রোধ:</strong> একজন ডেভেলপার অন্য ইউজার তৈরি করতে পারবে, কিন্তু সে নিজেকে বা অন্য কাউকে এমন পারমিশন দিতে পারবে না যা বাউন্ডারি অতিক্রম করে।</li>\n              <li>কার্যকর পারমিশন = <code>IAM Policy ∩ Permission Boundary</code> (উভয়ের ইন্টারসেকশন)।</li>\n              <li>বাউন্ডারিতে না থাকলে ইউজার পলিসিতে ফুল পারমিশন থাকলেও কাজ করবে না।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>💡 এক্সাম কি-ওয়ার্ড:</strong> <em>\"Delegate user creation without allowing privilege escalation\"</em> = <strong>Permission Boundaries</strong>।\n          </div>\n        ",

        "theory": "\n          <div class=\"concept-card\">\n            <h4>🌐 IAM Identity Center এর সুবিধা:</h4>\n            <ul>\n              <li><strong>সিঙ্গেল সাইন-অন (SSO):</strong> একজন কর্মকর্তা একটিমাত্র ইউজার আইডি ও পাসওয়ার্ড দিয়ে কোম্পানির সমস্ত AWS অ্যাকাউন্ট এবং ক্লাউড অ্যাপে (Salesforce, Google Workspace) ঢুকতে পারে।</li>\n              <li><strong>External Identity Provider (IdP):</strong> Microsoft Active Directory বা Okta-র সাথে SAML 2.0 প্রটোকলে সরাসরি ইন্টিগ্রেট করে।</li>\n              <li>প্রতি অ্যাকাউন্টে আলাদা IAM User তৈরি করার প্রয়োজন সম্পূর্ণ দূর করে।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>💡 এক্সাম হ্যাক:</strong> <em>\"Centrally manage access to multiple AWS accounts integrated with corporate Active Directory\"</em> = <strong>IAM Identity Center</strong>।\n          </div>\n        ",

        "theory": "\n          <div class=\"exam-quiz-card\">\n            <div class=\"quiz-badge\">🎯 এক্সাম সিনারিও কুইজ ১.১</div>\n            <p class=\"quiz-question\">\n              <strong>দৃশ্যপট:</strong> একটি সিকিউরিটি অডিট ফার্ম আপনার কোম্পানির AWS অ্যাকাউন্টে থাকা রিসোর্সসমূহ অডিট করতে চায়। অডিট ফার্মটি নিজস্ব AWS অ্যাকাউন্ট ব্যবহার করে। আপনার কোম্পানির কোনো দীর্ঘমেয়াদি Access Key বা পাসওয়ার্ড শেয়ার না করে কিভাবে সবচেয়ে নিরাপদভাবে তাদের অ্যাকাউন্টে সাময়িক অ্যাক্সেস প্রদান করবেন?\n            </p>\n            <div class=\"quiz-options\">\n              <div class=\"quiz-option\" onclick=\"handleQuizClick(this, false, 'IAM User তৈরি করে Access Key দিলে দীর্ঘমেয়াদি কি-লিক হওয়ার ঝুঁকি থাকে। এটি মোটেও বেস্ট প্র্যাকটিস নয়।')\">\n                <span class=\"opt-key\">A</span>\n                <span class=\"opt-text\">অডিট ফার্মের জন্য একটি নতুন IAM User তৈরি করে তার Access Key ও Secret Key ইমেইল করা।</span>\n              </div>\n              <div class=\"quiz-option\" onclick=\"handleQuizClick(this, true, 'চমৎকার! cross-account STS AssumeRole এবং ExternalId ব্যবহার করাই হলো থার্ড-পার্টি অডিটের গোল্ড স্ট্যান্ডার্ড। এটি সাময়িক টোকেন দেয় এবং Confused Deputy অ্যাটাক রোধ করে।')\">\n                <span class=\"opt-key\">B</span>\n                <span class=\"opt-text\">একটি IAM Role তৈরি করা যাতে অডিট ফার্মের অ্যাকাউন্ট ট্রাস্টেড থাকে এবং sts:ExternalId শর্ত যুক্ত করে sts:AssumeRole অনুমতি দেওয়া।</span>\n              </div>\n              <div class=\"quiz-option\" onclick=\"handleQuizClick(this, false, 'রুট অ্যাকাউন্টের ক্রেডেনশিয়াল কখনই কারো সাথে শেয়ার করা যায় না। এটি চরমতম নিরাপত্তা লঙ্ঘন।')\">\n                <span class=\"opt-key\">C</span>\n                <span class=\"opt-text\">কোম্পানির AWS Root Account-এর MFA সাময়িকভাবে বন্ধ করে তাদের লগইন করতে দেওয়া।</span>\n              </div>\n            </div>\n            <div class=\"quiz-feedback\" style=\"display:none;\"></div>\n          </div>\n        ",

        "theory": "\n          <div class=\"concept-card\">\n            <h4>💰 On-Demand বনাম Spot Instances:</h4>\n            <ul>\n              <li><strong>On-Demand:</strong> কোনো চুক্তি নেই, প্রতি সেকেন্ডে বিল। অপ্রত্যাশিত কাজের চাপ, অ্যাপ্লিকেশন টেস্টিং বা স্বল্পমেয়াদি প্রজেক্টের জন্য। খরচ সবচেয়ে বেশি।</li>\n              <li><strong>Spot Instances:</strong> অব্যবহৃত ক্লাউড ক্ষমতা ৯২% পর্যন্ত ছাড়ে পাওয়া যায়!</li>\n              <li><strong>২ মিনিটের নোটিশ:</strong> AWS-এর নিজস্ব প্রয়োজনে যেকোনো সময় ২ মিনিটের ওয়ার্নিং দিয়ে Spot ফিরিয়ে নিতে পারে। তাই ব্যাচ প্রসেসিং, ইমেজ রেন্ডারিং ও ফেইল-টলারেন্ট কাজের জন্য সেরা।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>💡 এক্সাম শর্টকাট:</strong> <em>\"Lowest Cost\"</em> এবং <em>\"Workloads that can handle interruptions\"</em> থাকলে উত্তর হবে <strong>Spot Instances</strong>!\n          </div>\n        ",

        "theory": "\n          <div class=\"concept-card\">\n            <h4>💰 দীর্ঘমেয়াদি প্রাইসিং মডেল:</h4>\n            <ul>\n              <li><strong>Reserved Instances (RI):</strong> ১ বা ৩ বছরের চুক্তি। সর্বোচ্চ ৭২% ছাড়। প্রেডিক্টেবল ২৪/৭ স্টেটফুল ডাটাবেজের জন্য আদর্শ। Standard RI বেশি ছাড় দেয়; Convertible RI ইনস্ট্যান্স টাইপ পরিবর্তনের সুযোগ দেয়।</li>\n              <li><strong>Savings Plans:</strong> প্রতি ঘণ্টায় নির্দিষ্ট ডলার খরচের প্রতিশ্রুতি ($/hr)। RI-এর মতোই ছাড় দেয় কিন্তু বেশি ফ্লেক্সিবল (Lambda ও Fargate-এও কাজ করে)।</li>\n              <li><strong>Dedicated Hosts:</strong> পুরো ফিজিক্যাল সার্ভার আপনার জন্য বরাদ্দ। নিজস্ব সফটওয়্যার লাইসেন্স (BYOL per-socket/core) ব্যবহারের জন্য প্রয়োজন।</li>\n            </ul>\n          </div>\n        ",

      {
        "title": "EC2 Placement Groups: Cluster",
        "desc": "হাই-পারফরম্যান্স কম্পিউটিংয়ের (HPC) জন্য একই র‍্যাকের মধ্যে আল্ট্রা-লো লেটেন্সি।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>📐 Cluster Placement Group বৈশিষ্ট্য:</h4>\n            <ul>\n              <li><strong>একই র‍্যাকে স্থাপন:</strong> একটিমাত্র Availability Zone-এর ভেতরে একই ফিজিক্যাল হার্ডওয়্যার র‍্যাকের মধ্যে সমস্ত ইনস্ট্যান্স স্থাপন করা হয়।</li>\n              <li><strong>সর্বনিম্ন লেটেন্সি:</strong> ইনস্ট্যান্সগুলোর মধ্যে সর্বোচ্চ নেটওয়ার্ক থ্রুপুট (10 Gbps+) এবং সর্বনিম্ন লেটেন্সি প্রদান করে।</li>\n              <li><strong>ব্যবহার:</strong> High Performance Computing (HPC), Big Data tightly-coupled প্রসেসিং।</li>\n              <li><strong>ঝুঁকি:</strong> ওই র‍্যাকটি নষ্ট হলে একসাথে সমস্ত সার্ভার বন্ধ হয়ে যেতে পারে।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>⭐ এক্সাম ফ্যাক্ট:</strong> <em>\"Lowest network latency and highest network throughput\"</em> = <strong>Cluster Placement Group</strong>।\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"60\" y=\"45\" width=\"300\" height=\"170\" rx=\"10\" fill=\"var(--svg-rect-bg)\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n            <text x=\"210\" y=\"75\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\">Cluster: Same Hardware Rack (Single AZ)</text>\n            \n            <rect x=\"85\" y=\"95\" width=\"65\" height=\"50\" rx=\"6\" fill=\"var(--svg-rect-inner)\" stroke=\"#10b981\"/>\n            <text x=\"117\" y=\"125\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">EC2 1</text>\n\n            <rect x=\"175\" y=\"95\" width=\"65\" height=\"50\" rx=\"6\" fill=\"var(--svg-rect-inner)\" stroke=\"#10b981\"/>\n            <text x=\"207\" y=\"125\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">EC2 2</text>\n\n            <rect x=\"265\" y=\"95\" width=\"65\" height=\"50\" rx=\"6\" fill=\"var(--svg-rect-inner)\" stroke=\"#10b981\"/>\n            <text x=\"297\" y=\"125\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">EC2 3</text>\n\n            <text x=\"210\" y=\"180\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">10 Gbps+ Ultra-Low Latency</text>\n            <text x=\"210\" y=\"200\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"11\">Rack Failure Risk: No Multi-AZ</text>\n          </svg>\n        "

      {
        "title": "EC2 Placement Groups: Spread ও Partition",
        "desc": "চরম দুর্যোগ-সহনশীলতা বনাম বিগ-ডাটা টপোলজি-সচেতন ক্লাস্টার।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>📐 Spread বনাম Partition:</h4>\n            <ul>\n              <li><strong>Spread Placement Group:</strong> প্রতিটি ইনস্ট্যান্সকে ভিন্ন ভিন্ন ফিজিক্যাল র‍্যাক ও পাওয়ার সাপ্লাইয়ে রাখে। প্রতি AZ-তে <strong>সর্বোচ্চ ৭টি ইনস্ট্যান্স</strong> রাখা যায়। <em>ক্রিটিক্যাল ডাটাবেজের জন্য আদর্শ।</em></li>\n              <li><strong>Partition Placement Group:</strong> প্রতিটি AZ-কে কতগুলো পার্টিশনে ভাগ করে। এক পার্টিশনের ফেইলিওর অন্য পার্টিশনে প্রভাব ফেলে না। <em>HDFS, Cassandra, Kafka ক্লাস্টারের জন্য প্রযোজ্য।</em></li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>⭐ এক্সাম ট্রিক:</strong> <em>\"Critical instances must not share underlying hardware\"</em> = <strong>Spread</strong>।\n          </div>\n        ",

      {
        "title": "EBS SSD ভলিউমস: gp3 বনাম io2 Block Express",
        "desc": "সাধারণ কাজের বেইজলাইন SSD বনাম সর্বোচ্চ গতি ও মাল্টি-অ্যাটাচ সমর্থিত SSD।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>💾 SSD ভলিউম তুলনামূলক বিশ্লেষণ:</h4>\n            <ul>\n              <li><strong>gp3 (General Purpose SSD):</strong> ডিফল্ট ড্রাইভ। 3,000 IOPS এবং 125 MB/s বেইজলাইন স্পিড দেয়। স্টোরেজ সাইজ না বাড়িয়েও স্বাধীনভাবে IOPS ও থ্রুপুট বাড়ানো যায়।</li>\n              <li><strong>io2 Block Express:</strong> সাব-মিলিসেকেন্ড লেটেন্সি এবং সর্বোচ্চ <strong>২৫৬,০০০ IOPS</strong>। 99.999% ডিউরেবিলিটি।</li>\n              <li><strong>Multi-Attach:</strong> একটিমাত্র io2 ভলিউম একই AZ-এর সর্বোচ্চ ১৬টি EC2 ইনস্ট্যান্সে একসাথে লাগানো যায়।</li>\n            </ul>\n          </div>\n        ",

      {
        "title": "EBS HDD (st1/sc1) বনাম Instance Store NVMe",
        "desc": "বুট ভলিউম না হতে পারা সস্তা ড্রাইভ বনাম ক্ষণস্থায়ী কিন্তু দ্রুততম ফিজিক্যাল স্টোরেজ।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>💾 HDD ও Instance Store তুলনা:</h4>\n            <ul>\n              <li><strong>st1 (Throughput HDD):</strong> সিকোয়েনশিয়াল I/O ও বিগ-ডাটার জন্য কম খরচের ড্রাইভ। <em>বুট ভলিউম হিসেবে ব্যবহার করা যায় না!</em></li>\n              <li><strong>sc1 (Cold HDD):</strong> সর্বনিম্ন খরচের আর্কাইভাল ড্রাইভ। <em>বুট ভলিউম হতে পারে না!</em></li>\n              <li><strong>Instance Store:</strong> ফিজিক্যাল সার্ভারের আসল হার্ডড্রাইভ। চরম গতি কিন্তু <strong>ক্ষণস্থায়ী (Ephemeral)</strong>। সার্ভার স্টপ বা টার্মিনেট করলে সমস্ত ডেটা স্থায়ীভাবে মুছে যায়।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box danger\">\n            <strong>🚨 ট্র্যাপ:</strong> Instance Store-এ স্থায়ী ডেটা রাখা পরীক্ষার মারাত্মক অ্যান্টি-প্যাটার্ন।\n          </div>\n        ",

      {

        "desc": "শত শত লিনাক্স সার্ভারের মধ্যে একই সাথে রিড ও রাইট করার ক্লাউড ফাইল স্টোরেজ।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>📁 Amazon EFS (Elastic File System) এর বৈশিষ্ট্য:</h4>\n            <ul>\n              <li><strong>NFSv4 প্রটোকল:</strong> লিনাক্স POSIX ফাইল সিস্টেম। শত শত EC2, ECS এবং Lambda ফাংশন একাধিক AZ থেকে একসাথে রিড/রাইট করতে পারে।</li>\n              <li><strong>অটো-ইলাস্টিক:</strong> ফাইল যোগ করলে নিজে থেকেই বড় হয়, মুছলে ছোট হয়। ক্যাপাসিটি প্রভিশন করার দরকার নেই।</li>\n              <li><strong>ব্যবহার:</strong> WordPress/Drupal মিডিয়া ফোল্ডার, শেয়ার্ড লিনাক্স ডিরেক্টরি।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>💡 এক্সাম হ্যাক:</strong> <em>\"Shared POSIX file system across 100s of EC2 instances\"</em> = <strong>Amazon EFS</strong>।\n          </div>\n        ",

      {

      {
        "title": "ELB Sticky Sessions ও SNI Multi-SSL",
        "desc": "সেশন অ্যাফিনিটি কুকি এবং একটিমাত্র লোড ব্যালেন্সারে একাধিক ডোমেনের সার্টিফিকেট।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>⚙️ Sticky Sessions ও SNI:</h4>\n            <ul>\n              <li><strong>Sticky Sessions (Session Affinity):</strong> একই ক্লায়েন্টের সমস্ত রিকোয়েস্ট সবসময় একটি নির্দিষ্ট ব্যাকএন্ড সার্ভারে পাঠায় (কুকি <code>AWSALB</code> ব্যবহার করে)। মেমোরিতে সেশন রাখা লিগ্যাসি অ্যাপের জন্য প্রযোজ্য।</li>\n              <li><strong>SNI (Server Name Indication):</strong> ক্লায়েন্ট হ্যান্ডশেকের হোস্টনেম দেখে একটিমাত্র লোড ব্যালেন্সারে একাধিক ডোমেনের জন্য একাধিক SSL সার্টিফিকেট লোড করে।</li>\n            </ul>\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"35\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n            <text x=\"117\" y=\"75\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">Sticky Sessions</text>\n            <text x=\"117\" y=\"105\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">Cookie: AWSALB</text>\n            <text x=\"117\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">Pins User to Same EC2</text>\n            <text x=\"117\" y=\"160\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"10\">Legacy Session Support</text>\n\n            <rect x=\"220\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#10b981\" stroke-width=\"2\"/>\n            <text x=\"302\" y=\"75\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"13\" font-weight=\"bold\">SNI (Multi-SSL)</text>\n            <text x=\"302\" y=\"105\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">1 Listener Many Certs</text>\n            <text x=\"302\" y=\"130\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\">siteA.com & siteB.com</text>\n            <text x=\"302\" y=\"160\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"10\">Saves Load Balancer Cost</text>\n          </svg>\n        "

      {
        "title": "Connection Draining ও Cross-Zone LB",
        "desc": "সার্ভার বন্ধের সময় গ্রাহকদের 502 এরর থেকে রক্ষা করার কৌশল।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>⚙️ Connection Draining (Deregistration Delay):</h4>\n            <ul>\n              <li>একটি সার্ভার বন্ধ করার আগে চলমান (In-flight) রিকোয়েস্টগুলো শেষ করার জন্য ১ থেকে ৩৬০০ সেকেন্ড (ডিফল্ট ৩০০ সেকেন্ড) সময় দেওয়া হয় যাতে গ্রাহক এরর না দেখে।</li>\n              <li><strong>Cross-Zone Load Balancing:</strong> চালু থাকলে লোড ব্যালেন্সার নোড ট্রাফিক সকল AZ-এর সমস্ত ইনস্ট্যান্সে সমানভাবে বণ্টন করে। ALB-তে এটি ডিফল্ট অন থাকে।</li>\n            </ul>\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"50\" y=\"55\" width=\"320\" height=\"145\" rx=\"10\" fill=\"var(--svg-rect-bg)\" stroke=\"var(--aws-orange)\" stroke-width=\"2\"/>\n            <text x=\"210\" y=\"85\" text-anchor=\"middle\" fill=\"var(--aws-orange)\" font-size=\"14\" font-weight=\"bold\">Connection Draining (Deregistration Delay)</text>\n            <text x=\"80\" y=\"120\" fill=\"#10b981\" font-size=\"12\">• Waits up to 300s for active requests to finish</text>\n            <text x=\"80\" y=\"145\" fill=\"#38bdf8\" font-size=\"12\">• Prevents 502 Bad Gateway / Broken downloads</text>\n            <text x=\"80\" y=\"170\" fill=\"var(--svg-text)\" font-size=\"12\">• New requests are stopped from going to retiring node</text>\n          </svg>\n        "

      {
        "title": "Auto Scaling Groups: Target Tracking ও Scheduled",
        "desc": "মেট্রিক নির্দিষ্ট রাখা বনাম সময়সূচি অনুযায়ী আগাম সার্ভার স্কেলিং।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>📈 সহজ ও জনপ্রিয় ২ স্কেলিং পলিসি:</h4>\n            <ul>\n              <li><strong>Target Tracking Scaling:</strong> সবচেয়ে আধুনিক ও রেকমেন্ডেড। একটি নির্দিষ্ট মেট্রিক ঠিক রাখা (যেমন: গড় CPU ইউটিলাইজেশন সর্বদা 50% থাকবে)। লোড বাড়লে বা কমলে ASG স্বয়ংক্রিয়ভাবে ইনস্ট্যান্স যোগ/বিয়োগ করে।</li>\n              <li><strong>Scheduled Scaling:</strong> আগে থেকেই জানা সময়ের জন্য (যেমন: প্রতি শুক্রবার বিকেল ৫টায় বা সোমবার সকাল ৯টায় সেলের সময় সার্ভার বাড়ানো)।</li>\n            </ul>\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"35\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#10b981\" stroke-width=\"2\"/>\n            <text x=\"117\" y=\"75\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"13\" font-weight=\"bold\">Target Tracking</text>\n            <text x=\"117\" y=\"105\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">Keep CPU = 50%</text>\n            <text x=\"117\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">Self-adjusting</text>\n            <text x=\"117\" y=\"160\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\">Easiest to setup</text>\n\n            <rect x=\"220\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n            <text x=\"302\" y=\"75\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">Scheduled Scaling</text>\n            <text x=\"302\" y=\"105\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\">Predictable Events</text>\n            <text x=\"302\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">e.g. 9 AM Mon Morning</text>\n            <text x=\"302\" y=\"160\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">Pre-warmed servers</text>\n          </svg>\n        "

      {

        "desc": "থ্রেশহোল্ড স্টেপ ভিত্তিক স্কেলিং বনাম মেশিন লার্নিং পূর্বাভাস।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>📈 অ্যাডভান্সড স্কেলিং পলিসি:</h4>\n            <ul>\n              <li><strong>Step Scaling:</strong> মেট্রিকের থ্রেশহোল্ড অনুযায়ী ধাপে ধাপে স্কেল করে (যেমন: CPU > 70% হলে ২টি বাড়াও, CPU > 85% হলে ৪টি বাড়াও)। স্পাইক দ্রুত সামলানোর জন্য উপযোগী।</li>\n              <li><strong>Predictive Scaling:</strong> মেশিন লার্নিং ব্যবহার করে পূর্ববর্তী ঐতিহাসিক প্যাটার্ন বিশ্লেষণ করে ট্রাফিক আসার আগেই সার্ভার বাড়িয়ে প্রস্তুত রাখে।</li>\n            </ul>\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"35\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#f59e0b\"/>\n            <text x=\"117\" y=\"75\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"bold\">Step Scaling</text>\n            <text x=\"117\" y=\"105\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">> 70% CPU -> +2</text>\n            <text x=\"117\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">> 85% CPU -> +4</text>\n            <text x=\"117\" y=\"160\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">Fast Multi-step</text>\n\n            <rect x=\"220\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#a855f7\"/>\n            <text x=\"302\" y=\"75\" text-anchor=\"middle\" fill=\"#a855f7\" font-size=\"13\" font-weight=\"bold\">Predictive (ML)</text>\n            <text x=\"302\" y=\"105\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">Historical Patterns</text>\n            <text x=\"302\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">Scale BEFORE surge</text>\n            <text x=\"302\" y=\"160\" text-anchor=\"middle\" fill=\"#a855f7\" font-size=\"11\">Zero Lag Time</text>\n          </svg>\n        "

      {

        "desc": "সার্ভার চালু বা বন্ধের মাঝে কাস্টম স্ক্রিপ্ট রান করা এবং অতিরিক্ত স্কেলিং রোধ।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>🪝 Lifecycle Hooks ও Cooldown:</h4>\n            <ul>\n              <li><strong>Pending:Wait:</strong> নতুন ইনস্ট্যান্স ট্রাফিক পাওয়ার আগে পজ থাকে (কোড ডিপ্লয় বা ডিপেনডেন্সি ইনস্টল করার সময়)।</li>\n              <li><strong>Terminating:Wait:</strong> ইনস্ট্যান্স বন্ধ করার পূর্বে পজ থাকে (লগ ফাইল S3-তে আপলোড করার সময়)।</li>\n              <li><strong>Cooldown Period (ডিফল্ট ৩০০ সেকেন্ড):</strong> একটি স্কেলিং ইভেন্টের পর পরবর্তী স্কেলিং শুরু করার আগে নির্দিষ্ট সময় অপেক্ষা করে যাতে অতিরিক্ত সার্ভার তৈরি হয়ে বিল না বাড়ে।</li>\n            </ul>\n          </div>\n        ",

      {

      {
        "title": "Amazon DynamoDB কোর আর্কিটেকচার ও পার্টিশন কি",
        "desc": "সার্ভারলেস NoSQL ডাটাবেজ এবং সিঙ্গেল-ডিজিট মিলিসেকেন্ড লেটেন্সি।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>⚡ DynamoDB মূল আর্কিটেকচার:</h4>\n            <ul>\n              <li>সার্ভারলেস কি-ভ্যালু এবং ডকুমেন্ট ডাটাবেজ। আনলিমিটেড স্কেলেবিলিটিতেও মিলিসেকেন্ড লেটেন্সি বজায় রাখে।</li>\n              <li><strong>Primary Key:</strong> শুধু <em>Partition Key (HASH)</em> অথবা কম্পোজিট <em>Partition Key + Sort Key (RANGE)</em>।</li>\n              <li><strong>Capacity Modes:</strong> Provisioned (আগে থেকে নির্ধারণ) বনাম On-Demand (অপ্রত্যাশিত স্পাইকের জন্য অটো-স্কেলিং)।</li>\n            </ul>\n          </div>\n        ",

      {
        "title": "DynamoDB WCU ও RCU ক্যাপাসিটি ক্যালকুলেশন",
        "desc": "পরীক্ষার জন্য অত্যন্ত গুরুত্বপূর্ণ রাইট ও রিড ইউনিট হিসাব।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>🔢 WCU ও RCU হিসাবের সূত্র:</h4>\n            <ul>\n              <li><strong>1 WCU (Write Unit):</strong> সর্বোচ্চ ১ KB সাইজের আইটেমের জন্য ১টি রাইট প্রতি সেকেন্ডে। (৪.৫ KB আইটেম রাইট করতে ৫ WCU লাগবে)।</li>\n              <li><strong>1 RCU (Read Unit):</strong> ১টি Strongly Consistent Read (সর্বোচ্চ ৪ KB) অথবা ২টি Eventually Consistent Read প্রতি সেকেন্ডে।</li>\n            </ul>\n          </div>\n          <div class=\"alert-box success\">\n            <strong>⭐ এক্সাম ট্রিক:</strong> Eventually Consistent Read ব্যবহার করলে খরচ ৫০% সাশ্রয় হয়!\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"35\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#10b981\" stroke-width=\"2\"/>\n            <text x=\"117\" y=\"75\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"13\" font-weight=\"bold\">1 WCU</text>\n            <text x=\"117\" y=\"105\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">1 Write / sec</text>\n            <text x=\"117\" y=\"130\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">Up to 1 KB Item</text>\n            <text x=\"117\" y=\"160\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">4.5 KB item = 5 WCU</text>\n\n            <rect x=\"220\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n            <text x=\"302\" y=\"75\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">1 RCU</text>\n            <text x=\"302\" y=\"105\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\">1 Strong Read (4 KB)</text>\n            <text x=\"302\" y=\"130\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">2 Eventual Reads (4 KB)</text>\n            <text x=\"302\" y=\"160\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">Eventual Read = 50% Off</text>\n          </svg>\n        "
      },
      {
        "title": "DynamoDB Streams, Global Tables ও DAX",
        "desc": "ইভেন্ট-ড্রিভেন ডাটা চেঞ্জ ট্র্যাকিং এবং মাইক্রোসেকেন্ড লেটেন্সির মেমোরি ক্যাশ।",
        "theory": "\n          <div class=\"concept-card\">\n            <h4>🌊 Streams, Global Tables ও DAX:</h4>\n            <ul>\n              <li><strong>DynamoDB Streams:</strong> আইটেমের পরিবর্তন ২৪ ঘণ্টা লগ করে এবং Lambda ফাংশন ট্রিগার করে।</li>\n              <li><strong>Global Tables:</strong> অ্যাক্টিভ-অ্যাক্টিভ মাল্টি-রিজিয়ন রেপ্লিকেশন। যেকোনো রিজিয়নে রিড বা রাইট করা যায়।</li>\n              <li><strong>DAX (DynamoDB Accelerator):</strong> ইন-লাইন মেমোরি ক্যাশ যা লেটেন্সিকে মিলিসেকেন্ড থেকে <strong>মাইক্রোসেকেন্ডে (μs)</strong> নামিয়ে আনে। কোনো কোড পরিবর্তন করতে হয় না।</li>\n            </ul>\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"35\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"var(--aws-orange)\" stroke-width=\"2\"/>\n            <text x=\"117\" y=\"75\" text-anchor=\"middle\" fill=\"var(--aws-orange)\" font-size=\"13\" font-weight=\"bold\">DAX Cache</text>\n            <text x=\"117\" y=\"105\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">Microseconds (μs)</text>\n            <text x=\"117\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">Seamless Drop-in</text>\n            <text x=\"117\" y=\"160\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\">Zero Code Rewrite</text>\n\n            <rect x=\"220\" y=\"45\" width=\"165\" height=\"170\" rx=\"8\" fill=\"var(--svg-rect-bg)\" stroke=\"#10b981\" stroke-width=\"2\"/>\n            <text x=\"302\" y=\"75\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"13\" font-weight=\"bold\">Global Tables</text>\n            <text x=\"302\" y=\"105\" text-anchor=\"middle\" fill=\"#10b981\" font-size=\"11\">Active-Active Multi-Region</text>\n            <text x=\"302\" y=\"130\" text-anchor=\"middle\" fill=\"var(--svg-text)\" font-size=\"11\">Requires DynamoDB Streams</text>\n            <text x=\"302\" y=\"160\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\">Sub-second 2-way sync</text>\n          </svg>\n        "

      {
        "title": "AWS ডাটাবেজ সিলেকশন ডিসিশন ম্যাট্রিক্স",

        "theory": "\n          <div class=\"concept-card\">\n            <h4>⏱️ Visibility Timeout ও DLQ:</h4>\n            <ul>\n              <li><strong>Visibility Timeout:</strong> কনজিউমার কিউ থেকে মেসেজ রিড করার পর এটি নির্দিষ্ট সময়ের জন্য (ডিফল্ট ৩০ সেকেন্ড, সর্বোচ্চ ১২ ঘণ্টা) অন্য কনজিউমারদের কাছে অদৃশ্য থাকে যাতে একই মেসেজ একাধিক জন প্রসেস না করে।</li>\n              <li><strong>Dead Letter Queue (DLQ):</strong> নির্দিষ্ট বার (<code>maxReceiveCount</code>) ব্যর্থ হওয়া মেসেজ আলাদা কিউতে সরিয়ে নিয়ে ডিবাগ করা।</li>\n              <li><strong>Long Polling:</strong> <code>WaitTimeSeconds: 1-20s</code> সেট করলে খালি কিউতে কল কম হয় ও খরচ বাঁচে।</li>\n            </ul>\n          </div>\n        ",
        "svg": "\n          <svg viewBox=\"0 0 420 260\" width=\"100%\">\n            <rect x=\"15\" y=\"15\" width=\"390\" height=\"230\" rx=\"12\" fill=\"var(--svg-bg)\" stroke=\"var(--svg-stroke)\"/>\n            <rect x=\"50\" y=\"55\" width=\"320\" height=\"145\" rx=\"10\" fill=\"var(--svg-rect-bg)\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n            <text x=\"210\" y=\"85\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"14\" font-weight=\"bold\">Visibility Timeout: Default 30s (Max 12h)</text>\n            <text x=\"80\" y=\"120\" fill=\"#10b981\" font-size=\"12\">• Hides message from other workers while being processed</text>\n            <text x=\"80\" y=\"145\" fill=\"#ef4444\" font-size=\"12\">• MaxReceiveCount reached -> Sent to Dead Letter Queue (DLQ)</text>\n            <text x=\"80\" y=\"170\" fill=\"#38bdf8\" font-size=\"12\">• Long Polling (WaitTimeSeconds 1-20) saves money</text>\n          </svg>\n        "

        "theory": "\n          <div class=\"concept-card\">\n            <h4>🌊 Data Streams বনাম 🔥 Data Firehose:</h4>\n            <ul>\n              <li><strong>Kinesis Data Streams:</strong> সাব-সেকেন্ড রিয়েল-টাইম স্ট্রিমিং। শার্ড (Shard) ভিত্তিক স্কেলিং। ডেটা ১ থেকে ৩৬৫ দিন পর্যন্ত সংরক্ষিত থাকে; একাধিক গ্রাহক একই ডেটা <strong>রিপ্লে (Replay)</strong> করতে পারে।</li>\n              <li><strong>Kinesis Data Firehose:</strong> সম্পূর্ণ <strong>সার্ভারলেস</strong>। সরাসরি S3, Redshift, OpenSearch-এ ডেটা লোড করে। কোনো ডেটা স্টোর বা রিপ্লে করার ব্যবস্থা নেই।</li>\n            </ul>\n          </div>\n        ",

    // State
    let currentModuleIndex = 0;
    let currentSlideIndex = 0;

    // Interactive Quiz Handler
    function handleQuizClick(el, isCorrect, explanation) {
      const parent = el.closest('.exam-quiz-card');
      const allOpts = parent.querySelectorAll('.quiz-option');
      allOpts.forEach(opt => {
        opt.classList.remove('correct', 'wrong');
      });
      if (isCorrect) {
        el.classList.add('correct');
      } else {
        el.classList.add('wrong');
      }
      const feedback = parent.querySelector('.quiz-feedback');
      feedback.style.display = 'block';
      feedback.className = 'quiz-feedback ' + (isCorrect ? 'feedback-correct' : 'feedback-wrong');
      feedback.innerHTML = '<strong>' + (isCorrect ? '✅ চমৎকার! সঠিক উত্তর!' : '❌ ভুল উত্তর!') + '</strong> ' + explanation;
    }

    // Render Module List in Sidebar
    function renderModuleList() {
      const listEl = document.getElementById('module-list');
      listEl.innerHTML = courseData.map((mod, idx) => `
        <li class="module-item ${idx === currentModuleIndex ? 'active' : ''}" onclick="selectModule(${idx})">
          <div class="module-item-icon">${mod.icon}</div>
          <div class="module-item-content">
            <h3>মডিউল ${toBn(idx + 1)}: ${mod.title}</h3>
            <span>${mod.short} (${toBn(mod.slides.length)}টি স্লাইড)</span>
          </div>
        </li>
      `).join('');
    }

    // Render Current Slide
    function renderSlide() {
      const mod = courseData[currentModuleIndex];
      const slide = mod.slides[currentSlideIndex];
      const bodyEl = document.getElementById('slide-body');

      bodyEl.innerHTML = `
        <div class="slide-breadcrumb">
          <span class="badge-mod">${mod.icon} মডিউল ${toBn(currentModuleIndex + 1)}</span>
          <span>•</span>
          <span>স্লাইড ${toBn(currentSlideIndex + 1)} / ${toBn(mod.slides.length)}</span>
          <span style="opacity: 0.65; font-size: 0.8rem; margin-left: 8px;">(মোট সমাপ্তি: ${toBn(calcGlobalProgress())}%)</span>
        </div>
        <h2 class="slide-title">${slide.title}</h2>
        <p class="slide-subtitle">${slide.desc}</p>

        <div class="slide-grid">
          <div class="theory-box">
            ${slide.theory}
          </div>
          <div class="infographic-frame">
            <span class="infographic-tag">ARCHITECTURE DIAGRAM</span>
            ${slide.svg}
          </div>
        </div>
      `;

      // Update Dots Navigation
      const dotsNav = document.getElementById('dots-nav');
      dotsNav.innerHTML = mod.slides.map((_, idx) => `
        <div class="dot-item ${idx === currentSlideIndex ? 'active' : ''}" title="স্লাইড ${toBn(idx + 1)}" onclick="goToSlide(${idx})"></div>
      `).join('');

      // Update Controls
      document.getElementById('prev-btn').disabled = (currentModuleIndex === 0 && currentSlideIndex === 0);
      const nextBtn = document.getElementById('next-btn');
      const isLastSlide = (currentModuleIndex === courseData.length - 1 && currentSlideIndex === mod.slides.length - 1);
      nextBtn.innerText = isLastSlide ? 'কোর্স সম্পন্ন 🎓' : 'পরবর্তী →';

      // Update Top Progress Bar
      const pct = calcGlobalProgress();
      document.getElementById('top-progress-fill').style.width = pct + '%';
      document.getElementById('module-counter-badge').innerText = `মডিউল ${toBn(currentModuleIndex + 1)} / ${toBn(courseData.length)} (${toBn(pct)}% সমাপ্ত)`;

      renderModuleList();
    }

    function calcGlobalProgress() {
      let totalSlidesCount = 0;
      let completedCount = 0;
      courseData.forEach((m, mIdx) => {
        m.slides.forEach((_, sIdx) => {
          totalSlidesCount++;
          if (mIdx < currentModuleIndex || (mIdx === currentModuleIndex && sIdx <= currentSlideIndex)) {
            completedCount++;
          }
        });
      });
      return Math.round((completedCount / totalSlidesCount) * 100);
    }

    // Navigation Logic
    function selectModule(index) {
      currentModuleIndex = index;
      currentSlideIndex = 0;
      renderSlide();
      if (window.innerWidth <= 960) {
        toggleSidebar(false);
      }
    }

    function nextSlide() {
      const mod = courseData[currentModuleIndex];
      if (currentSlideIndex < mod.slides.length - 1) {
        currentSlideIndex++;
        renderSlide();
      } else if (currentModuleIndex < courseData.length - 1) {
        currentModuleIndex++;
        currentSlideIndex = 0;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide();
      } else if (currentModuleIndex > 0) {
        currentModuleIndex--;
        currentSlideIndex = courseData[currentModuleIndex].slides.length - 1;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentSlideIndex = idx;
      renderSlide();
    }

    // Sidebar Toggle
    function toggleSidebar(forceState) {
      const drawer = document.getElementById('sidebar-drawer');
      if (typeof forceState === 'boolean') {
        drawer.classList.toggle('closed', !forceState);
      } else {
        drawer.classList.toggle('closed');
      }
    }

    // Enhanced Search filter for modules and slides
    function filterModules() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const items = document.querySelectorAll('.module-item');
      courseData.forEach((mod, idx) => {
        const text = (mod.title + " " + mod.short).toLowerCase();
        const slideMatch = mod.slides.some(s => (s.title + " " + s.desc).toLowerCase().includes(query));
        if (!query || text.includes(query) || slideMatch) {
          items[idx].style.display = 'flex';
        } else {
          items[idx].style.display = 'none';
        }
      });
    }

    // Theme Switcher
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', target);
      localStorage.setItem('aws_master_theme', target);
      updateThemeBtn(target);
    }

    function updateThemeBtn(theme) {
      document.getElementById('theme-icon').innerText = theme === 'light' ? '🌙' : '☀️';
      document.getElementById('theme-text').innerText = theme === 'light' ? 'ডার্ক' : 'লাইট';
    }

    // Font Size Adjuster (13px, 14px, 15px, 16px, 17px)
    const fontSizes = [13, 14, 15, 16, 17];
    let currentFontIndex = parseInt(localStorage.getItem('aws_font_idx'), 10);
    if (isNaN(currentFontIndex) || currentFontIndex < 0 || currentFontIndex >= fontSizes.length) {
      currentFontIndex = 2; // Default 15px
    }

    function applyFontSize() {
      document.documentElement.style.fontSize = fontSizes[currentFontIndex] + 'px';
      localStorage.setItem('aws_font_idx', currentFontIndex);
    }

    function changeFontSize(dir) {
      if (dir === 0) {
        currentFontIndex = 2; // Reset to 15px
      } else if (dir === -1 && currentFontIndex > 0) {
        currentFontIndex--;
      } else if (dir === 1 && currentFontIndex < fontSizes.length - 1) {
        currentFontIndex++;
      }
      applyFontSize();
    }

    // Touch Swipe for Mobile
    let touchStartX = 0;
    let touchEndX = 0;
    const stage = document.getElementById('slide-wrapper');

    stage.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX - touchStartX < -45) nextSlide();
      if (touchEndX - touchStartX > 45) prevSlide();
    }, { passive: true });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key.toLowerCase() === 'm') toggleSidebar();
    });

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      applyFontSize();
      const savedTheme = localStorage.getItem('aws_master_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtn(savedTheme);

      renderModuleList();
      renderSlide();
    });
  </script>
</body>
</html>
