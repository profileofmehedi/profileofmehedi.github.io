<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEPZA Client Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #005c2a 0%, #003d1c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .bepza-logo {
            width: 80px;
            height: 80px;
            background: #005c2a;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .btn-primary {
            background-color: #005c2a;
            border: none;
            padding: 10px;
        }

        .btn-primary:hover {
            background-color: #00421e;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="bepza-logo">
            <i class="fas fa-industry"></i>
        </div>
        <h4 class="text-center mb-4">BEPZA Client Portal</h4>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Client ID / Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" value="user" id="username" placeholder="Enter username"
                        required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" value="123456" id="password"
                        placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Login Securely</button>
            <div class="text-center mt-3">
                <small class="text-muted">Demo: user / 123456</small>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // Initialize Demo Data if not exists
            const initialBills = [
                { id: 101, type: 'Electricity', month: 'October 2023', amount: 45000, status: 'Paid', date: '2023-11-05' },
                { id: 102, type: 'Gas', month: 'October 2023', amount: 12000, status: 'Paid', date: '2023-11-05' },
                { id: 103, type: 'Water', month: 'November 2023', amount: 3500, status: 'Unpaid', date: '-' },
                { id: 104, type: 'Electricity', month: 'November 2023', amount: 48500, status: 'Unpaid', date: '-' },
                { id: 105, type: 'Service Charge', month: 'November 2023', amount: 5000, status: 'Unpaid', date: '-' }
            ];

            if (!localStorage.getItem('bepza_bills')) {
                localStorage.setItem('bepza_bills', JSON.stringify(initialBills));
            }

            // Login Logic
            $('#loginForm').on('submit', function (e) {
                e.preventDefault();
                const u = $('#username').val();
                const p = $('#password').val();

                if (u === 'user' && p === '123456') {
                    localStorage.setItem('bepza_user', 'Logged In');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Invalid Credentials! Try user / 123456');
                }
            });
        });
    </script>
</body>

</html>
