<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - BEPZA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .success-card {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: popIn 0.5s ease;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: #d4edda;
            color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="success-card">
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>
        <h2 class="mb-3 text-success fw-bold">Payment Successful!</h2>
        <p class="text-muted">Thank you. Your payment has been received securely.</p>

        <div class="bg-light p-3 rounded mb-4 text-start">
            <div class="d-flex justify-content-between mb-2">
                <span>Transaction ID:</span>
                <strong id="trxId">TXN88392</strong>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span>Amount Paid:</span>
                <strong id="amountPaid">BDT 0.00</strong>
            </div>
            <div class="d-flex justify-content-between">
                <span>Date:</span>
                <span id="payDate">2023-10-25</span>
            </div>
        </div>

        <div class="d-grid gap-2">
            <a href="history.html" class="btn btn-outline-dark">View History</a>
            <a href="dashboard.html" class="btn btn-primary">Return to Dashboard</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // Retrieve simulated data
            const amount = sessionStorage.getItem('pay_amount');
            const total = (parseFloat(amount) * 1.05).toFixed(2); // Adding VAT for display

            $('#amountPaid').text('BDT ' + parseFloat(total).toLocaleString());
            $('#trxId').text('TXN-' + Math.floor(Math.random() * 9000000));

            const today = new Date();
            $('#payDate').text(today.toLocaleDateString() + ' ' + today.toLocaleTimeString());
        });
    </script>
</body>

</html>
