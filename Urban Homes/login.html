<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urban Homes ERP & CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 30px;
            color: #1e3c72;
        }

        .btn-primary {
            background-color: #1e3c72;
            border: none;
            padding: 12px;
        }

        .btn-primary:hover {
            background-color: #162d55;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #1e3c72;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-logo">
            <h1><i class="fas fa-city"></i> Urban Homes</h1>
            <p class="text-muted">ERP & CRM System</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="opus.admin" value="opus.admin"
                        required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter password"
                        value="123456" required>
                </div>
            </div>
            <button type="button" class="btn btn-primary w-100 fw-bold" id="loginBtn">Login</button>
            <div class="text-center mt-3">
                <a href="#" class="text-decoration-none small text-muted">Forgot Password?</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // Direct login handler
        document.getElementById('loginBtn').addEventListener('click', function () {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Validate credentials
            if (!username || !password) {
                alert('Please fill in all credentials!');
                return;
            }

            // Check if username and password are correct
            if (username !== 'opus.admin' || password !== '123456') {
                alert('Invalid username or password.\nCorrect credentials: opus.admin / 123456');
                return;
            }

            // Login success - redirect to dashboard
            alert('Login Successful! Welcome opus.admin!');
            window.location.href = 'dashboard.html';
        });

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>

</html>
