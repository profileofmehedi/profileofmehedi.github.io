<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
</head>

<body>
    <script src="admin-utils.js"></script>
    <script>
        checkAdminAuth();
    </script>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../assets/img/logo/logo.jpg" alt="Logo">
                <h3>LET Admin</h3>
            </div>

            <nav>
                <ul class="admin-nav">
                    <li><a href="dashboard.html"><i class="ri-dashboard-line"></i> Dashboard</a></li>
                    <li><a href="hero.html"><i class="ri-image-2-line"></i> Hero Section</a></li>
                    <li><a href="about.html"><i class="ri-information-line"></i> About</a></li>
                    <li><a href="services.html" class="active"><i class="ri-settings-2-line"></i> Services</a></li>
                    <li><a href="core-values.html"><i class="ri-heart-line"></i> Core Values</a></li>
                    <li><a href="clients.html"><i class="ri-community-line"></i> Clients</a></li>
                    <li><a href="contact-info.html"><i class="ri-phone-line"></i> Contact Info</a></li>
                    <li><a href="settings.html"><i class="ri-settings-line"></i> Settings</a></li>
                </ul>
            </nav>

            <div style="padding-top: 20px; border-top: 1px solid var(--border-color); margin-top: 20px;">
                <button class="logout-btn" style="width: 100%; justify-content: center;" onclick="logout()">
                    <i class="ri-logout-circle-line"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1><i class="ri-settings-2-line"></i> Services Management</h1>
                <div class="admin-user-menu">
                    <div class="admin-user-info">
                        <p>Welcome back,</p>
                        <strong id="adminUsername">Admin</strong>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <h2>Manage Services</h2>
                <p style="color: var(--text-light); margin-bottom: 30px;">Edit your service offerings. You can update
                    each service's title and description.</p>

                <div id="servicesContainer"></div>

                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <button type="button" class="btn btn-primary" id="saveServicesBtn">
                        <i class="ri-save-line"></i> Save All Services
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('adminUsername').textContent = getAdminUsername();

        const defaultServices = [
            {
                id: 'network-solutions',
                title: 'Network Solutions',
                description: 'Comprehensive network setup, maintenance, and security services for businesses of all sizes'
            },
            {
                id: 'security-systems',
                title: 'Security Systems',
                description: 'Advanced security solutions including CCTV, access control, and attendance systems'
            },
            {
                id: 'hardware-support',
                title: 'Hardware Support',
                description: 'Expert hardware installation, maintenance, and troubleshooting services'
            },
            {
                id: 'software-solutions',
                title: 'Software Solutions',
                description: 'Custom software development tailored to your specific business requirements'
            },
            {
                id: 'hire-from-us',
                title: 'Hire From Us',
                description: 'Partner with us to access top-tier developers and IT professionals.'
            },
            {
                id: 'it-consultancy',
                title: 'IT Consultancy',
                description: 'Strategic IT consulting to optimize your technology infrastructure'
            }
        ];

        function loadServices() {
            const savedServices = JSON.parse(localStorage.getItem('services') || JSON.stringify(defaultServices));
            const container = document.getElementById('servicesContainer');

            container.innerHTML = savedServices.map((service, index) => `
                <div style="background: var(--light-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h4 style="margin: 0; color: var(--text-dark);">Service ${index + 1}</h4>
                        <span style="background: var(--primary-color); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px;">ID: ${service.id}</span>
                    </div>

                    <div class="form-group">
                        <label for="serviceTitle${index}">Service Title</label>
                        <input type="text" id="serviceTitle${index}" class="service-title" data-index="${index}" placeholder="Service title" value="${service.title}">
                    </div>

                    <div class="form-group">
                        <label for="serviceDesc${index}">Service Description</label>
                        <textarea id="serviceDesc${index}" class="service-desc" data-index="${index}" placeholder="Service description">${service.description}</textarea>
                    </div>
                </div>
            `).join('');
        }

        function saveServices() {
            const services = defaultServices.map((service, index) => {
                const newTitle = document.querySelector(`input.service-title[data-index="${index}"]`).value;
                const newDesc = document.querySelector(`textarea.service-desc[data-index="${index}"]`).value;

                return {
                    ...service,
                    title: newTitle,
                    description: newDesc
                };
            });

            localStorage.setItem('services', JSON.stringify(services));

            // Log change
            const changes = JSON.parse(localStorage.getItem('adminChanges') || '[]');
            changes.push({
                section: 'Services',
                description: 'Updated service listings',
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('adminChanges', JSON.stringify(changes));

            showNotification('Services updated successfully!', 'success');
        }

        document.getElementById('saveServicesBtn').addEventListener('click', saveServices);

        loadServices();
    </script>
</body>

</html>
