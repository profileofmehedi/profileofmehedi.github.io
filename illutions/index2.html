<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impossible Geometry Illusion</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #0f0f23, #1a1a2e, #16213e);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            perspective: 1000px;
        }

        .illusion-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .penrose-triangle {
            position: absolute;
            width: 300px;
            height: 260px;
            animation: rotate3d 20s linear infinite;
            transform-style: preserve-3d;
        }

        .triangle-beam {
            position: absolute;
            width: 200px;
            height: 40px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            transform-origin: left center;
            animation: shimmer 3s ease-in-out infinite alternate;
        }

        .beam1 {
            transform: rotate(0deg) translateZ(20px);
            top: 0;
            left: 0;
        }

        .beam2 {
            transform: rotate(120deg) translateZ(0px);
            top: 130px;
            left: 50px;
        }

        .beam3 {
            transform: rotate(240deg) translateZ(-20px);
            top: 130px;
            left: 150px;
        }

        .impossible-stairs {
            position: absolute;
            width: 400px;
            height: 400px;
            top: 20%;
            left: 10%;
            animation: stairShift 15s ease-in-out infinite;
        }

        .stair {
            position: absolute;
            width: 60px;
            height: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: stairFloat 4s ease-in-out infinite;
        }

        .mobius-strip {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 20%;
            right: 10%;
            transform-style: preserve-3d;
            animation: mobiusRotate 25s linear infinite;
        }

        .strip-segment {
            position: absolute;
            width: 100px;
            height: 20px;
            background: linear-gradient(90deg, #ff6b6b, transparent, #4ecdc4, transparent, #45b7d1);
            transform-origin: center;
            animation: stripWave 5s ease-in-out infinite;
        }

        .escher-cube {
            position: absolute;
            width: 200px;
            height: 200px;
            bottom: 20%;
            left: 20%;
            transform-style: preserve-3d;
            animation: cubeImpossible 18s linear infinite;
        }

        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .infinity-loop {
            position: absolute;
            width: 250px;
            height: 125px;
            bottom: 20%;
            right: 20%;
            animation: infinityFlow 12s ease-in-out infinite;
        }

        .loop-path {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 8px solid transparent;
            border-radius: 125px 125px 0 0;
            background: linear-gradient(45deg, #ff9a56, #ff6b9d) border-box;
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask-composite: subtract;
            animation: pathGlow 3s ease-in-out infinite alternate;
        }

        .optical-squares {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .square-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
            animation: gridWarp 8s ease-in-out infinite;
        }

        .grid-square {
            background: #000;
            transition: all 0.3s ease;
            animation: squarePulse 2s ease-in-out infinite;
        }

        .grid-square:nth-child(odd) {
            background: #fff;
            animation-delay: 0.1s;
        }

        .floating-fractals {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .fractal {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, transparent 40%, #ff6b6b 41%, #ff6b6b 59%, transparent 60%);
            border-radius: 50%;
            animation: fractalMove 20s linear infinite;
            opacity: 0.7;
        }

        .morphing-shape {
            position: absolute;
            width: 150px;
            height: 150px;
            top: 70%;
            left: 50%;
            transform: translateX(-50%);
            background: conic-gradient(from 0deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #ff006e);
            animation: morph 6s ease-in-out infinite;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .btn-illusion {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            backdrop-filter: blur(10px);
            margin: 3px;
            transition: all 0.3s ease;
            font-size: 12px;
            padding: 5px 10px;
        }

        .btn-illusion:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
            color: white;
        }

        @keyframes rotate3d {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }

            25% {
                transform: rotateY(90deg) rotateX(15deg);
            }

            50% {
                transform: rotateY(180deg) rotateX(0deg);
            }

            75% {
                transform: rotateY(270deg) rotateX(-15deg);
            }

            100% {
                transform: rotateY(360deg) rotateX(0deg);
            }
        }

        @keyframes shimmer {
            0% {
                background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
                transform: translateX(0px) rotateZ(0deg);
            }

            100% {
                background: linear-gradient(45deg, #48dbfb, #ff9ff3, #ff6b6b, #feca57);
                transform: translateX(10px) rotateZ(5deg);
            }
        }

        @keyframes stairShift {

            0%,
            100% {
                transform: perspective(800px) rotateX(30deg) rotateY(0deg);
            }

            33% {
                transform: perspective(800px) rotateX(30deg) rotateY(120deg);
            }

            66% {
                transform: perspective(800px) rotateX(30deg) rotateY(240deg);
            }
        }

        @keyframes stairFloat {

            0%,
            100% {
                transform: translateY(0px) rotateZ(0deg);
            }

            50% {
                transform: translateY(-10px) rotateZ(180deg);
            }
        }

        @keyframes mobiusRotate {
            0% {
                transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg);
            }

            33% {
                transform: rotateY(120deg) rotateX(20deg) rotateZ(60deg);
            }

            66% {
                transform: rotateY(240deg) rotateX(-20deg) rotateZ(120deg);
            }

            100% {
                transform: rotateY(360deg) rotateX(0deg) rotateZ(180deg);
            }
        }

        @keyframes stripWave {

            0%,
            100% {
                transform: rotateY(0deg) translateZ(0px);
            }

            25% {
                transform: rotateY(90deg) translateZ(50px);
            }

            50% {
                transform: rotateY(180deg) translateZ(0px);
            }

            75% {
                transform: rotateY(270deg) translateZ(-50px);
            }
        }

        @keyframes cubeImpossible {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            }
        }

        @keyframes infinityFlow {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.2);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        @keyframes pathGlow {
            0% {
                filter: drop-shadow(0 0 10px #ff9a56);
                border-width: 8px;
            }

            100% {
                filter: drop-shadow(0 0 30px #ff6b9d);
                border-width: 12px;
            }
        }

        @keyframes gridWarp {

            0%,
            100% {
                transform: perspective(500px) rotateX(0deg) rotateY(0deg);
            }

            25% {
                transform: perspective(500px) rotateX(15deg) rotateY(15deg);
            }

            50% {
                transform: perspective(500px) rotateX(0deg) rotateY(30deg);
            }

            75% {
                transform: perspective(500px) rotateX(-15deg) rotateY(15deg);
            }
        }

        @keyframes squarePulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes fractalMove {
            0% {
                transform: translateX(-100px) translateY(-100px) rotate(0deg) scale(0.5);
                opacity: 0;
            }

            25% {
                transform: translateX(100px) translateY(-50px) rotate(90deg) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateX(50px) translateY(100px) rotate(180deg) scale(1.2);
                opacity: 0.8;
            }

            75% {
                transform: translateX(-50px) translateY(50px) rotate(270deg) scale(0.8);
                opacity: 0.6;
            }

            100% {
                transform: translateX(-100px) translateY(-100px) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        @keyframes morph {
            0% {
                clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
                transform: translateX(-50%) rotate(0deg);
            }

            16% {
                clip-path: polygon(0% 0%, 0% 100%, 100% 50%);
                transform: translateX(-50%) rotate(60deg);
            }

            32% {
                clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
                transform: translateX(-50%) rotate(120deg);
            }

            48% {
                clip-path: polygon(50% 0%, 100% 50%, 0% 100%);
                transform: translateX(-50%) rotate(180deg);
            }

            64% {
                clip-path: circle(50% at 50% 50%);
                transform: translateX(-50%) rotate(240deg);
            }

            80% {
                clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
                transform: translateX(-50%) rotate(300deg);
            }

            100% {
                clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
                transform: translateX(-50%) rotate(360deg);
            }
        }

        .speed-normal * {
            animation-play-state: running;
        }

        .speed-slow * {
            animation-duration: 2s !important;
        }

        .speed-fast * {
            animation-duration: 0.5s !important;
        }

        .speed-frozen * {
            animation-play-state: paused;
        }
    </style>
</head>

<body>
    <div class="illusion-stage speed-normal" id="illusionStage">
        <div class="controls">
            <div class="btn-group-vertical" role="group">
                <button class="btn btn-illusion btn-sm" onclick="changeSpeed('slow')">Slow Motion</button>
                <button class="btn btn-illusion btn-sm" onclick="changeSpeed('normal')">Normal</button>
                <button class="btn btn-illusion btn-sm" onclick="changeSpeed('fast')">Fast Forward</button>
                <button class="btn btn-illusion btn-sm" onclick="changeSpeed('frozen')">Freeze</button>
            </div>
            <div class="btn-group-vertical mt-2" role="group">
                <button class="btn btn-illusion btn-sm" onclick="toggleElement('penrose')">Penrose</button>
                <button class="btn btn-illusion btn-sm" onclick="toggleElement('stairs')">Stairs</button>
                <button class="btn btn-illusion btn-sm" onclick="toggleElement('mobius')">Möbius</button>
                <button class="btn btn-illusion btn-sm" onclick="toggleElement('cube')">Cube</button>
                <button class="btn btn-illusion btn-sm" onclick="randomizeAll()">Chaos Mode</button>
            </div>
        </div>

        <!-- Penrose Triangle -->
        <div class="penrose-triangle" id="penrose">
            <div class="triangle-beam beam1"></div>
            <div class="triangle-beam beam2"></div>
            <div class="triangle-beam beam3"></div>
        </div>

        <!-- Impossible Stairs -->
        <div class="impossible-stairs" id="stairs">
            <div class="stair" style="top: 0px; left: 0px;"></div>
            <div class="stair" style="top: 20px; left: 20px;"></div>
            <div class="stair" style="top: 40px; left: 40px;"></div>
            <div class="stair" style="top: 60px; left: 60px;"></div>
            <div class="stair" style="top: 80px; left: 80px;"></div>
            <div class="stair" style="top: 100px; left: 60px;"></div>
            <div class="stair" style="top: 120px; left: 40px;"></div>
            <div class="stair" style="top: 140px; left: 20px;"></div>
            <div class="stair" style="top: 160px; left: 0px;"></div>
        </div>

        <!-- Möbius Strip -->
        <div class="mobius-strip" id="mobius">
            <div class="strip-segment" style="transform: rotateY(0deg) translateZ(100px);"></div>
            <div class="strip-segment" style="transform: rotateY(45deg) translateZ(70px);"></div>
            <div class="strip-segment" style="transform: rotateY(90deg) translateZ(0px);"></div>
            <div class="strip-segment" style="transform: rotateY(135deg) translateZ(-70px);"></div>
            <div class="strip-segment" style="transform: rotateY(180deg) translateZ(-100px);"></div>
            <div class="strip-segment" style="transform: rotateY(225deg) translateZ(-70px);"></div>
            <div class="strip-segment" style="transform: rotateY(270deg) translateZ(0px);"></div>
            <div class="strip-segment" style="transform: rotateY(315deg) translateZ(70px);"></div>
        </div>

        <!-- Escher Cube -->
        <div class="escher-cube" id="cube">
            <div class="cube-face" style="transform: translateZ(50px);"></div>
            <div class="cube-face" style="transform: rotateY(90deg) translateZ(50px);"></div>
            <div class="cube-face" style="transform: rotateY(180deg) translateZ(50px);"></div>
            <div class="cube-face" style="transform: rotateY(270deg) translateZ(50px);"></div>
            <div class="cube-face" style="transform: rotateX(90deg) translateZ(50px);"></div>
            <div class="cube-face" style="transform: rotateX(-90deg) translateZ(50px);"></div>
        </div>

        <!-- Infinity Loop -->
        <div class="infinity-loop">
            <div class="loop-path"></div>
            <div class="loop-path" style="transform: rotateY(180deg);"></div>
        </div>

        <!-- Optical Squares -->
        <div class="optical-squares">
            <div class="square-grid" id="squareGrid"></div>
        </div>

        <!-- Morphing Shape -->
        <div class="morphing-shape"></div>

        <!-- Floating Fractals -->
        <div class="floating-fractals" id="fractals"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        let chaosMode = false;
        let chaosInterval;

        function changeSpeed(speed) {
            const stage = document.getElementById('illusionStage');
            stage.className = `illusion-stage speed-${speed}`;
        }

        function toggleElement(elementId) {
            const element = document.getElementById(elementId);
            if (element.style.display === 'none') {
                element.style.display = 'block';
                element.style.animation = 'none';
                element.offsetHeight; // Trigger reflow
                element.style.animation = null;
            } else {
                element.style.display = 'none';
            }
        }

        function randomizeAll() {
            chaosMode = !chaosMode;

            if (chaosMode) {
                chaosInterval = setInterval(() => {
                    // Random colors
                    const hue1 = Math.random() * 360;
                    const hue2 = (hue1 + 120) % 360;
                    const hue3 = (hue1 + 240) % 360;

                    document.documentElement.style.setProperty('--chaos-color1', `hsl(${hue1}, 70%, 60%)`);
                    document.documentElement.style.setProperty('--chaos-color2', `hsl(${hue2}, 70%, 60%)`);
                    document.documentElement.style.setProperty('--chaos-color3', `hsl(${hue3}, 70%, 60%)`);

                    // Random positions
                    const elements = ['penrose', 'stairs', 'mobius', 'cube'];
                    elements.forEach(id => {
                        const el = document.getElementById(id);
                        const randomX = (Math.random() - 0.5) * 200;
                        const randomY = (Math.random() - 0.5) * 200;
                        el.style.transform = `translate(${randomX}px, ${randomY}px)`;
                    });

                    // Random speeds
                    const speeds = ['slow', 'normal', 'fast'];
                    const randomSpeed = speeds[Math.floor(Math.random() * speeds.length)];
                    changeSpeed(randomSpeed);
                }, 2000);
            } else {
                clearInterval(chaosInterval);
                // Reset positions
                const elements = ['penrose', 'stairs', 'mobius', 'cube'];
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    el.style.transform = '';
                });
                changeSpeed('normal');
            }
        }

        function createSquareGrid() {
            const grid = document.getElementById('squareGrid');
            for (let i = 0; i < 64; i++) {
                const square = document.createElement('div');
                square.className = 'grid-square';
                square.style.animationDelay = `${Math.random() * 2}s`;
                grid.appendChild(square);
            }
        }

        function createFractals() {
            const container = document.getElementById('fractals');
            for (let i = 0; i < 20; i++) {
                const fractal = document.createElement('div');
                fractal.className = 'fractal';
                fractal.style.left = Math.random() * 100 + '%';
                fractal.style.top = Math.random() * 100 + '%';
                fractal.style.animationDelay = Math.random() * 20 + 's';
                fractal.style.animationDuration = (Math.random() * 10 + 15) + 's';

                // Random fractal colors
                const colors = ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5', '#ffbe0b', '#fb8500'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                fractal.style.background = `radial-gradient(circle, transparent 40%, ${color} 41%, ${color} 59%, transparent 60%)`;

                container.appendChild(fractal);
            }
        }

        function addMouseInteraction() {
            const stage = document.getElementById('illusionStage');

            stage.addEventListener('mousemove', (e) => {
                const rect = stage.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;

                // Parallax effect
                const penrose = document.getElementById('penrose');
                const moveX = (x - 0.5) * 50;
                const moveY = (y - 0.5) * 50;

                if (!chaosMode) {
                    penrose.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }

                // Change perspective based on mouse
                const perspective = 800 + (x * 400);
                stage.style.perspective = perspective + 'px';
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createSquareGrid();
            createFractals();
            addMouseInteraction();

            // Add some dynamic interactions
            setInterval(() => {
                if (!chaosMode) {
                    const squares = document.querySelectorAll('.grid-square');
                    const randomSquare = squares[Math.floor(Math.random() * squares.length)];
                    randomSquare.style.backgroundColor = randomSquare.style.backgroundColor === 'rgb(255, 0, 110)' ? '#000' : '#ff006e';
                }
            }, 1000);
        });

        // Add keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case '1': changeSpeed('slow'); break;
                case '2': changeSpeed('normal'); break;
                case '3': changeSpeed('fast'); break;
                case ' ': changeSpeed('frozen'); break;
                case 'c': randomizeAll(); break;
            }
        });
    </script>
</body>

</html>
