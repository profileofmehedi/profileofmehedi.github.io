<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Zoomquilt Illusion</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button onclick="toggleZoom()">Pause/Resume</button>
        <button onclick="reverseZoom()">Reverse</button>
        <p>Zoom Level: <span id="zoomLevel">1</span></p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Resize canvas to fit window
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let zoom = 1;
        let zoomSpeed = .10;
        let isPaused = false;
        let time = 0;

        // Parabolic easing for smooth zoom
        function easeParabolic(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        // Generate layered patterns
        function drawLayer(scale, offset) {
            const t = time + offset;
            const size = Math.min(width, height) / scale;
            const centerX = width / 2;
            const centerY = height / 2;

            // Dynamic color using sine waves
            const r = Math.sin(t * 0.1) * 127 + 128;
            const g = Math.sin(t * 0.2 + 2) * 127 + 128;
            const b = Math.sin(t * 0.3 + 4) * 127 + 128;

            // Spiral geometry with logarithmic scaling
            const spiralCount = 12;
            for (let i = 0; i < spiralCount; i++) {
                const theta = (i / spiralCount) * 2 * Math.PI + t * 0.1;
                const radius = size * Math.log(1 + scale * 0.1);
                const x = centerX + Math.cos(theta) * radius;
                const y = centerY + Math.sin(theta) * radius;

                ctx.beginPath();
                ctx.arc(x, y, size * 0.1, 0, 2 * Math.PI);
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.5 / scale})`;
                ctx.stroke();

                // Nested fractal-like patterns
                if (scale < 10) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(theta);
                    ctx.scale(0.5, 0.5);
                    drawLayer(scale * 2, offset + i);
                    ctx.restore();
                }
            }
        }

        // Animation loop
        function animate() {
            if (!isPaused) {
                time += 0.05;
                zoom = Math.max(1, zoom + zoomSpeed * easeParabolic(time % 1));
                document.getElementById('zoomLevel').textContent = zoom.toFixed(2);

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);

                // Draw multiple layers for depth
                for (let i = 0; i < 5; i++) {
                    drawLayer(zoom * Math.pow(2, i), i * 0.5);
                }
            }
            requestAnimationFrame(animate);
        }

        // Control functions
        function toggleZoom() {
            isPaused = !isPaused;
        }

        function reverseZoom() {
            zoomSpeed = -zoomSpeed;
        }

        // Start animation
        animate();
    </script>
</body>

</html>
