<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Optical Illusion</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .illusion-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a2e, #16213e, #0f3460);
        }

        .spiral-container {
            position: absolute;
            width: 800px;
            height: 800px;
            animation: rotate 20s linear infinite;
        }

        .spiral {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);
            animation: counterRotate 15s linear infinite reverse;
        }

        .concentric-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .circle {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 3s ease-in-out infinite alternate;
        }

        .circle:nth-child(1) {
            width: 100px;
            height: 100px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            animation-delay: 0.2s;
        }

        .circle:nth-child(3) {
            width: 300px;
            height: 300px;
            animation-delay: 0.4s;
        }

        .circle:nth-child(4) {
            width: 400px;
            height: 400px;
            animation-delay: 0.6s;
        }

        .circle:nth-child(5) {
            width: 500px;
            height: 500px;
            animation-delay: 0.8s;
        }

        .circle:nth-child(6) {
            width: 600px;
            height: 600px;
            animation-delay: 1s;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            animation: float 8s ease-in-out infinite;
            opacity: 0.7;
        }

        .shape:nth-child(odd) {
            border-radius: 50%;
            animation-direction: reverse;
        }

        .shape:nth-child(even) {
            transform: rotate(45deg);
        }

        .hypnotic-center {
            position: absolute;
            width: 150px;
            height: 150px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle,
                    rgba(255, 255, 255, 1) 0%,
                    rgba(255, 255, 255, 0.8) 10%,
                    rgba(0, 0, 0, 0.9) 20%,
                    rgba(255, 255, 255, 0.6) 30%,
                    rgba(0, 0, 0, 0.8) 40%,
                    rgba(255, 255, 255, 0.4) 50%,
                    rgba(0, 0, 0, 0.7) 60%,
                    rgba(255, 255, 255, 0.2) 70%,
                    rgba(0, 0, 0, 0.6) 80%,
                    transparent 100%);
            border-radius: 50%;
            animation: hypnotize 2s linear infinite;
            z-index: 10;
        }

        .particle-system {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: particle-move 6s linear infinite;
            opacity: 0;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
        }

        .btn-custom {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            backdrop-filter: blur(10px);
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            color: white;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counterRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) translateX(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-30px) translateX(20px) rotate(90deg);
            }

            50% {
                transform: translateY(0px) translateX(40px) rotate(180deg);
            }

            75% {
                transform: translateY(30px) translateX(20px) rotate(270deg);
            }
        }

        @keyframes hypnotize {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                filter: hue-rotate(0deg);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1) rotate(180deg);
                filter: hue-rotate(180deg);
            }

            100% {
                transform: translate(-50%, -50%) scale(1) rotate(360deg);
                filter: hue-rotate(360deg);
            }
        }

        @keyframes particle-move {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }

            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }

            90% {
                opacity: 1;
                transform: translateY(10vh) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(0vh) scale(0);
            }
        }

        .intensity-low .spiral-container {
            animation-duration: 30s;
        }

        .intensity-medium .spiral-container {
            animation-duration: 20s;
        }

        .intensity-high .spiral-container {
            animation-duration: 10s;
        }

        .intensity-extreme .spiral-container {
            animation-duration: 5s;
        }

        .warning {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div class="illusion-container intensity-medium" id="illusionContainer">
        <div class="controls">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-custom btn-sm" onclick="setIntensity('low')">Gentle</button>
                <button type="button" class="btn btn-custom btn-sm" onclick="setIntensity('medium')">Medium</button>
                <button type="button" class="btn btn-custom btn-sm" onclick="setIntensity('high')">Intense</button>
                <button type="button" class="btn btn-custom btn-sm" onclick="setIntensity('extreme')">EXTREME</button>
            </div>
            <br>
            <button type="button" class="btn btn-custom btn-sm mt-2" onclick="toggleParticles()">Toggle
                Particles</button>
            <button type="button" class="btn btn-custom btn-sm mt-2" onclick="changeColors()">Change Colors</button>
        </div>

        <div class="spiral-container">
            <div class="spiral"></div>
        </div>

        <div class="concentric-circles">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>

        <div class="floating-shapes" id="floatingShapes"></div>

        <div class="hypnotic-center"></div>

        <div class="particle-system" id="particleSystem"></div>

        <div class="warning">
            ⚠️ May cause dizziness. Look away if you feel uncomfortable.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        let particlesEnabled = true;
        let colorScheme = 0;
        const colorSchemes = [
            ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24'],
            ['#e74c3c', '#9b59b6', '#3498db', '#2ecc71'],
            ['#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3'],
            ['#ff6348', '#ffa502', '#2ed573', '#1e90ff']
        ];

        function setIntensity(level) {
            const container = document.getElementById('illusionContainer');
            container.className = `illusion-container intensity-${level}`;
        }

        function toggleParticles() {
            particlesEnabled = !particlesEnabled;
            if (particlesEnabled) {
                createParticles();
            } else {
                document.getElementById('particleSystem').innerHTML = '';
            }
        }

        function changeColors() {
            colorScheme = (colorScheme + 1) % colorSchemes.length;
            const shapes = document.querySelectorAll('.shape');
            const colors = colorSchemes[colorScheme];

            shapes.forEach((shape, index) => {
                shape.style.background = `linear-gradient(45deg, ${colors[index % colors.length]}, ${colors[(index + 1) % colors.length]})`;
            });
        }

        function createFloatingShapes() {
            const container = document.getElementById('floatingShapes');
            const shapes = 30;

            for (let i = 0; i < shapes; i++) {
                const shape = document.createElement('div');
                shape.className = 'shape';
                shape.style.left = Math.random() * 100 + '%';
                shape.style.top = Math.random() * 100 + '%';
                shape.style.animationDelay = Math.random() * 8 + 's';
                shape.style.animationDuration = (Math.random() * 4 + 6) + 's';
                container.appendChild(shape);
            }
        }

        function createParticles() {
            if (!particlesEnabled) return;

            const container = document.getElementById('particleSystem');
            container.innerHTML = '';
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                container.appendChild(particle);
            }
        }

        function addMouseInteraction() {
            const container = document.getElementById('illusionContainer');
            const center = document.querySelector('.hypnotic-center');

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;

                const translateX = (x - 0.5) * 20;
                const translateY = (y - 0.5) * 20;

                center.style.transform = `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px))`;
            });

            container.addEventListener('mouseleave', () => {
                center.style.transform = 'translate(-50%, -50%)';
            });
        }

        function addClickEffects() {
            const container = document.getElementById('illusionContainer');

            container.addEventListener('click', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.width = '10px';
                ripple.style.height = '10px';
                ripple.style.border = '2px solid rgba(255,255,255,0.8)';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'translate(-50%, -50%)';
                ripple.style.animation = 'pulse 1s ease-out';
                ripple.style.pointerEvents = 'none';
                ripple.style.zIndex = '20';

                container.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 1000);
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingShapes();
            createParticles();
            addMouseInteraction();
            addClickEffects();

            // Recreate particles periodically
            setInterval(() => {
                if (particlesEnabled) {
                    createParticles();
                }
            }, 8000);
        });

        // Add some random spiral speed variations
        setInterval(() => {
            const spiral = document.querySelector('.spiral');
            const randomSpeed = Math.random() * 10 + 10;
            spiral.style.animationDuration = randomSpeed + 's';
        }, 15000);
    </script>
</body>

</html>
