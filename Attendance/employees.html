<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employees - Quantum OS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --sidebar-bg: #212529;
        --body-bg: #eef2f7;
      }
      body {
        background-color: var(--body-bg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .wrapper {
        display: flex;
      }
      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        background-color: var(--sidebar-bg);
        transition: margin-left 0.3s;
        z-index: 1000;
      }
      .sidebar .logo {
        font-weight: 700;
        color: #fff;
      }
      .sidebar a {
        color: #adb5bd;
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        margin: 5px 10px;
        border-radius: 5px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: #0d6efd;
        color: #fff;
      }
      .main-content {
        flex-grow: 1;
        margin-left: 260px;
        padding: 20px;
        transition: margin-left 0.3s;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
      }
      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      }
      .employee-avatar {
        width: 40px;
        height: 40px;
        object-fit: cover;
      }
      th.sortable {
        cursor: pointer;
      }
      th.sortable:hover {
        background-color: #f1f1f1;
      }
      .profile-modal-avatar {
        width: 100px;
        height: 100px;
      }
      .badge.bg-success {
        background-color: #d1e7dd !important;
        color: #0f5132 !important;
      }
      .badge.bg-danger {
        background-color: #f8d7da !important;
        color: #842029 !important;
      }
      @media (max-width: 991.98px) {
        .sidebar {
          margin-left: -260px;
        }
        .sidebar.active {
          margin-left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .menu-toggle {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar">
        <h3 class="logo text-center p-3">
          <i class="fas fa-atom"></i> Quantum OS
        </h3>
        <hr class="bg-light mx-2 mt-0" />
        <a href="index.html"
          ><i class="fas fa-tachometer-alt fa-fw me-2"></i> Dashboard</a
        ><a href="employees.html" class="active"
          ><i class="fas fa-users fa-fw me-2"></i> Employees</a
        ><a href="departments.html"
          ><i class="fas fa-building fa-fw me-2"></i> Departments</a
        ><a href="attendance.html"
          ><i class="fas fa-calendar-check fa-fw me-2"></i> Attendance</a
        ><a href="leave_management.html"
          ><i class="fas fa-calendar-alt fa-fw me-2"></i> Leave Management</a
        ><a href="reports.html"
          ><i class="fas fa-chart-bar fa-fw me-2"></i> Reports</a
        ><a href="settings.html"
          ><i class="fas fa-cog fa-fw me-2"></i> Settings</a
        >
      </nav>
      <div class="main-content">
        <header class="d-flex align-items-center justify-content-between mb-4">
          <div class="d-flex align-items-center">
            <button class="menu-toggle" id="menuToggle">
              <i class="fas fa-bars"></i>
            </button>
            <h1 class="h3 mb-0 ms-3">Manage Employees</h1>
          </div>
          <button class="btn btn-primary" id="addEmployeeBtn">
            <i class="fas fa-plus me-2"></i>Add Employee
          </button>
        </header>
        <div class="card">
          <div class="card-header bg-white p-3">
            <div class="row g-2 justify-content-between">
              <div class="col-md-3">
                <input
                  type="text"
                  id="searchInput"
                  class="form-control"
                  placeholder="Search..."
                />
              </div>
              <div class="col-md-3">
                <select id="departmentFilter" class="form-select">
                  <option value="">All Departments</option>
                  <option>Engineering</option>
                  <option>Marketing</option>
                  <option>Sales</option>
                  <option>HR</option>
                </select>
              </div>
              <div class="col-md-3">
                <div class="dropdown">
                  <button
                    class="btn btn-outline-secondary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                  >
                    Bulk Actions
                  </button>
                  <ul class="dropdown-menu">
                    <li id="deleteSelectedBtn">
                      <a class="dropdown-item" href="#"
                        ><i class="fas fa-trash me-2"></i>Delete Selected</a
                      >
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th><input type="checkbox" id="selectAll" /></th>
                    <th class="sortable" data-sort="name">
                      Name <i class="fas fa-sort"></i>
                    </th>
                    <th>Department</th>
                    <th class="sortable" data-sort="position">
                      Position <i class="fas fa-sort"></i>
                    </th>
                    <th class="sortable" data-sort="joinDate">
                      Join Date <i class="fas fa-sort"></i>
                    </th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
              </table>
            </div>
          </div>
          <div
            class="card-footer bg-white d-flex justify-content-between align-items-center"
          >
            <span id="entryInfo"></span>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
          </div>
        </div>
      </div>
    </div>
    <!-- Add/Edit Employee Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="employeeForm" class="row g-3">
              <input type="hidden" id="employeeId" />
              <div class="col-md-6">
                <label class="form-label">Full Name</label
                ><input type="text" class="form-control" id="name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Address</label
                ><input type="email" class="form-control" id="email" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Department</label
                ><select id="department" class="form-select" required>
                  <option>Engineering</option>
                  <option>Marketing</option>
                  <option>Sales</option>
                  <option>HR</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Position</label
                ><input
                  type="text"
                  class="form-control"
                  id="position"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Join Date</label
                ><input
                  type="date"
                  class="form-control"
                  id="joinDate"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label
                ><select id="status" class="form-select">
                  <option>Active</option>
                  <option>Inactive</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Avatar URL</label
                ><input type="text" class="form-control" id="avatarUrl" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close</button
            ><button type="submit" form="employeeForm" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- View Profile Modal -->
    <div class="modal fade" id="profileModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header border-0">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center p-4">
            <img
              id="profileAvatar"
              class="rounded-circle profile-modal-avatar mb-3"
            />
            <h3 id="profileName"></h3>
            <p id="profilePosition" class="text-muted"></p>
            <hr />
            <div class="text-start">
              <p>
                <strong
                  ><i class="fas fa-envelope fa-fw me-2"></i>Email:</strong
                >
                <span id="profileEmail"></span>
              </p>
              <p>
                <strong
                  ><i class="fas fa-building fa-fw me-2"></i>Department:</strong
                >
                <span id="profileDepartment"></span>
              </p>
              <p>
                <strong
                  ><i class="fas fa-calendar-alt fa-fw me-2"></i>Join
                  Date:</strong
                >
                <span id="profileJoinDate"></span>
              </p>
              <p>
                <strong
                  ><i class="fas fa-check-circle fa-fw me-2"></i>Status:</strong
                >
                <span id="profileStatus"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#menuToggle").on("click", () => $(".sidebar").toggleClass("active"));
        toastr.options = { positionClass: "toast-bottom-right" };

        let employees = Array.from({ length: 35 }, (_, i) => {
          const depts = ["Engineering", "Marketing", "Sales", "HR"];
          const dept = depts[i % 4];
          const join = new Date(
            2022 - Math.floor(i / 5),
            (i % 12) + 1,
            (i % 28) + 1
          )
            .toISOString()
            .slice(0, 10);
          return {
            id: i + 1,
            name: `Employee ${i + 1}`,
            email: `emp${i + 1}@example.com`,
            department: dept,
            position: `Analyst`,
            joinDate: join,
            status: i % 10 == 0 ? "Inactive" : "Active",
            avatarUrl: `https://i.pravatar.cc/150?u=emp${i + 1}`,
          };
        });

        let currentPage = 1,
          rowsPerPage = 10,
          sortColumn = "name",
          sortDirection = "asc";
        const employeeModal = new bootstrap.Modal(
          document.getElementById("employeeModal")
        );
        const profileModal = new bootstrap.Modal(
          document.getElementById("profileModal")
        );

        function displayData() {
          // Filter
          const searchTerm = $("#searchInput").val().toLowerCase();
          const deptFilter = $("#departmentFilter").val();
          let filtered = employees.filter(
            (e) =>
              (e.name.toLowerCase().includes(searchTerm) ||
                e.email.toLowerCase().includes(searchTerm)) &&
              (deptFilter === "" || e.department === deptFilter)
          );

          // Sort
          filtered.sort((a, b) => {
            let valA = a[sortColumn],
              valB = b[sortColumn];
            if (valA < valB) return sortDirection === "asc" ? -1 : 1;
            if (valA > valB) return sortDirection === "asc" ? 1 : -1;
            return 0;
          });

          // Paginate
          const start = (currentPage - 1) * rowsPerPage;
          const end = start + rowsPerPage;
          const paginated = filtered.slice(start, end);

          $("#employeeTable").empty();
          paginated.forEach((emp) => {
            $("#employeeTable").append(`
                    <tr data-id="${emp.id}">
                        <td><input type="checkbox" class="emp-checkbox" data-id="${
                          emp.id
                        }"></td>
                        <td><img src="${
                          emp.avatarUrl
                        }" class="rounded-circle employee-avatar me-2"> ${
              emp.name
            }</td>
                        <td>${emp.department}</td><td>${emp.position}</td><td>${
              emp.joinDate
            }</td>
                        <td><span class="badge ${
                          emp.status === "Active" ? "bg-success" : "bg-danger"
                        }">${emp.status}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary view-btn" title="View Profile"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-sm btn-outline-primary edit-btn" title="Edit"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`);
          });

          renderPagination(filtered.length);
          $("#entryInfo").text(
            `Showing ${start + 1} to ${Math.min(end, filtered.length)} of ${
              filtered.length
            } entries`
          );
          $("#selectAll").prop("checked", false);
        }

        function renderPagination(totalRows) {
          const totalPages = Math.ceil(totalRows / rowsPerPage);
          $("#pagination").empty();
          if (totalPages <= 1) return;
          $("#pagination").append(
            `<li class="page-item ${
              currentPage === 1 ? "disabled" : ""
            }"><a class="page-link" href="#" data-page="${
              currentPage - 1
            }">Previous</a></li>`
          );
          for (let i = 1; i <= totalPages; i++) {
            $("#pagination").append(
              `<li class="page-item ${
                currentPage === i ? "active" : ""
              }"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`
            );
          }
          $("#pagination").append(
            `<li class="page-item ${
              currentPage === totalPages ? "disabled" : ""
            }"><a class="page-link" href="#" data-page="${
              currentPage + 1
            }">Next</a></li>`
          );
        }

        // Event Handlers
        $("#searchInput, #departmentFilter").on("keyup change", () => {
          currentPage = 1;
          displayData();
        });
        $(document).on("click", ".sortable", function () {
          const newSortColumn = $(this).data("sort");
          sortDirection =
            sortColumn === newSortColumn && sortDirection === "asc"
              ? "desc"
              : "asc";
          sortColumn = newSortColumn;
          $(".sortable i").attr("class", "fas fa-sort");
          $(this)
            .find("i")
            .attr(
              "class",
              `fas fa-sort-${sortDirection === "asc" ? "up" : "down"}`
            );
          displayData();
        });
        $(document).on("click", ".page-link", function (e) {
          e.preventDefault();
          currentPage = $(this).data("page");
          displayData();
        });

        $("#addEmployeeBtn").on("click", () => {
          $("#modalTitle").text("Add New Employee");
          $("#employeeForm")[0].reset();
          $("#employeeId").val("");
          employeeModal.show();
        });

        $("#employeeTable").on("click", ".edit-btn", function () {
          const id = $(this).closest("tr").data("id");
          const emp = employees.find((e) => e.id == id);
          $("#modalTitle").text("Edit Employee");
          Object.keys(emp).forEach((key) => $(`#${key}`).val(emp[key]));
          employeeModal.show();
        });

        $("#employeeTable").on("click", ".view-btn", function () {
          const id = $(this).closest("tr").data("id");
          const emp = employees.find((e) => e.id == id);
          $("#profileAvatar").attr("src", emp.avatarUrl);
          $("#profileName").text(emp.name);
          $("#profilePosition").text(emp.position);
          $("#profileEmail").text(emp.email);
          $("#profileDepartment").text(emp.department);
          $("#profileJoinDate").text(emp.joinDate);
          $("#profileStatus").html(
            `<span class="badge ${
              emp.status === "Active" ? "bg-success" : "bg-danger"
            }">${emp.status}</span>`
          );
          profileModal.show();
        });

        $("#employeeForm").on("submit", function (e) {
          e.preventDefault();
          const id = $("#employeeId").val();
          const empData = {
            name: $("#name").val(),
            email: $("#email").val(),
            department: $("#department").val(),
            position: $("#position").val(),
            joinDate: $("#joinDate").val(),
            status: $("#status").val(),
            avatarUrl:
              $("#avatarUrl").val() ||
              `https://i.pravatar.cc/150?u=${Math.random()}`,
          };
          if (id) {
            const index = employees.findIndex((e) => e.id == id);
            employees[index] = { ...employees[index], ...empData };
            toastr.success("Employee updated!");
          } else {
            empData.id = employees.length
              ? Math.max(...employees.map((e) => e.id)) + 1
              : 1;
            employees.push(empData);
            toastr.success("Employee added!");
          }
          displayData();
          employeeModal.hide();
        });

        $("#employeeTable").on("click", ".delete-btn", function () {
          if (confirm("Are you sure?")) {
            const id = $(this).closest("tr").data("id");
            employees = employees.filter((e) => e.id != id);
            displayData();
            toastr.warning("Employee deleted.");
          }
        });

        $("#selectAll").on("click", function () {
          $(".emp-checkbox").prop("checked", this.checked);
        });
        $("#deleteSelectedBtn").on("click", function () {
          const selectedIds = $(".emp-checkbox:checked")
            .map((_, el) => $(el).data("id"))
            .get();
          if (selectedIds.length === 0) {
            toastr.info("No employees selected.");
            return;
          }
          if (confirm(`Delete ${selectedIds.length} selected employees?`)) {
            employees = employees.filter((e) => !selectedIds.includes(e.id));
            displayData();
            toastr.warning(`${selectedIds.length} employees deleted.`);
          }
        });

        // Initial Load
        displayData();
      });
    </script>
  </body>
</html>
