<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Reports - Quantum OS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #0d6efd;
        --sidebar-bg: #212529;
        --body-bg: #eef2f7;
        --card-bg: #ffffff;
        --card-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
        --font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
      }
      @media print {
        body {
          background-color: #fff !important;
        }
        .sidebar,
        .main-content-header,
        .filters-card,
        .report-actions {
          display: none !important;
        }
        .main-content {
          margin-left: 0 !important;
          padding: 0 !important;
        }
        .report-output-card {
          box-shadow: none !important;
          border: 1px solid #ddd;
        }
      }

      body {
        background-color: var(--body-bg);
        font-family: var(--font-family);
      }
      .wrapper {
        display: flex;
      }
      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        background-color: var(--sidebar-bg);
        transition: margin-left 0.3s;
        z-index: 1000;
      }
      .sidebar .logo {
        font-weight: 700;
        color: #fff;
      }
      .sidebar a {
        color: #adb5bd;
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        margin: 5px 10px;
        border-radius: 5px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: var(--primary-color);
        color: #fff;
      }
      .main-content {
        flex-grow: 1;
        margin-left: 260px;
        padding: 20px;
        transition: margin-left 0.3s;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
      }
      .card {
        border: none;
        background-color: var(--card-bg);
        box-shadow: var(--card-shadow);
        border-radius: 12px;
      }

      .report-nav .list-group-item {
        cursor: pointer;
        border: none;
        border-left: 3px solid transparent;
        border-radius: 0;
        font-weight: 500;
      }
      .report-nav .list-group-item.active {
        border-left-color: var(--primary-color);
        background-color: #e9f5ff;
        color: var(--primary-color);
      }

      .chart-container {
        position: relative;
        height: 350px;
        width: 100%;
      }

      @media (max-width: 991.98px) {
        .sidebar {
          margin-left: -260px;
        }
        .sidebar.active {
          margin-left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .menu-toggle {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <nav class="sidebar">
        <h3 class="logo text-center p-3">
          <i class="fas fa-atom"></i> Quantum OS
        </h3>
        <hr class="bg-light mx-2 mt-0" />
        <a href="index.html"
          ><i class="fas fa-tachometer-alt fa-fw me-2"></i> Dashboard</a
        ><a href="employees.html"
          ><i class="fas fa-users fa-fw me-2"></i> Employees</a
        ><a href="departments.html"
          ><i class="fas fa-building fa-fw me-2"></i> Departments</a
        ><a href="attendance.html"
          ><i class="fas fa-calendar-check fa-fw me-2"></i> Attendance</a
        ><a href="leave_management.html"
          ><i class="fas fa-calendar-alt fa-fw me-2"></i> Leave Management</a
        ><a href="reports.html" class="active"
          ><i class="fas fa-chart-bar fa-fw me-2"></i> Reports</a
        ><a href="settings.html"
          ><i class="fas fa-cog fa-fw me-2"></i> Settings</a
        >
      </nav>

      <!-- Main Content -->
      <div class="main-content">
        <header class="d-flex align-items-center justify-content-between mb-4">
          <div class="d-flex align-items-center">
            <button class="menu-toggle" id="menuToggle">
              <i class="fas fa-bars"></i>
            </button>
            <h1 class="h3 mb-0 ms-3">Advanced Reports</h1>
          </div>
        </header>

        <div class="row g-4">
          <!-- Report Navigation & Filters -->
          <div class="col-lg-4">
            <div class="card filters-card mb-4">
              <div class="card-header bg-white">
                <h5 class="mb-0">Select a Report</h5>
              </div>
              <div
                class="list-group list-group-flush report-nav"
                id="reportNav"
              >
                <a class="list-group-item active" data-report="summary"
                  >Attendance Summary</a
                >
                <a class="list-group-item" data-report="department"
                  >Departmental Comparison</a
                >
                <a class="list-group-item" data-report="employee"
                  >Employee Performance</a
                >
                <a class="list-group-item" data-report="overtime"
                  >Overtime Analysis</a
                >
                <a class="list-group-item" data-report="leave"
                  >Leave Analysis</a
                >
              </div>
            </div>
            <div class="card filters-card">
              <div class="card-header bg-white">
                <h5 class="mb-0">Report Filters</h5>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label">Date Range</label>
                  <div class="input-group">
                    <input
                      type="date"
                      class="form-control"
                      id="startDate"
                    /><span class="input-group-text">to</span
                    ><input type="date" class="form-control" id="endDate" />
                  </div>
                </div>
                <div id="dynamicFilters"></div>
                <div class="d-grid">
                  <button class="btn btn-primary" id="generateReport">
                    <i class="fas fa-cogs me-2"></i>Generate Report
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Report Output Container -->
          <div class="col-lg-8" id="reportContainer">
            <!-- Report content will be injected here by JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#menuToggle").on("click", () => $(".sidebar").toggleClass("active"));
        toastr.options = {
          positionClass: "toast-bottom-right",
          preventDuplicates: true,
        };
        let currentChart;

        // --- DEMO DATA ---
        const employees = [
          { id: 1, name: "John Doe", department: "Engineering" },
          { id: 2, name: "Jane Smith", department: "Marketing" },
          { id: 3, name: "Peter Jones", department: "Sales" },
          { id: 4, name: "Mary Garcia", department: "Engineering" },
          { id: 5, name: "James Miller", department: "Sales" },
          { id: 6, name: "Susan Wilson", department: "Marketing" },
        ];
        const departments = ["Engineering", "Marketing", "Sales"];

        // --- HTML TEMPLATES ---
        const placeholderHtml = `<div class="card d-flex align-items-center justify-content-center text-center" style="min-height: 600px;"><div><i class="fas fa-chart-pie fa-4x text-light"></i><h4 class="mt-3 text-muted">Your report will appear here</h4><p class="text-muted">Select a report type and set your filters to begin.</p></div></div>`;
        const reportCardTemplate = `<div class="card report-output-card"><div class="card-header bg-white d-flex justify-content-between align-items-center"><div><h5 class="mb-0" id="reportTitle"></h5><small class="text-muted" id="reportSubtitle"></small></div><div class="report-actions"><button class="btn btn-sm btn-outline-secondary" id="printReport" title="Print Report"><i class="fas fa-print"></i></button><button class="btn btn-sm btn-outline-success" id="exportCsv" title="Export to CSV"><i class="fas fa-file-csv"></i></button></div></div><div class="card-body"><div class="chart-container mb-4"><canvas id="reportChart"></canvas></div><div class="table-responsive"><table class="table table-striped table-bordered" id="reportTable"><thead id="reportHeader"></thead><tbody id="reportBody"></tbody></table></div></div></div>`;

        // --- UI LOGIC ---
        const today = new Date();
        const firstDayOfMonth = new Date(
          today.getFullYear(),
          today.getMonth(),
          1
        )
          .toISOString()
          .slice(0, 10);
        $("#startDate").val(firstDayOfMonth);
        $("#endDate").val(today.toISOString().slice(0, 10));

        $("#reportNav a").on("click", function (e) {
          e.preventDefault();
          $("#reportNav a").removeClass("active");
          $(this).addClass("active");
          updateDynamicFilters($(this).data("report"));
        });

        function updateDynamicFilters(reportType) {
          let filterHtml = "";
          if (reportType === "employee") {
            filterHtml = `<div class="mb-3"><label class="form-label">Select Employee</label><select id="employeeSelect" class="form-select">${employees
              .map((e) => `<option value="${e.id}">${e.name}</option>`)
              .join("")}</select></div>`;
          }
          $("#dynamicFilters").html(filterHtml);
        }

        $("#generateReport").on("click", function () {
          if (!$("#startDate").val() || !$("#endDate").val()) {
            toastr.error("Please select a valid date range.");
            return;
          }
          const reportType = $("#reportNav a.active").data("report");
          if (!$(this).data("initial-load")) {
            toastr.info(`Generating ${reportType} report...`);
          } else {
            $(this).removeData("initial-load");
          }
          generateReport(reportType);
        });

        // --- REPORT GENERATION ---
        function generateReport(reportType) {
          if (currentChart) currentChart.destroy();
          $("#reportContainer").html(reportCardTemplate); // Inject the template

          let headers, data, chartConfig;
          // (Switch statement to get data and chartConfig remains the same)
          switch (reportType) {
            case "summary":
              $("#reportTitle").text("Overall Attendance Summary");
              headers = `<tr><th>Metric</th><th>Value</th></tr>`;
              data = `<tr><td>Total Present Days</td><td>1,580</td></tr><tr><td>Total Late Days</td><td>125</td></tr><tr><td>Total Absent Days</td><td>85</td></tr><tr><td>Total Leave Days</td><td>45</td></tr>`;
              chartConfig = getSummaryChart();
              break;
            case "department":
              $("#reportTitle").text("Departmental Comparison");
              headers = `<tr><th>Department</th><th>Attendance Rate</th><th>Late Days</th><th>Overtime (hrs)</th></tr>`;
              data = `<tr><td>Engineering</td><td>95%</td><td>40</td><td>120</td></tr><tr><td>Marketing</td><td>91%</td><td>55</td><td>35</td></tr><tr><td>Sales</td><td>93%</td><td>30</td><td>80</td></tr>`;
              chartConfig = getDepartmentChart();
              break;
            case "employee":
              const emp = employees.find(
                (e) => e.id == $("#employeeSelect").val()
              );
              $("#reportTitle").text(`Performance Report: ${emp.name}`);
              headers = `<tr><th>Month</th><th>Present</th><th>Late</th><th>Absent</th><th>Hours Worked</th></tr>`;
              data = `<tr><td>October</td><td>20</td><td>2</td><td>0</td><td>170</td></tr><tr><td>September</td><td>21</td><td>1</td><td>1</td><td>175</td></tr><tr><td>August</td><td>22</td><td>0</td><td>0</td><td>176</td></tr>`;
              chartConfig = getEmployeeChart();
              break;
            case "overtime":
              $("#reportTitle").text("Overtime Analysis");
              headers = `<tr><th>Employee</th><th>Department</th><th>Total Overtime (hrs)</th></tr>`;
              data = `<tr><td>John Doe</td><td>Engineering</td><td>12.5</td></tr><tr><td>Peter Jones</td><td>Sales</td><td>8.0</td></tr><tr><td>Mary Garcia</td><td>Engineering</td><td>5.5</td></tr>`;
              chartConfig = getOvertimeChart();
              break;
            case "leave":
              $("#reportTitle").text("Leave Type Analysis");
              headers = `<tr><th>Leave Type</th><th>Total Days Taken</th></tr>`;
              data = `<tr><td>Sick Leave</td><td>25</td></tr><tr><td>Annual Leave</td><td>15</td></tr><tr><td>Unpaid Leave</td><td>5</td></tr>`;
              chartConfig = getLeaveChart();
              break;
          }

          // Populate the injected template
          $("#reportSubtitle").text(
            `For period: ${$("#startDate").val()} to ${$("#endDate").val()}`
          );
          $("#reportHeader").html(headers);
          $("#reportBody").html(data);

          // Initialize chart on the new canvas element
          const ctx = document.getElementById("reportChart").getContext("2d");
          currentChart = new Chart(ctx, chartConfig);
        }

        // --- CHART CONFIGURATIONS (remain the same) ---
        const getSummaryChart = () => ({
          type: "doughnut",
          data: {
            labels: ["Present", "Late", "Absent", "Leave"],
            datasets: [
              {
                data: [1580, 125, 85, 45],
                backgroundColor: ["#198754", "#ffc107", "#dc3545", "#0dcaf0"],
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
        const getDepartmentChart = () => ({
          type: "bar",
          data: {
            labels: departments,
            datasets: [
              {
                label: "Late Days",
                data: [40, 55, 30],
                backgroundColor: "#ffc107",
              },
              {
                label: "Overtime (hrs)",
                data: [120, 35, 80],
                backgroundColor: "#0d6efd",
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
        const getEmployeeChart = () => ({
          type: "line",
          data: {
            labels: ["Aug", "Sep", "Oct"],
            datasets: [
              {
                label: "Hours Worked",
                data: [176, 175, 170],
                borderColor: "#0d6efd",
                tension: 0.3,
                fill: false,
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
        const getOvertimeChart = () => ({
          type: "bar",
          data: {
            labels: ["John Doe", "Peter Jones", "Mary Garcia"],
            datasets: [
              {
                label: "Overtime (hrs)",
                data: [12.5, 8, 5.5],
                backgroundColor: "#6f42c1",
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
        const getLeaveChart = () => ({
          type: "pie",
          data: {
            labels: ["Sick", "Annual", "Unpaid"],
            datasets: [
              {
                data: [25, 15, 5],
                backgroundColor: ["#fd7e14", "#20c997", "#6c757d"],
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });

        // --- ACTIONS (using event delegation) ---
        $("#reportContainer").on("click", "#printReport", () => window.print());
        $("#reportContainer").on("click", "#exportCsv", function () {
          let csvContent = "data:text/csv;charset=utf-8,";
          csvContent += $("#reportTitle").text().replace(/,/g, "") + "\r\n";
          document.querySelectorAll("#reportTable tr").forEach((row) => {
            let rowData = Array.from(row.querySelectorAll("th, td")).map(
              (cell) => `"${cell.innerText.replace(/"/g, '""')}"`
            ); // Handle commas and quotes
            csvContent += rowData.join(",") + "\r\n";
          });
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute(
            "download",
            `report_${$("#reportNav a.active").data("report")}.csv`
          );
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          toastr.success("Report exported successfully!");
        });

        // --- INITIALIZATION ---
        updateDynamicFilters("summary");
        $("#reportContainer").html(placeholderHtml); // Show placeholder initially
        $("#generateReport").data("initial-load", true).trigger("click"); // Auto-generate the first report
      });
    </script>
  </body>
</html>
