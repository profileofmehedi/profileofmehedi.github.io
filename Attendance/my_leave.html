<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Leave - Quantum OS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --sidebar-bg: #212529;
        --body-bg: #eef2f7;
      }
      body {
        background-color: var(--body-bg);
      }
      .wrapper {
        display: flex;
      }
      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        background-color: var(--sidebar-bg);
        transition: margin-left 0.3s;
        z-index: 1000;
      }
      .sidebar .logo {
        font-weight: 700;
        color: #fff;
      }
      .sidebar a {
        color: #adb5bd;
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        margin: 5px 10px;
        border-radius: 5px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: #0d6efd;
        color: #fff;
      }
      .main-content {
        flex-grow: 1;
        margin-left: 260px;
        padding: 20px;
        transition: margin-left 0.3s;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
      }
      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      }
      @media (max-width: 991.98px) {
        .sidebar {
          margin-left: -260px;
        }
        .sidebar.active {
          margin-left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .menu-toggle {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar">
        <h3 class="logo text-center p-3">
          <i class="fas fa-atom"></i> Quantum OS
        </h3>
        <hr class="bg-light mx-2 mt-0" />
        <a href="index.html"
          ><i class="fas fa-tachometer-alt fa-fw me-2"></i> Dashboard</a
        ><a href="employees.html"
          ><i class="fas fa-users fa-fw me-2"></i> Employees</a
        ><a href="departments.html"
          ><i class="fas fa-building fa-fw me-2"></i> Departments</a
        ><a href="attendance.html"
          ><i class="fas fa-calendar-check fa-fw me-2"></i> Attendance</a
        ><a href="leave_management.html"
          ><i class="fas fa-calendar-alt fa-fw me-2"></i> Leave Management</a
        ><a href="my_leave.html" class="active"
          ><i class="fas fa-user-clock fa-fw me-2"></i> My Leave</a
        ><a href="reports.html"
          ><i class="fas fa-chart-bar fa-fw me-2"></i> Reports</a
        ><a href="settings.html"
          ><i class="fas fa-cog fa-fw me-2"></i> Settings</a
        >
      </nav>
      <div class="main-content">
        <header class="d-flex align-items-center justify-content-between mb-4">
          <div class="d-flex align-items-center">
            <button class="menu-toggle" id="menuToggle">
              <i class="fas fa-bars"></i>
            </button>
            <h1 class="h3 mb-0 ms-3">My Leave</h1>
          </div>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#applyLeaveModal"
          >
            <i class="fas fa-plus me-2"></i>Apply for Leave
          </button>
        </header>
        <div class="row g-4">
          <div class="col-md-4">
            <div class="card p-3 text-center">
              <h6 class="text-muted">Annual Leave</h6>
              <h4>10 / 15 Days</h4>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3 text-center">
              <h6 class="text-muted">Sick Leave</h6>
              <h4>3 / 10 Days</h4>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3 text-center">
              <h6 class="text-muted">Unpaid Leave</h6>
              <h4>2 Days</h4>
            </div>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-header bg-white">
            <h5 class="mb-0">My Leave History</h5>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table">
                <thead class="table-light">
                  <tr>
                    <th>Leave Type</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Reason</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="leaveHistoryTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Apply Leave Modal -->
    <div class="modal fade" id="applyLeaveModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Apply for Leave</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="applyLeaveForm">
              <div class="mb-3">
                <label class="form-label">Leave Type</label
                ><select id="leaveType" class="form-select" required>
                  <option>Annual</option>
                  <option>Sick</option>
                  <option>Unpaid</option>
                </select>
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label">Start Date</label
                  ><input
                    type="date"
                    id="startDate"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">End Date</label
                  ><input
                    type="date"
                    id="endDate"
                    class="form-control"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Reason</label
                ><textarea
                  id="reason"
                  class="form-control"
                  rows="3"
                  required
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel</button
            ><button
              type="submit"
              form="applyLeaveForm"
              class="btn btn-primary"
            >
              Submit Application
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#menuToggle").on("click", () => $(".sidebar").toggleClass("active"));
        toastr.options = { positionClass: "toast-bottom-right" };
        const applyLeaveModal = new bootstrap.Modal(
          document.getElementById("applyLeaveModal")
        );
        let myRequests = [
          {
            type: "Annual",
            start: "2025-08-01",
            end: "2025-08-05",
            reason: "Family Vacation",
            status: "Approved",
          },
          {
            type: "Sick",
            start: "2025-09-15",
            end: "2025-09-15",
            reason: "Doctor's Appointment",
            status: "Approved",
          },
          {
            type: "Annual",
            start: "2025-12-22",
            end: "2025-12-26",
            reason: "Holiday Break",
            status: "Pending",
          },
        ];

        const renderTable = () => {
          $("#leaveHistoryTable").empty();
          myRequests.forEach((req) => {
            const statusBadges = {
              Pending: "warning",
              Approved: "success",
              Rejected: "danger",
            };
            $("#leaveHistoryTable").append(
              `<tr><td>${req.type}</td><td>${req.start}</td><td>${
                req.end
              }</td><td>${req.reason}</td><td><span class="badge bg-${
                statusBadges[req.status]
              }">${req.status}</span></td></tr>`
            );
          });
        };

        $("#applyLeaveForm").on("submit", function (e) {
          e.preventDefault();
          myRequests.unshift({
            type: $("#leaveType").val(),
            start: $("#startDate").val(),
            end: $("#endDate").val(),
            reason: $("#reason").val(),
            status: "Pending",
          });
          renderTable();
          applyLeaveModal.hide();
          toastr.success("Leave application submitted successfully.");
        });

        renderTable();
      });
    </script>
  </body>
</html>
