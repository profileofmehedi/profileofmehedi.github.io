<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Departments - Quantum OS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --sidebar-bg: #212529;
        --body-bg: #eef2f7;
      }
      body {
        background-color: var(--body-bg);
      }
      .wrapper {
        display: flex;
      }
      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        background-color: var(--sidebar-bg);
        transition: margin-left 0.3s;
        z-index: 1000;
      }
      .sidebar .logo {
        font-weight: 700;
        color: #fff;
      }
      .sidebar a {
        color: #adb5bd;
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        margin: 5px 10px;
        border-radius: 5px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: #0d6efd;
        color: #fff;
      }
      .main-content {
        flex-grow: 1;
        margin-left: 260px;
        padding: 20px;
        transition: margin-left 0.3s;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
      }
      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      }
      th.sortable {
        cursor: pointer;
      }
      th.sortable:hover {
        background-color: #f1f1f1;
      }
      @media (max-width: 991.98px) {
        .sidebar {
          margin-left: -260px;
        }
        .sidebar.active {
          margin-left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .menu-toggle {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar">
        <h3 class="logo text-center p-3">
          <i class="fas fa-atom"></i> Quantum OS
        </h3>
        <hr class="bg-light mx-2 mt-0" />
        <a href="index.html"
          ><i class="fas fa-tachometer-alt fa-fw me-2"></i> Dashboard</a
        ><a href="employees.html"
          ><i class="fas fa-users fa-fw me-2"></i> Employees</a
        ><a href="departments.html" class="active"
          ><i class="fas fa-building fa-fw me-2"></i> Departments</a
        ><a href="attendance.html"
          ><i class="fas fa-calendar-check fa-fw me-2"></i> Attendance</a
        ><a href="leave_management.html"
          ><i class="fas fa-calendar-alt fa-fw me-2"></i> Leave Management</a
        ><a href="my_leave.html"
          ><i class="fas fa-user-clock fa-fw me-2"></i> My Leave</a
        ><a href="reports.html"
          ><i class="fas fa-chart-bar fa-fw me-2"></i> Reports</a
        ><a href="settings.html"
          ><i class="fas fa-cog fa-fw me-2"></i> Settings</a
        >
      </nav>
      <div class="main-content">
        <header class="d-flex align-items-center justify-content-between mb-4">
          <div class="d-flex align-items-center">
            <button class="menu-toggle" id="menuToggle">
              <i class="fas fa-bars"></i>
            </button>
            <h1 class="h3 mb-0 ms-3">Manage Departments</h1>
          </div>
          <button class="btn btn-primary" id="addDeptBtn">
            <i class="fas fa-plus me-2"></i>Add Department
          </button>
        </header>
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th class="sortable" data-sort="name">
                      Department Name <i class="fas fa-sort"></i>
                    </th>
                    <th class="sortable" data-sort="employeeCount">
                      Employee Count <i class="fas fa-sort"></i>
                    </th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="deptTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Department Modal -->
    <div class="modal fade" id="deptModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="deptForm">
              <input type="hidden" id="deptId" />
              <div class="mb-3">
                <label class="form-label">Department Name</label
                ><input type="text" class="form-control" id="name" required />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close</button
            ><button type="submit" form="deptForm" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#menuToggle").on("click", () => $(".sidebar").toggleClass("active"));
        toastr.options = { positionClass: "toast-bottom-right" };
        let departments = [
          { id: 1, name: "Engineering", employeeCount: 450 },
          { id: 2, name: "Marketing", employeeCount: 280 },
          { id: 3, name: "Sales", employeeCount: 320 },
          { id: 4, name: "HR", employeeCount: 100 },
        ];
        const deptModal = new bootstrap.Modal(
          document.getElementById("deptModal")
        );
        let sortColumn = "name",
          sortDirection = "asc";

        const renderTable = () => {
          departments.sort((a, b) => {
            let x = a[sortColumn],
              y = b[sortColumn];
            return (
              (x < y ? -1 : x > y ? 1 : 0) * (sortDirection === "asc" ? 1 : -1)
            );
          });
          $("#deptTable").empty();
          departments.forEach((d) =>
            $("#deptTable").append(
              `<tr data-id="${d.id}"><td>${d.name}</td><td>${d.employeeCount}</td><td><button class="btn btn-sm btn-outline-primary edit-btn"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-outline-danger delete-btn"><i class="fas fa-trash"></i></button></td></tr>`
            )
          );
        };

        $("#addDeptBtn").on("click", () => {
          $("#modalTitle").text("Add Department");
          $("#deptForm")[0].reset();
          $("#deptId").val("");
          deptModal.show();
        });
        $("#deptTable").on("click", ".edit-btn", function () {
          const id = $(this).closest("tr").data("id");
          const dept = departments.find((d) => d.id == id);
          $("#modalTitle").text("Edit Department");
          $("#deptId").val(dept.id);
          $("#name").val(dept.name);
          deptModal.show();
        });
        $("#deptForm").on("submit", function (e) {
          e.preventDefault();
          const id = $("#deptId").val();
          const name = $("#name").val();
          if (id) {
            departments.find((d) => d.id == id).name = name;
            toastr.success("Department updated!");
          } else {
            departments.push({
              id: Math.max(...departments.map((d) => d.id)) + 1,
              name: name,
              employeeCount: 0,
            });
            toastr.success("Department added!");
          }
          renderTable();
          deptModal.hide();
        });
        $("#deptTable").on("click", ".delete-btn", function () {
          if (confirm("Are you sure?")) {
            const id = $(this).closest("tr").data("id");
            departments = departments.filter((d) => d.id != id);
            renderTable();
            toastr.warning("Department deleted.");
          }
        });
        $(document).on("click", ".sortable", function () {
          const newSortColumn = $(this).data("sort");
          sortDirection =
            sortColumn === newSortColumn && sortDirection === "asc"
              ? "desc"
              : "asc";
          sortColumn = newSortColumn;
          $(".sortable i").attr("class", "fas fa-sort");
          $(this)
            .find("i")
            .attr(
              "class",
              `fas fa-sort-${sortDirection === "asc" ? "up" : "down"}`
            );
          renderTable();
        });

        renderTable();
      });
    </script>
  </body>
</html>
