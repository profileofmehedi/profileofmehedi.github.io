<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Quantum OS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --sidebar-bg: #212529;
        --body-bg: #eef2f7;
      }
      body {
        background-color: var(--body-bg);
      }
      .wrapper {
        display: flex;
      }
      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        background-color: var(--sidebar-bg);
        transition: margin-left 0.3s;
        z-index: 1000;
      }
      .sidebar .logo {
        font-weight: 700;
        color: #fff;
      }
      .sidebar a {
        color: #adb5bd;
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        margin: 5px 10px;
        border-radius: 5px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background-color: #0d6efd;
        color: #fff;
      }
      .main-content {
        flex-grow: 1;
        margin-left: 260px;
        padding: 20px;
        transition: margin-left 0.3s;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
      }
      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      }
      @media (max-width: 991.98px) {
        .sidebar {
          margin-left: -260px;
        }
        .sidebar.active {
          margin-left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .menu-toggle {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar">
        <h3 class="logo text-center p-3">
          <i class="fas fa-atom"></i> Quantum OS
        </h3>
        <hr class="bg-light mx-2 mt-0" />
        <a href="index.html"
          ><i class="fas fa-tachometer-alt fa-fw me-2"></i> Dashboard</a
        ><a href="employees.html"
          ><i class="fas fa-users fa-fw me-2"></i> Employees</a
        ><a href="departments.html"
          ><i class="fas fa-building fa-fw me-2"></i> Departments</a
        ><a href="attendance.html"
          ><i class="fas fa-calendar-check fa-fw me-2"></i> Attendance</a
        ><a href="leave_management.html"
          ><i class="fas fa-calendar-alt fa-fw me-2"></i> Leave Management</a
        ><a href="my_leave.html"
          ><i class="fas fa-user-clock fa-fw me-2"></i> My Leave</a
        ><a href="reports.html"
          ><i class="fas fa-chart-bar fa-fw me-2"></i> Reports</a
        ><a href="settings.html" class="active"
          ><i class="fas fa-cog fa-fw me-2"></i> Settings</a
        >
      </nav>
      <div class="main-content">
        <header class="d-flex align-items-center mb-4">
          <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="h3 mb-0 ms-3">Settings</h1>
        </header>
        <div class="row">
          <div class="col-md-3">
            <div class="card">
              <div
                class="list-group list-group-flush"
                id="settings-tabs"
                role="tablist"
              >
                <a
                  class="list-group-item list-group-item-action active"
                  data-bs-toggle="list"
                  href="#security"
                  role="tab"
                  >Security</a
                >
                <a
                  class="list-group-item list-group-item-action"
                  data-bs-toggle="list"
                  href="#notifications"
                  role="tab"
                  >Notifications</a
                >
                <a
                  class="list-group-item list-group-item-action"
                  data-bs-toggle="list"
                  href="#company"
                  role="tab"
                  >Company Profile</a
                >
              </div>
            </div>
          </div>
          <div class="col-md-9">
            <div class="tab-content">
              <div
                class="tab-pane fade show active"
                id="security"
                role="tabpanel"
              >
                <div class="card">
                  <div class="card-header bg-white">
                    <h5 class="mb-0">Change Password</h5>
                  </div>
                  <div class="card-body">
                    <form id="changePasswordForm" class="w-75">
                      <div class="mb-3">
                        <label class="form-label">Current Password</label
                        ><input
                          type="password"
                          class="form-control"
                          id="currentPassword"
                          required
                        />
                      </div>
                      <div class="mb-3">
                        <label class="form-label">New Password</label
                        ><input
                          type="password"
                          class="form-control"
                          id="newPassword"
                          required
                        />
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Confirm New Password</label
                        ><input
                          type="password"
                          class="form-control"
                          id="confirmPassword"
                          required
                        />
                      </div>
                      <button type="submit" class="btn btn-primary">
                        Update Password
                      </button>
                    </form>
                  </div>
                </div>
              </div>
              <div class="tab-pane fade" id="notifications" role="tabpanel">
                <div class="card">
                  <div class="card-body">
                    <p>
                      Notification settings will be available in a future
                      update.
                    </p>
                  </div>
                </div>
              </div>
              <div class="tab-pane fade" id="company" role="tabpanel">
                <div class="card">
                  <div class="card-body">
                    <p>
                      Company profile settings will be available in a future
                      update.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#menuToggle").on("click", () => $(".sidebar").toggleClass("active"));
        toastr.options = { positionClass: "toast-bottom-right" };
        $("#changePasswordForm").on("submit", function (e) {
          e.preventDefault();
          const currentPass = $("#currentPassword").val();
          const newPass = $("#newPassword").val();
          const confirmPass = $("#confirmPassword").val();
          if (currentPass !== "123456") {
            toastr.error("Current password is incorrect.");
            return;
          }
          if (newPass.length < 6) {
            toastr.error("New password must be at least 6 characters long.");
            return;
          }
          if (newPass !== confirmPass) {
            toastr.error("New passwords do not match.");
            return;
          }
          // In a real app, you would now update the password, but we simulate success.
          // The new password is NOT saved in this demo.
          toastr.success("Password updated successfully!");
          this.reset();
        });
      });
    </script>
  </body>
</html>
