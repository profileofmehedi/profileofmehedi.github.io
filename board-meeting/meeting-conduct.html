<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meeting - Board Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            padding: 1rem;
            background-color: #212529;
            color: #fff;
        }

        .sidebar .nav-link {
            color: #adb5bd;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #343a40;
        }

        .sidebar .nav-link .bi {
            margin-right: 0.75rem;
        }

        .sidebar-header {
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #495057;
            text-align: center;
        }

        .sidebar-header .bi-bank {
            font-size: 2rem;
        }

        .sidebar-header h5 {
            margin-top: 0.5rem;
            font-weight: 600;
        }

        .main-content {
            margin-left: 260px;
        }

        .header {
            background-color: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .user-info {
            text-align: right;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Styles for the full agenda list */
        #full-agenda-list {
            max-height: 70vh;
            /* Adjust height as needed */
            overflow-y: auto;
        }

        .agenda-item-full {
            background-color: #e9ecef;
            border-radius: .375rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .agenda-item-full:last-child {
            margin-bottom: 0;
        }

        .agenda-item-full h4 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .agenda-item-meta {
            font-size: 0.9rem;
            color: #6c757d;
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        /* Professional Chat Styles from previous version */
        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 300px;
            overflow-y: auto;
            padding: 1rem;
            background-color: #f8f9fa;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .chat-message .message-bubble {
            padding: 0.5rem 1rem;
            border-radius: 1rem;
        }

        .chat-message .message-meta {
            font-size: 0.75rem;
            color: #6c757d;
        }

        .chat-message.is-user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .chat-message.is-user .message-bubble {
            background-color: #0d6efd;
            color: white;
        }

        .chat-message.is-other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .chat-message.is-other .message-bubble {
            background-color: #e9ecef;
            color: #212529;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-bank"></i>
            <h5>Board Portal</h5>
        </div>
        <ul class="nav flex-column" id="nav-menu"></ul>
    </div>

    <main class="main-content">
        <header class="header">
            <h3>Live Meeting: Q3 Financial Review <span class="badge bg-danger ms-2">LIVE</span></h3>
            <div class="user-info">
                <h6 id="user-name" class="mb-0"></h6>
                <small id="user-role" class="text-muted"></small>
            </div>
        </header>

        <div class="p-4">
            <div class="row g-4">
                <!-- Full Agenda View -->
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Full Meeting Agenda</h5>
                            <button class="btn btn-outline-secondary btn-sm" id="assign-task-global-btn"
                                data-bs-toggle="modal" data-bs-target="#assignTaskModal">
                                <i class="bi bi-check2-square me-1"></i> Assign Action Item
                            </button>
                        </div>
                        <div class="card-body" id="full-agenda-list">
                            <!-- All agenda items will be dynamically injected here -->
                        </div>
                    </div>
                </div>

                <!-- Interaction Panel -->
                <div class="col-md-5">
                    <div class="card interaction-panel" style="min-height: 520px;">
                        <div class="card-header bg-white">
                            <ul class="nav nav-tabs card-header-tabs">
                                <li class="nav-item">
                                    <a class="nav-link active" data-bs-toggle="tab" href="#notes">My Notes</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" data-bs-toggle="tab" href="#chat">Discussion</a>
                                </li>
                            </ul>
                        </div>
                        <div class="card-body tab-content d-flex flex-column">
                            <div class="tab-pane fade show active h-100" id="notes">
                                <h6>Private Notes for the Meeting</h6>
                                <textarea class="form-control" style="height: calc(100% - 30px);"
                                    placeholder="Your notes for the entire meeting are saved here..."></textarea>
                            </div>
                            <div class="tab-pane fade h-100 d-flex flex-column" id="chat">
                                <h6>Live Chat</h6>
                                <div class="chat-box" id="chat-box">
                                    <!-- Messages will be inserted here -->
                                </div>
                                <form id="chat-form" class="mt-auto">
                                    <div class="input-group">
                                        <input type="text" id="chat-input" class="form-control"
                                            placeholder="Type a message...">
                                        <button class="btn btn-primary" type="submit"><i
                                                class="bi bi-send-fill"></i></button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Assign Task Modal -->
    <div class="modal fade" id="assignTaskModal" tabindex="-1">
        <!-- ... (Modal content is unchanged) ... -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- SHARED AUTHENTICATION AND NAVIGATION SCRIPT ---
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-role').textContent = user.role;
            const navLinks = { 'All': [{ href: 'dashboard.html', icon: 'bi-grid-fill', text: 'Dashboard' }, { href: 'action-tracking.html', icon: 'bi-check2-square', text: 'Action Tracking' }, { href: 'document-repository.html', icon: 'bi-folder-fill', text: 'Documents' },], 'Administrator': [{ href: 'schedule-meeting.html', icon: 'bi-calendar-plus-fill', text: 'Schedule Meeting' }, { href: 'agenda-management.html', icon: 'bi-list-task', text: 'Agenda Management' }, { href: 'board-pack.html', icon: 'bi-file-earmark-zip-fill', text: 'Board Packs' }, { href: 'minutes-of-meeting.html', icon: 'bi-pencil-square', text: 'Minutes of Meeting' }, { href: 'voting-resolutions.html', icon: 'bi-pie-chart-fill', text: 'Voting & Resolutions' }, { href: 'analytics-reports.html', icon: 'bi-bar-chart-line-fill', text: 'Analytics' },], 'Board Secretary': [{ href: 'schedule-meeting.html', icon: 'bi-calendar-plus-fill', text: 'Schedule Meeting' }, { href: 'agenda-management.html', icon: 'bi-list-task', text: 'Agenda Management' }, { href: 'board-pack.html', icon: 'bi-file-earmark-zip-fill', text: 'Board Packs' }, { href: 'minutes-of-meeting.html', icon: 'bi-pencil-square', text: 'Minutes of Meeting' },], 'Board Member': [{ href: 'meeting-conduct.html', icon: 'bi-camera-video-fill', text: 'Join Live Meeting' }, { href: 'voting-resolutions.html', icon: 'bi-pie-chart-fill', text: 'Voting & Resolutions' },] };
            const navMenu = document.getElementById('nav-menu');
            const currentPage = window.location.pathname.split('/').pop();
            const createNavItem = (item) => { const li = document.createElement('li'); li.className = 'nav-item'; const a = document.createElement('a'); a.className = `nav-link ${currentPage === item.href ? 'active' : ''}`; a.href = item.href; a.innerHTML = `<i class="bi ${item.icon}"></i>${item.text}`; li.appendChild(a); return li; };
            navLinks['All'].forEach(item => navMenu.appendChild(createNavItem(item)));
            if (navLinks[user.role]) { navLinks[user.role].forEach(item => navMenu.appendChild(createNavItem(item))); }
            const logoutLi = document.createElement('li'); logoutLi.className = 'nav-item mt-auto'; const logoutA = document.createElement('a'); logoutA.className = 'nav-link'; logoutA.href = '#'; logoutA.innerHTML = '<i class="bi bi-box-arrow-left"></i>Logout'; logoutA.onclick = function () { sessionStorage.removeItem('loggedInUser'); window.location.href = 'login.html'; }; logoutLi.appendChild(logoutA); navMenu.appendChild(logoutLi);
            // --- END OF SHARED SCRIPT ---

            // --- PAGE-SPECIFIC SCRIPT ---
            const fullAgendaList = document.getElementById('full-agenda-list');

            const agendaItems = [
                {
                    title: '1. Call to Order and Approval of Previous Minutes',
                    description: 'A brief opening to approve the MoM from the Q2 meeting.',
                    presenter: 'Alex Chen (CEO)', time: '5 mins', type: 'Info Sharing', document: null
                },
                {
                    title: '2. Review of Q3 Financial Performance',
                    description: 'Presentation by the CFO on key financial metrics.',
                    presenter: 'CFO', time: '30 mins', type: 'Discussion Only', document: 'Q3_Financials.pdf'
                },
                {
                    title: '3. Vote on Proposed 2026 Marketing Budget',
                    description: 'Decision required on the proposed budget allocation for the next fiscal year.',
                    presenter: 'Brenda Morris', time: '20 mins', type: 'Decision Required', document: 'Marketing_Budget_Proposal.docx'
                }
            ];

            // Function to populate the full agenda list
            const populateFullAgenda = () => {
                fullAgendaList.innerHTML = ''; // Clear existing content

                agendaItems.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'agenda-item-full';

                    let actionButtonHTML = '';
                    if (user.role !== 'Board Member' && item.type === 'Decision Required') {
                        actionButtonHTML = `<button class="btn btn-primary open-voting-btn mt-3"><i class="bi bi-pie-chart-fill me-2"></i> Open Voting for this Item</button>`;
                    }

                    let documentHTML = '';
                    if (item.document) {
                        documentHTML = `<p class="mb-0"><i class="bi bi-paperclip me-2"></i> <a href="#">${item.document}</a></p>`;
                    }

                    itemDiv.innerHTML = `
                        <h4>${item.title}</h4>
                        <div class="agenda-item-meta">
                            <span><i class="bi bi-person-fill"></i> ${item.presenter}</span>
                            <span><i class="bi bi-clock-fill"></i> ${item.time}</span>
                            <span><i class="bi bi-tag-fill"></i> ${item.type}</span>
                        </div>
                        <p>${item.description}</p>
                        ${documentHTML}
                        ${actionButtonHTML}
                    `;
                    fullAgendaList.appendChild(itemDiv);
                });
            };

            // Event delegation for dynamically created "Open Voting" buttons
            fullAgendaList.addEventListener('click', e => {
                const button = e.target.closest('.open-voting-btn');
                if (button) {
                    button.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i> Poll is LIVE`;
                    button.disabled = true;
                    alert('Voting is now open!\n\nAll members should navigate to the "Voting & Resolutions" page to cast their vote.');
                }
            });

            // Role-based visibility for the global "Assign Task" button
            if (user.role === 'Board Member') {
                document.getElementById('assign-task-global-btn').style.display = 'none';
            }

            // Chat functionality (no changes from previous version)
            const chatBox = document.getElementById('chat-box');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const addMessage = (senderName, message, isCurrentUser) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `chat-message ${isCurrentUser ? 'is-user' : 'is-other'}`;
                const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                messageDiv.innerHTML = `<div class="message-bubble">${message}</div><div class="message-meta"><strong>${senderName}</strong> at ${time}</div>`;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            };
            addMessage('Brenda Morris', 'The budget seems reasonable, but I have a question about the allocation for digital ads.', false);
            addMessage('Alex Chen', 'Good question. The team can provide a detailed breakdown post-meeting.', false);
            chatForm.addEventListener('submit', e => {
                e.preventDefault();
                const message = chatInput.value.trim();
                if (message) {
                    addMessage(user.name, message, true);
                    chatInput.value = '';
                }
            });

            // Initial render of the agenda
            populateFullAgenda();
        });
    </script>
</body>

</html>
