<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Pack Creation - Board Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            padding: 1rem;
            background-color: #212529;
            color: #fff;
        }

        .sidebar .nav-link {
            color: #adb5bd;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #343a40;
        }

        .sidebar .nav-link .bi {
            margin-right: 0.75rem;
        }

        .sidebar-header {
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #495057;
            text-align: center;
        }

        .sidebar-header .bi-bank {
            font-size: 2rem;
        }

        .sidebar-header h5 {
            margin-top: 0.5rem;
            font-weight: 600;
        }

        .main-content {
            margin-left: 260px;
        }

        .header {
            background-color: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .user-info {
            text-align: right;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .preview-pane {
            background-color: #e9ecef;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: .375rem;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-bank"></i>
            <h5>Board Portal</h5>
        </div>
        <ul class="nav flex-column" id="nav-menu"></ul>
    </div>

    <main class="main-content">
        <header class="header">
            <h3>Board Pack Creation</h3>
            <div class="user-info">
                <h6 id="user-name" class="mb-0"></h6>
                <small id="user-role" class="text-muted"></small>
            </div>
        </header>

        <div class="p-4">
            <div class="row g-4">
                <div class="col-md-5">
                    <div class="card">
                        <div class="card-header bg-white">
                            <h5>1. Select Meeting</h5>
                            <select class="form-select" id="meeting-select">
                                <option value="q3" selected>Q3 Financial Review - Aug 28, 2025</option>
                                <option value="risk">Risk Assessment Committee - Sep 05, 2025</option>
                            </select>
                        </div>
                        <div class="card-body">
                            <h5>2. Compile Documents</h5>
                            <div id="document-list">
                                <!-- Document checkboxes will be inserted here -->
                            </div>
                            <button class="btn btn-outline-secondary btn-sm mt-2" id="add-doc-btn"><i
                                    class="bi bi-plus"></i> Add another
                                document</button>
                        </div>
                        <div class="card-footer bg-white">
                            <h5>3. Distribute</h5>
                            <button class="btn btn-primary w-100" id="compile-btn">
                                Compile & Send Secure Link
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header bg-white">
                            <h5>Live Preview</h5>
                        </div>
                        <div class="card-body">
                            <div class="preview-pane">
                                <div>
                                    <i class="bi bi-file-earmark-zip-fill display-1 text-muted"></i>
                                    <p class="mt-3">Board Pack Preview Area</p>
                                    <small class="text-muted" id="preview-counter">0 documents selected</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-4">
                        <div class="card-header bg-white">
                            <h5>Distribution Status</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Member</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="status-table-body">
                                    <tr>
                                        <td>Alex Chen</td>
                                        <td><span class="badge bg-secondary">Not Sent</span></td>
                                    </tr>
                                    <tr>
                                        <td>Brenda Morris</td>
                                        <td><span class="badge bg-secondary">Not Sent</span></td>
                                    </tr>
                                    <tr>
                                        <td>Charles David</td>
                                        <td><span class="badge bg-secondary">Not Sent</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="doc-upload-input" style="display: none;">

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- SHARED AUTHENTICATION AND NAVIGATION SCRIPT ---
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            if (!user) { window.location.href = 'login.html'; return; }
            if (user.role === 'Board Member') { window.location.href = 'dashboard.html'; return; } // Access control
            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-role').textContent = user.role;
            const navLinks = { 'All': [{ href: 'dashboard.html', icon: 'bi-grid-fill', text: 'Dashboard' }, { href: 'action-tracking.html', icon: 'bi-check2-square', text: 'Action Tracking' }, { href: 'document-repository.html', icon: 'bi-folder-fill', text: 'Documents' },], 'Administrator': [{ href: 'schedule-meeting.html', icon: 'bi-calendar-plus-fill', text: 'Schedule Meeting' }, { href: 'agenda-management.html', icon: 'bi-list-task', text: 'Agenda Management' }, { href: 'board-pack.html', icon: 'bi-file-earmark-zip-fill', text: 'Board Packs' }, { href: 'minutes-of-meeting.html', icon: 'bi-pencil-square', text: 'Minutes of Meeting' }, { href: 'voting-resolutions.html', icon: 'bi-pie-chart-fill', text: 'Voting & Resolutions' }, { href: 'analytics-reports.html', icon: 'bi-bar-chart-line-fill', text: 'Analytics' },], 'Board Secretary': [{ href: 'schedule-meeting.html', icon: 'bi-calendar-plus-fill', text: 'Schedule Meeting' }, { href: 'agenda-management.html', icon: 'bi-list-task', text: 'Agenda Management' }, { href: 'board-pack.html', icon: 'bi-file-earmark-zip-fill', text: 'Board Packs' }, { href: 'minutes-of-meeting.html', icon: 'bi-pencil-square', text: 'Minutes of Meeting' },], 'Board Member': [{ href: 'meeting-conduct.html', icon: 'bi-camera-video-fill', text: 'Join Live Meeting' }, { href: 'voting-resolutions.html', icon: 'bi-pie-chart-fill', text: 'Voting & Resolutions' },] };
            const navMenu = document.getElementById('nav-menu');
            const currentPage = window.location.pathname.split('/').pop();
            const createNavItem = (item) => { const li = document.createElement('li'); li.className = 'nav-item'; const a = document.createElement('a'); a.className = `nav-link ${currentPage === item.href ? 'active' : ''}`; a.href = item.href; a.innerHTML = `<i class="bi ${item.icon}"></i>${item.text}`; li.appendChild(a); return li; };
            navLinks['All'].forEach(item => navMenu.appendChild(createNavItem(item)));
            if (navLinks[user.role]) { navLinks[user.role].forEach(item => navMenu.appendChild(createNavItem(item))); }
            const logoutLi = document.createElement('li'); logoutLi.className = 'nav-item mt-auto'; const logoutA = document.createElement('a'); logoutA.className = 'nav-link'; logoutA.href = '#'; logoutA.innerHTML = '<i class="bi bi-box-arrow-left"></i>Logout'; logoutA.onclick = function () { sessionStorage.removeItem('loggedInUser'); window.location.href = 'login.html'; }; logoutLi.appendChild(logoutA); navMenu.appendChild(logoutLi);
            // --- END OF SHARED SCRIPT ---

            // --- PAGE-SPECIFIC SCRIPT ---
            const meetingSelect = document.getElementById('meeting-select');
            const documentList = document.getElementById('document-list');
            const previewCounter = document.getElementById('preview-counter');
            const compileBtn = document.getElementById('compile-btn');
            const statusTableBody = document.getElementById('status-table-body');
            const addDocBtn = document.getElementById('add-doc-btn');
            const docUploadInput = document.getElementById('doc-upload-input');

            const meetingDocs = {
                q3: [
                    { id: 'doc1', name: 'Meeting Agenda', checked: true },
                    { id: 'doc2', name: 'Minutes from Previous Meeting', checked: true },
                    { id: 'doc3', name: 'Q3 Financial Report.pdf', checked: true },
                    { id: 'doc4', name: 'Marketing Budget Proposal.docx', checked: false }
                ],
                risk: [
                    { id: 'risk1', name: 'Risk Committee Agenda', checked: true },
                    { id: 'risk2', name: 'Cybersecurity Audit Report.pdf', checked: true },
                    { id: 'risk3', name: 'Vendor Risk Assessment.xlsx', checked: false }
                ]
            };

            const renderDocuments = (meetingId) => {
                documentList.innerHTML = '';
                const docs = meetingDocs[meetingId] || [];
                docs.forEach(doc => {
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="" id="${doc.id}" ${doc.checked ? 'checked' : ''}>
                        <label class="form-check-label" for="${doc.id}">${doc.name}</label>
                    `;
                    documentList.appendChild(div);
                });
                updatePreviewCounter();
            };

            const updatePreviewCounter = () => {
                const checkedCount = documentList.querySelectorAll('input[type="checkbox"]:checked').length;
                previewCounter.textContent = `${checkedCount} document${checkedCount !== 1 ? 's' : ''} selected`;
            };

            const resetStatusTable = () => {
                statusTableBody.querySelectorAll('span').forEach(span => {
                    span.className = 'badge bg-secondary';
                    span.textContent = 'Not Sent';
                });
            };

            // 1. DYNAMIC DOCUMENT LIST LOGIC
            meetingSelect.addEventListener('change', () => {
                renderDocuments(meetingSelect.value);
                resetStatusTable();
            });

            documentList.addEventListener('change', updatePreviewCounter);

            // 2. "ADD DOCUMENT" LOGIC
            addDocBtn.addEventListener('click', () => docUploadInput.click());

            docUploadInput.addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;

                const newDocId = `doc-upload-${Date.now()}`;
                const div = document.createElement('div');
                div.className = 'form-check';
                div.innerHTML = `
                    <input class="form-check-input" type="checkbox" value="" id="${newDocId}" checked>
                    <label class="form-check-label" for="${newDocId}">${file.name}</label>
                `;
                documentList.appendChild(div);
                updatePreviewCounter();
                docUploadInput.value = ''; // Reset for next upload
            });


            // 3. "COMPILE & SEND" LOGIC
            compileBtn.addEventListener('click', () => {
                const checkedCount = documentList.querySelectorAll('input[type="checkbox"]:checked').length;
                if (checkedCount === 0) {
                    alert('Please select at least one document to compile.');
                    return;
                }

                // Simulate processing
                compileBtn.disabled = true;
                compileBtn.innerHTML = `
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Compiling...
                `;

                setTimeout(() => {
                    // Update status table
                    statusTableBody.querySelectorAll('span').forEach(span => {
                        span.className = 'badge bg-success';
                        span.textContent = 'Sent';
                    });

                    // Reset button and show confirmation
                    compileBtn.disabled = false;
                    compileBtn.innerHTML = 'Compile & Send Secure Link';
                    alert(`Board pack with ${checkedCount} documents compiled and sent successfully!`);

                }, 1500); // 1.5 second delay
            });

            // Initial Render
            renderDocuments(meetingSelect.value);
        });
    </script>
</body>

</html>
