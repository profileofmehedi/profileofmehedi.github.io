<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Meeting - Board Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            padding: 1rem;
            background-color: #212529;
            color: #fff;
        }

        .sidebar .nav-link {
            color: #adb5bd;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
        }

        .sidebar .nav-link.active,
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #343a40;
        }

        .sidebar .nav-link .bi {
            margin-right: 0.75rem;
        }

        .sidebar-header {
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #495057;
            text-align: center;
        }

        .sidebar-header .bi-bank {
            font-size: 2rem;
        }

        .sidebar-header h5 {
            margin-top: 0.5rem;
            font-weight: 600;
        }

        .main-content {
            margin-left: 260px;
        }

        .header {
            background-color: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .user-info {
            text-align: right;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-bank"></i>
            <h5>Board Portal</h5>
        </div>
        <ul class="nav flex-column" id="nav-menu"></ul>
    </div>

    <main class="main-content">
        <header class="header">
            <h3>Schedule a New Meeting</h3>
            <div class="user-info">
                <h6 id="user-name" class="mb-0"></h6>
                <small id="user-role" class="text-muted"></small>
            </div>
        </header>

        <div class="p-4">
            <div class="card">
                <div class="card-body p-4">
                    <form id="schedule-form">
                        <div class="row g-4">
                            <div class="col-md-12">
                                <label for="meeting-title" class="form-label">Meeting Title</label>
                                <input type="text" class="form-control" id="meeting-title"
                                    placeholder="e.g., Q4 Budget Approval" required>
                            </div>
                            <div class="col-md-6">
                                <label for="meeting-date" class="form-label">Date</label>
                                <input type="text" class="form-control" id="meeting-date" placeholder="Select Date"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label for="meeting-time" class="form-label">Time</label>
                                <input type="text" class="form-control" id="meeting-time" placeholder="Select Time"
                                    required>
                            </div>
                            <div class="col-md-12">
                                <label for="participants" class="form-label">Participants</label>
                                <input type="text" class="form-control" id="participants"
                                    placeholder="Add members by email..."
                                    value="Alex Chen, Brenda Morris, Charles David" required>
                                <small class="form-text text-muted">Separate emails with a comma.</small>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Meeting Type</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch"
                                        id="virtual-meeting-toggle">
                                    <label class="form-check-label" for="virtual-meeting-toggle">Virtual Meeting</label>
                                </div>
                            </div>
                            <div class="col-md-12" id="virtual-meeting-link-container" style="display: none;">
                                <label for="meeting-link" class="form-label">Meeting Link (Zoom, Teams, etc.)</label>
                                <input type="url" class="form-control" id="meeting-link"
                                    placeholder="https://zoom.us/j/...">
                            </div>
                            <div class="col-12 mt-4 text-end">
                                <button type="button" class="btn btn-secondary me-2">Save Draft</button>
                                <button type="submit" class="btn btn-primary">Send Invites</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- SHARED AUTHENTICATION AND NAVIGATION SCRIPT ---
            const user = JSON.parse(sessionStorage.getItem('loggedInUser'));
            if (!user) { window.location.href = 'login.html'; return; }
            if (user.role === 'Board Member') { window.location.href = 'dashboard.html'; return; } // Access control

            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-role').textContent = user.role;

            const navLinks = {
                'All': [
                    { href: 'dashboard.html', icon: 'bi-grid-fill', text: 'Dashboard' },
                    { href: 'action-tracking.html', icon: 'bi-check2-square', text: 'Action Tracking' },
                    { href: 'document-repository.html', icon: 'bi-folder-fill', text: 'Documents' },
                ],
                'Administrator': [
                    { href: 'schedule-meeting.html', icon: 'bi-calendar-plus-fill', text: 'Schedule Meeting' },
                    { href: 'agenda-management.html', icon: 'bi-list-task', text: 'Agenda Management' },
                    { href: 'board-pack.html', icon: 'bi-file-earmark-zip-fill', text: 'Board Packs' },
                    { href: 'minutes-of-meeting.html', icon: 'bi-pencil-square', text: 'Minutes of Meeting' },
                    { href: 'voting-resolutions.html', icon: 'bi-pie-chart-fill', text: 'Voting & Resolutions' },
                    { href: 'analytics-reports.html', icon: 'bi-bar-chart-line-fill', text: 'Analytics' },
                ],
                'Board Secretary': [
                    { href: 'schedule-meeting.html', icon: 'bi-calendar-plus-fill', text: 'Schedule Meeting' },
                    { href: 'agenda-management.html', icon: 'bi-list-task', text: 'Agenda Management' },
                    { href: 'board-pack.html', icon: 'bi-file-earmark-zip-fill', text: 'Board Packs' },
                    { href: 'minutes-of-meeting.html', icon: 'bi-pencil-square', text: 'Minutes of Meeting' },
                ],
                'Board Member': [
                    { href: 'meeting-conduct.html', icon: 'bi-camera-video-fill', text: 'Join Live Meeting' },
                    { href: 'voting-resolutions.html', icon: 'bi-pie-chart-fill', text: 'Voting & Resolutions' },
                ]
            };

            const navMenu = document.getElementById('nav-menu');
            const currentPage = window.location.pathname.split('/').pop();
            const createNavItem = (item) => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                const a = document.createElement('a');
                a.className = `nav-link ${currentPage === item.href ? 'active' : ''}`;
                a.href = item.href;
                a.innerHTML = `<i class="bi ${item.icon}"></i>${item.text}`;
                li.appendChild(a);
                return li;
            };

            navLinks['All'].forEach(item => navMenu.appendChild(createNavItem(item)));
            if (navLinks[user.role]) {
                navLinks[user.role].forEach(item => navMenu.appendChild(createNavItem(item)));
            }
            const logoutLi = document.createElement('li');
            logoutLi.className = 'nav-item mt-auto';
            const logoutA = document.createElement('a');
            logoutA.className = 'nav-link';
            logoutA.href = '#';
            logoutA.innerHTML = '<i class="bi bi-box-arrow-left"></i>Logout';
            logoutA.onclick = function () {
                sessionStorage.removeItem('loggedInUser');
                window.location.href = 'login.html';
            };
            logoutLi.appendChild(logoutA);
            navMenu.appendChild(logoutLi);
            // --- END OF SHARED SCRIPT ---

            // --- PAGE-SPECIFIC SCRIPT ---
            flatpickr("#meeting-date", {
                altInput: true,
                altFormat: "F j, Y",
                dateFormat: "Y-m-d",
            });
            flatpickr("#meeting-time", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i",
                time_24hr: false
            });

            const toggle = document.getElementById('virtual-meeting-toggle');
            const linkContainer = document.getElementById('virtual-meeting-link-container');
            toggle.addEventListener('change', function () {
                linkContainer.style.display = this.checked ? 'block' : 'none';
            });

            document.getElementById('schedule-form').addEventListener('submit', function (e) {
                e.preventDefault();
                alert('Meeting scheduled and invites sent successfully!');
                this.reset();
                linkContainer.style.display = 'none';
            });
        });
    </script>
</body>

</html>
