<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Xen IT - Create Loan Product</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="../css/dashboard/style.css" rel="stylesheet" />
    <style>
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }

      .form-group {
        margin-bottom: 1.2rem;
      }

      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .form-control {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: white;
        font-size: 0.95rem;
        transition: var(--trans-fast);
      }

      .form-control:focus {
        outline: none;
        border-color: var(--primary-color);
        background: rgba(255, 255, 255, 0.1);
      }

      .form-section-title {
        grid-column: span 2;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
        margin: 1.5rem 0 1rem 0;
        font-size: 1.1rem;
        color: var(--primary-color);
        font-weight: 600;
      }

      .form-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        margin-top: 2rem;
        grid-column: span 2;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: var(--trans-fast);
      }

      .btn-primary {
        background: var(--primary-color);
        color: white;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
      }

      select.form-control option {
        background: var(--card-bg);
        color: white;
      }
    </style>
  </head>
  <body class="admin-theme">
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div>
          <div class="brand">
            <i class="fas fa-rocket"></i>
            <span>Next Xen IT Admin</span>
          </div>
          <ul class="menu-list">
            <li class="menu-item">
              <a href="admin.html"
                ><i class="fas fa-chart-line"></i> <span>Overview</span></a
              >
            </li>
            <li class="menu-item">
              <a href="#" class="active"
                ><i class="fas fa-hand-holding-usd"></i>
                <span>Loan Products</span></a
              >
            </li>
            <li class="menu-item">
              <a href="#"
                ><i class="fas fa-users"></i> <span>User Management</span></a
              >
            </li>
            <li class="menu-item">
              <a href="#"
                ><i class="fas fa-file-invoice-dollar"></i>
                <span>Revenue</span></a
              >
            </li>
            <li class="menu-item">
              <a href="#"><i class="fas fa-cogs"></i> <span>Settings</span></a>
            </li>
          </ul>
        </div>
        <div class="menu-item">
          <a href="#"
            ><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a
          >
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="header">
          <div class="header-title">
            <div style="display: flex; align-items: center; gap: 1rem">
              <button
                id="sidebarToggle"
                style="
                  background: none;
                  border: none;
                  color: white;
                  cursor: pointer;
                  font-size: 1.2rem;
                "
              >
                <i class="fas fa-bars"></i>
              </button>
              <h2>Create Loan Product</h2>
            </div>
            <p>Define parameters for a new lending package.</p>
          </div>
          <div class="user-profile">
            <div class="avatar">AD</div>
          </div>
        </header>

        <div class="card" style="max-width: 900px; margin: 0 auto">
          <form>
            <div class="form-grid">
              <!-- Section 1: Basic Info -->
              <h3 class="form-section-title" style="margin-top: 0">
                Product Details
              </h3>

              <div class="form-group">
                <label class="form-label">Product Name</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="e.g., Personal Loan"
                  required
                />
              </div>
              <div class="form-group">
                <label class="form-label">Product Code (Short Name)</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="e.g., PL-2026"
                  required
                />
              </div>
              <div class="form-group" style="grid-column: span 2">
                <label class="form-label">Description</label>
                <textarea
                  class="form-control"
                  rows="3"
                  placeholder="Brief description of the loan product..."
                ></textarea>
              </div>

              <!-- Section 2: Terms & Interest -->
              <h3 class="form-section-title">Terms & Interest</h3>

              <div class="form-group">
                <label class="form-label">Default Principal Amount ($)</label>
                <input type="number" class="form-control" placeholder="5000" />
              </div>
              <div class="form-group">
                <label class="form-label">Interest Rate (%)</label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  placeholder="12.5"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Interest Type</label>
                <select class="form-control">
                  <option value="flat">Flat Rate</option>
                  <option value="declining">Declining Balance</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Interest Period</label>
                <select class="form-control">
                  <option value="yearly">Per Year</option>
                  <option value="monthly">Per Month</option>
                </select>
              </div>

              <!-- Section 3: Repayment Settings -->
              <h3 class="form-section-title">Repayment Settings</h3>

              <div class="form-group">
                <label class="form-label">Repayment Frequency</label>
                <select class="form-control">
                  <option value="monthly">Monthly</option>
                  <option value="weekly">Weekly</option>
                  <option value="biweekly">Bi-Weekly</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Loan Term (Duration)</label>
                <div style="display: flex; gap: 10px">
                  <input type="number" class="form-control" placeholder="12" />
                  <select class="form-control" style="width: 120px">
                    <option value="months">Months</option>
                    <option value="weeks">Weeks</option>
                    <option value="years">Years</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-control">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

              <!-- Actions -->
              <div class="form-actions">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-save"></i> Save Product
                </button>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="../js/dashboard/script.js"></script>
  </body>
</html>
