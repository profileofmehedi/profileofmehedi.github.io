<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Next Xen IT Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body onload="switchRole('admin')">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Next Xen IT</h1>
                <p>Welcome back to your portal</p>
            </div>

            <div class="login-tabs">
                <div class="login-tab active" id="tab-admin" onclick="switchRole('admin')">Admin</div>
                <div class="login-tab" id="tab-affiliate" onclick="switchRole('affiliate')">Affiliate</div>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>

            <div id="demo-creds" style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-muted); text-align: center; background: var(--bg-body); padding: 1rem; border-radius: 12px;">
                <p>Loading credentials...</p>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'admin';
        const credentials = {
            admin: { email: 'admin@xen.com', pass: 'admin123' },
            affiliate: { email: 'affiliate@xen.com', pass: 'affiliate123' }
        };

        function switchRole(role) {
            currentRole = role;
            
            // UI Update
            document.querySelectorAll('.login-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${role}`).classList.add('active');
            
            // Auto-fill
            document.getElementById('email').value = credentials[role].email;
            document.getElementById('password').value = credentials[role].pass;
            
            const credsDiv = document.getElementById('demo-creds');
            credsDiv.innerHTML = `<p>Demo ${role.charAt(0).toUpperCase() + role.slice(1)}: <b>${credentials[role].email}</b> / <b>${credentials[role].pass}</b></p>`;
        }

        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;
            
            setTimeout(() => {
                if(currentRole === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'affiliate-dashboard.html';
                }
            }, 800);
        }
    </script>
</body>
</html>
