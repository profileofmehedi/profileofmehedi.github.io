<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও গ্যালারি | কিয়ামতের আলামত</title>
    <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --emerald-dark: #064e3b; --gold: #d97706; --emerald-light: #ecfdf5; }
        body { font-family: 'Kalpurush', sans-serif; background-color: var(--emerald-light); color: #111827; }
        .hero-section { background: var(--emerald-dark); color: #fff; padding: 60px 0; text-align: center; border-bottom: 8px solid var(--gold); }
        .video-card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; transition: 0.3s; }
        .video-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-body { padding: 20px; }
        .btn-back { background-color: rgba(255,255,255,0.2); color: white; border: 1px solid white; border-radius: 50px; padding: 8px 25px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <a href="../index.html" class="btn-back"><i class="fas fa-arrow-left me-2"></i> হোমে ফিরুন</a>
            <h1 class="fw-bold mb-3">ইসলামিক ভিডিও গ্যালারি</h1>
            <p class="lead mb-0">কিয়ামত, দাজ্জাল এবং পরকাল বিষয়ক গুরুত্বপূর্ণ আলোচনা</p>
        </div>
    </div>

    <div class="container py-5">
        <div class="row">
            <!-- Video 1 -->
            <div class="col-md-6 col-lg-4">
                <div class="video-card">
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                    </div>
                    <div class="video-body">
                        <h5 class="fw-bold mb-2">কিয়ামতের বড় ১০টি আলামত</h5>
                        <p class="text-muted small">আলোচক: শায়খ আহমাদুল্লাহ</p>
                    </div>
                </div>
            </div>
            <!-- Video 2 -->
            <div class="col-md-6 col-lg-4">
                <div class="video-card">
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                    </div>
                    <div class="video-body">
                        <h5 class="fw-bold mb-2">দাজ্জালের ফিতনা থেকে বাঁচার উপায়</h5>
                        <p class="text-muted small">আলোচক: মিজানুর রহমান আজহারী</p>
                    </div>
                </div>
            </div>
            <!-- Video 3 -->
            <div class="col-md-6 col-lg-4">
                <div class="video-card">
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                    </div>
                    <div class="video-body">
                        <h5 class="fw-bold mb-2">মৃত্যুর পরের প্রথম রাত</h5>
                        <p class="text-muted small">আলোচক: ড. জাকির নায়েক</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="alert alert-info text-center mt-4 rounded-4 border-0">
            <i class="fas fa-info-circle me-2"></i> আরও ভিডিও নিয়মিত যোগ করা হবে ইনশাআল্লাহ।
        </div>
    </div>
</body>
</html>
