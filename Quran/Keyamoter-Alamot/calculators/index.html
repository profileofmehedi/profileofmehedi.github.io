<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসলামিক ক্যালকুলেটর হাব | কিয়ামতের আলামত</title>
    
    <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --emerald-dark: #064e3b;
            --gold: #d97706;
            --emerald-light: #ecfdf5;
        }
        body { font-family: 'Kalpurush', sans-serif; background-color: var(--emerald-light); color: #1e3a8a; }
        .hero-section { background: var(--emerald-dark); color: #fff; padding: 50px 0; text-align: center; border-bottom: 5px solid var(--gold); }
        
        .nav-pills .nav-link { 
            color: var(--emerald-dark); 
            font-weight: bold; 
            border: 2px solid var(--emerald-dark);
            margin: 5px;
            border-radius: 50px;
            background: white;
        }
        .nav-pills .nav-link.active { 
            background-color: var(--emerald-dark) !important; 
            color: white !important; 
        }

        .calc-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 20px;
            border-top: 5px solid var(--gold);
        }

        .form-label { font-weight: bold; color: var(--emerald-dark); font-size: 0.9rem; }
        .form-control { border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px; }
        .form-control:focus { border-color: var(--gold); box-shadow: none; }

        .result-display {
            background: #f8fafc;
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 20px;
            border: 2px solid var(--emerald-dark);
        }

        .tasbih-box {
            font-size: 5rem;
            font-weight: 800;
            color: var(--emerald-dark);
            background: white;
            border: 5px solid var(--gold);
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px;
        }
        .btn-tasbih {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 1.5rem;
            background: var(--emerald-dark);
            color: white;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-tasbih:active { transform: scale(0.9); }
        .amount-words { font-size: 0.95rem; color: #d97706; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="container">
            <h1 class="fw-bold">ইসলামিক ক্যালকুলেটর হাব</h1>
            <p class="mb-3">সব হিসাব এক জায়গায় - সহজ ও দ্রুত</p>
            <a href="../index.html" class="btn btn-outline-light rounded-pill btn-sm px-4"><i class="fas fa-home me-2"></i> হোমে ফিরুন</a>
        </div>
    </div>

    <div class="container py-4">
        <ul class="nav nav-pills justify-content-center mb-4" id="pills-tab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="zakat-tab" data-bs-toggle="pill" data-bs-target="#zakat">যাকাত</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="fitra-tab" data-bs-toggle="pill" data-bs-target="#fitra">ফিতরা</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="tasbih-tab" data-bs-toggle="pill" data-bs-target="#tasbih">তসবিহ</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="miras-tab" data-bs-toggle="pill" data-bs-target="#miras">মিরাস</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- 1. Zakat Calculator -->
            <div class="tab-pane fade show active" id="zakat">
                <div class="calc-card">
                    <h4 class="fw-bold mb-4 text-center"><i class="fas fa-hand-holding-dollar text-gold me-2"></i> যাকাত ক্যালকুলেটর</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">নগদ টাকা (ব্যাংক ও হাতে)</label>
                            <input type="number" class="form-control zakat-input" id="z_cash" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">স্বর্ণ ও রূপার মূল্য</label>
                            <input type="number" class="form-control zakat-input" id="z_gold" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">শেয়ার ও ইনভেস্টমেন্ট</label>
                            <input type="number" class="form-control zakat-input" id="z_inv" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ঋণ (বাদ যাবে)</label>
                            <input type="number" class="form-control zakat-input" id="z_debt" value="0">
                        </div>
                    </div>
                    
                    <div class="result-display text-center">
                        <p class="mb-1 text-muted">আপনার প্রদেয় যাকাত (২.৫%)</p>
                        <h2 class="fw-bold text-gold mb-0">৳ <span id="zakat_res">০</span></h2>
                        <div class="amount-words" id="zakat_words"></div>
                        <small class="text-emerald-dark" id="zakat_status">নিট সম্পদ: ৳ ০</small>
                    </div>
                </div>
            </div>

            <!-- 2. Fitra Calculator -->
            <div class="tab-pane fade" id="fitra">
                <div class="calc-card">
                    <h4 class="fw-bold mb-4 text-center"><i class="fas fa-wheat-awn text-gold me-2"></i> ফিতরা ক্যালকুলেটর</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">পরিবারের সদস্য সংখ্যা</label>
                            <input type="number" class="form-control fitra-input" id="f_members" value="1" min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">জনপ্রতি ফিতরার হার (টাকা)</label>
                            <input type="number" class="form-control fitra-input" id="f_rate" value="115">
                        </div>
                    </div>
                    
                    <div class="result-display text-center">
                        <p class="mb-1 text-muted">মোট ফিতরার পরিমাণ</p>
                        <h2 class="fw-bold text-gold mb-0">৳ <span id="fitra_res">১১৫</span></h2>
                        <div class="amount-words" id="fitra_words">একশ পনেরো টাকা মাত্র</div>
                    </div>
                </div>
            </div>

            <!-- 3. Tasbih Counter -->
            <div class="tab-pane fade" id="tasbih">
                <div class="calc-card text-center">
                    <h4 class="fw-bold mb-4"><i class="fas fa-fingerprint text-gold me-2"></i> ডিজিটাল তসবিহ</h4>
                    <div class="tasbih-box" id="tasbih_count">০</div>
                    <button class="btn-tasbih mb-3" onclick="incrementTasbih()"><i class="fas fa-plus"></i></button>
                    <br>
                    <button class="btn btn-danger btn-sm rounded-pill px-4" onclick="resetTasbih()">রিসেট করুন</button>
                </div>
            </div>

            <!-- 4. Miras Calculator -->
            <div class="tab-pane fade" id="miras">
                <div class="calc-card">
                    <h4 class="fw-bold mb-4 text-center"><i class="fas fa-users-rectangle text-gold me-2"></i> মিরাস (উত্তরাধিকার) - বেসিক</h4>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">মোট সম্পত্তির পরিমাণ (টাকা/শতাংশ)</label>
                            <input type="number" class="form-control miras-input" id="m_total" value="100000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ছেলে সংখ্যা</label>
                            <input type="number" class="form-control miras-input" id="m_sons" value="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">মেয়ে সংখ্যা</label>
                            <input type="number" class="form-control miras-input" id="m_daughters" value="1">
                        </div>
                    </div>
                    
                    <div class="result-display mt-4">
                        <h6 class="fw-bold border-bottom pb-2">বন্টন তালিকা (আনুমানিক):</h6>
                        <div id="miras_res_list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- Bengali Words Conversion Logic ---
        function numberToBengaliWords(n) {
            if (n === 0) return "";
            const units = ['', 'এক', 'দুই', 'তিন', 'চার', 'পাঁচ', 'ছয়', 'সাত', 'আট', 'নয়', 'দশ', 'এগারো', 'বারো', 'তেরো', 'চৌদ্দ', 'পনেরো', 'ষোলো', 'সতেরো', 'আঠারো', 'উনিশ'];
            const tens = ['', '', 'বিশ', 'ত্রিশ', 'চল্লিশ', 'পঞ্চাশ', 'ষাট', 'সত্তর', 'আশি', 'নব্বই'];
            
            function convert(num) {
                if (num < 20) return units[num];
                if (num < 100) return tens[Math.floor(num / 10)] + (num % 10 !== 0 ? ' ' + units[num % 10] : '');
                if (num < 1000) return units[Math.floor(num / 100)] + 'শ ' + (num % 100 !== 0 ? convert(num % 100) : '');
                if (num < 100000) return convert(Math.floor(num / 1000)) + ' হাজার ' + (num % 1000 !== 0 ? convert(num % 1000) : '');
                if (num < 10000000) return convert(Math.floor(num / 100000)) + ' লাখ ' + (num % 100000 !== 0 ? convert(num % 100000) : '');
                return convert(Math.floor(num / 10000000)) + ' কোটি ' + (num % 10000000 !== 0 ? convert(num % 10000000) : '');
            }
            return convert(Math.floor(n)) + " টাকা মাত্র";
        }

        // --- Zakat Logic ---
        document.querySelectorAll('.zakat-input').forEach(input => {
            input.addEventListener('input', () => {
                const cash = parseFloat(document.getElementById('z_cash').value) || 0;
                const gold = parseFloat(document.getElementById('z_gold').value) || 0;
                const inv = parseFloat(document.getElementById('z_inv').value) || 0;
                const debt = parseFloat(document.getElementById('z_debt').value) || 0;
                const net = (cash + gold + inv) - debt;
                const zakat = net > 0 ? Math.floor(net * 0.025) : 0;
                
                document.getElementById('zakat_res').innerText = zakat.toLocaleString('bn-BD');
                document.getElementById('zakat_status').innerText = 'নিট সম্পদ: ৳ ' + (net > 0 ? net : 0).toLocaleString('bn-BD');
                document.getElementById('zakat_words').innerText = zakat > 0 ? numberToBengaliWords(zakat) : "";
            });
        });

        // --- Fitra Logic ---
        document.querySelectorAll('.fitra-input').forEach(input => {
            input.addEventListener('input', () => {
                const members = parseInt(document.getElementById('f_members').value) || 0;
                const rate = parseFloat(document.getElementById('f_rate').value) || 0;
                const total = members * rate;
                document.getElementById('fitra_res').innerText = total.toLocaleString('bn-BD');
                document.getElementById('fitra_words').innerText = total > 0 ? numberToBengaliWords(total) : "";
            });
        });

        // --- Tasbih Logic ---
        let count = 0;
        function incrementTasbih() {
            count++;
            document.getElementById('tasbih_count').innerText = count;
            if (navigator.vibrate) navigator.vibrate(50);
        }
        function resetTasbih() {
            count = 0;
            document.getElementById('tasbih_count').innerText = count;
        }

        // --- Miras Logic ---
        document.querySelectorAll('.miras-input').forEach(input => {
            input.addEventListener('input', () => {
                const total = parseFloat(document.getElementById('m_total').value) || 0;
                const sons = parseInt(document.getElementById('m_sons').value) || 0;
                const daughters = parseInt(document.getElementById('m_daughters').value) || 0;
                const list = document.getElementById('miras_res_list');
                list.innerHTML = "";
                
                if (sons === 0 && daughters === 0) {
                    list.innerHTML = "<p>সদস্য সংখ্যা উল্লেখ করুন।</p>";
                    return;
                }
                
                const totalParts = (sons * 2) + daughters;
                const perPart = total / totalParts;
                
                if (sons > 0) {
                    const sAmount = Math.floor(perPart * 2);
                    list.innerHTML += `<div class='mb-2'><b>প্রতিটি ছেলে:</b> ৳ ${sAmount.toLocaleString('bn-BD')} <br><small class='text-gold'>(${numberToBengaliWords(sAmount)})</small></div>`;
                }
                if (daughters > 0) {
                    const dAmount = Math.floor(perPart);
                    list.innerHTML += `<div><b>প্রতিটি মেয়ে:</b> ৳ ${dAmount.toLocaleString('bn-BD')} <br><small class='text-gold'>(${numberToBengaliWords(dAmount)})</small></div>`;
                }
            });
        });
        
        document.getElementById('m_total').dispatchEvent(new Event('input'));
    </script>
</body>
</html>
