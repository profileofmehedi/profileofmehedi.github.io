<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Nexus CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body id="page-users">

    <div class="d-flex" id="wrapper">
        <div class="border-end" id="sidebar-wrapper">
            <div class="sidebar-brand">
                <i class="fas fa-cubes me-2"></i> Nexus CRM
            </div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action" href="index.html"><i class="fas fa-fw fa-tachometer-alt me-2"></i> Dashboard</a>
                <div class="text-white-50 small fw-bold px-3 mt-3 mb-1 text-uppercase">Sales</div>
                <a class="list-group-item list-group-item-action" href="leads.html"><i class="fas fa-fw fa-user-tag me-2"></i> Leads</a>
                <a class="list-group-item list-group-item-action" href="deals.html"><i class="fas fa-fw fa-hand-holding-usd me-2"></i> Deals Pipeline</a>
                <div class="text-white-50 small fw-bold px-3 mt-3 mb-1 text-uppercase">Work</div>
                <a class="list-group-item list-group-item-action" href="tasks.html"><i class="fas fa-fw fa-check-square me-2"></i> My Tasks</a>
                <a class="list-group-item list-group-item-action" href="calendar.html"><i class="fas fa-fw fa-calendar me-2"></i> Calendar</a>
                <div class="text-white-50 small fw-bold px-3 mt-3 mb-1 text-uppercase">Admin</div>
                <a class="list-group-item list-group-item-action active" href="users.html"><i class="fas fa-fw fa-users-cog me-2"></i> Users & Roles</a>
                <a class="list-group-item list-group-item-action" href="settings.html"><i class="fas fa-fw fa-cogs me-2"></i> Settings</a>
            </div>
        </div>

        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 static-top">
                <div class="container-fluid">
                    <button class="btn btn-link rounded-circle me-3" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mt-2 mt-lg-0 align-items-center">
                            <li class="nav-item me-3"><a class="nav-link" href="#" onclick="app.showHelp()"><i class="fas fa-question-circle fa-fw"></i> Help</a></li>
                            <div class="topbar-divider d-none d-sm-block border-end mx-2 h-50"></div>
                            <li class="nav-item dropdown no-arrow">
                                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                                    <span class="me-2 d-none d-lg-inline text-gray-600 small">Douglas McGee</span>
                                    <img class="img-profile rounded-circle" src="https://ui-avatars.com/api/?name=Douglas+McGee&background=random" width="32">
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end shadow animated--grow-in">
                                    <li><a class="dropdown-item" href="login.html"><i class="fas fa-sign-out-alt fa-sm fa-fw me-2 text-gray-400"></i> Logout</a></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

                <div class="row fade-in">
                    <div class="col-12 mb-3 d-flex justify-content-between align-items-center">
                        <h3 class="h3 text-gray-800">User Management</h3>
                        <button class="btn btn-primary" onclick="app.createUser()"><i class="fas fa-plus"></i> New User</button>
                    </div>
                    <div class="col-12">
                        <div class="card shadow">
                            <div class="card-body">
                                <table id="usersTable" class="table table-bordered table-hover" width="100%">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>User</th>
                                            <th>Role</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="helpModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title"><i class="fas fa-info-circle text-info me-2"></i>Context Guide</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" id="helpModalBody"></div>
            </div>
        </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="mockData.js"></script>
    <script src="script.js"></script>

</html>
