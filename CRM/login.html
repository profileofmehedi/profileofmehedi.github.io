<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexus CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fc;
            background-image: linear-gradient(180deg, #4e73df 0%, #224abe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background: #fff;
        }
        .brand-icon {
            font-size: 3rem;
            color: #4e73df;
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #d1d3e2;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #4e73df;
        }
        .btn-login {
            background-color: #4e73df;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #2e59d9;
            transform: translateY(-1px);
        }
        .text-gray-600 {
            color: #858796;
        }
        .small-text {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="card login-card animate__animated animate__fadeIn">
            <div class="card-body text-center p-4">
                <div class="brand-icon">
                    <i class="fas fa-cubes"></i>
                </div>
                <h3 class="fw-bold text-gray-900 mb-2">Nexus CRM</h3>
                <p class="text-gray-600 mb-4">Sign in to your account</p>

                <form action="index.html">
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold text-gray-600">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@company.com" required value="admin@nexus.com">
                    </div>
                    <div class="mb-3 text-start">
                        <div class="d-flex justify-content-between">
                            <label class="form-label small fw-bold text-gray-600">Password</label>
                            <a href="#" class="text-decoration-none small-text">Forgot?</a>
                        </div>
                        <input type="password" class="form-control" placeholder="••••••••" required value="password">
                    </div>
                    <div class="mb-4 text-start">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small-text text-gray-600" for="rememberMe">
                                Keep me logged in
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100 mb-3">Login</button>
                </form>

                <div class="mt-2">
                    <p class="small-text text-gray-600">Don't have an account? <a href="#" class="text-decoration-none fw-bold">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
