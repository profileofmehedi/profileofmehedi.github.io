<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Deshi POS</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-primary" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-white border-bottom border-light border-opacity-25">
                <i class="fas fa-cash-register me-2"></i> Deshi POS
            </div>
            <div class="list-group list-group-flush">
                <a href="../dashboard.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                </a>
                <a href="pos.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-shopping-cart me-2"></i> POS Screen
                </a>
                <a href="settings.html" class="list-group-item list-group-item-action text-white bg-transparent active border-0">
                    <i class="fas fa-cogs me-2"></i> Settings
                </a>
                <a href="products.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-box me-2"></i> Products
                </a>
                <a href="customers.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-users me-2"></i> Customers
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-chart-line me-2"></i> Reports
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4">
                <div class="d-flex align-items-center">
                    <button class="btn btn-link text-primary" id="menu-toggle"><i class="fas fa-bars fa-lg"></i></button>
                    <h4 class="mb-0 ms-3 text-gray-800">System Settings</h4>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3 bg-white">
                                <h6 class="m-0 fw-bold text-primary">General Business Settings</h6>
                            </div>
                            <div class="card-body">
                                <form id="settingsForm">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Shop Name</label>
                                            <input type="text" class="form-control" id="set-name" value="Deshi POS Store">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Phone Number</label>
                                            <input type="text" class="form-control" id="set-phone" value="+8801700000000">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Address</label>
                                            <textarea class="form-control" id="set-address">House 12, Road 5, Dhanmondi, Dhaka, Bangladesh</textarea>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Currency Symbol</label>
                                            <input type="text" class="form-control" id="set-currency" value="৳">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Tax Rate (%)</label>
                                            <input type="number" class="form-control" id="set-tax" value="5">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Invoice Footer Note</label>
                                            <textarea class="form-control" id="set-footer">Thank you for shopping with us!</textarea>
                                        </div>
                                    </div>
                                    <div class="mt-4">
                                        <button type="button" class="btn btn-primary px-4" onclick="saveSettings()">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3 bg-white">
                                <h6 class="m-0 fw-bold text-primary">System Information</h6>
                            </div>
                            <div class="card-body">
                                <div class="text-center mb-4">
                                    <img src="https://placehold.co/100x100?text=LOGO" class="rounded-circle border mb-3">
                                    <br>
                                    <button class="btn btn-sm btn-outline-secondary">Change Logo</button>
                                </div>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item d-flex justify-content-between small">
                                        <span>Version</span>
                                        <span class="fw-bold">2.0.1 Premium</span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between small">
                                        <span>Last Backup</span>
                                        <span class="text-muted">Today, 10:45 AM</span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between small">
                                        <span>License Status</span>
                                        <span class="badge bg-success">Active</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        function saveSettings() {
            Swal.fire({
                icon: 'success',
                title: 'Settings Saved',
                text: 'System preferences have been updated.',
                timer: 2000,
                showConfirmButton: false
            });
        }
    </script>
</body>
</html>
