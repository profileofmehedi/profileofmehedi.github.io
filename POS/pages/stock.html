<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - Deshi POS</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-primary" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-white border-bottom border-light border-opacity-25">
                <i class="fas fa-cash-register me-2"></i> Deshi POS
            </div>
            <div class="list-group list-group-flush">
                <a href="../dashboard.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                </a>
                <a href="pos.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-shopping-cart me-2"></i> POS Screen
                </a>
                <a href="products.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-box me-2"></i> Products
                </a>
                <a href="stock.html" class="list-group-item list-group-item-action text-white bg-transparent active border-0">
                    <i class="fas fa-warehouse me-2"></i> Stock
                </a>
                <a href="purchase.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-dolly me-2"></i> Purchase
                </a>
                 <a href="customers.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-users me-2"></i> Customers
                </a>
                <a href="sales.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-file-invoice-dollar me-2"></i> Sales History
                </a>
                <a href="expense.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-money-bill-wave me-2"></i> Expense
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-chart-line me-2"></i> Reports
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4">
                <div class="d-flex align-items-center">
                    <button class="btn btn-link text-primary" id="menu-toggle"><i class="fas fa-bars fa-lg"></i></button>
                    <h4 class="mb-0 ms-3 text-gray-800">Stock Inventory</h4>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                
                <!-- Stock Stats -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card card-counter primary p-3">
                            <div class="small fw-bold text-primary text-uppercase">Total Stock Items</div>
                            <div class="h3 mb-0 fw-bold" id="total-qty">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-counter success p-3">
                            <div class="small fw-bold text-success text-uppercase">Total Stock Value (Cost)</div>
                            <div class="h3 mb-0 fw-bold" id="total-cost-val">৳ 0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-counter info p-3">
                            <div class="small fw-bold text-info text-uppercase">Potential Profit</div>
                            <div class="h3 mb-0 fw-bold" id="total-profit-val">৳ 0</div>
                        </div>
                    </div>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3 bg-white">
                        <h6 class="m-0 fw-bold text-primary">Current Inventory Levels</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover" id="stockTable" width="100%" cellspacing="0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Product Name</th>
                                        <th>Category</th>
                                        <th>Barcode</th>
                                        <th>Stock Qty</th>
                                        <th>Unit Cost</th>
                                        <th>Unit Price</th>
                                        <th>Stock Value</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        $(document).ready(function() {
            loadStock();
        });

        function loadStock() {
            const products = DB.getAll('pos_products');
            const tbody = $('#stockTable tbody');
            tbody.empty();

            let totalQty = 0;
            let totalCostVal = 0;
            let totalSaleVal = 0;

            products.forEach(p => {
                const stockVal = p.stock * p.cost;
                totalQty += p.stock;
                totalCostVal += stockVal;
                totalSaleVal += (p.stock * p.price);

                let status = '<span class="badge bg-success">In Stock</span>';
                if(p.stock <= 0) status = '<span class="badge bg-danger">Out of Stock</span>';
                else if(p.stock < 10) status = '<span class="badge bg-warning text-dark">Low Stock</span>';

                tbody.append(`
                    <tr>
                        <td class="fw-bold">${p.name}</td>
                        <td>${p.category}</td>
                        <td class="small">${p.barcode}</td>
                        <td class="text-center fw-bold">${p.stock}</td>
                        <td>৳ ${p.cost}</td>
                        <td>৳ ${p.price}</td>
                        <td class="fw-bold text-primary">৳ ${stockVal}</td>
                        <td>${status}</td>
                    </tr>
                `);
            });

            $('#total-qty').text(totalQty);
            $('#total-cost-val').text('৳ ' + totalCostVal.toLocaleString());
            $('#total-profit-val').text('৳ ' + (totalSaleVal - totalCostVal).toLocaleString());

            if ($.fn.DataTable.isDataTable('#stockTable')) {
                $('#stockTable').DataTable().destroy();
            }
            $('#stockTable').DataTable();
        }
    </script>
</body>
</html>
