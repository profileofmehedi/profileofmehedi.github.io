<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Deshi POS</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-primary" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-white border-bottom border-light border-opacity-25">
                <i class="fas fa-cash-register me-2"></i> Deshi POS
            </div>
            <div class="list-group list-group-flush">
                <a href="../dashboard.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                </a>
                <a href="pos.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-shopping-cart me-2"></i> POS Screen
                </a>
                <a href="products.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-box me-2"></i> Products
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action text-white bg-transparent active border-0">
                    <i class="fas fa-chart-line me-2"></i> Reports
                </a>
                <a href="stock.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-warehouse me-2"></i> Stock
                </a>
                <a href="expense.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-money-bill-wave me-2"></i> Expense
                </a>
                <a href="sales.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-file-invoice-dollar me-2"></i> Sales History
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4">
                <div class="d-flex align-items-center">
                    <button class="btn btn-link text-primary" id="menu-toggle"><i class="fas fa-bars fa-lg"></i></button>
                    <h4 class="mb-0 ms-3 text-gray-800">Business Reports</h4>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="card p-4 text-center border-0 shadow-sm">
                            <h6 class="text-muted">Total Sales</h6>
                            <h3 class="fw-bold text-primary" id="rep-total-sales">৳ 0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-4 text-center border-0 shadow-sm">
                            <h6 class="text-muted">Total Cost</h6>
                            <h3 class="fw-bold text-secondary" id="rep-total-cost">৳ 0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-4 text-center border-0 shadow-sm">
                            <h6 class="text-muted">Total Expense</h6>
                            <h3 class="fw-bold text-danger" id="rep-total-expense">৳ 0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-4 text-center border-0 shadow-sm">
                            <h6 class="text-muted">Net Profit</h6>
                            <h3 class="fw-bold text-success" id="rep-net-profit">৳ 0</h3>
                        </div>
                    </div>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3 bg-white">
                        <h6 class="m-0 fw-bold text-primary">Sales Summary Report</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="reportsTable" width="100%">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Total Items</th>
                                        <th>Subtotal</th>
                                        <th>Tax</th>
                                        <th>Discount</th>
                                        <th>Grand Total</th>
                                        <th>Profit</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        $(document).ready(function() {
            generateReport();
        });

        function generateReport() {
            const sales = DB.getAll('pos_sales');
            const expenses = DB.getAll('pos_expenses');
            const tbody = $('#reportsTable tbody');
            tbody.empty();

            let totalSales = 0;
            let totalCost = 0;
            let totalProfit = 0;
            let totalExpense = expenses.reduce((acc, e) => acc + e.amount, 0);

            sales.forEach(s => {
                let saleCost = s.items.reduce((acc, item) => acc + (item.cost * item.qty), 0);
                let saleProfit = s.total - saleCost;
                
                totalSales += s.total;
                totalCost += saleCost;
                totalProfit += saleProfit;

                tbody.append(`
                    <tr>
                        <td>${s.date}</td>
                        <td>${s.items.length}</td>
                        <td>৳ ${s.subtotal}</td>
                        <td>৳ ${s.tax}</td>
                        <td>৳ ${s.discount}</td>
                        <td class="fw-bold text-primary">৳ ${s.total}</td>
                        <td class="fw-bold text-success">৳ ${saleProfit.toFixed(2)}</td>
                    </tr>
                `);
            });

            $('#rep-total-sales').text('৳ ' + totalSales.toLocaleString());
            $('#rep-total-cost').text('৳ ' + totalCost.toLocaleString());
            $('#rep-total-expense').text('৳ ' + totalExpense.toLocaleString());
            $('#rep-net-profit').text('৳ ' + (totalProfit - totalExpense).toLocaleString());

            $('#reportsTable').DataTable();
        }
    </script>
</body>
</html>
