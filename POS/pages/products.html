<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Deshi POS</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="border-end bg-primary" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-white border-bottom border-light border-opacity-25">
                <i class="fas fa-cash-register me-2"></i> Deshi POS
            </div>
            <div class="list-group list-group-flush">
                <a href="../dashboard.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                </a>
                <a href="pos.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-shopping-cart me-2"></i> POS Screen
                </a>
                <a href="products.html" class="list-group-item list-group-item-action text-white bg-transparent active border-0">
                    <i class="fas fa-box me-2"></i> Products
                </a>
                <a href="customers.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-users me-2"></i> Customers
                </a>
                <a href="sales.html" class="list-group-item list-group-item-action text-white bg-transparent border-0">
                    <i class="fas fa-file-invoice-dollar me-2"></i> Sales History
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4">
                <div class="d-flex align-items-center">
                    <button class="btn btn-link text-primary" id="menu-toggle"><i class="fas fa-bars fa-lg"></i></button>
                    <h4 class="mb-0 ms-3 text-gray-800">Product Management</h4>
                </div>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                                <span class="me-2 d-none d-lg-inline text-gray-600 small" id="user-name-display">User</span>
                                <img class="img-profile rounded-circle" src="https://placehold.co/60x60" style="height: 2rem; width: 2rem;">
                            </a>
                            <div class="dropdown-menu dropdown-menu-end shadow animated--grow-in">
                                <a class="dropdown-item" href="#" id="logout-btn">
                                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Logout
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center bg-white">
                        <h6 class="m-0 fw-bold text-primary">All Products</h6>
                        <button class="btn btn-primary btn-sm" onclick="openAddModal()"><i class="fas fa-plus"></i> Add New Product</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover" id="productsTable" width="100%" cellspacing="0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Cost</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="prod-id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="prod-name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Barcode</label>
                                <input type="text" class="form-control" id="prod-barcode">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="prod-category">
                                    <option value="Beverage">Beverage</option>
                                    <option value="Snacks">Snacks</option>
                                    <option value="Dairy">Dairy</option>
                                    <option value="Household">Household</option>
                                    <option value="Personal Care">Personal Care</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Brand</label>
                                <input type="text" class="form-control" id="prod-brand">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Stock Qty</label>
                                <input type="number" class="form-control" id="prod-stock" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cost Price</label>
                                <input type="number" class="form-control" id="prod-cost" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Sale Price</label>
                                <input type="number" class="form-control" id="prod-price" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveProduct()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        let dataTable;

        $(document).ready(function() {
            loadProducts();
        });

        function loadProducts() {
            const products = DB.getAll('pos_products');
            const tbody = $('#productsTable tbody');
            tbody.empty();

            products.forEach(p => {
                tbody.append(`
                    <tr>
                        <td>${p.id}</td>
                        <td class="text-center"><img src="${p.image || 'https://placehold.co/40x40'}" class="rounded" width="40" height="40"></td>
                        <td>${p.name}<br><small class="text-muted">${p.barcode}</small></td>
                        <td>${p.category}</td>
                        <td>৳ ${p.cost}</td>
                        <td>৳ ${p.price}</td>
                        <td>
                            <span class="badge ${p.stock < 10 ? 'bg-danger' : 'bg-success'}">${p.stock}</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-info text-white me-1" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `);
            });

            if ($.fn.DataTable.isDataTable('#productsTable')) {
                $('#productsTable').DataTable().destroy();
            }
            dataTable = $('#productsTable').DataTable({
                "order": [[ 0, "desc" ]]
            });
        }

        function openAddModal() {
            $('#productForm')[0].reset();
            $('#prod-id').val('');
            $('#modalTitle').text('Add Product');
            $('#productModal').modal('show');
        }

        function editProduct(id) {
            const products = DB.getAll('pos_products');
            const p = products.find(x => x.id === id);
            if(p) {
                $('#prod-id').val(p.id);
                $('#prod-name').val(p.name);
                $('#prod-barcode').val(p.barcode);
                $('#prod-category').val(p.category);
                $('#prod-brand').val(p.brand);
                $('#prod-stock').val(p.stock);
                $('#prod-cost').val(p.cost);
                $('#prod-price').val(p.price);
                
                $('#modalTitle').text('Edit Product');
                $('#productModal').modal('show');
            }
        }

        function saveProduct() {
            const id = $('#prod-id').val();
            const data = {
                name: $('#prod-name').val(),
                barcode: $('#prod-barcode').val(),
                category: $('#prod-category').val(),
                brand: $('#prod-brand').val(),
                stock: parseInt($('#prod-stock').val()),
                cost: parseFloat($('#prod-cost').val()),
                price: parseFloat($('#prod-price').val()),
                image: 'https://placehold.co/100x100' // Placeholder for now
            };

            if(!data.name || !data.price) {
                Swal.fire('Error', 'Please fill required fields', 'error');
                return;
            }

            if(id) {
                DB.update('pos_products', parseInt(id), data);
                Swal.fire('Updated!', 'Product updated successfully.', 'success');
            } else {
                DB.add('pos_products', data);
                Swal.fire('Added!', 'New product added.', 'success');
            }
            
            $('#productModal').modal('hide');
            loadProducts();
        }

        function deleteProduct(id) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    DB.delete('pos_products', id);
                    loadProducts();
                    Swal.fire('Deleted!', 'Product has been deleted.', 'success');
                }
            });
        }
    </script>
</body>
</html>
