<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড - এনজিও এডমিন</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
                <div class="card-box stat-card border-primary">
                    <div class="stat-label text-primary">মোট সদস্য</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="totalMembers">0</h3>
                        <div class="stat-icon text-primary"><i class="fas fa-users"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-box stat-card border-success">
                    <div class="stat-label text-success">সক্রিয় ঋণ</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="activeLoans">0</h3>
                        <div class="stat-icon text-success"><i class="fas fa-hand-holding-usd"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-box stat-card border-info">
                    <div class="stat-label text-info">আজকের আদায়</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="todayCollection">৳0</h3>
                        <div class="stat-icon text-info"><i class="fas fa-coins"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-box stat-card border-danger">
                    <div class="stat-label text-danger">বকেয়া পরিমাণ</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="totalOverdue">৳0</h3>
                        <div class="stat-icon text-danger"><i class="fas fa-exclamation-triangle"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card-box">
                    <h5 class="mb-4">সাম্প্রতিক কিস্তি আদায়</h5>
                    <div class="table-responsive">
                        <table class="table table-sm" id="recentCollections">
                            <thead>
                                <tr>
                                    <th>তারিখ</th>
                                    <th>সদস্য</th>
                                    <th>পরিমাণ</th>
                                    <th>অফিসার</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-box">
                    <h5 class="mb-4">শাখা ভিত্তিক তথ্য</h5>
                    <div id="branchList"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const members = DB.getAll(DB.KEYS.MEMBERS).filter(m => m.ngoId === user.ngoId);
        const loans = DB.getAll(DB.KEYS.LOANS).filter(l => l.status === 'Active');
        const collections = DB.getAll(DB.KEYS.COLLECTIONS);
        const branches = DB.getAll(DB.KEYS.BRANCHES).filter(b => b.ngoId === user.ngoId);

        $('#totalMembers').text(members.length);
        $('#activeLoans').text(loans.length);

        const today = new Date().toISOString().split('T')[0];
        const todayCol = collections.filter(c => c.date === today).reduce((sum, c) => sum + c.amount, 0);
        $('#todayCollection').text('৳' + todayCol.toLocaleString());

        let overdue = loans.reduce((sum, l) => sum + (l.due > 0 ? l.due * 0.1 : 0), 0);
        $('#totalOverdue').text('৳' + Math.round(overdue).toLocaleString());

        collections.slice(-5).reverse().forEach(c => {
            const member = members.find(m => m.id == c.memberId);
            $('#recentCollections tbody').append(`
                <tr>
                    <td>${c.date}</td>
                    <td>${member ? member.name : 'অজানা'}</td>
                    <td>৳${c.amount}</td>
                    <td>ফিল্ড অফিসার ১</td>
                </tr>
            `);
        });

        branches.forEach(b => {
            $('#branchList').append(`
                <div class="d-flex justify-content-between mb-2 border-bottom pb-1">
                    <span>${b.name}</span>
                    <span class="badge bg-soft-primary text-primary">সক্রিয়</span>
                </div>
            `);
        });
    });
</script>

</body>
</html>
