<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ঋণ প্রোডাক্ট - এনজিও এডমিন</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4>ঋণ প্রোডাক্ট সেটআপ</h4>
                <p class="text-muted small mb-0">নতুন ঋণের স্কিম এবং সুদের হার নির্ধারণ করুন।</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                <i class="fas fa-plus"></i> নতুন প্রোডাক্ট তৈরি করুন
            </button>
        </div>

        <div class="card-box">
            <table id="productTable" class="table table-hover w-100">
                <thead>
                    <tr>
                        <th>স্কিমের নাম</th>
                        <th>সুদ (%)</th>
                        <th>মেয়াদ</th>
                        <th>পদ্ধতি</th>
                        <th>অবস্থা</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">নতুন ঋণ স্কিম যোগ করুন</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">প্রোডাক্টের নাম</label>
                            <input type="text" id="pName" class="form-control" placeholder="যেমন: সাধারণ ঋণ" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">সুদের হার (%)</label>
                            <input type="number" step="0.01" id="pRate" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">কিস্তির ধরণ</label>
                            <select id="pType" class="form-select">
                                <option value="সাপ্তাহিক">সাপ্তাহিক</option>
                                <option value="মাসিক">মাসিক</option>
                                <option value="দৈনিক">দৈনিক</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">কিস্তির সংখ্যা</label>
                            <input type="number" id="pDuration" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">সুদ গণনা পদ্ধতি</label>
                            <select id="pMethod" class="form-select">
                                <option value="ফ্ল্যাট">ফ্ল্যাট রেট</option>
                                <option value="হ্রাসমান">হ্রাসমান ব্যালেন্স</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">সেভ করুন</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const render = () => {
            const products = DB.getAll(DB.KEYS.PRODUCTS).filter(p => p.ngoId === user.ngoId);
            $('#productTable').DataTable({
                data: products,
                destroy: true,
                columns: [
                    { data: 'name' },
                    { data: 'interestRate', render: d => d + '%' },
                    { data: 'duration', render: (d, t, r) => `${d} টি (${r.type})` },
                    { data: 'interestMethod', defaultContent: 'ফ্ল্যাট' },
                    { data: 'status', render: d => `<span class="badge bg-success">${d || 'সক্রিয়'}</span>` },
                    {
                        data: null,
                        render: (data) => `
                            <button class="btn btn-sm btn-outline-info view-prod" data-id="${data.id}"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-prod" data-id="${data.id}"><i class="fas fa-trash"></i></button>
                        `
                    }
                ]
            });
        };
        render();

        $('#productForm').on('submit', function(e) {
            e.preventDefault();
            const newProd = {
                name: $('#pName').val(),
                interestRate: parseFloat($('#pRate').val()),
                duration: parseInt($('#pDuration').val()),
                type: $('#pType').val(),
                interestMethod: $('#pMethod').val(),
                status: 'সক্রিয়',
                ngoId: user.ngoId
            };
            DB.addProduct(newProd);
            $('#addProductModal').modal('hide');
            Swal.fire('সফল', 'প্রোডাক্টটি সফলভাবে যোগ করা হয়েছে', 'success').then(() => location.reload());
        });
    });
</script>

</body>
</html>
