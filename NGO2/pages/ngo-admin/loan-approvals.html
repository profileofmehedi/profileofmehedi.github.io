<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approvals - NGO Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <h4>Pending Loan Approvals</h4>
        <div class="card-box mt-4">
            <table id="approvalTable" class="table table-striped w-100">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Member</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Officer</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const loans = DB.getAll(DB.KEYS.LOANS).filter(l => l.status === 'Applied');
        const members = DB.getAll(DB.KEYS.MEMBERS);
        const products = DB.getAll(DB.KEYS.PRODUCTS);
        const officers = DB.getAll(DB.KEYS.USERS);

        $('#approvalTable').DataTable({
            data: loans,
            columns: [
                { data: 'appliedAt' },
                { 
                    data: 'memberId',
                    render: (id) => members.find(m => m.id == id)?.name || 'Unknown'
                },
                { 
                    data: 'productId',
                    render: (id) => products.find(p => p.id == id)?.name || 'Unknown'
                },
                { data: 'principal', render: (d) => '৳' + d.toLocaleString() },
                { 
                    data: 'appliedBy',
                    render: (id) => officers.find(o => o.id == id)?.name || 'Unknown'
                },
                {
                    data: null,
                    render: (data) => `
                        <button class="btn btn-sm btn-success approve-btn" data-id="${data.id}"><i class="fas fa-check"></i> Approve</button>
                        <button class="btn btn-sm btn-danger reject-btn" data-id="${data.id}"><i class="fas fa-times"></i></button>
                    `
                }
            ]
        });

        $('#approvalTable').on('click', '.approve-btn', function() {
            const id = $(this).data('id');
            Swal.fire({
                title: 'Confirm Approval',
                text: "Are you sure you want to approve this loan application?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Approve'
            }).then((result) => {
                if (result.isConfirmed) {
                    DB.approveLoan(id);
                    Swal.fire('Approved', 'Loan has been approved and moved to disbursement queue.', 'success').then(() => {
                        location.reload();
                    });
                }
            });
        });
    });
</script>

</body>
</html>
