<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সদস্য ব্যবস্থাপনা - এনজিও এডমিন</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>সদস্য ব্যবস্থাপনা</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMemberModal">
                <i class="fas fa-plus"></i> নতুন সদস্য নিবন্ধন
            </button>
        </div>

        <div class="card-box">
            <table id="memberTable" class="table table-hover w-100">
                <thead>
                    <tr>
                        <th>ছবি</th>
                        <th>নাম</th>
                        <th>ফোন</th>
                        <th>এনআইডি</th>
                        <th>শাখা</th>
                        <th>অবস্থা</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">সদস্য নিবন্ধন ফরম</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="memberForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">সদস্যের নাম</label>
                            <input type="text" id="mName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ফোন নম্বর</label>
                            <input type="text" id="mPhone" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">এনআইডি নম্বর</label>
                            <input type="text" id="mNid" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">শাখা নির্বাচন করুন</label>
                            <select id="mBranch" class="form-select" required></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">ঠিকানা</label>
                            <textarea id="mAddress" class="form-control" rows="2" required></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">সদস্য সেভ করুন</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const branches = DB.getAll(DB.KEYS.BRANCHES).filter(b => b.ngoId === user.ngoId);
        branches.forEach(b => $('#mBranch').append(`<option value="${b.id}">${b.name}</option>`));

        const render = () => {
            const members = DB.getAll(DB.KEYS.MEMBERS).filter(m => m.ngoId === user.ngoId);
            $('#memberTable').DataTable({
                data: members,
                destroy: true,
                columns: [
                    { 
                        data: 'name', 
                        render: (d) => `<img src="https://ui-avatars.com/api/?name=${d}&background=random" width="35" class="rounded-circle">`
                    },
                    { data: 'name' },
                    { data: 'phone' },
                    { data: 'nid' },
                    { 
                        data: 'branchId',
                        render: (data) => branches.find(b => b.id == data)?.name || 'N/A'
                    },
                    { data: 'status', render: d => `<span class="badge bg-success">${d || 'সক্রিয়'}</span>` },
                    {
                        data: null,
                        render: () => `<button class="btn btn-sm btn-info text-white"><i class="fas fa-eye"></i> বিস্তারিত</button>`
                    }
                ],
                language: { url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/bn-BD.json" }
            });
        };
        render();

        $('#memberForm').on('submit', function(e) {
            e.preventDefault();
            const members = DB.getAll(DB.KEYS.MEMBERS);
            const newMember = {
                id: members.length + 1,
                name: $('#mName').val(),
                phone: $('#mPhone').val(),
                nid: $('#mNid').val(),
                branchId: parseInt($('#mBranch').val()),
                address: $('#mAddress').val(),
                ngoId: user.ngoId,
                status: 'সক্রিয়'
            };
            members.push(newMember);
            DB.save(DB.KEYS.MEMBERS, members);
            $('#addMemberModal').modal('hide');
            Swal.fire('সফল', 'সদস্য নিবন্ধিত হয়েছে', 'success').then(() => render());
        });
    });
</script>

</body>
</html>
