<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কিস্তি সংগ্রহ - ফিল্ড অফিসার</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="card-box">
            <h5 class="mb-4">সদস্যের কিস্তি আদায়</h5>
            <table id="collectionTable" class="table table-hover w-100">
                <thead>
                    <tr>
                        <th>সদস্যের নাম</th>
                        <th>ফোন নম্বর</th>
                        <th>ঋণ নম্বর</th>
                        <th>পরবর্তী কিস্তি</th>
                        <th>পরিমাণ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="payModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">টাকা গ্রহণ করুন</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">সদস্যের নাম</label>
                    <input type="text" id="pName" class="form-control" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">সংগৃহীত পরিমাণ (৳)</label>
                    <input type="number" id="pAmount" class="form-control" placeholder="টাকার পরিমাণ লিখুন">
                </div>
                <button type="button" id="confirmPay" class="btn btn-primary w-100">পেমেন্ট নিশ্চিত করুন</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const loans = DB.getAll(DB.KEYS.LOANS).filter(l => l.status === 'Active');
        const members = DB.getAll(DB.KEYS.MEMBERS);

        const tableData = [];
        loans.forEach(l => {
            const member = members.find(m => m.id == l.memberId);
            const nextInst = l.schedule.find(s => s.status !== 'Paid');
            if(nextInst) {
                tableData.push({
                    loanId: l.id,
                    memberName: member.name,
                    memberPhone: member.phone,
                    dueDate: nextInst.date,
                    dueAmount: nextInst.amount,
                    memberId: member.id
                });
            }
        });

        $('#collectionTable').DataTable({
            data: tableData,
            columns: [
                { data: 'memberName' },
                { data: 'memberPhone' },
                { data: 'loanId' },
                { data: 'dueDate' },
                { data: 'dueAmount', render: (d) => '৳' + d },
                { 
                    data: null,
                    render: (d) => `<button class="btn btn-sm btn-success collect-btn" data-loan="${d.loanId}" data-name="${d.memberName}" data-amt="${d.dueAmount}" data-member="${d.memberId}">টাকা গ্রহণ</button>`
                }
            ],
            language: { url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/bn-BD.json" }
        });

        let currentLoanId, currentMemberId;

        $('#collectionTable').on('click', '.collect-btn', function() {
            currentLoanId = $(this).data('loan');
            currentMemberId = $(this).data('member');
            $('#pName').val($(this).data('name'));
            $('#pAmount').val($(this).data('amt'));
            $('#payModal').modal('show');
        });

        $('#confirmPay').on('click', function() {
            const amount = $('#pAmount').val();
            const collectionData = {
                loanId: currentLoanId,
                memberId: currentMemberId,
                amount: parseFloat(amount),
                date: new Date().toISOString().split('T')[0],
                collectedBy: user.id
            };

            DB.addCollection(collectionData);
            $('#payModal').modal('hide');
            
            Swal.fire({
                title: 'সফল!',
                text: 'টাকা সংগ্রহ করা হয়েছে। রসিদ তৈরি হয়েছে।',
                icon: 'success',
                confirmButtonText: 'রসিদ প্রিন্ট করুন'
            }).then(() => {
                location.reload();
            });
        });
    });
</script>

</body>
</html>
