<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Disbursement - Field Officer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <h4>Approved Loans Ready for Disbursement</h4>
        <div class="card-box mt-4">
            <table id="disburseTable" class="table table-striped w-100">
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Interest</th>
                        <th>Total Payable</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const loans = DB.getAll(DB.KEYS.LOANS).filter(l => l.status === 'Approved');
        const members = DB.getAll(DB.KEYS.MEMBERS);
        const products = DB.getAll(DB.KEYS.PRODUCTS);

        $('#disburseTable').DataTable({
            data: loans,
            columns: [
                { 
                    data: 'memberId',
                    render: (id) => members.find(m => m.id == id)?.name || 'Unknown'
                },
                { 
                    data: 'productId',
                    render: (id) => products.find(p => p.id == id)?.name || 'Unknown'
                },
                { data: 'principal', render: (d) => '৳' + d.toLocaleString() },
                { data: 'interest', render: (d) => '৳' + d.toLocaleString() },
                { data: 'total', render: (d) => '৳' + d.toLocaleString() },
                {
                    data: null,
                    render: (data) => `
                        <button class="btn btn-sm btn-primary disburse-btn" data-id="${data.id}"><i class="fas fa-hand-holding-usd"></i> Disburse Now</button>
                    `
                }
            ]
        });

        $('#disburseTable').on('click', '.disburse-btn', function() {
            const id = $(this).data('id');
            const loan = loans.find(l => l.id == id);
            const prod = products.find(p => p.id == loan.productId);

            Swal.fire({
                title: 'Confirm Disbursement',
                text: `Disbursing ৳${loan.principal.toLocaleString()} to member. This will generate the repayment schedule.`,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Disburse & Print Vocher'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Generate schedule on disbursement
                    const schedule = [];
                    let date = new Date(loan.startDate || new Date());
                    const instAmt = Math.ceil(loan.total / prod.duration);
                    
                    for(let i=1; i<=prod.duration; i++) {
                        if (prod.type === 'Weekly') date.setDate(date.getDate() + 7);
                        else if (prod.type === 'Monthly') date.setMonth(date.getMonth() + 1);
                        else date.setDate(date.getDate() + 1);
                        
                        schedule.push({ no: i, date: date.toISOString().split('T')[0], amount: instAmt, paid: 0, status: 'Pending' });
                    }

                    // Update loan with schedule and set Active
                    let allLoans = DB.getAll(DB.KEYS.LOANS);
                    let lIdx = allLoans.findIndex(l => l.id == id);
                    allLoans[lIdx].schedule = schedule;
                    allLoans[lIdx].status = 'Active';
                    allLoans[lIdx].disbursedAt = new Date().toISOString().split('T')[0];
                    DB.save(DB.KEYS.LOANS, allLoans);

                    Swal.fire('Disbursed!', 'Loan has been activated and schedule generated.', 'success').then(() => {
                        location.reload();
                    });
                }
            });
        });
    });
</script>

</body>
</html>
