    <!-- Loan Details Modal -->
    <div class="modal fade" id="loanDetailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg">

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="loanDetailsContent">
              <!-- Content will be loaded here -->
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              <i class="fas fa-times me-2"></i>Close
            </button>
            <button type="button" class="btn btn-success" id="proceedDisburse">
              <i class="fas fa-hand-holding-usd me-2"></i>Proceed to Disburse
            </button>
          </div>
        </div>
      </div>
    </div>

          {

          },
        ];

        // Use demo data or fallback to DB data
        const loans =
          DB.getAll(DB.KEYS.LOANS).filter((l) => l.status === "Approved")
            .length > 0
            ? DB.getAll(DB.KEYS.LOANS).filter((l) => l.status === "Approved")

        const members =
          DB.getAll(DB.KEYS.MEMBERS).length > 0
            ? DB.getAll(DB.KEYS.MEMBERS)
            : demoMembers;
        const products =
          DB.getAll(DB.KEYS.PRODUCTS).length > 0
            ? DB.getAll(DB.KEYS.PRODUCTS)
            : demoProducts;

        $("#disburseTable").DataTable({
          data: loans,
          columns: [
            {
              data: "memberId",
              render: (id) =>
                members.find((m) => m.id == id)?.name || "Unknown",
            },
            {
              data: "productId",
              render: (id) =>
                products.find((p) => p.id == id)?.name || "Unknown",
            },
            { data: "principal", render: (d) => "৳" + d.toLocaleString() },
            { data: "interest", render: (d) => "৳" + d.toLocaleString() },
            { data: "total", render: (d) => "৳" + d.toLocaleString() },
            {
              data: null,
              render: (data) => `
                        <button class="btn btn-sm btn-info view-details-btn me-2" data-id="${data.id}">
                            <i class="fas fa-eye"></i> View Details
                        </button>
                        <button class="btn btn-sm btn-success disburse-btn" data-id="${data.id}">
                            <i class="fas fa-hand-holding-usd"></i> Disburse Now
                        </button>
                    `,
            },
          ],
        });

        // View loan details
        $("#disburseTable").on("click", ".view-details-btn", function () {
          const id = $(this).data("id");
          showLoanDetails(id);
        });

        // Disburse from table
        $("#disburseTable").on("click", ".disburse-btn", function () {
          const id = $(this).data("id");
          disburseLoan(id);
        });

        // Disburse from modal
        $("#proceedDisburse").on("click", function () {
          const id = $(this).data("loan-id");
          $("#loanDetailsModal").modal("hide");
          setTimeout(() => disburseLoan(id), 300);
        });

        function showLoanDetails(loanId) {
          const loan = loans.find((l) => l.id == loanId);
          const member = members.find((m) => m.id == loan.memberId);
          const product = products.find((p) => p.id == loan.productId);

          const monthlyPayment = Math.ceil(loan.total / product.duration);
          const startDate = new Date(loan.startDate || new Date());
          const endDate = new Date(startDate);
          endDate.setMonth(endDate.getMonth() + product.duration);

          const detailsHtml = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="card border-primary mb-3">
                            <div class="card-header bg-primary text-white">
                                <i class="fas fa-user me-2"></i>Member Information
                            </div>
                            <div class="card-body">
                                <p><strong>Name:</strong> ${member.name}</p>
                                <p><strong>Phone:</strong> ${member.phone}</p>
                                <p><strong>Address:</strong> ${member.address}</p>
                                <p><strong>Member ID:</strong> MEM-${String(member.id).padStart(4, "0")}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card border-success mb-3">
                            <div class="card-header bg-success text-white">
                                <i class="fas fa-credit-card me-2"></i>Loan Product
                            </div>
                            <div class="card-body">
                                <p><strong>Product:</strong> ${product.name}</p>
                                <p><strong>Interest Rate:</strong> ${product.interestRate}% per annum</p>
                                <p><strong>Duration:</strong> ${product.duration} months</p>
                                <p><strong>Payment Type:</strong> ${product.type}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card border-warning mb-3">
                            <div class="card-header bg-warning text-dark">
                                <i class="fas fa-calculator me-2"></i>Loan Amount Breakdown
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-3">
                                        <div class="text-center p-3 bg-light rounded">
                                            <h5 class="text-primary mb-0">৳${loan.principal.toLocaleString()}</h5>
                                            <small class="text-muted">Principal Amount</small>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="text-center p-3 bg-light rounded">
                                            <h5 class="text-warning mb-0">৳${loan.interest.toLocaleString()}</h5>
                                            <small class="text-muted">Total Interest</small>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="text-center p-3 bg-light rounded">
                                            <h5 class="text-success mb-0">৳${loan.total.toLocaleString()}</h5>
                                            <small class="text-muted">Total Payable</small>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="text-center p-3 bg-light rounded">
                                            <h5 class="text-info mb-0">৳${monthlyPayment.toLocaleString()}</h5>
                                            <small class="text-muted">Monthly Payment</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                        <div class="card border-info mb-3">

                            </div>
                            <div class="card-body">
                                <p><strong>Applied Date:</strong> ${new Date(loan.appliedDate).toLocaleDateString("en-GB")}</p>
                                <p><strong>Approved Date:</strong> ${new Date(loan.approvedDate).toLocaleDateString("en-GB")}</p>
                                <p><strong>Start Date:</strong> ${startDate.toLocaleDateString("en-GB")}</p>

                        </div>
                    </div>
                    <div class="col-md-6">

                                <i class="fas fa-info-circle me-2"></i>Loan Status
                            </div>
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">

                                    <span class="text-muted">Ready for disbursement</span>
                                </div>
                                <p class="mb-0 text-muted small">

                                    Once disbursed, a repayment schedule will be automatically generated and the loan status will change to 'Active'.

                            </div>
                        </div>

                <div class="alert alert-info">

          $("#proceedDisburse").data("loan-id", loanId);
          $("#loanDetailsModal").modal("show");

        function disburseLoan(id) {
          const loan = loans.find((l) => l.id == id);
          const prod = products.find((p) => p.id == loan.productId);
          const member = members.find((m) => m.id == loan.memberId);

          Swal.fire({
            title: "Confirm Disbursement",
            html: `
                    <div class="text-start">
                        <p><strong>Member:</strong> ${member.name}</p>
                        <p><strong>Amount:</strong> ৳${loan.principal.toLocaleString()}</p>
                        <p><strong>Product:</strong> ${prod.name}</p>
                        <hr>
                        <p class="text-muted small">This will generate the repayment schedule and activate the loan.</p>
                    </div>
                `,
            icon: "question",
            showCancelButton: true,
            confirmButtonText:
              '<i class="fas fa-hand-holding-usd me-2"></i>Disburse & Generate Schedule',
            cancelButtonText: '<i class="fas fa-times me-2"></i>Cancel',
            confirmButtonColor: "#28a745",
            cancelButtonColor: "#6c757d",
          }).then((result) => {
            if (result.isConfirmed) {
              // Generate schedule on disbursement
              const schedule = [];
              let date = new Date(loan.startDate || new Date());
              const instAmt = Math.ceil(loan.total / prod.duration);

              for (let i = 1; i <= prod.duration; i++) {
                if (prod.type === "Weekly") date.setDate(date.getDate() + 7);
                else if (prod.type === "Monthly")
                  date.setMonth(date.getMonth() + 1);
                else date.setDate(date.getDate() + 1);

                schedule.push({
                  no: i,
                  date: date.toISOString().split("T")[0],
                  amount: instAmt,
                  paid: 0,
                  status: "Pending",
                });
              }

              // Update loan with schedule and set Active
              let allLoans = DB.getAll(DB.KEYS.LOANS);
              let lIdx = allLoans.findIndex((l) => l.id == id);
              allLoans[lIdx].schedule = schedule;
              allLoans[lIdx].status = "Active";
              allLoans[lIdx].disbursedAt = new Date()
                .toISOString()
                .split("T")[0];
              DB.save(DB.KEYS.LOANS, allLoans);

              Swal.fire(
                "Disbursed!",
                "Loan has been activated and schedule generated.",
                "success",
              ).then(() => {
                location.reload();
              });
            }
          });
        }
      });
