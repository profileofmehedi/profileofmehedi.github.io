<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply New Loan - Field Officer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card-box">
                    <h5 class="mb-4">Loan Application Form</h5>
                    <form id="loanAppForm">
                        <div class="mb-3">
                            <label class="form-label">Member Selection</label>
                            <select id="lMember" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Loan Product Scheme</label>
                            <select id="lProduct" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Requested Principal Amount (৳)</label>
                            <input type="number" id="lAmount" class="form-control" required placeholder="Enter amount">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Purpose of Loan</label>
                            <input type="text" id="lPurpose" class="form-control" placeholder="e.g. Small Business, Agriculture">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Preferred Start Date</label>
                            <input type="date" id="lDate" class="form-control" required>
                        </div>
                        <div class="alert alert-warning" id="productInfo" style="display:none">
                            <small id="productDetails"></small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Application for Review</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const members = DB.getAll(DB.KEYS.MEMBERS).filter(m => m.branchId == user.branchId);
        const products = DB.getAll(DB.KEYS.PRODUCTS).filter(p => p.ngoId === user.ngoId && p.status === 'Active');

        members.forEach(m => $('#lMember').append(`<option value="${m.id}">${m.name} (${m.phone})</option>`));
        products.forEach(p => $('#lProduct').append(`<option value="${p.id}">${p.name} (${p.interestRate}%)</option>`));

        $('#lProduct').on('change', function() {
            const prod = products.find(p => p.id == $(this).val());
            if (prod) {
                $('#productDetails').html(`
                    <strong>${prod.name}</strong>: ${prod.interestRate}% ${prod.interestMethod} | 
                    ${prod.duration} ${prod.type} installments | Range: ৳${prod.minAmount} - ৳${prod.maxAmount}
                `);
                $('#productInfo').show();
            }
        });

        $('#loanAppForm').on('submit', function(e) {
            e.preventDefault();
            const prod = products.find(p => p.id == $('#lProduct').val());
            const amount = parseFloat($('#lAmount').val());

            if (amount < prod.minAmount || amount > prod.maxAmount) {
                Swal.fire('Limit Error', `Amount must be between ৳${prod.minAmount} and ৳${prod.maxAmount}`, 'error');
                return;
            }

            const interest = amount * (prod.interestRate / 100);
            const total = amount + interest;

            const loanApplication = {
                memberId: parseInt($('#lMember').val()),
                productId: prod.id,
                principal: amount,
                interest: interest,
                total: total,
                paid: 0,
                due: total,
                status: 'Applied',
                purpose: $('#lPurpose').val(),
                startDate: $('#lDate').val(),
                appliedBy: user.id,
                appliedAt: new Date().toISOString().split('T')[0]
            };

            DB.applyLoan(loanApplication);
            Swal.fire('Success', 'Loan Application Submitted for Approval', 'success').then(() => {
                location.reload();
            });
        });
    });
</script>

</body>
</html>
