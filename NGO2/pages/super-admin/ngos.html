<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage NGOs - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4>Tenant Management</h4>
                <p class="text-muted small mb-0">Oversee all registered NGO organizations and their statuses.</p>
            </div>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addNgoModal">
                <i class="fas fa-plus fa-sm"></i> Onboard New NGO
            </button>
        </div>

        <div class="card-box">
            <table id="ngoTable" class="table table-hover w-100">
                <thead class="table-light">
                    <tr>
                        <th>Organization</th>
                        <th>Subscription Plan</th>
                        <th>Status</th>
                        <th>Billing Cycle</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addNgoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Onboard New Organization</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small mb-4">Enter the details to create a new tenant environment.</p>
                <form id="ngoForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">NGO Name</label>
                            <input type="text" id="ngoName" class="form-control" placeholder="e.g. Grameen Foundation" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Admin Email</label>
                            <input type="email" id="ngoEmail" class="form-control" placeholder="admin@domain.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Subscription Plan</label>
                            <select id="ngoPlan" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contract Expiry</label>
                            <input type="date" id="ngoExpiry" class="form-control" required>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2">Create Tenant Environment</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const ngos = DB.getAll(DB.KEYS.NGOS);
        const plans = DB.getAll(DB.KEYS.PLANS);

        // Fill Plan Dropdown
        plans.forEach(p => $('#ngoPlan').append(`<option value="${p.id}">${p.name} ($${p.price}/mo)</option>`));

        const table = $('#ngoTable').DataTable({
            data: ngos,
            columns: [
                { 
                    data: 'name',
                    render: (d, t, r) => `
                        <div class="d-flex align-items-center">
                            <div class="avatar-sm bg-light rounded-circle p-2 me-3 text-center" style="width: 40px; height: 40px;">
                                <i class="fas fa-building text-primary pt-1"></i>
                            </div>
                            <div>
                                <div class="fw-bold text-dark">${d}</div>
                                <div class="small text-muted">ID: NGO-${r.id}</div>
                            </div>
                        </div>
                    `
                },
                { 
                    data: 'planId',
                    render: (data) => {
                        const plan = plans.find(p => p.id == data);
                        return `<span class="badge bg-soft-info text-info border border-info px-3 py-1" style="background: #e0f2fe">${plan ? plan.name : 'Custom'}</span>`;
                    }
                },
                { 
                    data: 'status',
                    render: (data) => {
                        const color = data === 'Active' ? 'success' : 'danger';
                        return `<span class="badge bg-${color} rounded-pill px-3">${data}</span>`;
                    }
                },
                { 
                    data: 'expiryDate',
                    render: (d) => `<div class="text-muted small"><i class="far fa-calendar-alt me-1"></i> ${d}</div>`
                },
                {
                    data: null,
                    render: (data) => `
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-warning toggle-status" data-id="${data.id}" title="${data.status === 'Active' ? 'Suspend' : 'Activate'}">
                                <i class="fas fa-${data.status === 'Active' ? 'pause' : 'play'}"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger delete-ngo" data-id="${data.id}" title="Delete Tenant">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `
                }
            ]
        });

        $('#ngoForm').on('submit', function(e) {
            e.preventDefault();
            const newNgo = {
                id: ngos.length + 1,
                name: $('#ngoName').val(),
                planId: parseInt($('#ngoPlan').val()),
                status: 'Active',
                expiryDate: $('#ngoExpiry').val()
            };
            ngos.push(newNgo);
            DB.save(DB.KEYS.NGOS, ngos);
            $('#addNgoModal').modal('hide');
            Swal.fire({
                icon: 'success',
                title: 'Tenant Created',
                text: 'The new NGO environment has been successfully provisioned.',
                timer: 2000,
                showConfirmButton: false
            }).then(() => location.reload());
        });

        $('#ngoTable').on('click', '.toggle-status', function() {
            const id = $(this).data('id');
            const ngo = ngos.find(n => n.id == id);
            ngo.status = ngo.status === 'Active' ? 'Suspended' : 'Active';
            DB.save(DB.KEYS.NGOS, ngos);
            location.reload();
        });

        $('#ngoTable').on('click', '.delete-ngo', function() {
            const id = $(this).data('id');
            Swal.fire({
                title: 'Terminate Tenant?',
                text: "This will permanently delete the NGO and all associated data. This action cannot be undone.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Yes, Terminate'
            }).then((result) => {
                if (result.isConfirmed) {
                    const updated = ngos.filter(n => n.id != id);
                    DB.save(DB.KEYS.NGOS, updated);
                    location.reload();
                }
            });
        });
    });
</script>

</body>
</html>
