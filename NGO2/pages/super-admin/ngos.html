<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage NGOs - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>NGO Management</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addNgoModal">
                <i class="fas fa-plus"></i> Create NGO
            </button>
        </div>

        <div class="card-box">
            <table id="ngoTable" class="table table-striped w-100">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NGO Name</th>
                        <th>Plan</th>
                        <th>Status</th>
                        <th>Expiry</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addNgoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New NGO</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="ngoForm">
                    <div class="mb-3">
                        <label class="form-label">NGO Name</label>
                        <input type="text" id="ngoName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Plan</label>
                        <select id="ngoPlan" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" id="ngoExpiry" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save NGO</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const ngos = DB.getAll(DB.KEYS.NGOS);
        const plans = DB.getAll(DB.KEYS.PLANS);

        // Fill Plan Dropdown
        plans.forEach(p => $('#ngoPlan').append(`<option value="${p.id}">${p.name} ($${p.price})</option>`));

        const table = $('#ngoTable').DataTable({
            data: ngos,
            columns: [
                { data: 'id' },
                { data: 'name' },
                { 
                    data: 'planId',
                    render: (data) => {
                        const plan = plans.find(p => p.id == data);
                        return `<span class="badge bg-info">${plan ? plan.name : 'N/A'}</span>`;
                    }
                },
                { 
                    data: 'status',
                    render: (data) => `<span class="badge bg-${data === 'Active' ? 'success' : 'danger'}">${data}</span>`
                },
                { data: 'expiryDate' },
                {
                    data: null,
                    render: (data) => `
                        <button class="btn btn-sm btn-warning toggle-status" data-id="${data.id}">${data.status === 'Active' ? 'Suspend' : 'Activate'}</button>
                        <button class="btn btn-sm btn-danger delete-ngo" data-id="${data.id}"><i class="fas fa-trash"></i></button>
                    `
                }
            ]
        });

        $('#ngoForm').on('submit', function(e) {
            e.preventDefault();
            const newNgo = {
                id: ngos.length + 1,
                name: $('#ngoName').val(),
                planId: parseInt($('#ngoPlan').val()),
                status: 'Active',
                expiryDate: $('#ngoExpiry').val()
            };
            ngos.push(newNgo);
            DB.save(DB.KEYS.NGOS, ngos);
            Swal.fire('Success', 'NGO Created Successfully', 'success').then(() => location.reload());
        });

        $('#ngoTable').on('click', '.toggle-status', function() {
            const id = $(this).data('id');
            const ngo = ngos.find(n => n.id == id);
            ngo.status = ngo.status === 'Active' ? 'Suspended' : 'Active';
            DB.save(DB.KEYS.NGOS, ngos);
            location.reload();
        });

        $('#ngoTable').on('click', '.delete-ngo', function() {
            const id = $(this).data('id');
            Swal.fire({
                title: 'Are you sure?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    const updated = ngos.filter(n => n.id != id);
                    DB.save(DB.KEYS.NGOS, updated);
                    location.reload();
                }
            });
        });
    });
</script>

</body>
</html>
