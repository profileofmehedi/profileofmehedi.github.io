<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing & Invoices - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>
    <div class="container-fluid">
        <div class="card-box">
            <h5 class="mb-4">Billing History</h5>
            <table id="billingTable" class="table table-striped w-100">
                <thead><tr><th>Invoice #</th><th>NGO</th><th>Plan</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody>
                    <tr><td>INV-001</td><td>Grameen Pro</td><td>Pro</td><td>$5,000</td><td><span class="badge bg-success">Paid</span></td></tr>
                    <tr><td>INV-002</td><td>Small Hope NGO</td><td>Basic</td><td>$1,000</td><td><span class="badge bg-warning">Pending</span></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    $(document).ready(function() {
        $('#billingTable').DataTable();
    });
</script>
</body>
</html>
