<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড - সুপার এডমিন</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-0">প্ল্যাটফর্ম ওভারভিউ</h4>
                <p class="text-muted small">এনজিওসমূহের রিয়েল-টাইম পারফরম্যান্স মেট্রিক্স</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary"><i class="fas fa-download"></i> রিপোর্ট</button>
                <button class="btn btn-sm btn-primary"><i class="fas fa-plus"></i> নতুন এনজিও</button>
            </div>
        </div>

        <div class="row">
            <div class="col-xl-3 col-md-6">
                <div class="card-box stat-card border-primary">
                    <div class="stat-label text-primary">মোট এনজিও</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="totalNgos">0</h3>
                        <div class="stat-icon"><i class="fas fa-building"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card-box stat-card border-success">
                    <div class="stat-label text-success">বার্ষিক আয় (ARR)</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="monthlyRev">৳0</h3>
                        <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card-box stat-card border-info">
                    <div class="stat-label text-info">সক্রিয় সাবস্ক্রিপশন</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="activeSubs">0</h3>
                        <div class="stat-icon"><i class="fas fa-user-check"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card-box stat-card border-warning">
                    <div class="stat-label text-warning">সিস্টেম স্ট্যাটাস</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value">৯৯.৯%</h3>
                        <div class="stat-icon"><i class="fas fa-server"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12">
                <div class="card-box">
                    <h6 class="font-weight-bold text-primary mb-4">সাম্প্রতিক এনজিও তালিকা</h6>
                    <div class="table-responsive">
                        <table class="table table-hover" id="recentNgoTable">
                            <thead>
                                <tr>
                                    <th>এনজিও নাম</th>
                                    <th>প্ল্যান</th>
                                    <th>স্ট্যাটাস</th>
                                    <th>মেয়াদ শেষ</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        const ngos = DB.getAll(DB.KEYS.NGOS);
        const plans = DB.getAll(DB.KEYS.PLANS);
        
        $('#totalNgos').text(ngos.length);
        $('#activeSubs').text(ngos.filter(n => n.status === 'সক্রিয়').length);
        
        let revenue = 0;
        ngos.forEach(ngo => {
            const plan = plans.find(p => p.id === ngo.planId);
            if(plan && ngo.status === 'সক্রিয়') revenue += plan.price;
        });
        $('#monthlyRev').text('৳' + (revenue * 12).toLocaleString());

        ngos.slice(0, 5).forEach(ngo => {
            const plan = plans.find(p => p.id === ngo.planId);
            $('#recentNgoTable tbody').append(`
                <tr>
                    <td>${ngo.name}</td>
                    <td>${plan?.name || 'বেসিক'}</td>
                    <td><span class="badge bg-success rounded-pill">${ngo.status}</span></td>
                    <td>${ngo.expiryDate}</td>
                </tr>
            `);
        });
    });
</script>

</body>
</html>
