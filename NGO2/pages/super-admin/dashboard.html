<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
                <div class="card-box stat-card border-primary">
                    <div class="stat-label text-primary">Total NGOs</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="totalNgos">0</h3>
                        <div class="stat-icon"><i class="fas fa-building"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-box stat-card border-success">
                    <div class="stat-label text-success">Active Subs</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="activeSubs">0</h3>
                        <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-box stat-card border-info">
                    <div class="stat-label text-info">Monthly Revenue</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="monthlyRev">$0</h3>
                        <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-box stat-card border-danger">
                    <div class="stat-label text-danger">Expired NGOs</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <h3 class="stat-value" id="expiredNgos">0</h3>
                        <div class="stat-icon"><i class="fas fa-times-circle"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card-box">
                    <h5 class="mb-4">Recent NGO Registrations</h5>
                    <div class="table-responsive">
                        <table class="table table-hover" id="recentNgoTable">
                            <thead>
                                <tr>
                                    <th>NGO Name</th>
                                    <th>Plan</th>
                                    <th>Status</th>
                                    <th>Expiry</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    $(document).ready(function() {
        // Load Stats
        const ngos = DB.getAll(DB.KEYS.NGOS);
        const plans = DB.getAll(DB.KEYS.PLANS);
        
        $('#totalNgos').text(ngos.length);
        $('#activeSubs').text(ngos.filter(n => n.status === 'Active').length);
        $('#expiredNgos').text(ngos.filter(n => n.status !== 'Active').length);

        // Calc Revenue (Simple assumption: Sum of plan prices for active ngos)
        let revenue = 0;
        ngos.forEach(ngo => {
            const plan = plans.find(p => p.id === ngo.planId);
            if(plan && ngo.status === 'Active') revenue += plan.price;
        });
        $('#monthlyRev').text('$' + revenue.toLocaleString());

        // Table
        ngos.slice(0, 5).forEach(ngo => {
            const plan = plans.find(p => p.id === ngo.planId);
            $('#recentNgoTable tbody').append(`
                <tr>
                    <td>${ngo.name}</td>
                    <td><span class="badge bg-info">${plan ? plan.name : 'Unknown'}</span></td>
                    <td><span class="badge bg-${ngo.status === 'Active' ? 'success' : 'danger'}">${ngo.status}</span></td>
                    <td>${ngo.expiryDate}</td>
                </tr>
            `);
        });
    });
</script>

</body>
</html>
