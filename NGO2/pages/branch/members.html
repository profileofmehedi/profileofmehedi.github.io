<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Members - Branch Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>
    <div class="container-fluid">
        <h4>Branch Members</h4>
        <div class="card-box mt-4">
            <table id="memberTable" class="table table-striped w-100">
                <thead><tr><th>Name</th><th>Phone</th><th>NID</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const members = DB.getAll(DB.KEYS.MEMBERS).filter(m => m.branchId == user.branchId);
        $('#memberTable').DataTable({
            data: members,
            columns: [
                { data: 'name' },
                { data: 'phone' },
                { data: 'nid' },
                { data: 'status', render: d => `<span class="badge bg-success">${d}</span>` }
            ]
        });
    });
</script>
</body>
</html>
