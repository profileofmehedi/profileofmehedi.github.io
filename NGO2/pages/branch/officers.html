<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Officers - Branch Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
    <div id="topNavbar" class="navbar-custom"></div>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>Field Officers</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addOfficerModal"><i class="fas fa-plus"></i> Add Officer</button>
        </div>
        <div class="card-box">
            <table id="officerTable" class="table table-striped w-100">
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addOfficerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Field Officer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="officerForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="offName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="offEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="offPass" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Officer</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../assets/js/db.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
    $(document).ready(function() {
        const user = DB.getCurrentUser();
        const users = DB.getAll(DB.KEYS.USERS);
        const officers = users.filter(u => u.role === 'officer' && u.branchId == user.branchId);

        $('#officerTable').DataTable({
            data: officers,
            columns: [
                { data: 'name' },
                { data: 'email' },
                { data: 'role' },
                { data: null, render: () => `<button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>`}
            ]
        });

        $('#officerForm').on('submit', function(e) {
            e.preventDefault();
            const newOfficer = {
                id: users.length + 1,
                name: $('#offName').val(),
                email: $('#offEmail').val(),
                password: $('#offPass').val(),
                role: 'officer',
                ngoId: user.ngoId,
                branchId: user.branchId
            };
            users.push(newOfficer);
            DB.save(DB.KEYS.USERS, users);
            Swal.fire('Success', 'Officer Added', 'success').then(() => location.reload());
        });
    });
</script>
</body>
</html>
