<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Police Vehicle Management System</title>

    <!-- Kalpurush Font -->
    <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #667eea;
        --secondary: #764ba2;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Kalpurush", "Segoe UI", Tahoma, Geneva, Verdana,
          sans-serif !important;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 480px;
        margin: auto;
      }

      .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        animation: slideUp 0.6s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        padding: 35px 30px;
        text-align: center;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .login-header::before {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        top: -100px;
        right: -100px;
      }

      .login-header::after {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        bottom: -75px;
        left: -75px;
      }

      .login-header .logo {
        position: relative;
        z-index: 1;
      }

      .login-header i {
        font-size: 50px;
        margin-bottom: 12px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .login-header h2 {
        font-weight: 700;
        margin: 8px 0 5px;
        font-size: 24px;
      }

      .login-header p {
        opacity: 0.95;
        font-size: 14px;
      }

      .login-body {
        padding: 30px 35px;
      }

      .form-label {
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .form-label i {
        color: var(--primary);
      }

      .form-control,
      .form-select {
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 13px 18px;
        font-size: 15px;
        transition: all 0.3s;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      .input-group {
        position: relative;
      }

      .input-group-text {
        background: #f7fafc;
        border: 2px solid #e2e8f0;
        border-right: none;
        border-radius: 12px 0 0 12px;
        color: var(--primary);
      }

      .input-group .form-control {
        border-left: none;
        border-radius: 0 12px 12px 0;
      }

      .input-group .form-control:focus {
        border-left: 2px solid var(--primary);
      }

      #togglePassword {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        color: #94a3b8;
        cursor: pointer;
        z-index: 10;
        transition: color 0.3s;
      }

      #togglePassword:hover {
        color: var(--primary);
      }

      .btn-login {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        border: none;
        border-radius: 12px;
        padding: 15px;
        font-size: 17px;
        font-weight: 700;
        color: white;
        width: 100%;
        transition: all 0.3s;
        margin-top: 25px;
        position: relative;
        overflow: hidden;
      }

      .btn-login::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        transition: left 0.5s;
      }

      .btn-login:hover::before {
        left: 100%;
      }

      .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
      }

      .form-check-input {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }

      .form-check-input:checked {
        background-color: var(--primary);
        border-color: var(--primary);
      }

      .form-check-label {
        cursor: pointer;
        user-select: none;
        margin-left: 5px;
      }

      .forgot-password {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s;
      }

      .forgot-password:hover {
        color: var(--secondary);
        text-decoration: underline;
      }

      .alert {
        border-radius: 12px;
        border: none;
        padding: 15px;
        margin-bottom: 20px;
      }

      @media (max-width: 576px) {
        .login-header {
          padding: 40px 20px;
        }

        .login-header h2 {
          font-size: 24px;
        }

        .login-header i {
          font-size: 60px;
        }

        .login-body {
          padding: 30px 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <h2>Police Vehicle Management</h2>
            <p>Secure Access Control System</p>
          </div>
        </div>

        <div class="login-body">
          <div id="alertContainer"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="userRole" class="form-label">
                <i class="fas fa-user-tag me-2"></i>Select Your Role
              </label>
              <select class="form-select" id="userRole" required>
                <option value="">Choose your role...</option>
                <option value="admin">🔐 Administrator</option>
                <option value="officer">👮 Police Officer</option>
                <option value="mechanic">🔧 Maintenance Staff</option>
                <option value="viewer">👁️ Viewer</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="username" class="form-label">
                <i class="fas fa-user me-2"></i>Username / Badge Number
              </label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-id-badge"></i>
                </span>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="Enter username or badge number"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">
                <i class="fas fa-lock me-2"></i>Password
              </label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-key"></i>
                </span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter your password"
                  required
                  style="padding-right: 50px"
                />
                <button type="button" id="togglePassword">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="rememberMe"
                />
                <label class="form-check-label" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a
                href="#"
                class="forgot-password"
                data-bs-toggle="modal"
                data-bs-target="#forgotModal"
              >
                Forgot Password?
              </a>
            </div>

            <button type="submit" class="btn btn-login">
              <i class="fas fa-sign-in-alt me-2"></i>Login to System
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 15px">
          <div
            class="modal-header"
            style="
              background: linear-gradient(
                135deg,
                var(--primary) 0%,
                var(--secondary) 100%
              );
              color: white;
            "
          >
            <h5 class="modal-title">
              <i class="fas fa-key me-2"></i>Password Recovery
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p>
              Please contact your system administrator to reset your password.
            </p>
            <p><strong>Email:</strong> admin@police.gov</p>
            <p><strong>Phone:</strong> +880-XXX-XXXXXX</p>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      $(document).ready(function () {
        // Toggle password visibility
        $("#togglePassword").click(function () {
          const passwordField = $("#password");
          const icon = $(this).find("i");

          if (passwordField.attr("type") === "password") {
            passwordField.attr("type", "text");
            icon.removeClass("fa-eye").addClass("fa-eye-slash");
          } else {
            passwordField.attr("type", "password");
            icon.removeClass("fa-eye-slash").addClass("fa-eye");
          }
        });

        // Demo users database
        const demoUsers = {
          admin: {
            password: "admin123",
            role: "admin",
            name: "Admin User",
            badge: "ADM-001",
            department: "Administration",
          },
          officer: {
            password: "officer123",
            role: "officer",
            name: "John Officer",
            badge: "OFF-1234",
            department: "Traffic Division",
          },
          mechanic: {
            password: "mech123",
            role: "mechanic",
            name: "Mike Mechanic",
            badge: "MEC-567",
            department: "Maintenance",
          },
          viewer: {
            password: "view123",
            role: "viewer",
            name: "Guest Viewer",
            badge: "VIEW-999",
            department: "Guest",
          },
        };

        // Handle login form submission
        $("#loginForm").submit(function (e) {
          e.preventDefault();

          const role = $("#userRole").val();
          const username = $("#username").val().toLowerCase().trim();
          const password = $("#password").val();
          const rememberMe = $("#rememberMe").is(":checked");

          // Show loading state
          const submitBtn = $(".btn-login");
          const originalText = submitBtn.html();
          submitBtn
            .html(
              '<i class="fas fa-spinner fa-spin me-2"></i>Authenticating...'
            )
            .prop("disabled", true);

          // Simulate API call delay
          setTimeout(function () {
            // Validate credentials
            if (
              demoUsers[username] &&
              demoUsers[username].password === password
            ) {
              // Check if role matches
              if (demoUsers[username].role === role) {
                // Store user data
                const userData = {
                  username: username,
                  name: demoUsers[username].name,
                  badge: demoUsers[username].badge,
                  department: demoUsers[username].department,
                  role: role,
                  loggedIn: true,
                  loginTime: new Date().toISOString(),
                };

                localStorage.setItem("userData", JSON.stringify(userData));
                localStorage.setItem("loggedIn", "true");

                if (rememberMe) {
                  localStorage.setItem("rememberMe", "true");
                }

                // Show success message
                showAlert(
                  "success",
                  '<i class="fas fa-check-circle me-2"></i>Login successful! Redirecting to dashboard...'
                );

                // Redirect to dashboard
                setTimeout(function () {
                  window.location.href = "dashboard.html";
                }, 1500);
              } else {
                submitBtn.html(originalText).prop("disabled", false);
                showAlert(
                  "danger",
                  '<i class="fas fa-exclamation-circle me-2"></i>Invalid role selected for this user!'
                );
              }
            } else {
              submitBtn.html(originalText).prop("disabled", false);
              showAlert(
                "danger",
                '<i class="fas fa-times-circle me-2"></i>Invalid username or password!'
              );
            }
          }, 800);
        });

        // Show alert function
        function showAlert(type, message) {
          const alertHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
          $("#alertContainer").html(alertHTML);

          // Auto dismiss after 5 seconds
          setTimeout(function () {
            $(".alert").fadeOut();
          }, 5000);
        }

        // Check if already logged in
        if (localStorage.getItem("loggedIn") === "true") {
          window.location.href = "dashboard.html";
        }

        // Auto-fill username and password when role is selected
        $("#userRole").change(function () {
          const selectedRole = $(this).val();

          if (selectedRole) {
            // Find the corresponding username and password for the role
            let username = "";
            let password = "";

            switch (selectedRole) {
              case "admin":
                username = "admin";
                password = "admin123";
                break;
              case "officer":
                username = "officer";
                password = "officer123";
                break;
              case "mechanic":
                username = "mechanic";
                password = "mech123";
                break;
              case "viewer":
                username = "viewer";
                password = "view123";
                break;
            }

            // Fill the form fields
            $("#username").val(username);
            $("#password").val(password);

            // Add a subtle animation
            $("#username, #password").css("background-color", "#e0f2fe");
            setTimeout(() => {
              $("#username, #password").css("background-color", "");
            }, 600);
          } else {
            // Clear fields if no role selected
            $("#username").val("");
            $("#password").val("");
          }
        });

        // Auto-fill form from URL parameters (for demo)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("demo")) {
          $("#userRole").val("admin");
          $("#username").val("admin");
          $("#password").val("admin123");
        }
      });
    </script>
  </body>
</html>
