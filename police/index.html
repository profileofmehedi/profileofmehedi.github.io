<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - বাংলাদেশ পুলিশ যানবাহন ব্যবস্থাপনা সিস্টেম</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-emoji {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .logo-section h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #1a3a52, #d4385f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .logo-section p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a3a52;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a3a52;
            box-shadow: 0 0 0 4px rgba(26, 58, 82, 0.1);
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .remember-checkbox input {
            width: auto !important;
            margin-right: 8px !important;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a3a52, #d4385f);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 58, 82, 0.3);
        }

        .credentials-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #92400e;
            line-height: 1.7;
        }

        .credentials-box strong {
            display: block;
            margin-bottom: 8px;
            color: #78350f;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-emoji">🚓</div>
            <h1>বাংলাদেশ পুলিশ</h1>
            <p>যানবাহন ব্যবস্থাপনা সিস্টেম</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">ব্যবহারকারীনাম</label>
                <input type="text" id="username" placeholder="admin" value="admin" required>
            </div>

            <div class="form-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="••••••••" value="123456" required>
            </div>

            <div class="remember-checkbox">
                <input type="checkbox" id="remember">
                <label for="remember" style="margin: 0;">আমাকে মনে রাখুন</label>
            </div>

            <button type="submit" class="login-btn">লগইন করুন</button>
        </form>

        <div class="credentials-box">
            <strong>📌 ডেমো শংসাপত্র:</strong>
            ব্যবহারকারীনাম: <strong>admin</strong><br>
            পাসওয়ার্ড: <strong>123456</strong>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'admin' && password === '123456') {
                localStorage.setItem('loggedIn', 'true');
                if (document.getElementById('remember').checked) {
                    localStorage.setItem('rememberMe', 'true');
                }
                window.location.href = 'dashboard.html';
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'ত্রুটি',
                    text: 'ভুল ব্যবহারকারীনাম অথবা পাসওয়ার্ড',
                    confirmButtonColor: '#667eea'
                });
            }
        }

        // চেক লগইন স্টেটাস
        if (localStorage.getItem('loggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
