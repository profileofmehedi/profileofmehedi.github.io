<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Vendor specific theme -->
    <style>
        :root {
            --primary-color: #1a598a;
            --secondary-color: #ffc107;
            --sidebar-width: 280px;
        }

        body {
            background-color: #f4f7fc;
        }

        .wrapper {
            display: flex;
            width: 100%;
        }

        #sidebar {
            background-color: var(--primary-color);
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            min-height: 100vh;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            background: #123f61;
            text-align: center;
        }

        #sidebar .nav-link {
            color: #adb5bd;
            padding: 15px 20px;
            font-size: 1.1em;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        #sidebar .nav-link:hover,
        #sidebar .nav-link.active {
            color: #fff;
            background: #123f61;
            border-left-color: var(--secondary-color);
        }

        #sidebar .nav-link i {
            margin-right: 10px;
        }

        #content {
            width: 100%;
            padding: 0;
            min-height: 100vh;
        }

        .topbar {
            padding: 15px 30px;
            background: #fff;
            box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-content {
            padding: 30px;
        }

        .card-icon {
            font-size: 3rem;
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-shop"></i> Vendor Portal</h3>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="vendor_dashboard.html"><i
                            class="bi bi-house-door-fill"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="create_field_force.html"><i
                            class="bi bi-person-plus-fill"></i> Create Field Force</a></li>
                <li class="nav-item"><a class="nav-link" href="assign_to_field_force.html"><i
                            class="bi bi-person-check-fill"></i> Assign Investigations</a></li>
                <li class="nav-item"><a class="nav-link" href="review_investigations.html"><i
                            class="bi bi-journal-check"></i> Review Submissions</a></li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="topbar">
                <div class="project-logo d-none d-md-block"><img
                        src="https://via.placeholder.com/150x40.png?text=Bank+Logo" alt="Bank Logo" height="30"></div>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://i.pravatar.cc/40?u=vendor" alt="" width="32" height="32"
                            class="rounded-circle me-2"><strong>Vendor User</strong>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end text-small shadow">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="login.html">Sign out</a></li>
                    </ul>
                </div>
            </nav>

            <div class="main-content">
                <h2 class="mb-4">Dashboard</h2>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card text-white bg-info mb-3">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title">New Investigations</h5>
                                    <h3>5</h3>
                                </div>
                                <i class="bi bi-inbox-fill card-icon"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-warning mb-3">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title">Pending Review</h5>
                                    <h3>2</h3>
                                </div>
                                <i class="bi bi-search card-icon"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title">Forwarded to Bank</h5>
                                    <h3>12</h3>
                                </div>
                                <i class="bi bi-send-check-fill card-icon"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
