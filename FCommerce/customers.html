<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | FCommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4 class="m-0 fw-bold text-primary">FCommerce</h4>
                <button type="button" id="sidebarCollapse" class="btn btn-link text-dark p-0"><i class="fas fa-align-left"></i></button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a></li>
                <li><a href="chat.html"><i class="fas fa-comment-alt"></i> <span>Chat</span></a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
                <li><a href="inventory.html"><i class="fas fa-boxes"></i> <span>Inventory</span></a></li>
                <li><a href="ads.html"><i class="fas fa-ad"></i> <span>Ads Manager</span></a></li>
                <li><a href="ai.html"><i class="fas fa-robot"></i> <span>AI Assistant</span></a></li>
                <li><a href="reports.html"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="mt-4"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="#" onclick="StorageManager.logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </nav>
        <div id="content">
            <div class="p-4">
                <h4 class="fw-bold mb-4">Customer Directory</h4>
                <div class="card p-0 overflow-hidden">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light"><tr><th class="ps-4">Name</th><th>Email</th><th>Phone</th><th>Orders</th><th class="pe-4 text-end">Action</th></tr></thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        $(document).ready(function() {
            const customers = StorageManager.getCollection('customers');
            let html = '';
            customers.forEach(c => {
                html += `<tr><td class="ps-4"><div class="d-flex align-items-center"><img src="https://i.pravatar.cc/150?u=${c.id}" class="rounded-circle me-3" width="35" height="35"><div><p class="mb-0 fw-bold">${c.name}</p></div></div></td><td>${c.email}</td><td>${c.phone}</td><td><span class="badge bg-light text-dark border">${c.totalOrders}</span></td><td class="pe-4 text-end"><button class="btn btn-sm btn-light">View Profile</button></td></tr>`;
            });
            $('#customerTableBody').html(html);
        });
    </script>
</body>
</html>
