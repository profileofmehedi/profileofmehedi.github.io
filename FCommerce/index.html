<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FCommerce SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
        }
        .btn-primary {
            background-color: #6366f1;
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
        }
        .demo-btn {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #fff;
            padding: 0.6rem;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #475569;
        }
        .demo-btn:hover {
            background: #f8fafc;
            border-color: #6366f1;
            color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="auth-card animate__animated animate__zoomIn">
        <div class="text-center mb-5">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 60px; height: 60px;">
                <i class="fas fa-shopping-bag fs-3"></i>
            </div>
            <h2 class="fw-bold text-dark">FCommerce</h2>
            <p class="text-muted">High-fidelity Social Commerce Demo</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="far fa-envelope text-muted"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="admin@demo.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" placeholder="••••••••" value="password123">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4">Sign In to Dashboard</button>
        </form>

        <div class="position-relative mb-4">
            <hr>
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">OR QUICK LOGIN</span>
        </div>
        
        <div class="row g-2">
            <div class="col-6">
                <button class="btn demo-btn w-100 d-flex align-items-center justify-content-center demo-login" data-email="admin@demo.com">
                    <img src="https://i.pravatar.cc/150?u=mehedi" class="rounded-circle me-2" width="20"> Admin
                </button>
            </div>
            <div class="col-6">
                <button class="btn demo-btn w-100 d-flex align-items-center justify-content-center demo-login" data-email="seller@demo.com">
                    <img src="https://i.pravatar.cc/150?u=john" class="rounded-circle me-2" width="20"> Seller
                </button>
            </div>
        </div>
        
        <p class="text-center mt-4 small text-muted">Don't have an account? <a href="#" class="text-primary fw-bold text-decoration-none">Contact Sales</a></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        $(document).ready(function() {
            // Explicitly handle redirects for session
            if (StorageManager.getSession()) {
                window.location.href = 'app.html';
            }

            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                const email = $('#email').val();
                if (StorageManager.login(email)) {
                    window.location.href = 'app.html';
                } else {
                    UI.showToast('Login Failed', 'User not found in demo database.', 'danger');
                }
            });

            $('.demo-login').on('click', function() {
                const email = $(this).data('email');
                StorageManager.login(email);
                window.location.href = 'app.html';
            });
        });
    </script>
</body>
</html>
