<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | FCommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4 class="m-0 fw-bold text-primary">FCommerce</h4>
                <button type="button" id="sidebarCollapse" class="btn btn-link text-dark p-0"><i class="fas fa-align-left"></i></button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a></li>
                <li><a href="chat.html"><i class="fas fa-comment-alt"></i> <span>Chat</span></a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
                <li><a href="inventory.html"><i class="fas fa-boxes"></i> <span>Inventory</span></a></li>
                <li><a href="ads.html"><i class="fas fa-ad"></i> <span>Ads Manager</span></a></li>
                <li><a href="ai.html"><i class="fas fa-robot"></i> <span>AI Assistant</span></a></li>
                <li><a href="reports.html"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="mt-4"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="#" onclick="StorageManager.logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </nav>
        <div id="content">
            <div class="p-4">
                <div class="d-flex justify-content-between mb-4"><h4 class="fw-bold">Business Reports</h4><button class="btn btn-outline-primary"><i class="fas fa-download me-2"></i> Export PDF</button></div>
                <div class="row g-4"><div class="col-md-12"><div class="card p-4"><h6>Sales Trend</h6><canvas id="reportChart" height="400"></canvas></div></div></div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        $(document).ready(function() {
            const ctx = document.getElementById('reportChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'], datasets: [{ label: 'Monthly Sales', data: [5000, 7000, 4500, 9000, 12000, 11000], backgroundColor: '#6366f1' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        });
    </script>
</body>
</html>
