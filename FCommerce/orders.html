<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | FCommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4 class="m-0 fw-bold text-primary"><i class="fas fa-shopping-bag me-2"></i>FCommerce</h4>
                <button type="button" id="sidebarCollapse" class="btn btn-link text-dark p-0"><i class="fas fa-align-left"></i></button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a></li>
                <li><a href="chat.html"><i class="fas fa-comment-alt"></i> <span>Chat</span></a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
                <li><a href="inventory.html"><i class="fas fa-boxes"></i> <span>Inventory</span></a></li>
                <li><a href="ads.html"><i class="fas fa-ad"></i> <span>Ads Manager</span></a></li>
                <li><a href="ai.html"><i class="fas fa-robot"></i> <span>AI Assistant</span></a></li>
                <li><a href="reports.html"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="mt-4"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="#" onclick="StorageManager.logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </nav>

        <div id="content">
            <div class="topbar">
                <div class="ms-auto d-flex align-items-center">
                    <div class="text-end me-2"><p class="mb-0 small fw-bold user-name"></p></div>
                    <img src="" class="rounded-circle user-avatar" width="40" height="40">
                </div>
            </div>

            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold m-0">Order Management</h4>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createOrderModal"><i class="fas fa-plus me-1"></i> Create Order</button>
                </div>

                <div class="card p-0 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr><th class="ps-4">Order ID</th><th>Customer</th><th>Product</th><th>Total</th><th>Status</th><th>Date</th><th class="pe-4 text-end">Actions</th></tr>
                            </thead>
                            <tbody id="ordersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createOrderModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title fw-bold">Create New Order</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
            <form id="orderForm">
                <div class="mb-3"><label class="form-label">Customer Name</label><input type="text" class="form-control" required id="custName"></div>
                <div class="mb-3"><label class="form-label">Product</label><input type="text" class="form-control" required id="prodInput"></div>
                <div class="mb-3"><label class="form-label">Amount ($)</label><input type="number" class="form-control" required id="orderAmount"></div>
                <button type="submit" class="btn btn-primary w-100">Save Order</button>
            </form>
        </div></div></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        $(document).ready(function() {
            function renderOrders() {
                const orders = StorageManager.getCollection('orders');
                let html = '';
                orders.forEach(o => {
                    html += `<tr><td class="ps-4 fw-bold">${o.id}</td><td>Customer ${o.customerId}</td><td>${o.product}</td><td>$${o.amount.toFixed(2)}</td><td><span class="badge ${o.status === 'Delivered' ? 'bg-success' : 'bg-warning'}">${o.status}</span></td><td>${o.date}</td><td class="pe-4 text-end"><button class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></button></td></tr>`;
                });
                $('#ordersTableBody').html(html);
            }
            renderOrders();
            $('#orderForm').on('submit', function(e) {
                e.preventDefault();
                const newOrder = { id: 'ORD-' + Math.floor(Math.random() * 1000), customerId: 1, product: $('#prodInput').val(), amount: parseFloat($('#orderAmount').val()), status: 'Pending', date: new Date().toISOString().split('T')[0] };
                StorageManager.addToCollection('orders', newOrder);
                $('#createOrderModal').modal('hide');
                UI.showToast('Success', 'Order created successfully!', 'success');
                renderOrders();
            });
        });
    </script>
</body>
</html>
