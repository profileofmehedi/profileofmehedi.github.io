<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | FCommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h4 class="m-0 fw-bold text-primary">FCommerce</h4>
                <button type="button" id="sidebarCollapse" class="btn btn-link text-dark p-0"><i class="fas fa-align-left"></i></button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a></li>
                <li><a href="chat.html"><i class="fas fa-comment-alt"></i> <span>Chat</span></a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
                <li><a href="inventory.html"><i class="fas fa-boxes"></i> <span>Inventory</span></a></li>
                <li><a href="ads.html"><i class="fas fa-ad"></i> <span>Ads Manager</span></a></li>
                <li><a href="ai.html"><i class="fas fa-robot"></i> <span>AI Assistant</span></a></li>
                <li><a href="reports.html"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="mt-4"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="#" onclick="StorageManager.logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </nav>
        <div id="content">
            <div class="p-4">
                <div class="d-flex justify-content-between align-items-center mb-4"><h4 class="fw-bold m-0">Inventory Control</h4><button class="btn btn-primary"><i class="fas fa-plus me-1"></i> Add Product</button></div>
                <div class="row g-4" id="productList"></div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        $(document).ready(function() {
            const products = StorageManager.getCollection('products');
            let html = '';
            products.forEach(p => {
                const stockColor = p.stock < 10 ? 'text-danger' : 'text-success';
                html += `<div class="col-md-4 col-lg-3"><div class="card h-100 overflow-hidden"><img src="${p.image}" class="card-img-top" height="150" style="object-fit: cover"><div class="card-body p-3"><span class="badge bg-light text-dark mb-2">${p.category}</span><h6 class="fw-bold mb-1">${p.name}</h6><p class="text-primary fw-bold mb-2">$${p.price.toFixed(2)}</p><div class="d-flex justify-content-between align-items-center"><span class="${stockColor} fw-bold" style="font-size: 0.8rem;">Stock: ${p.stock}</span><button class="btn btn-sm btn-outline-secondary">Edit</button></div></div></div></div>`;
            });
            $('#productList').html(html);
        });
    </script>
</body>
</html>
