<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>লগইন - ডায়াগনস্টিক সেন্টার ম্যানেজমেন্ট</title>
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Kalpurush Font from Mateen CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/kalpurush@4.5.0/index.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- SweetAlert2 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.min.css"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        height: 100%;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        font-family: "Kalpurush", "SolaimanLipi", "Noto Sans Bengali",
          sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        position: relative;
      }

      /* Subtle floating animation */
      .background-decoration {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }

      .floating-element {
        position: absolute;
        background: rgba(108, 117, 125, 0.05);
        border-radius: 50%;
        animation: gentleFloat 8s ease-in-out infinite;
      }

      .floating-element:nth-child(1) {
        width: 60px;
        height: 60px;
        top: 10%;
        left: 10%;
        animation-delay: 0s;
      }

      .floating-element:nth-child(2) {
        width: 40px;
        height: 40px;
        top: 70%;
        right: 15%;
        animation-delay: 2s;
      }

      .floating-element:nth-child(3) {
        width: 80px;
        height: 80px;
        bottom: 20%;
        left: 5%;
        animation-delay: 4s;
      }

      @keyframes gentleFloat {
        0%,
        100% {
          transform: translateY(0px) translateX(0px);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-15px) translateX(10px);
          opacity: 0.6;
        }
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 40px 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        position: relative;
        z-index: 10;
        animation: slideInUp 0.6s ease;
        border: 1px solid #dee2e6;
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .login-header .logo {
        width: 60px;
        height: 60px;
        background: #007bff;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 1.5rem;
        color: white;
        transition: transform 0.3s ease;
      }

      .login-header .logo:hover {
        transform: scale(1.05);
      }

      .login-card h3 {
        color: #343a40;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 1.5rem;
      }

      .login-card p {
        color: #6c757d;
        margin-bottom: 25px;
        font-size: 0.9rem;
      }

      .form-group {
        margin-bottom: 20px;
        position: relative;
      }

      .form-label {
        font-weight: 500;
        color: #495057;
        margin-bottom: 8px;
        display: block;
      }

      .form-control {
        height: 50px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 1rem;
        padding: 12px 45px 12px 15px;
        transition: all 0.3s ease;
        background: #fff;
        width: 100%;
      }

      .form-control:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        outline: none;
      }

      .input-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #6c757d;
        font-size: 1.1rem;
        pointer-events: none;
      }

      .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
        font-size: 1.1rem;
        transition: color 0.3s ease;
      }

      .password-toggle:hover {
        color: #007bff;
      }

      .btn-login {
        background: #007bff;
        border: none;
        color: white;
        font-weight: 500;
        height: 50px;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        width: 100%;
      }

      .btn-login:hover {
        background: #0056b3;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .form-check-input:checked {
        background-color: #007bff;
        border-color: #007bff;
      }

      .form-check {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .form-check-label {
        font-size: 0.9rem;
        color: #495057;
      }

      .forgot-password {
        color: #007bff;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s ease;
      }

      .forgot-password:hover {
        color: #0056b3;
        text-decoration: underline;
      }

      .loading-spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid transparent;
        border-top: 2px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .login-container {
          padding: 15px;
        }

        .login-card {
          padding: 30px 25px;
          margin: 10px;
        }

        .login-card h3 {
          font-size: 1.3rem;
        }

        .form-control {
          height: 48px;
          font-size: 16px; /* Prevents zoom on iOS */
        }

        .btn-login {
          height: 48px;
        }

        .form-options {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 25px 20px;
        }

        .login-header .logo {
          width: 50px;
          height: 50px;
          font-size: 1.3rem;
        }

        .form-control {
          padding: 12px 40px 12px 12px;
        }
      }

      /* Animation for form validation */
      .shake {
        animation: shake 0.5s ease-in-out;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      /* Loading state */
      .btn-login.loading {
        pointer-events: none;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <!-- Subtle Background Animation -->
    <div class="background-decoration">
      <div class="floating-element"></div>
      <div class="floating-element"></div>
      <div class="floating-element"></div>
    </div>

    <div class="container-fluid login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="bi bi-hospital"></i>
          </div>
          <h3>লগইন করুন</h3>
          <p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username" class="form-label">ইউজারনেম</label>
            <div style="position: relative">
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="আপনার ইউজারনেম লিখুন"
                autocomplete="username"
                value="admin"
                required
              />
              <i class="bi bi-person input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">পাসওয়ার্ড</label>
            <div style="position: relative">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="আপনার পাসওয়ার্ড লিখুন"
                autocomplete="current-password"
                value="admin"
                required
              />
              <i class="bi bi-eye password-toggle" id="passwordToggle"></i>
            </div>
          </div>

          <div class="form-options">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">
                আমাকে মনে রাখুন
              </label>
            </div>
            <a href="#" class="forgot-password" id="forgotPasswordLink">
              পাসওয়ার্ড ভুলে গেছেন?
            </a>
          </div>

          <button type="submit" class="btn btn-login">
            <div class="loading-spinner"></div>
            <span class="login-text">লগইন করুন</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Bootstrap & jQuery JS CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.all.min.js"></script>

    <script>
      // User credentials database
      const users = {
        admin: {
          password: "admin",
          role: "অ্যাডমিন",
          name: "সিস্টেম অ্যাডমিনিস্ট্রেটর",
          permissions: ["all"],
        },
        doctor: {
          password: "doctor123",
          role: "ডাক্তার",
          name: "ডঃ মোহাম্মদ রহমান",
          permissions: ["view_reports", "view_patients", "view_tests"],
        },
        tech: {
          password: "tech123",
          role: "টেকনিশিয়ান",
          name: "মোহাম্মদ করিম",
          permissions: ["enter_results", "view_tests", "generate_reports"],
        },
        reception: {
          password: "reception123",
          role: "রিসেপশনিস্ট",
          name: "ফাতেমা আক্তার",
          permissions: ["add_patients", "manage_appointments", "billing"],
        },
      };

      $(document).ready(function () {
        // Check if user is already logged in
        checkExistingLogin();

        // Auto-fill remembered credentials
        loadRememberedCredentials();

        // Password toggle functionality
        $("#passwordToggle").on("click", function () {
          togglePassword();
        });

        // Form submission
        $("#loginForm").on("submit", function (e) {
          e.preventDefault();
          performLogin();
        });

        // Forgot password functionality
        $("#forgotPasswordLink").on("click", function (e) {
          e.preventDefault();
          showForgotPasswordDialog();
        });

        // Input animations
        $(".form-control").on("focus", function () {
          $(this).parent().addClass("focused");
        });

        $(".form-control").on("blur", function () {
          if (!$(this).val()) {
            $(this).parent().removeClass("focused");
          }
        });
      });

      function checkExistingLogin() {
        const savedSession = localStorage.getItem("userSession");
        if (savedSession) {
          try {
            const session = JSON.parse(savedSession);
            if (session.expiry > Date.now()) {
              Swal.fire({
                title: "স্বাগতম!",
                text: `আপনি ইতিমধ্যে লগ ইন করা আছেন। ${session.name} হিসেবে ড্যাশবোর্ডে যাচ্ছেন...`,
                icon: "success",
                timer: 2000,
                showConfirmButton: false,
              }).then(() => {
                window.location.href = "dashboard.html";
              });
              return;
            } else {
              localStorage.removeItem("userSession");
            }
          } catch (error) {
            localStorage.removeItem("userSession");
          }
        }
      }

      function loadRememberedCredentials() {
        const rememberedUser = localStorage.getItem("rememberedUser");
        if (rememberedUser) {
          $("#username").val(rememberedUser);
          $("#rememberMe").prop("checked", true);
        }
      }

      function togglePassword() {
        const passwordField = $("#password");
        const toggleIcon = $("#passwordToggle");

        if (passwordField.attr("type") === "password") {
          passwordField.attr("type", "text");
          toggleIcon.removeClass("bi-eye").addClass("bi-eye-slash");
        } else {
          passwordField.attr("type", "password");
          toggleIcon.removeClass("bi-eye-slash").addClass("bi-eye");
        }
      }

      function performLogin() {
        const username = $("#username").val().trim();
        const password = $("#password").val();
        const rememberMe = $("#rememberMe").is(":checked");

        // Show loading state
        showLoadingState(true);

        // Simulate network delay for realistic feel
        setTimeout(() => {
          if (validateCredentials(username, password)) {
            const user = users[username];

            // Handle remember me
            if (rememberMe) {
              localStorage.setItem("rememberedUser", username);
            } else {
              localStorage.removeItem("rememberedUser");
            }

            // Create user session
            const sessionData = {
              username: username,
              name: user.name,
              role: user.role,
              permissions: user.permissions,
              loginTime: new Date().toISOString(),
              expiry: Date.now() + 24 * 60 * 60 * 1000, // 24 hours
            };
            localStorage.setItem("userSession", JSON.stringify(sessionData));

            // Log login activity
            logLoginActivity(username, user.role, true);

            // Success notification
            Swal.fire({
              title: "সফল লগইন!",
              text: `স্বাগতম, ${user.name}! ড্যাশবোর্ডে যাচ্ছেন...`,
              icon: "success",
              timer: 2000,
              showConfirmButton: false,
            }).then(() => {
              window.location.href = "dashboard.html";
            });
          } else {
            // Log failed login attempt
            logLoginActivity(username, "Unknown", false);

            // Error notification
            Swal.fire({
              title: "লগইন ব্যর্থ!",
              text: "ভুল ইউজারনেম অথবা পাসওয়ার্ড। অনুগ্রহ করে আবার চেষ্টা করুন।",
              icon: "error",
              confirmButtonText: "পুনরায় চেষ্টা করুন",
              allowOutsideClick: false,
            });

            // Shake animation for error
            $(".login-card").addClass("shake");
            setTimeout(() => {
              $(".login-card").removeClass("shake");
            }, 500);
          }

          showLoadingState(false);
        }, 1200);
      }

      function validateCredentials(username, password) {
        return users[username] && users[username].password === password;
      }

      function showLoadingState(loading) {
        const btn = $(".btn-login");
        const spinner = $(".loading-spinner");
        const text = $(".login-text");

        if (loading) {
          spinner.show();
          text.text("লগইন হচ্ছে...");
          btn.addClass("loading").prop("disabled", true);
        } else {
          spinner.hide();
          text.text("লগইন করুন");
          btn.removeClass("loading").prop("disabled", false);
        }
      }

      function showForgotPasswordDialog() {
        Swal.fire({
          title: "পাসওয়ার্ড রিসেট",
          html: `
            <div class="text-start">
              <p class="mb-3">পাসওয়ার্ড রিসেট করতে আপনার ইউজারনেম বা ইমেইল ঠিকানা দিন:</p>
              <input type="text" id="resetUsername" class="form-control" placeholder="ইউজারনেম বা ইমেইল" style="margin-bottom: 15px;">
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: "রিসেট লিঙ্ক পাঠান",
          cancelButtonText: "বাতিল",
          confirmButtonColor: "#007bff",
          preConfirm: () => {
            const resetUsername =
              document.getElementById("resetUsername").value;
            if (!resetUsername) {
              Swal.showValidationMessage("ইউজারনেম বা ইমেইল দিন");
              return false;
            }
            return resetUsername;
          },
        }).then((result) => {
          if (result.isConfirmed) {
            // Simulate password reset
            Swal.fire({
              title: "রিসেট লিঙ্ক পাঠানো হয়েছে!",
              html: `
                <p>আপনার ইমেইল ঠিকানায় পাসওয়ার্ড রিসেট লিঙ্ক পাঠানো হয়েছে।</p>
                <p><strong>নির্দেশনা:</strong></p>
                <ol class="text-start">
                  <li>আপনার ইমেইল ইনবক্স চেক করুন</li>
                  <li>স্প্যাম ফোল্ডারও দেখুন</li>
                  <li>রিসেট লিঙ্কে ক্লিক করুন</li>
                  <li>নতুন পাসওয়ার্ড সেট করুন</li>
                </ol>
              `,
              icon: "success",
              confirmButtonText: "ঠিক আছে",
              confirmButtonColor: "#007bff",
            });
          }
        });
      }

      function logLoginActivity(username, role, success) {
        try {
          let loginLogs = JSON.parse(localStorage.getItem("loginLogs")) || [];

          const logEntry = {
            id: "LOG-" + Date.now(),
            username: username,
            role: role,
            success: success,
            timestamp: new Date().toISOString(),
            ip: "192.168.1.100", // Simulated IP
            userAgent: navigator.userAgent.substring(0, 50) + "...",
          };

          loginLogs.unshift(logEntry);

          // Keep only last 100 logs
          if (loginLogs.length > 100) {
            loginLogs = loginLogs.slice(0, 100);
          }

          localStorage.setItem("loginLogs", JSON.stringify(loginLogs));
        } catch (error) {
          console.error("Error logging login activity:", error);
        }
      }
    </script>
  </body>
</html>
