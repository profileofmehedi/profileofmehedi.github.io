<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>লগইন - ডায়াগনস্টিক সেন্টার ম্যানেজমেন্ট</title>
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Kalpurush Font from Mateen CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/kalpurush@4.5.0/index.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- SweetAlert2 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.min.css"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: "Kalpurush", "SolaimanLipi", "Noto Sans Bengali",
          sans-serif;
        overflow: hidden;
      }

      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        position: relative;
      }

      .background-animation {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }

      .floating-shapes {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.1);
        animation: float 6s ease-in-out infinite;
      }

      .floating-shapes:nth-child(1) {
        top: 20%;
        left: 20%;
        animation-delay: 0s;
      }

      .floating-shapes:nth-child(2) {
        top: 60%;
        left: 80%;
        animation-delay: 1s;
      }

      .floating-shapes:nth-child(3) {
        top: 40%;
        left: 40%;
        animation-delay: 2s;
      }

      .floating-shapes:nth-child(4) {
        top: 80%;
        left: 10%;
        animation-delay: 3s;
      }

      .floating-shapes:nth-child(5) {
        top: 10%;
        left: 90%;
        animation-delay: 4s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
          opacity: 0.7;
        }
      }

      .login-card {
        width: 100%;
        max-width: 450px;
        padding: 50px 40px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        position: relative;
        z-index: 10;
        animation: slideInUp 0.8s ease;
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .login-card::before {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #667eea, #764ba2, #667eea);
        z-index: -1;
        border-radius: 22px;
        opacity: 0.5;
      }

      .login-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .login-header .logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 2rem;
        color: white;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      }

      .login-card h3 {
        color: #2c3e50;
        margin-bottom: 10px;
        font-weight: 700;
        font-size: 1.8rem;
      }

      .login-card p {
        color: #7f8c8d;
        margin-bottom: 30px;
        font-size: 1rem;
      }

      .form-floating {
        position: relative;
        margin-bottom: 25px;
      }

      .form-floating .form-control {
        height: 60px;
        border: 2px solid #e9ecef;
        border-radius: 15px;
        font-size: 1rem;
        padding-left: 50px;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
      }

      .form-floating .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        background: rgba(255, 255, 255, 1);
      }

      .form-floating label {
        padding-left: 50px;
        color: #7f8c8d;
        font-weight: 500;
      }

      .input-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #7f8c8d;
        font-size: 1.2rem;
        z-index: 4;
      }

      .password-toggle {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #7f8c8d;
        font-size: 1.2rem;
        z-index: 4;
      }

      .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        font-weight: 600;
        height: 60px;
        border-radius: 15px;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn-login::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }

      .btn-login:hover::before {
        left: 100%;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
      }

      .remember-me {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .form-check-input:checked {
        background-color: #667eea;
        border-color: #667eea;
      }

      .forgot-password {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .forgot-password:hover {
        color: #764ba2;
      }

      .demo-credentials {
        background: rgba(102, 126, 234, 0.1);
        padding: 20px;
        border-radius: 15px;
        margin-top: 30px;
        border-left: 4px solid #667eea;
      }

      .demo-credentials h6 {
        color: #667eea;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .demo-credentials p {
        margin: 5px 0;
        font-size: 0.9rem;
        color: #5a6c7d;
      }

      .loading {
        display: none;
      }

      @media (max-width: 768px) {
        .login-card {
          margin: 20px;
          padding: 40px 30px;
          max-width: 100%;
        }

        .login-card h3 {
          font-size: 1.5rem;
        }

        .form-floating .form-control {
          height: 55px;
          font-size: 16px; /* Prevents zoom on iOS */
        }

        .btn-login {
          height: 55px;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Animation -->
    <div class="background-animation">
      <div class="floating-shapes"></div>
      <div class="floating-shapes"></div>
      <div class="floating-shapes"></div>
      <div class="floating-shapes"></div>
      <div class="floating-shapes"></div>
    </div>

    <div class="container login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="bi bi-hospital"></i>
          </div>
          <h3>সিস্টেমে লগইন করুন</h3>
          <p>নিরাপদ এবং সুরক্ষিত প্রবেশাধিকার</p>
        </div>

        <form id="loginForm">
          <div class="form-floating">
            <i class="bi bi-person-fill input-icon"></i>
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="ইউজারনেম"
              autocomplete="username"
              required
            />
            <label for="username">ইউজারনেম</label>
          </div>

          <div class="form-floating">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="পাসওয়ার্ড"
              autocomplete="current-password"
              required
            />
            <label for="password">পাসওয়ার্ড</label>
            <i class="bi bi-eye password-toggle" id="passwordToggle"></i>
          </div>

          <div class="remember-me">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">
                আমাকে মনে রাখুন
              </label>
            </div>
            <a href="#" class="forgot-password" id="forgotPasswordLink"
              >পাসওয়ার্ড ভুলে গেছেন?</a
            >
          </div>

          <button type="submit" class="btn btn-login w-100">
            <span class="login-text">লগইন করুন</span>
            <span class="loading">
              <i class="bi bi-arrow-clockwise"></i> লগইন হচ্ছে...
            </span>
          </button>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-credentials">
          <h6><i class="bi bi-info-circle"></i> ডেমো অ্যাকাউন্ট</h6>
          <p><strong>অ্যাডমিন:</strong> admin / admin123</p>
          <p><strong>ডাক্তার:</strong> doctor / doctor123</p>
          <p><strong>টেকনিশিয়ান:</strong> tech / tech123</p>
          <p><strong>রিসেপশনিস্ট:</strong> reception / reception123</p>
        </div>
      </div>
    </div>

    <!-- Bootstrap & jQuery JS CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.all.min.js"></script>

    <script>
      // User credentials database
      const users = {
        admin: {
          password: "admin123",
          role: "অ্যাডমিন",
          name: "সিস্টেম অ্যাডমিনিস্ট্রেটর",
          permissions: ["all"],
        },
        doctor: {
          password: "doctor123",
          role: "ডাক্তার",
          name: "ডঃ মোহাম্মদ রহমান",
          permissions: ["view_reports", "view_patients", "view_tests"],
        },
        tech: {
          password: "tech123",
          role: "টেকনিশিয়ান",
          name: "মোহাম্মদ করিম",
          permissions: ["enter_results", "view_tests", "generate_reports"],
        },
        reception: {
          password: "reception123",
          role: "রিসেপশনিস্ট",
          name: "ফাতেমা আক্তার",
          permissions: ["add_patients", "manage_appointments", "billing"],
        },
      };

      $(document).ready(function () {
        // Check if user is already logged in
        checkExistingLogin();

        // Auto-fill remembered credentials
        loadRememberedCredentials();

        // Password toggle functionality
        $("#passwordToggle").on("click", function () {
          togglePassword();
        });

        // Form submission
        $("#loginForm").on("submit", function (e) {
          e.preventDefault();
          performLogin();
        });

        // Forgot password functionality
        $("#forgotPasswordLink").on("click", function (e) {
          e.preventDefault();
          showForgotPasswordDialog();
        });

        // Demo credential clicks
        $(".demo-credentials p").on("click", function () {
          const text = $(this).text();
          const parts = text.split(" / ");
          if (parts.length === 2) {
            const username = parts[0].split(": ")[1];
            const password = parts[1];
            $("#username").val(username);
            $("#password").val(password);

            Swal.fire({
              title: "ডেমো অ্যাকাউন্ট নির্বাচিত!",
              text: "এখন লগইন বাটনে ক্লিক করুন।",
              icon: "info",
              confirmButtonText: "ঠিক আছে",
              timer: 2000,
            });
          }
        });

        // Enhanced animations
        setTimeout(() => {
          $(".login-card").addClass("show");
        }, 300);
      });

      function checkExistingLogin() {
        const savedSession = localStorage.getItem("userSession");
        if (savedSession) {
          try {
            const session = JSON.parse(savedSession);
            if (session.expiry > Date.now()) {
              Swal.fire({
                title: "স্বাগতম!",
                text: `আপনি ইতিমধ্যে লগ ইন করা আছেন। ${session.name} হিসেবে ড্যাশবোর্ডে যাচ্ছেন...`,
                icon: "success",
                timer: 2000,
                showConfirmButton: false,
              }).then(() => {
                window.location.href = "dashboard.html";
              });
              return;
            } else {
              localStorage.removeItem("userSession");
            }
          } catch (error) {
            localStorage.removeItem("userSession");
          }
        }
      }

      function loadRememberedCredentials() {
        const rememberedUser = localStorage.getItem("rememberedUser");
        if (rememberedUser) {
          $("#username").val(rememberedUser);
          $("#rememberMe").prop("checked", true);
        }
      }

      function togglePassword() {
        const passwordField = $("#password");
        const toggleIcon = $("#passwordToggle");

        if (passwordField.attr("type") === "password") {
          passwordField.attr("type", "text");
          toggleIcon.removeClass("bi-eye").addClass("bi-eye-slash");
        } else {
          passwordField.attr("type", "password");
          toggleIcon.removeClass("bi-eye-slash").addClass("bi-eye");
        }
      }

      function performLogin() {
        const username = $("#username").val().trim();
        const password = $("#password").val();
        const rememberMe = $("#rememberMe").is(":checked");

        // Show loading state
        showLoadingState(true);

        // Simulate network delay for realistic feel
        setTimeout(() => {
          if (validateCredentials(username, password)) {
            const user = users[username];

            // Handle remember me
            if (rememberMe) {
              localStorage.setItem("rememberedUser", username);
            } else {
              localStorage.removeItem("rememberedUser");
            }

            // Create user session
            const sessionData = {
              username: username,
              name: user.name,
              role: user.role,
              permissions: user.permissions,
              loginTime: new Date().toISOString(),
              expiry: Date.now() + 24 * 60 * 60 * 1000, // 24 hours
            };
            localStorage.setItem("userSession", JSON.stringify(sessionData));

            // Log login activity
            logLoginActivity(username, user.role, true);

            // Success notification
            Swal.fire({
              title: "সফল লগইন!",
              text: `স্বাগতম, ${user.name}! ড্যাশবোর্ডে যাচ্ছেন...`,
              icon: "success",
              timer: 2000,
              showConfirmButton: false,
            }).then(() => {
              window.location.href = "dashboard.html";
            });
          } else {
            // Log failed login attempt
            logLoginActivity(username, "Unknown", false);

            // Error notification
            Swal.fire({
              title: "লগইন ব্যর্থ!",
              text: "ভুল ইউজারনেম অথবা পাসওয়ার্ড। অনুগ্রহ করে আবার চেষ্টা করুন।",
              icon: "error",
              confirmButtonText: "পুনরায় চেষ্টা করুন",
              allowOutsideClick: false,
            });

            // Shake animation for error
            $(".login-card").addClass("shake");
            setTimeout(() => {
              $(".login-card").removeClass("shake");
            }, 500);
          }

          showLoadingState(false);
        }, 1500);
      }

      function validateCredentials(username, password) {
        return users[username] && users[username].password === password;
      }

      function showLoadingState(loading) {
        if (loading) {
          $(".login-text").hide();
          $(".loading").show();
          $("#loginForm button").prop("disabled", true);
        } else {
          $(".login-text").show();
          $(".loading").hide();
          $("#loginForm button").prop("disabled", false);
        }
      }

      function showForgotPasswordDialog() {
        Swal.fire({
          title: "পাসওয়ার্ড রিসেট",
          html: `
            <div class="text-start">
              <p>পাসওয়ার্ড রিসেট করতে আপনার ইউজারনেম বা ইমেইল ঠিকানা দিন:</p>
              <input type="text" id="resetUsername" class="form-control" placeholder="ইউজারনেম বা ইমেইল">
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: "রিসেট লিঙ্ক পাঠান",
          cancelButtonText: "বাতিল",
          preConfirm: () => {
            const resetUsername =
              document.getElementById("resetUsername").value;
            if (!resetUsername) {
              Swal.showValidationMessage("ইউজারনেম বা ইমেইল দিন");
              return false;
            }
            return resetUsername;
          },
        }).then((result) => {
          if (result.isConfirmed) {
            // Simulate password reset
            Swal.fire({
              title: "রিসেট লিঙ্ক পাঠানো হয়েছে!",
              text: "আপনার ইমেইল চেক করুন এবং নির্দেশনা অনুসরণ করুন।",
              icon: "success",
              confirmButtonText: "ঠিক আছে",
            });
          }
        });
      }

      function logLoginActivity(username, role, success) {
        try {
          let loginLogs = JSON.parse(localStorage.getItem("loginLogs")) || [];

          const logEntry = {
            id: "LOG-" + Date.now(),
            username: username,
            role: role,
            success: success,
            timestamp: new Date().toISOString(),
            ip: "192.168.1.100", // Simulated IP
            userAgent: navigator.userAgent.substring(0, 50) + "...",
          };

          loginLogs.unshift(logEntry);

          // Keep only last 100 logs
          if (loginLogs.length > 100) {
            loginLogs = loginLogs.slice(0, 100);
          }

          localStorage.setItem("loginLogs", JSON.stringify(loginLogs));
        } catch (error) {
          console.error("Error logging login activity:", error);
        }
      }

      // Add shake animation CSS
      const shakeCSS = `
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
          20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        
        .shake {
          animation: shake 0.5s ease-in-out;
        }
      `;

      $("<style>").prop("type", "text/css").html(shakeCSS).appendTo("head");
    </script>
  </body>
</html>
