<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল | DNCC Trade License</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-city me-2"></i> ডিএনসিসি</h5>
            </div>
            <ul class="list-unstyled components">
                <li><a href="user_dashboard.html"><i class="fa-solid fa-gauge me-2"></i> ড্যাশবোর্ড</a></li>
                <li><a href="renew_license.html"><i class="fa-solid fa-file-signature me-2"></i> লাইসেন্স নবায়ন</a></li>
                <li><a href="status_check.html"><i class="fa-solid fa-magnifying-glass me-2"></i> স্ট্যাটাস চেক</a></li>
                <li class="active"><a href="profile.html"><i class="fa-solid fa-user me-2"></i> প্রোফাইল</a></li>
            </ul>
        </nav>

        <div id="content">
            <!-- Topbar -->
            <nav class="navbar navbar-expand-lg navbar-light topbar">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-outline-success"><i class="fas fa-align-left"></i></button>
                    <div class="ms-auto">
                        <span class="me-3 text-muted d-none d-md-inline"><i class="fa-solid fa-user-circle me-1"></i> <span id="userNameTopbar">মোঃ ইউজার</span></span>
                        <a href="index.html" class="btn btn-sm btn-secondary-custom">লগআউট</a>
                    </div>
                </div>
            </nav>

            <div class="main-body">
                <div class="container-fluid px-4">
                    <h3 class="mb-4">আমার প্রোফাইল</h3>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="card card-custom text-center p-4">
                                <i class="fa-solid fa-user-circle fa-6x text-success mb-3"></i>
                                <h4 id="profNameTitle">মোঃ ইউজার</h4>
                                <p class="text-muted">সাধারণ ব্যবহারকারী</p>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="card card-custom p-4">
                                <h5 class="border-bottom pb-2 mb-3">ব্যক্তিগত তথ্য</h5>
                                <form id="profileUpdateForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">পূর্ণ নাম</label>
                                            <input type="text" id="profName" class="form-control" value="মোঃ ইউজার">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">ইমেইল</label>
                                            <input type="email" id="profEmail" class="form-control" value="user@example.com" readonly>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">মোবাইল</label>
                                            <input type="text" id="profPhone" class="form-control" value="01712345678">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">NID নম্বর</label>
                                            <input type="text" id="profNid" class="form-control" value="1234567890">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary-custom mt-3">তথ্য আপডেট করুন</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-auto">
                <div class="container-fluid">
                    <p class="mb-0 small">&copy; ২০২৬ ঢাকা উত্তর সিটি কর্পোরেশন। সর্বস্বত্ব সংরক্ষিত।</p>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function () {
                $('#sidebar').toggleClass('active');
                $('#content').toggleClass('active');
            });

            // Load profile data
            const user = JSON.parse(localStorage.getItem('dncc_logged_in'));
            if(user) {
                $('#profNameTitle').text(user.name);
                $('#userNameTopbar').text(user.name);
                $('#profName').val(user.name);
                $('#profEmail').val(user.email);
                $('#profPhone').val(user.phone || '');
                $('#profNid').val(user.nid || '');
            }

            $('#profileUpdateForm').on('submit', function(e) {
                e.preventDefault();
                Swal.fire({
                    icon: 'success',
                    title: 'সফল!',
                    text: 'আপনার প্রোফাইল তথ্য আপডেট করা হয়েছে।',
                    confirmButtonColor: '#006a4e'
                });
            });
        });
    </script>
</body>
</html>
