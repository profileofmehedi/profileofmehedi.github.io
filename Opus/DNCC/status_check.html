<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্ট্যাটাস চেক | DNCC Trade License</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-city me-2"></i> ডিএনসিসি</h5>
            </div>
            <ul class="list-unstyled components">
                <li><a href="user_dashboard.html"><i class="fa-solid fa-gauge me-2"></i> ড্যাশবোর্ড</a></li>
                <li><a href="renew_license.html"><i class="fa-solid fa-file-signature me-2"></i> লাইসেন্স নবায়ন</a></li>
                <li class="active"><a href="status_check.html"><i class="fa-solid fa-magnifying-glass me-2"></i> স্ট্যাটাস চেক</a></li>
                <li><a href="profile.html"><i class="fa-solid fa-user me-2"></i> প্রোফাইল</a></li>
            </ul>
        </nav>

        <div id="content">
            <!-- Topbar -->
            <nav class="navbar navbar-expand-lg navbar-light topbar">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-outline-success"><i class="fas fa-align-left"></i></button>
                    <div class="ms-auto">
                        <span class="me-3 text-muted d-none d-md-inline"><i class="fa-solid fa-user-circle me-1"></i> <span id="userNameTopbar">মোঃ ইউজার</span></span>
                        <a href="index.html" class="btn btn-sm btn-secondary-custom">লগআউট</a>
                    </div>
                </div>
            </nav>

            <div class="main-body">
                <div class="container-fluid px-4">
                    <h3 class="mb-4">আবেদনের স্ট্যাটাস চেক করুন</h3>
                    <div class="card card-custom">
                        <div class="card-body">
                            <div class="row mb-4">
                                <div class="col-md-8">
                                    <label class="form-label fw-bold">আবেদন নম্বর (Tracking ID)</label>
                                    <div class="input-group">
                                        <input type="text" id="trackInput" class="form-control" placeholder="যেমন: APP-2026-890">
                                        <button class="btn btn-primary-custom" id="searchStatusBtn"><i class="fa-solid fa-search"></i> খুঁজুন</button>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div id="statusResult" style="display:none;">
                                <h5>ফলাফল:</h5>
                                <div class="alert alert-info">
                                    <p><strong>প্রতিষ্ঠানের নাম:</strong> <span id="resBizName"></span></p>
                                    <p><strong>বর্তমান অবস্থা:</strong> <span id="resStatus" class="badge"></span></p>
                                    <p><strong>আবেদনের তারিখ:</strong> <span id="resDate"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-auto">
                <div class="container-fluid">
                    <p class="mb-0 small">&copy; ২০২৬ ঢাকা উত্তর সিটি কর্পোরেশন। সর্বস্বত্ব সংরক্ষিত।</p>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function () {
                $('#sidebar').toggleClass('active');
                $('#content').toggleClass('active');
            });

            // Update user name in topbar
            const user = JSON.parse(localStorage.getItem('dncc_logged_in'));
            if(user) { $('#userNameTopbar').text(user.name); }

            $('#searchStatusBtn').on('click', function() {
                const id = $('#trackInput').val();
                if(!id) {
                    Swal.fire('ত্রুটি!', 'অনুগ্রহ করে আবেদন নম্বর দিন।', 'error');
                    return;
                }
                const apps = JSON.parse(localStorage.getItem('dncc_applications')) || [];
                const app = apps.find(a => a.id === id);
                if(app) {
                    $('#resBizName').text(app.businessName);
                    $('#resDate').text(app.date);
                    $('#resStatus').text(app.status === 'Pending' ? 'অপেক্ষমাণ' : (app.status === 'Approved' ? 'অনুমোদিত' : 'বাতিল'));
                    $('#resStatus').removeClass('bg-warning bg-success bg-danger').addClass(app.status === 'Pending' ? 'bg-warning text-dark' : (app.status === 'Approved' ? 'bg-success' : 'bg-danger'));
                    $('#statusResult').fadeIn();
                } else {
                    Swal.fire('পাওয়া যায়নি!', 'এই আবেদন নম্বরটি সঠিক নয়।', 'warning');
                    $('#statusResult').hide();
                }
            });
        });
    </script>
</body>
</html>
