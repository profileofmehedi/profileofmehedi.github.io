<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিএনসিসি - নিবন্ধন | DNCC Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="auth-wrapper py-5">
        <div class="card card-custom auth-card p-4" style="max-width: 600px;">
            <div class="auth-logo">
                <i class="fa-solid fa-city fa-3x text-success mb-2" style="color: var(--primary-color) !important;"></i>
                <h5 class="mb-0 fw-bold" style="color: var(--primary-color);">ঢাকা উত্তর সিটি কর্পোরেশন</h5>
                <p class="text-muted small">ট্রেড লাইসেন্স ম্যানেজমেন্ট সিস্টেম</p>
            </div>
            
            <h5 class="text-center mb-4 border-bottom pb-2">নতুন অ্যাকাউন্ট নিবন্ধন</h5>
            
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fullName" class="form-label fw-bold">পূর্ণ নাম <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fullName" placeholder="আপনার নাম লিখুন" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="nid" class="form-label fw-bold">জাতীয় পরিচয়পত্র নম্বর (NID) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="nid" placeholder="NID নম্বর দিন" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="mobile" class="form-label fw-bold">মোবাইল নম্বর <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" id="mobile" placeholder="০১৭XXXXXXXX" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-bold">ইমেইল ঠিকানা</label>
                        <input type="email" class="form-control" id="email" placeholder="example@gmail.com">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-bold">পাসওয়ার্ড <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" placeholder="নতুন পাসওয়ার্ড" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label fw-bold">পাসওয়ার্ড নিশ্চিত করুন <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="পুনরায় পাসওয়ার্ড দিন" required>
                    </div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">আমি ডিএনসিসির শর্তাবলীর সাথে একমত</label>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 mb-3"><i class="fa-solid fa-user-plus me-2"></i> নিবন্ধন করুন</button>
                
                <div class="text-center mt-3">
                    <p>ইতোমধ্যে অ্যাকাউন্ট আছে? <a href="index.html" class="fw-bold" style="color: var(--primary-color);">লগইন করুন</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap & jQuery JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
