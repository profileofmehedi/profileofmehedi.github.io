<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিএনসিসি - লগইন | DNCC Trade License</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="card card-custom auth-card p-4">
            <div class="auth-logo">
                <i class="fa-solid fa-city fa-4x text-success mb-3" style="color: var(--primary-color) !important;"></i>
                <h4 class="mb-0 fw-bold" style="color: var(--primary-color);">ঢাকা উত্তর সিটি কর্পোরেশন</h4>
                <p class="text-muted">ট্রেড লাইসেন্স ম্যানেজমেন্ট সিস্টেম</p>
            </div>
            
            <h5 class="text-center mb-4">লগইন করুন</h5>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="role" class="form-label fw-bold">ব্যবহারকারীর ধরন (User Type)</label>
                    <select class="form-select" id="role" required>
                        <option value="user">সাধারণ ব্যবহারকারী (User)</option>
                        <option value="admin">অ্যাডমিন (Admin)</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">ইমেইল / মোবাইল নম্বর</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="email" placeholder="ইমেইল বা মোবাইল দিন" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">পাসওয়ার্ড</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="পাসওয়ার্ড দিন" required>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">মনে রাখুন</label>
                    </div>
                    <a href="#" class="text-decoration-none" style="color: var(--primary-color);">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i> লগইন করুন</button>
                
                <div class="quick-login-section mt-4 pt-3 border-top">
                    <p class="text-center text-muted small mb-2">দ্রুত লগইন করুন (Quick Login)</p>
                    <div class="d-grid gap-2 d-md-flex justify-content-center">
                        <button type="button" class="btn btn-sm btn-outline-success quick-login-btn" data-role="user">ইউজার লগইন</button>
                        <button type="button" class="btn btn-sm btn-outline-danger quick-login-btn" data-role="admin">অ্যাডমিন লগইন</button>
                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <p>অ্যাকাউন্ট নেই? <a href="register.html" class="fw-bold" style="color: var(--secondary-color);">নতুন নিবন্ধন করুন</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap & jQuery JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
