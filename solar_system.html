<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Solar System</title>
    <style>
        :root {
            --panel-bg: rgba(10, 25, 47, 0.85);
            --primary-blue: #00aaff;
            --border-blue: rgba(0, 170, 255, 0.4);
            --glow-blue: rgba(0, 170, 255, 0.3);
            --dark-button-bg: #1c2a3e;
            --light-text: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas:active { cursor: grabbing; }
        
        .ui-panel {
            position: absolute;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            color: var(--light-text);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-blue);
            box-shadow: 0 0 20px var(--glow-blue);
            z-index: 100;
        }

        .controls {
            top: 20px;
            left: 20px;
            min-width: 300px;
            animation: slideIn 0.5s ease-out forwards;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .controls h3 { margin-bottom: 20px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .control-group { margin-bottom: 20px; display: grid; grid-template-columns: 70px 1fr 50px; align-items: center; gap: 15px; }
        .control-group label { font-size: 14px; color: #ccc; }

        input[type="range"] {
            width: 100%; height: 4px; background: #333; border-radius: 2px;
            -webkit-appearance: none; appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--primary-blue); cursor: pointer; border: none; box-shadow: 0 0 8px rgba(0, 170, 255, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%; background: var(--primary-blue); cursor: pointer; border: none;
        }

        .value-display { color: var(--primary-blue); font-weight: bold; font-size: 14px; text-align: right; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }

        .btn {
            padding: 12px; border: 1px solid var(--border-blue); border-radius: 8px; background: var(--dark-button-bg);
            color: var(--light-text); cursor: pointer; font-size: 14px; font-weight: 600;
            transition: all 0.2s ease-in-out; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: #2a3f5a; border-color: var(--primary-blue); }

        .info { bottom: 20px; left: 20px; max-width: 320px; animation: fadeIn 1s ease-out; }
        .info h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .info ul { list-style: none; padding-left: 5px; }
        .info li { margin-bottom: 8px; font-size: 14px; color: #ccc; }
        .info strong { color: var(--light-text); font-weight: 600; }

        .top-right-ui { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .language-switch { display: flex; background: var(--panel-bg); border-radius: 8px; border: 1px solid var(--border-blue); overflow: hidden; }
        .lang-btn { padding: 8px 16px; border: none; background: transparent; color: #ccc; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s; }
        .lang-btn:hover { background: rgba(0, 170, 255, 0.2); }
        .lang-btn.active { background: var(--primary-blue); color: black; }
        .fps-counter { padding: 8px 12px; font-size: 12px; font-weight: bold; color: var(--primary-blue); }

        /* --- New styles for Collapsible Controls --- */
        .controls-toggle {
            display: none; /* Hidden by default */
            position: absolute;
            top: 5px;
            right: 5px;
            width: 40px;
            height: 40px;
            background: var(--dark-button-bg);
            border: 1px solid var(--border-blue);
            color: var(--light-text);
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 110;
        }
        .controls-content {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            .ui-panel { padding: 15px; }
            .top-right-ui { top: 10px; right: 10px; }
            .fps-counter { display: none; }
            .info { bottom: 10px; left: 10px; right: 10px; max-width: none; }
            
            /* Collapsible Controls Logic */
            .controls {
                left: 10px;
                top: 10px;
                min-width: 0;
                width: 60px; /* Collapsed width */
                height: 60px; /* Collapsed height */
                padding: 0;
                border-radius: 50%; /* Circle shape when collapsed */
                overflow: hidden;
                transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            }
            .controls.is-open {
                width: 90%; /* Expanded width */
                max-width: 300px;
                height: auto;
                border-radius: 15px; /* Back to rounded rectangle */
                padding: 15px;
            }
            .controls-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .controls-content {
                opacity: 0;
                visibility: hidden;
            }
            .controls.is-open .controls-content {
                opacity: 1;
                visibility: visible;
            }
            .button-group { display: flex; flex-direction: column; }
        }

        @media (max-width: 480px) {
            .info { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="top-right-ui">
        <div class="fps-counter ui-panel" id="fpsCounter">FPS: 60</div>
        <div class="language-switch">
            <button class="lang-btn active" id="langEN">EN</button>
            <button class="lang-btn" id="langBN">BN</button>
        </div>
    </div>
    
    <!-- Updated Controls Panel Structure -->
    <div class="controls ui-panel" id="controlsPanel">
        <button class="controls-toggle" id="controlsToggleBtn">⚙️</button>
        <div class="controls-content">
            <h3><span id="controlsIcon">🎮</span> <span id="controlsTitle">Controls</span></h3>
            <div class="control-group">
                <label id="zoomLabel">Zoom</label>
                <input type="range" id="zoomSlider" min="150" max="1500" value="400" step="10">
                <span class="value-display" id="zoomValue">400</span>
            </div>
            <div class="control-group">
                <label id="speedLabel">Speed</label>
                <input type="range" id="speedSlider" min="0" max="10" value="1" step="0.1">
                <span class="value-display" id="speedValue">1.0x</span>
            </div>
            <div class="control-group">
                <label id="rotationLabel">Rotation</label>
                <input type="range" id="rotationSlider" min="0" max="2" value="0.3" step="0.05">
                <span class="value-display" id="rotationValue">0.30</span>
            </div>
            <div class="button-group">
                <button class="btn" id="pauseBtn"><span id="pauseIcon">⏸</span> <span id="pauseText">Pause</span></button>
                <button class="btn" id="resetBtn"><span id="resetIcon">🔄</span> <span id="resetText">Reset</span></button>
            </div>
        </div>
    </div>

    <div class="info ui-panel">
        <h3><span id="infoIcon">🌌</span> <span id="infoTitle">Interactive Solar System</span></h3>
        <ul>
            <li><strong id="dragLabel">Drag/Swipe:</strong> <span id="dragDesc">Rotate view</span></li>
            <li><strong id="scrollLabel">Scroll/Pinch:</strong> <span id="scrollDesc">Zoom in/out</span></li>
            <li><strong id="tapLabel">Tap Planet:</strong> <span id="tapDesc">View details</span></li>
        </ul>
    </div>

    <div class="planet-info ui-panel" id="planetInfo">
        <div class="planet-info-header">
            <h4 id="planetName">Planet</h4>
            <div class="close-btn" id="closeBtn">×</div>
        </div>
        <div class="info-section">
            <h5 id="physicalTitle">Physical Characteristics</h5>
            <div id="physicalInfo"></div>
        </div>
    </div>
    
    <script>
        // Getting new elements for collapsible controls
        const controlsPanel = document.getElementById('controlsPanel');
        const controlsToggleBtn = document.getElementById('controlsToggleBtn');

        // Event listener for the toggle button
        controlsToggleBtn.addEventListener('click', (event) => {
            event.stopPropagation(); // Prevents canvas click from closing it immediately
            controlsPanel.classList.toggle('is-open');
        });
        
        // --- Core script remains the same ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        let currentLang = 'en';
        const translations = {
            en: { controlsTitle: 'Controls', zoomLabel: 'Zoom', speedLabel: 'Speed', rotationLabel: 'Rotation', pauseText: 'Pause', resumeText: 'Resume', resetText: 'Reset', infoTitle: 'Interactive Solar System', dragLabel: 'Drag/Swipe:', dragDesc: 'Rotate view', scrollLabel: 'Scroll/Pinch:', scrollDesc: 'Zoom in/out', tapLabel: 'Tap Planet:', tapDesc: 'View details', physicalTitle: 'Physical Characteristics', diameter: 'Diameter', mass: 'Mass', gravity: 'Gravity', dayLength: 'Day Length', yearLength: 'Year Length', temperature: 'Temperature', moons: 'Moons' },
            bn: { controlsTitle: 'নিয়ন্ত্রণ', zoomLabel: 'জুম', speedLabel: 'গতি', rotationLabel: 'ঘূর্ণন', pauseText: 'বিরতি', resumeText: 'পুনরায়', resetText: 'রিসেট', infoTitle: 'সৌরজগৎ', dragLabel: 'টানুন:', dragDesc: 'ভিউ ঘোরান', scrollLabel: 'স্ক্রল:', scrollDesc: 'জুম করুন', tapLabel: 'ট্যাপ করুন:', tapDesc: 'বিস্তারিত', physicalTitle: 'ভৌত বৈশিষ্ট্য', diameter: 'ব্যাস', mass: 'ভর', gravity: 'মাধ্যাকর্ষণ', dayLength: 'দিনের দৈর্ঘ্য', yearLength: 'বছরের দৈর্ঘ্য', temperature: 'তাপমাত্রা', moons: 'চাঁদ' }
        };

        function updateLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('controlsTitle').textContent = t.controlsTitle;
            document.getElementById('zoomLabel').textContent = t.zoomLabel;
            document.getElementById('speedLabel').textContent = t.speedLabel;
            document.getElementById('rotationLabel').textContent = t.rotationLabel;
            document.getElementById('pauseText').textContent = isPaused ? t.resumeText : t.pauseText;
            document.getElementById('resetText').textContent = t.resetText;
            document.getElementById('infoTitle').textContent = t.infoTitle;
            document.getElementById('dragLabel').textContent = t.dragLabel;
            document.getElementById('dragDesc').textContent = t.dragDesc;
            document.getElementById('scrollLabel').textContent = t.scrollLabel;
            document.getElementById('scrollDesc').textContent = t.scrollDesc;
            document.getElementById('tapLabel').textContent = t.tapLabel;
            document.getElementById('tapDesc').textContent = t.tapDesc;
            if (planetInfo.classList.contains('active')) { document.getElementById('physicalTitle').textContent = t.physicalTitle; }
            document.getElementById('langEN').classList.toggle('active', lang === 'en');
            document.getElementById('langBN').classList.toggle('active', lang === 'bn');
        }

        document.getElementById('langEN').addEventListener('click', () => { if (currentLang !== 'en') { updateLanguage('en'); planets = planetsData.en; } });
        document.getElementById('langBN').addEventListener('click', () => { if (currentLang !== 'bn') { updateLanguage('bn'); planets = planetsData.bn; } });

        const zoomSlider = document.getElementById('zoomSlider');
        const speedSlider = document.getElementById('speedSlider');
        const rotationSlider = document.getElementById('rotationSlider');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const planetInfo = document.getElementById('planetInfo');
        const closeBtn = document.getElementById('closeBtn');
        const fpsCounter = document.getElementById('fpsCounter');

        let zoom = 400, speed = 1, autoRotation = 0.3, cameraAngle = 0, cameraTilt = 0.3;
        let isPaused = false, isDragging = false, lastMouseX = 0, lastMouseY = 0, lastTouchDistance = 0;
        let lastTime = performance.now(), fps = 60, frameCount = 0;

        const planetsData = {
            en: [ { name: 'Mercury', distance: 50, size: 4, color: '#8c7853', speed: 0.048, angle: Math.random()*Math.PI*2, diameter: '4,879 km', mass: '3.285 × 10²³ kg', gravity: '3.7 m/s²', dayLength: '4,222.6 hours', yearLength: '88 Earth days', temperature: '-173°C to 427°C', moons: '0' }, { name: 'Venus', distance: 75, size: 9, color: '#ffc649', speed: 0.035, angle: Math.random()*Math.PI*2, diameter: '12,104 km', mass: '4.867 × 10²⁴ kg', gravity: '8.9 m/s²', dayLength: '2,802 hours', yearLength: '225 Earth days', temperature: '462°C', moons: '0' }, { name: 'Earth', distance: 105, size: 10, color: '#4a90e2', speed: 0.03, angle: Math.random()*Math.PI*2, moon: true, diameter: '12,742 km', mass: '5.972 × 10²⁴ kg', gravity: '9.8 m/s²', dayLength: '24 hours', yearLength: '365.25 days', temperature: '-88°C to 58°C', moons: '1' }, { name: 'Mars', distance: 135, size: 7, color: '#e27b58', speed: 0.024, angle: Math.random()*Math.PI*2, diameter: '6,779 km', mass: '6.39 × 10²³ kg', gravity: '3.7 m/s²', dayLength: '24.6 hours', yearLength: '687 Earth days', temperature: '-87°C to -5°C', moons: '2' }, { name: 'Jupiter', distance: 200, size: 25, color: '#c88b3a', speed: 0.013, angle: Math.random()*Math.PI*2, diameter: '139,820 km', mass: '1.898 × 10²⁷ kg', gravity: '23.1 m/s²', dayLength: '9.9 hours', yearLength: '12 Earth years', temperature: '-108°C', moons: '95+' }, { name: 'Saturn', distance: 270, size: 22, color: '#fad5a5', speed: 0.009, angle: Math.random()*Math.PI*2, rings: true, diameter: '116,460 km', mass: '5.683 × 10²⁶ kg', gravity: '9.0 m/s²', dayLength: '10.7 hours', yearLength: '29 Earth years', temperature: '-139°C', moons: '146+' }, { name: 'Uranus', distance: 340, size: 15, color: '#4fd0e7', speed: 0.006, angle: Math.random()*Math.PI*2, diameter: '50,724 km', mass: '8.681 × 10²⁵ kg', gravity: '8.7 m/s²', dayLength: '17.2 hours', yearLength: '84 Earth years', temperature: '-197°C', moons: '27' }, { name: 'Neptune', distance: 400, size: 14, color: '#4166f5', speed: 0.005, angle: Math.random()*Math.PI*2, diameter: '49,244 km', mass: '1.024 × 10²⁶ kg', gravity: '11.0 m/s²', dayLength: '16.1 hours', yearLength: '165 Earth years', temperature: '-201°C', moons: '14' } ],
            bn: [ { name: 'বুধ', distance: 50, size: 4, color: '#8c7853', speed: 0.048, angle: Math.random()*Math.PI*2, diameter: '৪,৮৭৯ কিমি', mass: '৩.২৮৫ × ১০²³ কেজি', gravity: '৩.৭ মি/সে²', dayLength: '৪,২২২.৬ ঘণ্টা', yearLength: '৮৮ পৃথিবী দিবস', temperature: '-১৭৩°সে to ৪২৭°সে', moons: '০' }, { name: 'শুক্র', distance: 75, size: 9, color: '#ffc649', speed: 0.035, angle: Math.random()*Math.PI*2, diameter: '১২,১০৪ কিমি', mass: '৪.৮৬৭ × ১০²⁴ কেজি', gravity: '৮.৯ মি/সে²', dayLength: '২,৮০২ ঘণ্টা', yearLength: '২২৫ পৃথিবী দিবস', temperature: '৪৬২°সে', moons: '০' }, { name: 'পৃথিবী', distance: 105, size: 10, color: '#4a90e2', speed: 0.03, angle: Math.random()*Math.PI*2, moon: true, diameter: '১২,৭৪২ কিমি', mass: '৫.৯৭২ × ১০²⁴ কেজি', gravity: '৯.৮ মি/সে²', dayLength: '২৪ ঘণ্টা', yearLength: '৩৬৫.২৫ দিন', temperature: '-৮৮°সে to ৫৮°সে', moons: '১' }, { name: 'মঙ্গল', distance: 135, size: 7, color: '#e27b58', speed: 0.024, angle: Math.random()*Math.PI*2, diameter: '৬,৭৭৯ কিমি', mass: '৬.৩৯ × ১০²³ কেজি', gravity: '৩.৭ মি/সে²', dayLength: '২৪.৬ ঘণ্টা', yearLength: '৬৮৭ পৃথিবী দিবস', temperature: '-৮৭°সে to -৫°সে', moons: '২' }, { name: 'বৃহস্পতি', distance: 200, size: 25, color: '#c88b3a', speed: 0.013, angle: Math.random()*Math.PI*2, diameter: '১,৩৯,৮২০ কিমি', mass: '১.৮৯৮ × ১০²⁷ কেজি', gravity: '২৩.১ মি/সে²', dayLength: '৯.৯ ঘণ্টা', yearLength: '১২ পৃথিবী বছর', temperature: '-১০৮°সে', moons: '৯৫+' }, { name: 'শনি', distance: 270, size: 22, color: '#fad5a5', speed: 0.009, angle: Math.random()*Math.PI*2, rings: true, diameter: '১,১৬,৪৬০ কিমি', mass: '৫.৬৮৩ × ১০²⁶ কেজি', gravity: '৯.০ মি/সে²', dayLength: '১০.৭ ঘণ্টা', yearLength: '২৯ পৃথিবী বছর', temperature: '-১৩৯°সে', moons: '১৪৬+' }, { name: 'ইউরেনাস', distance: 340, size: 15, color: '#4fd0e7', speed: 0.006, angle: Math.random()*Math.PI*2, diameter: '৫০,৭২৪ কিমি', mass: '৮.৬৮১ × ১০²⁵ কেজি', gravity: '৮.৭ মি/সে²', dayLength: '১৭.২ ঘণ্টা', yearLength: '৮৪ পৃথিবী বছর', temperature: '-১৯৭°সে', moons: '২৭' }, { name: 'নেপচুন', distance: 400, size: 14, color: '#4166f5', speed: 0.005, angle: Math.random()*Math.PI*2, diameter: '৪৯,২৪৪ কিমি', mass: '১.০২৪ × ১০²⁶ কেজি', gravity: '১১.০ মি/সে²', dayLength: '১৬.১ ঘণ্টা', yearLength: '১৬৫ পৃথিবী বছর', temperature: '-২০১°সে', moons: '১৪' } ]
        };
        let planets = planetsData.en;
        const stars = Array.from({ length: 300 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.5, brightness: Math.random(), twinkleSpeed: Math.random() * 0.02 + 0.01, twinklePhase: Math.random() * Math.PI * 2 }));

        zoomSlider.addEventListener('input', e => (zoom = parseFloat(e.target.value), document.getElementById('zoomValue').textContent = zoom));
        speedSlider.addEventListener('input', e => (speed = parseFloat(e.target.value), document.getElementById('speedValue').textContent = `${speed.toFixed(1)}x`));
        rotationSlider.addEventListener('input', e => (autoRotation = parseFloat(e.target.value), document.getElementById('rotationValue').textContent = autoRotation.toFixed(2)));
        pauseBtn.addEventListener('click', () => { isPaused = !isPaused; const t = translations[currentLang]; document.getElementById('pauseText').textContent = isPaused ? t.resumeText : t.pauseText; });
        resetBtn.addEventListener('click', () => { zoom = 400; speed = 1; autoRotation = 0.3; cameraAngle = 0; cameraTilt = 0.3; zoomSlider.value = 400; speedSlider.value = 1; rotationSlider.value = 0.3; document.getElementById('zoomValue').textContent = '400'; document.getElementById('speedValue').textContent = '1.0x'; document.getElementById('rotationValue').textContent = '0.30'; });
        closeBtn.addEventListener('click', () => planetInfo.classList.remove('active'));

        const handleMove = (x, y) => { if (isDragging) { const deltaX = x - lastMouseX, deltaY = y - lastMouseY; cameraAngle += deltaX * 0.005; cameraTilt = Math.max(-1.2, Math.min(1.2, cameraTilt + deltaY * 0.002)); lastMouseX = x; lastMouseY = y; } };
        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(150, Math.min(1500, zoom - e.deltaY * 0.5)); zoomSlider.value = zoom; document.getElementById('zoomValue').textContent = Math.round(zoom); }, { passive: false });
        canvas.addEventListener('touchstart', e => { if (!controlsPanel.contains(e.target)) { isDragging = true; } if (e.touches.length === 1) { lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY; } else if (e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; lastTouchDistance = Math.hypot(dx, dy); } }, { passive: false });
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length === 1) { handleMove(e.touches[0].clientX, e.touches[0].clientY); } else if (e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; const dist = Math.hypot(dx, dy); zoom = Math.max(150, Math.min(1500, zoom + (dist - lastTouchDistance) * 2)); zoomSlider.value = zoom; document.getElementById('zoomValue').textContent = Math.round(zoom); lastTouchDistance = dist; } }, { passive: false });

        function handleCanvasClick(event) {
            if (controlsPanel.classList.contains('is-open') && !controlsPanel.contains(event.target)) {
                controlsPanel.classList.remove('is-open');
            }
            handlePlanetClick(event.clientX, event.clientY);
        }
        canvas.addEventListener('click', handleCanvasClick);
        
        function handlePlanetClick(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left, clickY = clientY - rect.top;
            planets.forEach(planet => { const pos = getPlanetPosition(planet); if (Math.hypot(clickX - pos.x, clickY - pos.y) < pos.size + 15) { showPlanetInfo(planet); } });
        }
        
        function showPlanetInfo(planet) {
            const t = translations[currentLang];
            document.getElementById('planetName').textContent = planet.name;
            document.getElementById('physicalTitle').textContent = t.physicalTitle;
            document.getElementById('physicalInfo').innerHTML = `<div class="info-row"><span class="info-label">${t.diameter}</span><span class="info-value">${planet.diameter}</span></div><div class="info-row"><span class="info-label">${t.mass}</span><span class="info-value">${planet.mass}</span></div><div class="info-row"><span class="info-label">${t.gravity}</span><span class="info-value">${planet.gravity}</span></div><div class="info-row"><span class="info-label">${t.dayLength}</span><span class="info-value">${planet.dayLength}</span></div><div class="info-row"><span class="info-label">${t.yearLength}</span><span class="info-value">${planet.yearLength}</span></div><div class="info-row"><span class="info-label">${t.temperature}</span><span class="info-value">${planet.temperature}</span></div><div class="info-row"><span class="info-label">${t.moons}</span><span class="info-value">${planet.moons}</span></div>`;
            planetInfo.classList.add('active');
        }

        const getPlanetPosition = p => { const cx = canvas.width / 2, cy = canvas.height / 2, ra = p.angle + cameraAngle, x = Math.cos(ra) * p.distance, z = Math.sin(ra) * p.distance, y = z * Math.sin(cameraTilt), s = zoom / (zoom + z); return { x: cx + x * s, y: cy + y * s, size: p.size * s, z: z }; };
        const drawStars = () => { stars.forEach(s => { s.twinklePhase += s.twinkleSpeed; const b = s.brightness * 0.5 + ((Math.sin(s.twinklePhase) + 1) / 2) * 0.5; ctx.fillStyle = `rgba(255, 255, 255, ${b})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); }); };
        const drawSun = () => { const cx = canvas.width/2, cy = canvas.height/2; const g = ctx.createRadialGradient(cx,cy,0,cx,cy,50); g.addColorStop(0,'rgba(255,215,0,0.8)'); g.addColorStop(0.5,'rgba(255,140,0,0.4)'); g.addColorStop(1,'rgba(255,69,0,0)'); ctx.fillStyle=g; ctx.fillRect(cx-50,cy-50,100,100); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,15,0,Math.PI*2); ctx.fill(); };
        const drawPlanet = p => { if(!isPaused) p.angle+=p.speed*speed*0.016; const pos = getPlanetPosition(p); if(pos.z < -zoom) return; const g=ctx.createRadialGradient(pos.x-pos.size*0.4,pos.y-pos.size*0.4,0,pos.x,pos.y,pos.size*1.2); g.addColorStop(0,p.color); g.addColorStop(1,'#000'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pos.x,pos.y,pos.size,0,Math.PI*2); ctx.fill(); if(p.rings){ ctx.save(); ctx.translate(pos.x,pos.y); ctx.strokeStyle=`rgba(218,185,127,0.6)`; ctx.lineWidth=3*(pos.size/22); ctx.beginPath(); ctx.ellipse(0,0,pos.size*2.2,pos.size*0.4,Math.PI/10,0,Math.PI*2); ctx.stroke(); ctx.restore(); } if(p.moon){ const ma=p.angle*13, mx=pos.x+Math.cos(ma)*pos.size*3, my=pos.y+Math.sin(ma)*pos.size*1.5; ctx.fillStyle='#ccc'; ctx.beginPath(); ctx.arc(mx,my,pos.size*0.3,0,Math.PI*2); ctx.fill(); }};
        
        function animate() {
            const now = performance.now(); if(now-lastTime>=1000){ fps=frameCount; fpsCounter.textContent=`FPS: ${fps}`; frameCount=0; lastTime=now; } frameCount++;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars(); drawSun();
            const planetsWithDepth = planets.map(p => ({ p, z: getPlanetPosition(p).z })).sort((a, b) => a.z - b.z);
            planetsWithDepth.forEach(item => drawPlanet(item.p));
            if(!isDragging && !isPaused) cameraAngle += autoRotation * 0.001;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
