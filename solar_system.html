<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Solar System</title>
    <style>
        :root {
            --panel-bg: rgba(10, 25, 47, 0.85);
            --primary-blue: #00aaff;
            --border-blue: rgba(0, 170, 255, 0.4);
            --glow-blue: rgba(0, 170, 255, 0.3);
            --dark-button-bg: #1c2a3e;
            --light-text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }

        .ui-panel {
            position: absolute;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            color: var(--light-text);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-blue);
            box-shadow: 0 0 20px var(--glow-blue);
            z-index: 100;
        }

        .controls {
            top: 20px;
            left: 20px;
            min-width: 300px;
            animation: slideIn 0.5s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .controls h3 {
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group {
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 70px 1fr 50px;
            align-items: center;
            gap: 15px;
        }

        .control-group label {
            font-size: 14px;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-blue);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0, 170, 255, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-blue);
            cursor: pointer;
            border: none;
        }

        .value-display {
            color: var(--primary-blue);
            font-weight: bold;
            font-size: 14px;
            text-align: right;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px;
            border: 1px solid var(--border-blue);
            border-radius: 8px;
            background: var(--dark-button-bg);
            color: var(--light-text);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #2a3f5a;
            border-color: var(--primary-blue);
        }

        .info {
            bottom: 20px;
            left: 20px;
            max-width: 320px;
            animation: fadeIn 1s ease-out;
        }

        .info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info ul {
            list-style: none;
            padding-left: 5px;
        }

        .info li {
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        .info strong {
            color: var(--light-text);
            font-weight: 600;
        }

        .planet-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            display: none;
            z-index: 200;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .planet-info.active {
            display: block;
        }

        .planet-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-blue);
        }

        .planet-info h4 {
            color: var(--primary-blue);
            font-size: 28px;
        }

        .close-btn {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid rgba(255, 82, 82, 0.5);
            color: #ff5252;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 82, 82, 0.3);
            transform: rotate(90deg);
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section h5 {
            color: var(--primary-blue);
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-section p {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #aaa;
        }

        .info-value {
            color: #fff;
            font-weight: 600;
            text-align: right;
        }

        .fun-facts ul {
            list-style: none;
            padding: 0;
        }

        .fun-facts li {
            padding: 8px 0;
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .fun-facts li::before {
            content: "✨";
            color: var(--primary-blue);
        }

        .top-right-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .language-switch {
            display: flex;
            background: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-blue);
            overflow: hidden;
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            background: rgba(0, 170, 255, 0.2);
        }

        .lang-btn.active {
            background: var(--primary-blue);
            color: black;
        }

        .fps-counter {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: var(--primary-blue);
        }

        .controls-toggle {
            display: none;
            position: absolute;
            top: 5px;
            right: 5px;
            width: 40px;
            height: 40px;
            background: var(--dark-button-bg);
            border: 1px solid var(--border-blue);
            color: var(--light-text);
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 110;
        }

        .controls-content {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        @media (max-width: 768px) {
            .ui-panel {
                padding: 15px;
            }

            .top-right-ui {
                top: 10px;
                right: 10px;
            }

            .fps-counter {
                display: none;
            }

            .info {
                bottom: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
            }

            .controls {
                left: 10px;
                top: 10px;
                min-width: 0;
                width: 60px;
                height: 60px;
                padding: 0;
                border-radius: 50%;
                overflow: hidden;
                transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            }

            .controls.is-open {
                width: 90%;
                max-width: 300px;
                height: auto;
                border-radius: 15px;
                padding: 15px;
            }

            .controls-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .controls-content {
                opacity: 0;
                visibility: hidden;
            }

            .controls.is-open .controls-content {
                opacity: 1;
                visibility: visible;
            }

            .button-group {
                display: flex;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .info {
                display: none;
            }

            .info-value {
                text-align: left;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="top-right-ui">
        <div class="fps-counter ui-panel" id="fpsCounter">FPS: 60</div>
        <div class="language-switch">
            <button class="lang-btn active" id="langEN">EN</button>
            <button class="lang-btn" id="langBN">BN</button>
        </div>
    </div>

    <div class="controls ui-panel" id="controlsPanel">
        <button class="controls-toggle" id="controlsToggleBtn">⚙️</button>
        <div class="controls-content">
            <h3><span id="controlsIcon">🎮</span> <span id="controlsTitle">Controls</span></h3>
            <div class="control-group">
                <label id="zoomLabel">Zoom</label>
                <input type="range" id="zoomSlider" min="150" max="1500" value="400" step="10">
                <span class="value-display" id="zoomValue">400</span>
            </div>
            <div class="control-group">
                <label id="speedLabel">Speed</label>
                <input type="range" id="speedSlider" min="0" max="10" value="1" step="0.1">
                <span class="value-display" id="speedValue">1.0x</span>
            </div>
            <div class="control-group">
                <label id="rotationLabel">Rotation</label>
                <input type="range" id="rotationSlider" min="0" max="2" value="0.3" step="0.05">
                <span class="value-display" id="rotationValue">0.30</span>
            </div>
            <div class="button-group">
                <button class="btn" id="pauseBtn"><span id="pauseIcon">⏸</span> <span
                        id="pauseText">Pause</span></button>
                <button class="btn" id="resetBtn"><span id="resetIcon">🔄</span> <span
                        id="resetText">Reset</span></button>
            </div>
        </div>
    </div>

    <div class="info ui-panel">
        <h3><span id="infoIcon">🌌</span> <span id="infoTitle">Interactive Solar System</span></h3>
        <ul>
            <li><strong id="dragLabel">Drag/Swipe:</strong> <span id="dragDesc">Rotate view</span></li>
            <li><strong id="scrollLabel">Scroll/Pinch:</strong> <span id="scrollDesc">Zoom in/out</span></li>
            <li><strong id="tapLabel">Tap Planet:</strong> <span id="tapDesc">View details</span></li>
        </ul>
    </div>

    <div class="planet-info ui-panel" id="planetInfo">
        <div class="planet-info-header">
            <h4 id="planetName">Planet</h4>
            <div class="close-btn" id="closeBtn">×</div>
        </div>
        <!-- Container for dynamic content -->
        <div id="planetDetailsContainer"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- UI & CONTROLS SCRIPT ---
        const controlsPanel = document.getElementById('controlsPanel');
        const controlsToggleBtn = document.getElementById('controlsToggleBtn');
        controlsToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            controlsPanel.classList.toggle('is-open');
        });

        let currentLang = 'en';
        const translations = {
            en: { controlsTitle: 'Controls', zoomLabel: 'Zoom', speedLabel: 'Speed', rotationLabel: 'Rotation', pauseText: 'Pause', resumeText: 'Resume', resetText: 'Reset', infoTitle: 'Interactive Solar System', dragLabel: 'Drag/Swipe:', dragDesc: 'Rotate view', scrollLabel: 'Scroll/Pinch:', scrollDesc: 'Zoom in/out', tapLabel: 'Tap Planet:', tapDesc: 'View details', physicalTitle: 'Physical Characteristics', compositionTitle: 'Composition & Atmosphere', discoveryTitle: 'Discovery', funFactsTitle: 'Fun Facts', diameter: 'Diameter', mass: 'Mass', gravity: 'Gravity', dayLength: 'Day Length', yearLength: 'Year Length', temperature: 'Temperature', moons: 'Moons' },
            bn: { controlsTitle: 'নিয়ন্ত্রণ', zoomLabel: 'জুম', speedLabel: 'গতি', rotationLabel: 'ঘূর্ণন', pauseText: 'বিরতি', resumeText: 'পুনরায়', resetText: 'রিসেট', infoTitle: 'সৌরজগৎ', dragLabel: 'টানুন:', dragDesc: 'ভিউ ঘোরান', scrollLabel: 'স্ক্রল:', scrollDesc: 'জুম করুন', tapLabel: 'ট্যাপ করুন:', tapDesc: 'বিস্তারিত', physicalTitle: 'ভৌত বৈশিষ্ট্য', compositionTitle: 'গঠন ও বায়ুমণ্ডল', discoveryTitle: 'আবিষ্কার', funFactsTitle: 'মজার তথ্য', diameter: 'ব্যাস', mass: 'ভর', gravity: 'মাধ্যাকর্ষণ', dayLength: 'দিনের দৈর্ঘ্য', yearLength: 'বছরের দৈর্ঘ্য', temperature: 'তাপমাত্রা', moons: 'চাঁদ' }
        };

        function updateLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            Object.keys(t).forEach(key => {
                const el = document.getElementById(key);
                if (el) el.textContent = t[key];
            });
            document.getElementById('pauseText').textContent = isPaused ? t.resumeText : t.pauseText;
            document.getElementById('langEN').classList.toggle('active', lang === 'en');
            document.getElementById('langBN').classList.toggle('active', lang === 'bn');
        }

        document.getElementById('langEN').addEventListener('click', () => {
            if (currentLang !== 'en') { updateLanguage('en'); planets = planetsData.en; }
        });
        document.getElementById('langBN').addEventListener('click', () => {
            if (currentLang !== 'bn') { updateLanguage('bn'); planets = planetsData.bn; }
        });

        const zoomSlider = document.getElementById('zoomSlider');
        const speedSlider = document.getElementById('speedSlider');
        const rotationSlider = document.getElementById('rotationSlider');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const planetInfo = document.getElementById('planetInfo');
        const closeBtn = document.getElementById('closeBtn');
        const fpsCounter = document.getElementById('fpsCounter');

        let zoom = 400, speed = 1, autoRotation = 0.3, cameraAngle = 0, cameraTilt = 0.3;
        let isPaused = false, isDragging = false;
        let startX = 0, startY = 0;
        let lastTime = performance.now(), fps = 60, frameCount = 0;

        // --- DATA & ANIMATION SCRIPT ---
        const planetsData = {
            en: [
                { name: 'Mercury', distance: 50, size: 4, color: '#8c7853', speed: 0.048, angle: Math.random() * Math.PI * 2, diameter: '4,879 km', mass: '3.3 × 10²³ kg', gravity: '3.7 m/s²', dayLength: '59 Earth days', yearLength: '88 Earth days', temperature: '-173 to 427°C', moons: '0', composition: 'A rocky planet with a massive metallic core that makes up about 75% of its diameter. Its surface is heavily cratered, similar to Earth\'s Moon.', atmosphere: 'Mercury has a very thin exosphere, not a true atmosphere. It consists of atoms blasted off its surface by solar wind and micrometeoroids.', discovery: 'Known since antiquity, as it is visible to the naked eye. The first telescopic observations were made by Galileo Galilei in the early 17th century.', funFacts: ['One solar day on Mercury (from noon to noon) lasts 176 Earth days, which is longer than its year!', 'Its surface has strange wrinkles called "lobate scarps," formed as the planet\'s core cooled and shrank.', 'Despite being closest to the Sun, it is not the hottest planet; that title belongs to Venus.'] },
                { name: 'Venus', distance: 75, size: 9, color: '#ffc649', speed: 0.035, angle: Math.random() * Math.PI * 2, diameter: '12,104 km', mass: '4.8 × 10²⁴ kg', gravity: '8.9 m/s²', dayLength: '243 Earth days', yearLength: '225 Earth days', temperature: '462°C', moons: '0', composition: 'A terrestrial planet very similar in size and composition to Earth, with a rocky mantle and an iron core.', atmosphere: 'A thick, toxic atmosphere of carbon dioxide and sulfuric acid clouds creates a runaway greenhouse effect, making it the hottest planet in the solar system.', discovery: 'Known since antiquity. Its phases, like the Moon\'s, were first observed by Galileo Galilei in 1610, supporting the heliocentric model.', funFacts: ['Venus rotates on its axis backwards (retrograde rotation) compared to most other planets.', 'A day on Venus is longer than its year.', 'The atmospheric pressure on its surface is 92 times that of Earth, equivalent to being 1 km deep in the ocean.'] },
                { name: 'Earth', distance: 105, size: 10, color: '#4a90e2', speed: 0.03, angle: Math.random() * Math.PI * 2, moon: true, diameter: '12,742 km', mass: '5.9 × 10²⁴ kg', gravity: '9.8 m/s²', dayLength: '24 hours', yearLength: '365.25 days', temperature: '-88 to 58°C', moons: '1', composition: 'A rocky, terrestrial planet with active geology (plate tectonics) and a liquid outer core that generates a strong magnetic field.', atmosphere: 'Composed primarily of nitrogen (78%) and oxygen (21%), with trace amounts of other gases. It has a layered structure that protects the surface from harmful solar radiation.', discovery: 'Our home planet, known to humanity since its existence.', funFacts: ['Earth is the only known planet to harbor life.', 'It is the only planet in our solar system not named after a Greek or Roman deity.', 'The Earth\'s rotation is gradually slowing down, lengthening our day by about 1.8 milliseconds per century.'] },
                { name: 'Mars', distance: 135, size: 7, color: '#e27b58', speed: 0.024, angle: Math.random() * Math.PI * 2, diameter: '6,779 km', mass: '6.4 × 10²³ kg', gravity: '3.7 m/s²', dayLength: '24.6 hours', yearLength: '687 Earth days', temperature: '-125 to 20°C', moons: '2', composition: 'A rocky planet with a surface rich in iron oxide, which gives it its characteristic red color. It has polar ice caps made of water ice and carbon dioxide ice.', atmosphere: 'A very thin atmosphere, less than 1% of Earth\'s, composed mainly of carbon dioxide. This thin air cannot retain much heat.', discovery: 'Known since antiquity. Detailed mapping began in the 19th century, and the space age has allowed for close-up study by orbiters and rovers.', funFacts: ['Mars hosts Olympus Mons, the largest volcano in the solar system, which is nearly three times the height of Mount Everest.', 'It has the largest canyon, Valles Marineris, which would stretch across the entire United States.', 'Mars has the largest dust storms in the solar system, sometimes covering the entire planet.'] },
                { name: 'Jupiter', distance: 200, size: 25, color: '#c88b3a', speed: 0.013, angle: Math.random() * Math.PI * 2, diameter: '139,822 km', mass: '1.9 × 10²⁷ kg', gravity: '24.8 m/s²', dayLength: '9.9 hours', yearLength: '11.9 Earth years', temperature: '-108°C', moons: '95+', composition: 'A gas giant, composed mostly of hydrogen and helium, similar to the Sun. It may have a dense, rocky core, but its immense pressure makes it difficult to know for sure.', atmosphere: 'The largest planetary atmosphere in the solar system, with beautiful colored cloud belts and zones. It features the Great Red Spot, a gigantic storm larger than Earth.', discovery: 'Known since antiquity. In 1610, Galileo Galilei discovered its four largest moons (the Galilean moons), a major discovery for astronomy.', funFacts: ['Jupiter has the shortest day of any planet, rotating on its axis in under 10 hours.', 'It has a faint ring system, discovered in 1979 by the Voyager 1 spacecraft.', 'Its powerful magnetic field is nearly 20,000 times stronger than Earth\'s.'] },
                { name: 'Saturn', distance: 270, size: 22, color: '#fad5a5', speed: 0.009, angle: Math.random() * Math.PI * 2, rings: true, diameter: '116,464 km', mass: '5.7 × 10²⁶ kg', gravity: '10.4 m/s²', dayLength: '10.7 hours', yearLength: '29.5 Earth years', temperature: '-139°C', moons: '146+', composition: 'A gas giant made up of hydrogen and helium. It is the least dense planet in the solar system.', atmosphere: 'Features bands of clouds and powerful winds that can reach up to 1,800 km/h. It has a large hexagonal storm at its north pole.', discovery: 'Known since antiquity. Its rings, however, confused early astronomers like Galileo. Christiaan Huygens was the first to correctly identify them as a disk in 1655.', funFacts: ['Saturn is so light that it would float in a bathtub if one were large enough.', 'Its spectacular rings are made of billions of particles of ice and rock, ranging in size from a grain of dust to a house.', 'Its moon Titan is the only moon in the solar system with a thick atmosphere.'] },
                { name: 'Uranus', distance: 340, size: 15, color: '#4fd0e7', speed: 0.006, angle: Math.random() * Math.PI * 2, diameter: '50,724 km', mass: '8.7 × 10²⁵ kg', gravity: '8.7 m/s²', dayLength: '17.2 hours', yearLength: '84 Earth years', temperature: '-197°C', moons: '27', composition: 'An ice giant, with a hot, dense core of "icy" materials (water, methane, ammonia) surrounding a small rocky center.', atmosphere: 'Composed of hydrogen, helium, and methane. The methane absorbs red light, giving Uranus its blue-green color.', discovery: 'Discovered by William Herschel in 1781. It was the first planet found with the aid of a telescope.', funFacts: ['Uranus rotates on its side, with an axial tilt of 98 degrees. This results in extreme seasons, with each pole getting 42 years of continuous sunlight followed by 42 years of darkness.', 'It is the coldest planet in the solar system, with temperatures dropping to -224°C.', 'It has a faint system of 13 known rings.'] },
                { name: 'Neptune', distance: 400, size: 14, color: '#4166f5', speed: 0.005, angle: Math.random() * Math.PI * 2, diameter: '49,244 km', mass: '1.0 × 10²⁶ kg', gravity: '11.1 m/s²', dayLength: '16.1 hours', yearLength: '165 Earth years', temperature: '-201°C', moons: '14', composition: 'An ice giant, similar to Uranus, with a dense core of rock and "ices" surrounded by a thick envelope of gas.', atmosphere: 'Hydrogen, helium, and methane give Neptune its deep blue color. It experiences the fastest, most powerful winds in the solar system, reaching speeds of over 2,000 km/h.', discovery: 'Discovered in 1846. Its existence was predicted mathematically by Urbain Le Verrier and John Couch Adams before it was directly observed by Johann Galle.', funFacts: ['A year on Neptune lasts for nearly 165 Earth years. It has only completed one orbit since its discovery.', 'It had a large storm called the Great Dark Spot, similar to Jupiter\'s, but it disappeared by 1994.', 'Its largest moon, Triton, orbits the planet backwards and is one of the coldest objects in the solar system.'] }

                { name: 'নেপচুন', distance: 400, size: 14, color: '#4166f5', speed: 0.005, angle: Math.random() * Math.PI * 2, diameter: '৪৯,২৪৪ কিমি', mass: '১.০ × ১০²⁶ কেজি', gravity: '১১.১ মি/সে²', dayLength: '১৬.১ ঘণ্টা', yearLength: '১৬৫ পৃথিবী বছর', temperature: '-২০১°সে', moons: '১৪', composition: 'একটি বরফ দৈত্য, ইউরেনাসের মতো, যার একটি ঘন শিলা এবং "বরফ" কোর রয়েছে যা একটি পুরু গ্যাসের খাম দ্বারা বেষ্টিত।', atmosphere: 'হাইড্রোজেন, হিলিয়াম এবং মিথেন নেপচুনকে তার গভীর নীল রঙ দেয়। এটি সৌরজগতের সবচেয়ে দ্রুত এবং শক্তিশালী বায়ু অনুভব করে, যার গতি ঘণ্টায় ২,০০০ কিলোমিটারের বেশি পৌঁছায়।', discovery: '১৮৪৬ সালে আবিষ্কৃত। এর অস্তিত্ব গাণিতিকভাবে উরবেইন লে ভেরিয়ার এবং জন কাউচ অ্যাডামস দ্বারা ভবিষ্যদ্বাণী করা হয়েছিল, যা জোহান গ্যালে দ্বারা সরাসরি পর্যবেক্ষণের আগে।', funFacts: ['নেপচুনে একটি বছর প্রায় ১৬৫ পৃথিবী বছরের সমান। এটি তার আবিষ্কারের পর থেকে মাত্র একটি কক্ষপথ সম্পন্ন করেছে।', 'এটিতে গ্রেট ডার্ক স্পট নামে একটি বড় ঝড় ছিল, যা বৃহস্পতির মতোই, কিন্তু ১৯৯৪ সালের মধ্যে এটি অদৃশ্য হয়ে যায়।', 'এর বৃহত্তম চাঁদ, ট্রিটন, গ্রহটিকে পিছনের দিকে প্রদক্ষিণ করে এবং সৌরজগতের শীতলতম বস্তুগুলোর মধ্যে একটি।'] }
            ]
        };
        let planets = planetsData.en;
        const stars = Array.from({ length: 300 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.5, brightness: Math.random(), twinkleSpeed: Math.random() * 0.02 + 0.01, twinklePhase: Math.random() * Math.PI * 2 }));

        zoomSlider.addEventListener('input', e => (zoom = parseFloat(e.target.value), document.getElementById('zoomValue').textContent = zoom));
        speedSlider.addEventListener('input', e => (speed = parseFloat(e.target.value), document.getElementById('speedValue').textContent = `${speed.toFixed(1)}x`));
        rotationSlider.addEventListener('input', e => (autoRotation = parseFloat(e.target.value), document.getElementById('rotationValue').textContent = autoRotation.toFixed(2)));
        pauseBtn.addEventListener('click', () => { isPaused = !isPaused; const t = translations[currentLang]; document.getElementById('pauseText').textContent = isPaused ? t.resumeText : t.pauseText; });
        resetBtn.addEventListener('click', () => { zoom = 400; speed = 1; autoRotation = 0.3; cameraAngle = 0; cameraTilt = 0.3; zoomSlider.value = 400; speedSlider.value = 1; rotationSlider.value = 0.3; document.getElementById('zoomValue').textContent = '400'; document.getElementById('speedValue').textContent = '1.0x'; document.getElementById('rotationValue').textContent = '0.30'; });
        closeBtn.addEventListener('click', () => planetInfo.classList.remove('active'));

        // --- EVENT LISTENERS ---
        function handleDrag(dx, dy) { cameraAngle += dx * 0.005; cameraTilt = Math.max(-1.2, Math.min(1.2, cameraTilt + dy * 0.002)); }

        function handlePointerDown(x, y) {
            const target = document.elementFromPoint(x, y);
            if (target && target.closest('.ui-panel, .lang-btn')) return;
            isDragging = false; startX = x; startY = y;
            document.body.style.cursor = 'grabbing';
        }

        function handlePointerMove(x, y) {
            if (startX === 0) return;
            const deltaX = x - startX; const deltaY = y - startY;
            if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                isDragging = true; handleDrag(deltaX, deltaY); startX = x; startY = y;
            }
        }

        function handlePointerUp(x, y) {
            if (!isDragging) { handleCanvasClick(x, y); }
            startX = 0; startY = 0;
            document.body.style.cursor = 'grab';
        }

        canvas.addEventListener('mousedown', e => handlePointerDown(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', e => handlePointerUp(e.clientX, e.clientY));
        canvas.addEventListener('mouseleave', () => { startX = 0; startY = 0; });
        canvas.addEventListener('touchstart', e => handlePointerDown(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        canvas.addEventListener('touchend', e => handlePointerUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
        canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(150, Math.min(1500, zoom - e.deltaY * 0.5)); zoomSlider.value = zoom; document.getElementById('zoomValue').textContent = Math.round(zoom); }, { passive: false });

        function handleCanvasClick(clientX, clientY) {
            if (controlsPanel.classList.contains('is-open') && !controlsPanel.contains(document.elementFromPoint(clientX, clientY))) {
                controlsPanel.classList.remove('is-open');
            }
            const rect = canvas.getBoundingClientRect(); const clickX = clientX - rect.left; const clickY = clientY - rect.top;
            let planetClicked = false;
            const sortedPlanets = planets.map(p => ({ p, z: getPlanetPosition(p).z })).sort((a, b) => b.z - a.z);
            for (const item of sortedPlanets) {
                const planet = item.p; const pos = getPlanetPosition(planet);
                if (Math.hypot(clickX - pos.x, clickY - pos.y) < pos.size + 15) {
                    showPlanetInfo(planet); planetClicked = true; break;
                }
            }
            if (!planetClicked) { planetInfo.classList.remove('active'); }
        }

        function showPlanetInfo(planet) {
            const t = translations[currentLang];
            document.getElementById('planetName').textContent = planet.name;
            const container = document.getElementById('planetDetailsContainer');

            container.innerHTML = `
                <div class="info-section">
                    <h5 id="physicalTitle">📊 ${t.physicalTitle}</h5>
                    <div id="physicalInfo">
                        <div class="info-row"><span class="info-label">${t.diameter}</span><span class="info-value">${planet.diameter}</span></div>
                        <div class="info-row"><span class="info-label">${t.mass}</span><span class="info-value">${planet.mass}</span></div>
                        <div class="info-row"><span class="info-label">${t.gravity}</span><span class="info-value">${planet.gravity}</span></div>
                        <div class="info-row"><span class="info-label">${t.dayLength}</span><span class="info-value">${planet.dayLength}</span></div>
                        <div class="info-row"><span class="info-label">${t.yearLength}</span><span class="info-value">${planet.yearLength}</span></div>
                        <div class="info-row"><span class="info-label">${t.temperature}</span><span class="info-value">${planet.temperature}</span></div>
                        <div class="info-row"><span class="info-label">${t.moons}</span><span class="info-value">${planet.moons}</span></div>
                    </div>
                </div>
                <div class="info-section">
                    <h5 id="compositionTitle">🪐 ${t.compositionTitle}</h5>
                    <p><strong>Composition:</strong> ${planet.composition}</p>
                    <p><strong>Atmosphere:</strong> ${planet.atmosphere}</p>
                </div>
                <div class="info-section">
                    <h5 id="discoveryTitle">🔭 ${t.discoveryTitle}</h5>
                    <p>${planet.discovery}</p>
                </div>
                <div class="info-section fun-facts">
                    <h5 id="funFactsTitle">✨ ${t.funFactsTitle}</h5>
                    <ul>
                        ${planet.funFacts.map(fact => `<li>${fact}</li>`).join('')}
                    </ul>
                </div>
            `;
            planetInfo.classList.add('active');
        }

        const getPlanetPosition = p => { const cx = canvas.width / 2, cy = canvas.height / 2, ra = p.angle + cameraAngle, x = Math.cos(ra) * p.distance, z = Math.sin(ra) * p.distance, y = z * Math.sin(cameraTilt), s = zoom / (zoom + z); return { x: cx + x * s, y: cy + y * s, size: p.size * s, z: z }; };
        const drawStars = () => { stars.forEach(s => { s.twinklePhase += s.twinkleSpeed; const b = s.brightness * 0.5 + ((Math.sin(s.twinklePhase) + 1) / 2) * 0.5; ctx.fillStyle = `rgba(255, 255, 255, ${b})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); }); };
        const drawSun = () => { const cx = canvas.width / 2, cy = canvas.height / 2; const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50); g.addColorStop(0, 'rgba(255,215,0,0.8)'); g.addColorStop(0.5, 'rgba(255,140,0,0.4)'); g.addColorStop(1, 'rgba(255,69,0,0)'); ctx.fillStyle = g; ctx.fillRect(cx - 50, cy - 50, 100, 100); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill(); };
        const drawPlanet = p => { if (!isPaused) p.angle += p.speed * speed * 0.016; const pos = getPlanetPosition(p); if (pos.z < -zoom) return; const g = ctx.createRadialGradient(pos.x - pos.size * 0.4, pos.y - pos.size * 0.4, 0, pos.x, pos.y, pos.size * 1.2); g.addColorStop(0, p.color); g.addColorStop(1, '#000'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pos.x, pos.y, pos.size, 0, Math.PI * 2); ctx.fill(); if (p.rings) { ctx.save(); ctx.translate(pos.x, pos.y); ctx.strokeStyle = `rgba(218,185,127,0.6)`; ctx.lineWidth = 3 * (pos.size / 22); ctx.beginPath(); ctx.ellipse(0, 0, pos.size * 2.2, pos.size * 0.4, Math.PI / 10, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); } if (p.moon) { const ma = p.angle * 13, mx = pos.x + Math.cos(ma) * pos.size * 3, my = pos.y + Math.sin(ma) * pos.size * 1.5; ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.arc(mx, my, pos.size * 0.3, 0, Math.PI * 2); ctx.fill(); } };

        function animate() {
            const now = performance.now(); if (now - lastTime >= 1000) { fps = frameCount; fpsCounter.textContent = `FPS: ${fps}`; frameCount = 0; lastTime = now; } frameCount++;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars(); drawSun();
            const planetsWithDepth = planets.map(p => ({ p, z: getPlanetPosition(p).z })).sort((a, b) => a.z - b.z);
            planetsWithDepth.forEach(item => drawPlanet(item.p));
            if (!isDragging && !isPaused && startX === 0) cameraAngle += autoRotation * 0.001;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
