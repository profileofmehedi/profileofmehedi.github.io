<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বিল চেক করুন</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 0;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        overflow: hidden;
        max-width: 800px;
        width: 90%;
        margin: 2rem;
      }

      .header-section {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .header-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" fill="rgba(255,255,255,0.1)"><polygon points="1000,100 1000,0 0,100"/></svg>');
        background-size: cover;
      }

      .header-content {
        position: relative;
        z-index: 2;
      }

      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        font-size: 2rem;
        border: 3px solid rgba(255, 255, 255, 0.3);
      }

      .header-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header-subtitle {
        opacity: 0.9;
        font-size: 1.1rem;
      }

      .content-section {
        padding: 2.5rem;
      }

      .search-card {
        background: white;
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 2rem;
      }

      .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-control {
        border-radius: 12px;
        border: 2px solid #e9ecef;
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      }

      .btn-search {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        padding: 1rem 2rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        width: 100%;
      }

      .btn-search:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        color: white;
      }

      .btn-back {
        background: rgba(108, 117, 125, 0.1);
        border: 2px solid #6c757d;
        color: #6c757d;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-back:hover {
        background: #6c757d;
        color: white;
        text-decoration: none;
        transform: translateY(-1px);
      }

      .results-section {
        display: none;
      }

      .bill-card {
        background: white;
        border-radius: 15px;
        padding: 1.5rem;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 1rem;
        transition: all 0.3s ease;
      }

      .bill-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .bill-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .bill-id {
        font-size: 1.3rem;
        font-weight: 700;
        color: #2c3e50;
      }

      .bill-amount {
        font-size: 1.5rem;
        font-weight: 700;
        color: #667eea;
      }

      .bill-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .detail-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #6c757d;
      }

      .detail-value {
        font-weight: 600;
        color: #2c3e50;
      }

      .status-badge {
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status-paid {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
      }

      .status-pending {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
      }

      .status-overdue {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        color: white;
      }

      .no-bills {
        text-align: center;
        padding: 3rem 2rem;
        color: #6c757d;
      }

      .no-bills i {
        font-size: 4rem;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      .last-update {
        text-align: center;
        margin-top: 2rem;
        color: #6c757d;
        font-size: 0.9rem;
      }

      .alert {
        border-radius: 12px;
        border: none;
        padding: 1rem 1.5rem;
      }

      .loading {
        text-align: center;
        padding: 2rem;
        color: #6c757d;
      }

      .spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .main-container {
          margin: 1rem;
          width: calc(100% - 2rem);
        }

        .header-section {
          padding: 1.5rem;
        }

        .header-title {
          font-size: 1.5rem;
        }

        .content-section {
          padding: 1.5rem;
        }

        .search-card {
          padding: 1.5rem;
        }

        .bill-header {
          flex-direction: column;
          align-items: stretch;
          text-align: center;
        }

        .bill-details {
          grid-template-columns: 1fr;
        }

        .form-control {
          padding: 0.875rem 1rem;
          font-size: 1rem;
        }

        .btn-search {
          padding: 0.875rem 1.5rem;
          font-size: 1rem;
        }
      }

      /* Animation */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .bill-card {
        animation: fadeInUp 0.6s ease forwards;
      }

      .bill-card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .bill-card:nth-child(2) {
        animation-delay: 0.2s;
      }
      .bill-card:nth-child(3) {
        animation-delay: 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <!-- Header Section -->
      <div class="header-section">
        <div class="header-content">
          <div class="logo">
            <i class="fas fa-file-invoice-dollar"></i>
          </div>
          <h1 class="header-title">বিল চেক করুন</h1>
          <p class="header-subtitle">
            আপনার গ্রাহক আইডি দিয়ে সহজেই আপনার বিলের তথ্য দেখুন
          </p>
        </div>
      </div>

      <!-- Content Section -->
      <div class="content-section">
        <!-- Search Form -->
        <div class="search-card">
          <form id="billSearchForm">
            <div class="mb-3">
              <label for="customerId" class="form-label">
                <i class="fas fa-id-card"></i>
                গ্রাহক আইডি
              </label>
              <input
                type="text"
                class="form-control"
                id="customerId"
                placeholder="উদাহরণ: #1001 বা 1001"
                required
              />
              <div class="form-text">
                <i class="fas fa-info-circle me-1"></i>
                আপনার গ্রাহক আইডি লিখুন (# চিহ্ন সহ বা ছাড়া)
              </div>
            </div>
            <button type="submit" class="btn btn-search">
              <i class="fas fa-search me-2"></i>বিল খুঁজুন
            </button>
          </form>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading" style="display: none">
          <i class="fas fa-spinner spinner fa-2x mb-3"></i>
          <p>আপনার বিলের তথ্য খোঁজা হচ্ছে...</p>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3><i class="fas fa-list me-2"></i>আপনার বিলসমূহ</h3>
            <button class="btn btn-back" onclick="resetSearch()">
              <i class="fas fa-arrow-left"></i>নতুন খোঁজ
            </button>
          </div>

          <div id="billsContainer">
            <!-- Bills will be inserted here -->
          </div>

          <div class="last-update">
            <i class="fas fa-clock me-1"></i>
            <span id="lastUpdateTime"
              >সর্বশেষ আপডেট: ২৩ আগস্ট, ২০২৫ - সকাল ১০:৩০</span
            >
          </div>
        </div>

        <!-- Back to Login -->
        <div class="text-center mt-4">
          <a href="../login.html" class="btn btn-back">
            <i class="fas fa-sign-in-alt"></i>লগইন পেজে ফিরুন
          </a>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Sample bill data (in real app, this would come from an API)
      const billsDatabase = {
        1001: [
          {
            id: "101",
            amount: 100.0,
            dueDate: "2025-09-01",
            status: "paid",
            description: "মাসিক ইউটিলিটি বিল",
          },
          {
            id: "103",
            amount: 75.0,
            dueDate: "2025-08-20",
            status: "overdue",
            description: "ইন্টারনেট সেবা বিল",
          },
          {
            id: "104",
            amount: 50.0,
            dueDate: "2025-09-10",
            status: "pending",
            description: "পানি সেবা বিল",
          },
        ],
        1002: [
          {
            id: "102",
            amount: 150.0,
            dueDate: "2025-09-05",
            status: "pending",
            description: "বিদ্যুৎ বিল",
          },
        ],
        1003: [
          {
            id: "105",
            amount: 200.0,
            dueDate: "2025-09-15",
            status: "paid",
            description: "গ্যাস বিল",
          },
          {
            id: "106",
            amount: 120.0,
            dueDate: "2025-09-12",
            status: "pending",
            description: "টেলিফোন বিল",
          },
        ],
      };

      document
        .getElementById("billSearchForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const customerId = document.getElementById("customerId").value.trim();

          if (!customerId) {
            showAlert("danger", "গ্রাহক আইডি লিখুন।");
            return;
          }

          searchBills(customerId);
        });

      function searchBills(customerId) {
        // Clean the customer ID (remove # if present)
        const cleanId = customerId.replace("#", "");

        // Show loading state
        document.getElementById("loadingState").style.display = "block";
        document.getElementById("resultsSection").style.display = "none";

        // Simulate API call delay
        setTimeout(() => {
          document.getElementById("loadingState").style.display = "none";

          // Check if customer exists in database
          if (billsDatabase[cleanId]) {
            displayBills(billsDatabase[cleanId], cleanId);
          } else {
            displayNoBills(cleanId);
          }

          document.getElementById("resultsSection").style.display = "block";

          // Update last update time
          updateLastUpdateTime();
        }, 1500);
      }

      function displayBills(bills, customerId) {
        const container = document.getElementById("billsContainer");
        container.innerHTML = "";

        bills.forEach((bill, index) => {
          const billCard = createBillCard(bill, index);
          container.appendChild(billCard);
        });
      }

      function displayNoBills(customerId) {
        const container = document.getElementById("billsContainer");
        container.innerHTML = `
          <div class="no-bills">
            <i class="fas fa-inbox"></i>
            <h4>কোনো বিল পাওয়া যায়নি</h4>
            <p>গ্রাহক আইডি "#${customerId}" এর জন্য কোনো বিল খুঁজে পাওয়া যায়নি।</p>
            <p class="text-muted small">আইডি সঠিক আছে কিনা পুনরায় চেক করুন অথবা সাপোর্টের সাথে যোগাযোগ করুন।</p>
          </div>
        `;
      }

      function createBillCard(bill, index) {
        const card = document.createElement("div");
        card.className = "bill-card";
        card.style.animationDelay = `${index * 0.1}s`;

        const statusClass = getStatusClass(bill.status);
        const statusText = getStatusText(bill.status);
        const statusIcon = getStatusIcon(bill.status);

        card.innerHTML = `
          <div class="bill-header">
            <div class="bill-id">বিল #${bill.id}</div>
            <div class="bill-amount">৳${bill.amount.toFixed(2)}</div>
          </div>
          <div class="bill-details">
            <div class="detail-item">
              <i class="fas fa-calendar-alt"></i>
              <span>নির্ধারিত তারিখ:</span>
              <span class="detail-value">${bill.dueDate}</span>
            </div>
            <div class="detail-item">
              <i class="fas fa-info-circle"></i>
              <span>বিবরণ:</span>
              <span class="detail-value">${bill.description}</span>
            </div>
          </div>
          <div class="status-badge ${statusClass}">
            <i class="fas ${statusIcon}"></i>
            ${statusText}
          </div>
        `;

        return card;
      }

      function getStatusClass(status) {
        switch (status) {
          case "paid":
            return "status-paid";
          case "pending":
            return "status-pending";
          case "overdue":
            return "status-overdue";
          default:
            return "status-pending";
        }
      }

      function getStatusText(status) {
        switch (status) {
          case "paid":
            return "পরিশোধিত";
          case "pending":
            return "বকেয়া";
          case "overdue":
            return "বিলবহির্ভূত";
          default:
            return "অজানা";
        }
      }

      function getStatusIcon(status) {
        switch (status) {
          case "paid":
            return "fa-check-circle";
          case "pending":
            return "fa-clock";
          case "overdue":
            return "fa-exclamation-triangle";
          default:
            return "fa-question-circle";
        }
      }

      function resetSearch() {
        document.getElementById("resultsSection").style.display = "none";
        document.getElementById("customerId").value = "";
        document.getElementById("customerId").focus();

        // Remove any alerts
        const existingAlert = document.querySelector(".alert");
        if (existingAlert) {
          existingAlert.remove();
        }
      }

      function updateLastUpdateTime() {
        const now = new Date();
        const options = {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        };

        const formatter = new Intl.DateTimeFormat("bn-BD", options);
        const timeString = formatter.format(now);

        document.getElementById(
          "lastUpdateTime"
        ).textContent = `সর্বশেষ আপডেট: ${timeString}`;
      }

      function showAlert(type, message) {
        // Remove existing alert
        const existingAlert = document.querySelector(".alert");
        if (existingAlert) {
          existingAlert.remove();
        }

        const alert = document.createElement("div");
        alert.className = `alert alert-${type} alert-dismissible fade show`;
        alert.innerHTML = `
          <i class="fas fa-${
            type === "success" ? "check-circle" : "exclamation-triangle"
          } me-2"></i>
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;

        const form = document.getElementById("billSearchForm");
        form.insertBefore(alert, form.firstChild);

        // Auto remove after 5 seconds
        setTimeout(() => {
          if (alert.parentNode) {
            alert.remove();
          }
        }, 5000);
      }

      // Initialize last update time on page load
      updateLastUpdateTime();

      // Focus on input when page loads
      window.addEventListener("load", function () {
        document.getElementById("customerId").focus();
      });
    </script>
  </body>
</html>
