<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>নতুন বিল তৈরি</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .sidebar {
        height: 100vh;
        background-color: #343a40;
        color: #fff;
      }
      .sidebar .nav-link {
        color: #fff;
      }
      .sidebar .nav-link.active {
        background-color: #495057;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar">
          <div class="sidebar-sticky">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="admin_dashboard.html">
                  <i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="manage_customers.html">
                  <i class="fas fa-users"></i> গ্রাহক পরিচালনা
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="create_bill.html">
                  <i class="fas fa-file-invoice-dollar"></i> বিল তৈরি
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="view_bills.html">
                  <i class="fas fa-eye"></i> সকল বিল
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="login.html">
                  <i class="fas fa-sign-out-alt"></i> লগআউট
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2">নতুন বিল তৈরি করুন</h1>
          </div>

          <form id="createBillForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="customerSelect" class="form-label">গ্রাহক</label>
                <select class="form-select" id="customerSelect" required>
                  <option selected disabled value="">বাছাই করুন...</option>
                  <option value="1">John Doe</option>
                  <option value="2">Jane Smith</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="billingCycle" class="form-label"
                  >বিলিং সাইকেল</label
                >
                <select class="form-select" id="billingCycle" required>
                  <option selected disabled value="">বাছাই করুন...</option>
                  <option>দৈনিক</option>
                  <option>সাপ্তাহিক</option>
                  <option>মাসিক</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="amount" class="form-label">পরিমাণ</label>
              <input type="number" class="form-control" id="amount" required />
            </div>
            <div class="mb-3">
              <label for="dueDate" class="form-label">নির্ধারিত তারিখ</label>
              <input type="date" class="form-control" id="dueDate" required />
            </div>
            <button type="submit" class="btn btn-primary">বিল তৈরি করুন</button>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
