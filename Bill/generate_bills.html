<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বিল তৈরি</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .sidebar {
        height: 100vh;
        background-color: #343a40;
        color: #fff;
      }
      .sidebar .nav-link {
        color: #fff;
      }
      .sidebar .nav-link.active {
        background-color: #495057;
      }
      .generation-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar">
          <div class="sidebar-sticky">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="admin_dashboard.html">
                  <i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="manage_customers.html">
                  <i class="fas fa-users"></i> গ্রাহক পরিচালনা
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="generate_bills.html">
                  <i class="fas fa-cogs"></i> বিল তৈরি
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="view_bills.html">
                  <i class="fas fa-eye"></i> সকল বিল
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="login.html">
                  <i class="fas fa-sign-out-alt"></i> লগআউট
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2">ব্যাচ অনুযায়ী বিল তৈরি</h1>
          </div>

          <div class="generation-container text-center">
            <h3 class="mb-4">আজ নির্ধারিত সকল গ্রাহকের জন্য বিল তৈরি করুন।</h3>
            <p>
              নিচের বাটনে ক্লিক করলে সকল গ্রাহকের বিলিং সাইকেল ও তারিখ পরীক্ষা
              করে আজ যাদের বিল তৈরি করা প্রয়োজন তাদের জন্য বিল তৈরি করা হবে।
            </p>
            <button class="btn btn-success btn-lg" id="generateBillsBtn">
              <i class="fas fa-play-circle"></i> বিল তৈরি শুরু করুন
            </button>
            <div id="generationResult" class="mt-4"></div>
          </div>
        </main>
      </div>
    </div>

    <script>
      document
        .getElementById("generateBillsBtn")
        .addEventListener("click", function () {
          const resultDiv = document.getElementById("generationResult");
          resultDiv.innerHTML = `
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">লোড হচ্ছে...</span>
        </div>
        <p class="mt-2">বিল তৈরি করা হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</p>
      `;

          // Simulate a network request or heavy computation
          setTimeout(() => {
            // In a real app, you would check the current date against customer billing dates.
            // For this demo, we'll just show a success message.
            const generatedCount = Math.floor(Math.random() * 10) + 5; // Random number of bills
            resultDiv.innerHTML = `
          <div class="alert alert-success">
            <h4>ব্যাচ সম্পন্ন!</h4>
            <p>সফলভাবে <strong>${generatedCount}</strong> টি নতুন বিল তৈরি হয়েছে।</p>
            <p>এখন আপনি এগুলো <a href="view_bills.html">সকল বিল</a> পাতায় দেখতে পারবেন।</p>
          </div>
        `;
          }, 2000); // 2-second delay for simulation
        });
    </script>
  </body>
</html>
