<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parcel - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title">Create New Shipment</h4>
            <button class="btn btn-outline-secondary btn-sm" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card card-custom mb-4">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-primary">Shipment Details</h6>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <h6 class="text-muted small text-uppercase fw-bold mb-3">Sender Information</h6>
                                    <div class="mb-3">
                                        <label class="form-label">Merchant / Sender Name</label>
                                        <select class="form-select">
                                            <option selected>Select Merchant...</option>
                                            <option>Daraz BD Hub</option>
                                            <option>Pickaboo</option>
                                            <option>Individual Sender</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Pickup Phone</label>
                                        <input type="text" class="form-control" placeholder="017...">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Pickup Address</label>
                                        <textarea class="form-control" rows="2"></textarea>
                                    </div>
                                </div>
                                <div class="col-md-6 border-start">
                                    <h6 class="text-muted small text-uppercase fw-bold mb-3">Receiver Information</h6>
                                    <div class="mb-3">
                                        <label class="form-label">Receiver Name</label>
                                        <input type="text" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Receiver Phone</label>
                                        <input type="text" class="form-control" placeholder="017...">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Delivery District</label>
                                        <select class="form-select">
                                            <option>Dhaka City</option>
                                            <option>Chittagong</option>
                                            <option>Sylhet</option>
                                            <option>Khulna</option>
                                            <option>Rajshahi</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Detailed Address</label>
                                        <textarea class="form-control" rows="2"></textarea>
                                    </div>
                                </div>
                            </div>
                            
                            <hr class="my-4">

                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label">Weight (KG)</label>
                                    <input type="number" class="form-control" step="0.5" value="1">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Package Type</label>
                                    <select class="form-select">
                                        <option>Standard</option>
                                        <option>Fragile</option>
                                        <option>Liquid</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Cash on Delivery (Amount)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">৳</span>
                                        <input type="number" class="form-control" placeholder="0.00">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mt-4 text-end">
                                <button type="button" class="btn btn-light me-2">Cancel</button>
                                <button type="submit" class="btn btn-primary-custom px-4"><i class="fas fa-paper-plane"></i> Create Order</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card card-custom bg-light">
                    <div class="card-body">
                        <h6 class="font-weight-bold mb-3">Estimated Cost</h6>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Delivery Charge:</span>
                            <span class="fw-bold">৳ 60.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>COD Charge (1%):</span>
                            <span class="fw-bold">৳ 12.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Weight Charge:</span>
                            <span class="fw-bold">৳ 0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-0 fs-5 text-primary">
                            <span class="fw-bold">Total:</span>
                            <span class="fw-bold">৳ 72.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('booking');
        });
    </script>
</body>
</html>
