<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .login-header {
            background: #ff6d00;
            padding: 30px;
            text-align: center;
            color: white;
        }
        .btn-primary-custom {
            background-color: #ff6d00;
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background-color: #e65100;
        }
        .form-control:focus {
            border-color: #ff6d00;
            box-shadow: 0 0 0 0.25rem rgba(255, 109, 0, 0.25);
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-header">
            <h3><i class="fas fa-shipping-fast"></i> RapidCourier</h3>
            <p class="mb-0">Management System Login</p>
        </div>
        <div class="card-body p-4">
            <form action="dashboard.html">
                <div class="mb-3">
                    <label class="form-label text-muted">Email / ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" placeholder="admin@rapidcourier.bd" value="admin@rapidcourier.bd">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" value="123456">
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-primary-custom">LOG IN</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="tracking.html" class="text-decoration-none text-secondary small"><i class="fas fa-search"></i> Track a Parcel</a>
            </div>
        </div>
    </div>

</body>
</html>
