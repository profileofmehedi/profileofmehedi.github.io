<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <h4 class="page-title mb-4">System Configuration</h4>

        <div class="row">
            <div class="col-lg-3">
                <div class="list-group shadow-sm">
                    <a href="#" class="list-group-item list-group-item-action active border-0" style="background-color: var(--primary-color);">Delivery Charges</a>
                    <a href="#" class="list-group-item list-group-item-action border-0">Zone Management</a>
                    <a href="#" class="list-group-item list-group-item-action border-0">User Roles</a>
                    <a href="#" class="list-group-item list-group-item-action border-0">SMS & Notifications</a>
                    <a href="#" class="list-group-item list-group-item-action border-0">Company Info</a>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="card card-custom">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-dark">Delivery Charge Configuration</h6>
                    </div>
                    <div class="card-body">
                        <form>
                            <h6 class="text-muted small text-uppercase mb-3">General Rates (Up to 1KG)</h6>
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Inside Dhaka</label>
                                    <div class="input-group">
                                        <span class="input-group-text">৳</span>
                                        <input type="number" class="form-control" value="60">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Sub Dhaka</label>
                                    <div class="input-group">
                                        <span class="input-group-text">৳</span>
                                        <input type="number" class="form-control" value="100">
                                    </div>
                                    <small class="text-muted">Savar, Gazipur, Keraniganj</small>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Outside Dhaka</label>
                                    <div class="input-group">
                                        <span class="input-group-text">৳</span>
                                        <input type="number" class="form-control" value="130">
                                    </div>
                                </div>
                            </div>

                            <h6 class="text-muted small text-uppercase mb-3">Additional Charges</h6>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Extra Weight Charge (Per KG)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">৳</span>
                                        <input type="number" class="form-control" value="20">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">COD Charge (%)</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" value="1">
                                        <span class="input-group-text">%</span>
                                    </div>
                                    <small class="text-muted">1% of the collected amount</small>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary-custom">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('settings');
        });
    </script>
</body>
</html>
