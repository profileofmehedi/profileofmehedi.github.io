<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <h4 class="page-title mb-4" data-i18n="reports_title">Analytics & Reports</h4>

        <div class="row">
            <!-- Filter Section -->
            <div class="col-12 mb-4">
                <div class="card card-custom">
                    <div class="card-body">
                        <h6 class="card-title text-muted mb-3" data-i18n="generate_report">Generate Report</h6>
                        <form class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label small" data-i18n="report_type">Report Type</label>
                                <select class="form-select">
                                    <option>Delivery Performance</option>
                                    <option>Financial Statement</option>
                                    <option>Rider Activity</option>
                                    <option>Merchant Sales</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small" data-i18n="date_range">Date Range</label>
                                <select class="form-select">
                                    <option>Today</option>
                                    <option>This Week</option>
                                    <option>This Month</option>
                                    <option>Custom Range</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small" data-i18n="zone">Zone/Area</label>
                                <select class="form-select">
                                    <option>All Zones</option>
                                    <option>Dhaka City</option>
                                    <option>Outside Dhaka</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button type="button" class="btn btn-primary-custom w-100"><i class="fas fa-download"></i> <span data-i18n="export_pdf">Export PDF</span></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="col-lg-6 mb-4">
                <div class="card card-custom h-100">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-dark" data-i18n="revenue_expense">Monthly Revenue vs Expense</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="revenueChart" height="200"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-6 mb-4">
                <div class="card card-custom h-100">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-dark" data-i18n="delivery_success_rate">Delivery Success Rate (By Zone)</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="zoneChart" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('reports');

            // Revenue Chart
            new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [
                        {
                            label: 'Revenue',
                            data: [12000, 19000, 3000, 5000, 2000, 3000],
                            backgroundColor: '#ff6d00'
                        },
                        {
                            label: 'Expense',
                            data: [8000, 12000, 2000, 3000, 1500, 2000],
                            backgroundColor: '#263238'
                        }
                    ]
                }
            });

            // Zone Chart
            new Chart(document.getElementById('zoneChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Inside Dhaka', 'Sub Dhaka', 'Outside Dhaka'],
                    datasets: [{
                        data: [65, 20, 15],
                        backgroundColor: ['#28a745', '#ffc107', '#17a2b8']
                    }]
                }
            });
        });
    </script>
</body>
</html>
