<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <!-- Stats -->
        <div class="row mb-4">
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card card-custom stat-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted text-uppercase mb-1" data-i18n="total_parcels">Total Parcels</h6>
                                <h3 class="fw-bold mb-0" id="totalParcels">0</h3>
                            </div>
                            <div class="stat-icon"><i class="fas fa-box"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card card-custom stat-card success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted text-uppercase mb-1" data-i18n="delivered_today">Delivered Today</h6>
                                <h3 class="fw-bold mb-0 text-success" id="deliveredCount">0</h3>
                            </div>
                            <div class="stat-icon text-success bg-success bg-opacity-10"><i class="fas fa-check-circle"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card card-custom stat-card info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted text-uppercase mb-1" data-i18n="in_transit">In Transit</h6>
                                <h3 class="fw-bold mb-0 text-info" id="transitCount">0</h3>
                            </div>
                            <div class="stat-icon text-info bg-info bg-opacity-10"><i class="fas fa-truck"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card card-custom stat-card warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted text-uppercase mb-1" data-i18n="cod_earnings">COD Earnings</h6>
                                <h3 class="fw-bold mb-0 text-warning" id="earningsCount">৳0</h3>
                            </div>
                            <div class="stat-icon text-warning bg-warning bg-opacity-10"><i class="fas fa-hand-holding-usd"></i></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts & Lists -->
        <div class="row">
            <!-- Weekly Deliveries Chart -->
            <div class="col-lg-8 mb-4">
                <div class="card card-custom mb-4">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-dark" data-i18n="weekly_performance">Weekly Delivery Performance</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="deliveryChart" height="100"></canvas>
                    </div>
                </div>
            </div>

            <!-- Top Riders -->
            <div class="col-lg-4 mb-4">
                <div class="card card-custom mb-4">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-dark" data-i18n="top_riders">Top Performing Riders</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <div class="list-group-item d-flex align-items-center border-0 mb-2">
                                <img src="https://ui-avatars.com/api/?name=Al+Amin&background=ff6d00&color=fff" class="rounded-circle me-3" width="40">
                                <div class="flex-grow-1">
                                    <h6 class="mb-0">Md. Al-Amin</h6>
                                    <small class="text-muted">Dhaka North</small>
                                </div>
                                <span class="badge bg-success rounded-pill">98%</span>
                            </div>
                            <div class="list-group-item d-flex align-items-center border-0 mb-2">
                                <img src="https://ui-avatars.com/api/?name=Sujon+Ahmed&background=17a2b8&color=fff" class="rounded-circle me-3" width="40">
                                <div class="flex-grow-1">
                                    <h6 class="mb-0">Sujon Ahmed</h6>
                                    <small class="text-muted">Dhaka South</small>
                                </div>
                                <span class="badge bg-primary rounded-pill">95%</span>
                            </div>
                            <div class="list-group-item d-flex align-items-center border-0">
                                <img src="https://ui-avatars.com/api/?name=Rafiq+Islam&background=dc3545&color=fff" class="rounded-circle me-3" width="40">
                                <div class="flex-grow-1">
                                    <h6 class="mb-0">Rafiq Islam</h6>
                                    <small class="text-muted">Chittagong</small>
                                </div>
                                <span class="badge bg-info rounded-pill">92%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Orders Table -->
        <div class="card card-custom">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-dark" data-i18n="recent_shipments">Recent Shipments</h6>
                <a href="parcel_list.html" class="btn btn-sm btn-outline-primary" data-i18n="view_all">View All</a>
            </div>
            <div class="table-responsive">
                <table class="table table-custom align-middle mb-0">
                    <thead>
                        <tr>
                            <th data-i18n="trk_id">Tracking ID</th>
                            <th data-i18n="sender">Sender</th>
                            <th data-i18n="receiver">Receiver</th>
                            <th data-i18n="route">Route</th>
                            <th data-i18n="status">Status</th>
                            <th data-i18n="amount">Amount</th>
                            <th data-i18n="date">Date</th>
                        </tr>
                    </thead>
                    <tbody id="recentTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('dashboard');

            // Load Stats
            const stats = CourierDB.getStats();
            document.getElementById('totalParcels').innerText = stats.total_parcels;
            document.getElementById('deliveredCount').innerText = stats.delivered;
            document.getElementById('transitCount').innerText = stats.transit;
            document.getElementById('earningsCount').innerText = App.formatCurrency(stats.earnings);

            // Load Table
            const tbody = document.getElementById('recentTableBody');
            CourierDB.parcels.slice(0, 5).forEach(p => {
                const tr = `
                <tr>
                    <td><span class="fw-bold text-primary">${p.id}</span></td>
                    <td>${p.sender}</td>
                    <td>${p.receiver}</td>
                    <td><small>${p.from} <i class="fas fa-arrow-right mx-1 text-muted"></i> ${p.to}</small></td>
                    <td>${App.getStatusBadge(p.status)}</td>
                    <td>${App.formatCurrency(p.amount)}</td>
                    <td>${p.date}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', tr);
            });

            // Chart
            const ctx = document.getElementById('deliveryChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                    datasets: [{
                        label: 'Deliveries',
                        data: [65, 59, 80, 81, 56, 120, 100],
                        borderColor: '#ff6d00',
                        backgroundColor: 'rgba(255, 109, 0, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        });
    </script>
</body>
</html>
