<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Payroll - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <h4 class="page-title mb-4" data-i18n="payroll_title">Rider Payroll & Commission</h4>

        <div class="row">
            <div class="col-12">
                <div class="card card-custom mb-4">
                    <div class="card-body">
                        <form class="row align-items-end g-3">
                            <div class="col-md-3">
                                <label class="form-label">Month</label>
                                <select class="form-select">
                                    <option>January 2026</option>
                                    <option>December 2025</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Rider</label>
                                <select class="form-select">
                                    <option>All Riders</option>
                                    <option>Md. Al-Amin</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-primary-custom w-100" data-i18n="generate_sheet">Generate Sheet</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card card-custom">
            <div class="card-header bg-white py-3 border-0">
                <h6 class="m-0 font-weight-bold text-dark">Commission Sheet (Jan 2026)</h6>
            </div>
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle">
                    <thead class="bg-light">
                        <tr>
                            <th>Rider ID</th>
                            <th>Name</th>
                            <th>Deliveries</th>
                            <th>Pickups</th>
                            <th data-i18n="comm_rate">Comm. Rate</th>
                            <th data-i18n="fuel_allow">Fuel Allow.</th>
                            <th data-i18n="total_payable">Total Payable</th>
                            <th data-i18n="status">Status</th>
                            <th data-i18n="actions">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>R-01</td>
                            <td>Md. Al-Amin</td>
                            <td>450</td>
                            <td>50</td>
                            <td>৳ 15/pkt</td>
                            <td>৳ 2,000</td>
                            <td class="fw-bold text-success">৳ 9,500</td>
                            <td><span class="badge bg-warning text-dark">Unpaid</span></td>
                            <td><button class="btn btn-sm btn-primary-custom" data-i18n="pay_now">Pay Now</button></td>
                        </tr>
                        <tr>
                            <td>R-02</td>
                            <td>Sujon Ahmed</td>
                            <td>320</td>
                            <td>20</td>
                            <td>৳ 15/pkt</td>
                            <td>৳ 1,500</td>
                            <td class="fw-bold text-success">৳ 6,600</td>
                            <td><span class="badge bg-success">Paid</span></td>
                            <td><button class="btn btn-sm btn-secondary" disabled>Paid</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('payroll');
        });
    </script>
</body>
</html>
