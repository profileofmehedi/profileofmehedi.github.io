<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Shipments - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title" data-i18n="parcel_management">Parcel Management</h4>
            <a href="booking.html" class="btn btn-primary-custom"><i class="fas fa-plus"></i> <span data-i18n="new_parcel">New Parcel</span></a>
        </div>

        <div class="card card-custom">
            <div class="card-body">
                <!-- Filters -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="Search Tracking ID..." data-i18n="search_placeholder">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="" data-i18n="all_statuses">All Statuses</option>
                            <option>Pending</option>
                            <option>In Transit</option>
                            <option>Delivered</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="" data-i18n="all_merchants">All Merchants</option>
                            <option>Daraz BD</option>
                            <option>Pickaboo</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-light w-100"><i class="fas fa-filter"></i> <span data-i18n="apply_filters">Apply Filters</span></button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th data-i18n="trk_id">Tracking ID</th>
                                <th data-i18n="date">Date</th>
                                <th data-i18n="sender_merchant">Merchant/Sender</th>
                                <th data-i18n="receiver_info">Receiver Info</th>
                                <th data-i18n="status">Status</th>
                                <th data-i18n="cod_amount">COD Amount</th>
                                <th data-i18n="actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="parcelTableBody">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">Next</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Parcel Details Modal -->
    <div class="modal fade" id="parcelDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="shipment_details">Shipment Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="parcelDetailsContent">
                    <!-- Populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="back">Close</button>
                    <button type="button" class="btn btn-primary-custom" id="printLabelBtn"><i class="fas fa-print"></i> <span data-i18n="print_list">Print Label</span></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('parcels');
            renderParcels();
        });

        function renderParcels() {
            const tbody = document.getElementById('parcelTableBody');
            tbody.innerHTML = '';
            
            CourierDB.parcels.forEach(p => {
                const tr = `
                <tr>
                    <td>
                        <span class="fw-bold text-primary">${p.id}</span>
                        <div class="small text-muted">${p.type}</div>
                    </td>
                    <td>${p.date}</td>
                    <td>
                        <div class="fw-bold">${p.sender}</div>
                        <small class="text-muted">${p.from}</small>
                    </td>
                    <td>
                        <div class="fw-bold">${p.receiver}</div>
                        <small class="text-muted">${p.to}</small>
                    </td>
                    <td>${App.getStatusBadge(p.status)}</td>
                    <td>${App.formatCurrency(p.amount)}</td>
                    <td>
                        <button class="btn btn-sm btn-light text-primary" onclick="viewParcel('${p.id}')" title="View"><i class="fas fa-eye"></i></button>
                        <button class="btn btn-sm btn-light text-success" onclick="printParcel('${p.id}')" title="Print Label"><i class="fas fa-print"></i></button>
                        <button class="btn btn-sm btn-light text-danger" title="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', tr);
            });
        }

        function viewParcel(id) {
            const p = CourierDB.parcels.find(x => x.id === id);
            if (!p) return;

            const content = `
                <div class="row">
                    <div class="col-md-6 border-end">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">${Localization.getText('sender_info')}</h6>
                        <p class="mb-1"><strong>${p.sender}</strong></p>
                        <p class="text-muted small"><i class="fas fa-map-marker-alt"></i> ${p.from} Hub</p>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">${Localization.getText('receiver_info')}</h6>
                        <p class="mb-1"><strong>${p.receiver}</strong></p>
                        <p class="text-muted small"><i class="fas fa-map-marker-alt"></i> ${p.to}</p>
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-md-4">
                        <p class="text-muted mb-0 small">${Localization.getText('status')}</p>
                        <p>${App.getStatusBadge(p.status)}</p>
                    </div>
                    <div class="col-md-4">
                        <p class="text-muted mb-0 small">${Localization.getText('amount')}</p>
                        <p class="fw-bold text-primary">${App.formatCurrency(p.amount)}</p>
                    </div>
                    <div class="col-md-4">
                        <p class="text-muted mb-0 small">${Localization.getText('date')}</p>
                        <p>${p.date}</p>
                    </div>
                </div>
                <div class="mt-3 p-3 bg-light rounded">
                    <h6 class="small fw-bold">Current Tracking Location</h6>
                    <p class="mb-0 small"><i class="fas fa-truck text-primary me-2"></i> At Sorting Center - ${p.to}</p>
                </div>
            `;

            document.getElementById('parcelDetailsContent').innerHTML = content;
            document.getElementById('printLabelBtn').onclick = () => printParcel(id);
            
            const modal = new bootstrap.Modal(document.getElementById('parcelDetailsModal'));
            modal.show();
        }

        function printParcel(id) {
            // In a real app, this would pass the ID. Here we just open the invoice.
            window.location.href = 'invoice.html';
        }
    </script>
</body>
</html>
