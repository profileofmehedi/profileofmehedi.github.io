<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing - RapidCourier BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title" data-i18n="marketing_title">Marketing & Promotions</h4>
            <button class="btn btn-primary-custom"><i class="fas fa-tag"></i> <span data-i18n="create_promo">Create Promo Code</span></button>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card card-custom">
                    <div class="card-header bg-white py-3 border-0">
                        <h6 class="m-0 font-weight-bold text-dark" data-i18n="active_campaigns">Active Campaigns</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-custom table-hover align-middle">
                            <thead>
                                <tr>
                                    <th data-i18n="promo_code">Promo Code</th>
                                    <th data-i18n="discount">Discount</th>
                                    <th data-i18n="valid_until">Valid Until</th>
                                    <th data-i18n="usage">Usage</th>
                                    <th data-i18n="status">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><span class="badge bg-light text-primary border border-primary px-3 py-2">NEWYEAR26</span></td>
                                    <td>10% Off</td>
                                    <td>Jan 31, 2026</td>
                                    <td>1,200 times</td>
                                    <td><span class="badge bg-success">Active</span></td>
                                </tr>
                                <tr>
                                    <td><span class="badge bg-light text-dark border px-3 py-2">FREESHIP</span></td>
                                    <td>Free Delivery</td>
                                    <td>Feb 14, 2026</td>
                                    <td>50 times</td>
                                    <td><span class="badge bg-success">Active</span></td>
                                </tr>
                                 <tr>
                                    <td><span class="badge bg-light text-secondary border px-3 py-2">DHAKA50</span></td>
                                    <td>Flat 50TK</td>
                                    <td>Dec 31, 2025</td>
                                    <td>5,000 times</td>
                                    <td><span class="badge bg-secondary">Expired</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card card-custom bg-light">
                    <div class="card-body">
                        <h6><i class="fas fa-bullhorn text-primary"></i> <span data-i18n="bulk_sms">Bulk SMS Marketing</span></h6>
                        <p class="small text-muted">Send offers to inactive merchants.</p>
                        <form>
                            <div class="mb-3">
                                <label class="form-label small" data-i18n="target_audience">Target Audience</label>
                                <select class="form-select form-select-sm">
                                    <option>Inactive (30 Days)</option>
                                    <option>Top Merchants</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small" data-i18n="message_content">Message</label>
                                <textarea class="form-control" rows="3" placeholder="We miss you! Use code COMEBACK for..."></textarea>
                            </div>
                            <button class="btn btn-dark w-100 btn-sm" data-i18n="send_blast">Send Blast</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init('marketing');
        });
    </script>
</body>
</html>
