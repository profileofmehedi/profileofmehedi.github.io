<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPUS Micro-DPS | Local Sandbox</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --success: #10b981;
            --get-color: #0ea5e9;
            --post-color: #10b981;
            --code-bg: #1e293b;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: #334155;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e293b;
            flex-shrink: 0;
        }

        .brand {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-container { flex: 1; overflow-y: auto; padding: 20px 0; }
        
        .nav-category {
            padding: 15px 20px 5px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #475569;
        }

        .nav-item {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.85rem;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }
        .nav-item:hover { background: #1e293b; color: white; }
        .nav-item.active { background: #1e293b; color: white; border-left-color: var(--primary); }
        
        .method-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            min-width: 40px;
            text-align: center;
        }
        .m-GET { background: rgba(14, 165, 233, 0.2); color: var(--get-color); }
        .m-POST { background: rgba(16, 185, 129, 0.2); color: var(--post-color); }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .top-header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .env-config {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .base-url-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 4px;
            color: #64748b;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-config {
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-config:hover { text-decoration: underline; }

        .content-area { padding: 30px; overflow-y: auto; flex: 1; }

        /* API Card */
        .api-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .api-card.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .ep-title { font-size: 1.25rem; font-weight: 600; color: #1e293b; display: flex; gap: 10px; align-items: center; }
        .ep-desc { color: #64748b; margin-top: 5px; font-size: 0.9rem; }

        /* Console Area */
        .console-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        
        .console-toolbar {
            padding: 10px 20px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            min-height: 0;
        }

        .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .pane:last-child { border-right: none; }

        .pane-header {
            background: #f1f5f9;
            padding: 8px 15px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs { display: flex; gap: 5px; }
        .tab {
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            background: #e2e8f0;
            transition: 0.2s;
        }
        .tab:hover { background: #cbd5e1; }
        .tab.active { background: white; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        .editor {
            flex: 1;
            background: var(--code-bg);
            color: #e2e8f0;
            border: none;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            resize: none;
            line-height: 1.5;
        }
        .editor:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Button */
        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: 0.2s;
        }
        .btn-send:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-send:active { transform: translateY(0); }
        .btn-send:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        .btn-mini {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            color: #475569;
            margin-right: 10px;
        }
        .btn-mini:hover { background: #d1d5db; color: #1e293b; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        
        .modal {
            background: white; width: 550px; padding: 25px;
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .modal h3 { margin-top: 0; color: #1e293b; }
        .input-group { margin: 15px 0; }
        .input-group label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

        /* Utility */
        .hidden { display: none !important; }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-steps { font-size: 0.8rem; color: #64748b; margin-left: 15px; font-family: 'JetBrains Mono', monospace; }
        .step { opacity: 0.3; }
        .step.active { opacity: 1; color: var(--primary); font-weight: 600; }
        
        .path-preview {
            background: #f8fafc; border: 1px solid var(--border); padding: 8px; border-radius: 4px;
            font-size: 0.75rem; color: #64748b; margin-top: 10px; font-family: 'JetBrains Mono', monospace;
        }
        .preview-label { font-weight: 700; color: #475569; display:block; margin-bottom:4px; }
    </style>
</head>
<body>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="configModal">
        <div class="modal">
            <h3>Environment Configuration</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">
                Configure the <strong>Application Base URL</strong>. The system will automatically append <code>/api</code> for endpoints.
            </p>
            <div class="input-group">
                <label>App Base URL</label>
                <input type="text" id="hostInput" placeholder="https://dpsapi-primebank.opuserp.com/dps/dps-prime">
                
                <div class="path-preview">
                    <span class="preview-label">Business API Preview:</span>
                    <span id="previewMain"></span>/MfsDPS/...
                </div>
                <div class="path-preview">
                    <span class="preview-label">Crypto API Preview:</span>
                    <span id="previewCrypto"></span>/Crypto/encrypt
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn-save" onclick="saveSettings()">Save Configuration</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="brand">
            <i class="fas fa-layer-group"></i> Prime Bank DPS
        </div>
        <div class="nav-container" id="navContainer">
            <!-- Generated via JS -->
        </div>
    </div>

    <div class="main">
        <div class="top-header">
            <div>
                <h2 style="font-size: 1.2rem; margin-bottom: 4px;">Local Sandbox</h2>
                <div class="env-config">
                    <div class="base-url-display">
                        <i class="fas fa-globe"></i>
                        <span id="baseUrlDisplay">Loading...</span>
                    </div>
                    <button class="btn-config" onclick="openSettings()"><i class="fas fa-cog"></i> Configure</button>
                </div>
            </div>
            <div style="text-align: right;">
                <span style="font-size: 0.75rem; color: #64748b;">Crypto Engine</span><br>
                <strong style="color: var(--success); font-size: 0.85rem;"><i class="fas fa-shield-alt"></i> Server-Side</strong>
            </div>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Cards Generated via JS -->
        </div>
    </div>

    <script>
        // ==========================================
        // DYNAMIC CONFIGURATION
        // ==========================================
        const DEFAULT_BASE_URL = "https://dpsapi-primebank.opuserp.com/dps/dps-prime";
        const STORAGE_KEY = "opus_dps_base_v3";

        let currentBaseUrl = localStorage.getItem(STORAGE_KEY) || DEFAULT_BASE_URL;

        function updateUrlDisplay() {
            document.getElementById('baseUrlDisplay').innerText = currentBaseUrl;
            document.getElementById('hostInput').value = currentBaseUrl;
            updatePreview();
        }

        function updatePreview() {
            const val = document.getElementById('hostInput').value || "";
            // We append /api to the base URL provided by the user
            const apiUrl = val + (val.endsWith('/') ? 'api' : '/api');
            
            document.getElementById('previewMain').innerText = apiUrl;
            document.getElementById('previewCrypto').innerText = apiUrl;
        }

        document.getElementById('hostInput').addEventListener('input', updatePreview);

        function openSettings() {
            document.getElementById('configModal').classList.add('open');
            updateUrlDisplay();
        }

        function closeSettings() {
            document.getElementById('configModal').classList.remove('open');
        }

        function saveSettings() {
            let newUrl = document.getElementById('hostInput').value.trim();
            if(newUrl.endsWith('/')) newUrl = newUrl.slice(0, -1);
            
            if(newUrl) {
                currentBaseUrl = newUrl;
                localStorage.setItem(STORAGE_KEY, currentBaseUrl);
                updateUrlDisplay();
                closeSettings();
            }
        }

        // ==========================================
        // API DEFINITIONS
        // ==========================================
        const apiData = [
            {
                category: "Product",
                endpoints: [
                    { id: "get-products", method: "GET", url: "/Product/get-all-products", desc: "Get all available DPS products" },
                    { id: "get-relations", method: "GET", url: "/Product/get-all-relations", desc: "Get nominee relationship types" }
                ]
            },
            {
                category: "Calculation & Creation",
                endpoints: [
                    { 
                        id: "maturity-calc", 
                        method: "POST", 
                        url: "/MfsDPS/GetDPSMaturityAmount", 
                        desc: "Calculate maturity amount",
                        body: { "productCode": "D5020", "dpsAmount": 5000 }
                    },
                    { 
                        id: "create-account", 
                        method: "POST", 
                        url: "/MfsDPS/create", 
                        desc: "Create a new DPS Account",
                        body: {
							"Customer": {
								"NidNo": "19876543210987654",
								"FatherName": "Abul",
								"MobileNo": "01700000000",
								"DpsAmount": 5000,
								"DateOfBirth": "2000-01-01",
								"Gender": "Male"
							},
							"Account": {
								"ProductCode": "D5056",
								"AccountTitle": "My Savings",
								"Tenure": "2 Years"
							},
							"Nominees": [{
								"NomineeName": "Rahim",
								"Relation": "Brother",
								"NomineeNID": "34543522",
								"NomineeDOB": "2000-01-02",
								"NomineeShare": 100,
								"IsMinor": false
							}]
						}
                    }
                ]
            },
            {
                category: "Account Info",
                endpoints: [
                    { id: "get-by-nid", method: "POST", url: "/MfsDPS/GetAccountsByNID", desc: "Get accounts list by NID", body: { "NidNo": "19876543210987654" } },
                    { id: "get-details", method: "POST", url: "/MfsDPS/GetDPSAccountByAccountNo", desc: "Get single account detail", body: { "AccountNo": "000000" } },
                    { id: "get-schedule", method: "POST", url: "/MfsDPS/GetDPSScheduleByAccountNo", desc: "Get payment schedule", body: { "AccountNo": "000000" } }
                ]
            },
            {
                category: "Transaction",
                endpoints: [
                    { id: "payment", method: "POST", url: "/MfsDPS/payment", desc: "Make installment payment", body: { "customerAccountNo": "123", "transactionId": "TXN01", "paymentAmount": 5000 } },
                    { id: "encashment", method: "POST", url: "/MfsDPS/encashment", desc: "Close account", body: { "customerAccountNo": "123", "mfsType": "bkash", "mfsNumber": "017000" } }
                ]
            }
        ];

        // ==========================================
        // UI GENERATION
        // ==========================================
        const navContainer = document.getElementById('navContainer');
        const contentArea = document.getElementById('contentArea');

        function init() {
            updateUrlDisplay();

            apiData.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'nav-category';
                header.innerText = cat.category;
                navContainer.appendChild(header);

                cat.endpoints.forEach(ep => {
                    const item = document.createElement('div');
                    item.className = 'nav-item';
                    item.dataset.id = ep.id;
                    item.innerHTML = `<span class="method-badge m-${ep.method}">${ep.method}</span> ${ep.id}`;
                    item.onclick = () => activateEndpoint(ep.id);
                    navContainer.appendChild(item);

                    createCard(ep);
                });
            });

            if(apiData.length > 0) activateEndpoint(apiData[0].endpoints[0].id);
        }

        function createCard(ep) {
            const card = document.createElement('div');
            card.className = 'api-card';
            card.id = `card-${ep.id}`;
            
            const isPost = ep.method === 'POST';
            const bodyJson = ep.body ? JSON.stringify(ep.body, null, 4) : '';

            card.innerHTML = `
                <div class="card-header">
                    <div class="ep-title">
                        <span class="method-badge m-${ep.method}" style="font-size: 1rem;">${ep.method}</span>
                        ${ep.url}
                    </div>
                    <div class="ep-desc">${ep.desc}</div>
                </div>

                <div class="console-wrapper">
                    <div class="console-toolbar">
                        <div style="font-weight: 600; font-size: 0.9rem;">
                            <i class="fas fa-terminal"></i> Console
                            <span id="status-${ep.id}" class="status-steps"></span>
                        </div>
                        <button class="btn-send" onclick="handleSend('${ep.id}', '${ep.method}', '${ep.url}')" id="btn-${ep.id}">
                            <span>Send Request</span> <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>

                    <div class="console-grid">
                        <div class="pane">
                            <div class="pane-header">
                                <span>Request</span>
                                <div class="tabs">
                                    <span class="tab active" onclick="switchTab('${ep.id}', 'req', 'body')">Body</span>
                                    ${isPost ? `<span class="tab" onclick="switchTab('${ep.id}', 'req', 'enc')">Encrypted</span>` : ''}
                                </div>
                            </div>
                            <textarea id="req-body-${ep.id}" class="editor" spellcheck="false" ${!isPost ? 'disabled placeholder="No Body required for GET"' : ''}>${bodyJson}</textarea>
                            <textarea id="req-enc-${ep.id}" class="editor hidden" readonly placeholder="Encrypted payload will appear here after sending..."></textarea>
                        </div>

                        <div class="pane">
                            <div class="pane-header">
                                <span>Response</span>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <button class="btn-mini" onclick="manualDecrypt('${ep.id}')" title="Decrypt Raw Content"><i class="fas fa-unlock"></i> Decrypt</button>
                                    <div class="tabs">
                                        <span class="tab active" onclick="switchTab('${ep.id}', 'res', 'dec')">Decrypted</span>
                                        <span class="tab" onclick="switchTab('${ep.id}', 'res', 'raw')">Raw</span>
                                    </div>
                                </div>
                            </div>
                            <textarea id="res-dec-${ep.id}" class="editor" readonly placeholder="// Response will appear here..."></textarea>
                            <textarea id="res-raw-${ep.id}" class="editor hidden" readonly placeholder="// Raw encrypted response..."></textarea>
                        </div>
                    </div>
                </div>
            `;
            contentArea.appendChild(card);
        }

        function activateEndpoint(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-id="${id}"]`).classList.add('active');
            
            document.querySelectorAll('.api-card').forEach(el => el.classList.remove('active'));
            document.getElementById(`card-${id}`).classList.add('active');
        }

        function switchTab(id, type, mode) {
            const container = document.getElementById(`card-${id}`);
            const header = type === 'req' ? container.querySelectorAll('.pane')[0] : container.querySelectorAll('.pane')[1];
            
            header.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            if(type === 'req') {
                document.getElementById(`req-body-${id}`).classList.add('hidden');
                document.getElementById(`req-enc-${id}`).classList.add('hidden');
                document.getElementById(`req-${mode}-${id}`).classList.remove('hidden');
            } else {
                document.getElementById(`res-dec-${id}`).classList.add('hidden');
                document.getElementById(`res-raw-${id}`).classList.add('hidden');
                document.getElementById(`res-${mode}-${id}`).classList.remove('hidden');
            }
        }

        // ==========================================
        // LOGIC ENGINE
        // ==========================================
        
        // Helper to extract encrypted string from various JSON formats
        function extractEncryptedString(data) {
            if (typeof data === 'string') return data;
            if (data.Data && typeof data.Data === 'string') return data.Data;
            if (data.encryptedText && typeof data.encryptedText === 'string') return data.encryptedText;
            return null;
        }

        async function manualDecrypt(id) {
            const rawVal = document.getElementById(`res-raw-${id}`).value;
            if (!rawVal) {
                alert("No raw response data to decrypt.");
                return;
            }

            const resDecEl = document.getElementById(`res-dec-${id}`);
            resDecEl.value = "// Manually decrypting...";
            
            // Force switch to decrypted tab
            switchTab(id, 'res', 'dec');
            // Hacky way to set active tab UI
            const container = document.getElementById(`card-${id}`);
            const header = container.querySelectorAll('.pane')[1];
            header.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            header.querySelectorAll('.tab')[0].classList.add('active');

            try {
                let parsed;
                try { parsed = JSON.parse(rawVal); } catch(e) { parsed = rawVal; }

                const encryptedStr = extractEncryptedString(parsed);
                
                if(!encryptedStr) {
                    resDecEl.value = "Could not identify an encrypted string in the Raw response.\nExpected 'Data' field or raw string.";
                    return;
                }

                const apiBase = currentBaseUrl + '/api';
                const cryptoDecryptUrl = `${apiBase}/Crypto/decrypt`;

                const decryptResponse = await fetch(cryptoDecryptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ encryptedText: encryptedStr })
                });

                const decryptResultText = await decryptResponse.text();
                
                // Try to format it
                try {
                    const tempObj = JSON.parse(decryptResultText);
                    // Sometimes double encoded
                    const finalJson = typeof tempObj === 'string' ? JSON.parse(tempObj) : tempObj;
                    resDecEl.value = JSON.stringify(finalJson, null, 4);
                } catch(e) {
                    resDecEl.value = decryptResultText;
                }

            } catch(e) {
                resDecEl.value = "Error during manual decryption:\n" + e.message;
            }
        }

        async function handleSend(id, method, url) {
            const btn = document.getElementById(`btn-${id}`);
            const statusEl = document.getElementById(`status-${id}`);
            const reqBodyEl = document.getElementById(`req-body-${id}`);
            const reqEncEl = document.getElementById(`req-enc-${id}`);
            const resDecEl = document.getElementById(`res-dec-${id}`);
            const resRawEl = document.getElementById(`res-raw-${id}`);

            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div> Sending...`;
            resDecEl.value = '// Processing...';
            resRawEl.value = '// Processing...';
            
            try {
                let payloadToSend = null;
                const apiBase = currentBaseUrl + '/api';
                const mainEndpoint = `${apiBase}${url}`;
                const cryptoEncryptUrl = `${apiBase}/Crypto/encrypt`;
                
                // -----------------------------
                // STEP 1: ENCRYPTION (If POST)
                // -----------------------------
                if (method === 'POST') {
                    statusEl.innerHTML = `<span class="step active">Encrypting...</span> <span class="step">Sending</span> <span class="step">Decrypting</span>`;
                    
                    const rawJsonStr = reqBodyEl.value;
                    
                    const encryptResponse = await fetch(cryptoEncryptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ text: rawJsonStr })
                    });

                    if(!encryptResponse.ok) throw new Error("Crypto API (Encrypt) Failed.");
                    
                    const encryptData = await encryptResponse.text();
                    let encryptedString = "";
                    try {
                        const json = JSON.parse(encryptData);
                        encryptedString = json.text || json; 
                    } catch(e) {
                        encryptedString = encryptData.replace(/"/g, ''); 
                    }

                    const envelope = {
                        "CorrelationId": crypto.randomUUID(),
                        "Data": encryptedString,
                        "OrgCode": "MFS" 
                    };

                    reqEncEl.value = JSON.stringify(envelope, null, 4);
                    payloadToSend = JSON.stringify(envelope);
                }

                // -----------------------------
                // STEP 2: MAIN API CALL
                // -----------------------------
                statusEl.innerHTML = `<span class="step">Encrypting</span> <span class="step active">Sending...</span> <span class="step">Decrypting</span>`;

                const mainResponse = await fetch(mainEndpoint, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Signature': 'SANDBOX_SIG',
                        'RequestId': crypto.randomUUID(),
                        'Timestamp': new Date().toISOString()
                    },
                    body: payloadToSend
                });

                const rawResText = await mainResponse.text();
                
                // Update RAW view
                try {
                    resRawEl.value = JSON.stringify(JSON.parse(rawResText), null, 4);
                } catch(e) {
                    resRawEl.value = rawResText;
                }

                if(!mainResponse.ok) throw new Error(`API Error: ${mainResponse.status} ${mainResponse.statusText}`);

                // -----------------------------
                // STEP 3: AUTOMATIC DECRYPTION
                // -----------------------------
                statusEl.innerHTML = `<span class="step">Encrypting</span> <span class="step">Sending</span> <span class="step active">Decrypting...</span>`;

                // We reuse the manual decrypt logic logic here essentially
                let parsedRaw = null;
                try { parsedRaw = JSON.parse(rawResText); } catch(e) { parsedRaw = rawResText; }
                
                const encryptedContent = extractEncryptedString(parsedRaw);

                if (encryptedContent) {
                     const cryptoDecryptUrl = `${apiBase}/Crypto/decrypt`;
                     const decryptResponse = await fetch(cryptoDecryptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        // This matches your Swagger Screenshot: { "encryptedText": "..." }
                        body: JSON.stringify({ encryptedText: encryptedContent })
                    });

                    const decryptedText = await decryptResponse.text();
                    let finalObj = decryptedText;
                    try {
                        const temp = JSON.parse(decryptedText);
                        finalObj = typeof temp === 'string' ? JSON.parse(temp) : temp;
                    } catch(e) {}

                    // Combine headers from original response with decrypted body for clarity
                    resDecEl.value = JSON.stringify(finalObj, null, 4);

                } else {
                    // It wasn't encrypted, just show raw
                    resDecEl.value = (typeof parsedRaw === 'object') ? JSON.stringify(parsedRaw, null, 4) : rawResText;
                }

                statusEl.innerHTML = `<span style="color:var(--success)"><i class="fas fa-check"></i> Complete</span>`;

            } catch (err) {
                console.error(err);
                resDecEl.value = `Error:\n${err.message}`;
                statusEl.innerHTML = `<span style="color:red"><i class="fas fa-times"></i> Failed</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Send Request</span> <i class="fas fa-paper-plane"></i>`;
            }
        }

        init();
    </script>
</body>
</html>
