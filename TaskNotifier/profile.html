<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TaskNotifier</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="d-flex align-items-center mb-5">
            <i class="fas fa-robot text-primary h3 mb-0 me-2"></i>
            <span class="h4 mb-0 fw-bold">TaskNotifier</span>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a href="tasks.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-tasks me-2"></i> Tasks</a>
            <a href="notifications.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-bell me-2"></i> Reminders</a>
            <a href="ai-assistant.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-brain me-2"></i> AI Assistant</a>
            <a href="team.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-users me-2"></i> Team</a>
            <hr>
            <a href="profile.html" class="nav-link active rounded p-3"><i class="fas fa-cog me-2"></i> Settings</a>
            <a href="index.html" class="nav-link rounded p-3 text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <h2 class="h4 mb-4">Profile Settings</h2>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card card-custom text-center p-4">
                    <div class="position-relative d-inline-block mx-auto mb-3">
                        <img src="https://ui-avatars.com/api/?name=John+Doe&background=2563EB&color=fff&size=128" alt="Profile" class="rounded-circle" width="120">
                        <button class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle" style="width: 32px; height: 32px; padding: 0;"><i class="fas fa-camera"></i></button>
                    </div>
                    <h5 class="mb-1">John Doe</h5>
                    <p class="text-secondary small">Product Manager @ TechCorp</p>
                    <hr>
                    <div class="text-start">
                        <p class="small mb-1 text-secondary">Email</p>
                        <p class="small fw-bold">john.doe@techcorp.com</p>
                        <p class="small mb-1 text-secondary">Joined</p>
                        <p class="small fw-bold">March 2024</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card card-custom p-4 shadow-sm">
                    <ul class="nav nav-tabs border-0 mb-4" id="profileTabs">
                        <li class="nav-item">
                            <a class="nav-link active border-0 fw-bold" data-bs-toggle="tab" href="#editProfile">Edit Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link border-0 fw-bold" data-bs-toggle="tab" href="#security">Security</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link border-0 fw-bold" data-bs-toggle="tab" href="#preferences">Preferences</a>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Edit Profile -->
                        <div class="tab-pane fade show active" id="editProfile">
                            <form id="profileForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">First Name</label>
                                        <input type="text" class="form-control" value="John">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Last Name</label>
                                        <input type="text" class="form-control" value="Doe">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Bio</label>
                                        <textarea class="form-control" rows="3">Passionate about building products that solve real-world problems.</textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Timezone</label>
                                        <select class="form-select">
                                            <option>Eastern Time (ET)</option>
                                            <option>Pacific Time (PT)</option>
                                            <option>UTC</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary px-4" id="saveProfileBtn">Save Changes</button>
                                </div>
                            </form>
                        </div>

                        <!-- Security Tab -->
                        <div class="tab-pane fade" id="security">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Current Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">New Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold">Confirm New Password</label>
                                    <input type="password" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary px-4">Update Password</button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Toast for save confirmation (Bootstrap) -->
                <div class="toast-container position-fixed bottom-0 end-0 p-3">
                  <div id="saveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                      <div class="toast-body">
                        Profile updated successfully!
                      </div>
                      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            $('#profileForm').on('submit', function(e) {
                e.preventDefault();
                const toastBootstrap = bootstrap.Toast.getOrCreateInstance($('#saveToast')[0]);
                toastBootstrap.show();
            });
        });
    </script>
</body>
</html>
