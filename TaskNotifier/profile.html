<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল সেটিংস - টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="d-flex align-items-center mb-5">
            <i class="fas fa-robot text-primary h3 mb-0 me-2"></i>
            <span class="h4 mb-0 fw-bold">টাস্ক-নোটিফায়ার</span>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-th-large me-2"></i> ড্যাশবোর্ড</a>
            <a href="tasks.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-tasks me-2"></i> টাস্কসমূহ</a>
            <a href="notifications.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-bell me-2"></i> রিমাইন্ডার</a>
            <a href="ai-assistant.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-brain me-2"></i> এআই অ্যাসিস্ট্যান্ট</a>
            <a href="team.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-users me-2"></i> টিম</a>
            <hr>
            <a href="profile.html" class="nav-link active rounded p-3"><i class="fas fa-cog me-2"></i> সেটিংস</a>
            <a href="index.html" class="nav-link rounded p-3 text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> লগআউট</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="d-flex align-items-center mb-4">
            <button class="btn d-lg-none me-3" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <h2 class="h4 mb-0">প্রোফাইল সেটিংস</h2>
        </div>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card card-custom text-center p-4 shadow-sm">
                    <div class="position-relative d-inline-block mx-auto mb-3">
                        <img src="" alt="Profile" class="rounded-circle profile-avatar" width="120">
                        <button class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle" style="width: 32px; height: 32px; padding: 0;"><i class="fas fa-camera"></i></button>
                    </div>
                    <h5 class="mb-1 profile-name">...</h5>
                    <p class="text-secondary small profile-role">...</p>
                    <hr>
                    <div class="text-start">
                        <p class="small mb-1 text-secondary">ইমেইল</p>
                        <p class="small fw-bold profile-email">...</p>
                        <p class="small mb-1 text-secondary">যোগদানের তারিখ</p>
                        <p class="small fw-bold">মার্চ ২০২৪</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card card-custom p-4 shadow-sm">
                    <ul class="nav nav-tabs border-0 mb-4" id="profileTabs">
                        <li class="nav-item">
                            <a class="nav-link active border-0 fw-bold" data-bs-toggle="tab" href="#editProfile">প্রোফাইল এডিট</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link border-0 fw-bold" data-bs-toggle="tab" href="#security">নিরাপত্তা</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link border-0 fw-bold" data-bs-toggle="tab" href="#preferences">পছন্দসমূহ</a>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Edit Profile -->
                        <div class="tab-pane fade show active" id="editProfile">
                            <form id="profileForm">
                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label class="form-label small fw-bold">পুরো নাম</label>
                                        <input type="text" id="pName" class="form-control" value="">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">বায়ো (বিবরণ)</label>
                                        <textarea id="pBio" class="form-control" rows="3"></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">টাইমজোন</label>
                                        <select id="pTimezone" class="form-select">
                                            <option>ঢাকা (UTC+6)</option>
                                            <option>Eastern Time (ET)</option>
                                            <option>Pacific Time (PT)</option>
                                            <option>UTC</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary px-4">পরিবর্তন সংরক্ষণ করুন</button>
                                </div>
                            </form>
                        </div>

                        <!-- Security Tab -->
                        <div class="tab-pane fade" id="security">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">বর্তমান পাসওয়ার্ড</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">নতুন পাসওয়ার্ড</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold">পাসওয়ার্ড নিশ্চিত করুন</label>
                                    <input type="password" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary px-4">পাসওয়ার্ড আপডেট করুন</button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Toast for save confirmation -->
                <div class="toast-container position-fixed bottom-0 end-0 p-3">
                  <div id="saveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                      <div class="toast-body">
                        প্রোফাইল সফলভাবে আপডেট করা হয়েছে!
                      </div>
                      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            // Initial form population
            const state = getState();
            $('#pName').val(state.profile.name);
            $('#pBio').val(state.profile.bio);
            $('#pTimezone').val(state.profile.timezone);
            $('.profile-email').text(state.profile.email);
        });
    </script>
</body>
</html>
