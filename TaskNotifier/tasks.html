<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - TaskNotifier</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="d-flex align-items-center mb-5">
            <i class="fas fa-robot text-primary h3 mb-0 me-2"></i>
            <span class="h4 mb-0 fw-bold">TaskNotifier</span>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-th-large me-2"></i> Dashboard</a>
            <a href="tasks.html" class="nav-link active rounded p-3"><i class="fas fa-tasks me-2"></i> Tasks</a>
            <a href="notifications.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-bell me-2"></i> Reminders</a>
            <a href="ai-assistant.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-brain me-2"></i> AI Assistant</a>
            <a href="team.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-users me-2"></i> Team</a>
            <hr>
            <a href="profile.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-cog me-2"></i> Settings</a>
            <a href="index.html" class="nav-link rounded p-3 text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0">Task Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                <i class="fas fa-plus me-2"></i> Add New Task
            </button>
        </div>

        <!-- Filters -->
        <div class="card card-custom p-3 mb-4">
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary rounded-pill px-4">All Tasks</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4">In Progress</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4">Completed</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4">High Priority</button>
            </div>
        </div>

        <!-- Task List Area -->
        <div class="card card-custom border-0 shadow-sm overflow-hidden">
            <div class="task-item px-4">
                <input type="checkbox" class="form-check-input me-3 task-checkbox">
                <div class="flex-grow-1">
                    <span class="d-block fw-bold">Prepare Presentation for Board</span>
                    <small class="text-secondary"><i class="far fa-calendar-alt me-1"></i> Due Oct 24, 2026</small>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-danger-subtle text-danger rounded-pill px-3">Urgent</span>
                    <button class="btn btn-sm text-secondary"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>
            <div class="task-item px-4">
                <input type="checkbox" class="form-check-input me-3 task-checkbox">
                <div class="flex-grow-1">
                    <span class="d-block fw-bold">Review Codebase of Team Alpha</span>
                    <small class="text-secondary"><i class="far fa-calendar-alt me-1"></i> Due Oct 25, 2026</small>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-warning-subtle text-warning rounded-pill px-3">Normal</span>
                    <button class="btn btn-sm text-secondary"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>
            <div class="task-item px-4">
                <input type="checkbox" class="form-check-input me-3 task-checkbox">
                <div class="flex-grow-1">
                    <span class="d-block fw-bold">Update System Documentation</span>
                    <small class="text-secondary"><i class="far fa-calendar-alt me-1"></i> Due Oct 26, 2026</small>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-info-subtle text-info rounded-pill px-3">Low</span>
                    <button class="btn btn-sm text-secondary"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-bold">Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <form>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Task Title</label>
                            <input type="text" class="form-control" placeholder="What needs to be done?">
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Due Date</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Priority</label>
                                <select class="form-select">
                                    <option>Low</option>
                                    <option>Medium</option>
                                    <option>High</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Description</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3">Add Task</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
