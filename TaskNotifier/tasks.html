<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রতিদিনের কাজ | টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="text-center mb-5">
            <i class="fas fa-robot text-primary h1 mb-3"></i>
            <h4 class="fw-bold profile-name">...</h4>
            <p class="small text-secondary profile-role">...</p>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-th-large me-3"></i> ড্যাশবোর্ড</a>
            <a href="tasks.html" class="nav-link active rounded-4 p-3"><i class="fas fa-tasks me-3"></i> প্রতিদিনের কাজ</a>
            <a href="notifications.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-bell me-3"></i> নোটিফিকেশন</a>
            <a href="ai-assistant.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-brain me-3"></i> স্মার্ট অ্যাসিস্ট্যান্ট</a>
            <a href="team.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-users me-3"></i> টিম স্পেস</a>
            <hr class="opacity-10 my-4">
            <a href="profile.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-user-cog me-3"></i> প্রোফাইল সেটিংস</a>
            <a href="index.html" class="nav-link rounded-4 p-3 text-danger mt-4"><i class="fas fa-power-off me-3"></i> লগআউট</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content tasks-page">
        <!-- Top Bar -->
        <header class="d-flex justify-content-between align-items-center mb-5">
            <div class="d-flex align-items-center">
                <button class="btn btn-theme me-3 d-lg-none" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <h2 class="fw-bold mb-0">টাস্ক ম্যানেজমেন্ট</h2>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-theme" id="themeToggle">
                    <i class="theme-icon fas fa-moon"></i>
                </button>
                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                    <i class="fas fa-plus me-2"></i> নতুন টাস্ক
                </button>
            </div>
        </header>

        <!-- Advanced Search & Filter -->
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="input-group card-custom border-0 p-1">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-search text-secondary"></i></span>
                    <input type="text" id="taskSearch" class="form-control bg-transparent border-0" placeholder="আপনার কাজ খুঁজুন...">
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <div class="btn-group shadow-sm rounded-pill overflow-hidden">
                    <button class="btn btn-primary task-filter" data-filter="all">সব</button>
                    <button class="btn btn-outline-secondary border-0 task-filter" data-filter="pending">চলমান</button>
                    <button class="btn btn-outline-secondary border-0 task-filter" data-filter="completed">সম্পন্ন</button>
                </div>
            </div>
        </div>

        <!-- Task List Container -->
        <div class="card card-custom border-0 overflow-hidden" id="task-list">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- Modal Logic stays the same as Dashboard -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-5 shadow-2xl">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="modal-title fw-bold">নতুন কাজ যোগ করুন</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addTaskForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">টাস্কের নাম</label>
                            <input type="text" id="taskTitle" class="form-control rounded-3" placeholder="কি করতে হবে?" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">শেষ সময়</label>
                                <input type="date" id="taskDate" class="form-control rounded-3" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">অগ্রাধিকার</label>
                                <select id="taskPriority" class="form-select rounded-3">
                                    <option value="উচ্চ">উচ্চ</option>
                                    <option value="মাঝারি">মাঝারি</option>
                                    <option value="নিম্ন">নিম্ন</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-lg">সংরক্ষণ করুন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
