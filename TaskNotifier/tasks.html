<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাস্ক ম্যানেজমেন্ট - টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="d-flex align-items-center mb-5">
            <i class="fas fa-robot text-primary h3 mb-0 me-2"></i>
            <span class="h4 mb-0 fw-bold">টাস্ক-নোটিফায়ার</span>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-th-large me-2"></i> ড্যাশবোর্ড</a>
            <a href="tasks.html" class="nav-link active rounded p-3"><i class="fas fa-tasks me-2"></i> টাস্কসমূহ</a>
            <a href="notifications.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-bell me-2"></i> রিমাইন্ডার</a>
            <a href="ai-assistant.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-brain me-2"></i> এআই অ্যাসিস্ট্যান্ট</a>
            <a href="team.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-users me-2"></i> টিম</a>
            <hr>
            <a href="profile.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-cog me-2"></i> সেটিংস</a>
            <a href="index.html" class="nav-link rounded p-3 text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> লগআউট</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content tasks-page">
        <!-- Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0">টাস্ক ম্যানেজমেন্ট</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                <i class="fas fa-plus me-2"></i> নতুন টাস্ক যোগ করুন
            </button>
        </div>

        <!-- Filters -->
        <div class="card card-custom p-3 mb-4">
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary rounded-pill px-4">সব কাজ</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4">চলমান</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4">সম্পন্ন</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4">উচ্চ অগ্রাধিকার</button>
            </div>
        </div>

        <!-- Task List Area -->
        <div class="card card-custom border-0 shadow-sm overflow-hidden" id="task-list">
            <!-- Dynamic Tasks will be rendered here -->
        </div>
    </main>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-bold">নতুন টাস্ক তৈরি করুন</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <form id="addTaskForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">টাস্কের নাম</label>
                            <input type="text" id="taskTitle" class="form-control" placeholder="কি করতে হবে?" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">শেষ সময়</label>
                                <input type="date" id="taskDate" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">অগ্রাধিকার</label>
                                <select id="taskPriority" class="form-select">
                                    <option value="নিম্ন">নিম্ন</option>
                                    <option value="মাঝারি">মাঝারি</option>
                                    <option value="উচ্চ">উচ্চ</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">বিবরণ (ঐচ্ছিক)</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3">টাস্ক যোগ করুন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
