<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিমাইন্ডার - টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="d-flex align-items-center mb-5">
            <i class="fas fa-robot text-primary h3 mb-0 me-2"></i>
            <span class="h4 mb-0 fw-bold">টাস্ক-নোটিফায়ার</span>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-th-large me-2"></i> ড্যাশবোর্ড</a>
            <a href="tasks.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-tasks me-2"></i> টাস্কসমূহ</a>
            <a href="notifications.html" class="nav-link active rounded p-3"><i class="fas fa-bell me-2"></i> রিমাইন্ডার</a>
            <a href="ai-assistant.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-brain me-2"></i> এআই অ্যাসিস্ট্যান্ট</a>
            <a href="team.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-users me-2"></i> টিম</a>
            <hr>
            <a href="profile.html" class="nav-link rounded p-3 text-secondary"><i class="fas fa-cog me-2"></i> সেটিংস</a>
            <a href="index.html" class="nav-link rounded p-3 text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> লগআউট</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <h2 class="h4 mb-4">নোটিফিকেশন এবং রিমাইন্ডার</h2>

        <div class="row">
            <div class="col-lg-8">
                <!-- Notifications List -->
                <div class="card card-custom border-0 shadow-sm mb-4">
                    <div class="card-body p-0" id="notif-list">
                        <!-- Dynamic Notifications -->
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card card-custom p-4 bg-white shadow-sm border-0">
                    <h5 class="mb-4">রিমাইন্ডার সেটিংস</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                        <label class="form-check-label" for="emailNotif">ইমেইল নোটিফিকেশন</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="pushNotif" checked>
                        <label class="form-check-label" for="pushNotif">পুশ নোটিফিকেশন</label>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="aiNotif" checked>
                        <label class="form-check-label" for="aiNotif">এআই ইন্টেলিজেন্ট রিমাইন্ডার</label>
                    </div>
                    <button class="btn btn-outline-secondary w-100">সব নোটিফিকেশন মুছুন</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
