<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিমাইন্ডার - টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="text-center mb-5">
            <i class="fas fa-robot text-primary h1 mb-3"></i>
            <h4 class="fw-bold profile-name">মেহেদী হাসান</h4>
            <p class="small text-secondary profile-role">ব্যক্তিগত মোড</p>
        </div>
        <nav class="nav flex-column gap-2">
            <a href="dashboard.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-th-large me-3"></i> ড্যাশবোর্ড</a>
            <a href="tasks.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-tasks me-3"></i> প্রতিদিনের কাজ</a>
            <a href="notifications.html" class="nav-link active rounded-4 p-3"><i class="fas fa-bell me-3"></i> নোটিফিকেশন</a>
            <a href="ai-assistant.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-brain me-3"></i> স্মার্ট অ্যাসিস্ট্যান্ট</a>
            <hr class="opacity-10 my-4">
            <a href="profile.html" class="nav-link rounded-4 p-3 text-secondary"><i class="fas fa-user-cog me-3"></i> প্রোফাইল সেটিংস</a>
            <a href="index.html" class="nav-link rounded-4 p-3 text-danger mt-4"><i class="fas fa-power-off me-3"></i> লগআউট</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="d-flex justify-content-between align-items-center mb-5">
            <div class="d-flex align-items-center">
                <button class="btn btn-theme me-3 d-lg-none" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <h2 class="fw-bold mb-0">নোটিফিকেশন এবং রিমাইন্ডার</h2>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-theme" id="themeToggle">
                    <i class="theme-icon fas fa-moon"></i>
                </button>
                <img src="https://ui-avatars.com/api/?name=Mehedi+Hasan&background=2563EB&color=fff" alt="Profile" class="rounded-circle profile-avatar border-2 border-primary border" width="45">
            </div>
        </header>

        <div class="row">
            <div class="col-lg-8">
                <!-- Notifications List -->
                <div class="card card-custom border-0 shadow-sm mb-4">
                    <div class="card-body p-0" id="notif-list">
                        <!-- Dynamic Notifications -->
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card card-custom p-4 bg-white shadow-sm border-0">
                    <h5 class="mb-4">রিমাইন্ডার সেটিংস</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                        <label class="form-check-label" for="emailNotif">ইমেইল নোটিফিকেশন</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="pushNotif" checked>
                        <label class="form-check-label" for="pushNotif">পুশ নোটিফিকেশন</label>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="aiNotif" checked>
                        <label class="form-check-label" for="aiNotif">এআই ইন্টেলিজেন্ট রিমাইন্ডার</label>
                    </div>
                    <button class="btn btn-outline-secondary w-100" id="clearAllNotif">সব নোটিফিকেশন মুছুন</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-link">
            <i class="fas fa-th-large"></i>
            <span>হোম</span>
        </a>
        <a href="tasks.html" class="nav-link">
            <i class="fas fa-tasks"></i>
            <span>টাস্ক</span>
        </a>
        <a href="ai-assistant.html" class="nav-link">
            <i class="fas fa-brain"></i>
            <span>এআই</span>
        </a>
        <a href="profile.html" class="nav-link">
            <i class="fas fa-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
