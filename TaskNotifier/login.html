<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #edf2f7;
        }
        .brand-logo {
            width: 56px;
            height: 56px;
            background: #2563eb;
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }
        .form-control {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background-color: #fcfdfe;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            border-color: #2563eb;
        }
        .btn-login {
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            background: #2563eb;
            border: none;
            transition: 0.2s;
        }
        .btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .sso-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .sso-button:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #a0aec0;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #edf2f7;
        }
        .divider:not(:empty)::before { margin-right: 12px; }
        .divider:not(:empty)::after { margin-left: 12px; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card text-center slide-up">
            <div class="brand-logo">
                <i class="fas fa-robot"></i>
            </div>
            <h3 class="fw-bold text-dark mb-2">স্বাগতম</h3>
            <p class="text-secondary small mb-4">আপনার টাস্ক-নোটিফায়ার অ্যাকাউন্টে সাইন ইন করুন</p>

            <!-- SSO Login -->
            <button class="sso-button" onclick="window.location.href='dashboard.html';">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                Google দিয়ে প্রবেশ করুন
            </button>
            <button class="sso-button" onclick="window.location.href='dashboard.html';">
                <i class="fas fa-bolt text-warning"></i>
                ডেমো অ্যাকাউন্ট ব্যবহার করুন
            </button>

            <div class="divider">অথবা ইমেইল ব্যবহার করুন</div>

            <form id="loginForm" class="text-start" onsubmit="window.location.href='dashboard.html'; return false;">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">ইমেইল</label>
                    <input type="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-semibold text-dark">পাসওয়ার্ড</label>
                        <a href="#" class="small text-primary text-decoration-none">ভুলে গেছেন?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100 mb-3">সাইন ইন</button>
            </form>

            <p class="small text-secondary mb-0">অ্যাকাউন্ট নেই? <a href="#" class="text-primary fw-bold text-decoration-none">ফ্রি ট্রায়াল শুরু করুন</a></p>
        </div>
        
        <div class="text-center mt-4">
            <p class="small text-secondary opacity-50">&copy; ২০২৬ মেহেদী হাসান। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
