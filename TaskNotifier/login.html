<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="glass-login-card text-center slide-up">
            <div class="mb-4">
                <i class="fas fa-robot h1 text-white"></i>
                <h2 class="fw-bold mt-2">আপনাকে আবারও স্বাগতম</h2>
                <p class="opacity-75">অব্যাহত রাখতে সাইন-ইন করুন</p>
            </div>

            <!-- Quick Login Options -->
            <div class="d-flex justify-content-center gap-3 mb-4">
                <button class="btn btn-light rounded-circle p-3" title="Google Login" onclick="window.location.href='dashboard.html';">
                    <i class="fab fa-google text-danger"></i>
                </button>
                <button class="btn btn-light rounded-circle p-3" title="GitHub Login" onclick="window.location.href='dashboard.html';">
                    <i class="fab fa-github text-dark"></i>
                </button>
                <button class="btn btn-primary rounded-circle p-3 pulse-btn" title="Quick Access" onclick="window.location.href='dashboard.html';">
                    <i class="fas fa-bolt"></i>
                </button>
            </div>

            <div class="text-center mb-4">
                <span class="small opacity-50">অথবা ইমেইল ব্যবহার করুন</span>
            </div>

            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="form-label small fw-bold">ইমেইল অ্যাড্রেস</label>
                    <input type="email" class="form-control bg-white bg-opacity-10 border-white border-opacity-25 text-white" placeholder="name@company.com">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">পাসওয়ার্ড</label>
                    <input type="password" class="form-control bg-white bg-opacity-10 border-white border-opacity-25 text-white">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold" onclick="window.location.href='dashboard.html'; return false;">প্রবেশ করুন</button>
            </form>

            <div class="mt-4 text-center">
                <p class="small opacity-75">অ্যাকাউন্ট নেই? <a href="#" class="text-white fw-bold">নিবন্ধন করুন</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
