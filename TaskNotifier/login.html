<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskNotifier</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-card {
            max-width: 450px;
            margin: 100px auto;
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }
        .auth-header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 2.5rem;
            text-align: center;
        }
        .auth-body {
            padding: 2.5rem;
            background: #fff;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <div class="card auth-card">
            <div class="auth-header">
                <h2 class="mb-0">Welcome Back</h2>
                <p class="mb-0 opacity-75">Sign in to continue to TaskNotifier</p>
            </div>
            <div class="auth-body">
                <form id="loginForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label">Password</label>
                            <a href="#" class="text-decoration-none small">Forgot?</a>
                        </div>
                        <input type="password" class="form-control" id="password" required>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3" onclick="window.location.href='dashboard.html'; return false;">Sign In</button>
                    <div class="text-center">
                        <span class="text-secondary small">Don't have an account? <a href="#" class="text-decoration-none fw-bold" id="showRegister">Register</a></span>
                    </div>
                </form>

                <form id="registerForm" class="needs-validation d-none" novalidate>
                    <div class="mb-3">
                        <label for="regName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="regName" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>
                    <div class="mb-4">
                        <label for="regPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3" onclick="window.location.href='dashboard.html'; return false;">Create Account</button>
                    <div class="text-center">
                        <span class="text-secondary small">Already have an account? <a href="#" class="text-decoration-none fw-bold" id="showLogin">Login</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            $('#showRegister').click(function(e) {
                e.preventDefault();
                $('#loginForm').fadeOut(300, function() {
                    $(this).addClass('d-none');
                    $('#registerForm').removeClass('d-none').fadeIn(300);
                    $('.auth-header h2').text('Create Account');
                    $('.auth-header p').text('Join your team on TaskNotifier');
                });
            });

            $('#showLogin').click(function(e) {
                e.preventDefault();
                $('#registerForm').fadeOut(300, function() {
                    $(this).addClass('d-none');
                    $('#loginForm').removeClass('d-none').fadeIn(300);
                    $('.auth-header h2').text('Welcome Back');
                    $('.auth-header p').text('Sign in to continue to TaskNotifier');
                });
            });
        });
    </script>
</body>
</html>
