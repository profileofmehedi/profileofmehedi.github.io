<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 15px;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 1px solid #edf2f7;
        }
        .brand-logo {
            width: 48px;
            height: 48px;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 auto 16px;
        }
        .form-control {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background-color: #fcfdfe;
            font-size: 14px;
        }
        .btn-login {
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            background: #2563eb;
            border: none;
            font-size: 15px;
        }
        .demo-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .demo-button:hover {
            background: #f1f5f9;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #cbd5e0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #edf2f7;
        }
        .divider:not(:empty)::before { margin-right: 10px; }
        .divider:not(:empty)::after { margin-left: 10px; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card text-center slide-up">
            <div class="brand-logo">
                <i class="fas fa-robot"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">লগইন</h4>
            <p class="text-secondary small mb-4">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>

            <!-- Quick Access -->
            <button class="demo-button" onclick="window.location.href='dashboard.html';">
                <i class="fas fa-bolt text-warning"></i>
                ডেমো অ্যাকাউন্ট ব্যবহার করুন
            </button>

            <div class="divider">অথবা</div>

            <form id="loginForm" class="text-start" onsubmit="window.location.href='dashboard.html'; return false;">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">ইমেইল</label>
                    <input type="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-semibold text-dark">পাসওয়ার্ড</label>
                        <a href="#" class="small text-primary text-decoration-none" style="font-size: 12px;">ভুলে গেছেন?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100 mb-2">সাইন ইন</button>
            </form>

            <p class="small text-secondary mb-0" style="font-size: 13px;">অ্যাকাউন্ট নেই? <a href="#" class="text-primary fw-bold text-decoration-none">নিবন্ধন করুন</a></p>
        </div>
        
        <div class="text-center mt-4">
            <p class="small text-secondary opacity-50" style="font-size: 11px;">&copy; ২০২৬ মেহেদী হাসান।</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
