<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #2563eb, #1e40af);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            padding: 3.5rem;
            width: 100%;
            max-width: 480px;
            color: #fff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .quick-login-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .quick-login-btn:hover {
            background: #fff;
            color: #000;
            transform: translateY(-5px);
        }

        .demo-login-btn {
            background: linear-gradient(90deg, #2563eb, #10b981);
            border: none;
            transition: 0.3s;
        }

        .demo-login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="glass-login-card text-center slide-up">
            <div class="mb-5">
                <div class="bg-primary d-inline-block p-3 rounded-circle mb-3 shadow-lg">
                    <i class="fas fa-robot h2 text-white mb-0"></i>
                </div>
                <h2 class="fw-bold">টাস্ক-নোটিফায়ার</h2>
                <p class="opacity-75">আপনার স্মার্ট প্রোডাক্টিভিটি পার্টনার</p>
            </div>

            <!-- Quick Login Options -->
            <div class="mb-4">
                <p class="small opacity-50 mb-3">দ্রুত প্রবেশ করুন</p>
                <div class="d-flex justify-content-center gap-3 mb-4">
                    <button class="quick-login-btn" onclick="window.location.href='dashboard.html';">
                        <i class="fab fa-google"></i>
                    </button>
                    <button class="quick-login-btn" onclick="window.location.href='dashboard.html';">
                        <i class="fab fa-github"></i>
                    </button>
                    <button class="quick-login-btn" onclick="window.location.href='dashboard.html';">
                        <i class="fab fa-microsoft"></i>
                    </button>
                </div>
                
                <button class="btn demo-login-btn w-100 py-3 rounded-pill text-white fw-bold mb-4" onclick="window.location.href='dashboard.html';">
                    <i class="fas fa-bolt me-2"></i> ডেমো হিসেবে প্রবেশ করুন
                </button>
            </div>

            <div class="position-relative mb-4">
                <hr class="opacity-25">
                <span class="position-absolute top-50 start-50 translate-middle bg-dark px-3 small opacity-50" style="background: transparent !important;">অথবা ইমেইল ব্যবহার করুন</span>
            </div>

            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="form-label small fw-bold opacity-75">ইমেইল</label>
                    <input type="email" class="form-control bg-white bg-opacity-10 border-0 text-white py-3 rounded-4" placeholder="name@company.com">
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-bold opacity-75">পাসওয়ার্ড</label>
                        <a href="#" class="small text-primary text-decoration-none">ভুলে গেছেন?</a>
                    </div>
                    <input type="password" class="form-control bg-white bg-opacity-10 border-0 text-white py-3 rounded-4">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold" onclick="window.location.href='dashboard.html'; return false;">সাইন ইন</button>
            </form>

            <div class="mt-5 text-center">
                <p class="small opacity-75 mb-0">অ্যাকাউন্ট নেই? <a href="#" class="text-primary fw-bold text-decoration-none">রেজিস্ট্রেশন করুন</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
