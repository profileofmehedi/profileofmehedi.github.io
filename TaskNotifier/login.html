<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - টাস্ক-নোটিফায়ার</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-card {
            max-width: 450px;
            margin: 80px auto;
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }
        .auth-header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 2.5rem;
            text-align: center;
        }
        .auth-body {
            padding: 2.5rem;
            background: #fff;
        }
        .btn-quick-login {
            background-color: #f1f5f9;
            color: var(--primary-color);
            border: 2px dashed var(--primary-color);
            transition: all 0.3s;
        }
        .btn-quick-login:hover {
            background-color: var(--primary-color);
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <div class="card auth-card">
            <div class="auth-header">
                <i class="fas fa-robot h1 mb-3"></i>
                <h2 class="mb-0">আপনাকে আবারও স্বাগতম</h2>
                <p class="mb-0 opacity-75">চালিয়ে যেতে সাইন ইন করুন</p>
            </div>
            <div class="auth-body">
                <!-- Quick Login Button -->
                <div class="mb-4">
                    <button class="btn btn-quick-login w-100 py-3 fw-bold" onclick="window.location.href='dashboard.html';">
                        <i class="fas fa-bolt me-2"></i> ডেমো লগইন (দ্রুত প্রবেশ)
                    </button>
                    <div class="text-center mt-3">
                        <span class="bg-white px-2 text-secondary small">অথবা আপনার ইমেইল ব্যবহার করুন</span>
                    </div>
                </div>

                <form id="loginForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">ইমেইল অ্যাড্রেস</label>
                        <input type="email" class="form-control" id="email" placeholder="example@company.com" required>
                        <div class="invalid-feedback">অনুগ্রহ করে একটি সঠিক ইমেইল লিখুন।</div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label">পাসওয়ার্ড</label>
                            <a href="#" class="text-decoration-none small">ভুলে গেছেন?</a>
                        </div>
                        <input type="password" class="form-control" id="password" required>
                        <div class="invalid-feedback">পাসওয়ার্ড প্রদান করা আবশ্যক।</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3" onclick="window.location.href='dashboard.html'; return false;">লগইন করুন</button>
                    <div class="text-center">
                        <span class="text-secondary small">আপনার কি কোনো অ্যাকাউন্ট নেই? <a href="#" class="text-decoration-none fw-bold" id="showRegister">রেজিস্ট্রেশন করুন</a></span>
                    </div>
                </form>

                <form id="registerForm" class="needs-validation d-none" novalidate>
                    <div class="mb-3">
                        <label for="regName" class="form-label">পুরো নাম</label>
                        <input type="text" class="form-control" id="regName" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">ইমেইল অ্যাড্রেস</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>
                    <div class="mb-4">
                        <label for="regPassword" class="form-label">পাসওয়ার্ড</label>
                        <input type="password" class="form-control" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3" onclick="window.location.href='dashboard.html'; return false;">অ্যাকাউন্ট তৈরি করুন</button>
                    <div class="text-center">
                        <span class="text-secondary small">ইতিমধ্যে কি একটি অ্যাকাউন্ট আছে? <a href="#" class="text-decoration-none fw-bold" id="showLogin">লগইন করুন</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            $('#showRegister').click(function(e) {
                e.preventDefault();
                $('#loginForm').fadeOut(300, function() {
                    $(this).addClass('d-none');
                    $('#registerForm').removeClass('d-none').fadeIn(300);
                    $('.auth-header h2').text('অ্যাকাউন্ট তৈরি করুন');
                    $('.auth-header p').text('টাস্ক-নোটিফায়ার টিমে যোগ দিন');
                });
            });

            $('#showLogin').click(function(e) {
                e.preventDefault();
                $('#registerForm').fadeOut(300, function() {
                    $(this).addClass('d-none');
                    $('#loginForm').removeClass('d-none').fadeIn(300);
                    $('.auth-header h2').text('আপনাকে আবারও স্বাগতম');
                    $('.auth-header p').text('চালিয়ে যেতে সাইন ইন করুন');
                });
            });
        });
    </script>
</body>
</html>
