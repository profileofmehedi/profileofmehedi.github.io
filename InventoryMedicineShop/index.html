<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediShop - Redirecting...</title>
    <script>
        // Redirect to login page
        window.location.href = 'login.html';
    </script>
</head>

<body>
    <p>Redirecting to login page...</p>
</body>

</html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary-color: #2ecc71;
        --primary-dark: #27ae60;
        --primary-light: #58d68d;
        --secondary-color: #3498db;
        --danger-color: #e74c3c;
        --warning-color: #f39c12;
        --info-color: #1abc9c;
        --dark-color: #2c3e50;
        --light-color: #ecf0f1;
        --border-radius: 8px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    @keyframes slideInDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes pulse {

        0%,
        100% {
            opacity: 1;
        }

        50% {
            opacity: 0.5;
        }
    }

    .login-container {
        width: 100%;
        max-width: 450px;
        padding: 20px;
        animation: slideInUp 0.6s ease-out;
    }

    .login-card {
        background: white;
        border-radius: var(--border-radius);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        border: none;
    }

    .login-header {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 40px 20px;
        text-align: center;
        animation: slideInDown 0.6s ease-out;
    }

    .login-header .logo {
        font-size: 48px;
        margin-bottom: 10px;
    }

    .login-header h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .login-header p {
        font-size: 14px;
        opacity: 0.9;
    }

    .login-body {
        padding: 40px;
    }

    .form-group {
        margin-bottom: 20px;
        animation: fadeIn 0.6s ease-out;
    }

    .form-group:nth-child(1) {
        animation-delay: 0.1s;
    }

    .form-group:nth-child(2) {
        animation-delay: 0.2s;
    }

    .form-group:nth-child(3) {
        animation-delay: 0.3s;
    }

    label {
        font-weight: 600;
        color: var(--dark-color);
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        border: 2px solid var(--light-color);
        border-radius: var(--border-radius);
        padding: 12px 15px;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.2rem rgba(46, 204, 113, 0.25);
        background-color: #fff;
    }

    .form-control::placeholder {
        color: #bdc3c7;
    }

    .btn-login {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: var(--border-radius);
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        animation: fadeIn 0.6s ease-out 0.4s both;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(46, 204, 113, 0.3);
        color: white;
    }

    .btn-login:active {
        transform: translateY(0);
    }

    .demo-credentials {
        background: var(--light-color);
        border-left: 4px solid var(--info-color);
        padding: 15px;
        border-radius: var(--border-radius);
        margin-top: 30px;
        font-size: 13px;
        animation: fadeIn 0.6s ease-out 0.5s both;
    }

    .demo-credentials h6 {
        color: var(--info-color);
        margin-bottom: 10px;
        font-weight: 600;
    }

    .demo-credentials p {
        margin: 5px 0;
        color: var(--dark-color);
    }

    .demo-credentials strong {
        color: var(--primary-color);
    }

    .input-group-text {
        border: 2px solid var(--light-color);
        background: white;
        color: var(--dark-color);
    }

    .input-group .form-control:focus+.input-group-text,
    .input-group .form-control:focus~.input-group-text {
        border-color: var(--primary-color);
    }

    .remember-me {
        margin-top: 15px;
        display: flex;
        align-items: center;
    }

    .form-check-input {
        border-color: var(--light-color);
        cursor: pointer;
    }

    .form-check-input:checked {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
    }

    .form-check-label {
        margin-left: 8px;
        cursor: pointer;
        color: var(--dark-color);
    }

    @media (max-width: 576px) {
        .login-container {
            padding: 10px;
        }

        .login-header {
            padding: 30px 15px;
        }

        .login-header h1 {
            font-size: 24px;
        }

        .login-body {
            padding: 25px;
        }
    }
</style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-pills"></i>
                </div>
                <h1>MediShop</h1>
                <p>Inventory Management System</p>
            </div>

            <div class="login-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password"
                            required>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="demo-credentials">
                    <h6><i class="fas fa-info-circle"></i> Demo Credentials</h6>
                    <p><strong>Admin:</strong> admin / admin123</p>
                    <p><strong>Manager:</strong> manager / manager123</p>
                    <p><strong>Seller:</strong> seller / seller123</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>

    <script>
        // Initialize demo data if not exists
        function initializeDemoData() {
            if (!localStorage.getItem('appInitialized')) {
                const demoUsers = [
                    {
                        id: 1,
                        username: 'admin',
                        password: 'admin123',
                        role: 'admin',
                        name: 'Admin User',
                        email: 'admin@medishop.com',
                        active: true,
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 2,
                        username: 'manager',
                        password: 'manager123',
                        role: 'manager',
                        name: 'Manager User',
                        email: 'manager@medishop.com',
                        active: true,
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 3,
                        username: 'seller',
                        password: 'seller123',
                        role: 'seller',
                        name: 'Seller User',
                        email: 'seller@medishop.com',
                        active: true,
                        createdAt: new Date().toISOString()
                    }
                ];

                const defaultSettings = {
                    shopName: 'MediShop Pharmacy',
                    shopLogo: '💊',
                    primaryColor: '#2ecc71',
                    secondaryColor: '#3498db',
                    address: '123 Medical Lane, Health City',
                    phone: '+1-800-MED-SHOP',
                    email: 'info@medishop.com'
                };

                const defaultShortcuts = {
                    'ctrl+shift+a': { name: 'Add Medicine', action: 'addMedicine' },
                    'ctrl+shift+s': { name: 'Sales', action: 'goToSales' },
                    'ctrl+shift+i': { name: 'Inventory', action: 'goToInventory' },
                    'ctrl+shift+r': { name: 'Reports', action: 'goToReports' },
                    'ctrl+shift+u': { name: 'Users', action: 'goToUsers' },
                    'ctrl+shift+e': { name: 'Settings', action: 'goToSettings' },
                    'escape': { name: 'Close Modal', action: 'closeModal' }
                };

                const defaultMenus = {
                    admin: ['dashboard', 'medicines', 'categories', 'suppliers', 'sales', 'inventory', 'reports', 'users', 'menus', 'settings'],
                    manager: ['dashboard', 'medicines', 'categories', 'suppliers', 'sales', 'inventory', 'reports'],
                    seller: ['dashboard', 'sales', 'inventory']
                };

                localStorage.setItem('users', JSON.stringify(demoUsers));
                localStorage.setItem('appSettings', JSON.stringify(defaultSettings));
                localStorage.setItem('shortcuts', JSON.stringify(defaultShortcuts));
                localStorage.setItem('roleMenus', JSON.stringify(defaultMenus));
                localStorage.setItem('medicines', JSON.stringify([]));
                localStorage.setItem('categories', JSON.stringify([]));
                localStorage.setItem('suppliers', JSON.stringify([]));
                localStorage.setItem('transactions', JSON.stringify([]));
                localStorage.setItem('appInitialized', 'true');
            }
        }

        // Login form handler
        $(document).ready(function () {
            initializeDemoData();

            $('#loginForm').on('submit', function (e) {
                e.preventDefault();

                const username = $('#username').val().trim();
                const password = $('#password').val();
                const rememberMe = $('#rememberMe').is(':checked');

                if (!username || !password) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Validation Error',
                        text: 'Please enter both username and password'
                    });
                    return;
                }

                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const user = users.find(u => u.username === username && u.password === password && u.active);

                if (!user) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: 'Invalid username or password'
                    });
                    return;
                }

                // Login successful
                localStorage.setItem('currentUser', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    role: user.role,
                    name: user.name,
                    email: user.email
                }));

                if (rememberMe) {
                    localStorage.setItem('rememberMe', 'true');
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Login Successful',
                    text: `Welcome, ${user.name}!`,
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = 'pages/dashboard.html';
                });
            });

            // Check if remember me is checked
            const rememberMe = localStorage.getItem('rememberMe');
            if (rememberMe) {
                $('#rememberMe').prop('checked', true);
            }
        });
    </script>
</body>

</html>
