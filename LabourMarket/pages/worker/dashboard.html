<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="brand">Worker App</div>
        <div class="text-center mb-3">
             <img src="https://ui-avatars.com/api/?name=Worker&background=random" class="avatar-img mb-2" alt="User">
             <div class="small text-white user-name-display">Worker</div>
        </div>
        <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="profile.html"><i class="fas fa-user me-2"></i> My Profile</a>
        <a href="history.html"><i class="fas fa-history me-2"></i> Call History</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="content">
        <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary d-md-none" id="sidebarCollapse">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="navbar-brand mb-0 h1 ms-2">My Dashboard</span>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="availabilityToggle">
                    <label class="form-check-label" for="availabilityToggle">Available</label>
                </div>
            </div>
        </nav>

        <div class="row">
            <div class="col-md-6">
                <div class="card-counter bg-primary-light position-relative">
                    <i class="fas fa-phone-alt"></i>
                    <span class="count-numbers" id="todayCalls">0</span>
                    <span class="count-name">Calls Today</span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card-counter bg-success-light position-relative">
                    <i class="fas fa-wallet"></i>
                    <span class="count-numbers" id="totalEarnings">0</span>
                    <span class="count-name">Total Earnings</span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white">
                <h5 class="mb-0">Recent Calls</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Status</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="callHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            const user = DB.checkAuth('worker');
            if(!user) return;

            // Get Worker ID linked to this user (demo linkage)
            // In a real app, user.id would be the worker.id or linked via a field.
            // For this demo, let's assume the user object has a workerId property.
            // If not in seed, we'll try to find a worker with same email or just use ID 1 for demo safety.
            
            let workerId = user.workerId || 1; 
            const worker = DB.getAll('workers').find(w => w.id == workerId);
            
            if(worker) {
                $('#availabilityToggle').prop('checked', worker.availability);
                
                // Toggle Logic
                $('#availabilityToggle').change(function() {
                    const available = $(this).is(':checked');
                    DB.update('workers', workerId, { availability: available });
                    const msg = available ? 'You are now online' : 'You are now offline';
                    const icon = available ? 'success' : 'info';
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: icon,
                        title: msg,
                        showConfirmButton: false,
                        timer: 3000
                    });
                });

                // Calls
                const calls = DB.getAll('calls').filter(c => c.workerId == workerId);
                const today = new Date().toISOString().split('T')[0];
                const todayCalls = calls.filter(c => c.date === today).length;
                const earnings = calls.reduce((sum, c) => sum + (c.status === 'Completed' ? c.amount : 0), 0);

                $('#todayCalls').text(todayCalls);
                $('#totalEarnings').text(earnings);

                calls.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 10).forEach(c => {
                    let badge = 'bg-secondary';
                    if(c.status === 'Completed') badge = 'bg-success';
                    if(c.status === 'Missed') badge = 'bg-danger';

                    $('#callHistoryBody').append(`
                        <tr>
                            <td>${c.date} <br> <small>${c.time}</small></td>
                            <td>${c.customerName}</td>
                            <td><span class="badge ${badge}">${c.status}</span></td>
                            <td>${c.amount}</td>
                        </tr>
                    `);
                });
            } else {
                 Swal.fire('Error', 'Worker profile not found for this user.', 'error');
            }
        });
    </script>
</body>
</html>
