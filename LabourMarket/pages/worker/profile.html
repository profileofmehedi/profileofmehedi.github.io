<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Worker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="brand">Worker App</div>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="profile.html" class="active"><i class="fas fa-user me-2"></i> My Profile</a>
        <a href="history.html"><i class="fas fa-history me-2"></i> Call History</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="content">
        <h3 class="mb-4">My Profile</h3>
        <div class="card shadow-sm col-md-8 mx-auto">
            <div class="card-body">
                <form id="profileForm">
                    <div class="text-center mb-4">
                        <img src="" id="pCheck" class="rounded-circle mb-3" style="width: 100px; height: 100px; object-fit: cover;">
                        <h4 id="pNameDisplay"></h4>
                        <span class="badge bg-primary" id="pCategoryDisplay"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Full Name</label>
                            <input type="text" class="form-control" id="pName" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Phone</label>
                            <input type="text" class="form-control" id="pPhone" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Area</label>
                            <input type="text" class="form-control" id="pArea" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Experience</label>
                            <input type="text" class="form-control" id="pExperience">
                        </div>
                    </div>

                    <div class="row">
                         <div class="col-md-6 mb-3">
                            <label>Rate (BDT)</label>
                            <input type="number" class="form-control" id="pRate" required>
                        </div>
                         <div class="col-md-6 mb-3">
                            <label>Type</label>
                            <input type="text" class="form-control" id="pType" readonly>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Update Profile</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            const user = DB.checkAuth('worker');
            if(!user) return;

            let workerId = user.workerId || 1;
            const worker = DB.getAll('workers').find(w => w.id == workerId);

            if(worker) {
                $('#pCheck').attr('src', worker.image);
                $('#pNameDisplay').text(worker.name);
                $('#pCategoryDisplay').text(worker.category);
                
                $('#pName').val(worker.name);
                $('#pPhone').val(worker.phone);
                $('#pArea').val(worker.area);
                $('#pExperience').val(worker.experience);
                $('#pRate').val(worker.rate);
                $('#pType').val(worker.type);

                $('#profileForm').submit(function(e) {
                    e.preventDefault();
                    const updates = {
                        phone: $('#pPhone').val(),
                        area: $('#pArea').val(),
                        experience: $('#pExperience').val(),
                        rate: parseInt($('#pRate').val())
                    };
                    
                    DB.update('workers', workerId, updates);
                    Swal.fire('Success', 'Profile updated successfully', 'success');
                });
            }
        });
    </script>
</body>
</html>
