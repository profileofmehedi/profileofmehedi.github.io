<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Call History - Worker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="brand">Worker App</div>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="profile.html"><i class="fas fa-user me-2"></i> My Profile</a>
        <a href="history.html" class="active"><i class="fas fa-history me-2"></i> Call History</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="content">
        <h3 class="mb-4">Full Call History</h3>
        <div class="card shadow-sm">
            <div class="card-body">
                <table id="historyTable" class="table table-striped" style="width:100%">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Customer Name</th>
                            <th>Status</th>
                            <th>Amount (BDT)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            const user = DB.checkAuth('worker');
            if(!user) return;

            let workerId = user.workerId || 1;
            const calls = DB.getAll('calls').filter(c => c.workerId == workerId);

            $('#historyTable').DataTable({
                data: calls,
                columns: [
                    { data: 'date' },
                    { data: 'time' },
                    { data: 'customerName' },
                    { 
                        data: 'status',
                        render: function(data) {
                            let cls = 'bg-secondary';
                            if (data === 'Completed') cls = 'bg-success';
                            if (data === 'Missed') cls = 'bg-danger';
                            return `<span class="badge ${cls}">${data}</span>`;
                        }
                    },
                    { data: 'amount' }
                ],
                order: [[0, 'desc']]
            });
        });
    </script>
</body>
</html>
