<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Local Worker Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Worker Market</h3>
            <p class="text-muted">Sign in to your account</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <div class="mt-3 text-center">
            <small class="text-muted">
                Demo Credentials:<br>
                Super: super@worker.com / 123<br>
                Client: client@worker.com / 123<br>
                Worker: worker@demo.com / 123<br>
                Customer: customer@demo.com / 123
            </small>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/db.js"></script>
    <script>
        $(document).ready(function() {
            // Clear session on login page load
            localStorage.removeItem('user_session');

            $('#loginForm').submit(function(e) {
                e.preventDefault();
                const email = $('#email').val();
                const password = $('#password').val();

                const user = DB.login(email, password);

                if (user) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Successful',
                        text: 'Redirecting...',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        switch(user.role) {
                            case 'super-admin':
                                window.location.href = 'super-admin/dashboard.html';
                                break;
                            case 'client-admin':
                                window.location.href = 'client-admin/dashboard.html';
                                break;
                            case 'worker':
                                window.location.href = 'worker/dashboard.html';
                                break;
                            case 'customer':
                                window.location.href = 'customer/dashboard.html';
                                break;
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: 'Invalid email or password'
                    });
                }
            });
        });
    </script>
</body>
</html>
