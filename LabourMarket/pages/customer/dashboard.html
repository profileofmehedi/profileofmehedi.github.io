<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Workers - Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .sidebar { display: none; } /* Hide sidebar for customer */
        .content { margin-left: 0; }
        .hero-section {
            background-color: #007bff;
            color: white;
            padding: 60px 0;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Worker Market</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3 user-name-display">Customer</span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="hero-section text-center">
        <div class="container">
            <h1>Find Local Daily Labour & Workers</h1>
            <p class="lead">Electricians, Plumbers, Masons, and more nearby.</p>
        </div>
    </div>

    <div class="container content">
        
        <!-- Search Filters -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <select class="form-select" id="filterCategory">
                            <option value="">All Categories</option>
                            <option>Electrician</option>
                            <option>Plumber</option>
                            <option>Mason</option>
                            <option>Carpenter</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                         <input type="text" class="form-control" id="filterArea" placeholder="Area (e.g. Mirpur)">
                    </div>
                    <div class="col-md-3">
                         <select class="form-select" id="filterSort">
                             <option value="default">Sort by</option>
                             <option value="priceLow">Price: Low to High</option>
                             <option value="priceHigh">Price: High to Low</option>
                         </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" id="searchBtn">Search</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="row" id="workersContainer">
            <!-- Populated via JS -->
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            DB.checkAuth('customer');
            
            function renderWorkers(workers) {
                $('#workersContainer').empty();
                if(workers.length === 0) {
                    $('#workersContainer').html('<div class="col-12 text-center text-muted"><h4>No workers found matching your criteria.</h4></div>');
                    return;
                }

                workers.forEach(w => {
                    const statusBadge = w.availability 
                        ? '<span class="badge bg-success position-absolute top-0 end-0 m-3">Available</span>' 
                        : '<span class="badge bg-secondary position-absolute top-0 end-0 m-3">Busy</span>';
                    
                    $('#workersContainer').append(`
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 worker-card" onclick="window.location.href='worker-details.html?id=${w.id}'">
                                ${statusBadge}
                                <div class="card-body text-center">
                                    <img src="${w.image}" class="avatar-img mb-3" style="width: 80px; height: 80px;">
                                    <h5 class="card-title">${w.name}</h5>
                                    <p class="text-primary fw-bold mb-1">${w.category}</p>
                                    <p class="text-muted small"><i class="fas fa-map-marker-alt"></i> ${w.area}</p>
                                    <h4 class="text-dark">${w.rate} BDT <small class="fs-6 text-muted">/${w.type}</small></h4>
                                    <button class="btn btn-outline-primary mt-2">View Profile</button>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // Initial Load (Only Approved)
            let allWorkers = DB.getAll('workers').filter(w => w.status === 'Approved');
            renderWorkers(allWorkers);

            // Filter Logic
            $('#searchBtn').click(function() {
                const cat = $('#filterCategory').val();
                const area = $('#filterArea').val().toLowerCase();
                const sort = $('#filterSort').val();

                let filtered = allWorkers.filter(w => {
                    return (cat === '' || w.category === cat) &&
                           (area === '' || w.area.toLowerCase().includes(area));
                });

                if(sort === 'priceLow') filtered.sort((a,b) => a.rate - b.rate);
                if(sort === 'priceHigh') filtered.sort((a,b) => b.rate - a.rate);

                renderWorkers(filtered);
            });
        });
    </script>
</body>
</html>
