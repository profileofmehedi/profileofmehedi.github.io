<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worker Details - Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .sidebar { display: none; }
        .content { margin-left: 0; padding-top: 80px; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-arrow-left me-2"></i> Back to Search</a>
            <div class="d-flex">
                 <span class="navbar-text text-white user-name-display">Customer</span>
            </div>
        </div>
    </nav>

    <div class="container content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center">
                            <img src="" id="wImage" class="rounded-circle mb-3 border border-3 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                            <h2 class="fw-bold" id="wName"></h2>
                            <p class="text-primary fs-5" id="wCategory"></p>
                            <span id="wStatus"></span>
                        </div>

                        <hr class="my-4">

                        <div class="row text-center mb-4">
                            <div class="col-4 border-end">
                                <h5 class="fw-bold" id="wRate"></h5>
                                <span class="text-muted small">Daily Rate</span>
                            </div>
                            <div class="col-4 border-end">
                                <h5 class="fw-bold" id="wExp"></h5>
                                <span class="text-muted small">Experience</span>
                            </div>
                            <div class="col-4">
                                <h5 class="fw-bold" id="wArea"></h5>
                                <span class="text-muted small">Location</span>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-success btn-lg" id="callBtn">
                                <i class="fas fa-phone-alt me-2"></i> CALL NOW
                            </button>
                            <div class="alert alert-info text-center mt-2 small">
                                Clicking "Call Now" will share your contact info with the worker and log the call.
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            const user = DB.checkAuth('customer');
            
            // Parse URL Param
            const urlParams = new URLSearchParams(window.location.search);
            const workerId = urlParams.get('id');

            const worker = DB.getAll('workers').find(w => w.id == workerId);
            
            if(!worker) {
                Swal.fire('Error', 'Worker not found', 'error').then(() => window.location.href='dashboard.html');
                return;
            }

            // Render
            $('#wImage').attr('src', worker.image);
            $('#wName').text(worker.name);
            $('#wCategory').text(worker.category);
            $('#wRate').text(worker.rate + ' BDT');
            $('#wExp').text(worker.experience);
            $('#wArea').text(worker.area);

            if(worker.availability) {
                $('#wStatus').html('<span class="badge bg-success">Available Now</span>');
            } else {
                $('#wStatus').html('<span class="badge bg-secondary">Currently Busy</span>');
                $('#callBtn').prop('disabled', true).text('Not Available');
            }

            // Call Action
            $('#callBtn').click(function() {
                Swal.fire({
                    title: 'Call ' + worker.name + '?',
                    text: "Number: " + worker.phone,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Call Placed (Simulate)',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Log Call
                        const newCall = {
                            workerId: worker.id,
                            customerId: user.id,
                            customerName: user.name,
                            date: new Date().toISOString().split('T')[0],
                            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            status: 'Completed',
                            amount: worker.rate
                        };
                        
                        DB.add('calls', newCall);

                        Swal.fire({
                            title: 'Connected!',
                            text: 'You are connected to ' + worker.name,
                            icon: 'success'
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
