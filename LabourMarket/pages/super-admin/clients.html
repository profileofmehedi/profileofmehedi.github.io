<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Clients - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="brand">SaaS Admin</div>
        <div class="text-center mb-3">
            <img src="https://ui-avatars.com/api/?name=Super+Admin&background=random" class="avatar-img mb-2" alt="User">
            <div class="small text-white user-name-display">Super Admin</div>
        </div>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="clients.html" class="active"><i class="fas fa-building me-2"></i> Clients</a>
        <a href="plans.html"><i class="fas fa-tags me-2"></i> Plans</a>
        <a href="billing.html"><i class="fas fa-file-invoice-dollar me-2"></i> Billing</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="content">
        <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary d-md-none" id="sidebarCollapse">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="navbar-brand mb-0 h1 ms-2">Client Management</span>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#clientModal">
                    <i class="fas fa-plus"></i> Add Client
                </button>
            </div>
        </nav>

        <div class="card shadow-sm">
            <div class="card-body">
                <table id="clientsTable" class="table table-striped" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="clientModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add/Edit Client</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="clientForm">
                        <input type="hidden" id="clientId">
                        <div class="mb-3">
                            <label>Client Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label>Phone</label>
                            <input type="text" class="form-control" id="phone" required>
                        </div>
                        <div class="mb-3">
                            <label>Plan</label>
                            <select class="form-select" id="plan">
                                <option value="Silver">Silver</option>
                                <option value="Gold">Gold</option>
                                <option value="Platinum">Platinum</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Status</label>
                            <select class="form-select" id="status">
                                <option value="Active">Active</option>
                                <option value="Suspended">Suspended</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Client</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            DB.checkAuth('super-admin');

            const table = $('#clientsTable').DataTable({
                data: DB.getAll('clients'),
                columns: [
                    { data: 'id' },
                    { data: 'name' },
                    { data: 'email' },
                    { data: 'plan' },
                    { 
                        data: 'status',
                        render: function(data) {
                            return `<span class="badge ${data === 'Active' ? 'bg-success' : 'bg-danger'}">${data}</span>`;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <button class="btn btn-sm btn-info edit-btn" data-id="${row.id}"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-sm btn-warning suspend-btn" data-id="${row.id}"><i class="fas fa-ban"></i></button>
                            `;
                        }
                    }
                ]
            });

            // Add/Edit
            $('#clientForm').submit(function(e) {
                e.preventDefault();
                const id = $('#clientId').val();
                const data = {
                    name: $('#name').val(),
                    email: $('#email').val(),
                    phone: $('#phone').val(),
                    plan: $('#plan').val(),
                    status: $('#status').val()
                };

                if (id) {
                    DB.update('clients', id, data);
                    Swal.fire('Updated!', 'Client info updated.', 'success');
                } else {
                    DB.add('clients', data);
                    Swal.fire('Added!', 'New client added.', 'success');
                }
                
                $('#clientModal').modal('hide');
                setTimeout(() => location.reload(), 1000);
            });

            // Edit Click
            $('#clientsTable').on('click', '.edit-btn', function() {
                const id = $(this).data('id');
                const client = DB.getAll('clients').find(c => c.id == id);
                $('#clientId').val(client.id);
                $('#name').val(client.name);
                $('#email').val(client.email);
                $('#phone').val(client.phone);
                $('#plan').val(client.plan);
                $('#status').val(client.status);
                $('#clientModal').modal('show');
            });

            // Suspend Toggle
            $('#clientsTable').on('click', '.suspend-btn', function() {
                const id = $(this).data('id');
                const client = DB.getAll('clients').find(c => c.id == id);
                const newStatus = client.status === 'Active' ? 'Suspended' : 'Active';
                
                Swal.fire({
                    title: `Mark as ${newStatus}?`,
                    showCancelButton: true,
                    confirmButtonText: 'Yes'
                }).then((res) => {
                    if (res.isConfirmed) {
                        DB.update('clients', id, { status: newStatus });
                        location.reload();
                    }
                });
            });
        });
    </script>
</body>
</html>
