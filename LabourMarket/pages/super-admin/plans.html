<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plans - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="brand">SaaS Admin</div>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="clients.html"><i class="fas fa-building me-2"></i> Clients</a>
        <a href="plans.html" class="active"><i class="fas fa-tags me-2"></i> Plans</a>
        <a href="billing.html"><i class="fas fa-file-invoice-dollar me-2"></i> Billing</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="content">
        <h3 class="mb-4">Subscription Plans</h3>
        <div class="row" id="plansContainer">
            <!-- Populated via JS -->
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            DB.checkAuth('super-admin');
            const plans = DB.getAll('plans');
            plans.forEach(plan => {
                $('#plansContainer').append(`
                    <div class="col-md-4">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body text-center">
                                <h4 class="card-title text-primary">${plan.name}</h4>
                                <h2 class="display-4 my-3">${plan.price}<small class="fs-6 text-muted"> BDT</small></h2>
                                <p class="text-muted">${plan.duration}</p>
                                <ul class="list-unstyled">
                                    <li>${plan.workerLimit} Workers Limit</li>
                                    <li>Standard Support</li>
                                </ul>
                                <button class="btn btn-outline-primary">Edit Plan</button>
                            </div>
                        </div>
                    </div>
                `);
            });
        });
    </script>
</body>
</html>
