<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="brand">SaaS Admin</div>
        <div class="text-center mb-3">
            <img src="https://ui-avatars.com/api/?name=Super+Admin&background=random" class="avatar-img mb-2" alt="User">
            <div class="small text-white user-name-display">Super Admin</div>
        </div>
        <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="clients.html"><i class="fas fa-building me-2"></i> Clients</a>
        <a href="plans.html"><i class="fas fa-tags me-2"></i> Plans</a>
        <a href="billing.html"><i class="fas fa-file-invoice-dollar me-2"></i> Billing</a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <!-- Content -->
    <div class="content">
        <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary d-md-none" id="sidebarCollapse">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="navbar-brand mb-0 h1 ms-2">Dashboard Overview</span>
            </div>
        </nav>

        <div class="row">
            <div class="col-md-3">
                <div class="card-counter bg-primary-light position-relative">
                    <i class="fas fa-building"></i>
                    <span class="count-numbers" id="totalClients">0</span>
                    <span class="count-name">Total Clients</span>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-counter bg-success-light position-relative">
                    <i class="fas fa-check-circle"></i>
                    <span class="count-numbers" id="activeClients">0</span>
                    <span class="count-name">Active Clients</span>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-counter bg-warning-light position-relative">
                    <i class="fas fa-users"></i>
                    <span class="count-numbers" id="totalWorkers">0</span>
                    <span class="count-name">Total Workers</span>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-counter bg-danger-light position-relative">
                    <i class="fas fa-dollar-sign"></i>
                    <span class="count-numbers">250k</span>
                    <span class="count-name">Monthly Rev. (BDT)</span>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Recent Clients</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="recentClientsTable">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Plan</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Populated via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        $(document).ready(function() {
            DB.checkAuth('super-admin');

            const clients = DB.getAll('clients');
            const workers = DB.getAll('workers');

            $('#totalClients').text(clients.length);
            $('#activeClients').text(clients.filter(c => c.status === 'Active').length);
            $('#totalWorkers').text(workers.length);

            const tbody = $('#recentClientsTable tbody');
            clients.slice(0, 5).forEach(client => {
                let badge = client.status === 'Active' ? 'status-active' : 'status-inactive';
                tbody.append(`
                    <tr>
                        <td>${client.name}</td>
                        <td>${client.email}</td>
                        <td>${client.plan}</td>
                        <td><span class="badge ${badge}">${client.status}</span></td>
                    </tr>
                `);
            });
        });
    </script>
</body>
</html>
