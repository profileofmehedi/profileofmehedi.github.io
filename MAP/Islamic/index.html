<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নবীগণের ঐতিহাসিক মানচিত্র - Islamic Prophets Map</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <span class="icon">🕌</span>
            <h1>নবীগণের ঐতিহাসিক মানচিত্র</h1>
        </div>
        <div class="header-right">
            <div class="search-container">
                <input type="text" id="prophet-search" placeholder="নবী খুঁজুন..." aria-label="Search Prophet">
            </div>
            <button id="view-toggle" class="mode-btn" title="৩ডি গ্লোব/২ডি ম্যাপ">🌍 ৩ডি</button>
            <button id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <div class="layer-toggles">
                <label><input type="checkbox" id="toggle-birthplaces" checked> <span class="dot birth"></span> জন্মস্থান</label>
                <label><input type="checkbox" id="toggle-migrations" checked> <span class="dot migration"></span> হিজরত</label>
            </div>
            <div class="info-text">
                <span id="stat-count">৭০ জন নবীর তথ্য একসাথে প্রদর্শিত হচ্ছে</span>
            </div>
        </div>

        <div class="map-container" id="map-container">
            <div id="loading">মানচিত্র লোড হচ্ছে...</div>
            <svg id="map-svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
                <rect id="ocean-bg" width="100%" height="100%" fill="transparent" />
                <g id="map-zoom-group">
                    <g id="basemap"></g>
                    <g id="paths-layer"></g>
                    <g id="markers-layer"></g>
                </g>
            </svg>
            
            <div class="legend" aria-hidden="true">
                <div class="legend-title">নির্দেশিকা</div>
                <div class="legend-item"><span class="color-box birth"></span> জন্মস্থান / আদি স্থান</div>
                <div class="legend-item"><span class="color-box migration"></span> হিজরতের গন্তব্য</div>
                <div class="legend-item"><span class="color-line"></span> ভ্রমণের পথ</div>
            </div>

            <div id="tooltip" class="tooltip hidden"></div>
        </div>
    </main>

    <aside id="side-panel" class="side-panel hidden">
        <button id="close-panel" aria-label="Close details panel">&times;</button>
        <div id="panel-content">
            <!-- Dynamic Content via app.js -->
        </div>
    </aside>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
