<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional World Map Explorer</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --highlight: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Controls --- */
        .controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-group {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--surface);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { background: var(--accent); transform: translateY(-2px); }

        /* --- Map Area --- */
        #map-viewport {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        #map-viewport.dragging { cursor: grabbing; }

        svg { width: 100%; height: 100%; display: block; }

        path {
            stroke: rgba(15, 23, 42, 0.5);
            stroke-width: 0.3;
            transition: fill 0.3s ease, stroke-width 0.2s ease;
            outline: none;
        }

        path:hover {
            stroke: #fff;
            stroke-width: 1;
            cursor: pointer;
            filter: brightness(1.2);
            z-index: 10;
        }

        path.highlighted { stroke: #fff; stroke-width: 1.2; filter: brightness(1.2); }
        path.selected { stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 12px var(--accent)); }

        /* --- Tooltip --- */
        #tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            transform: translate(-50%, -130%);
            display: none;
            z-index: 1000;
        }

        /* --- Dashboard --- */
        .dashboard {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 340px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .dashboard h2 { margin: 0 0 12px 0; font-size: 24px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .info-grid { display: grid; grid-template-columns: 100px 1fr; gap: 8px; margin-top: 12px; }
        .info-label { color: var(--text-dim); font-size: 13px; font-weight: 600; text-transform: uppercase; }
        .info-value { color: var(--text); font-size: 14px; }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="btn-group">
            <button class="btn" id="zoom-in" title="Zoom In">+</button>
            <button class="btn" id="zoom-out" title="Zoom Out">−</button>
            <button class="btn" id="reset" title="Reset View">⟲</button>
        </div>
    </div>

    <div id="map-viewport">
        <svg id="world-svg" viewBox="0 0 2000 857" preserveAspectRatio="xMidYMid meet">
            <g id="map-layer"></g>
        </svg>
    </div>

    <div id="tooltip"></div>

    <div class="dashboard" id="details-panel">
        <h2 id="country-name">World Map</h2>
        <div id="country-info">
            <p>Select a country to explore detailed geographic and demographic data.</p>
        </div>
    </div>

    <div class="instructions">Scroll to Zoom • Click & Drag to Move • Click to Select</div>

    <script>
        const mapLayer = document.getElementById('map-layer');
        const tooltip = document.getElementById('tooltip');
        const svg = document.getElementById('world-svg');
        const viewport = document.getElementById('map-viewport');
        const countryTitle = document.getElementById('country-name');
        const infoPanel = document.getElementById('country-info');

        let viewBox = { x: 0, y: 0, w: 2000, h: 857 };
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };

        const palette = ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#818cf8', '#c084fc', '#2dd4bf', '#fb7185', '#34d399', '#a78bfa'];

        // Built-in Country Data
        const countryDatabase = {
            "af": { capital: "Kabul", population: "41.1 Million", continent: "Asia", area: "652,230 km²" },
            "us": { capital: "Washington, D.C.", population: "333.3 Million", continent: "North America", area: "9.8 Million km²" },
            "ru": { capital: "Moscow", population: "144.2 Million", continent: "Europe/Asia", area: "17.1 Million km²" },
            "cn": { capital: "Beijing", population: "1.4 Billion", continent: "Asia", area: "9.6 Million km²" },
            "br": { capital: "Brasília", population: "215.3 Million", continent: "South America", area: "8.5 Million km²" },
            "au": { capital: "Canberra", population: "26.0 Million", continent: "Oceania", area: "7.7 Million km²" },
            "in": { capital: "New Delhi", population: "1.4 Billion", continent: "Asia", area: "3.3 Million km²" },
            "gb": { capital: "London", population: "67.3 Million", continent: "Europe", area: "243,610 km²" }
        };

        async function init() {
            try {
                const response = await fetch('world.svg');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'image/svg+xml');
                const paths = doc.querySelectorAll('path');
                
                const countryGroups = {};
                
                paths.forEach((path, index) => {
                    const name = path.getAttribute('name') || path.getAttribute('class') || path.id || "Unknown";
                    const groupKey = name.toLowerCase().replace(/\s+/g, '-');
                    
                    if (!countryGroups[groupKey]) {
                        countryGroups[groupKey] = {
                            name: name,
                            color: palette[Object.keys(countryGroups).length % palette.length],
                            id: path.id || groupKey.substring(0,2).toUpperCase()
                        };
                    }
                    
                    const newPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    newPath.setAttribute('d', path.getAttribute('d'));
                    newPath.setAttribute('data-country', groupKey);
                    newPath.setAttribute('data-name', name);
                    newPath.style.fill = countryGroups[groupKey].color;
                    newPath.style.fillOpacity = "0.75";
                    
                    mapLayer.appendChild(newPath);
                });
            } catch (e) {
                console.error("Map load failed", e);
                mapLayer.innerHTML = `<text x="1000" y="400" text-anchor="middle" fill="white" font-size="24">Error: world.svg must be in the same folder.</text>`;
            }
        }

        // --- ViewBox Control (Zoom/Pan) ---
        function updateViewBox() {
            svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        }

        function zoom(delta, clientX, clientY) {
            const zoomFactor = delta > 0 ? 0.8 : 1.25;
            const newW = viewBox.w * zoomFactor;
            const newH = viewBox.h * zoomFactor;

            if (newW < 5 || newW > 15000) return;

            const rect = svg.getBoundingClientRect();
            const mouseX = (clientX - rect.left) / rect.width;
            const mouseY = (clientY - rect.top) / rect.height;

            viewBox.x += (viewBox.w - newW) * mouseX;
            viewBox.y += (viewBox.h - newH) * mouseY;
            viewBox.w = newW;
            viewBox.h = newH;

            updateViewBox();
        }

        // --- Fixed Dragging Logic ---
        viewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Only left click
            isDragging = true;
            viewport.classList.add('dragging');
            lastMousePos = { x: e.clientX, y: e.clientY };
            e.preventDefault(); // Critical: Stop browser from selecting text/dragging SVG element
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                
                // Map screen pixels to SVG coordinate units
                const scaleX = viewBox.w / viewport.clientWidth;
                const scaleY = viewBox.h / viewport.clientHeight;
                
                viewBox.x -= dx * scaleX;
                viewBox.y -= dy * scaleY;
                
                lastMousePos = { x: e.clientX, y: e.clientY };
                updateViewBox();
            }
            
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top = e.clientY + 'px';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.classList.remove('dragging');
        });

        // --- Interaction ---
        mapLayer.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'path') {
                const countryKey = e.target.getAttribute('data-country');
                document.querySelectorAll(`path[data-country="${countryKey}"]`).forEach(p => p.classList.add('highlighted'));
                tooltip.textContent = e.target.getAttribute('data-name');
                tooltip.style.display = 'block';
            }
        });

        mapLayer.addEventListener('mouseout', () => {
            document.querySelectorAll('path.highlighted').forEach(p => p.classList.remove('highlighted'));
            tooltip.style.display = 'none';
        });

        mapLayer.addEventListener('click', (e) => {
            if (e.target.tagName === 'path' && !isDragging) {
                document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
                const countryKey = e.target.getAttribute('data-country');
                const name = e.target.getAttribute('data-name');
                const iso = countryKey.substring(0,2);
                
                document.querySelectorAll(`path[data-country="${countryKey}"]`).forEach(p => p.classList.add('selected'));
                
                countryTitle.textContent = name;
                
                // Show detailed information
                const data = countryDatabase[iso] || { capital: "Information Pending", population: "N/A", continent: "Global", area: "N/A" };
                
                infoPanel.innerHTML = `
                    <div class="info-grid">
                        <div class="info-label">ID</div><div class="info-value">${countryKey.toUpperCase()}</div>
                        <div class="info-label">Capital</div><div class="info-value">${data.capital}</div>
                        <div class="info-label">Region</div><div class="info-value">${data.continent}</div>
                        <div class="info-label">Population</div><div class="info-value">${data.population}</div>
                        <div class="info-label">Area</div><div class="info-value">${data.area}</div>
                    </div>
                    <p style="margin-top: 15px; font-size: 13px; color: var(--text-dim);">
                        Territory data is rendered using high-fidelity vector paths from your source file.
                    </p>
                `;
            }
        });

        // Controls
        document.getElementById('zoom-in').onclick = () => zoom(1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('zoom-out').onclick = () => zoom(-1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('reset').onclick = () => {
            viewBox = { x: 0, y: 0, w: 2000, h: 857 };
            updateViewBox();
            countryTitle.textContent = "World Map";
            infoPanel.innerHTML = `<p>Select a country to explore detailed geographic and demographic data.</p>`;
            document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
        };

        init();
    </script>
</body>
</html>
