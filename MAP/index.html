<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional World Map Explorer</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --highlight: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Controls --- */
        .controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-group {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--surface);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* --- Map Area --- */
        #map-viewport {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #map-viewport:active { cursor: grabbing; }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        path {
            stroke: rgba(15, 23, 42, 0.5);
            stroke-width: 0.3;
            transition: fill 0.3s ease, stroke-width 0.2s ease;
            outline: none;
        }

        path:hover {
            stroke: #fff;
            stroke-width: 1;
            cursor: pointer;
            filter: brightness(1.2);
            z-index: 10;
        }

        path.highlighted {
            stroke: #fff;
            stroke-width: 1.5;
            filter: brightness(1.3);
        }

        path.selected {
            stroke: #fff;
            stroke-width: 2;
            filter: drop-shadow(0 0 12px var(--accent));
        }

        /* --- Tooltip --- */
        #tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border);
            transform: translate(-50%, -130%);
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* --- Dashboard --- */
        .dashboard {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 320px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .dashboard h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: var(--accent);
        }

        .dashboard p {
            margin: 0;
            font-size: 15px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>

    <div class="controls">
        <div class="btn-group">
            <button class="btn" id="zoom-in" title="Zoom In">+</button>
            <button class="btn" id="zoom-out" title="Zoom Out">−</button>
            <button class="btn" id="reset" title="Reset View">⟲</button>
        </div>
    </div>

    <div id="tooltip"></div>

        // --- Navigation Logic ---
        function updateViewBox() {
            svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        }

        function zoom(delta, clientX, clientY) {
            const zoomFactor = delta > 0 ? 0.85 : 1.18;
            const newW = viewBox.w * zoomFactor;
            const newH = viewBox.h * zoomFactor;

            if (newW < 10 || newW > 10000) return;

            const rect = viewport.getBoundingClientRect();
            const mouseX = (clientX - rect.left) / rect.width;
            const mouseY = (clientY - rect.top) / rect.height;

            viewBox.x += (viewBox.w - newW) * mouseX;
            viewBox.y += (viewBox.h - newH) * mouseY;
            viewBox.w = newW;
            viewBox.h = newH;

            updateViewBox();
        }

        function pan(dx, dy) {
            const scaleX = viewBox.w / viewport.clientWidth;
            const scaleY = viewBox.h / viewport.clientHeight;
            viewBox.x -= dx * scaleX;
            viewBox.y -= dy * scaleY;
            updateViewBox();
        }

        // --- Interaction Listeners ---
        viewport.addEventListener('wheel', (e) => { e.preventDefault(); zoom(-e.deltaY, e.clientX, e.clientY); }, { passive: false });
        viewport.addEventListener('mousedown', (e) => { isDragging = true; startPoint = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                pan(e.clientX - startPoint.x, e.clientY - startPoint.y);
                startPoint = { x: e.clientX, y: e.clientY };
            }
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top = e.clientY + 'px';
        });
        window.addEventListener('mouseup', () => isDragging = false);

        mapLayer.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'path') {
                const countryKey = e.target.getAttribute('data-country');
                const paths = document.querySelectorAll(`path[data-country="${countryKey}"]`);
                paths.forEach(p => p.classList.add('highlighted'));
                
                tooltip.textContent = e.target.getAttribute('data-country').toUpperCase();
                tooltip.style.display = 'block';
            }
        });

        mapLayer.addEventListener('mouseout', () => {
            document.querySelectorAll('path.highlighted').forEach(p => p.classList.remove('highlighted'));
            tooltip.style.display = 'none';
        });

        mapLayer.addEventListener('click', (e) => {
            if (e.target.tagName === 'path') {
                document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
                const countryKey = e.target.getAttribute('data-country');
                const paths = document.querySelectorAll(`path[data-country="${countryKey}"]`);
                paths.forEach(p => p.classList.add('selected'));
                
                const name = countryKey.charAt(0).toUpperCase() + countryKey.slice(1);
                countryTitle.textContent = name;
                countryDesc.textContent = `You have selected ${name}. This territory is defined by the high-resolution geometric data from world.svg.`;
            }
        });

        document.getElementById('zoom-in').onclick = () => zoom(1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('zoom-out').onclick = () => zoom(-1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('reset').onclick = () => {
            viewBox = { x: 0, y: 0, w: 2000, h: 857 };
            updateViewBox();
            countryTitle.textContent = "World Map";
            countryDesc.textContent = "Select a country to explore. Each territory is accurately mapped from professional SVG data.";
            document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
        };
