<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Pro Explorer</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --highlight: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Controls --- */
        .controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 300px;
        }

        .search-container {
            position: relative;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        #search-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px;
            font-size: 15px;
            outline: none;
        }

        #search-input::placeholder { color: var(--text-dim); }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 8px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .search-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .search-item:hover { background: var(--accent); }

        .btn-group {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: fit-content;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--surface);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { background: var(--accent); transform: translateY(-2px); }

        /* --- Map Area --- */
        #map-viewport {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            overflow: hidden;
            background: var(--bg);
        }

        #map-viewport:active { cursor: grabbing; }

        svg { 
            width: 100%; 
            height: 100%; 
            display: block; 
            pointer-events: all;
        }

        path {
            stroke: rgba(15, 23, 42, 0.5);
            stroke-width: 0.3;
            transition: fill 0.3s ease, stroke-width 0.2s ease;
            outline: none;
        }

        path:hover {
            stroke: #fff;
            stroke-width: 1;
            cursor: pointer;
            filter: brightness(1.2);
            z-index: 10;
        }

        path.highlighted { stroke: #fff; stroke-width: 1.2; filter: brightness(1.2); }
        path.selected { stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 12px var(--accent)); }

        /* Country Labels */
        .country-label {
            fill: white;
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s;
            text-anchor: middle;
        }

        /* --- Dashboard --- */
        .dashboard {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 380px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            pointer-events: auto;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 200;
        }

        .dashboard h2 { 
            margin: 0 0 12px 0; 
            font-size: 24px; 
            color: var(--accent); 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
        }

        .info-grid { 
            display: grid; 
            grid-template-columns: 110px 1fr; 
            gap: 12px 8px; 
            margin-top: 12px; 
        }

        .info-label { color: var(--text-dim); font-size: 13px; font-weight: 600; text-transform: uppercase; }
        .info-value { color: var(--text); font-size: 14px; }
        
        .info-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .info-link:hover { text-decoration: underline; }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        #tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search country name...">
            <div id="search-results" class="search-results"></div>
        </div>
        <div class="btn-group">
            <button class="btn" id="zoom-in">+</button>
            <button class="btn" id="zoom-out">−</button>
            <button class="btn" id="reset">⟲</button>
        </div>
    </div>

    <div id="map-viewport">
        <svg id="world-svg" viewBox="0 0 2000 857" preserveAspectRatio="xMidYMid meet">
            <g id="map-layer"></g>
            <g id="label-layer"></g>
        </svg>
    </div>

    <div id="tooltip"></div>

    <div class="dashboard" id="details-panel">
        <h2 id="country-name">World Map</h2>
        <div id="country-info">
            <p style="color: var(--text-dim);">Select or search a country to explore details.</p>
        </div>
    </div>

    <div class="instructions">Scroll to Zoom • Click & Drag to Move • Click to Select</div>

    <script>
        const mapLayer = document.getElementById('map-layer');
        const labelLayer = document.getElementById('label-layer');
        const tooltip = document.getElementById('tooltip');
        const svg = document.getElementById('world-svg');
        const viewport = document.getElementById('map-viewport');
        const countryTitle = document.getElementById('country-name');
        const infoPanel = document.getElementById('country-info');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        let viewBox = { x: 0, y: 0, w: 2000, h: 857 };
        let isDragging = false;
        let startPoint = { x: 0, y: 0 };
        let totalDistMoved = 0;
        let countries = [];

        const palette = ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#818cf8', '#c084fc', '#2dd4bf', '#fb7185', '#34d399', '#a78bfa'];

        // Comprehensive Country Database (Truncated for space, assume full list is logic-bound)
        const countryDatabase = {
            "US": { capital: "Washington, D.C.", population: "335M", continent: "North America", area: "9.83M km²", language: "English", religion: "Christianity", leaderTitle: "President", leaderName: "Donald Trump", leaderLink: "https://en.wikipedia.org/wiki/Donald_Trump", mediaName: "NY Times", mediaLink: "https://www.nytimes.com" },
            "CN": { capital: "Beijing", population: "1.41B", continent: "Asia", area: "9.6M km²", language: "Mandarin", religion: "Unaffiliated", leaderTitle: "President", leaderName: "Xi Jinping", leaderLink: "https://en.wikipedia.org/wiki/Xi_Jinping", mediaName: "Xinhua", mediaLink: "http://www.xinhuanet.com" },
            "IN": { capital: "New Delhi", population: "1.43B", continent: "Asia", area: "3.28M km²", language: "Hindi, English", religion: "Hinduism", leaderTitle: "Prime Minister", leaderName: "Narendra Modi", leaderLink: "https://en.wikipedia.org/wiki/Narendra_Modi", mediaName: "Times of India", mediaLink: "https://timesofindia.indiatimes.com" },
            "RU": { capital: "Moscow", population: "143M", continent: "Europe/Asia", area: "17.1M km²", language: "Russian", religion: "Orthodox", leaderTitle: "President", leaderName: "Vladimir Putin", leaderLink: "https://en.wikipedia.org/wiki/Vladimir_Putin", mediaName: "TASS", mediaLink: "https://tass.com" }
        };

        async function init() {
            try {
                const response = await fetch('world.svg');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'image/svg+xml');
                const paths = doc.querySelectorAll('path');
                
                const countryGroups = {};
                
                paths.forEach((path, index) => {
                    const name = path.getAttribute('name') || path.getAttribute('class') || path.id || "Territory";
                    const id = (path.id || name.substring(0,2)).toUpperCase();
                    const groupKey = name.toLowerCase().replace(/\s+/g, '-');
                    
                    if (!countryGroups[groupKey]) {
                        countryGroups[groupKey] = {
                            name: name,
                            color: palette[Object.keys(countryGroups).length % palette.length],
                            id: id,
                            paths: []
                        };
                        countries.push({ id, name, groupKey });
                    }
                    
                    const newPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    newPath.setAttribute('d', path.getAttribute('d'));
                    newPath.setAttribute('data-country', groupKey);
                    newPath.setAttribute('data-name', name);
                    newPath.setAttribute('data-id', id);
                    newPath.style.fill = countryGroups[groupKey].color;
                    newPath.style.fillOpacity = "0.75";
                    
                    mapLayer.appendChild(newPath);
                    countryGroups[groupKey].paths.push(newPath);
                });

                // Generate Labels
                Object.keys(countryGroups).forEach(key => {
                    const group = countryGroups[key];
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    group.paths.forEach(p => {
                        const box = p.getBBox();
                        minX = Math.min(minX, box.x); minY = Math.min(minY, box.y);
                        maxX = Math.max(maxX, box.x + box.width); maxY = Math.max(maxY, box.y + box.height);
                    });

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', minX + (maxX - minX) / 2);
                    text.setAttribute('y', minY + (maxY - minY) / 2);
                    text.setAttribute('class', 'country-label');
                    text.setAttribute('data-country', key);
                    text.textContent = group.name;
                    labelLayer.appendChild(text);
                });

            } catch (e) { console.error("Map load failed", e); }
        }

        // --- ViewBox Control ---
        function updateViewBox() {
            svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
            
            // Show labels if zoom is high enough (viewBox width is small)
            const zoomThreshold = 1200; 
            const labels = document.querySelectorAll('.country-label');
            labels.forEach(l => {
                l.style.opacity = viewBox.w < zoomThreshold ? "1" : "0";
                // Scale text size with zoom
                l.style.fontSize = Math.max(10, viewBox.w / 80) + "px";
            });
        }

        function zoom(delta, clientX, clientY) {
            const zoomFactor = delta > 0 ? 0.8 : 1.25;
            const newW = viewBox.w * zoomFactor;
            const newH = viewBox.h * zoomFactor;
            if (newW < 5 || newW > 10000) return;

            const rect = svg.getBoundingClientRect();
            const mouseX = (clientX - rect.left) / rect.width;
            const mouseY = (clientY - rect.top) / rect.height;

            viewBox.x += (viewBox.w - newW) * mouseX;
            viewBox.y += (viewBox.h - newH) * mouseY;
            viewBox.w = newW; viewBox.h = newH;
            updateViewBox();
        }

        // --- NEW ROBUST DRAGGING ---
        viewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            totalDistMoved = 0;
            startPoint = { x: e.clientX, y: e.clientY };
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - startPoint.x;
                const dy = e.clientY - startPoint.y;
                totalDistMoved += Math.sqrt(dx*dx + dy*dy);

                // Exact scale mapping
                const scale = viewBox.w / svg.getBoundingClientRect().width;
                viewBox.x -= dx * scale;
                viewBox.y -= dy * scale;

                startPoint = { x: e.clientX, y: e.clientY };
                updateViewBox();
            }
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top = e.clientY + 'px';
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // --- INTERACTION ---
        function selectCountry(id, name, groupKey, shouldZoom) {
            searchInput.value = name;
            searchResults.style.display = 'none';
            document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
            const parts = document.querySelectorAll(`path[data-country="${groupKey}"]`);
            parts.forEach(p => p.classList.add('selected'));

            countryTitle.textContent = name;
            let data = countryDatabase[id] || { capital: name + " Center", population: "Varies", continent: "Global", area: "N/A", language: "Local", religion: "Diverse", leaderTitle: "Leader", leaderName: "Wikipedia", leaderLink: `https://en.wikipedia.org/wiki/${name.replace(/ /g,'_')}`, mediaName: "News Agency", mediaLink: `https://news.google.com/search?q=${encodeURIComponent(name)}` };

            infoPanel.innerHTML = `
                <div class="info-grid">
                    <div class="info-label">Language</div><div class="info-value">${data.language}</div>
                    <div class="info-label">Religion</div><div class="info-value">${data.religion}</div>
                    <div class="info-label">${data.leaderTitle}</div><div class="info-value"><a href="${data.leaderLink}" class="info-link" target="_blank">${data.leaderName}</a></div>
                    <div class="info-label">Media</div><div class="info-value"><a href="${data.mediaLink}" class="info-link" target="_blank">${data.mediaName}</a></div>
                    <div class="info-label">Maps</div><div class="info-value"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}" class="info-link" target="_blank">Google Maps</a></div>
                    <div style="grid-column: 1 / -1; border-top: 1px solid var(--border); margin: 6px 0;"></div>
                    <div class="info-label">Capital</div><div class="info-value">${data.capital}</div>
                    <div class="info-label">Region</div><div class="info-value">${data.continent}</div>
                    <div class="info-label">Population</div><div class="info-value">${data.population}</div>
                    <div class="info-label">Area</div><div class="info-value">${data.area}</div>
                </div>`;

            if (shouldZoom && parts.length > 0) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                parts.forEach(p => {
                    const box = p.getBBox();
                    minX = Math.min(minX, box.x); minY = Math.min(minY, box.y);
                    maxX = Math.max(maxX, box.x + box.width); maxY = Math.max(maxY, box.y + box.height);
                });
                const w = maxX - minX; const h = maxY - minY;
                viewBox = { x: minX - w*0.2, y: minY - h*0.2, w: w*1.4, h: h*1.4 };
                updateViewBox();
            }
        }

        // Event Bindings
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            searchResults.innerHTML = '';
            if (!val) { searchResults.style.display = 'none'; return; }
            const filtered = countries.filter(c => c.name.toLowerCase().includes(val)).slice(0, 10);
            filtered.forEach(c => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.textContent = c.name;
                div.onclick = () => selectCountry(c.id, c.name, c.groupKey, true);
                searchResults.appendChild(div);
            });
            searchResults.style.display = filtered.length ? 'block' : 'none';
        });

        viewport.addEventListener('wheel', (e) => { e.preventDefault(); zoom(-e.deltaY, e.clientX, e.clientY); }, { passive: false });

        mapLayer.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'path') {
                const countryKey = e.target.getAttribute('data-country');
                document.querySelectorAll(`path[data-country="${countryKey}"]`).forEach(p => p.classList.add('highlighted'));
                tooltip.textContent = e.target.getAttribute('data-name');
                tooltip.style.display = 'block';
            }
        });

        mapLayer.addEventListener('mouseout', () => {
            document.querySelectorAll('path.highlighted').forEach(p => p.classList.remove('highlighted'));
            tooltip.style.display = 'none';
        });

        mapLayer.addEventListener('click', (e) => {
            if (e.target.tagName === 'path' && totalDistMoved < 5) {
                selectCountry(e.target.getAttribute('data-id'), e.target.getAttribute('data-name'), e.target.getAttribute('data-country'), false);
            }
        });

        document.getElementById('zoom-in').onclick = () => zoom(1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('zoom-out').onclick = () => zoom(-1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('reset').onclick = () => {
            viewBox = { x: 0, y: 0, w: 2000, h: 857 };
            updateViewBox();
            countryTitle.textContent = "World Map";
            infoPanel.innerHTML = `<p style="color: var(--text-dim);">Select or search a country to explore details.</p>`;
            document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
            searchInput.value = '';
        };

        init();
    </script>
</body>
</html>
