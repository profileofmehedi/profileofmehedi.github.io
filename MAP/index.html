<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional World Map Explorer</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --highlight: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Controls --- */
        .controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-group {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--surface);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { background: var(--accent); transform: translateY(-2px); }

        /* --- Map Area --- */
        #map-viewport {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        #map-viewport:active { cursor: grabbing; }

        svg { width: 100%; height: 100%; display: block; pointer-events: all; }

        path {
            stroke: rgba(15, 23, 42, 0.5);
            stroke-width: 0.3;
            transition: fill 0.3s ease, stroke-width 0.2s ease;
            outline: none;
        }

        path:hover {
            stroke: #fff;
            stroke-width: 1;
            cursor: pointer;
            filter: brightness(1.2);
            z-index: 10;
        }

        path.highlighted { stroke: #fff; stroke-width: 1.2; filter: brightness(1.2); }
        path.selected { stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 12px var(--accent)); }

        /* --- Tooltip --- */
        #tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            transform: translate(-50%, -130%);
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* --- Dashboard --- */
        .dashboard {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 340px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .dashboard h2 { margin: 0 0 12px 0; font-size: 24px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .info-grid { display: grid; grid-template-columns: 100px 1fr; gap: 8px; margin-top: 12px; }
        .info-label { color: var(--text-dim); font-size: 13px; font-weight: 600; text-transform: uppercase; }
        .info-value { color: var(--text); font-size: 14px; }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="btn-group">
            <button class="btn" id="zoom-in" title="Zoom In">+</button>
            <button class="btn" id="zoom-out" title="Zoom Out">−</button>
            <button class="btn" id="reset" title="Reset View">⟲</button>
        </div>
    </div>

    <div id="map-viewport">
        <svg id="world-svg" viewBox="0 0 2000 857" preserveAspectRatio="xMidYMid meet">
            <g id="map-layer"></g>
        </svg>
    </div>

    <div id="tooltip"></div>

    <div class="dashboard" id="details-panel">
        <h2 id="country-name">World Map</h2>
        <div id="country-info">
            <p>Select a country to explore detailed geographic and demographic data.</p>
        </div>
    </div>

    <div class="instructions">Scroll to Zoom • Drag to Move • Click to Select</div>

    <script>
        const mapLayer = document.getElementById('map-layer');
        const tooltip = document.getElementById('tooltip');
        const svg = document.getElementById('world-svg');
        const viewport = document.getElementById('map-viewport');
        const countryTitle = document.getElementById('country-name');
        const infoPanel = document.getElementById('country-info');

        let viewBox = { x: 0, y: 0, w: 2000, h: 857 };
        let isPanning = false;
        let startMousePos = { x: 0, y: 0 };
        let totalDistMoved = 0;

        const palette = ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#818cf8', '#c084fc', '#2dd4bf', '#fb7185', '#34d399', '#a78bfa'];

        // Built-in Database
        const countryDatabase = {
            "AF": { capital: "Kabul", population: "41.1M", continent: "Asia", area: "652,230 km²" },
            "AL": { capital: "Tirana", population: "2.8M", continent: "Europe", area: "28,748 km²" },
            "DZ": { capital: "Algiers", population: "44.9M", continent: "Africa", area: "2.38M km²" },
            "AO": { capital: "Luanda", population: "35.6M", continent: "Africa", area: "1.25M km²" },
            "AR": { capital: "Buenos Aires", population: "45.8M", continent: "South America", area: "2.78M km²" },
            "AM": { capital: "Yerevan", population: "2.8M", continent: "Asia", area: "29,743 km²" },
            "AU": { capital: "Canberra", population: "26.0M", continent: "Oceania", area: "7.69M km²" },
            "AT": { capital: "Vienna", population: "9.0M", continent: "Europe", area: "83,871 km²" },
            "AZ": { capital: "Baku", population: "10.1M", continent: "Asia", area: "86,600 km²" },
            "BD": { capital: "Dhaka", population: "169.4M", continent: "Asia", area: "147,570 km²" },
            "BY": { capital: "Minsk", population: "9.3M", continent: "Europe", area: "207,600 km²" },
            "BE": { capital: "Brussels", population: "11.6M", continent: "Europe", area: "30,528 km²" },
            "BR": { capital: "Brasília", population: "215.3M", continent: "South America", area: "8.51M km²" },
            "CA": { capital: "Ottawa", population: "38.2M", continent: "North America", area: "9.98M km²" },
            "CN": { capital: "Beijing", population: "1.41B", continent: "Asia", area: "9.6M km²" },
            "FR": { capital: "Paris", population: "67.8M", continent: "Europe", area: "643,801 km²" },
            "DE": { capital: "Berlin", population: "83.2M", continent: "Europe", area: "357,022 km²" },
            "IN": { capital: "New Delhi", population: "1.41B", continent: "Asia", area: "3.28M km²" },
            "ID": { capital: "Jakarta", population: "275M", continent: "Asia", area: "1.9M km²" },
            "IT": { capital: "Rome", population: "59M", continent: "Europe", area: "301,340 km²" },
            "JP": { capital: "Tokyo", population: "125.7M", continent: "Asia", area: "377,975 km²" },
            "MX": { capital: "Mexico City", population: "127.5M", continent: "North America", area: "1.96M km²" },
            "PK": { capital: "Islamabad", population: "235M", continent: "Asia", area: "796,095 km²" },
            "PH": { capital: "Manila", population: "115M", continent: "Asia", area: "300,000 km²" },
            "RU": { capital: "Moscow", population: "144M", continent: "Europe/Asia", area: "17.1M km²" },
            "SA": { capital: "Riyadh", population: "36M", continent: "Asia", area: "2.15M km²" },
            "ZA": { capital: "Pretoria", population: "60M", continent: "Africa", area: "1.22M km²" },
            "ES": { capital: "Madrid", population: "47.4M", continent: "Europe", area: "505,990 km²" },
            "GB": { capital: "London", population: "67M", continent: "Europe", area: "243,610 km²" },
            "US": { capital: "Washington, D.C.", population: "333M", continent: "North America", area: "9.83M km²" },
            "VN": { capital: "Hanoi", population: "98M", continent: "Asia", area: "331,210 km²" }
        };

        async function init() {
            try {
                const response = await fetch('world.svg');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'image/svg+xml');
                const paths = doc.querySelectorAll('path');
                
                const countryGroups = {};
                
                paths.forEach((path, index) => {
                    const name = path.getAttribute('name') || path.getAttribute('class') || path.id || "Unknown";
                    const id = (path.id || name.substring(0,2)).toUpperCase();
                    const groupKey = name.toLowerCase().replace(/\s+/g, '-');
                    
                    if (!countryGroups[groupKey]) {
                        countryGroups[groupKey] = {
                            name: name,
                            color: palette[Object.keys(countryGroups).length % palette.length],
                            id: id
                        };
                    }
                    
                    const newPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    newPath.setAttribute('d', path.getAttribute('d'));
                    newPath.setAttribute('data-country', groupKey);
                    newPath.setAttribute('data-name', name);
                    newPath.setAttribute('data-id', id);
                    newPath.style.fill = countryGroups[groupKey].color;
                    newPath.style.fillOpacity = "0.75";
                    
                    mapLayer.appendChild(newPath);
                });
            } catch (e) {
                console.error("Map load error", e);
            }
        }

        function updateViewBox() { svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`); }

        function zoom(delta, clientX, clientY) {
            const zoomFactor = delta > 0 ? 0.8 : 1.25;
            const newW = viewBox.w * zoomFactor;
            const newH = viewBox.h * zoomFactor;
            if (newW < 5 || newW > 15000) return;
            const rect = svg.getBoundingClientRect();
            const mouseX = (clientX - rect.left) / rect.width;
            const mouseY = (clientY - rect.top) / rect.height;
            viewBox.x += (viewBox.w - newW) * mouseX;
            viewBox.y += (viewBox.h - newH) * mouseY;
            viewBox.w = newW; viewBox.h = newH;
            updateViewBox();
        }

        // --- NEW IMPROVED PANNING LOGIC ---
        viewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isPanning = true;
            totalDistMoved = 0;
            startMousePos = { x: e.clientX, y: e.clientY };
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - startMousePos.x;
                const dy = e.clientY - startMousePos.y;
                totalDistMoved += Math.abs(dx) + Math.abs(dy);

                const scale = viewBox.w / svg.getBoundingClientRect().width;
                viewBox.x -= dx * scale;
                viewBox.y -= dy * scale;

                startMousePos = { x: e.clientX, y: e.clientY };
                updateViewBox();
            }
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top = e.clientY + 'px';
        });

        window.addEventListener('mouseup', () => { isPanning = false; });

        // --- INTERACTION ---
        mapLayer.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'path') {
                const countryKey = e.target.getAttribute('data-country');
                document.querySelectorAll(`path[data-country="${countryKey}"]`).forEach(p => p.classList.add('highlighted'));
                tooltip.textContent = e.target.getAttribute('data-name');
                tooltip.style.display = 'block';
            }
        });

        mapLayer.addEventListener('mouseout', () => {
            document.querySelectorAll('path.highlighted').forEach(p => p.classList.remove('highlighted'));
            tooltip.style.display = 'none';
        });

        mapLayer.addEventListener('click', (e) => {
            // Only fire click if user didn't move the mouse much (prevents click on drag end)
            if (e.target.tagName === 'path' && totalDistMoved < 10) {
                document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
                const id = e.target.getAttribute('data-id');
                const name = e.target.getAttribute('data-name');
                const countryKey = e.target.getAttribute('data-country');
                document.querySelectorAll(`path[data-country="${countryKey}"]`).forEach(p => p.classList.add('selected'));
                
                countryTitle.textContent = name;
                const data = countryDatabase[id] || { capital: name + " Region", population: "Dynamic", continent: "Global", area: "N/A" };
                
                infoPanel.innerHTML = `
                    <div class="info-grid">
                        <div class="info-label">ISO Code</div><div class="info-value">${id}</div>
                        <div class="info-label">Capital</div><div class="info-value">${data.capital}</div>
                        <div class="info-label">Continent</div><div class="info-value">${data.continent}</div>
                        <div class="info-label">Population</div><div class="info-value">${data.population}</div>
                        <div class="info-label">Land Area</div><div class="info-value">${data.area}</div>
                    </div>
                `;
            }
        });

        document.getElementById('zoom-in').onclick = () => zoom(1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('zoom-out').onclick = () => zoom(-1, window.innerWidth/2, window.innerHeight/2);
        document.getElementById('reset').onclick = () => {
            viewBox = { x: 0, y: 0, w: 2000, h: 857 };
            updateViewBox();
            countryTitle.textContent = "World Map";
            infoPanel.innerHTML = `<p>Select a country to explore detailed geographic and demographic data.</p>`;
            document.querySelectorAll('path.selected').forEach(p => p.classList.remove('selected'));
        };

        init();
    </script>
</body>
</html>
