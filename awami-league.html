        :root {

            --text-dark: #2d3436; /* Dark Text */
            --text-muted: #636e72; /* Gray Text */
            --border-light: #dfe6e9;
            --shadow-soft: 0 10px 20px rgba(0,0,0,0.05), 0 6px 6px rgba(0,0,0,0.05);
            --shadow-hover: 0 15px 30px rgba(0,0,0,0.1), 0 8px 8px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header with dramatic contrast */
        header {
            background: linear-gradient(135deg, rgba(45, 52, 54, 0.9), rgba(214, 48, 49, 0.8)), url('https://images.unsplash.com/photo-1555848962-6e79363ec58f?q=80&w=2033&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Parallax effect */
            padding: 100px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s ease;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
            animation: fadeIn 1.5s ease;
        }

        /* Sticky Controls Wrapper */
        .controls-wrapper {
            background: rgba(255, 255, 255, 0.95); /* Semi-transparent white */
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            align-items: center;
        }

        /* Animated Filter Buttons */
        .filter-btn {
            padding: 10px 24px;
            border: 2px solid transparent;
            background: #ececec;
            color: var(--text-dark);
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            background: #e0e0e0;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.3);
        }

        /* Animated Search Box */
        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 350px;
        }

        #search-box {
            padding: 12px 25px 12px 50px;
            border-radius: 50px;
            border: 2px solid var(--border-light);
            background: white;
            color: var(--text-dark);
            width: 100%;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        #search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(214, 48, 49, 0.1);
        }

        /* Stats Bar */
        .stats-bar {
            text-align: center;
            padding: 15px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Grid Layout */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 20px 60px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
        }

        /* Animated Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy transition */
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: relative;
            opacity: 0; /* Initially hidden for animation */
            animation: slideUpFade 0.6s ease forwards;
        }

        /* Top colored bar based on category */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--text-muted); /* Default */
            transition: 0.3s;
        }
        .card[data-cat="murder"]::before { background: #e74c3c; }
        .card[data-cat="rape"]::before { background: #e84393; }
        .card[data-cat="disappearance"]::before { background: #6c5ce7; }
        .card[data-cat="july"]::before { background: #e67e22; }


        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            padding: 25px 25px 15px 25px;
        }

        .badges {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .badge-year { background: var(--text-dark); color: white; }
        .badge-cat { background: #eee; color: var(--text-muted); }

        .card h3 {
            font-size: 1.5rem;
            line-height: 1.3;
            color: var(--text-dark);
            font-weight: 700;
        }

        .card-body {
            padding: 0 25px 25px 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        /* Animated Link Buttons */
        .links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }

        .link-btn {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* Hover Ripple Effect overlay */
        .link-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.2);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.3s ease-in-out;
        }
        .link-btn:hover::after {
            transform: scaleY(1);
        }


        .btn-news {
            background: white;
            color: var(--text-dark);
            border: 2px solid var(--border-light);
        }
        .btn-news:hover { 
            border-color: var(--text-dark);
            background: #f9f9f9;
        }

        .btn-video {
            background: #ff0000;
            color: white;
            border: 2px solid #ff0000;
            background: linear-gradient(45deg, #d63031, #ff7675);
        }
        .btn-video:hover {

        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            background: white;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
        }

        /* ----- Keyframe Animations ----- */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            header { padding: 60px 20px; }
            .controls-wrapper { padding: 15px 0; }
            .search-container { max-width: 100%; order: -1; margin-bottom: 10px; }
            .filter-btn { padding: 8px 16px; font-size: 0.85rem; flex-grow: 1; text-align: center; }
            .card { margin-bottom: 10px; }
        }
    </style>
</head>

    const container = document.getElementById('events-grid');
    const searchBox = document.getElementById('search-box');
    const buttons = document.querySelectorAll('.filter-btn');
    const statsText = document.getElementById('stats-text');

    // Function to render cards with staggered animation
    function renderCards(data) {
        container.innerHTML = '';
        statsText.innerHTML = `<i class="fas fa-chart-bar"></i> মোট ঘটনা প্রদর্শিত হচ্ছে: <strong>${data.length}</strong> টি`;

        if(data.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted); animation: fadeIn 0.5s ease;">
                    <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.5;"></i>
                    <h2>কোনো তথ্য পাওয়া যায়নি</h2>
                    <p>দুঃখিত, আপনার অনুসন্ধানের সাথে কোনো ঘটনা মেলেনি।</p>
                </div>`;
            return;
        }

        data.forEach((event, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-cat', event.category);
            // Staggered animation delay based on index
            card.style.animationDelay = `${index * 0.1}s`;
            
            let catLabel = '';
            if(event.category === 'murder') catLabel = 'হত্যাকাণ্ড';
            else if(event.category === 'rape') catLabel = 'যৌন সন্ত্রাস';
            else if(event.category === 'disappearance') catLabel = 'গুম/আয়নাঘর';
            else if(event.category === 'july') catLabel = 'জুলাই বিপ্লব';

            card.innerHTML = `
                <div class="card-header">
                    <div class="badges">
                        <span class="badge badge-year"><i class="far fa-calendar-alt"></i> ${event.year}</span>
                        <span class="badge badge-cat">${catLabel}</span>
                    </div>
                    <h3>${event.title}</h3>
                </div>
                <div class="card-body">
                    <p>${event.desc}</p>
                    <div class="links">
                        <a href="${event.news}" target="_blank" class="link-btn btn-news">
                            <i class="fas fa-newspaper"></i> রিপোর্ট
                        </a>
                        <a href="${event.video}" target="_blank" class="link-btn btn-video">
                            <i class="fab fa-youtube"></i> ভিডিও
                        </a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Initial Load
    renderCards(events);

    // Filter Function
    function filterData(category) {
        buttons.forEach(btn => btn.classList.remove('active'));
        
        const clickedBtn = Array.from(buttons).find(btn => {
             if(category === 'all') return btn.innerText.includes('সব');
             if(category === 'july') return btn.innerText.includes('জুলাই');
             if(category === 'murder') return btn.innerText.includes('হত্যাকাণ্ড');
             if(category === 'rape') return btn.innerText.includes('যৌন');
             if(category === 'disappearance') return btn.innerText.includes('গুম');
        });
        
        if(clickedBtn) clickedBtn.classList.add('active');

        // Scroll top slightly to show change
        window.scrollTo({ top: 250, behavior: 'smooth' });

        if (category === 'all') {
            renderCards(events);
        } else {
            renderCards(events.filter(item => item.category === category));
        }
    }

    // Search Function with debounce for smoother UX
    let debounceTimer;
    searchBox.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            const term = e.target.value.toLowerCase();
            const filtered = events.filter(item => 
                item.title.toLowerCase().includes(term) || 
                item.desc.toLowerCase().includes(term) ||
                item.year.includes(term)
            );
            renderCards(filtered);
        }, 300); // Wait 300ms after user stops typing
    });

</script>
