<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="কোডেক্স অ্যাকাউন্টের পাসওয়ার্ড রিসেট করুন।">
    <title>পাসওয়ার্ড পুনরুদ্ধার | Codex</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Theme Toggle Input -->
    <input type="checkbox" id="theme-toggle" class="d-none">

    <div class="app-container justify-content-center align-items-center" style="min-height: 100vh;">

        <!-- Animated Blobs -->
        <div class="animated-blob" style="width: 300px; height: 300px; background: rgba(79, 70, 229, 0.2); top: 10%; left: 10%;"></div>
        <div class="animated-blob" style="width: 350px; height: 350px; background: rgba(6, 182, 212, 0.2); bottom: 10%; right: 10%; animation-delay: -6s;"></div>

        <!-- Forgot Password Card Frame -->
        <div class="glass-card p-5 shadow-lg w-100 fade-in-up" style="max-width: 450px; z-index: 10; position: relative;">
            
            <div class="text-center mb-4">
                <a class="d-flex align-items-center justify-content-center fs-3 fw-bold text-primary mb-3 text-decoration-none" href="index.html">
                    <span style="background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        <i class="bi bi-code-slash me-2"></i>Codex
                    </span>
                </a>
                <h4 class="fw-bold text-primary">পাসওয়ার্ড পুনরুদ্ধার</h4>
                <p class="text-muted fs-7">আপনার অ্যাকাউন্টের রেজিস্টার্ড ইমেইলটি নিচে লিখুন। আমরা আপনাকে পাসওয়ার্ড রিসেট করার লিংক পাঠাবো।</p>
            </div>

            <!-- Form -->
            <form onsubmit="return false;" class="d-flex flex-column gap-3 mb-4">
                <div>
                    <label class="form-label fs-7 fw-semibold text-muted">ইমেইল এড্রেস</label>
                    <input type="email" class="form-control rounded-3" placeholder="mehedi@example.com" required>
                </div>
                <button type="submit" class="btn btn-premium w-100 py-2.5 mt-2">রিসেট লিংক পাঠান</button>
            </form>

            <div class="text-center fs-7">
                <a href="login.html" class="fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i>লগইন পেজে ফিরে যান</a>
            </div>

        </div>

        <!-- Floating Theme Toggle for convenience -->
        <div class="position-fixed bottom-0 end-0 m-4 z-3">
            <label for="theme-toggle" class="theme-switch-label">
                <i class="bi bi-sun"></i>
                <i class="bi bi-moon-stars"></i>
            </label>
        </div>

    </div>

</body>
</html>
