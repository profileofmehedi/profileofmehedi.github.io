<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="কোডেক্স অ্যাকাউন্টে সাইন আপ করুন এবং ফ্রি ইন্টারঅ্যাক্টিভ বাংলা কোডিং শিখুন।">
    <title>নিবন্ধন | Codex</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Theme Toggle Input -->
    <input type="checkbox" id="theme-toggle" class="d-none">

    <div class="app-container justify-content-center align-items-center" style="min-height: 100vh;">

        <!-- Animated Blobs -->
        <div class="animated-blob" style="width: 300px; height: 300px; background: rgba(79, 70, 229, 0.2); top: 10%; right: 10%;"></div>
        <div class="animated-blob" style="width: 350px; height: 350px; background: rgba(6, 182, 212, 0.2); bottom: 10%; left: 10%; animation-delay: -6s;"></div>

        <!-- Register Card Form Frame -->
        <div class="glass-card p-5 shadow-lg w-100 fade-in-up" style="max-width: 480px; z-index: 10; position: relative;">
            
            <div class="text-center mb-4">
                <a class="d-flex align-items-center justify-content-center fs-3 fw-bold text-primary mb-3 text-decoration-none" href="index.html">
                    <span style="background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        <i class="bi bi-code-slash me-2"></i>Codex
                    </span>
                </a>
                <h4 class="fw-bold text-primary">নতুন অ্যাকাউন্ট তৈরি করুন</h4>
                <p class="text-muted fs-7">মিনিটেই ফ্রি সাইন আপ সম্পন্ন করে ড্যাশবোর্ডে প্রবেশ করুন।</p>
            </div>

            <!-- Form -->
            <form onsubmit="return false;" class="d-flex flex-column gap-3 mb-4">
                <div>
                    <label class="form-label fs-7 fw-semibold text-muted">আপনার নাম</label>
                    <input type="text" class="form-control rounded-3" placeholder="মেহেদী হাসান" required>
                </div>
                <div>
                    <label class="form-label fs-7 fw-semibold text-muted">ইমেইল এড্রেস</label>
                    <input type="email" class="form-control rounded-3" placeholder="mehedi@example.com" required>
                </div>
                <div>
                    <label class="form-label fs-7 fw-semibold text-muted">পাসওয়ার্ড</label>
                    <input type="password" class="form-control rounded-3" placeholder="••••••••" required>
                </div>
                <div class="form-check fs-7 my-1">
                    <input type="checkbox" class="form-check-input" id="termsCheck" required>
                    <label class="form-check-label text-muted" for="termsCheck">আমি কোডেক্স এর <a href="#">শর্তাবলী ও নীতিসমূহ</a> মেনে নিচ্ছি।</label>
                </div>
                <a href="dashboard.html" class="btn btn-premium w-100 py-2.5 mt-2">অ্যাকাউন্ট তৈরি করুন</a>
            </form>

            <div class="text-center mb-4 position-relative">
                <span class="fs-8 text-muted bg-white px-2 position-relative z-3" style="background-color: var(--bg-card) !important; transition: background-color 0.4s ease;">অথবা সাইন আপ করুন</span>
                <hr class="position-absolute w-100 top-50 start-0 m-0 z-1" style="border-color: var(--border-color);">
            </div>

            <div class="d-flex gap-3 justify-content-center mb-4">
                <a href="#" class="btn btn-premium-outline flex-grow-1 py-2 text-center fs-7"><i class="bi bi-google me-2"></i>Google</a>
                <a href="#" class="btn btn-premium-outline flex-grow-1 py-2 text-center fs-7"><i class="bi bi-github me-2"></i>GitHub</a>
            </div>

            <div class="text-center fs-7">
                <span class="text-muted">ইতিমধ্যে অ্যাকাউন্ট আছে?</span>
                <a href="login.html" class="fw-semibold text-decoration-none ms-1">লগইন করুন</a>
            </div>

        </div>

        <!-- Floating Theme Toggle for convenience -->
        <div class="position-fixed bottom-0 end-0 m-4 z-3">
            <label for="theme-toggle" class="theme-switch-label">
                <i class="bi bi-sun"></i>
                <i class="bi bi-moon-stars"></i>
            </label>
        </div>

    </div>

</body>
</html>
