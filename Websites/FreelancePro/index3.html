<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="data-profile-name">FreelancePro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Core UI CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Theme 3 Specific CSS -->
    <style>
        :root {
            --bg-color: #f4f4f0;
            --bg-card: #ffffff;
            --text-color: #111111;
            --text-muted: #444444;
            --primary: #ff3b30;
            --primary-hover: #d7281f;
            --secondary: #ffcc00;
            --border-color: #111111;
            --shadow-color: #111111;
            font-family: 'Public Sans', sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-color: #f4f4f0;
            --text-muted: #aaaaaa;
            --primary: #ff453a;
            --primary-hover: #ff6961;
            --secondary: #ffd60a;
            --border-color: #f4f4f0;
            --shadow-color: #f4f4f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1, h2, h3, h4, h5, h6 { font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }

        .navbar {
            background-color: var(--bg-card);
            border-bottom: 4px solid var(--border-color);
            padding: 14px 0;
        }

        .nav-link { color: var(--text-color) !important; font-weight: 700; border: 2px solid transparent; padding: 5px 10px !important; margin: 0 5px; }
        .nav-link:hover { background-color: var(--secondary); border-color: var(--border-color); color: var(--text-color) !important; }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            border: 3px solid var(--border-color);
            border-radius: 0;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transition: all 0.1s;
        }
        .btn-primary:hover, .btn-primary:active {
            background-color: var(--primary-hover);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }

        .btn-outline-secondary {
            background-color: var(--bg-card);
            color: var(--text-color) !important;
            border: 3px solid var(--border-color) !important;
            border-radius: 0;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transition: all 0.1s;
        }
        .btn-outline-secondary:hover {
            background-color: var(--secondary);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }

        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; }
        
        .profile-img { 
            border: 4px solid var(--border-color); 
            box-shadow: 10px 10px 0px var(--shadow-color);
            border-radius: 0;
        }

        .service-card, .pricing-card, .portfolio-card, .case-study-card, .testimonial-card, .contact-panel {
            background-color: var(--bg-card);
            border: 3px solid var(--border-color);
            border-radius: 0;
            box-shadow: 6px 6px 0px var(--shadow-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .service-card:hover, .pricing-card:hover, .portfolio-card:hover {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0px var(--shadow-color);
        }

        .service-icon {
            width: 60px; height: 60px;
            background-color: var(--secondary);
            border: 3px solid var(--border-color);
            color: var(--text-color);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            box-shadow: 3px 3px 0px var(--shadow-color);
        }

        .service-link { color: var(--primary); text-decoration: none; font-weight: 900; text-transform: uppercase; }
        
        .portfolio-overlay {
            background: var(--bg-card);
            border-top: 3px solid var(--border-color);
        }
        .portfolio-tech .badge { background-color: var(--secondary); color: var(--text-color); border: 2px solid var(--border-color); border-radius: 0; }
        .portfolio-btn { background-color: var(--primary); color: #fff; border: 2px solid var(--border-color); border-radius: 0; font-weight: bold; }

        .pricing-card.popular { background-color: var(--secondary); }
        .popular-badge {
            display: inline-block;
            background-color: var(--text-color); color: var(--bg-color);
            padding: 5px 15px; border: 2px solid var(--border-color);
            font-weight: 900; margin-bottom: 20px;
        }

        .accordion-item { background-color: var(--bg-card); border: 3px solid var(--border-color); margin-bottom: 15px !important; border-radius: 0; box-shadow: 4px 4px 0px var(--shadow-color); }
        .accordion-button { background-color: var(--bg-card); color: var(--text-color); font-weight: 900; text-transform: uppercase; border-radius: 0 !important; }
        .accordion-button:not(.collapsed) { background-color: var(--secondary); color: var(--text-color); box-shadow: none; border-bottom: 3px solid var(--border-color); }
        
        .stat-value { font-size: 3rem; color: var(--primary); text-shadow: 2px 2px 0px var(--border-color); }
        [data-theme="dark"] .stat-value { text-shadow: 2px 2px 0px #000; }
        
        .timeline-item { border-left: 4px solid var(--border-color); padding-left: 20px; }
        .timeline-dot { width: 16px; height: 16px; background-color: var(--primary); border: 3px solid var(--border-color); left: -10px; }

        .progress { border: 3px solid var(--border-color); border-radius: 0; background-color: var(--bg-card); height: 20px !important; }
        .progress-bar { background-color: var(--secondary); border-right: 3px solid var(--border-color); }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar">

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold data-profile-name fs-3" href="#home" style="color: var(--text-color);">FreelancePro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border: 3px solid var(--border-color); border-radius: 0;">
                <i class="fa-solid fa-bars" style="color: var(--text-color);"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#pricing">Pricing</a></li>
                    <li class="nav-item ms-lg-3"><a href="#contact" class="btn btn-primary px-4 py-2">Hire Me</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 animate-on-scroll">
                    <span class="d-inline-block bg-secondary px-3 py-2 fw-bold border border-3 border-dark mb-4" style="color: #111;">Available for work</span>
                    <h1 class="display-3 mb-4 data-profile-tagline" style="text-shadow: 2px 2px 0px var(--secondary);">Loading...</h1>
                    <p class="fs-4 mb-5 data-profile-desc fw-bold">Loading...</p>
                    <div class="d-flex flex-wrap gap-3">
                        <a href="#contact" class="btn btn-primary px-4 py-3 fs-5">Get in touch</a>
                        <a href="#portfolio" class="btn btn-outline-secondary px-4 py-3 fs-5">View work</a>
                    </div>
                    <div class="d-flex flex-wrap gap-4 gap-md-5 mt-5 data-stats-container"></div>
                </div>
                <div class="col-lg-5 offset-lg-1 mt-5 mt-lg-0 animate-on-scroll" style="transition-delay: 0.2s;">
                    <img src="" alt="Profile" class="img-fluid profile-img data-profile-img w-100">
                </div>
            </div>
        </div>
    </section>

    <section id="services" class="py-5" style="border-top: 5px solid var(--border-color);">
        <div class="container py-5">
            <h2 class="display-4 text-center mb-5 animate-on-scroll" style="text-shadow: 2px 2px 0px var(--secondary);">Services</h2>
            <div class="row data-services-container"></div>
        </div>
    </section>

    <section id="portfolio" class="py-5" style="border-top: 5px solid var(--border-color); background-color: rgba(0,0,0,0.05);">
        <div class="container py-5">
            <h2 class="display-4 text-center mb-5 animate-on-scroll" style="text-shadow: 2px 2px 0px var(--secondary);">Portfolio</h2>
            <div class="row data-portfolio-container"></div>
        </div>
    </section>

    <section id="about" class="py-5" style="border-top: 5px solid var(--border-color);">
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-6 mb-5 mb-lg-0 animate-on-scroll">
                    <h2 class="display-5 mb-5" style="text-shadow: 2px 2px 0px var(--secondary);">Experience</h2>
                    <div class="data-experience-container"></div>
                </div>
                <div class="col-lg-6 animate-on-scroll" style="transition-delay: 0.2s;">
                    <h2 class="display-5 mb-5" style="text-shadow: 2px 2px 0px var(--secondary);">Skills</h2>
                    <div class="data-skills-container"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="pricing" class="py-5" style="border-top: 5px solid var(--border-color); background-color: rgba(0,0,0,0.05);">
        <div class="container py-5">
            <h2 class="display-4 text-center mb-5 animate-on-scroll" style="text-shadow: 2px 2px 0px var(--secondary);">Pricing</h2>
            <div class="row justify-content-center data-pricing-container"></div>
        </div>
    </section>

    <section id="faq" class="py-5" style="border-top: 5px solid var(--border-color);">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8 animate-on-scroll">
                    <h2 class="display-4 text-center mb-5" style="text-shadow: 2px 2px 0px var(--secondary);">FAQ</h2>
                    <div class="accordion data-faq-container" id="faqAccordion"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="py-5" style="border-top: 5px solid var(--border-color); background-color: var(--secondary);">
        <div class="container py-5 text-center animate-on-scroll">
            <h2 class="display-3 mb-4" style="color: #111; text-shadow: 2px 2px 0px #fff;">Hit me up!</h2>
            <a href="mailto:hello@freelancepro.dev" class="btn btn-primary px-5 py-4 fs-3">hello@freelancepro.dev</a>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
