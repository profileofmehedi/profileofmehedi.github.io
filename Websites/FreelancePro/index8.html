<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="data-profile-name">FreelancePro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Core UI CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Theme 8 Specific CSS -->
    <style>
        :root {
            --bg-color: #eeeeee;
            --bg-card: #eeeeee;
            --text-color: #000000;
            --text-muted: #555555;
            --primary: #0000ff; /* Electric Blue */
            --primary-hover: #0000cc;
            --border-color: #000000;
            font-family: 'IBM Plex Mono', monospace;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --bg-card: #000000;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --primary: #00ff00; /* Neon Green */
            --primary-hover: #00cc00;
            --border-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        [data-theme="dark"] body {
            background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
        }

        h1, h2, h3, h4, h5, h6 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; line-height: 1; }

        .navbar {
            background-color: var(--bg-color);
            border-bottom: 2px solid var(--border-color);
            padding: 0;
        }

        .nav-link { color: var(--text-color) !important; font-weight: 600; padding: 20px !important; border-left: 2px solid var(--border-color); }
        .nav-link:hover { background-color: var(--primary); color: #fff !important; }
        .navbar-brand { padding: 20px; border-right: 2px solid var(--border-color); margin: 0; }
        .navbar-toggler { border: none; padding: 20px; border-left: 2px solid var(--border-color); border-radius: 0; }

        .btn-primary {
            background-color: var(--primary); color: #fff;
            border: 2px solid var(--border-color); border-radius: 0;
            padding: 15px 30px; font-weight: 600; text-transform: uppercase;
        }
        .btn-primary:hover { background-color: var(--bg-color); color: var(--primary); }

        .btn-outline-secondary {
            background-color: var(--bg-color); color: var(--text-color);
            border: 2px solid var(--border-color); border-radius: 0;
            padding: 15px 30px; font-weight: 600; text-transform: uppercase;
        }
        .btn-outline-secondary:hover { background-color: var(--text-color); color: var(--bg-color); }

        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 60px; border-bottom: 2px solid var(--border-color); }
        
        .profile-img { border: 2px solid var(--border-color); filter: grayscale(100%) contrast(150%); }

        .grid-item { border: 2px solid var(--border-color); background-color: var(--bg-card); padding: 40px; }
        .grid-item:hover { background-color: var(--primary); color: #fff !important; }
        .grid-item:hover * { color: #fff !important; }

        .service-icon { font-size: 3rem; margin-bottom: 20px; color: var(--primary); }
        
        .portfolio-card { border: 2px solid var(--border-color); padding: 0; background-color: var(--bg-card); }
        .case-study-card, .testimonial-card, .contact-panel {
            border: 2px solid var(--border-color);
            background-color: var(--bg-card);
            border-radius: 0;
        }
        .portfolio-overlay { padding: 20px; border-top: 2px solid var(--border-color); }
        .portfolio-tech .badge { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 0; }

        .pricing-card.popular { background-color: var(--text-color); color: var(--bg-color); }
        .pricing-card.popular * { color: var(--bg-color) !important; }
        .popular-badge { background-color: var(--primary); color: #fff; padding: 5px 15px; border: 2px solid var(--border-color); position: absolute; top: -15px; }

        .accordion-item { background-color: var(--bg-card); border: 2px solid var(--border-color); border-radius: 0 !important; margin-bottom: 0; border-bottom: 0; }
        .accordion-item:last-child { border-bottom: 2px solid var(--border-color); }
        .accordion-button { background-color: var(--bg-card); color: var(--text-color); font-weight: 600; font-family: 'Syne', sans-serif; font-size: 1.5rem; text-transform: uppercase; border-radius: 0 !important; }
        .accordion-button:not(.collapsed) { background-color: var(--primary); color: #fff; box-shadow: none; border-bottom: 2px solid var(--border-color); }
        .accordion-button::after { filter: invert(var(--icon-invert, 0)); }
        [data-theme="dark"] { --icon-invert: 1; }

        .stat-value { font-family: 'Syne', sans-serif; font-size: 4rem; color: var(--primary); line-height: 1; }
        .timeline-item { border-left: 2px solid var(--border-color); padding-left: 20px; }
        .timeline-dot { width: 14px; height: 14px; background-color: var(--primary); border: 2px solid var(--border-color); left: -8px; }
        .progress { border: 2px solid var(--border-color); background-color: var(--bg-card); border-radius: 0; height: 25px !important; }
        .progress-bar { background-color: var(--primary); border-right: 2px solid var(--border-color); }

        section { border-bottom: 2px solid var(--border-color); background-color: var(--bg-color); }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar">

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid px-0">
            <a class="navbar-brand fw-bold data-profile-name fs-3" href="#home" style="color: var(--text-color);">FreelancePro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars" style="color: var(--text-color);"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#services">SERVICES</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">WORK</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">ABOUT</a></li>
                    <li class="nav-item"><a class="nav-link" href="#pricing">PRICING</a></li>
                    <li class="nav-item"><a href="#contact" class="nav-link" style="background-color: var(--primary); color: #fff !important;">HIRE ME</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container-fluid px-0">
            <div class="row g-0 align-items-stretch">
                <div class="col-lg-7 p-5 d-flex flex-column justify-content-center border-end border-2 border-dark animate-on-scroll">
                    <h1 class="display-1 mb-4 data-profile-tagline" style="word-break: break-word;">Loading...</h1>
                    <p class="fs-4 mb-5 data-profile-desc" style="color: var(--text-muted);">Loading...</p>
                    <div class="d-flex flex-wrap gap-3">
                        <a href="#contact" class="btn btn-primary">GET IN TOUCH</a>
                        <a href="#portfolio" class="btn btn-outline-secondary">VIEW WORK</a>
                    </div>
                </div>
                <div class="col-lg-5 text-center animate-on-scroll p-0" style="transition-delay: 0.2s;">
                    <img src="" alt="Profile" class="img-fluid profile-img data-profile-img w-100 h-100 object-fit-cover border-0 border-bottom">
                </div>
            </div>
            <div class="row g-0 data-stats-container border-top border-2 border-dark"></div>
        </div>
    </section>

    <section id="services" class="py-0">
        <div class="container-fluid px-0">
            <h2 class="display-2 text-center py-5 border-bottom border-2 border-dark animate-on-scroll m-0 bg-card">SERVICES</h2>
            <div class="row g-0 data-services-container">
                <!-- Data will be injected here, we need to style the injected cards via CSS grid-item -->
            </div>
        </div>
    </section>

    <section id="portfolio" class="py-0">
        <div class="container-fluid px-0">
            <h2 class="display-2 text-center py-5 border-bottom border-2 border-dark animate-on-scroll m-0">PORTFOLIO</h2>
            <div class="row g-0 p-4 data-portfolio-container bg-card"></div>
        </div>
    </section>

    <section id="about" class="py-0">
        <div class="container-fluid px-0">
            <div class="row g-0">
                <div class="col-lg-6 p-5 border-end border-2 border-dark animate-on-scroll">
                    <h2 class="display-4 mb-5">EXPERIENCE</h2>
                    <div class="data-experience-container"></div>
                </div>
                <div class="col-lg-6 p-5 animate-on-scroll" style="transition-delay: 0.2s; background-color: var(--bg-card);">
                    <h2 class="display-4 mb-5">SKILLS</h2>
                    <div class="data-skills-container"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="pricing" class="py-0">
        <div class="container-fluid px-0">
            <h2 class="display-2 text-center py-5 border-bottom border-2 border-dark animate-on-scroll m-0">PRICING</h2>
            <div class="row g-0 p-4 justify-content-center data-pricing-container bg-card"></div>
        </div>
    </section>

    <section id="contact" class="py-0">
        <div class="container-fluid px-0 d-flex flex-column text-center animate-on-scroll">
            <h2 class="display-1 p-5 border-bottom border-2 border-dark m-0 bg-card">START A PROJECT</h2>
            <a href="mailto:hello@freelancepro.dev" class="display-3 p-5 text-decoration-none" style="background-color: var(--primary); color: #fff; font-family: 'Syne', sans-serif;">HELLO@FREELANCEPRO.DEV</a>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    
    <!-- Fix for injected classes to match Theme 8 design -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.service-card, .pricing-card').forEach(el => {
                    el.classList.add('grid-item');
                });
                document.querySelectorAll('.stat-item').forEach(el => {
                    el.classList.add('p-4', 'border-end', 'border-2', 'border-dark', 'col');
                });
            }, 50);
        });
    </script>
</body>
</html>
