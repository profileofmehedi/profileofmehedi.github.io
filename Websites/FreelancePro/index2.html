<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="data-profile-name">FreelancePro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Core UI CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Theme 2 Specific CSS -->
    <style>
        :root {
            --bg-color: #ffffff;
            --bg-card: #f8f9fa;
            --text-color: #000000;
            --text-muted: #6c757d;
            --primary: #000000;
            --primary-hover: #333333;
            --border-color: #e9ecef;
            font-family: 'Space Grotesk', sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --bg-card: #121212;
            --text-color: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #ffffff;
            --primary-hover: #cccccc;
            --border-color: #27272a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
        }

        h1, h2, h3, h4, h5, h6 { font-weight: 700; letter-spacing: -1px; }
        
        .navbar {
            background-color: color-mix(in srgb, var(--bg-color) 90%, transparent);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
            backdrop-filter: blur(16px);
        }

        .nav-link { color: var(--text-color) !important; text-transform: uppercase; font-size: 0.82rem; letter-spacing: 1.4px; }
        .nav-link:hover { text-decoration: underline; text-underline-offset: 6px; }

        .btn-primary {
            background-color: var(--primary);
            color: var(--bg-color);
            border: 1px solid var(--primary);
            border-radius: 0;
            text-transform: uppercase;
            font-size: 0.82rem;
            letter-spacing: 1.4px;
            padding: 14px 28px;
        }
        .btn-primary:hover {
            background-color: transparent;
            color: var(--primary);
        }

        .hero { min-height: 92vh; display: flex; align-items: center; padding-top: 110px; }
        .display-4 { font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: 1.05; }
        
        .profile-img { filter: grayscale(100%); transition: filter 0.5s, transform 0.5s; border-radius: 0; }
        .profile-img:hover { filter: grayscale(0%); transform: scale(1.02); }

        .service-card, .pricing-card, .portfolio-card, .case-study-card, .testimonial-card, .contact-panel {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 40px !important;
        }
        .service-card:hover, .pricing-card:hover { border-color: var(--text-color); }

        .service-icon { font-size: 2rem; color: var(--text-color); margin-bottom: 20px; }
        
        .portfolio-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: color-mix(in srgb, var(--bg-color) 88%, transparent);
            opacity: 0; transition: opacity 0.4s ease;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .portfolio-card:hover .portfolio-overlay { opacity: 1; }
        .portfolio-title { color: var(--text-color) !important; }
        .portfolio-desc { color: var(--text-muted) !important; }
        .portfolio-btn { border: 1px solid var(--text-color); color: var(--text-color); border-radius: 0; }

        .pricing-card.popular { border: 2px solid var(--text-color); background-color: var(--bg-card); }
        .popular-badge {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background-color: var(--text-color); color: var(--bg-color);
            padding: 5px 15px; font-size: 0.8rem; text-transform: uppercase;
        }

        .accordion-item { background-color: transparent; border: none; border-bottom: 1px solid var(--border-color); border-radius: 0 !important; }
        .accordion-button { background-color: transparent; color: var(--text-color); padding: 25px 0; font-size: 1.2rem; }
        .accordion-button:not(.collapsed) { background-color: transparent; color: var(--text-color); box-shadow: none; }
        .accordion-button::after { filter: invert(var(--icon-invert, 0)); }
        [data-theme="dark"] { --icon-invert: 1; }

        .stat-value { font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1; margin-bottom: 10px; }
        .stat-label { text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar">

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold data-profile-name" href="#home" style="color: var(--text-color); letter-spacing: 2px; text-transform: uppercase;">FreelancePro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars" style="color: var(--text-color);"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                    <li class="nav-item ms-lg-3"><a href="#contact" class="btn btn-primary">Hire Me</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 animate-on-scroll">
                    <h1 class="display-4 mb-4 data-profile-tagline">I Help Businesses Build Better Digital Experiences</h1>
                    <p class="lead mb-5 data-profile-desc" style="color: var(--text-muted); max-width: 500px;">Loading...</p>
                    <a href="#contact" class="btn btn-primary">Start a Project</a>
                </div>
                <div class="col-lg-5 offset-lg-1 mt-5 mt-lg-0 animate-on-scroll" style="transition-delay: 0.2s;">
                    <img src="" alt="Profile" class="img-fluid profile-img data-profile-img">
                </div>
            </div>
            <div class="row mt-5 pt-5 border-top" style="border-color: var(--border-color) !important;">
                <div class="col-12 data-stats-container d-flex justify-content-between flex-wrap gap-4"></div>
            </div>
        </div>
    </section>

    <section id="services" class="py-5" style="background-color: var(--bg-card);">
        <div class="container py-5">
            <h2 class="mb-5 animate-on-scroll">Expertise.</h2>
            <div class="row data-services-container"></div>
        </div>
    </section>

    <section id="portfolio" class="py-5">
        <div class="container py-5">
            <h2 class="mb-5 animate-on-scroll">Selected Works.</h2>
            <div class="row data-portfolio-container"></div>
        </div>
    </section>

    <section id="about" class="py-5" style="background-color: var(--bg-card);">
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-6 mb-5 mb-lg-0 animate-on-scroll">
                    <h2 class="mb-5">Experience.</h2>
                    <div class="data-experience-container"></div>
                </div>
                <div class="col-lg-5 offset-lg-1 animate-on-scroll" style="transition-delay: 0.2s;">
                    <h2 class="mb-5">Skills.</h2>
                    <div class="data-skills-container"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="pricing" class="py-5">
        <div class="container py-5">
            <h2 class="mb-5 text-center animate-on-scroll">Pricing.</h2>
            <div class="row justify-content-center data-pricing-container"></div>
        </div>
    </section>

    <section id="contact" class="py-5" style="background-color: var(--bg-card);">
        <div class="container py-5 text-center animate-on-scroll">
            <h2 class="display-3 mb-4">Let's Talk.</h2>
            <p class="lead mb-5" style="color: var(--text-muted);">Available for freelance opportunities.</p>
            <a href="mailto:hello@freelancepro.dev" class="btn btn-primary btn-lg">hello@freelancepro.dev</a>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
