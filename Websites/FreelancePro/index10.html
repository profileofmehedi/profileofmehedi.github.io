<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="data-profile-name">FreelancePro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Core UI CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Theme 10 Specific CSS -->
    <style>
        :root {
            --bg-color: #fdf6e3; /* Light warm yellow */
            --bg-card: #ffffff;
            --text-color: #2d3748;
            --text-muted: #718096;
            --primary: #ff6b6b; /* Playful Red */
            --primary-hover: #fa5252;
            --secondary: #4dabf7; /* Playful Blue */
            --accent: #fcc419; /* Playful Yellow */
            --border-color: #e2e8f0;
            font-family: 'Nunito', sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --bg-card: #2d3748;
            --text-color: #f7fafc;
            --text-muted: #a0aec0;
            --primary: #ff8787;
            --primary-hover: #ff6b6b;
            --secondary: #74c0fc;
            --accent: #ffd43b;
            --border-color: #4a5568;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            background-image: radial-gradient(var(--secondary) 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0;
            background-attachment: fixed;
        }
        [data-theme="dark"] body {
            background-image: radial-gradient(rgba(116, 192, 252, 0.15) 2px, transparent 2px);
        }

        h1, h2, h3, h4, h5, h6 { font-family: 'Fredoka', sans-serif; font-weight: 700; color: var(--text-color); }

        .navbar {
            background-color: var(--bg-card);
            border-bottom: 4px solid var(--primary);
            padding: 15px 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        .nav-link { color: var(--text-color) !important; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.2s; }
        .nav-link:hover { color: var(--primary) !important; transform: rotate(-5deg) scale(1.1); }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 6px 0 var(--primary-hover);
            transition: all 0.1s;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(2px);
            box-shadow: 0 4px 0 var(--primary-hover);
        }
        .btn-primary:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--primary-hover);
        }

        .btn-outline-secondary {
            background-color: var(--secondary);
            color: #ffffff !important;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #3b8bf6;
            transition: all 0.1s;
        }
        .btn-outline-secondary:hover { transform: translateY(2px); box-shadow: 0 4px 0 #3b8bf6; }

        .hero { padding: 140px 0 100px 0; position: relative; }
        
        .profile-img { 
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            border: 8px solid var(--accent);
            box-shadow: 15px 15px 0 var(--secondary);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .profile-img:hover {
            border-radius: 50%;
            transform: rotate(10deg) scale(1.05);
            box-shadow: -15px 15px 0 var(--primary);
        }

        .service-card, .pricing-card, .portfolio-card, .case-study-card, .testimonial-card, .contact-panel {
            background-color: var(--bg-card);
            border: 4px solid var(--border-color);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 8px 8px 0 var(--border-color);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .service-card:hover, .pricing-card:hover, .portfolio-card:hover {
            transform: translateY(-10px) rotate(2deg);
            box-shadow: 15px 15px 0 var(--primary);
            border-color: var(--primary);
        }

        .service-icon { 
            width: 70px; height: 70px;
            background-color: var(--accent);
            color: #fff; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; margin-bottom: 20px;
            transform: rotate(-10deg);
        }
        .service-link { color: var(--primary); text-decoration: none; font-weight: 800; text-transform: uppercase; }
        
        .portfolio-card { padding: 0; overflow: hidden; }
        .portfolio-card img { border-bottom: 4px solid var(--border-color); }
        .portfolio-overlay {
            background-color: var(--bg-card);
            padding: 25px;
        }
        .portfolio-tech .badge { background-color: var(--secondary); color: #fff; border-radius: 20px; font-weight: 800; padding: 6px 12px; }

        .pricing-card.popular { border-color: var(--secondary); box-shadow: 8px 8px 0 var(--secondary); transform: scale(1.05); }
        .pricing-card.popular:hover { box-shadow: 15px 15px 0 var(--secondary); transform: scale(1.05) translateY(-10px) rotate(-2deg); }
        .popular-badge {
            background-color: var(--secondary); color: #ffffff;
            padding: 8px 20px; font-size: 0.9rem; font-weight: 800; border-radius: 20px;
            display: inline-block; margin-bottom: 15px; transform: rotate(-5deg);
        }

        .accordion-item { background-color: var(--bg-card); border: 4px solid var(--border-color); border-radius: 20px !important; margin-bottom: 20px; box-shadow: 5px 5px 0 var(--border-color); overflow: hidden; }
        .accordion-button { background-color: var(--bg-card); color: var(--text-color); font-weight: 800; border-radius: 20px !important; font-size: 1.2rem; }
        .accordion-button:not(.collapsed) { background-color: var(--accent); color: #000; box-shadow: none; border-bottom: 4px solid var(--border-color); border-radius: 20px 20px 0 0 !important; }
        
        .stat-value { font-family: 'Fredoka', sans-serif; font-size: 4rem; color: var(--primary); text-shadow: 4px 4px 0 var(--accent); margin-bottom: 0; line-height: 1; }
        .stat-label { font-weight: 800; text-transform: uppercase; color: var(--secondary); }
        
        .timeline-item { border-left: 6px solid var(--secondary); padding-left: 25px; position: relative; }
        .timeline-dot { width: 24px; height: 24px; background-color: var(--primary); left: -15px; border-radius: 50%; border: 4px solid var(--bg-color); }
        
        .progress { background-color: var(--bg-card); border: 4px solid var(--border-color); border-radius: 20px; height: 30px !important; box-shadow: inset 0 4px 0 rgba(0,0,0,0.05); }
        .progress-bar { background-color: var(--accent); border-radius: 15px; }

        .blob-bg {
            position: absolute; top: -10%; right: -5%; width: 50%; height: 120%;
            background-color: var(--accent); opacity: 0.2;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            z-index: -1; animation: morph 15s linear infinite alternate;
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar">

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold data-profile-name fs-3" href="#home" style="color: var(--primary); transform: rotate(-3deg);">FreelancePro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border: none; background: var(--accent);">
                <i class="fa-solid fa-bars" style="color: #000;"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#pricing">Pricing</a></li>
                    <li class="nav-item ms-lg-3"><a href="#contact" class="btn btn-primary">Let's Play!</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="blob-bg"></div>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 animate-on-scroll">
                    <span class="badge bg-accent text-dark mb-3 px-3 py-2 rounded-pill fw-bold fs-6" style="background-color: var(--accent); transform: rotate(-5deg); display: inline-block;">👋 Hello there!</span>
                    <h1 class="display-3 mb-4 data-profile-tagline" style="color: var(--primary);">Loading...</h1>
                    <p class="fs-4 mb-5 data-profile-desc fw-bold">Loading...</p>
                    <div class="d-flex flex-wrap gap-3">
                        <a href="#contact" class="btn btn-primary">Hire Me Now</a>
                        <a href="#portfolio" class="btn btn-outline-secondary">See My Work</a>
                    </div>
                </div>
                <div class="col-lg-5 offset-lg-1 mt-5 mt-lg-0 text-center animate-on-scroll" style="transition-delay: 0.2s;">
                    <img src="" alt="Profile" class="img-fluid profile-img data-profile-img w-75">
                </div>
            </div>
            <div class="row mt-5 pt-5 data-stats-container text-center"></div>
        </div>
    </section>

    <section id="services" class="py-5" style="background-color: rgba(255, 255, 255, 0.5);">
        <div class="container py-5">
            <h2 class="text-center display-4 mb-5 animate-on-scroll" style="color: var(--secondary);">Awesome Services</h2>
            <div class="row data-services-container"></div>
        </div>
    </section>

    <section id="portfolio" class="py-5">
        <div class="container py-5">
            <h2 class="text-center display-4 mb-5 animate-on-scroll" style="color: var(--primary);">Cool Projects</h2>
            <div class="row data-portfolio-container"></div>
        </div>
    </section>

    <section id="about" class="py-5" style="background-color: rgba(255, 255, 255, 0.5);">
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-6 mb-5 mb-lg-0 animate-on-scroll">
                    <h2 class="display-5 mb-5" style="color: var(--accent); -webkit-text-stroke: 1px #000;">My Adventure</h2>
                    <div class="data-experience-container"></div>
                </div>
                <div class="col-lg-5 offset-lg-1 animate-on-scroll" style="transition-delay: 0.2s;">
                    <h2 class="display-5 mb-5" style="color: var(--secondary);">Super Powers</h2>
                    <div class="data-skills-container"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="pricing" class="py-5">
        <div class="container py-5">
            <h2 class="text-center display-4 mb-5 animate-on-scroll" style="color: var(--primary);">Pricing Packages</h2>
            <div class="row justify-content-center data-pricing-container"></div>
        </div>
    </section>

    <section id="faq" class="py-5" style="background-color: rgba(255, 255, 255, 0.5);">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8 animate-on-scroll">
                    <h2 class="text-center display-4 mb-5" style="color: var(--secondary);">Questions?</h2>
                    <div class="accordion data-faq-container" id="faqAccordion"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="py-5 mb-5">
        <div class="container py-5 text-center animate-on-scroll">
            <div style="background-color: var(--accent); border: 6px solid #000; border-radius: 40px; padding: 80px 20px; box-shadow: 15px 15px 0 var(--primary); transform: rotate(-2deg);">
                <h2 class="display-3 mb-4 text-dark">Let's do this!</h2>
                <a href="mailto:hello@freelancepro.dev" class="btn btn-primary btn-lg fs-3 px-5 py-3" style="background-color: #000; box-shadow: 0 8px 0 #333;">hello@freelancepro.dev</a>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
