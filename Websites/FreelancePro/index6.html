<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="data-profile-name">FreelancePro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Core UI CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Theme 6 Specific CSS -->
    <style>
        :root {
            --bg-color: #0b0c10;
            --bg-card: #1f2833;
            --text-color: #c5c6c7;
            --primary: #66fcf1;
            --primary-hover: #45a29e;
            --border-color: #45a29e;
            font-family: 'Share Tech Mono', monospace;
        }

        [data-theme="light"] {
            --bg-color: #f0f0f0;
            --bg-card: #e0e0e0;
            --text-color: #1f2833;
            --primary: #c3073f;
            --primary-hover: #950740;
            --border-color: #1a1a1d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                linear-gradient(rgba(11, 12, 16, 0.9) 1px, transparent 1px),
                linear-gradient(90deg, rgba(11, 12, 16, 0.9) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        [data-theme="light"] body {
            background-image: 
                linear-gradient(rgba(240, 240, 240, 0.9) 1px, transparent 1px),
                linear-gradient(90deg, rgba(240, 240, 240, 0.9) 1px, transparent 1px);
        }

        h1, h2, h3, h4, h5, h6 { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }

        .navbar {
            background-color: color-mix(in srgb, var(--bg-card) 80%, transparent);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 0 18px color-mix(in srgb, var(--primary) 22%, transparent);
            backdrop-filter: blur(10px);
        }

        .nav-link { color: var(--text-color) !important; font-size: 1.1rem; }
        .nav-link:hover { color: var(--primary) !important; text-shadow: 0 0 8px var(--primary); }

        .btn-primary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 0;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3) inset;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .btn-primary::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background-color: var(--primary);
            transition: all 0.3s; z-index: -1;
        }
        .btn-primary:hover::before { left: 0; }
        .btn-primary:hover { color: var(--bg-color); box-shadow: 0 0 20px var(--primary); }

        .btn-outline-secondary {
            background-color: var(--bg-card);
            color: var(--text-color);
            border: 1px dashed var(--border-color);
            border-radius: 0;
        }
        .btn-outline-secondary:hover { border-style: solid; border-color: var(--primary); color: var(--primary); }

        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; }
        
        .profile-img { 
            border-radius: 0;
            border: 2px solid var(--primary);
            filter: contrast(120%) sepia(100%) hue-rotate(130deg) saturate(300%);
        }
        [data-theme="light"] .profile-img { filter: contrast(120%) sepia(100%) hue-rotate(300deg) saturate(300%); }

        .service-card, .pricing-card, .portfolio-card, .case-study-card, .testimonial-card, .contact-panel {
            background-color: rgba(31, 40, 51, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 30px;
            transition: all 0.3s;
            position: relative;
        }
        .service-card::after, .pricing-card::after, .portfolio-card::after {
            content: ''; position: absolute; top: -2px; left: -2px; width: 20px; height: 20px;
            border-top: 2px solid var(--primary); border-left: 2px solid var(--primary);
        }
        .service-card::before, .pricing-card::before, .portfolio-card::before {
            content: ''; position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px;
            border-bottom: 2px solid var(--primary); border-right: 2px solid var(--primary);
        }
        .service-card:hover, .pricing-card:hover {
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            border-color: var(--primary);
        }
        [data-theme="light"] .service-card, [data-theme="light"] .pricing-card, [data-theme="light"] .portfolio-card,
        [data-theme="light"] .case-study-card, [data-theme="light"] .testimonial-card, [data-theme="light"] .contact-panel {
            background-color: rgba(224, 224, 224, 0.7);
        }

        .service-icon { color: var(--primary); font-size: 2rem; margin-bottom: 20px; }
        .service-link { color: var(--primary); text-decoration: none; }
        
        .portfolio-card { padding: 0; }
        .portfolio-overlay {
            background: rgba(11, 12, 16, 0.9);
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px;
            border-top: 1px dashed var(--primary);
            opacity: 0; transition: opacity 0.3s;
        }
        [data-theme="light"] .portfolio-overlay { background: rgba(240, 240, 240, 0.9); }
        .portfolio-card:hover .portfolio-overlay { opacity: 1; }
        .portfolio-tech .badge { background-color: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 0; }
        .portfolio-title { color: var(--text-color) !important; }

        .pricing-card.popular { border-color: var(--primary); box-shadow: 0 0 20px rgba(102, 252, 241, 0.1) inset; }
        .popular-badge {
            background-color: var(--primary); color: var(--bg-color);
            padding: 5px 15px; text-transform: uppercase;
            position: absolute; top: 0; right: 0;
        }

        .accordion-item { background: transparent; border: 1px solid var(--border-color); border-radius: 0 !important; margin-bottom: 10px; }
        .accordion-button { background: rgba(31, 40, 51, 0.5); color: var(--text-color); font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; border-radius: 0 !important; }
        .accordion-button:not(.collapsed) { background: rgba(102, 252, 241, 0.1); color: var(--primary); box-shadow: none; border-bottom: 1px solid var(--primary); }
        .accordion-button::after { filter: invert(1); }
        [data-theme="light"] .accordion-button::after { filter: invert(0); }

        .stat-value { font-size: 3rem; color: var(--text-color); text-shadow: 0 0 10px var(--primary); }
        .progress { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0; }
        .progress-bar { background-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        
        ::selection { background: var(--primary); color: var(--bg-color); }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar">

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold data-profile-name fs-3" href="#home" style="color: var(--primary); text-shadow: 0 0 5px var(--primary);"><i class="fa-solid fa-terminal me-2"></i>FreelancePro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars" style="color: var(--primary);"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#services">[Services]</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">[Work]</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">[About]</a></li>
                    <li class="nav-item"><a class="nav-link" href="#pricing">[Pricing]</a></li>
                    <li class="nav-item ms-lg-3"><a href="#contact" class="btn btn-primary px-4 py-2">Initialize()</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">

                <div class="col-lg-6 animate-on-scroll">

                    <p class="fs-5 mb-5 data-profile-desc">Loading_</p>
                    <div class="d-flex gap-3">
                        <a href="#contact" class="btn btn-primary px-4 py-2">> Execute Contact</a>
                        <a href="#portfolio" class="btn btn-outline-secondary px-4 py-2">> View_DB</a>
                    </div>
                    <div class="row mt-5 pt-4 data-stats-container border-top border-secondary"></div>
                </div>
                <div class="col-lg-5 offset-lg-1 mt-5 mt-lg-0 text-center animate-on-scroll" style="transition-delay: 0.2s;">
                    <img src="" alt="Profile" class="img-fluid profile-img data-profile-img w-75">
                </div>
            </div>
        </div>
    </section>

    <section id="services" class="py-5 border-top border-secondary">
        <div class="container py-5">
            <h2 class="text-center mb-5 animate-on-scroll"><i class="fa-solid fa-microchip me-2"></i>System Modules</h2>
            <div class="row data-services-container"></div>
        </div>
    </section>

    <section id="portfolio" class="py-5 border-top border-secondary">

            <h2 class="text-center mb-5 animate-on-scroll"><i class="fa-solid fa-database me-2"></i>Data Core</h2>
            <div class="row data-portfolio-container"></div>
        </div>
    </section>

    <section id="about" class="py-5 border-top border-secondary">
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-6 mb-5 mb-lg-0 animate-on-scroll">
                    <h3 class="mb-4">> Experience_Log</h3>
                    <div class="data-experience-container"></div>
                </div>
                <div class="col-lg-5 offset-lg-1 animate-on-scroll" style="transition-delay: 0.2s;">
                    <h3 class="mb-4">> System_Capabilities</h3>
                    <div class="data-skills-container"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="pricing" class="py-5 border-top border-secondary">
        <div class="container py-5">
            <h2 class="text-center mb-5 animate-on-scroll"><i class="fa-solid fa-credit-card me-2"></i>Transaction Protocols</h2>
            <div class="row justify-content-center data-pricing-container"></div>
        </div>
    </section>

    <section id="contact" class="py-5 border-top border-secondary">
        <div class="container py-5 text-center animate-on-scroll">
            <h2 class="display-4 mb-4">> Establish Connection_</h2>
            <a href="mailto:hello@freelancepro.dev" class="btn btn-primary px-5 py-3 fs-4">TRANSMIT</a>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
