<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Manager Pro</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4e73df" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <style>
      body {
        background-color: #f8f9fc;
        font-family: "Segoe UI", sans-serif;
      }
      .navbar {
        background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
        box-shadow: 0 4px 15px rgba(78, 115, 223, 0.4);
      }
      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        background: white;
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .card-cc {
        border-left: 6px solid #e74a3b;
        background: linear-gradient(135deg, #fff 0%, #fff5f5 100%);
      }
      .card-asset {
        border-left: 6px solid #1cc88a;
        background: linear-gradient(135deg, #fff 0%, #f0fdf4 100%);
      }
      .bg-gradient-primary {
        background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
      }
      .bg-gradient-success {
        background: linear-gradient(135deg, #1cc88a 0%, #13855c 100%);
      }
      .bg-gradient-warning {
        background: linear-gradient(135deg, #f6c23e 0%, #dda20a 100%);
      }
      .text-due {
        color: #e74a3b;
        font-weight: 800;
      }
      .text-bal {
        color: #1cc88a;
        font-weight: 800;
      }
      .loading-overlay {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transition: opacity 0.5s ease;
      }
      .loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-entry {
        animation: fadeInUp 0.6s ease-out forwards;
        opacity: 0;
      }
      .form-control,
      .form-select {
        border-radius: 12px;
        border: 1px solid #e3e6f0;
        background-color: #f8f9fc;
      }
    </style>
  </head>
  <body>
    <!-- Loader -->
    <div id="loader" class="loading-overlay">
      <div
        class="spinner-border text-primary"
        style="width: 3rem; height: 3rem"
      ></div>
      <div class="mt-3 fw-bold text-secondary">Syncing Data...</div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4 pt-3 pb-3 animate-entry">
      <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold">💸 Wallet Manager</span>
        <button
          class="btn btn-sm btn-light text-primary fw-bold shadow-sm"
          onclick="fetchData()"
        >
          🔄 Sync
        </button>
      </div>
    </nav>

    <div class="container pb-5">
      <!-- 1. DASHBOARD TOTALS -->
      <div class="row g-3 mb-4">
        <div class="col-md-4 animate-entry" style="animation-delay: 0.1s">
          <div class="card bg-gradient-primary text-white h-100">
            <div class="card-body">
              <h6 class="opacity-75 text-uppercase small">Net Worth</h6>
              <h2 class="fw-bold" id="cardNetBalance">...</h2>
              <small style="opacity: 0.8; font-size: 12px"
                >Assets - Credit Debt</small
              >
            </div>
          </div>
        </div>
        <div class="col-md-4 animate-entry" style="animation-delay: 0.2s">
          <div class="card bg-gradient-success text-white h-100">
            <div class="card-body">
              <h6 class="opacity-75 text-uppercase small">Income (Month)</h6>
              <h2 class="fw-bold" id="cardMonthIncome">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4 animate-entry" style="animation-delay: 0.3s">
          <div class="card bg-gradient-warning text-white h-100">
            <div class="card-body">
              <h6 class="opacity-75 text-uppercase small text-dark">
                Expense (Month)
              </h6>
              <h2 class="fw-bold text-dark" id="cardMonthExpense">0</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. ACCOUNTS LIST -->
      <h5
        class="text-secondary small fw-bold text-uppercase mb-3 ps-1 animate-entry"
        style="animation-delay: 0.4s"
      >
        💳 Accounts
      </h5>
      <div class="row g-3 mb-4" id="accountCards">
        <div class="col-12 text-center py-4 text-muted">Loading...</div>
      </div>

      <!-- 3. INPUT FORMS -->
      <div class="card mb-4 animate-entry" style="animation-delay: 0.5s">
        <div class="card-header bg-white pt-3 border-0">
          <ul class="nav nav-pills" id="pills-tab">
            <li class="nav-item">
              <button
                class="nav-link active fw-bold px-4"
                data-bs-toggle="pill"
                data-bs-target="#content-trans"
              >
                ➕ Income / Expense
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link fw-bold px-4"
                data-bs-toggle="pill"
                data-bs-target="#content-transfer"
              >
                🔄 Transfer
              </button>
            </li>
          </ul>
        </div>
        <div class="card-body">
          <div class="tab-content">
            <!-- Income/Expense Form -->
            <div class="tab-pane fade show active" id="content-trans">
              <form id="transForm">
                <div class="row g-2">
                  <div class="col-md-2 col-6">
                    <label class="small fw-bold text-muted">Type</label>
                    <select class="form-select border-0" id="tType">
                      <option value="Expense">Expense 🔴</option>
                      <option value="Income">Income 🟢</option>
                    </select>
                  </div>
                  <div class="col-md-4 col-6">
                    <label class="small fw-bold text-muted">Account</label>
                    <select
                      class="form-select account-dropdown border-0"
                      id="tAccount"
                      required
                    ></select>
                  </div>
                  <div class="col-md-3">
                    <label class="small fw-bold text-muted">Category</label>
                    <input
                      type="text"
                      class="form-control border-0"
                      id="tCategory"
                      list="catList"
                      placeholder="Select..."
                      required
                    />
                    <datalist id="catList">
                      <option value="Bills"></option>
                      <option value="Daily Needs"></option>
                      <option value="Donate"></option>
                      <option value="Due Collect"></option>
                      <option value="Food"></option>
                      <option value="Other"></option>
                      <option value="Pay Bill"></option>
                      <option value="Recharge"></option>
                      <option value="Salary"></option>
                      <option value="Shopping"></option>
                      <option value="Transport"></option>
                    </datalist>
                  </div>
                  <div class="col-md-3">
                    <label class="small fw-bold text-muted">Amount</label>
                    <input
                      type="number"
                      class="form-control border-0"
                      id="tAmount"
                      placeholder="0.00"
                      required
                    />
                  </div>
                  <div class="col-md-9">
                    <label class="small fw-bold text-muted">Remarks</label>
                    <input
                      type="text"
                      class="form-control border-0"
                      id="tNote"
                      placeholder="e.g. Lunch, Uber"
                    />
                  </div>
                  <div class="col-md-3 d-flex align-items-end">
                    <button
                      type="submit"
                      class="btn btn-primary w-100 fw-bold shadow-sm mt-3 mt-md-0"
                    >
                      Save
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <!-- Transfer Form -->
            <div class="tab-pane fade" id="content-transfer">
              <form id="transferForm">
                <div class="row g-2 align-items-end">
                  <div class="col-md-3">
                    <label class="small fw-bold text-muted">From</label
                    ><select
                      class="form-select account-dropdown border-0"
                      id="trFrom"
                      required
                    ></select>
                  </div>
                  <div
                    class="col-md-1 text-center d-none d-md-block fs-4 text-muted"
                  >
                    ➔
                  </div>
                  <div class="col-md-3">
                    <label class="small fw-bold text-muted">To</label
                    ><select
                      class="form-select account-dropdown border-0"
                      id="trTo"
                      required
                    ></select>
                  </div>
                  <div class="col-md-3">
                    <label class="small fw-bold text-muted">Amount</label
                    ><input
                      type="number"
                      class="form-control border-0"
                      id="trAmount"
                      required
                    />
                  </div>
                  <div class="col-md-2">
                    <button
                      type="submit"
                      class="btn btn-dark w-100 fw-bold shadow-sm"
                    >
                      Transfer
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. CHARTS -->
      <div class="row mb-4">
        <div class="col-md-4 mb-3 animate-entry" style="animation-delay: 0.6s">
          <div class="card p-3 h-100">
            <h6 class="text-center fw-bold text-secondary">Structure</h6>
            <div style="height: 220px; display: flex; justify-content: center">
              <canvas id="catChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-4 mb-3 animate-entry" style="animation-delay: 0.7s">
          <div class="card p-3 h-100">
            <h6 class="text-center fw-bold text-secondary">Assets</h6>
            <div style="height: 220px"><canvas id="balChart"></canvas></div>
          </div>
        </div>
        <div class="col-md-4 mb-3 animate-entry" style="animation-delay: 0.8s">
          <div class="card p-3 h-100">
            <h6 class="text-center fw-bold text-secondary">Daily Trend</h6>
            <div style="height: 220px"><canvas id="trendChart"></canvas></div>
          </div>
        </div>
      </div>

      <!-- 5. RECENT TRANSACTIONS -->
      <div class="card animate-entry" style="animation-delay: 0.9s">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center py-3"
        >
          <span class="fw-bold">📜 Recent (Last 10)</span>
          <a href="transactions.html" class="btn btn-sm btn-outline-primary"
            >View All</a
          >
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Date</th>
                <th>Type</th>
                <th>Account</th>
                <th>Details</th>
                <th class="text-end pe-3">Amount</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // 🔴 PASTE YOUR NEW SCRIPT URL HERE
      const API_URL =
        "https://script.google.com/macros/s/AKfycbzhvw8FBTPYZ6Fe1Oir2niuWFVctOEIoVjyI-FamayiGn0wjxzQPqcGKVZks_JxUjRQRQ/exec";

      let chartCat, chartBal, chartTrend;
      toastr.options = {
        closeButton: true,
        progressBar: true,
        positionClass: "toast-top-right",
        timeOut: "3000",
      };

      document.addEventListener("DOMContentLoaded", fetchData);

      function fetchData() {
        document.getElementById("loader").style.display = "flex";
        document.getElementById("loader").classList.remove("fade-out");

        fetch(API_URL)
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "error") toastr.error("Error: " + data.message);
            else processData(data);

            document.getElementById("loader").classList.add("fade-out");
            setTimeout(() => {
              document.getElementById("loader").style.display = "none";
            }, 500);
          })
          .catch((err) => {
            console.error(err);
            toastr.error("Sync Failed");
            document.getElementById("loader").style.display = "none";
          });
      }

      function processData(data) {
        let balances = {};
        let totalAssets = 0,
          totalDebt = 0,
          monthlyIncome = 0,
          monthlyExpense = 0;
        let catTotals = {},
          dailySpending = {};

        // 1. Initial Balances from 'Accounts' Sheet
        const dropdowns = document.querySelectorAll(".account-dropdown");
        dropdowns.forEach((dd) => (dd.innerHTML = ""));
        data.accounts.forEach((acc) => {
          if (!acc.Account) return;
          balances[acc.Account] = parseFloat(acc.InitialBalance) || 0;
          dropdowns.forEach((dd) => {
            let opt = document.createElement("option");
            opt.value = acc.Account;
            opt.innerText = acc.Account;
            dd.appendChild(opt);
          });
        });

        const now = new Date();

        // 2. Process Transactions (Income/Expense)
        data.transactions.forEach((t) => {
          if (!t.Account || !t.Type) return;
          let amt = parseFloat(t.Amount) || 0;
          let acc = t.Account;
          let typeStr = t.Type.toString();

          let isCC = isCreditCard(acc);

          if (isCC) {
            // CC Logic: Expense increases debt (balance), Income reduces debt
            if (typeStr === "Expense") balances[acc] += amt; // Adds positive number (More Debt)
            if (typeStr === "Income") balances[acc] -= amt; // Subtracts (Less Debt)
          } else {
            // Asset Logic: Expense reduces asset, Income increases asset
            if (typeStr === "Expense") balances[acc] -= amt;
            if (typeStr === "Income") balances[acc] += amt;
          }

          // Stats
          let tDate = new Date(t.Date);
          let isThisMonth =
            tDate.getMonth() === now.getMonth() &&
            tDate.getFullYear() === now.getFullYear();
          if (typeStr === "Income" && isThisMonth) monthlyIncome += amt;
          if (typeStr === "Expense" && isThisMonth) {
            monthlyExpense += amt;
            catTotals[t.Category] = (catTotals[t.Category] || 0) + amt;
            let d = tDate.getDate();
            dailySpending[d] = (dailySpending[d] || 0) + amt;
          }
        });

        // 3. Process Transfers (New Logic from 'Transfers' Sheet)
        if (data.transfers) {
          data.transfers.forEach((tr) => {
            let from = tr.FromAccount;
            let to = tr.ToAccount;
            let amt = parseFloat(tr.Amount) || 0;

            // FROM Logic
            if (isCreditCard(from)) {
              balances[from] += amt; // Taking loan from CC -> Debt Increases
            } else {
              balances[from] -= amt; // Taking money from Cash -> Cash Decreases
            }

            // TO Logic
            if (isCreditCard(to)) {
              balances[to] -= amt; // Paying CC Bill -> Debt Decreases
            } else {
              balances[to] += amt; // Adding to Cash -> Cash Increases
            }
          });
        }

        // Render Cards
        const accContainer = document.getElementById("accountCards");
        accContainer.innerHTML = "";
        let accLabels = [],
          accData = [],
          accColors = [];
        let i = 0;

        for (const [name, bal] of Object.entries(balances)) {
          let isCC = isCreditCard(name);
          let displayBal = bal,
            displayTitle = "Available",
            color = "text-bal",
            border = "card-asset";

          if (isCC) {
            totalDebt += bal;
            displayTitle = "DUE";
            color = "text-due";
            border = "card-cc";
          } else {
            totalAssets += bal;
          }

          accContainer.innerHTML += `
            <div class="col-6 col-md-3 animate-entry" style="animation-delay: ${
              0.4 + i * 0.1
            }s">
                <div class="card h-100 p-3 ${border}">
                    <small class="text-muted fw-bold text-uppercase text-truncate">${name}</small>
                    <div style="font-size:0.7rem" class="text-muted">${displayTitle}</div>
                    <h5 class="${color}">${displayBal.toLocaleString()}</h5>
                </div>
            </div>`;
          accLabels.push(name);
          accData.push(bal);
          accColors.push(isCC ? "#e74a3b" : "#1cc88a");
          i++;
        }

        animateNumber("cardNetBalance", totalAssets - totalDebt);
        animateNumber("cardMonthIncome", monthlyIncome);
        animateNumber("cardMonthExpense", monthlyExpense);

        // Combine Transactions and Transfers for the Table
        let combinedHistory = [...data.transactions];
        if (data.transfers) {
          data.transfers.forEach((tr) => {
            combinedHistory.push({
              Date: tr.Date,
              Type: "Transfer",
              Account: tr.FromAccount + " ➔ " + tr.ToAccount,
              Category: "Transfer",
              Amount: tr.Amount,
              Note: tr.Note,
            });
          });
        }
        // Sort by Date
        combinedHistory.sort((a, b) => new Date(a.Date) - new Date(b.Date));

        renderTable(combinedHistory);
        renderCharts(catTotals, accLabels, accData, accColors, dailySpending);
      }

      function isCreditCard(name) {
        let n = name.toLowerCase();
        // Returns true if name contains credit/visa/master AND NOT debit
        return (
          (n.includes("credit") ||
            n.includes("visa") ||
            n.includes("master") ||
            n.includes("amex")) &&
          !n.includes("debit")
        );
      }

      const sendData = (payload) => {
        const loader = document.getElementById("loader");
        loader.style.display = "flex";
        loader.classList.remove("fade-out");

        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
          .then((res) => res.json())
          .then(() => {
            toastr.success("✅ Saved!");
            document.getElementById("transForm").reset();
            document.getElementById("transferForm").reset();
            setTimeout(() => {
              fetchData();
            }, 2500); // 2.5s Delay for Sheet Update
          })
          .catch(() => {
            toastr.warning("Offline save. Refreshing...");
            setTimeout(() => {
              fetchData();
            }, 2500);
          });
      };

      document.getElementById("transForm").addEventListener("submit", (e) => {
        e.preventDefault();
        sendData({
          action: "transaction",
          type: document.getElementById("tType").value,
          account: document.getElementById("tAccount").value,
          category: document.getElementById("tCategory").value,
          amount: document.getElementById("tAmount").value,
          note: document.getElementById("tNote").value || "Web Entry",
        });
      });
      document
        .getElementById("transferForm")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          if (
            document.getElementById("trFrom").value ===
            document.getElementById("trTo").value
          ) {
            toastr.warning("⚠️ Same Account!");
            return;
          }
          sendData({
            action: "transfer",
            fromAccount: document.getElementById("trFrom").value,
            toAccount: document.getElementById("trTo").value,
            amount: document.getElementById("trAmount").value,
            note: "Transfer",
          });
        });

      function renderTable(data) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        data
          .slice(-10)
          .reverse()
          .forEach((row, idx) => {
            let badge = "bg-light text-dark";
            if (row.Type === "Expense") badge = "bg-danger text-white";
            if (row.Type === "Income") badge = "bg-success text-white";
            if (row.Type === "Transfer") badge = "bg-primary text-white";

            let amount = parseFloat(row.Amount) || 0;
            let color = row.Type === "Expense" ? "text-danger" : "text-success";
            if (row.Type === "Transfer") color = "text-primary";

            let details = row.Category;
            if (row.Note && row.Note !== "Web Entry")
              details += ` <span class="text-muted small">(${row.Note})</span>`;

            tbody.innerHTML += `
            <tr class="animate-entry" style="animation-delay: ${
              0.8 + idx * 0.05
            }s">
                <td class="ps-3 small">${new Date(
                  row.Date
                ).toLocaleDateString()}</td>
                <td><span class="badge ${badge} rounded-pill">${
              row.Type
            }</span></td>
                <td class="small fw-bold">${row.Account}</td>
                <td class="small">${details}</td>
                <td class="fw-bold text-end pe-3 ${color}">${Math.abs(
              amount
            ).toLocaleString()}</td>
            </tr>`;
          });
      }

      function animateNumber(id, val) {
        const el = document.getElementById(id);
        el.innerText = Math.round(val).toLocaleString();
      }

      function renderCharts(cat, aL, aD, aC, daily) {
        if (chartCat) chartCat.destroy();
        if (chartBal) chartBal.destroy();
        if (chartTrend) chartTrend.destroy();
        chartCat = new Chart(document.getElementById("catChart"), {
          type: "doughnut",
          data: {
            labels: Object.keys(cat),
            datasets: [
              {
                data: Object.values(cat),
                borderWidth: 0,
                backgroundColor: [
                  "#4e73df",
                  "#1cc88a",
                  "#36b9cc",
                  "#f6c23e",
                  "#e74a3b",
                  "#858796",
                ],
              },
            ],
          },
          options: {
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
                labels: { usePointStyle: true, boxWidth: 8 },
              },
            },
          },
        });
        chartBal = new Chart(document.getElementById("balChart"), {
          type: "bar",
          data: {
            labels: aL,
            datasets: [{ data: aD, backgroundColor: aC, borderRadius: 4 }],
          },
          options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { display: false }, x: { grid: { display: false } } },
          },
        });
        let days = Object.keys(daily).sort((a, b) => a - b);
        chartTrend = new Chart(document.getElementById("trendChart"), {
          type: "line",
          data: {
            labels: days,
            datasets: [
              {
                data: days.map((d) => daily[d]),
                borderColor: "#4e73df",
                backgroundColor: "rgba(78,115,223,0.1)",
                fill: true,
                tension: 0.4,
              },
            ],
          },
          options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { display: false }, x: { grid: { display: false } } },
          },
        });
      }
    </script>
  </body>
</html>
