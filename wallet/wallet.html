<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Dashboard</title>
    
    <!-- PWA & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4e73df">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #f8f9fc; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #4e73df 0%, #224abe 100%); box-shadow: 0 4px 15px rgba(78, 115, 223, 0.4); }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); background: white; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card-cc { border-left: 6px solid #e74a3b; }
        .card-asset { border-left: 6px solid #1cc88a; }
        .bg-gradient-primary { background: linear-gradient(135deg, #4e73df 0%, #224abe 100%); }
        .bg-gradient-success { background: linear-gradient(135deg, #1cc88a 0%, #13855c 100%); }
        .bg-gradient-warning { background: linear-gradient(135deg, #f6c23e 0%, #dda20a 100%); }
        .text-due { color: #e74a3b; font-weight: 800; }
        .text-bal { color: #1cc88a; font-weight: 800; }
        
        .loading-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s ease; }
        .loading-overlay.fade-out { opacity: 0; pointer-events: none; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
    </style>
</head>
<body>

<!-- Loader -->
<div id="loader" class="loading-overlay">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <div class="mt-3 fw-bold text-secondary">Syncing Dashboard...</div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-dark mb-4 pt-3 pb-3">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold">💸 Wallet Manager</span>
        <button class="btn btn-sm btn-light text-primary fw-bold shadow-sm" onclick="fetchData()">🔄 Sync</button>
    </div>
</nav>

<div class="container pb-5">

    <!-- 1. DASHBOARD TOTALS -->
    <div class="row g-3 mb-4">
        <div class="col-md-4 animate-entry" style="animation-delay: 0.1s;">
            <div class="card bg-gradient-primary text-white h-100">
                <div class="card-body">
                    <h6 class="opacity-75 text-uppercase small">Net Balance</h6>
                    <h2 class="fw-bold" id="cardNetBalance">...</h2>
                    <small style="opacity: 0.8; font-size: 12px;">Assets - Credit Debt</small>
                </div>
            </div>
        </div>
        <div class="col-md-4 animate-entry" style="animation-delay: 0.2s;">
            <div class="card bg-gradient-success text-white h-100">
                <div class="card-body">
                    <h6 class="opacity-75 text-uppercase small">Income (Month)</h6>
                    <h2 class="fw-bold" id="cardMonthIncome">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 animate-entry" style="animation-delay: 0.3s;">
            <div class="card bg-gradient-warning text-white h-100">
                <div class="card-body">
                    <h6 class="opacity-75 text-uppercase small text-dark">Expense (Month)</h6>
                    <h2 class="fw-bold text-dark" id="cardMonthExpense">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. ACCOUNTS LIST -->
    <h5 class="text-secondary small fw-bold text-uppercase mb-3 ps-1 animate-entry">💳 Accounts & Cards</h5>
    <div class="row g-3 mb-4" id="accountCards">
        <div class="col-12 text-center py-4 text-muted">Loading...</div>
    </div>

    <!-- 3. INPUT FORMS -->
    <div class="card mb-4 animate-entry" style="animation-delay: 0.4s;">
        <div class="card-header bg-white pt-3 border-0">
            <ul class="nav nav-pills" id="pills-tab">
                <li class="nav-item"><button class="nav-link active fw-bold px-4" data-bs-toggle="pill" data-bs-target="#content-trans">➕ New Entry</button></li>
                <li class="nav-item"><button class="nav-link fw-bold px-4" data-bs-toggle="pill" data-bs-target="#content-transfer">🔄 Transfer</button></li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content">
                <!-- Income/Expense Form -->
                <div class="tab-pane fade show active" id="content-trans">
                    <form id="transForm">
                        <div class="row g-2">
                            <div class="col-md-2 col-6">
                                <label class="small fw-bold text-muted">Type</label>
                                <select class="form-select bg-light border-0" id="tType">
                                    <option value="Expense">Expense 🔴</option>
                                    <option value="Income">Income 🟢</option>
                                </select>
                            </div>
                            <div class="col-md-4 col-6">
                                <label class="small fw-bold text-muted">Account</label>
                                <select class="form-select account-dropdown bg-light border-0" id="tAccount" required></select>
                            </div>
                            <div class="col-md-3">
                                <label class="small fw-bold text-muted">Category</label>
                                <input type="text" class="form-control bg-light border-0" id="tCategory" list="catList" placeholder="Select..." required>
                                <datalist id="catList">
                                    <option value="Bills">
                                    <option value="Daily Needs">
                                    <option value="Donate">
                                    <option value="Due Collect">
                                    <option value="Food">
                                    <option value="Other">
                                    <option value="Pay Bill">
                                    <option value="Recharge">
                                    <option value="Salary">
                                    <option value="Shopping">
                                    <option value="Transport">
                                </datalist>
                            </div>
                            <div class="col-md-3">
                                <label class="small fw-bold text-muted">Amount</label>
                                <input type="number" class="form-control bg-light border-0" id="tAmount" placeholder="0.00" required>
                            </div>
                            <div class="col-md-9">
                                <label class="small fw-bold text-muted">Remarks</label>
                                <input type="text" class="form-control bg-light border-0" id="tNote" placeholder="e.g. Lunch, Uber">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm mt-3 mt-md-0">Save</button>
                            </div>
                        </div>
                    </form>
                </div>
                <!-- Transfer Form -->
                <div class="tab-pane fade" id="content-transfer">
                    <form id="transferForm">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-3"><label class="small fw-bold text-muted">From</label><select class="form-select account-dropdown bg-light border-0" id="trFrom" required></select></div>
                            <div class="col-md-1 text-center d-none d-md-block fs-4 text-muted">➔</div>
                            <div class="col-md-3"><label class="small fw-bold text-muted">To</label><select class="form-select account-dropdown bg-light border-0" id="trTo" required></select></div>
                            <div class="col-md-3"><label class="small fw-bold text-muted">Amount</label><input type="number" class="form-control bg-light border-0" id="trAmount" required></div>
                            <div class="col-md-2"><button type="submit" class="btn btn-dark w-100 fw-bold shadow-sm">Transfer</button></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. CHARTS -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3 animate-entry" style="animation-delay: 0.5s;">
            <div class="card p-3 h-100">
                <h6 class="text-center fw-bold text-secondary">Structure</h6>
                <div style="height:220px; display:flex; justify-content:center;"><canvas id="catChart"></canvas></div>
            </div>
        </div>
        <div class="col-md-4 mb-3 animate-entry" style="animation-delay: 0.6s;">
            <div class="card p-3 h-100">
                <h6 class="text-center fw-bold text-secondary">Assets</h6>
                <div style="height:220px;"><canvas id="balChart"></canvas></div>
            </div>
        </div>
        <div class="col-md-4 mb-3 animate-entry" style="animation-delay: 0.7s;">
            <div class="card p-3 h-100">
                <h6 class="text-center fw-bold text-secondary">Daily Trend</h6>
                <div style="height:220px;"><canvas id="trendChart"></canvas></div>
            </div>
        </div>
    </div>

    <!-- 5. RECENT TRANSACTIONS (Limit 5) -->
    <div class="card animate-entry" style="animation-delay: 0.8s;">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <span class="fw-bold">📜 Recent (Last 5)</span>
            <a href="transactions.html" class="btn btn-sm btn-outline-primary">
                View All & Filter <i class="bi bi-arrow-right"></i>
            </a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light"><tr><th class="ps-3">Date</th><th>Type</th><th>Account</th><th>Details</th><th class="text-end pe-3">Amount</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 🔴 PASTE URL HERE
    const API_URL = 'https://script.google.com/macros/s/AKfycbyPbTv4uysFKsxf95ZWz7xS-9IxvwV8pdAYHj-xfpZnB8z3mlF_rH6CLZgF6WhuzJjzMg/exec'; 

    let chartCat, chartBal, chartTrend;

    document.addEventListener('DOMContentLoaded', fetchData);

    function fetchData() {
        document.getElementById('loader').style.display = 'flex';
        fetch(API_URL).then(res => res.json()).then(data => {
            if(data.status === 'error') alert("Error: " + data.message);
            else processData(data);
            document.getElementById('loader').classList.add('fade-out');
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
        });
    }

    function processData(data) {
        let balances = {};
        let totalAssets = 0, totalDebt = 0, monthlyIncome = 0, monthlyExpense = 0;
        let catTotals = {}, dailySpending = {};

        // Init Accounts
        const dropdowns = document.querySelectorAll('.account-dropdown');
        dropdowns.forEach(dd => dd.innerHTML = '');
        
        data.accounts.forEach(acc => {
            if(!acc.Account) return;
            balances[acc.Account] = parseFloat(acc.InitialBalance) || 0;
            dropdowns.forEach(dd => {
                let opt = document.createElement('option');
                opt.value = acc.Account; opt.innerText = acc.Account;
                dd.appendChild(opt);
            });
        });

        const now = new Date();

        data.transactions.forEach(t => {
            if(!t.Account || !t.Type) return;
            let rawAmt = Math.abs(parseFloat(t.Amount)||0);
            let finalAmt = 0;
            let typeStr = t.Type.toString();
            let isCC = t.Account.toLowerCase().includes('credit');

            if(isCC) {
                if(typeStr === 'Expense' || typeStr.includes('Out')) finalAmt = rawAmt;
                else finalAmt = -rawAmt;
            } else {
                if(typeStr === 'Expense' || typeStr.includes('Out')) finalAmt = -rawAmt;
                else finalAmt = rawAmt;
            }

            if(balances.hasOwnProperty(t.Account)) balances[t.Account] += finalAmt;

            // Stats
            let tDate = new Date(t.Date);
            let isThisMonth = (tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear());

            if(typeStr === 'Income' && isThisMonth) monthlyIncome += rawAmt;
            if(typeStr === 'Expense' && isThisMonth) {
                monthlyExpense += rawAmt;
                catTotals[t.Category] = (catTotals[t.Category] || 0) + rawAmt;
                let d = tDate.getDate();
                dailySpending[d] = (dailySpending[d] || 0) + rawAmt;
            }
        });

        // Render Cards
        const accContainer = document.getElementById('accountCards');
        accContainer.innerHTML = '';
        let accLabels = [], accData = [], accColors = [];
        let i = 0;

        for (const [name, bal] of Object.entries(balances)) {
            let isCC = name.toLowerCase().includes('credit') && !name.toLowerCase().includes('debit');
            let displayBal = bal, displayTitle = "Available", color = "text-bal", border = "card-asset";
            
            if(isCC) {
                totalDebt += bal; displayTitle = "DUE"; color = "text-due"; border = "card-cc";
            } else {
                totalAssets += bal;
            }

            accContainer.innerHTML += `
            <div class="col-6 col-md-3 animate-entry" style="animation-delay: ${0.4+(i*0.1)}s">
                <div class="card h-100 p-3 ${border}">
                    <small class="text-muted fw-bold text-uppercase text-truncate">${name}</small>
                    <div style="font-size:0.7rem" class="text-muted">${displayTitle}</div>
                    <h5 class="${color}">${displayBal.toLocaleString()}</h5>
                </div>
            </div>`;
            
            accLabels.push(name); accData.push(bal); accColors.push(isCC ? '#e74a3b' : '#1cc88a');
            i++;
        }

        // Update Totals
        document.getElementById('cardNetBalance').innerText = (totalAssets - totalDebt).toLocaleString();
        document.getElementById('cardMonthIncome').innerText = monthlyIncome.toLocaleString();
        document.getElementById('cardMonthExpense').innerText = monthlyExpense.toLocaleString();

        renderTable(data.transactions);
        renderCharts(catTotals, accLabels, accData, accColors, dailySpending);
    }

    // Forms
    const sendData = (payload) => {
        document.getElementById('loader').style.display = 'flex';
        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json()).then(() => { alert("Saved!"); fetchData(); document.getElementById('transForm').reset(); })
        .catch(() => { alert("Saved! Refreshing..."); fetchData(); });
    }
    document.getElementById('transForm').addEventListener('submit', (e) => {
        e.preventDefault();
        let note = document.getElementById('tNote').value || "Web Entry";
        sendData({ action: "transaction", type: document.getElementById('tType').value, account: document.getElementById('tAccount').value, category: document.getElementById('tCategory').value, amount: document.getElementById('tAmount').value, note: note });
    });
    document.getElementById('transferForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if(document.getElementById('trFrom').value === document.getElementById('trTo').value) return alert("Same Account!");
        sendData({ action: "transfer", fromAccount: document.getElementById('trFrom').value, toAccount: document.getElementById('trTo').value, amount: document.getElementById('trAmount').value, note: "Transfer" });
    });

    function renderTable(data) {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        const valid = data.filter(r => r.Date && r.Type).slice(-5).reverse();
        valid.forEach((row, idx) => {
            let badge = "bg-light text-dark", tBadge = row.Type;
            if(row.Type === 'Expense') { badge = "bg-danger text-white"; tBadge="Exp"; }
            if(row.Type === 'Income') { badge = "bg-success text-white"; tBadge="Inc"; }
            if(row.Type.includes("Transfer")) { badge = "bg-info text-white"; tBadge="Trf"; }
            
            let det = `<div class="fw-bold">${row.Category||"Transfer"}</div>`;
            if(row.Note && row.Note!="Web Entry") det += `<div class="small text-muted fst-italic">${row.Note}</div>`;

            tbody.innerHTML += `
            <tr class="animate-entry" style="animation-delay: ${0.8+(idx*0.05)}s">
                <td class="ps-3 small">${new Date(row.Date).toLocaleDateString()}</td>
                <td><span class="badge ${badge} rounded-pill">${tBadge}</span></td>
                <td class="small fw-bold">${row.Account}</td>
                <td>${det}</td>
                <td class="fw-bold text-end pe-3 ${row.Amount<0?'text-danger':'text-success'}">${Math.abs(row.Amount).toLocaleString()}</td>
            </tr>`;
        });
    }

    function renderCharts(cat, aL, aD, aC, daily) {
        if(chartCat) chartCat.destroy(); if(chartBal) chartBal.destroy(); if(chartTrend) chartTrend.destroy();
        
        chartCat = new Chart(document.getElementById('catChart'), { type: 'doughnut', data: { labels: Object.keys(cat), datasets: [{ data: Object.values(cat), borderWidth:0 }] }, options: { maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8}}} } });
        
        chartBal = new Chart(document.getElementById('balChart'), { type: 'bar', data: { labels: aL, datasets: [{ data: aD, backgroundColor: aC, borderRadius:4 }] }, options: { maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{display:false},x:{grid:{display:false}}} } });

        let days = Object.keys(daily).sort((a,b)=>a-b);
        chartTrend = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: days, datasets: [{ data: days.map(d=>daily[d]), borderColor:'#4e73df', backgroundColor:'rgba(78,115,223,0.1)', fill:true, tension:0.4 }] }, options: { maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{display:false},x:{grid:{display:false}}} } });
    }
</script>
</body>
</html>
