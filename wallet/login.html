<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Login - Secure Access</title>

    <!-- PWA & Icons -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4e73df" />

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <!-- Toastr CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        position: relative;
      }

      /* Animated Background */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
            600px circle at 0% 0%,
            rgba(120, 119, 198, 0.3),
            transparent 50%
          ),
          radial-gradient(
            600px circle at 100% 100%,
            rgba(120, 119, 198, 0.3),
            transparent 50%
          );
        animation: gradientShift 8s ease-in-out infinite;
      }

      @keyframes gradientShift {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
      }

      /* Floating particles */
      .particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: float 20s infinite linear;
      }

      .particle:nth-child(1) {
        width: 80px;
        height: 80px;
        top: 20%;
        left: 10%;
        animation-delay: 0s;
      }

      .particle:nth-child(2) {
        width: 120px;
        height: 120px;
        top: 60%;
        right: 10%;
        animation-delay: 2s;
      }

      .particle:nth-child(3) {
        width: 60px;
        height: 60px;
        bottom: 20%;
        left: 20%;
        animation-delay: 4s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
          opacity: 0.7;
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
          opacity: 1;
        }
      }

      .login-container {
        position: relative;
        z-index: 10;
        max-width: 420px;
        width: 90%;
        perspective: 1000px;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transform-style: preserve-3d;
        transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        animation: cardEntrance 1s ease-out;
      }

      @keyframes cardEntrance {
        from {
          opacity: 0;
          transform: translateY(50px) rotateX(10deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotateX(0deg);
        }
      }

      .login-card:hover {
        transform: translateY(-5px) rotateX(2deg);
        box-shadow: 0 35px 60px -12px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.3);
      }

      .wallet-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 20px;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: white;
        animation: logoFloat 3s ease-in-out infinite;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .login-title {
        color: #2d3748;
        font-weight: 700;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        text-align: center;
        animation: slideDown 0.8s ease-out 0.2s both;
      }

      .login-subtitle {
        color: #718096;
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 400;
        animation: slideDown 0.8s ease-out 0.4s both;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .pin-container {
        animation: slideUp 0.8s ease-out 0.6s both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .pin-input {
        background: rgba(255, 255, 255, 0.8);
        border: 2px solid rgba(102, 126, 234, 0.2);
        border-radius: 16px;
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.5em;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 1.5rem;
      }

      .pin-input:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1),
          0 10px 25px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }

      .pin-input::placeholder {
        color: #a0aec0;
        letter-spacing: 0.2em;
      }

      .login-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 16px;
        padding: 1rem 2rem;
        color: white;
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      }

      .login-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
      }

      .login-btn:active {
        transform: translateY(-1px);
      }

      .login-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .login-btn:hover::before {
        left: 100%;
      }

      .login-btn:disabled {
        opacity: 0.7;
        transform: none;
        cursor: not-allowed;
      }

      .security-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: #68d391;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: 1.5rem;
        animation: fadeIn 1s ease-out 0.8s both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .error-message {
        color: #e53e3e;
        text-align: center;
        margin-top: 1rem;
        font-weight: 500;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }

      .error-message.show {
        opacity: 1;
        transform: translateY(0);
      }

      .loading-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .btn-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .login-card {
          padding: 2rem 1.5rem;
          margin: 1rem;
        }

        .login-title {
          font-size: 1.5rem;
        }
      }

      /* Accessibility */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="login-container">
      <div class="login-card">
        <div class="wallet-logo">💳</div>

        <h1 class="login-title">Wallet Access</h1>
        <p class="login-subtitle">
          Enter your secure PIN to access your wallet
        </p>

        <form id="loginForm" class="pin-container">
          <input
            type="password"
            id="pinInput"
            class="form-control pin-input"
            placeholder="Enter PIN"
            maxlength="6"
            autocomplete="off"
            required
          />

          <button type="submit" class="btn login-btn w-100" id="loginBtn">
            <div class="btn-content">
              <span class="btn-text">🔓 Access Wallet</span>
              <div class="loading-spinner d-none"></div>
            </div>
          </button>

          <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="security-badge">
          <i class="bi bi-shield-check"></i>
          <span>Secured with PIN Protection</span>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
      // Configure Toastr
      toastr.options = {
        closeButton: true,
        debug: false,
        newestOnTop: true,
        progressBar: true,
        positionClass: "toast-top-right",
        preventDuplicates: false,
        onclick: null,
        showDuration: "300",
        hideDuration: "1000",
        timeOut: "3000",
        extendedTimeOut: "1000",
        showEasing: "swing",
        hideEasing: "linear",
        showMethod: "fadeIn",
        hideMethod: "fadeOut",
      };

      const DEFAULT_PIN = "1";

      // Check if already logged in
      document.addEventListener("DOMContentLoaded", function () {
        const storedPin = localStorage.getItem("walletPin");
        if (storedPin === DEFAULT_PIN) {
          window.location.href = "wallet.html";
        }

        // Focus on PIN input
        document.getElementById("pinInput").focus();
      });

      // Handle form submission
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const pinInput = document.getElementById("pinInput");
          const loginBtn = document.getElementById("loginBtn");
          const btnText = document.querySelector(".btn-text");
          const spinner = document.querySelector(".loading-spinner");
          const errorMessage = document.getElementById("errorMessage");
          const enteredPin = pinInput.value.trim();

          // Clear previous error
          errorMessage.classList.remove("show");

          // Validate PIN
          if (!enteredPin) {
            showError("Please enter your PIN");
            return;
          }

          // Show loading state
          loginBtn.disabled = true;
          btnText.textContent = "Verifying...";
          spinner.classList.remove("d-none");

          // Simulate authentication delay for better UX
          setTimeout(() => {
            if (enteredPin === DEFAULT_PIN) {
              // Successful login
              localStorage.setItem("walletPin", enteredPin);

              btnText.textContent = "✅ Access Granted!";
              spinner.classList.add("d-none");

              toastr.success("🎉 Welcome back! Redirecting to your wallet...");

              setTimeout(() => {
                window.location.href = "wallet.html";
              }, 1500);
            } else {
              // Failed login
              loginBtn.disabled = false;
              btnText.textContent = "🔓 Access Wallet";
              spinner.classList.add("d-none");

              showError("❌ Incorrect PIN. Please try again.");
              pinInput.value = "";
              pinInput.focus();

              // Shake animation for failed attempt
              pinInput.style.animation = "shake 0.5s ease-in-out";
              setTimeout(() => {
                pinInput.style.animation = "";
              }, 500);

              toastr.error("🚫 Invalid PIN. Access denied.");
            }
          }, 1200);
        });

      // Show error message
      function showError(message) {
        const errorElement = document.getElementById("errorMessage");
        errorElement.textContent = message;
        errorElement.classList.add("show");

        setTimeout(() => {
          errorElement.classList.remove("show");
        }, 4000);
      }

      // Add shake animation for errors
      const shakeCSS = `
            @keyframes shake {
                0%, 20%, 40%, 60%, 80%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            }
        `;
      const style = document.createElement("style");
      style.textContent = shakeCSS;
      document.head.appendChild(style);

      // Handle Enter key on PIN input
      document
        .getElementById("pinInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            document
              .getElementById("loginForm")
              .dispatchEvent(new Event("submit"));
          }
        });

      // Add visual feedback for number input
      document
        .getElementById("pinInput")
        .addEventListener("input", function (e) {
          const value = e.target.value;
          if (value.length > 0) {
            e.target.style.borderColor = "#667eea";
            e.target.style.backgroundColor = "white";
          } else {
            e.target.style.borderColor = "rgba(102, 126, 234, 0.2)";
            e.target.style.backgroundColor = "rgba(255, 255, 255, 0.8)";
          }
        });

      // Prevent right-click context menu for security
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      // Disable F12 and other dev tools shortcuts for security
      document.addEventListener("keydown", function (e) {
        if (
          e.key === "F12" ||
          (e.ctrlKey &&
            e.shiftKey &&
            (e.key === "I" || e.key === "C" || e.key === "J")) ||
          (e.ctrlKey && e.key === "U")
        ) {
          e.preventDefault();
          toastr.warning("🔒 Developer tools are disabled for security.");
          return false;
        }
      });
    </script>
  </body>
</html>
