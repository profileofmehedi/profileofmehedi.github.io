<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    
    <meta name="theme-color" content="#4e73df">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #f8f9fc; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #4e73df 0%, #224abe 100%); box-shadow: 0 4px 15px rgba(78, 115, 223, 0.4); }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); background: white; }
        .loading-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s ease; }
        .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <div class="mt-3 fw-bold text-secondary">Loading History...</div>
</div>

<!-- Navbar with Back Button -->
<nav class="navbar navbar-dark mb-4 pt-3 pb-3">
    <div class="container">
        <div class="d-flex align-items-center">
            <a href="wallet.html" class="btn btn-outline-light btn-sm me-3 border-0">
                <i class="bi bi-arrow-left fs-5"></i>
            </a>
            <span class="navbar-brand mb-0 h1 fw-bold">All Transactions</span>
        </div>
        <button class="btn btn-sm btn-light text-primary fw-bold shadow-sm" onclick="fetchData()">🔄 Refresh</button>
    </div>
</nav>

<div class="container pb-5">

    <!-- Filters -->
    <div class="card p-3 mb-4 animate-entry" style="animation-delay: 0.1s;">
        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-funnel"></i> Filters</h6>
        <div class="row g-2">
            <div class="col-6 col-md-3">
                <label class="small text-muted fw-bold">Start Date</label>
                <input type="date" id="fStart" class="form-control bg-light border-0">
            </div>
            <div class="col-6 col-md-3">
                <label class="small text-muted fw-bold">End Date</label>
                <input type="date" id="fEnd" class="form-control bg-light border-0">
            </div>
            <div class="col-6 col-md-3">
                <label class="small text-muted fw-bold">Type</label>
                <select id="fType" class="form-select bg-light border-0">
                    <option value="All">All Types</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                    <option value="Transfer">Transfer</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="small text-muted fw-bold">Account</label>
                <select id="fAccount" class="form-select bg-light border-0">
                    <option value="All">All Accounts</option>
                </select>
            </div>
            <div class="col-12 mt-3 text-end">
                <button class="btn btn-primary w-100 fw-bold" onclick="applyFilters()">Apply Filters</button>
            </div>
        </div>
    </div>

    <!-- Full History Table -->
    <div class="card animate-entry" style="animation-delay: 0.2s;">
        <div class="card-header bg-white py-3 fw-bold">History Data</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Date</th>
                        <th>Type</th>
                        <th>Account</th>
                        <th>Details</th>
                        <th class="text-end pe-3">Amount</th>
                    </tr>
                </thead>
                <tbody id="fullHistoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 🔴 PASTE URL HERE
    const API_URL = 'https://script.google.com/macros/s/AKfycbyPbTv4uysFKsxf95ZWz7xS-9IxvwV8pdAYHj-xfpZnB8z3mlF_rH6CLZgF6WhuzJjzMg/exec'; 

    let allData = [];

    document.addEventListener('DOMContentLoaded', fetchData);

    function fetchData() {
        document.getElementById('loader').style.display = 'flex';
        fetch(API_URL).then(res => res.json()).then(data => {
            if(data.status === 'error') alert(data.message);
            else {
                allData = data.transactions.filter(t => t.Date && t.Type);
                populateAccountFilter(data.accounts);
                renderTable(allData);
            }
            document.getElementById('loader').classList.add('fade-out');
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
        });
    }

    function populateAccountFilter(accounts) {
        const sel = document.getElementById('fAccount');
        sel.innerHTML = '<option value="All">All Accounts</option>';
        accounts.forEach(acc => {
            if(acc.Account) {
                let opt = document.createElement('option');
                opt.value = acc.Account; opt.innerText = acc.Account;
                sel.appendChild(opt);
            }
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('fullHistoryBody');
        tbody.innerHTML = '';
        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No records found.</td></tr>';
            return;
        }

        [...data].reverse().forEach(row => {
            let date = new Date(row.Date).toLocaleDateString();
            let displayAmt = Math.abs(row.Amount);
            let color = row.Amount < 0 ? 'text-danger' : 'text-success';
            
            let det = `<div class="fw-bold">${row.Category||"Transfer"}</div>`;
            if(row.Note && row.Note!="Web Entry") det += `<div class="small text-muted fst-italic">${row.Note}</div>`;

            tbody.innerHTML += `
            <tr>
                <td class="ps-3 text-muted small">${date}</td>
                <td>${row.Type}</td>
                <td class="small fw-bold">${row.Account}</td>
                <td>${det}</td>
                <td class="${color} fw-bold text-end pe-3">${displayAmt.toLocaleString()}</td>
            </tr>`;
        });
    }

    function applyFilters() {
        let fStart = document.getElementById('fStart').value;
        let fEnd = document.getElementById('fEnd').value;
        let fType = document.getElementById('fType').value;
        let fAcc = document.getElementById('fAccount').value;

        let filtered = allData.filter(t => {
            let tDate = new Date(t.Date);
            let valid = true;
            if(fStart && tDate < new Date(fStart)) valid = false;
            if(fEnd && tDate > new Date(fEnd)) valid = false;
            if(fType !== 'All') {
                if(fType === 'Transfer' && !t.Type.includes('Transfer')) valid = false;
                else if(fType !== 'Transfer' && t.Type !== fType) valid = false;
            }
            if(fAcc !== 'All' && t.Account !== fAcc) valid = false;
            return valid;
        });
        renderTable(filtered);
    }
</script>
</body>
</html>
