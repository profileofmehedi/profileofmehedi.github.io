<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tester Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="visibility: hidden">
    <div id="app-content">
      <h2 id="welcome-message" class="mb-4"></h2>
      <div class="row g-4">
        <div class="col-md-3">
          <div class="stat-card text-center">
            <h3 id="total-tests" class="display-4 fw-bold">0</h3>
            <p class="text-muted">Total Test Cases</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card text-center">
            <h3 id="bugs-found" class="display-4 fw-bold">0</h3>
            <p class="text-muted">Bugs Found</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card text-center">
            <h3 id="tests-passed" class="display-4 fw-bold">0</h3>
            <p class="text-muted">Tests Passed</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card text-center">
            <h3 id="coverage-percent" class="display-4 fw-bold">0%</h3>
            <p class="text-muted">Test Coverage</p>
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card">
            <h5 class="mb-3">My Testing Tasks</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="my-tasks-table"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card">
            <h5 class="mb-3">Bug Priority Distribution</h5>
            <div class="chart-container">
              <canvas id="bugPriorityChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-12">
          <div class="stat-card">
            <h5 class="mb-3">Testing Progress Overview</h5>
            <div class="chart-container">
              <canvas id="testingProgressChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="db.js"></script>
    <script src="layout.js"></script>
    <script>
      const loggedInUser = JSON.parse(sessionStorage.getItem("loggedInUser"));
      $("#welcome-message").text(`Welcome, ${loggedInUser.name}!`);

      // Get tester's assigned tasks
      const myTasks = tasks.filter((task) => task.assignee === loggedInUser.id);
      const allBugs = tasks.filter((task) => task.type === "Bug");

      // Calculate statistics
      const totalTests = myTasks.length;
      const bugsFound = allBugs.length;
      const testsPassed = myTasks.filter(
        (task) => task.status === "Done"
      ).length;
      const testCoverage =
        totalTests > 0 ? Math.round((testsPassed / totalTests) * 100) : 0;

      // Update dashboard stats
      $("#total-tests").text(totalTests);
      $("#bugs-found").text(bugsFound);
      $("#tests-passed").text(testsPassed);
      $("#coverage-percent").text(testCoverage + "%");

      // Populate my tasks table
      const myTasksTable = $("#my-tasks-table");
      const statusColors = {
        "To Do": "secondary",
        "In Progress": "warning",
        Done: "success",
      };
      const priorityIcons = {
        High: "priority-High",
        Medium: "priority-Medium",
        Low: "priority-Low",
      };
      const typeIcons = {
        Bug: "fa-bug",
        Story: "fa-book",
        Task: "fa-tasks",
      };

      if (myTasks.length > 0) {
        myTasks.forEach((task) => {
          const project = projects.find((p) => p.id === task.projectId);
          myTasksTable.append(`
            <tr>
              <td>TASK-${task.id}</td>
              <td>
                <span class="task-type-icon ${task.type}" title="${task.type}">
                  <i class="fas ${typeIcons[task.type]}"></i>
                </span>
                ${task.type}
              </td>
              <td>${task.title}</td>
              <td>
                <span class="task-priority ${priorityIcons[task.priority]}">
                  <i class="fas fa-circle"></i> ${task.priority}
                </span>
              </td>
              <td>
                <span class="badge bg-${statusColors[task.status]}">
                  ${task.status}
                </span>
              </td>
            </tr>
          `);
        });
      } else {
        myTasksTable.append(
          '<tr><td colspan="5" class="text-center py-4">No testing tasks assigned yet.</td></tr>'
        );
      }

      // Bug Priority Distribution Chart
      const bugPriorities = { High: 0, Medium: 0, Low: 0 };
      allBugs.forEach((bug) => {
        bugPriorities[bug.priority]++;
      });

      new Chart(document.getElementById("bugPriorityChart"), {
        type: "doughnut",
        data: {
          labels: Object.keys(bugPriorities),
          datasets: [
            {
              label: "Bugs",
              data: Object.values(bugPriorities),
              backgroundColor: ["#dc3545", "#ffc107", "#0d6efd"],
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
        },
      });

      // Testing Progress Chart
      const projectProgress = projects.map((project) => {
        const projectTasks = tasks.filter((t) => t.projectId === project.id);
        const testerTasks = projectTasks.filter(
          (t) => t.assignee === loggedInUser.id
        );
        const completedTests = testerTasks.filter(
          (t) => t.status === "Done"
        ).length;
        const totalTests = testerTasks.length;
        return {
          name: project.name,
          completed: completedTests,
          total: totalTests,
          percentage: totalTests > 0 ? (completedTests / totalTests) * 100 : 0,
        };
      });

      new Chart(document.getElementById("testingProgressChart"), {
        type: "bar",
        data: {
          labels: projectProgress.map((p) => p.name),
          datasets: [
            {
              label: "Completed Tests",
              data: projectProgress.map((p) => p.completed),
              backgroundColor: "#198754",
            },
            {
              label: "Total Tests",
              data: projectProgress.map((p) => p.total),
              backgroundColor: "#6c757d",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
    </script>
  </body>
</html>
