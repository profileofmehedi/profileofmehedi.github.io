<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="visibility: hidden">
    <div id="app-content">
      <h2 id="welcome-message" class="mb-4"></h2>
      <div class="row">
        <div class="col-md-12">
          <div class="stat-card p-3">
            <h5 class="mb-3">My Assigned Tasks</h5>
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Priority</th>
                  <th>Title</th>
                  <th>Project</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tasks-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="db.js"></script>
    <script src="layout.js"></script>
    <script>
      const loggedInUser = JSON.parse(sessionStorage.getItem("loggedInUser"));
      $("#welcome-message").text(`Welcome, ${loggedInUser.name}!`);

      const myTasks = tasks.filter((task) => task.assignee === loggedInUser.id);
      const tasksTableBody = $("#tasks-table-body");
      const statusColors = {
        "To Do": "secondary",
        "In Progress": "warning",
        Done: "success",
      };
      const priorityIcons = {
        High: "priority-High",
        Medium: "priority-Medium",
        Low: "priority-Low",
      };

      if (myTasks.length > 0) {
        myTasks.forEach((task) => {
          const project = projects.find((p) => p.id === task.projectId);
          tasksTableBody.append(`
                <tr>
                    <td>TASK-${task.id}</td>
                    <td><span class="task-priority ${
                      priorityIcons[task.priority]
                    }"><i class="fas fa-circle"></i> ${
            task.priority
          }</span></td>
                    <td>${task.title}</td>
                    <td>${project ? project.name : "N/A"}</td>
                    <td><span class="badge bg-${statusColors[task.status]}">${
            task.status
          }</span></td>
                </tr>`);
        });
      } else {
        tasksTableBody.append(
          '<tr><td colspan="5" class="text-center py-4">You have no assigned tasks.</td></tr>'
        );
      }
    </script>
  </body>
</html>
