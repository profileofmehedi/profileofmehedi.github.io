<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Task - Jira Clone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <style>
    :root {
      --sidebar-bg: #0747a6;
      --sidebar-text: #deebff;
      --sidebar-hover: #0052cc;
      --page-bg: #f4f5f7;
      --text-color: #172b4d;
      --atlassian-blue: #0052cc;
    }
    body {
      background-color: var(--page-bg);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }
    .main-container {
      display: flex;
    }
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      color: var(--sidebar-text);
      height: 100vh;
      padding: 1.5rem 0;
      flex-shrink: 0;
    }
    .sidebar .logo {
      display: flex;
      align-items: center;
      padding: 0 1.5rem 1.5rem;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .sidebar .logo .fa-jira {
      margin-right: 10px;
    }
    .sidebar .nav-link {
      color: var(--sidebar-text);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      font-weight: 500;
      border-left: 3px solid transparent;
    }
    .sidebar .nav-link:hover {
      background-color: var(--sidebar-hover);
    }
    .sidebar .nav-link.active {
      background-color: var(--sidebar-hover);
      border-left-color: #4c9aff;
    }
    .sidebar .nav-link .nav-icon {
      margin-right: 12px;
      width: 20px;
      text-align: center;
    }
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .top-nav {
      background-color: #fff;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #dfe1e6;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .content-area {
      padding: 2rem;
    }
    .form-container {
      max-width: 700px;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #5e6c84;
    }
    .btn-primary {
      background-color: var(--atlassian-blue);
      border: none;
      font-weight: 500;
    }
  </style>
  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="logo"><i class="fab fa-jira"></i>Jira Clone</div>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="user_dashboard.html"
              ><i class="fas fa-columns nav-icon"></i>Dashboard</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="user_project_board.html"
              ><i class="fas fa-clipboard-list nav-icon"></i>Project Board</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="user_create_task.html"
              ><i class="fas fa-plus-square nav-icon"></i>Create Task</a
            >
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <div class="top-nav">
          <button id="logout-btn" class="btn btn-outline-danger btn-sm">
            Logout
          </button>
        </div>
        <div class="content-area">
          <h1 class="h3 mb-4">Create Task</h1>
          <div
            id="success-message"
            class="alert alert-success"
            style="display: none"
          ></div>
          <div class="form-container bg-white p-4 rounded shadow-sm">
            <form id="create-task-form">
              <div class="mb-3">
                <label for="task-project" class="form-label">Project</label>
                <select class="form-select" id="task-project" required></select>
              </div>
              <div class="mb-3">
                <label for="task-title" class="form-label">Summary</label>
                <input
                  type="text"
                  class="form-control"
                  id="task-title"
                  required
                  placeholder="Enter a brief summary of the task"
                />
              </div>
              <div class="mb-3">
                <label for="task-description" class="form-label"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="task-description"
                  rows="4"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="task-assignee" class="form-label">Assignee</label>
                <select
                  class="form-select"
                  id="task-assignee"
                  required
                ></select>
              </div>
              <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                  Create Task
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="db.js"></script>
    <script>
      $(document).ready(function () {
        const loggedInUser = JSON.parse(sessionStorage.getItem("loggedInUser"));
        if (!loggedInUser || loggedInUser.role !== "user") {
          window.location.href = "login.html";
          return;
        }

        // Populate dropdowns
        const projectSelect = $("#task-project");
        projects.forEach((p) =>
          projectSelect.append(`<option value="${p.id}">${p.name}</option>`)
        );

        const assigneeSelect = $("#task-assignee");
        users.forEach((u) =>
          assigneeSelect.append(`<option value="${u.id}">${u.name}</option>`)
        );

        $("#create-task-form").on("submit", function (e) {
          e.preventDefault();
          const newTask = {
            id: tasks.length + 1,
            projectId: parseInt($("#task-project").val()),
            title: $("#task-title").val(),
            description: $("#task-description").val(),
            status: "To Do",
            assignee: parseInt($("#task-assignee").val()),
          };

          tasks.push(newTask);

          $("#success-message")
            .text("Task created successfully!")
            .show()
            .delay(3000)
            .fadeOut();
          $("#create-task-form")[0].reset();
        });

        $("#logout-btn").on("click", function () {
          sessionStorage.removeItem("loggedInUser");
          window.location.href = "login.html";
        });
      });
    </script>
  </body>
</html>
