<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Board - Jira Clone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Project Board</h2>
        <div class="col-md-3">
          <select id="project-filter" class="form-select"></select>
        </div>
      </div>
      <div class="kanban-board">
        <div class="kanban-column" data-status="To Do">
          <h5>To Do</h5>
          <div class="task-list" id="todo-list"></div>
        </div>
        <div class="kanban-column" data-status="In Progress">
          <h5>In Progress</h5>
          <div class="task-list" id="inprogress-list"></div>
        </div>
        <div class="kanban-column" data-status="Done">
          <h5>Done</h5>
          <div class="task-list" id="done-list"></div>
        </div>
      </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal fade" id="taskDetailModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="task-modal-title"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="task-edit-form">
              <input type="hidden" id="task-modal-id" />
              <div class="mb-3">
                <label for="task-modal-description" class="form-label"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="task-modal-description"
                  rows="4"
                ></textarea>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="task-modal-assignee" class="form-label"
                    >Assignee</label
                  >
                  <select class="form-select" id="task-modal-assignee"></select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="task-modal-status" class="form-label"
                    >Status</label
                  >
                  <select class="form-select" id="task-modal-status">
                    <option>To Do</option>
                    <option>In Progress</option>
                    <option>Done</option>
                  </select>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-danger me-auto"
              id="delete-task-btn"
            >
              Delete Task
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" id="save-task-btn">
              Save changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="db.js"></script>
    <script src="layout.js"></script>
    <script>
      $(document).ready(function () {
        const projectFilter = $("#project-filter");
        const taskDetailModal = new bootstrap.Modal(
          document.getElementById("taskDetailModal")
        );

        // Populate project filter
        projects.forEach((p) =>
          projectFilter.append(`<option value="${p.id}">${p.name}</option>`)
        );

        // Render the board
        function renderBoard(projectId) {
          $(".task-list").empty();
          const projectTasks = tasks.filter((t) => t.projectId == projectId);

          projectTasks.forEach((task) => {
            const assignee = users.find((u) => u.id === task.assignee);
            const taskCardHtml = `
                <div class="task-card" data-task-id="${task.id}">
                    <p>${task.title}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <small>TASK-${task.id}</small>
                        <span class="badge rounded-pill bg-primary">${
                          assignee ? assignee.avatar : "?"
                        }</span>
                    </div>
                </div>`;

            if (task.status === "To Do") $("#todo-list").append(taskCardHtml);
            else if (task.status === "In Progress")
              $("#inprogress-list").append(taskCardHtml);
            else $("#done-list").append(taskCardHtml);
          });
        }

        // Initialize SortableJS for drag-and-drop
        $(".task-list").each(function () {
          new Sortable(this, {
            group: "tasks",
            animation: 150,
            onEnd: function (evt) {
              const taskId = $(evt.item).data("task-id");
              const newStatus = $(evt.to)
                .closest(".kanban-column")
                .data("status");
              const task = tasks.find((t) => t.id == taskId);
              if (task) {
                task.status = newStatus;
                showToast(`Task ${taskId} moved to ${newStatus}`);
                // In a real app, you'd save this to a server.
              }
            },
          });
        });

        // Handle opening the task detail modal
        $(document).on("click", ".task-card", function () {
          const taskId = $(this).data("task-id");
          const task = tasks.find((t) => t.id == taskId);

          $("#task-modal-id").val(task.id);
          $("#task-modal-title").text(task.title);
          $("#task-modal-description").val(task.description);
          $("#task-modal-status").val(task.status);

          const assigneeSelect = $("#task-modal-assignee").empty();
          users.forEach((u) =>
            assigneeSelect.append(
              `<option value="${u.id}" ${
                u.id == task.assignee ? "selected" : ""
              }>${u.name}</option>`
            )
          );

          taskDetailModal.show();
        });

        // Handle saving task details from modal
        $("#save-task-btn").on("click", function () {
          const taskId = $("#task-modal-id").val();
          const task = tasks.find((t) => t.id == taskId);

          task.description = $("#task-modal-description").val();
          task.assignee = parseInt($("#task-modal-assignee").val());
          task.status = $("#task-modal-status").val();

          taskDetailModal.hide();
          renderBoard(projectFilter.val());
          showToast("Task updated successfully!");
        });

        // Handle deleting a task
        $("#delete-task-btn").on("click", function () {
          if (confirm("Are you sure you want to delete this task?")) {
            const taskId = $("#task-modal-id").val();
            tasks = tasks.filter((t) => t.id != taskId);
            taskDetailModal.hide();
            renderBoard(projectFilter.val());
            showToast("Task deleted successfully!", "danger");
          }
        });

        // Initial render and event listener for project filter
        projectFilter
          .on("change", () => renderBoard(projectFilter.val()))
          .trigger("change");
      });
    </script>
  </body>
</html>
