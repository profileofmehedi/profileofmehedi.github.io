<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Jira Clone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f4f5f7;
      }
      .login-container {
        max-width: 400px;
        width: 100%;
        padding: 3rem 2.5rem;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .login-container .jira-logo {
        color: #0052cc;
      }
      .btn-primary {
        background-color: #0052cc;
        border: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1 class="h2 mb-3"><i class="fab fa-jira jira-logo"></i> Jira Clone</h1>
      <p class="text-muted mb-4">Log in to continue</p>
      <div
        id="error-message"
        class="alert alert-danger"
        style="display: none"
      ></div>
      <form id="login-form" class="text-start">
        <div class="mb-3">
          <label for="username" class="form-label fw-bold">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            value="user"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label fw-bold">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            value="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Log In</button>
      </form>
      <div class="mt-4 text-center">
        <p class="text-muted mb-1 small">
          Use: `user`, `lead`, `admin`, or `tester`
        </p>
        <p class="text-muted small">Password: `password`</p>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="db.js"></script>
    <script>
      $(document).ready(function () {
        $("#login-form").on("submit", function (e) {
          e.preventDefault();
          const username = $("#username").val();
          const password = $("#password").val();
          const user = users.find(
            (u) => u.username === username && u.password === password
          );

          if (user) {
            sessionStorage.setItem("loggedInUser", JSON.stringify(user));
            const roleRedirects = {
              admin: "admin_dashboard.html",
              lead: "lead_dashboard.html",
              user: "user_dashboard.html",
              tester: "tester_dashboard.html",
            };
            window.location.href = roleRedirects[user.role];
          } else {
            $("#error-message").text("Invalid username or password.").show();
          }
        });
      });
    </script>
  </body>
</html>
