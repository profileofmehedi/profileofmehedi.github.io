<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Lead Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="visibility: hidden">
    <div id="app-content">
      <h2 id="welcome-message" class="mb-4"></h2>
      <div id="project-info" class="alert alert-info"></div>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="stat-card text-center">
            <h3 id="task-count" class="display-4 fw-bold"></h3>
            <p class="text-muted">Total Tasks in Project</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card text-center">
            <h3 id="team-count" class="display-4 fw-bold"></h3>
            <p class="text-muted">Team Members</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card text-center">
            <h3 id="tasks-done" class="display-4 fw-bold"></h3>
            <p class="text-muted">Tasks Completed</p>
          </div>
        </div>
        <div class="col-md-12">
          <div class="stat-card">
            <h5 class="mb-3">Project Task Status</h5>
            <div class="chart-container">
              <canvas id="taskStatusChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="db.js"></script>
    <script src="layout.js"></script>
    <script>
      const loggedInUser = JSON.parse(sessionStorage.getItem("loggedInUser"));
      const myProject = projects.find((p) => p.leadId === loggedInUser.id);

      $("#welcome-message").text(`Welcome, ${loggedInUser.name}!`);

      if (myProject) {
        const myTasks = tasks.filter((t) => t.projectId === myProject.id);
        const myTeam = users.filter((u) => u.teamId === loggedInUser.teamId);

        $("#project-info").html(
          `You are leading project: <strong>${myProject.name}</strong>`
        );
        $("#task-count").text(myTasks.length);
        $("#team-count").text(myTeam.length);
        $("#tasks-done").text(
          myTasks.filter((t) => t.status === "Done").length
        );

        const statusCounts = {
          "To Do": 0,
          "In Progress": 0,
          Review: 0,
          Done: 0,
        };
        myTasks.forEach((task) => {
          statusCounts[task.status]++;
        });

        new Chart($("#taskStatusChart"), {
          type: "bar",
          data: {
            labels: Object.keys(statusCounts),
            datasets: [
              {
                label: "Number of Tasks",
                data: Object.values(statusCounts),
                backgroundColor: ["#6c757d", "#ffc107", "#17a2b8", "#198754"],
              },
            ],
          },
          options: { scales: { y: { beginAtZero: true } } },
        });
      } else {
        $("#project-info")
          .html("You are not assigned to lead any projects.")
          .addClass("alert-warning");
      }
    </script>
  </body>
</html>
