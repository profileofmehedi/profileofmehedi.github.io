<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Up - A Beautiful Journey</title>
    
    <!-- Import cute fonts from Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        /* --- 1. ANIMATED BACKGROUND --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* A beautiful moving gradient background */
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #84fab0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. FLOATING BUBBLES DECORATION --- */
        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0; /* Behind everything */
        }
        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            animation: animate 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }
        /* Randomize bubbles */
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .circles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .circles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .circles li:nth-child(10){ left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* --- 3. THE MAIN FRAME CARD --- */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            width: 380px;
            max-width: 90%;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.2), 
                0 0 0 8px rgba(255,255,255,0.4); /* Glass border effect */
            text-align: center;
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- 4. PHOTO CONTAINER --- */
        .photo-frame {
            width: 100%;
            height: 380px;
            background: #eee;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        /* The Image Logic (Double Buffered) */
        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(1);
            transition: opacity 1.5s ease-in-out, transform 5s ease-out;
        }

        .photo.active {
            opacity: 1;
            transform: scale(1.1); /* Zoom effect */
        }

        /* --- 5. TEXT STYLING --- */
        .text-container {
            margin-top: 20px;
            height: 60px; /* Fixed height to prevent jumping */
            position: relative;
            overflow: hidden;
        }

        .title {
            font-family: 'Pacifico', cursive;
            font-size: 2.2rem;
            color: #ff6b6b;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(255,255,255,1);
            
            /* Text Entrance Animation */
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        
        .title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Decorative heart */
        .heart {
            color: #ff4757;
            font-size: 1.5rem;
            animation: beat 1s infinite alternate;
            display: inline-block;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }

        /* Progress Dots */
        .progress {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 15px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #ddd;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }
        .dot.active {
            background-color: #ff6b6b;
            transform: scale(1.3);
        }

    </style>
</head>
<body>

    <!-- Background Decoration -->
    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Main Content -->
    <div class="card">
        <div class="photo-frame">
            <!-- Double slot system for smooth transitions -->
            <img id="slot1" class="photo" src="" alt="">
            <img id="slot2" class="photo" src="" alt="">
        </div>

        <div class="text-container">
            <h1 class="title" id="monthLabel">Loading...</h1>
        </div>
        
        <!-- 12 Dots representing the months -->
        <div class="progress" id="dotsContainer">
            <!-- Dots generated by JS -->
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const totalMonths = 12;
        const timePerPhoto = 3500; // 3.5 seconds
        
        let currentMonth = 1;
        let activeSlot = 1; // Tracks which img tag is currently visible
        
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const label = document.getElementById('monthLabel');
        const dotsContainer = document.getElementById('dotsContainer');

        // 1. Generate Progress Dots
        for(let i=0; i<totalMonths; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${i+1}`;
            dotsContainer.appendChild(dot);
        }

        // 2. Preload all images so animation is smooth
        function preloadImages() {
            for (let i = 1; i <= totalMonths; i++) {
                const img = new Image();
                img.src = `${i}.jpg`;
            }
        }

        // 3. The Animation Logic
        function showNextSlide() {
            const imgPath = `${currentMonth}.jpg`;
            const monthText = currentMonth === 1 
                ? "1 Month <span class='heart'>❤</span>" 
                : `${currentMonth} Months <span class='heart'>❤</span>`;

            // Identify current and next image slots
            const currentImg = activeSlot === 1 ? slot1 : slot2;
            const nextImg = activeSlot === 1 ? slot2 : slot1;

            // Load next image into the hidden slot
            nextImg.src = imgPath;

            nextImg.onload = () => {
                // Animate Text Out
                label.classList.remove('visible');

                // Animate Dots
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                document.getElementById(`dot-${currentMonth}`).classList.add('active');

                setTimeout(() => {
                    // Swap Images
                    currentImg.classList.remove('active');
                    nextImg.classList.add('active');
                    
                    // Update Text and Animate In
                    label.innerHTML = monthText;
                    label.classList.add('visible');

                }, 400); // Wait for text to fade out
            };

            // Prepare for next loop
            activeSlot = activeSlot === 1 ? 2 : 1;
            
            // Increment count
            currentMonth++;
            if (currentMonth > totalMonths) currentMonth = 1;
        }

        // --- START ---
        window.onload = () => {
            preloadImages();
            showNextSlide(); // Show first immediately
            setInterval(showNextSlide, timePerPhoto);
        };

    </script>
</body>
</html>
