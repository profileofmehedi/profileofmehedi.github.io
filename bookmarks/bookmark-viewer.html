<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Studio Pro</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* DARK THEME (DEFAULT) */
            --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a1a2e);
            --glass-bg: rgba(16, 26, 41, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #aab2bd;
            --accent-color: #00d2ff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.1);
            --sidebar-bg: rgba(0, 0, 0, 0.25);
            --scroll-thumb: rgba(255,255,255,0.2);
        }

        body.light-mode {
            /* LIGHT THEME */
            --bg-gradient: linear-gradient(-45deg, #e0eafc, #cfdef3, #f5f7fa, #c3cfe2);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --text-main: #2c3e50;
            --text-muted: #546e7a;
            --accent-color: #0056b3;
            --card-bg: rgba(255, 255, 255, 0.5);
            --card-hover: rgba(255, 255, 255, 0.85);
            --sidebar-bg: rgba(255, 255, 255, 0.3);
            --scroll-thumb: rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            transition: color 0.3s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navbar */
        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            height: 70px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .search-input {
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 20px;
            padding-left: 20px;
            transition: all 0.3s;
        }
        .light-mode .search-input { background: rgba(255,255,255,0.5); }
        
        .search-input:focus {
            background: var(--glass-highlight);
            border-color: var(--accent-color);
            color: var(--text-main);
            box-shadow: 0 0 0 0.2rem rgba(0, 210, 255, 0.15);
        }
        .search-input::placeholder { color: var(--text-muted); }

        .btn-tool {
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            margin-left: 5px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-tool:hover, .btn-tool.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(8px);
            border-right: 1px solid var(--glass-border);
            overflow-y: auto;
            padding: 20px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        /* Tree Styling */
        .tree-item {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            user-select: none;
        }
        .tree-item:hover {
            background: var(--card-hover);
            color: var(--text-main);
            transform: translateX(5px);
        }
        .tree-item.active {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-color);
            border-color: rgba(0, 210, 255, 0.2);
            font-weight: 500;
        }
        .light-mode .tree-item.active {
            background: rgba(0, 86, 179, 0.1);
            color: var(--accent-color);
            border-color: rgba(0, 86, 179, 0.2);
        }

        .tree-children {
            padding-left: 18px;
            display: none;
            border-left: 1px solid var(--glass-border);
            margin-left: 8px;
        }
        .folder-icon { color: #f1c40f; margin-right: 10px; }
        .toggle-icon { font-size: 0.7rem; width: 15px; text-align: center; margin-right: 5px; opacity: 0.7; }

        /* Content Area */
        .content-area {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* === GRID VIEW (Default) === */
        #bookmarks-grid {
            transition: all 0.3s ease;
        }
        
        .bookmark-card {
            background: var(--card-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .bookmark-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: var(--card-hover);
            border-color: var(--accent-color);
        }

        .card-body {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .favicon-wrapper {
            width: 40px;
            height: 40px;
            background: rgba(128, 128, 128, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .favicon-img { width: 24px; height: 24px; object-fit: contain; }

        .card-title {
            font-size: 0.95rem;
            margin: 0;
            font-weight: 500;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-url {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin-top: 2px;
        }

        /* === LIST VIEW (Table Style) === */
        #bookmarks-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #bookmarks-grid.list-view .col-card {
            width: 100% !important;
            max-width: 100% !important;
            flex: 0 0 100%;
        }

        #bookmarks-grid.list-view .bookmark-card {
            flex-direction: row;
            height: auto;
            border-radius: 8px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--glass-border);
        }
        
        #bookmarks-grid.list-view .bookmark-card:hover {
            transform: none;
            background: var(--card-hover);
            box-shadow: none;
        }

        #bookmarks-grid.list-view .card-body {
            padding: 10px 15px;
            width: 100%;
        }

        #bookmarks-grid.list-view .favicon-wrapper {
            width: 32px;
            height: 32px;
        }
        
        #bookmarks-grid.list-view .card-info {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }
        
        #bookmarks-grid.list-view .card-title {
            margin-bottom: 0;
            width: 40%;
        }
        #bookmarks-grid.list-view .card-url {
            width: 50%;
            margin-top: 0;
            text-align: right;
        }

        /* Footer */
        .app-footer {
            margin-top: auto;
            padding-top: 30px;
            padding-bottom: 10px;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
        }
        
        .app-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .app-footer a:hover {
            color: var(--text-main);
            text-decoration: underline;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Loader */
        #status-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f2027;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .light-mode #status-screen { background: #e0eafc; color: #333; }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid currentColor;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="">

    <!-- Loading Screen -->
    <div id="status-screen">
        <div id="loading-content" class="text-center">
            <span class="loader"></span>
            <h3>Loading Library...</h3>
            <p class="opacity-75">Reading <code>Bookmark File</code></p>
        </div>
        <div id="error-content" style="display:none; max-width: 600px; padding: 20px;">
            <i class="fas fa-lock fa-3x text-warning mb-3"></i>
            <h2>Security Access Required</h2>
            <p>Browsers cannot auto-read local files. Please run this via a <strong>Local Server</strong>.</p>
            <small class="opacity-75">Using VS Code? Right click > Open with Live Server.</small>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <button class="btn btn-link text-white d-md-none me-2" onclick="$('.sidebar').toggleClass('show')">
                <i class="fas fa-bars"></i>
            </button>
            <span class="navbar-brand mb-0 h1 fw-bold" style="color: var(--text-main);">
                <i class="fas fa-bookmark me-2" style="color: var(--accent-color);"></i>Bookmark<span style="opacity:0.7">Studio</span>
            </span>
        </div>
        
        <div class="d-flex w-50 mx-3">
            <div class="input-group">
                <span class="input-group-text bg-transparent border-0" style="color: var(--text-muted);"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" class="form-control search-input shadow-none" placeholder="Search bookmarks...">
            </div>
        </div>

        <div class="d-flex align-items-center">
            <!-- View Toggles -->
            <div class="btn-group me-3">
                <button class="btn btn-tool active" id="btn-grid" title="Grid View" onclick="switchView('grid')">
                    <i class="fas fa-th-large"></i>
                </button>
                <button class="btn btn-tool" id="btn-list" title="List View" onclick="switchView('list')">
                    <i class="fas fa-list"></i>
                </button>
            </div>

            <!-- Theme Toggle -->
            <button class="btn btn-tool" id="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                <i class="fas fa-sun" id="theme-icon"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar custom-scroll">
            <h6 class="text-uppercase small fw-bold mb-3 ls-1" style="color: var(--text-muted);">Explorer</h6>
            <div id="folder-tree-root"></div>
        </div>

        <!-- Content -->
        <div class="content-area custom-scroll">
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-end mb-4 px-1">
                    <div>
                        <h3 id="current-folder-title" class="fw-bold mb-1">Overview</h3>
                        <p class="small mb-0" style="color: var(--text-muted);" id="current-path">Select a folder</p>
                    </div>
                    <span id="count-badge" class="badge rounded-pill" style="background: var(--accent-color);">0 items</span>
                </div>
                
                <div class="row g-3" id="bookmarks-grid">
                    <!-- Bookmarks Injected Here -->
                </div>
            </div>

            <!-- Footer -->
            <footer class="app-footer">
                &copy; <span id="year"></span> <a href="https://profileofmehedi.github.io" target="_blank">Mehedi Hasan</a>. All rights reserved.
            </footer>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- CONFIG ---
        const TARGET_FILE = 'bookmarks_1_3_26.html';
        
        let allBookmarks = []; 
        let rootNode = null;

        $(document).ready(function() {
            $('#year').text(new Date().getFullYear());
            
            // Restore Theme
            const savedTheme = localStorage.getItem('bookmarkTheme');
            if(savedTheme === 'light') {
                $('body').addClass('light-mode');
                $('#theme-icon').removeClass('fa-sun').addClass('fa-moon');
            }

            // Restore View
            const savedView = localStorage.getItem('bookmarkView');
            if(savedView === 'list') {
                switchView('list');
            }

            // Load File
            loadBookmarksFile();

            // Search
            $('#searchInput').on('keyup', function() {
                const query = $(this).val().toLowerCase();
                if(query.length < 2) {
                    if(query.length === 0 && rootNode) {
                        const first = findFirstFolder(rootNode);
                        if(first) selectFolder(first);
                    }
                    return; 
                }
                const results = allBookmarks.filter(b => 
                    (b.title && b.title.toLowerCase().includes(query)) || 
                    (b.url && b.url.toLowerCase().includes(query))
                );
                renderBookmarks(results, `Search Results`, `Found ${results.length} matches`);
            });
			
        });

        // --- THEME & VIEW LOGIC ---
        function toggleTheme() {
            $('body').toggleClass('light-mode');
            const isLight = $('body').hasClass('light-mode');
            
            // Icon
            const $icon = $('#theme-icon');
            if(isLight) {
                $icon.removeClass('fa-sun').addClass('fa-moon');
                localStorage.setItem('bookmarkTheme', 'light');
            } else {
                $icon.removeClass('fa-moon').addClass('fa-sun');
                localStorage.setItem('bookmarkTheme', 'dark');
            }
        }

        function switchView(type) {
            const $grid = $('#bookmarks-grid');
            const $btnGrid = $('#btn-grid');
            const $btnList = $('#btn-list');

            if (type === 'list') {
                $grid.addClass('list-view');
                $btnList.addClass('active');
                $btnGrid.removeClass('active');
                localStorage.setItem('bookmarkView', 'list');
            } else {
                $grid.removeClass('list-view');
                $btnGrid.addClass('active');
                $btnList.removeClass('active');
                localStorage.setItem('bookmarkView', 'grid');
            }
        }

        // --- DATA PROCESSING ---
        function loadBookmarksFile() {
            $.ajax({
                url: TARGET_FILE,
                dataType: "text",
                success: function(data) {
                    parseBookmarksHTML(data);
                    setTimeout(() => $('#status-screen').fadeOut(500), 600);
                },
                error: function() {
                    if (window.location.protocol === 'file:') {
                        $('#loading-content').hide();
                        $('#error-content').show();
                    } else {
                        $('#loading-content').html(`<h3>Error</h3><p>File ${TARGET_FILE} not found.</p>`);
                    }
                }
            });
        }

        function parseBookmarksHTML(html) {
            const $dom = $('<div>').html(html);
            const rootData = { id: 'root', name: 'All Bookmarks', children: [], type: 'folder' };
            let $mainDL = $dom.find('dl').first();
            
            traverseNodes($mainDL, rootData);
            rootNode = rootData;
            renderSidebar(rootData);

            const firstFolder = findFirstFolder(rootData);
            if(firstFolder) {
                // Auto Expand in tree
                setTimeout(() => {
                    const $item = $(`.tree-item[data-id="${firstFolder.id}"]`);
                    $item.parents('.tree-children').show().prev().find('.toggle-icon').removeClass('fa-chevron-right').addClass('fa-chevron-down');
                    selectFolder(firstFolder);
                }, 100);
            }
        }

        function traverseNodes($dl, parentObj) {
            $dl.children('dt').each(function() {
                const $dt = $(this);
                const $h3 = $dt.children('h3');
                const $a = $dt.children('a');
                const $subDl = $dt.children('dl').length ? $dt.children('dl') : $dt.next('dd').children('dl');

                if ($h3.length > 0) {
                    const folderObj = {
                        id: Math.random().toString(36).substr(2, 9),
                        name: $h3.text(),
                        type: 'folder',
                        children: []
                    };
                    parentObj.children.push(folderObj);
                    if ($subDl.length > 0) traverseNodes($subDl, folderObj);
                } else if ($a.length > 0) {
                    const bookmarkObj = {
                        id: Math.random().toString(36).substr(2, 9),
                        title: $a.text(),
                        url: $a.attr('href'),
                        icon: $a.attr('icon'),
                        type: 'link'
                    };
                    parentObj.children.push(bookmarkObj);
                    allBookmarks.push(bookmarkObj);
                }
            });
        }

        // --- RENDERING ---
        function renderSidebar(data) {
            const $root = $('#folder-tree-root');
            $root.empty();
            
            function createTreeItem(item, level = 0) {
                const hasSubFolders = item.children && item.children.some(c => c.type === 'folder');
                const $container = $('<div>');
                
                const $row = $('<div>')
                    .addClass('tree-item')
                    .css('padding-left', (level * 15) + 10 + 'px')
                    .attr('data-id', item.id)
                    .on('click', function(e) {
                        e.stopPropagation();
                        if(hasSubFolders) {
                            const $children = $container.children('.tree-children');
                            $children.slideToggle(200);
                            const $icon = $(this).find('.toggle-icon');
                            if($children.is(':visible')) $icon.removeClass('fa-chevron-down').addClass('fa-chevron-right'); // Logic flip for animation
                            else $icon.toggleClass('fa-chevron-right fa-chevron-down');
                        }
                        $('.tree-item').removeClass('active');
                        $(this).addClass('active');
                        selectFolder(item);
                    });

                let arrow = `<i class="fas fa-chevron-right toggle-icon" style="opacity:${hasSubFolders ? 1 : 0}"></i>`;
                $row.html(`${arrow} <i class="fas fa-folder folder-icon"></i> <span>${item.name}</span>`);
                $container.append($row);

                if (hasSubFolders) {
                    const $childrenDiv = $('<div>').addClass('tree-children');
                    item.children.forEach(child => {
                        if (child.type === 'folder') $childrenDiv.append(createTreeItem(child, level + 1));
                    });
                    $container.append($childrenDiv);
                }
                return $container;
            }

            data.children.forEach(child => {
                if(child.type === 'folder') $root.append(createTreeItem(child));
            });
        }

        function selectFolder(folderData) {
            const links = folderData.children.filter(c => c.type === 'link');
            renderBookmarks(links, folderData.name, `Viewing contents of "${folderData.name}"`);
        }

        function renderBookmarks(bookmarks, title, subtitle) {
            const $grid = $('#bookmarks-grid');
            $grid.empty().hide();

            $('#current-folder-title').text(title);
            $('#current-path').text(subtitle);
            $('#count-badge').text(`${bookmarks.length} items`);

            if (bookmarks.length === 0) {
                $grid.html(`<div class="col-12 text-center py-5 opacity-50"><i class="far fa-folder-open fa-4x mb-3"></i><p>Empty Folder</p></div>`).fadeIn(200);
                return;
            }

            bookmarks.forEach((b, index) => {
                let iconSrc = b.icon;
                if(!iconSrc) {
                    try { iconSrc = `https://www.google.com/s2/favicons?domain=${new URL(b.url).hostname}&sz=64`; } catch(e) {}
                }

                const cardHtml = `
                    <div class="col-12 col-md-6 col-lg-4 col-xl-3 col-card" style="animation: fadeInUp 0.3s ease backwards ${Math.min(index * 0.03, 0.5)}s">
                        <a href="${b.url}" target="_blank" class="bookmark-card">
                            <div class="card-body">
                                <div class="favicon-wrapper">
                                    <img src="${iconSrc}" class="favicon-img" onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/globe.svg'; this.style.opacity=0.5">
                                </div>
                                <div class="card-info ps-2" style="flex:1; min-width:0;">
                                    <h5 class="card-title" title="${b.title}">${b.title || 'Untitled'}</h5>
                                    <span class="card-url">${getShortUrl(b.url)}</span>
                                </div>
                                <div class="arrow-indicator ms-auto">
                                    <i class="fas fa-external-link-alt small opacity-50"></i>
                                </div>
                            </div>
                        </a>
                    </div>
                `;
                $grid.append(cardHtml);
            });
            $grid.fadeIn(300);
        }

        function getShortUrl(url) {
            try { return new URL(url).hostname; } catch { return url; }
        }

        function findFirstFolder(node) {
            if(node.children && node.children.some(c => c.type === 'folder')) {
                const bar = node.children.find(c => c.name.toLowerCase().includes("bar"));
                return bar || node.children.find(c => c.type === 'folder');
            }
            return node;
        }
    </script>
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
