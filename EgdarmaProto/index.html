<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egdarma | Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- DataTables -->
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Leaflet (Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header text-center d-block">
                <img src="logo.png" alt="Egdarma Logo" style="height: 70px;">
            </div>

            <ul class="list-unstyled components" id="sidebar-menu">
                <!-- Dynamic Menu -->
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Overlay -->
            <div class="overlay" id="overlay"></div>

            <!-- Navbar -->
            <nav class="navbar navbar-custom">
                <div class="d-flex align-items-center">
                    <button type="button" id="sidebarCollapse" class="btn btn-light me-3 text-muted">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h5 class="m-0 fw-bold text-secondary" id="page-title">Dashboard</h5>
                </div>

                <div class="d-flex align-items-center">
                    <div class="user-pill dropdown">
                        <img src="" id="user-avatar" alt="User">
                        <span id="user-display-name">User</span>
                        <a href="#" id="logoutBtn" class="text-danger ms-2" title="Logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </div>
                </div>
            </nav>

            <!-- Dynamic Main Content -->
            <div id="main-content" class="fade-in">
                <!-- Views loaded here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- App Logic -->
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
