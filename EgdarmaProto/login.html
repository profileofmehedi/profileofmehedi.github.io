<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egdarma | Field Force Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-body">

    <div class="container d-flex justify-content-center">
        <div class="login-card fade-in">
            <!-- Left Side: Login Form -->
            <div class="login-left">
                <div class="mb-4 text-center">
                    <img src="logo.png" alt="Egdarma Logo" style="height: 120px; margin-bottom: 15px;">
                    <p class="text-muted">Field Force Management System</p>
                </div>

                <h5 class="mb-4">Select User Role to Login</h5>

                <div class="role-btn" onclick="quickLogin('admin')">
                    <div class="role-icon"><i class="fas fa-user-shield"></i></div>
                    <div class="role-info">
                        <h6>Administrator</h6>
                        <small>Manage Doctors, Users & Settings</small>
                    </div>
                    <i class="fas fa-arrow-right ms-auto text-muted"></i>
                </div>

                <div class="role-btn" onclick="quickLogin('manager')">
                    <div class="role-icon"><i class="fas fa-user-tie"></i></div>
                    <div class="role-info">
                        <h6>Divisional Manager</h6>
                        <small>Approve DCRs & View Analytics</small>
                    </div>
                    <i class="fas fa-arrow-right ms-auto text-muted"></i>
                </div>

                <div class="role-btn" onclick="quickLogin('officer')">
                    <div class="role-icon"><i class="fas fa-user-tag"></i></div>
                    <div class="role-info">
                        <h6>Field Officer</h6>
                        <small>Create Visits, View Targets</small>
                    </div>
                    <i class="fas fa-arrow-right ms-auto text-muted"></i>
                </div>

                <div class="mt-3 text-center text-muted">
                    <small>Secure Access • Ver 2.1.0</small>
                </div>
            </div>

            <!-- Right Side: Image -->
            <div class="login-right">
                <!-- Background Image set in CSS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="js/db.js"></script>
    
    <script>
        $(document).ready(function() {
            // Auto redirect if logged in
            if(sessionStorage.getItem('egdarma_current_user')) {
                window.location.href = 'index.html';
            }
        });

        function quickLogin(role) {
            const user = DB.getUserByRole(role.charAt(0).toUpperCase() + role.slice(1));
            
            if (user) {
                // Add loading effect to clicked button
                event.currentTarget.style.opacity = '0.7';
                event.currentTarget.innerHTML = '<div class="text-center w-100"><i class="fas fa-spinner fa-spin"></i> Authenticating...</div>';
                
                setTimeout(() => {
                    sessionStorage.setItem('egdarma_current_user', JSON.stringify(user));
                    
                    // Smooth transition
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.5s';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }, 800);
            }
        }
    </script>
</body>
</html>
