<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProMailHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: animate 25s linear infinite;
            bottom: -150px;
        }

        .bg-animation span:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .bg-animation span:nth-child(2) {
            left: 10%;
            width: 20px;
            height: 20px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .bg-animation span:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        .bg-animation span:nth-child(4) {
            left: 40%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .bg-animation span:nth-child(5) {
            left: 65%;
            width: 20px;
            height: 20px;
            animation-delay: 0s;
        }

        .bg-animation span:nth-child(6) {
            left: 75%;
            width: 110px;
            height: 110px;
            animation-delay: 3s;
        }

        .bg-animation span:nth-child(7) {
            left: 35%;
            width: 150px;
            height: 150px;
            animation-delay: 7s;
        }

        .bg-animation span:nth-child(8) {
            left: 50%;
            width: 25px;
            height: 25px;
            animation-delay: 15s;
            animation-duration: 45s;
        }

        .bg-animation span:nth-child(9) {
            left: 20%;
            width: 15px;
            height: 15px;
            animation-delay: 2s;
            animation-duration: 35s;
        }

        .bg-animation span:nth-child(10) {
            left: 85%;
            width: 150px;
            height: 150px;
            animation-delay: 0s;
            animation-duration: 11s;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }

            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 420px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .login-header h1 {
            font-size: 28px;
            color: #333;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .form-control {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .demo-info {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .demo-info p {
            margin: 0;
            color: #555;
            font-size: 13px;
        }

        .demo-info strong {
            color: #667eea;
            font-weight: 600;
        }

        .alert {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            animation: shake 0.5s ease;
        }

        .alert-danger {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .d-none {
            display: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-animation">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">✉</div>
            <h1>ProMailHub</h1>
            <p>Professional Email Management System</p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password"
                        required>
                </div>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="demo-info">
            <p><strong>Demo Accounts:</strong></p>
            <p>Admin: <strong>admin</strong> / <strong>123456</strong></p>
            <p>User: <strong>user</strong> / <strong>123456</strong></p>
        </div>
    </div>

    <script>
        // Database and Session Keys
        const DB_KEY = 'mailApp_data';
        const SESS_KEY = 'mailApp_session';

        // Initialize Demo Data
        const demoData = {
            users: [
                { id: 1, name: 'Admin User', username: 'admin', password: '123456', role: 'admin', email: 'admin@promailhub.com' },
                { id: 2, name: 'Regular User', username: 'user', password: '123456', role: 'user', email: 'user@promailhub.com' },
                { id: 3, name: 'John Smith', username: 'john', password: '123456', role: 'user', email: 'john@promailhub.com' },
                { id: 4, name: 'Sarah Johnson', username: 'sarah', password: '123456', role: 'user', email: 'sarah@promailhub.com' }
            ],
            emails: [
                { id: 1, senderId: 0, senderName: 'Marketing Team', recipient: 'support@promailhub.com', targetUserId: 2, subject: 'Q4 Campaign Results', body: 'The Q4 marketing campaign exceeded expectations with a 35% increase in engagement. Attached are the detailed analytics and recommendations for Q1.', date: '2025-11-20 09:30', folder: 'inbox' },
                { id: 2, senderId: 2, senderName: 'Regular User', recipient: 'client@company.com', subject: 'Project Status Update', body: 'The development phase is 80% complete. We are on track for the December 15th deadline. The testing phase will begin next week.', date: '2025-11-21 14:15', folder: 'sent' },
                { id: 3, senderId: 0, senderName: 'HR Department', recipient: 'support@promailhub.com', targetUserId: 2, subject: 'Benefits Enrollment Reminder', body: 'This is a reminder that the open enrollment period ends on November 30th. Please review and update your benefits selections in the portal.', date: '2025-11-22 10:00', folder: 'inbox' },
                { id: 4, senderId: 3, senderName: 'John Smith', recipient: 'manager@company.com', subject: 'Vacation Request - December', body: 'I would like to request vacation time from December 20-27 for the holidays. I have arranged coverage with the team during my absence.', date: '2025-11-22 16:45', folder: 'sent' },
                { id: 5, senderId: 0, senderName: 'IT Support', recipient: 'support@promailhub.com', targetUserId: 2, subject: 'System Maintenance Notice', body: 'Scheduled system maintenance will occur this Saturday from 2:00 AM to 6:00 AM EST. Email services may be temporarily unavailable during this window.', date: '2025-11-23 11:20', folder: 'inbox' },
                { id: 6, senderId: 2, senderName: 'Regular User', recipient: 'sales@partner.com', subject: 'Partnership Proposal', body: 'Thank you for your interest in partnering with us. I have attached our partnership package and terms. Please let me know if you have any questions.', date: '2025-11-23 15:30', folder: 'sent' },
                { id: 7, senderId: 0, senderName: 'Finance Team', recipient: 'support@promailhub.com', targetUserId: 3, subject: 'Expense Report Approval', body: 'Your expense report #2547 for $1,245.50 has been approved and will be processed in the next payroll cycle.', date: '2025-11-24 09:00', folder: 'inbox' },
                { id: 8, senderId: 4, senderName: 'Sarah Johnson', recipient: 'team@company.com', subject: 'Team Meeting Notes', body: 'Thank you all for attending today meeting. Key decisions: 1) Launch date moved to Jan 15, 2) Budget approved, 3) New designer starts Monday.', date: '2025-11-24 13:00', folder: 'sent' },
                { id: 9, senderId: 0, senderName: 'Customer Support', recipient: 'support@promailhub.com', targetUserId: 2, subject: 'Ticket #8834 Resolved', body: 'Your support ticket regarding login issues has been resolved. Please try accessing your account and let us know if you experience any further problems.', date: '2025-11-25 08:15', folder: 'inbox' },
                { id: 10, senderId: 2, senderName: 'Regular User', recipient: 'vendor@supplier.com', subject: 'Purchase Order #PO-2025-445', body: 'Please find attached purchase order #PO-2025-445 for office supplies. Expected delivery date is December 5th. Thank you for your service.', date: '2025-11-25 10:45', folder: 'sent' }
            ]
        };

        // Initialize database if empty
        if (!localStorage.getItem(DB_KEY)) {
            localStorage.setItem(DB_KEY, JSON.stringify(demoData));
        }

        // Login function
        function login(username, password) {
            const db = JSON.parse(localStorage.getItem(DB_KEY));
            const user = db.users.find(u => u.username === username && u.password === password);

            if (user) {
                sessionStorage.setItem(SESS_KEY, JSON.stringify(user));
                return { success: true };
            }
            return { success: false, message: 'Invalid username or password' };
        }

        // Check if already logged in
        if (sessionStorage.getItem(SESS_KEY)) {
            window.location.href = 'inbox.html';
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const result = login(username, password);
            if (result.success) {
                window.location.href = 'inbox.html';
            } else {
                const alertBox = document.getElementById('alertBox');
                alertBox.textContent = result.message;
                alertBox.classList.remove('d-none');
                setTimeout(() => {
                    alertBox.classList.add('d-none');
                }, 3000);
            }
        });
    </script>
</body>

</html>
