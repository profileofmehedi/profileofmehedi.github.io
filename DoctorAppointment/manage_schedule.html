<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- Head content same as doctor_dashboard.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সময়সূচী পরিচালনা</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/maten-it/kalpurush-font/kalpurush.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Common styles from doctor_dashboard.html */
        :root { --primary-color: #1977CC; --dark-color: #343a40; --sidebar-width: 280px; }
        body { font-family: 'Kalpurush', sans-serif; background-color: #f8f9fa; }
        .sidebar { width: var(--sidebar-width); height: 100vh; background-color: var(--dark-color); color: white; position: fixed; top: 0; left: 0; padding-top: 20px; }
        .sidebar .nav-link { color: #adb5bd; font-size: 1.1em; padding: 12px 20px; display: flex; align-items: center; }
        .sidebar .nav-link i { margin-right: 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background-color: var(--primary-color); border-radius: 5px; }
        .main-content { margin-left: var(--sidebar-width); padding: 20px; }
        .day-schedule { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <!-- Sidebar navigation -->
        <h4 class="px-3 text-center mb-4">ডাক্তার প্যানেল</h4>
        <ul class="nav flex-column px-3">
            <li class="nav-item mb-2"><a class="nav-link" href="doctor_dashboard.html"><i class="bi bi-columns-gap"></i>ড্যাশবোর্ড</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="manage_appointments.html"><i class="bi bi-calendar-check"></i>অ্যাপয়েন্টমেন্ট</a></li>
            <li class="nav-item mb-2"><a class="nav-link active" href="manage_schedule.html"><i class="bi bi-clock-history"></i>সময়সূচী</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="add_patient.html"><i class="bi bi-person-plus"></i>নতুন রোগী যোগ</a></li>
            <!-- ... other links -->
             <li class="nav-item mt-4"><a class="nav-link" href="index.html"><i class="bi bi-box-arrow-left"></i>লগআউট</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <h1 class="h2 pb-2 mb-3 border-bottom">সাপ্তাহিক সময়সূচী</h1>
        <div class="bg-white p-4 rounded shadow-sm">
            <form>
                <!-- Saturday -->
                <div class="day-schedule row align-items-center">
                    <h5 class="col-md-2">শনিবার</h5>
                    <div class="col-md-3"><input type="time" class="form-control" value="10:00"></div>
                    <div class="col-md-3"><input type="time" class="form-control" value="18:00"></div>
                    <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="satOff"><label class="form-check-label" for="satOff">ছুটি</label></div></div>
                </div>
                <!-- Sunday -->
                <div class="day-schedule row align-items-center">
                    <h5 class="col-md-2">রবিবার</h5>
                    <div class="col-md-3"><input type="time" class="form-control" value="10:00"></div>
                    <div class="col-md-3"><input type="time" class="form-control" value="18:00"></div>
                    <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="sunOff"><label class="form-check-label" for="sunOff">ছুটি</label></div></div>
                </div>
                <!-- Friday -->
                 <div class="day-schedule row align-items-center">
                    <h5 class="col-md-2">শুক্রবার</h5>
                    <div class="col-md-3"><input type="time" class="form-control" disabled></div>
                    <div class="col-md-3"><input type="time" class="form-control" disabled></div>
                    <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="friOff" checked><label class="form-check-label" for="friOff">ছুটি</label></div></div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">সময়সূচী সংরক্ষণ করুন</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
