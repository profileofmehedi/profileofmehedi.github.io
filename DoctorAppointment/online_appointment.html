<!DOCTYPE html>
<html lang="bn">
  <head>
    <!-- Head content same as doctor_dashboard.html -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>অনলাইন কনসালটেশন</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/maten-it/kalpurush-font/kalpurush.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        font-family: "Kalpurush", sans-serif;
        background-color: #212529;
        color: white;
      }
      .video-main-container {
        display: flex;
        height: 100vh;
      }
      .video-area {
        flex-grow: 1;
        display: grid;
        grid-template-rows: 1fr auto;
        padding: 15px;
        position: relative;
      }
      .video-grid {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .main-video {
        background-color: #000;
        flex-grow: 1;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .self-video {
        background-color: #333;
        width: 250px;
        height: 180px;
        position: absolute;
        bottom: 90px;
        right: 30px;
        border: 2px solid white;
        border-radius: 10px;
      }
      .video-controls {
        text-align: center;
        padding: 15px;
        background-color: #343a40;
      }
      .video-controls .btn {
        border-radius: 50%;
        width: 50px;
        height: 50px;
      }
      .info-panel {
        width: 350px;
        background-color: #343a40;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="video-main-container">
      <div class="video-area">
        <div class="video-grid">
          <div class="main-video">
            <div class="text-center">
              <i class="bi bi-person-video" style="font-size: 8rem"></i>
              <h4>রোগী: করিম চৌধুরী</h4>
            </div>
            <div class="self-video">
              <div class="text-center pt-5">
                <i class="bi bi-person-fill" style="font-size: 3rem"></i>
                <h6>আপনি</h6>
              </div>
            </div>
          </div>
        </div>
        <div class="video-controls">
          <button class="btn btn-light mx-2">
            <i class="bi bi-mic-mute-fill"></i>
          </button>
          <button class="btn btn-light mx-2">
            <i class="bi bi-camera-video-off-fill"></i>
          </button>
          <a href="doctor_dashboard.html" class="btn btn-danger mx-2"
            ><i class="bi bi-telephone-x-fill"></i
          ></a>
        </div>
      </div>
      <div class="info-panel">
        <h5>রোগীর তথ্য</h5>
        <hr />
        <p><strong>নাম:</strong> করিম চৌধুরী</p>
        <p><strong>বয়স:</strong> ৩৫</p>
        <p><strong>প্রধান সমস্যা:</strong> বুকে ব্যথা</p>
        <hr />
        <a href="create_prescription.html" class="btn btn-primary w-100"
          >প্রেসক্রিপশন তৈরি করুন</a
        >
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
