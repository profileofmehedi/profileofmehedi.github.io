<!DOCTYPE html>
<html lang="bn">
  <head>
    <!-- Head content same as patient_dashboard.html -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>রোগীর প্রোফাইল</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/maten-it/kalpurush-font/kalpurush.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      /* Common styles from patient_dashboard.html */
      :root {
        --primary-color: #1977cc;
        --dark-color: #343a40;
        --sidebar-width: 280px;
      }
      body {
        font-family: "Kalpurush", sans-serif;
        background-color: #f8f9fa;
      }
      .sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        background-color: var(--dark-color);
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 20px;
      }
      .sidebar .nav-link {
        color: #adb5bd;
        font-size: 1.1em;
        padding: 12px 20px;
        display: flex;
        align-items: center;
      }
      .sidebar .nav-link i {
        margin-right: 15px;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: white;
        background-color: var(--primary-color);
        border-radius: 5px;
      }
      .main-content {
        margin-left: var(--sidebar-width);
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <!-- Sidebar navigation -->
      <h4 class="px-3 text-center mb-4">রোগী প্যানেল</h4>
      <ul class="nav flex-column px-3">
        <li class="nav-item mb-2">
          <a class="nav-link" href="patient_dashboard.html"
            ><i class="bi bi-columns-gap"></i>ড্যাশবোর্ড</a
          >
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="book_appointment.html"
            ><i class="bi bi-calendar-plus"></i>অ্যাপয়েন্টমেন্ট বুক করুন</a
          >
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="view_prescriptions_patient.html"
            ><i class="bi bi-journal-medical"></i>আমার প্রেসক্রিপশন</a
          >
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link active" href="patient_profile.html"
            ><i class="bi bi-person-circle"></i>প্রোফাইল</a
          >
        </li>
        <li class="nav-item mt-4">
          <a class="nav-link" href="index.html"
            ><i class="bi bi-box-arrow-left"></i>লগআউট</a
          >
        </li>
      </ul>
    </nav>
    <main class="main-content">
      <h1 class="h2 pb-2 mb-3 border-bottom">আপনার প্রোফাইল তথ্য</h1>
      <div class="bg-white p-4 rounded shadow-sm">
        <form>
          <div class="mb-3">
            <label for="patientName" class="form-label">নাম</label>
            <input
              type="text"
              class="form-control"
              id="patientName"
              value="করিম চৌধুরী"
            />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="patientAge" class="form-label">বয়স</label>
              <input
                type="number"
                class="form-control"
                id="patientAge"
                value="৩৫"
              />
            </div>
            <div class="col-md-6 mb-3">
              <label for="patientGender" class="form-label">লিঙ্গ</label>
              <select class="form-select" id="patientGender">
                <option selected>পুরুষ</option>
                <option>মহিলা</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="patientPhone" class="form-label">ফোন নম্বর</label>
            <input
              type="tel"
              class="form-control"
              id="patientPhone"
              value="01xxxxxxxxx"
            />
          </div>
          <button type="submit" class="btn btn-primary">
            প্রোফাইল আপডেট করুন
          </button>
        </form>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
