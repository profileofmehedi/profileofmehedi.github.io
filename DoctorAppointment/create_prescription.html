<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>প্রেসক্রিপশন তৈরি</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/maten-it/kalpurush-font/kalpurush.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        --primary-color: #1977cc;
        --dark-color: #343a40;
        --sidebar-width: 280px;
      }
      body {
        font-family: "Kalpurush", sans-serif;
        background-color: #f8f9fa;
      }
      .sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        background-color: var(--dark-color);
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        padding-top: 20px;
      }
      .sidebar .nav-link {
        color: #adb5bd;
        font-size: 1.1em;
        padding: 12px 20px;
        display: flex;
        align-items: center;
      }
      .sidebar .nav-link i {
        margin-right: 15px;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: white;
        background-color: var(--primary-color);
        border-radius: 5px;
      }
      .main-content {
        margin-left: var(--sidebar-width);
        padding: 20px;
      }

      /* Prescription Preview Modal & Content Styles */
      #prescriptionPreviewContainer {
        position: relative;
        width: 800px; /* A4 aspect ratio approximation */
        height: 1131px;
        background-image: url("prescription.png");
        background-size: 100% 100%;
        background-repeat: no-repeat;
        margin: 0 auto;
        color: black;
        font-size: 16px;
      }

      /* Placeholder divs for dynamic content, positioned absolutely */
      .preview-data {
        position: absolute;
        padding: 2px;
        white-space: pre-wrap; /* To respect new lines from textarea */
        line-height: 1.7; /* Increased line height for better spacing */
        font-weight: 500;
      }

      /* --- CORRECTED POSITIONS --- */
      #previewPatientName {
        top: 152px;
        left: 120px;
        width: 350px;
      }
      #previewPatientAge {
        top: 152px;
        left: 550px;
        width: 100px;
      }
      #previewPatientDate {
        top: 152px;
        left: 680px;
        width: 150px;
      }

      #previewCC {
        top: 215px;
        left: 35px;
        width: 260px;
        height: 240px;
      }
      #previewOE {
        top: 485px;
        left: 35px;
        width: 260px;
        height: 230px;
      }
      #previewInv {
        top: 755px;
        left: 35px;
        width: 260px;
        height: 240px;
      }

      #previewRx {
        top: 215px;
        left: 350px;
        width: 420px;
        height: 800px;
      }
      #previewRx p {
        margin-bottom: 14px;
      } /* Space between medicines */
      /* --- END OF CORRECTIONS --- */

      /* Print Specific Styles */
      @media print {
        body * {
          visibility: hidden;
        }
        .modal-backdrop {
          display: none !important;
        }
        #prescriptionPreviewContainer,
        #prescriptionPreviewContainer * {
          visibility: visible;
        }
        #prescriptionModal .modal-dialog {
          max-width: 100% !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        #prescriptionModal .modal-content {
          border: none !important;
          box-shadow: none !important;
          border-radius: 0 !important;
        }
        #prescriptionPreviewContainer {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100vh; /* Adjust height for printing */
          -webkit-print-color-adjust: exact; /* Chrome, Safari */
          print-color-adjust: exact; /* Firefox */
        }
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <!-- Sidebar Navigation -->
      <h4 class="px-3 text-center mb-4">ডাক্তার প্যানেল</h4>
      <ul class="nav flex-column px-3">
        <li class="nav-item mb-2">
          <a class="nav-link" href="doctor_dashboard.html"
            ><i class="bi bi-columns-gap"></i>ড্যাশবোর্ড</a
          >
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="manage_appointments.html"
            ><i class="bi bi-calendar-check"></i>অ্যাপয়েন্টমেন্ট</a
          >
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link active" href="create_prescription.html"
            ><i class="bi bi-file-earmark-medical"></i>প্রেসক্রিপশন তৈরি</a
          >
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="view_prescriptions_doctor.html"
            ><i class="bi bi-journal-medical"></i>সংরক্ষিত প্রেসক্রিপশন</a
          >
        </li>
        <li class="nav-item mt-4">
          <a class="nav-link" href="index.html"
            ><i class="bi bi-box-arrow-left"></i>লগআউট</a
          >
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <!-- Prescription Form -->
      <h1 class="h2 pb-2 mb-3 border-bottom">প্রেসক্রিপশন তৈরি করুন</h1>
      <form id="prescriptionForm" class="bg-white p-4 rounded shadow-sm">
        <div class="row">
          <div class="col-md-8">
            <fieldset>
              <legend class="h5">রোগীর তথ্য</legend>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="patientName" class="form-label">রোগীর নাম</label
                  ><input
                    type="text"
                    class="form-control"
                    id="patientName"
                    value="করিম চৌধুরী"
                    required
                  />
                </div>
                <div class="col-md-3 mb-3">
                  <label for="patientAge" class="form-label">বয়স</label
                  ><input
                    type="number"
                    class="form-control"
                    id="patientAge"
                    value="৩৫"
                    required
                  />
                </div>
                <div class="col-md-3 mb-3">
                  <label for="prescriptionDate" class="form-label">তারিখ</label
                  ><input
                    type="date"
                    class="form-control"
                    id="prescriptionDate"
                    value="2025-08-26"
                    required
                  />
                </div>
              </div>
            </fieldset>
            <fieldset class="mt-3">
              <legend class="h5">ক্লিনিক্যাল তথ্য</legend>
              <div class="mb-3">
                <label for="chiefComplaint" class="form-label"
                  >Chief Complaints:</label
                ><textarea class="form-control" id="chiefComplaint" rows="4">
Fever for 3 days.
Headache.
Sore throat.</textarea
                >
              </div>
              <div class="mb-3">
                <label for="onExamination" class="form-label"
                  >On Examination:</label
                ><textarea class="form-control" id="onExamination" rows="4">
Temperature: 101°F
Throat: Red & Inflamed</textarea
                >
              </div>
              <div class="mb-3">
                <label for="investigation" class="form-label"
                  >Investigation:</label
                ><textarea class="form-control" id="investigation" rows="4">
CBC - Np-75%, L-20%
Dengue NS1 Antigen - Negative</textarea
                >
              </div>
            </fieldset>
          </div>
          <div class="col-md-4">
            <fieldset>
              <legend class="h5">ওষুধের তালিকা (Rx)</legend>
              <div id="medicines-container">
                <div class="medicine-row mb-2 border p-2 rounded">
                  <input
                    type="text"
                    class="form-control mb-1"
                    name="med_name"
                    placeholder="ওষুধের নাম"
                    value="Tab. Napa Extend"
                  />
                  <input
                    type="text"
                    class="form-control mb-1"
                    name="med_dosage"
                    placeholder="মাত্রা"
                    value="1+1+1"
                  />
                  <input
                    type="text"
                    class="form-control"
                    name="med_duration"
                    placeholder="সময়কাল"
                    value="5 days"
                  />
                  <button
                    type="button"
                    class="btn btn-sm btn-danger remove-medicine mt-1"
                  >
                    মুছুন
                  </button>
                </div>
                <div class="medicine-row mb-2 border p-2 rounded">
                  <input
                    type="text"
                    class="form-control mb-1"
                    name="med_name"
                    placeholder="ওষুধের নাম"
                    value="Tab. Fexo 120mg"
                  />
                  <input
                    type="text"
                    class="form-control mb-1"
                    name="med_dosage"
                    placeholder="মাত্রা"
                    value="0+0+1"
                  />
                  <input
                    type="text"
                    class="form-control"
                    name="med_duration"
                    placeholder="সময়কাল"
                    value="7 days"
                  />
                  <button
                    type="button"
                    class="btn btn-sm btn-danger remove-medicine mt-1"
                  >
                    মুছুন
                  </button>
                </div>
              </div>
              <button
                type="button"
                id="addMedicineBtn"
                class="btn btn-sm btn-secondary mt-2"
              >
                <i class="bi bi-plus-circle"></i> আরও ওষুধ
              </button>
            </fieldset>
          </div>
        </div>
        <div class="mt-4">
          <button type="button" id="previewBtn" class="btn btn-primary">
            প্রেসক্রিপশন প্রিভিউ ও প্রিন্ট
          </button>
        </div>
      </form>
    </main>

    <!-- Prescription Preview Modal -->
    <div class="modal fade" id="prescriptionModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">প্রেসক্রিপশন প্রিভিউ</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-0">
            <div id="prescriptionPreviewContainer">
              <div id="previewPatientName" class="preview-data"></div>
              <div id="previewPatientAge" class="preview-data"></div>
              <div id="previewPatientDate" class="preview-data"></div>
              <div id="previewCC" class="preview-data"></div>
              <div id="previewOE" class="preview-data"></div>
              <div id="previewInv" class="preview-data"></div>
              <div id="previewRx" class="preview-data"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              বন্ধ করুন
            </button>
            <button type="button" id="printBtn" class="btn btn-primary">
              <i class="bi bi-printer"></i> প্রিন্ট করুন
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // JavaScript for adding/removing medicines and populating preview (remains unchanged)
        const addMedicineBtn = document.getElementById("addMedicineBtn");
        const medicinesContainer = document.getElementById(
          "medicines-container"
        );

        addMedicineBtn.addEventListener("click", function () {
          const newRow = document.createElement("div");
          newRow.className = "medicine-row mb-2 border p-2 rounded";
          newRow.innerHTML = `
                    <input type="text" class="form-control mb-1" name="med_name" placeholder="ওষুধের নাম">
                    <input type="text" class="form-control mb-1" name="med_dosage" placeholder="মাত্রা">
                    <input type="text" class="form-control" name="med_duration" placeholder="সময়কাল">
                    <button type="button" class="btn btn-sm btn-danger remove-medicine mt-1">মুছুন</button>
                `;
          medicinesContainer.appendChild(newRow);
        });

        medicinesContainer.addEventListener("click", function (e) {
          if (e.target && e.target.classList.contains("remove-medicine")) {
            e.target.closest(".medicine-row").remove();
          }
        });

        const previewModal = new bootstrap.Modal(
          document.getElementById("prescriptionModal")
        );
        document
          .getElementById("previewBtn")
          .addEventListener("click", function () {
            document.getElementById("previewPatientName").textContent =
              document.getElementById("patientName").value;
            document.getElementById("previewPatientAge").textContent =
              document.getElementById("patientAge").value;
            document.getElementById("previewPatientDate").textContent =
              document.getElementById("prescriptionDate").value;

            document.getElementById("previewCC").textContent =
              document.getElementById("chiefComplaint").value;
            document.getElementById("previewOE").textContent =
              document.getElementById("onExamination").value;
            document.getElementById("previewInv").textContent =
              document.getElementById("investigation").value;

            const medicinePreviewContainer =
              document.getElementById("previewRx");
            medicinePreviewContainer.innerHTML = "";
            const medicineRows = document.querySelectorAll(".medicine-row");
            medicineRows.forEach((row, index) => {
              const name = row.querySelector('[name="med_name"]').value;
              const dosage = row.querySelector('[name="med_dosage"]').value;
              const duration = row.querySelector('[name="med_duration"]').value;
              if (name) {
                const p = document.createElement("p");
                p.innerHTML = `<strong>${
                  index + 1
                }. ${name}</strong><br>&nbsp;&nbsp;&nbsp;&nbsp;${dosage} --- ${duration}`;
                medicinePreviewContainer.appendChild(p);
              }
            });
            previewModal.show();
          });

        document
          .getElementById("printBtn")
          .addEventListener("click", function () {
            window.print();
          });
      });
    </script>
  </body>
</html>
