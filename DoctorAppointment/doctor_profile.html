<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- Head content same as doctor_dashboard.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডাক্তারের প্রোফাইল</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/maten-it/kalpurush-font/kalpurush.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Common styles from doctor_dashboard.html */
        :root { --primary-color: #1977CC; --dark-color: #343a40; --sidebar-width: 280px; }
        body { font-family: 'Kalpurush', sans-serif; background-color: #f8f9fa; }
        .sidebar { width: var(--sidebar-width); height: 100vh; background-color: var(--dark-color); color: white; position: fixed; top: 0; left: 0; padding-top: 20px; }
        .sidebar .nav-link { color: #adb5bd; font-size: 1.1em; padding: 12px 20px; display: flex; align-items: center; }
        .sidebar .nav-link i { margin-right: 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background-color: var(--primary-color); border-radius: 5px; }
        .main-content { margin-left: var(--sidebar-width); padding: 20px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <!-- Sidebar navigation -->
        <h4 class="px-3 text-center mb-4">ডাক্তার প্যানেল</h4>
        <ul class="nav flex-column px-3">
            <li class="nav-item mb-2"><a class="nav-link" href="doctor_dashboard.html"><i class="bi bi-columns-gap"></i>ড্যাশবোর্ড</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="manage_appointments.html"><i class="bi bi-calendar-check"></i>অ্যাপয়েন্টমেন্ট</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="manage_schedule.html"><i class="bi bi-clock-history"></i>সময়সূচী</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="add_patient.html"><i class="bi bi-person-plus"></i>নতুন রোগী যোগ</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="create_prescription.html"><i class="bi bi-file-earmark-medical"></i>প্রেসক্রিপশন তৈরি</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="view_prescriptions_doctor.html"><i class="bi bi-journal-medical"></i>সংরক্ষিত প্রেসক্রিপশন</a></li>
            <li class="nav-item mb-2"><a class="nav-link" href="online_appointment.html"><i class="bi bi-camera-video"></i>অনলাইন অ্যাপয়েন্টমেন্ট</a></li>
            <li class="nav-item mb-2"><a class="nav-link active" href="doctor_profile.html"><i class="bi bi-person-circle"></i>প্রোফাইল</a></li>
            <li class="nav-item mt-4"><a class="nav-link" href="index.html"><i class="bi bi-box-arrow-left"></i>লগআউট</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h1 class="h2 pb-2 mb-3 border-bottom">প্রোফাইল তথ্য</h1>
        <div class="bg-white p-4 rounded shadow-sm">
            <form>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="doctorName" class="form-label">নাম</label>
                        <input type="text" class="form-control" id="doctorName" value="ডঃ আহমেদ">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="doctorSpecialty" class="form-label">বিশেষত্ব</label>
                        <input type="text" class="form-control" id="doctorSpecialty" value="কার্ডিওলজিস্ট">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="doctorDegree" class="form-label">ডিগ্রী</label>
                    <input type="text" class="form-control" id="doctorDegree" value="MBBS, FCPS (Cardiology)">
                </div>
                <div class="mb-3">
                    <label for="doctorChamber" class="form-label">চেম্বারের ঠিকানা</label>
                    <textarea class="form-control" id="doctorChamber" rows="3">হেলথকেয়ার হসপিটাল, ১২৩/এ, ধানমন্ডি, ঢাকা।</textarea>
                </div>
                <button type="submit" class="btn btn-primary">তথ্য আপডেট করুন</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
