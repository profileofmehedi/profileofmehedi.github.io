<!-- MODALS -->

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg overflow-hidden">
      <div class="modal-header bg-primary text-white border-0">
        <h5 class="modal-title fw-bold">Welcome Back</h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body p-4">
        <div class="alert alert-light border small mb-3">
          <i class="fa-solid fa-circle-info text-primary"></i>
          <strong>Demo Credentials:</strong><br />
          Admin: <code>admin</code> / <code>123456</code><br />
          User: <code>user</code> / <code>123456</code>
        </div>
        <form id="loginForm">
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              id="loginUser"
              placeholder="Username"
              required
            />
            <label>Username</label>
          </div>
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="loginPass"
              placeholder="Password"
              required
            />
            <label>Password</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- PIN Modal -->
<div class="modal fade" id="pinModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-body text-center p-4">
        <div class="mb-3">
          <i class="fa-solid fa-shield-halved text-primary fs-1"></i>
        </div>
        <h5 class="fw-bold mb-2" data-i18n="securityPin">Security Check</h5>
        <p class="small text-muted mb-3" data-i18n="pinPrompt">
          Enter PIN 1234 to reveal contact
        </p>
        <input
          type="password"
          class="form-control text-center fs-4 letter-spacing-2 mb-3 bg-light"
          id="inputPin"
          maxlength="4"
          placeholder="****"
        />
        <button
          class="btn btn-dark w-100 rounded-pill"
          onclick="app.logic.verifyPin()"
        >
          Reveal Number
        </button>
        <div
          id="pinError"
          class="text-danger small mt-2 d-none fw-bold animate__animated animate__shakeX"
        >
          Incorrect PIN
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Message Modal -->
<div class="modal fade" id="msgModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Send Message</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label fw-bold">Your Name</label>
          <input type="text" class="form-control" id="msgName" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Message</label>
          <textarea
            class="form-control"
            id="msgBody"
            rows="4"
            placeholder="I am interested in this property..."
          ></textarea>
        </div>
        <button
          class="btn btn-primary w-100 fw-bold"
          onclick="app.logic.sendMessage()"
        >
          <i class="fa-regular fa-paper-plane"></i> Send Message
        </button>
      </div>
    </div>
  </div>
</div>
