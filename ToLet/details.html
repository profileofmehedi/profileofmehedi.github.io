<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Details - ToLet BD</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="lang-en">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glass-nav transition-all">
      <div class="container">
        <a class="navbar-brand fw-bold text-gradient" href="index.html">
          <i class="fa-solid fa-building-user"></i>
          <span data-i18n="brand">ToLet BD</span>
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center gap-3">
            <li class="nav-item">
              <div class="lang-toggle" onclick="app.events.toggleLang()">
                <span id="langLabel">EN</span>
              </div>
            </li>

            <li class="nav-item guest-only">
              <button
                class="btn btn-outline-primary rounded-pill px-4"
                onclick="showLoginModal()"
              >
                Login
              </button>
            </li>

            <li class="nav-item auth-only d-none">
              <a class="nav-link fw-bold" href="dashboard-user.html">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
              </a>
            </li>
            <li class="nav-item auth-only d-none dropdown">
              <a
                class="nav-link dropdown-toggle d-flex align-items-center gap-2"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
              >
                <img
                  src="https://ui-avatars.com/api/?name=User&background=random"
                  id="navAvatar"
                  class="rounded-circle"
                  width="30"
                />
                <span id="navUsername" class="fw-bold">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                <li>
                  <span class="dropdown-item-text text-muted small" id="navRole"
                    >Role</span
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <button
                    class="dropdown-item text-danger"
                    onclick="app.auth.logout()"
                  >
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                  </button>
                </li>
              </ul>
            </li>

            <li class="nav-item">
              <a
                class="btn btn-gradient rounded-pill px-4 shadow-sm hover-lift"
                href="index.html"
              >
                <i class="fa-solid fa-home"></i> Home
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Details Content -->
    <div class="container pt-5 mt-5 pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a
          href="index.html"
          class="btn btn-outline-secondary rounded-pill px-3"
        >
          <i class="fa-solid fa-arrow-left"></i> Back
        </a>
      </div>

      <div id="detail-content" class="animate__animated animate__fadeIn">
        <!-- Content injected via JS -->
      </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg overflow-hidden">
          <div class="modal-header bg-primary text-white border-0">
            <h5 class="modal-title fw-bold">Welcome Back</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4">
            <div class="alert alert-light border small mb-3">
              <i class="fa-solid fa-circle-info text-primary"></i>
              <strong>Demo Credentials:</strong><br />
              Admin: <code>admin</code> / <code>123456</code><br />
              User: <code>user</code> / <code>123456</code>
            </div>
            <form id="loginForm">
              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="loginUser"
                  placeholder="Username"
                  required
                />
                <label>Username</label>
              </div>
              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  id="loginPass"
                  placeholder="Password"
                  required
                />
                <label>Password</label>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                Login
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- PIN Modal -->
    <div class="modal fade" id="pinModal" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-body text-center p-4">
            <div class="mb-3">
              <i class="fa-solid fa-shield-halved text-primary fs-1"></i>
            </div>
            <h5 class="fw-bold mb-2">Security Check</h5>
            <p class="small text-muted mb-3">
              Enter PIN 1234 to reveal contact
            </p>
            <input
              type="password"
              class="form-control text-center fs-4 mb-3 bg-light"
              id="inputPin"
              maxlength="4"
              placeholder="****"
            />
            <button
              class="btn btn-dark w-100 rounded-pill"
              onclick="app.logic.verifyPin()"
            >
              Reveal Number
            </button>
            <div id="pinError" class="text-danger small mt-2 d-none fw-bold">
              Incorrect PIN
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="msgModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold">Send Message</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label fw-bold">Message</label>
              <textarea
                class="form-control"
                id="msgBody"
                rows="4"
                placeholder="I am interested in this property..."
              ></textarea>
            </div>
            <button
              class="btn btn-primary w-100 fw-bold"
              onclick="app.logic.sendMessage()"
            >
              <i class="fa-regular fa-paper-plane"></i> Send Message
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="toast-container"
      class="position-fixed top-0 end-0 p-3"
      style="z-index: 2000"
    ></div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
      function showLoginModal() {
        const modal = new bootstrap.Modal(
          document.getElementById("loginModal")
        );
        modal.show();
      }

      $(document).ready(function () {
        app.init();

        // Get property ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const postId = parseInt(urlParams.get("id"));

        if (postId) {
          app.state.activePostId = postId;
          app.logic.renderDetails(postId);
        } else {
          $("#detail-content").html(
            '<div class="alert alert-danger">Property not found</div>'
          );
        }
      });
    </script>
  </body>
</html>
