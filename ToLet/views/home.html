<!-- VIEW: HOME -->
<div id="home-view" class="view-section active pt-5">
  <!-- Hero -->
  <div class="hero-wrapper">
    <div class="container text-center text-white py-5 mt-5">
      <h1
        class="display-3 fw-bold animate__animated animate__fadeInDown"
        data-i18n="heroTitle"
      >
        Find Your Next Sanctuary
      </h1>
      <p
        class="lead animate__animated animate__fadeInUp animate__delay-1s"
        data-i18n="heroSubtitle"
      >
        Thousands of apartments, rooms, and commercial spaces at your
        fingertips.
      </p>

      <!-- Search Box -->
      <div
        class="search-container shadow-lg animate__animated animate__fadeInUp animate__delay-1s"
      >
        <div class="row g-2 align-items-center">
          <div class="col-md-3">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"
                ><i class="fa-solid fa-house"></i
              ></span>
              <select class="form-select border-start-0" id="searchCategory">
                <option value="all" data-i18n="optAll">All Types</option>
                <option value="Family" data-i18n="optFamily">
                  Family House
                </option>
                <option value="Bachelor" data-i18n="optBachelor">
                  Bachelor Mess
                </option>
                <option value="Flat" data-i18n="optFlat">Flat/Apartment</option>
                <option value="Sublet" data-i18n="optSublet">Sublet</option>
                <option value="Office" data-i18n="optOffice">
                  Office Space
                </option>
              </select>
            </div>
          </div>
          <div class="col-md-3">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"
                ><i class="fa-solid fa-map-pin"></i
              ></span>
              <select class="form-select border-start-0" id="searchCity">
                <option value="all">All Cities</option>
                <option value="Dhaka">Dhaka</option>
                <option value="Chittagong">Chittagong</option>
                <option value="Sylhet">Sylhet</option>
                <option value="Rajshahi">Rajshahi</option>
              </select>
            </div>
          </div>
          <div class="col-md-4">
            <input
              type="text"
              class="form-control"
              id="searchKeyword"
              placeholder="Search area (e.g. Dhanmondi)..."
            />
          </div>
          <div class="col-md-2">
            <button
              class="btn btn-primary w-100 fw-bold"
              onclick="app.logic.filterPosts()"
              data-i18n="btnSearch"
            >
              SEARCH
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Wave Shape -->
    <div class="wave-shape">
      <svg viewBox="0 0 1440 320">
        <path
          fill="#f8f9fa"
          fill-opacity="1"
          d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,261.3C960,256,1056,224,1152,197.3C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"
        ></path>
      </svg>
    </div>
  </div>

  <!-- Listings -->
  <div class="container pb-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <h6 class="text-primary fw-bold text-uppercase ls-2">Properties</h6>
        <h2 class="fw-bold text-dark" data-i18n="latestListings">
          Latest Opportunities
        </h2>
      </div>
    </div>

    <div class="row g-4" id="posts-container">
      <!-- Posts Injected Here -->
    </div>
  </div>
</div>
