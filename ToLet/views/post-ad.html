<!-- VIEW: POST AD FORM -->
<div id="post-ad-view" class="view-section pt-5 mt-5">
  <div class="container pb-5">
    <button
      class="btn btn-light text-primary fw-bold mb-3 shadow-sm"
      onclick="app.views.showHome()"
    >
      <i class="fa-solid fa-arrow-left"></i>
      <span data-i18n="backHome">Back</span>
    </button>

    <div class="row justify-content-center">
      <div class="col-xl-9">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-header bg-primary text-white p-4">
            <h3 class="fw-bold mb-0" data-i18n="postAdTitle">
              List Your Property
            </h3>
            <p class="mb-0 opacity-75">
              Fill in the details to attract the best tenants.
            </p>
          </div>
          <div class="card-body p-5">
            <form id="rentalForm">
              <!-- Section 1 -->
              <h5 class="text-primary fw-bold mb-4 border-bottom pb-2">
                1. Property Overview
              </h5>
              <div class="row g-3 mb-4">
                <div class="col-md-12">
                  <label class="form-label fw-bold" data-i18n="lblTitle"
                    >Ad Title</label
                  >
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="pTitle"
                    required
                    placeholder="e.g. Luxurious 3 Bedroom Flat in Gulshan"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold" data-i18n="lblType"
                    >Category</label
                  >
                  <select class="form-select" id="pType">
                    <option value="Family">Family House</option>
                    <option value="Bachelor">Bachelor Mess</option>
                    <option value="Flat">Flat/Apartment</option>
                    <option value="Sublet">Sublet</option>
                    <option value="Office">Office Space</option>
                    <option value="Shop">Shop/Showroom</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold" data-i18n="lblRent"
                    >Monthly Rent (BDT)</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="pRent"
                    required
                    placeholder="25000"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Available From</label>
                  <input type="date" class="form-control" id="pDate" />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">City</label>
                  <select class="form-select" id="pCity">
                    <option value="Dhaka">Dhaka</option>
                    <option value="Chittagong">Chittagong</option>
                    <option value="Sylhet">Sylhet</option>
                    <option value="Rajshahi">Rajshahi</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Area/Thana</label>
                  <input
                    type="text"
                    class="form-control"
                    id="pArea"
                    required
                    placeholder="e.g. Uttara"
                  />
                </div>
                <div class="col-12">
                  <label class="form-label fw-bold">Full Address</label>
                  <input
                    type="text"
                    class="form-control"
                    id="pAddress"
                    placeholder="House #, Road #, Sector #"
                  />
                </div>
              </div>

              <!-- Section 2 -->
              <h5 class="text-primary fw-bold mb-4 border-bottom pb-2">
                2. Details & Amenities
              </h5>
              <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                  <label class="form-label">Bedrooms</label>
                  <input
                    type="number"
                    class="form-control"
                    id="pBed"
                    value="0"
                  />
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label">Bathrooms</label>
                  <input
                    type="number"
                    class="form-control"
                    id="pBath"
                    value="0"
                  />
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label">Floor No</label>
                  <input
                    type="number"
                    class="form-control"
                    id="pFloor"
                    placeholder="e.g. 5"
                  />
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label">Size (Sq Ft)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="pSize"
                    placeholder="1200"
                  />
                </div>

                <div class="col-12 mt-3">
                  <label class="form-label fw-bold mb-2"
                    >Amenities Included</label
                  >
                  <div class="row g-2" id="amenitiesCheckboxes">
                    <!-- Generated via JS -->
                  </div>
                </div>

                <div class="col-12 mt-3">
                  <label class="form-label fw-bold" data-i18n="lblDesc"
                    >Description</label
                  >
                  <textarea
                    class="form-control"
                    id="pDesc"
                    rows="5"
                    placeholder="Write a detailed description..."
                  ></textarea>
                </div>
              </div>

              <!-- Section 3 -->
              <h5 class="text-primary fw-bold mb-4 border-bottom pb-2">
                3. Media & Contact
              </h5>
              <div class="mb-4">
                <label class="form-label fw-bold">Photos (Max 3)</label>
                <div
                  class="image-upload-wrap p-4 border rounded text-center bg-light"
                >
                  <i
                    class="fa-solid fa-cloud-arrow-up fs-1 text-primary mb-2"
                  ></i>
                  <input
                    type="file"
                    class="form-control"
                    id="pImages"
                    accept="image/*"
                    multiple
                  />
                  <small class="text-muted"
                    >High quality images increase views.</small
                  >
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold"
                  >Contact Number (Hidden by PIN)</label
                >
                <input
                  type="tel"
                  class="form-control form-control-lg"
                  id="pContact"
                  required
                  placeholder="017xxxxxxxx"
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 py-3 fw-bold rounded-3 fs-5 shadow hover-lift"
                data-i18n="btnSubmit"
              >
                PUBLISH AD
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
