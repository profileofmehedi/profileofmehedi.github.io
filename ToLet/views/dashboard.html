<!-- VIEW: DASHBOARD -->
<div id="dashboard-view" class="view-section pt-5 mt-5">
  <div class="container">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-lg-3 mb-4">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body text-center py-4">
            <img
              src="https://ui-avatars.com/api/?name=User"
              id="dashAvatar"
              class="rounded-circle mb-3 shadow"
              width="80"
            />
            <h5 class="fw-bold mb-0" id="dashName">User Name</h5>
            <span class="badge bg-primary rounded-pill mb-3" id="dashRole"
              >User</span
            >
            <div class="d-grid gap-2">
              <button
                class="btn btn-outline-primary active"
                id="btn-tab-ads"
                onclick="app.views.switchDashTab('ads')"
              >
                <i class="fa-solid fa-list"></i>
                <span data-i18n="myAds">My Ads</span>
              </button>
              <button
                class="btn btn-outline-primary admin-only d-none"
                id="btn-tab-users"
                onclick="app.views.switchDashTab('users')"
              >
                <i class="fa-solid fa-users"></i>
                <span data-i18n="allUsers">All Users</span>
              </button>
              <button
                class="btn btn-outline-primary"
                id="btn-tab-msgs"
                onclick="app.views.switchDashTab('msgs')"
              >
                <i class="fa-solid fa-envelope"></i> Messages
                <span class="badge bg-danger rounded-pill ms-2" id="msgCount"
                  >0</span
                >
              </button>
            </div>
          </div>
        </div>

        <!-- Stats Card (Admin Only) -->
        <div class="card border-0 shadow-sm rounded-4 mt-3 admin-only d-none">
          <div class="card-body">
            <h6 class="fw-bold text-muted mb-3">Platform Stats</h6>
            <div class="d-flex justify-content-between mb-2">
              <span>Total Users</span>
              <strong id="statUsers">0</strong>
            </div>
            <div class="d-flex justify-content-between">
              <span>Total Ads</span>
              <strong id="statAds">0</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="col-lg-9">
        <!-- Tab: Ads -->
        <div id="tab-ads" class="dash-tab animate__animated animate__fadeIn">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-0 py-3">
              <h5 class="fw-bold mb-0" data-i18n="manageAds">
                Manage Advertisements
              </h5>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="bg-light">
                    <tr>
                      <th class="ps-4">Property</th>
                      <th>Rent</th>
                      <th>Status</th>
                      <th>Date</th>
                      <th class="text-end pe-4">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="dash-ads-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab: Users (Admin) -->
        <div
          id="tab-users"
          class="dash-tab d-none animate__animated animate__fadeIn"
        >
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-0 py-3">
              <h5 class="fw-bold mb-0">Registered Users</h5>
            </div>
            <div class="card-body p-0">
              <ul class="list-group list-group-flush" id="user-list-group"></ul>
            </div>
          </div>
        </div>

        <!-- Tab: Messages -->
        <div
          id="tab-msgs"
          class="dash-tab d-none animate__animated animate__fadeIn"
        >
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-0 py-3">
              <h5 class="fw-bold mb-0">Private Messages</h5>
            </div>
            <div class="card-body p-0">
              <div class="list-group list-group-flush" id="msg-list-group">
                <div class="p-4 text-center text-muted">
                  No messages received.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
