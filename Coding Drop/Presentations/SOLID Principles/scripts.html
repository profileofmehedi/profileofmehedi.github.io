<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View — SOLID Principles</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg:      #050505; /* Pitch Black for contrast */
  --surface: #111111;
  --border:  rgba(255,255,255,0.08);
  --cyan:    #06b6d4; /* S */
  --rose:    #f43f5e; /* O */
  --amber:   #f59e0b; /* L */
  --emerald: #10b981; /* I */
  --violet:  #8b5cf6; /* D */
  --text:    #f8fafc;
  --muted:   #94a3b8;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:'Outfit','Noto Sans Bengali',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

/* ── top bar ── */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tb-logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1rem; }
.tb-badge {
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#fff; padding:3px 9px; border-radius:6px;
  font-size:0.68rem; font-weight:700; letter-spacing:1px;
}
.tb-right { display:flex; align-items:center; gap:22px; }

/* ── timer ── */
.timer-wrap { display:flex; align-items:center; gap:10px; }
.timer-display { font-family:'Fira Code',monospace; font-size:1.7rem; font-weight:700; color:var(--cyan); letter-spacing:2px; line-height:1; }
.timer-display.warn { color:var(--amber); }
.timer-display.over { color:var(--rose); animation:blink .7s infinite alternate; }
@keyframes blink { to { opacity:.4; } }
.timer-btns { display:flex; gap:6px; }
.tbtn { background:rgba(255,255,255,0.07); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 11px; font-size:0.75rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all .2s; }
.tbtn:hover { background:rgba(6,182,212,0.1); border-color:var(--cyan); color:var(--cyan); }
.tbtn.running { color:var(--rose); border-color:rgba(244,63,94,0.3); }

/* ── connection status ── */
.conn-status { display:flex; align-items:center; gap:7px; font-size:0.75rem; color:var(--muted); }
.conn-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s; }
.conn-dot.live { background:var(--emerald); box-shadow:0 0 8px var(--emerald); animation:pulse .8s infinite alternate; }
@keyframes pulse { to { opacity:.4; transform:scale(.7); } }

/* ── main grid ── */
.main { flex:1; display:grid; grid-template-columns:1fr 340px; grid-template-rows:1fr auto; gap:0; overflow:hidden; height:calc(100vh - 66px); }

/* ── script panel ── */
.script-panel { grid-column:1; grid-row:1; display:flex; flex-direction:column; padding:28px 32px; border-right:1px solid var(--border); overflow:hidden; }
.cur-slide-label { font-size:0.65rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--cyan); display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.cur-slide-label::before { content:''; width:18px; height:2px; background:var(--cyan); border-radius:1px; }
.cur-slide-title { font-size:1.5rem; font-weight:800; line-height:1.2; margin-bottom:22px; color:var(--text); }
.script-box { flex:1; overflow-y:auto; background:rgba(6,182,212,0.03); border:1px solid rgba(6,182,212,0.15); border-radius:14px; padding:24px 28px; position:relative; }
.script-box::before { content:'📢 SCRIPT'; position:absolute; top:-11px; left:20px; background:var(--bg); padding:0 8px; font-size:0.6rem; font-weight:700; letter-spacing:2px; color:var(--cyan); }
.script-text { font-size:1.15rem; line-height:2; color:var(--text); font-weight:400; white-space: pre-line; }
.script-text em { color:var(--cyan); font-style:normal; font-weight:600; }
.script-box::-webkit-scrollbar { width:4px; }
.script-box::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* ── nav bar ── */
.nav-bar { grid-column:1; grid-row:2; display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-top:1px solid var(--border); border-right:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.nav-arrows { display:flex; gap:10px; }
.nav-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 20px; font-size:0.85rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; transition:all .2s; font-family:'Outfit',sans-serif; }
.nav-btn:hover { background:rgba(6,182,212,0.1); border-color:var(--cyan); color:var(--cyan); }
.nav-btn:disabled { opacity:0.3; cursor:not-allowed; }
.slide-counter { font-family:'Fira Code',monospace; font-size:1rem; color:var(--muted); font-weight:500; }
.slide-counter span { color:var(--text); font-weight:700; }

/* ── right panel ── */
.right-panel { grid-column:2; grid-row:1 / 3; display:flex; flex-direction:column; overflow:hidden; }
.rp-section { display:flex; flex-direction:column; border-bottom:1px solid var(--border); overflow:hidden; }
.rp-head { padding:14px 18px 10px; font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); flex-shrink:0; display:flex; align-items:center; gap:7px; }
.ch-list-p { overflow-y:auto; flex:1; padding:0 10px 10px; display:flex; flex-direction:column; gap:3px; }
.ch-p { padding:8px 12px; border-radius:8px; font-size:0.78rem; cursor:pointer; display:flex; align-items:center; gap:9px; transition:all .2s; border:1px solid transparent; color:var(--muted); }
.ch-p:hover { background:rgba(255,255,255,0.04); }
.ch-p.active { background:rgba(6,182,212,0.08); border-color:rgba(6,182,212,0.25); color:var(--cyan); font-weight:600; }
.ch-p.done { color:var(--text); }
.ch-p .cn { width:20px; height:20px; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.62rem; font-weight:700; font-family:'Fira Code',monospace; background:rgba(255,255,255,0.06); color:var(--muted); transition:all .2s; }
.ch-p.active .cn { background:var(--cyan); color:#000; }
.ch-p.done .cn { background:rgba(16,185,129,0.15); color:var(--emerald); }

.next-preview { padding:16px 18px; border-top:1px solid var(--border); flex-shrink:0; }
.np-label { font-size:0.6rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.np-title { font-size:0.85rem; font-weight:700; color:var(--text); line-height:1.3; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:9px; }
.np-title i { color:var(--amber); }

.prog-wrap { padding:14px 18px; border-top:1px solid var(--border); flex-shrink:0; }
.prog-bar-thin { height:4px; background:rgba(255,255,255,0.07); border-radius:2px; overflow:hidden; margin-top:8px; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--violet)); border-radius:2px; transition:width .4s ease; }
.prog-stats { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:0.7rem; color:var(--muted); }
.prog-pct { color:var(--cyan); font-weight:700; font-family:'Fira Code',monospace; }

.open-btn { display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all .2s; margin:14px 18px; text-decoration:none; justify-content:center; }
.open-btn:hover { transform:scale(1.03); box-shadow:0 0 16px rgba(6,182,212,.3); }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh">

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-logo">
    <img src="../Dependency Injection/coding drop logo.png" alt="logo" style="width:32px;height:32px;border-radius:7px;object-fit:cover">
    <div class="tb-badge">PRESENTER</div>
    <span>SOLID Masterclass</span>
  </div>
  <div class="tb-right">
    <div class="conn-status"><div class="conn-dot" id="connDot"></div><span id="connLabel">Audience window-এর জন্য অপেক্ষা...</span></div>
    <div class="timer-wrap">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-btns">
        <button class="tbtn" id="timerBtn" onclick="toggleTimer()"><i class="fa-solid fa-play"></i> শুরু</button>
        <button class="tbtn" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- Script Panel -->
  <div class="script-panel">
    <div class="cur-slide-label"><i class="fa-solid fa-tv"></i> বর্তমান স্লাইড</div>
    <div class="cur-slide-title" id="curTitle">Chapter 1</div>
    <div class="script-box"><div class="script-text" id="scriptText">লোড হচ্ছে...</div></div>
  </div>

  <!-- Nav Bar -->
  <div class="nav-bar">
    <div class="nav-arrows">
      <button class="nav-btn" id="btnPrev" onclick="presNav(-1)" disabled><i class="fa-solid fa-arrow-left"></i> আগের</button>
      <button class="nav-btn" id="btnNext" onclick="presNav(1)">পরের <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="slide-counter"><span id="curNum">1</span> / <span id="totNum">13</span></div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="rp-section" style="flex:1;overflow:hidden">
      <div class="rp-head"><i class="fa-solid fa-list-ul"></i> Chapter তালিকা</div>
      <div class="ch-list-p" id="chListP"></div>
    </div>
    <div class="next-preview">
      <div class="np-label"><i class="fa-solid fa-forward"></i> পরের স্লাইড</div>
      <div class="np-title" id="nextTitle"><i class="fa-solid fa-arrow-right"></i> <span>লোড...</span></div>
    </div>
    <div class="prog-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--muted)">
        <span><i class="fa-solid fa-chart-line"></i> অগ্রগতি</span><span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-bar-thin"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-stats"><span id="elapsedLabel">অতিবাহিত: 00:00</span><span id="remainLabel">বাকি: ~20:00</span></div>
    </div>
    <a class="open-btn" href="main.html" target="_blank" id="openBtn"><i class="fa-solid fa-tv"></i> Audience Window খুলুন</a>
  </div>
</div>

<script>
const SLIDES = [
  {
    ch:'পরিচিতি',
    narration:`হ্যালো বন্ধুরা! কোডিং ড্রপ চ্যানেলে আপনাদের সবাইকে স্বাগতম। আশা করি সবাই চমৎকার আছেন!

আজকে আমরা সফটওয়্যার ইঞ্জিনিয়ারিং আর আর্কিটেকচারের এমন একটা জিনিস শিখবো যেটা ছাড়া আসলে একজন প্রফেশনাল ডেভেলপার হওয়া অসম্ভব। হ্যাঁ, আমি কথা বলছি SOLID Principles নিয়ে!

আপনি নতুন কোডিং শুরু করুন বা অলরেডি কয়েক বছর ধরে জব করছেন—ইন্টারভিউ বোর্ড থেকে শুরু করে বড় প্রজেক্টের কোডবেস ডিজাইন, সব জায়গায় এই ৫টা নিয়ম আপনার জীবন অনেক সহজ করে দেবে।

রবার্ট সি. মার্টিন, যাকে আমরা সবাই আদর করে 'আঙ্কেল বব' ডাকি, তিনিই এই প্রিন্সিপালগুলো পপুলার করেছিলেন।

তাহলে আর দেরি না করে চলুন শুরু করি আজকের ভিডিও, আর আঙ্কেল ববের এই ৫টা সুবর্ণ নিয়মের গভীরে ডুব দেই!`
  },
  {
    ch:'SOLID কী এবং কেন?',
    narration:`আচ্ছা, প্রথমেই প্রশ্ন আসে—এই SOLID জিনিসটা আসলে কী আর কেনই বা আমাদের এটা শিখতে হবে?

খুব সহজ কথায়, SOLID হচ্ছে ৫টা ওওপি (OOP) ডিজাইন প্রিন্সিপালের আদ্যক্ষর নিয়ে তৈরি একটা অ্যাক্রোনিম।

S দিয়ে Single Responsibility, O দিয়ে Open/Closed, L দিয়ে Liskov Substitution, I দিয়ে Interface Segregation, আর D দিয়ে Dependency Inversion।

এখন ভাবছেন, 'ভাই, কোড তো এমনিতেই কাজ করে, এই কঠিন কঠিন নিয়মের কী দরকার?'

উত্তরে বলবো: যখন প্রজেক্ট বড় হতে থাকে, তখন আমরা যদি যেনতেনভাবে কোড লিখি (যেটাকে আমরা বলি Spaghetti Code), তখন একটা ছোট ফিচার যোগ করতে গেলে দেখা যায় অন্য জায়গায় পুরো সিস্টেম ভেঙে পড়েছে! কোড মেইনটেইন করা তখন একটা দুঃস্বপ্ন হয়ে দাঁড়ায়।

SOLID প্রিন্সিপালগুলো আমাদের শেখায় কোডকে কীভাবে ডিকাপল বা আলাদা করা যায়, যেন যেকোনো পরিবর্তন বা টেস্টিং পানির মতো সহজ হয়ে যায়!`
  },
  {
    ch:'S - Single Responsibility (SRP)',
    narration:`প্রথম নিয়ম: Single Responsibility Principle বা সংক্ষেপে SRP।

এই নিয়মটার একটা চমৎকার ক্লাসিক সংজ্ঞা আছে: "A class should have one, and only one, reason to change."
অর্থাৎ, একটা ক্লাসের শুধুমাত্র একটা দায়িত্ব থাকা উচিত, আর ওই ক্লাসে হাত দেওয়ার কারণও যেন কেবল একটাই হয়।

একটা বাস্তব উদাহরণ দেওয়া যাক। ধরুন আপনার একটা User ক্লাস আছে। এই ক্লাসের কাজ শুধু ইউজারের নাম বা ইমেইল প্রসেস করা। কিন্তু আপনি যদি এই ক্লাসের ভেতরই ডাটাবেজে ডাটা সেভ করার কোড, আর ইমেইল পাঠানোর কোড লিখে রাখেন, তাহলে কিন্তু ঝামেলা!

কারণ কালকে যদি ডাটাবেজ চেঞ্জ হয় বা ইমেইল সার্ভিস প্রোভাইডার পাল্টে যায়, আপনাকে কিন্তু মেইন User ক্লাসটা মডিফাই করতে হবে। এটা একদমই ঠিক না!`
  },
  {
    ch:'SRP - Live Code Demo',
    narration:`চলুন এবার প্র্যাক্টিক্যাল কোড দেখে ব্যাপারটা ক্লিয়ার হই।

স্ক্রিনে বাম পাশের কোডটা (Bad Practice) খেয়াল করুন। এখানে ReportManager ক্লাসটা রিপোর্ট তৈরি করছে, আবার ফাইলে সেভ করছে, এমনকি ইমেইলও পাঠাচ্ছে! একে বলা হয় "God Class"—মানে সে একাই সব কাজ করে।

এবার ডান পাশের সমাধানটা (Good Practice) দেখুন। আমরা দায়িত্বগুলো সুন্দর করে ভাগ করে দিয়েছি:
- ReportGenerator ক্লাস শুধু রিপোর্ট তৈরি করবে।
- ReportSaver শুধু ফাইলে সেভ করবে।
- EmailSender শুধু ইমেইল পাঠাবে।

এখন যদি ইমেইল পাঠানোর মেকানিজম বা ডাটাবেজ চেঞ্জ হয়, আমাদের রিপোর্ট জেনারেশন কোডে কোনো এফেক্ট পড়বে না। দারুণ না?`
  },
  {
    ch:'O - Open/Closed Principle (OCP)',
    narration:`দ্বিতীয় নিয়ম: Open/Closed Principle বা ও-সি-পি।

কনসেপ্টটা একটু খেয়াল করুন: "Software entities should be open for extension, but closed for modification."

const total = SLIDES.length;
let cur = 0;
const BC = new BroadcastChannel('solid_presentation');
let audienceConnected = false;

BC.onmessage = (e) => {
  if(e.data.type === 'nav'){ audienceConnected = true; updateConn(true); cur = e.data.idx; renderSlide(); }
  if(e.data.type === 'ping'){ audienceConnected = true; updateConn(true); }
};

function updateConn(live){
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  if(live){ dot.classList.add('live'); lbl.textContent = 'Audience window সংযুক্ত ✓'; lbl.style.color = 'var(--emerald)'; }
  else { dot.classList.remove('live'); lbl.textContent = 'Audience window-এর জন্য অপেক্ষা...'; lbl.style.color = 'var(--muted)'; }
}

function presNav(dir){
  const next = cur + dir;
  if(next < 0 || next >= total) return;
  cur = next;
  BC.postMessage({ type: 'nav', idx: cur });
  renderSlide();
}

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') presNav(1);
  else if(e.key==='ArrowLeft') presNav(-1);
});

function renderSlide(){
  const sl = SLIDES[cur];
  document.getElementById('curTitle').textContent = 'Chapter '+(cur+1)+' — '+sl.ch;
  document.getElementById('scriptText').innerHTML = sl.narration.replace(/"([^"]+)"/g,'<em>"$1"</em>');
  document.getElementById('curNum').textContent = cur+1;
  document.getElementById('totNum').textContent = total;

  const nextSl = SLIDES[cur+1];
  const ntEl = document.getElementById('nextTitle');
  if(nextSl) ntEl.innerHTML = `<i class="fa-solid fa-arrow-right"></i> <span>${nextSl.ch}</span>`;
  else ntEl.innerHTML = `<i class="fa-solid fa-flag-checkered"></i> <span style="color:var(--emerald)">উপস্থাপনা শেষ!</span>`;

  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === total-1;

  const pct = Math.round(((cur+1)/total)*100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';

  document.querySelectorAll('.ch-p').forEach((el,i)=>{
    el.classList.remove('active','done');
    if(i===cur) el.classList.add('active');
    else if(i<cur) el.classList.add('done');
  });
  const active = document.getElementById('cp-'+cur);
  if(active) active.scrollIntoView({behavior:'smooth',block:'nearest'});
  document.querySelector('.script-box').scrollTop = 0;
}

function buildChapters(){
  const wrap = document.getElementById('chListP');
  SLIDES.forEach((sl,i)=>{
    const d = document.createElement('div');
    d.className = 'ch-p' + (i===0?' active':'');
    d.id = 'cp-'+i;
    d.onclick = ()=>{ cur=i; BC.postMessage({type:'nav',idx:cur}); renderSlide(); };
    d.innerHTML = `<div class="cn">${i+1}</div><span>${sl.ch}</span>`;
    wrap.appendChild(d);
  });
}

let timerSec = 0; let timerRunning = false; let timerIv = null;
function toggleTimer(){
  const btn = document.getElementById('timerBtn');
  if(timerRunning){ clearInterval(timerIv); timerRunning = false; btn.innerHTML = '<i class="fa-solid fa-play"></i> শুরু'; btn.classList.remove('running'); }
  else { timerIv = setInterval(tickTimer, 1000); timerRunning = true; btn.innerHTML = '<i class="fa-solid fa-pause"></i> বিরতি'; btn.classList.add('running'); }
}
function resetTimer(){
  clearInterval(timerIv); timerRunning = false; timerSec = 0;
  const btn = document.getElementById('timerBtn');
  btn.innerHTML = '<i class="fa-solid fa-play"></i> শুরু'; btn.classList.remove('running');
  updateTimerDisplay();
}
function tickTimer(){ timerSec++; updateTimerDisplay(); }
function updateTimerDisplay(){
  const m = Math.floor(timerSec/60).toString().padStart(2,'0');
  const s = (timerSec%60).toString().padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  el.textContent = m+':'+s;
  if(timerSec < 1200) el.className='timer-display';
  else if(timerSec < 1320) el.className='timer-display warn';
  else el.className='timer-display over';

  document.getElementById('elapsedLabel').textContent = 'অতিবাহিত: '+m+':'+s;
  const rem = Math.max(0, 1200-timerSec);
  const rm = Math.floor(rem/60).toString().padStart(2,'0');
  const rs = (rem%60).toString().padStart(2,'0');
  document.getElementById('remainLabel').textContent = 'বাকি: '+rm+':'+rs;
}

buildChapters(); renderSlide();
setInterval(()=>{ BC.postMessage({type:'ping_from_presenter'}); }, 3000);
</script>
