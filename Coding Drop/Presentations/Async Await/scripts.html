<script>
const BC = new BroadcastChannel('async_presentation');
let cur=0,timerInterval=null,seconds=0,running=false;
const slides=[
  {title:'পরিচয় — Async / Await & Task',script:`আসসালামু আলাইকুম, স্বাগতম <em>Coding Drop</em>-এ।

আজকের বিষয় — .NET-এর অন্যতম গুরুত্বপূর্ণ ফিচার <em>Async / Await</em> এবং <em>Task Parallel Library</em>।

অনেক developer async/await লিখেন, কিন্তু ভেতরে আসলে কী ঘটছে সেটা পরিষ্কার নয়। আজ Thread Pool, Task, WhenAll/WhenAny, CancellationToken — এবং Deadlock কীভাবে এড়াবেন, সব কিছু বাস্তব উদাহরণ দিয়ে বুঝব।

শুরু করি মূল সমস্যা থেকে — Synchronous কোডে Thread কেন আটকে যায়।`},
  {title:'Synchronous = Thread আটকে থাকে',script:`একটা সহজ analogy দিয়ে শুরু করি।

রেস্তোরাঁর একজন বাবুর্চি চুলায় পানি বসিয়ে সেই পাশেই দাঁড়িয়ে অপেক্ষা করছে। পানি না ফুটলে সে অন্য কিছু করছে না — পুরো সময় blocked।

এটাই <em>Synchronous</em> কোড। একটি Thread একটা I/O কাজ শেষ না হওয়া পর্যন্ত মুক্ত হয় না।

বুদ্ধিমান বাবুর্চি কী করবে? পানি চুলায় দিয়ে ততক্ষণে পেঁয়াজ-গাজর কাটবে। পানি ফুটলে ফিরে এসে বাকি রান্না করবে।

এটাই <em>Async / Await</em> — await-এ Thread সাময়িকভাবে ছেড়ে দেয়, Thread Pool-এ ফিরে যায়, অন্য request সার্ভ করতে পারে। কাজ শেষ হলে continuation চলে।

ASP.NET Core-এ Thread Pool সীমিত। Sync কোড বেশি থাকলে throughput কমে যায় — এটাই মূল সমস্যা।

<em>বাবুর্চি ডেমো চালান</em> বাটনে ক্লিক করুন — Sync vs Async পাশাপাশি step-by-step চলবে।`},
  {title:'Thread Pool — Sync vs Async',script:`Thread Pool-এ সাধারণত সীমিত সংখ্যক Thread থাকে — ধরুন ৮টি, idle অবস্থায়।

প্রথমে <em>Sync Request পাঠাও</em> বাটনে ক্লিক করুন। Thread blocked — Pool ভরে যেতে আরো চাপুন।

এবার <em>Async Request পাঠাও</em> চাপুন — Thread Pool-এ ফিরে আসে, অন্য request serve করতে পারে।

এই পার্থক্যই async-এর মূল লাভ — একই Thread Pool দিয়ে অনেক বেশি concurrent request handle করা যায়।`},
  {title:'Task<T> — ভবিষ্যতের প্রতিশ্রুতি',script:`<em>Task</em> বুঝতে রেস্তোরাঁর order token-এর কথা মনে করুন।

অর্ডার দিলেন, টোকেন পেলেন। রান্না চলছে — আপনি অন্য কাজ করতে পারেন। খাবার ready হলে টোকেন দিয়ে নিয়ে যান।

<em>Task&lt;T&gt;</em> ঠিক তেমন — এখনই result নয়, ভবিষ্যতে result পাবেন এমন একটি promise।

Task-এর চারটি state আছে:
<em>Pending</em> — এখনো শুরু হয়নি
<em>Running</em> — চলছে
<em>RanToCompletion</em> — সফলভাবে শেষ, result পাওয়া যাবে
<em>Faulted</em> — exception হয়েছে

<em>Task</em> (non-generic) শুধু কাজ করে, কোনো value return করে না। <em>Task&lt;T&gt;</em> একটি typed result দেয়।

await শুধু Task-এর উপর কাজ করে — Task ছাড়া async model সম্পূর্ণ নয়।

Task card select করে <em>Lifecycle অ্যানিমেশন চালান</em> বাটনে ক্লিক করুন — Created → Running → Completed flow দেখুন।`},
  {title:'async / await — কোডে প্রয়োগ',script:`এখন real code-এ যাই।

Sync version-এ:
<code>var user = _db.Users.Find(id);</code>
<code>var orders = _orderService.GetOrders(id);</code>

প্রতিটি DB call-এ Thread blocked। দুটো sequential call মানে দুবার অপেক্ষা — এই সময় Thread Pool-এর একটি Thread সম্পূর্ণ idle নয়, blocked।

Async version:
<code>var user = await _db.FindAsync(id);</code>
<code>var orders = await _orderService.GetOrdersAsync(id);</code>

প্রথম await-এ I/O wait শুরু — Thread মুক্ত। DB response এলে continuation চলে, orders fetch হয়। দ্বিতীয় await-এ আবার same pattern।

Method signature: <em>async Task&lt;IActionResult&gt;</em> — async keyword method-এ, return type Task।

Controller থেকে Service, Service থেকে Repository — পুরো chain async রাখুন। মাঝে একটু sync হলেই benefit হারায়।

উপরের switch দিয়ে Sync vs Async toggle করুন, তারপর <em>Execution Flow দেখুন</em> চাপুন।`},
  {title:'WhenAll & WhenAny — Parallel Tasks',script:`কখনো একসাথে multiple independent কাজ চালাতে হয়।

<em>Task.WhenAll(tasks)</em> — সব Task parallel শুরু, সব শেষ হওয়ার পর continue। Example: একসাথে email পাঠানো, report generate, image resize — তিনটাই independent।

<em>Task.WhenAny(tasks)</em> — সব parallel শুরু, যেটা <em>প্রথম</em> শেষ করে সেটার result নিয়ে continue। Use case: multiple API থেকে fastest response, বা timeout pattern।

WhenAll-এ একটি Task fail করলে AggregateException-এ সব failure একসাথে পাবেন।

WhenAny-এ first winner-এর result নিন, বাকি Task-গুলো cancel করতে পারেন CancellationToken দিয়ে — resource waste কমায়।

<em>Task.WhenAll()</em> এবং <em>Task.WhenAny()</em> বাটনে ক্লিক করে পার্থক্য দেখুন।`},
  {title:'CancellationToken',script:`Long-running বা background Task-এ cancel করার mechanism দরকার।

<em>CancellationToken</em> হলো cooperative cancellation — Task নিজে check করে, জোর করে kill হয় না।

Pattern:
<code>var cts = new CancellationTokenSource();</code>
<code>await DoWorkAsync(cts.Token);</code>
Cancel করতে: <code>cts.Cancel();</code>

Method-এ: <code>token.ThrowIfCancellationRequested();</code> — cancel হলে OperationCanceledException।

ASP.NET Core-এ <em>HttpContext.RequestAborted</em> automatically pass করুন — user browser বন্ধ করলে expensive DB query বন্ধ হয়ে যায়।

<em>Task শুরু করুন</em> চাপুন, কিছুক্ষণ পর <em>বাতিল করুন</em> — OperationCanceledException দেখুন।`},
  {title:'Deadlock — .Result ব্যবহারের ফাঁদ',script:`Production-এ সবচেয়ে বিপজ্জনক mistake — async method-এ <em>.Result</em> বা <em>.Wait()</em> ব্যবহার।

Scenario: UI Thread (বা ASP.NET sync context) একটি async method call করে, তারপর:
<code>var result = asyncMethod().Result;</code>

কী হয়? UI Thread .Result-এ blocked — async work শেষ হতে Continuation চায় same context-এ ফিরতে। কিন্তু UI Thread তো blocked! দুপক্ষই একে অপেক্ষা — <em>Deadlock</em>।

Console app-এ sometimes কাজ করে, WinForms/WPF/পুরানো ASP.NET-এ almost guaranteed deadlock।

Solution একটাই: <em>async all the way</em> — সবসময় await করুন, .Result/.Wait() কখনো নয়।

<em>asyncTask.Result ব্যবহার করুন (বিপদ!)</em> বাটনে ক্লিক করুন — Deadlock step-by-step দেখুন।`},
  {title:'ConfigureAwait(false)',script:`Library বা reusable NuGet package লিখলে <em>ConfigureAwait(false)</em> জানা 필수।

Default behavior: await-এর পর original <em>SynchronizationContext</em>-এ ফিরে যাওয়ার চেষ্টা — UI app-এ UI thread, ASP.NET-এ request context।

Application code-এ (Controller, Page) এটা সাধারণত ঠিক। কিন্তু library code SynchronizationContext capture করলে caller-এর context-এ ফিরতে চায় — UI thread-এ .Result থাকলে Deadlock।

Fix:
<code>await httpClient.GetStringAsync(url).ConfigureAwait(false);</code>

ConfigureAwait(false) মানে: continuation যেকোনো Thread Pool thread-এ চলবে, caller context capture করবে না।

Rule of thumb:
Application layer → ConfigureAwait(false) লাগে না (ASP.NET Core-এ context নেই anyway)
Library / Infrastructure layer → সব await-এ ConfigureAwait(false)

এটা performance-ও ভালো — unnecessary context switch কমায়।`},
  {title:'Async Exception Handling',script:`Async exception handling sync-এর চেয়ে একটু different — কিন্তু complicated নয়।

Single await:
<code>try { await SendEmailAsync(); }</code>
<code>catch (Exception ex) { ... }</code>
Exception সরাসরি catch block-এ যায় — synchronous try/catch-এর মতোই feel।

<em>Task.WhenAll</em> — multiple Task, multiple failure:
<code>catch (AggregateException ex)</code>
<code>foreach (var inner in ex.InnerExceptions)</code>
সব failed Task-এর exception InnerExceptions-এ।

Cancel:
<code>catch (OperationCanceledException)</code>
CancellationToken দিয়ে cancel — user-initiated shutdown handle করুন, generic Exception-এ mix করবেন না।

Fire-and-forget (<em>async void</em>) avoid করুন — exception catch করা প্রায় impossible, শুধু event handler exception।`},
  {title:'ValueTask — অতিরিক্ত Allocation কমান',script:`High-throughput scenario-তে <em>ValueTask&lt;T&gt;</em> consider করুন।

<em>Task&lt;T&gt;</em> — প্রতিবার heap-এ object allocate হয়, state machine সহ। Hot path-এ GC pressure বাড়ায়।

Example: cache lookup method — ৯০% সময় cache hit, synchronously value return:
Task দিয়ে return করলেও heap allocation হয়!

<em>ValueTask&lt;T&gt;</em>:
Cache hit → <code>return new ValueTask&lt;int&gt;(cachedValue);</code> — stack, no allocation
Cache miss → <code>return new ValueTask&lt;int&gt;(FetchFromDbAsync());</code>

কখন use করবেন: method প্রায়ই synchronously complete হয় (cache, in-memory)
কখন avoid: result multiple await, বা consumer Task-কে store/cache করে

.NET 5+ এ IAsyncEnumerable, IAsyncDisposable-ও related patterns — large stream processing-এ useful।`},
  {title:'Async Best Practices',script:`Production-ready async code-এর golden rules:

<em>১. Async All the Way</em>
Controller → Service → Repository — পুরো stack async। এক layer sync = bottleneck + deadlock risk।

<em>২. .Result / .Wait() — Never</em>
Debugging-এও avoid করুন। GetAwaiter().GetResult()-ও same problem।

<em>৩. ConfigureAwait(false) in Libraries</em>
NuGet package, shared infrastructure — সব await-এ।

<em>৪. CancellationToken everywhere</em>
Public async API-তে parameter রাখুন: <code>CancellationToken cancellationToken = default</code>

<em>৫. Avoid async void</em>
শুধু event handler। সব method async Task বা async Task&lt;T&gt;।

<em>৬. Don't wrap sync in Task.Run unnecessarily</em>
<code>await Task.Run(() => heavyCpu())</code> — CPU work-এ intentional, I/O-কে Task.Run দিয়ে fake async করবেন না।`},
  {title:'Async কখন ব্যবহার করবেন না?',script:`Async magic নয় — wrong place-এ overhead বাড়ায়।

<em>I/O Bound — Async ব্যবহার করুন ✓</em>
Database queries, HTTP calls, file read/write, message queue, network socket — Thread blocked waiting-এর জায়গায় async perfect।

<em>CPU Bound — Async avoid করুন ✗</em>
Image processing, encryption, complex calculation, sorting large array — async state machine overhead লাভ নয়।

CPU work-এ: <code>await Task.Run(() => Compute());</code> বা <code>Parallel.For</code> — dedicated thread-এ চালান।

<em>Micro-optimization trap:</em>
<code>await Task.Delay(1)</code> দিয়ে fake async — meaningless।

<em>async void</em> event handler ছাড়া anywhere — exception unhandled, test করা কঠিন।

Rule: I/O wait আছে? → async। Pure computation? → sync বা Task.Run/Parallel।`},
  {title:'সারসংক্ষেপ — Async / Await',script:`আজ যা শিখলাম — quick recap:

<em>await</em> = Thread আটকে রাখো না, I/O wait-এ Pool-এ ফিরে যাও, ready হলে continue।

<em>Task / Task&lt;T&gt;</em> = async operation-এর handle, future result।

<em>WhenAll</em> = সব parallel, সব শেষে continue। <em>WhenAny</em> = fastest wins।

<em>CancellationToken</em> = graceful shutdown, HttpContext.RequestAborted use করুন।

<em>.Result / .Wait()</em> = Deadlock trap — কখনো নয়।

<em>ConfigureAwait(false)</em> = library code-এ must।

Async সব জায়গায় নয় — I/O-তে yes, CPU-তে Task.Run বা sync।

Practice করুন — existing sync repository methods-কে FindAsync, GetAsync version-এ refactor করে throughput কত improve হয় measure করুন।

ভিডিও ভালো লাগলে like, comment করুন, <em>Coding Drop</em> subscribe করতে ভুলবেন না। পরবর্তী ভিডিওতে দেখা হবে — আল্লাহ হাফেজ!`}
];
const chapters=['পরিচয়','Sync সমস্যা','Thread Pool','Task কী?','async/await কোড','WhenAll & WhenAny','CancellationToken','Deadlock','ConfigureAwait','Exception Handling','ValueTask','Best Practices','কখন নয়?','সারসংক্ষেপ'];
const TOTAL=slides.length;
document.getElementById('totNum').textContent=TOTAL;
const chListP=document.getElementById('chListP');
chapters.forEach((ch,i)=>{const el=document.createElement('div');el.className='ch-p'+(i===0?' active':'');el.innerHTML=`<div class="cn">${i+1}</div>${ch}`;el.onclick=()=>goToSlide(i);chListP.appendChild(el)});
function updateUI(){const s=slides[cur];document.getElementById('curLabel').textContent=`স্লাইড ${cur+1}`;document.getElementById('curTitle').textContent=s.title;document.getElementById('scriptText').innerHTML=s.script;document.getElementById('curNum').textContent=cur+1;const pct=Math.round(((cur+1)/TOTAL)*100);document.getElementById('progPct').textContent=pct+'%';document.getElementById('progFill').style.width=pct+'%';document.getElementById('prevBtn').disabled=cur===0;document.getElementById('nextBtn').disabled=cur===TOTAL-1;document.querySelectorAll('.ch-p').forEach((el,i)=>{el.classList.toggle('active',i===cur);el.classList.toggle('done',i<cur)});const nt=document.getElementById('nextTitle');nt.innerHTML=cur<TOTAL-1?`<i class="fa-solid fa-arrow-right"></i> ${chapters[cur+1]}`:`<i class="fa-solid fa-flag-checkered"></i> শেষ`}
function goToSlide(idx){idx=Math.max(0,Math.min(TOTAL-1,idx));if(idx===cur)return;cur=idx;BC.postMessage({type:'nav',idx:cur});updateUI()}
function navigate(delta){goToSlide(cur+delta)}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();navigate(1)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();navigate(-1)}
});
document.body.tabIndex=-1;document.body.focus();
function toggleTimer(){if(running){clearInterval(timerInterval);running=false;document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-play"></i>'}else{timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000);running=true;document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-pause"></i>'}}
function resetTimer(){clearInterval(timerInterval);running=false;seconds=0;document.getElementById('timer').textContent='00:00';document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-play"></i>'}
BC.postMessage({type:'ping_from_presenter'});
setInterval(()=>BC.postMessage({type:'ping_from_presenter'}),3000);
BC.onmessage=e=>{
  if(e.data.type==='nav'){cur=e.data.idx;updateUI()}
  if(e.data.type==='ping'){document.getElementById('connDot').classList.add('live');document.getElementById('connTxt').textContent='Audience সংযুক্ত ✓';document.getElementById('connTxt').style.color='var(--emerald)';setTimeout(()=>{document.getElementById('connDot').classList.remove('live');document.getElementById('connTxt').textContent='Audience window খুলুন';document.getElementById('connTxt').style.color=''},5000)}
};
updateUI();
</script>
