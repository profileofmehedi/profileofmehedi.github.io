<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View — Clean Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#050508;--surface:#0a0a12;--border:rgba(255,255,255,0.08);--cyan:#22d3ee;--indigo:#6366f1;--gold:#f59e0b;--emerald:#10b981;--rose:#f43f5e;--text:#f0f4ff;--muted:#7b8aaa}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit','Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 26px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tb-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem}
.tb-badge{background:linear-gradient(135deg,var(--cyan),var(--indigo));color:#fff;padding:3px 9px;border-radius:6px;font-size:0.68rem;font-weight:700;letter-spacing:1px}
.tb-right{display:flex;align-items:center;gap:20px}
.timer-display{font-family:'Fira Code',monospace;font-size:1.6rem;font-weight:700;color:var(--cyan);letter-spacing:2px}
.timer-btns{display:flex;gap:6px}
.tbtn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 10px;font-size:0.72rem;font-weight:600;cursor:pointer;transition:all .2s}
.tbtn:hover{background:rgba(34,211,238,0.1);border-color:var(--cyan);color:var(--cyan)}
.conn-status{display:flex;align-items:center;gap:7px;font-size:0.75rem;color:var(--muted)}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn-dot.live{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.4;transform:scale(.7)}}
.main{flex:1;display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr auto;overflow:hidden;height:calc(100vh - 62px)}
.script-panel{grid-column:1;grid-row:1;display:flex;flex-direction:column;padding:24px 30px;border-right:1px solid var(--border);overflow:hidden}
.cur-label{font-size:0.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cur-label::before{content:'';width:16px;height:2px;background:var(--cyan);border-radius:1px}
.cur-title{font-size:1.4rem;font-weight:800;margin-bottom:18px}
.script-box{flex:1;overflow-y:auto;background:rgba(34,211,238,0.03);border:1px solid rgba(34,211,238,0.15);border-radius:12px;padding:22px 26px;position:relative}
.script-box::before{content:'📢 SCRIPT';position:absolute;top:-10px;left:18px;background:var(--bg);padding:0 8px;font-size:0.58rem;font-weight:700;letter-spacing:2px;color:var(--cyan)}
.script-text{font-size:1.1rem;line-height:2.1;color:var(--text);white-space:pre-line}
.script-text em{color:var(--cyan);font-style:normal;font-weight:600}
.script-box::-webkit-scrollbar{width:4px}
.script-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.nav-bar{grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:space-between;padding:14px 30px;border-top:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);flex-shrink:0}
.nav-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 18px;font-size:0.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s;font-family:'Outfit',sans-serif}
.nav-btn:hover{background:rgba(34,211,238,0.1);border-color:var(--cyan);color:var(--cyan)}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.slide-counter{font-family:'Fira Code',monospace;font-size:0.95rem;color:var(--muted)}
.slide-counter span{color:var(--text);font-weight:700}
.right-panel{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;overflow:hidden}
.rp-head{padding:12px 16px 8px;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.ch-list-p{overflow-y:auto;flex:1;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.ch-p{padding:7px 10px;border-radius:7px;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;border:1px solid transparent;color:var(--muted)}
.ch-p:hover{background:rgba(255,255,255,0.04)}
.ch-p.active{background:rgba(34,211,238,0.08);border-color:rgba(34,211,238,0.25);color:var(--cyan);font-weight:600}
.ch-p.done{color:var(--text)}
.ch-p .cn{width:20px;height:20px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:700;font-family:'Fira Code',monospace;background:rgba(255,255,255,0.06);color:var(--muted);transition:all .2s}
.ch-p.active .cn{background:var(--cyan);color:#000}
.ch-p.done .cn{background:rgba(34,211,238,0.15);color:var(--cyan)}
.next-preview{padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0}
.np-label{font-size:0.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.np-title{font-size:0.82rem;font-weight:700;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.np-title i{color:var(--gold)}
.prog-wrap{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.prog-label{font-size:0.6rem;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.prog-bar{height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--indigo));border-radius:3px;transition:width .4s}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-logo"><i class="fa-solid fa-building-columns" style="color:var(--cyan)"></i> Presenter View <div class="tb-badge">CLEAN ARCHITECTURE</div></div>
  <div class="tb-right">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="timer-display" id="timer">00:00</div>
      <div class="timer-btns">
        <button class="tbtn" id="timerBtn" onclick="toggleTimer()"><i class="fa-solid fa-play"></i></button>
        <button class="tbtn" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </div>
    <div class="conn-status"><div class="conn-dot" id="connDot"></div><span id="connTxt">সংযুক্ত নেই</span></div>
  </div>
</div>
<div class="main">
  <div class="script-panel">
    <div class="cur-label" id="curLabel">স্লাইড ১</div>
    <div class="cur-title" id="curTitle">পরিচয়</div>
    <div class="script-box"><div class="script-text" id="scriptText"></div></div>
  </div>
  <div class="nav-bar">
    <div style="display:flex;gap:10px">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled><i class="fa-solid fa-arrow-left"></i> পেছনে</button>
      <button class="nav-btn" id="nextBtn" onclick="navigate(1)">সামনে <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="slide-counter">স্লাইড <span id="curNum">1</span> / <span id="totNum">13</span></div>
  </div>
  <div class="right-panel">
    <div class="rp-head"><i class="fa-solid fa-list-ul"></i> অধ্যায়সমূহ</div>
    <div class="ch-list-p" id="chListP"></div>
    <div class="next-preview">
      <div class="np-label"><i class="fa-solid fa-forward"></i> পরবর্তী</div>
      <div class="np-title" id="nextTitle"><i class="fa-solid fa-arrow-right"></i> <span>—</span></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>অগ্রগতি</span><span id="progPct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </div>
</div>
<script>
const BC=new BroadcastChannel('cleanarch_presentation');
let cur=0,timerInterval=null,seconds=0,running=false;
const slides=[
  {title:'পরিচয় — Clean Architecture in ASP.NET Core',script:`আচ্ছালামুয়ালাইকুম, স্বাগতম <em>Coding Drop</em>-এ।

আজকে আমরা আলোচনা করবো সফটওয়্যার ডিজাইনের সবচেয়ে জনপ্রিয় ও কার্যকরী প্যাটার্ন — <em>Clean Architecture</em>।

আমরা যখন কোনো রিয়েল-ওয়ার্ল্ড অ্যাপ্লিকেশন বানাই, কোড কীভাবে স্তরে স্তরে সাজালে তা পরিবর্তন করা সহজ হবে এবং কীভাবে ডাটাবেজ বা থার্ড-পার্টি সার্ভিস থেকে আমাদের বিজনেস লজিককে স্বাধীন রাখা যায়, তাই আজ আমরা বিস্তারিত শিখবো।`},
  {title:'Traditional 3-Layer Architecture-এর সমস্যা',script:`আগে আমরা ৩-টায়ার আর্কিটেকচার ব্যবহার করতাম — UI, Business Logic এবং Data Access Layer।

এখানে সমস্যা হলো, সবকিছু ডাটাবেজের উপর নির্ভর করে। যদি ডাটাবেজ পরিবর্তন করতে হয়, তবে পুরো সার্ভিস এবং কন্ট্রোলারও পরিবর্তন করতে হয়। ইউনিট টেস্টিং করা অনেক কঠিন হয়ে পড়ে কারণ প্রতিবার আসল ডাটাবেজ কানেকশন লাগে।

<em>Traditional vs Clean তুলনা</em> বাটনে ক্লিক করলে দুই পাশের পার্থক্য স্পষ্ট হয় — বামে সমস্যা, ডানে Clean Architecture-এর সমাধান।`},
  {title:'Onion Architecture — স্তরে স্তরে',script:`ক্লিন আর্কিটেকচারকে প্রায়শই <em>Onion Architecture</em> বা পেঁয়াজের মতো গোল ডিজাইনের সাথে তুলনা করা হয়।

<em>Layer একে একে দেখুন</em> বাটনে ক্লিক করলে ভেতর থেকে বাইরে প্রতিটি স্তর হাইলাইট হবে। চাইলে পেঁয়াজের রিং বা ডান পাশের কার্ডেও ক্লিক করে নির্দিষ্ট লেয়ার দেখতে পারেন।

সবচেয়ে ভেতরে <em>Domain</em>, তারপর <em>Application</em>, তারপর <em>Infrastructure</em>, সবচেয়ে বাইরে <em>Presentation</em>।`},
  {title:'Dependency Rule — ভেতর থেকে বাইরে',script:`ক্লিন আর্কিটেকচারের প্রধান নিয়ম হলো — <em>Dependency Direction</em>।

নির্ভরশীলতার দিক সবসময় ভেতরের দিকে হতে হবে। ভেতরের লেয়ার কখনো বাইরের লেয়ারের কোনো ক্লাস বা লাইব্রেরি সরাসরি ব্যবহার করবে না।

<em>Request Flow দেখুন</em> বাটনে ক্লিক করলে একটি রিকোয়েস্ট Presentation থেকে শুরু হয়ে Domain পর্যন্ত কীভাবে নামে, তা একে একে দেখাবে।

Domain লেয়ার সম্পূর্ণ স্বাধীন — সে ডাটাবেজ বা EF Core চেনে না।`},
  {title:'Folder Structure',script:`একটি রিয়েল-ওয়ার্ল্ড ডটনেট প্রজেক্টে ফোল্ডারগুলো কীভাবে সাজাবেন তা এখানে দেখানো হয়েছে।

<em>Structure প্রকাশ করুন</em> বাটনে ক্লিক করলে ফোল্ডার ট্রি লাইন বাই লাইন প্রকাশ পাবে।

<em>src/</em> ফোল্ডারের নিচে চারটি প্রধান প্রজেক্ট থাকবে:
১. <em>Domain</em>: Entities, Value Objects, Interfaces।
২. <em>Application</em>: Features, DTOs, Mapping, Handlers।
৩. <em>Infrastructure</em>: DB Context, Repositories, Services।
৪. <em>WebApi</em>: Controllers, Configurations, Middlewares।`},
  {title:'Domain Layer — Entity & Interface',script:`Domain লেয়ার হলো আপনার অ্যাপ্লিকেশনের মূল প্রাণ। এটি সম্পূর্ণ পিওর সি-শার্প কোড।

এখানে কোনো ডাটাবেজ লাইব্রেরি বা এক্সটার্নাল প্যাকেজ থাকবে না।

কোডে দেখুন, Order Entity-র ভেতর আমরা বিজনেস মেথড \`AddItem\` লিখেছি। কোনো প্রোপার্টি বাইরের ক্লাস সরাসরি সেট করতে পারে না (private set)।

এছাড়াও, Repositories-এর ইন্টারফেসগুলো এই Domain লেয়ারেই ডিফাইন করা থাকে।`},
  {title:'CQRS — Command & Query Separation',script:`অ্যাপ্লিকেশন লেয়ারে আমরা <em>CQRS</em> (Command Query Responsibility Segregation) প্যাটার্ন ব্যবহার করি।

এর মানে হলো রিড এবং রাইট অপারেশন সম্পূর্ণ আলাদা থাকবে।

<em>Query পাঠান</em> বাটনে ক্লিক করলে Read-side অপারেশনগুলো হাইলাইট হবে — শুধু পড়ে, পরিবর্তন করে না।

<em>Command পাঠান</em> বাটনে ক্লিক করলে Write-side দেখাবে — Create, Update, Cancel; এখানে Domain Rule প্রয়োগ হয়।`},
  {title:'MediatR — Command Handler',script:`ক্লিন আর্কিটেকচারে ক্লাসের মধ্যকার কাপলিং কমাতে এবং CQRS বাস্তবায়নে আমরা <em>MediatR</em> লাইব্রেরি ব্যবহার করি।

কন্ট্রোলার সরাসরি সার্ভিসকে কল না করে একটি Request অবজেক্ট MediatR-এ পাঠায়।

MediatR স্বয়ংক্রিয়ভাবে সঠিক <em>Handler</em> ক্লাস খুঁজে নিয়ে রান করে।

কোডে দেখুন, \`CreateOrderCommandHandler\` শুধুমাত্র ইন্টারফেসের (\`IOrderRepository\`) উপর নির্ভর করে কাজ করছে, কোনো নির্দিষ্ট ডাটাবেজ ইমপ্লিমেন্টেশনের উপর নয়।`},
  {title:'Thin Controller — MediatR ব্যবহার',script:`কন্ট্রোলারকে সবসময় হালকা (Thin) রাখতে হবে। কন্ট্রোলারে কোনো বিজনেস লজিক থাকা যাবে না।

উপরের টগলে <em>Fat Controller</em> দেখুন — কন্ট্রোলারের ভেতর ডাটাবেজ কানেকশন ব্যবহার করে সরাসরি বিজনেস লজিক লেখা হয়েছে, যা টেস্ট করা অসম্ভব।

<em>Thin Controller</em> সিলেক্ট করলে দেখবেন কন্ট্রোলার শুধু Command তৈরি করে MediatR-এ পাঠায় — মাত্র ৫ লাইন, অত্যন্ত রিডেবল!`},
  {title:'Repository Pattern',script:`ডাটাবেজ এক্সেস লজিককে অ্যাপ্লিকেশন থেকে আলাদা করতে আমরা <em>Repository Pattern</em> ব্যবহার করি।

ডোমেইন লেয়ারে থাকবে ইন্টারফেস \`IOrderRepository\` এবং ইনফ্রাস্ট্রাকচার লেয়ারে থাকবে এর মূল ইমপ্লিমেন্টেশন \`OrderRepository\` যা EF Core ব্যবহার করবে।

এর ফলে ভবিষ্যতে যদি আমরা SQL Server বাদ দিয়ে MongoDB ব্যবহার করতে চাই, তবে শুধু ইনফ্রাস্ট্রাকচার লেয়ার পরিবর্তন করলেই হবে, অ্যাপ্লিকেশন লজিক একটুও পরিবর্তন করতে হবে না।`},
  {title:'DI (Dependency Injection) Registration',script:`ক্লিন আর্কিটেকচারে প্রজেক্টগুলোর রেজিস্ট্রেশন আলাদা আলাদা এক্সটেনশন মেথড দিয়ে করা হয়।

const chapters=['পরিচয়','Traditional সমস্যা','Onion Diagram','Dependency Rule','Folder Structure','Domain Layer কোড','CQRS','MediatR Handler','Thin Controller','Repository Pattern','DI Registration','Unit Test','সারসংক্ষেপ'];
const TOTAL=slides.length;document.getElementById('totNum').textContent=TOTAL;
const chListP=document.getElementById('chListP');
chapters.forEach((ch,i)=>{const el=document.createElement('div');el.className='ch-p'+(i===0?' active':'');el.innerHTML=`<div class="cn">${i+1}</div>${ch}`;el.onclick=()=>navigate(i-cur);chListP.appendChild(el)});
function updateUI(){const s=slides[cur];document.getElementById('curLabel').textContent=`স্লাইড ${cur+1}`;document.getElementById('curTitle').textContent=s.title;document.getElementById('scriptText').innerHTML=s.script;document.getElementById('curNum').textContent=cur+1;const pct=Math.round(((cur+1)/TOTAL)*100);document.getElementById('progPct').textContent=pct+'%';document.getElementById('progFill').style.width=pct+'%';document.getElementById('prevBtn').disabled=cur===0;document.getElementById('nextBtn').disabled=cur===TOTAL-1;document.querySelectorAll('.ch-p').forEach((el,i)=>{el.classList.toggle('active',i===cur);el.classList.toggle('done',i<cur)});const nt=document.getElementById('nextTitle');nt.innerHTML=cur<TOTAL-1?`<i class="fa-solid fa-arrow-right"></i> ${chapters[cur+1]}`:`<i class="fa-solid fa-flag-checkered"></i> শেষ`}
function navigate(delta){const next=Math.max(0,Math.min(TOTAL-1,cur+delta));if(next===cur)return;cur=next;BC.postMessage({type:'nav',idx:cur});updateUI()}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1);}
});
function toggleTimer(){if(running){clearInterval(timerInterval);running=false;document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-play"></i>'}else{timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000);running=true;document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-pause"></i>'}}
function resetTimer(){clearInterval(timerInterval);running=false;seconds=0;document.getElementById('timer').textContent='00:00';document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-play"></i>'}
BC.postMessage({type:'ping_from_presenter'});setInterval(()=>BC.postMessage({type:'ping_from_presenter'}),3000);
BC.onmessage=e=>{if(e.data.type==='ping'){document.getElementById('connDot').classList.add('live');document.getElementById('connTxt').textContent='সংযুক্ত';setTimeout(()=>{document.getElementById('connDot').classList.remove('live');document.getElementById('connTxt').textContent='সংযুক্ত নেই'},5000)}};
updateUI();
