<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View — Top 10 ASP.NET Core Best Practices</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#050508;--surface:#111;--border:rgba(255,255,255,0.08);--dotnet:#512bd7;--blue:#0078d4;--cyan:#00bcf2;--emerald:#10b981;--rose:#f43f5e;--text:#f8fafc;--muted:#94a3b8}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit','Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 26px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tb-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem}
.tb-badge{background:linear-gradient(135deg,var(--dotnet),var(--blue));color:#fff;padding:3px 9px;border-radius:6px;font-size:0.68rem;font-weight:700;letter-spacing:1px}
.tb-right{display:flex;align-items:center;gap:20px}
.timer-display{font-family:'Fira Code',monospace;font-size:1.6rem;font-weight:700;color:var(--cyan);letter-spacing:2px}
.timer-btns{display:flex;gap:6px}
.tbtn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 10px;font-size:0.72rem;font-weight:600;cursor:pointer;transition:all .2s}
.tbtn:hover{background:rgba(81,43,215,0.15);border-color:var(--dotnet);color:var(--cyan)}
.conn-status{display:flex;align-items:center;gap:7px;font-size:0.75rem;color:var(--muted)}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s}
.conn-dot.live{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.4;transform:scale(.7)}}
.main{flex:1;display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr auto;overflow:hidden;height:calc(100vh - 62px)}
.script-panel{grid-column:1;grid-row:1;display:flex;flex-direction:column;padding:24px 30px;border-right:1px solid var(--border);overflow:hidden}
.cur-label{font-size:0.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cur-label::before{content:'';width:16px;height:2px;background:var(--dotnet);border-radius:1px}
.cur-title{font-size:1.4rem;font-weight:800;margin-bottom:18px}
.script-box{flex:1;overflow-y:auto;background:rgba(81,43,215,0.04);border:1px solid rgba(81,43,215,0.18);border-radius:12px;padding:22px 26px;position:relative}
.script-box::before{content:'🎙️ NARRATION';position:absolute;top:-10px;left:18px;background:var(--bg);padding:0 8px;font-size:0.58rem;font-weight:700;letter-spacing:2px;color:var(--cyan)}
.script-text{font-size:1.12rem;line-height:2.1;color:var(--text);white-space:pre-line}
.script-text em{color:var(--cyan);font-style:normal;font-weight:600}
.cue-box{margin-top:12px;padding:11px 14px;background:rgba(244,63,94,0.06);border:1px solid rgba(244,63,94,0.2);border-radius:9px;flex-shrink:0}
.cue-label{font-size:0.56rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--rose);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.script-box::-webkit-scrollbar{width:4px}
.script-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.nav-bar{grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:space-between;padding:14px 30px;border-top:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);flex-shrink:0}
.nav-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 18px;font-size:0.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s;font-family:'Outfit',sans-serif}
.nav-btn:hover{background:rgba(81,43,215,0.12);border-color:var(--dotnet);color:var(--cyan)}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.slide-counter{font-family:'Fira Code',monospace;font-size:0.95rem;color:var(--muted)}
.slide-counter span{color:var(--text);font-weight:700}
.right-panel{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;overflow:hidden}
.rp-head{padding:12px 16px 8px;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.ch-list-p{overflow-y:auto;flex:1;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.ch-p{padding:7px 10px;border-radius:7px;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;border:1px solid transparent;color:var(--muted)}
.ch-p:hover{background:rgba(255,255,255,0.04)}
.ch-p.active{background:rgba(81,43,215,0.1);border-color:rgba(81,43,215,0.28);color:var(--cyan);font-weight:600}
.ch-p.done{color:var(--text)}
.ch-p .cn{width:20px;height:20px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:700;font-family:'Fira Code',monospace;background:rgba(255,255,255,0.06);color:var(--muted);transition:all .2s}
.ch-p.active .cn{background:var(--dotnet);color:#fff}
.ch-p.done .cn{background:rgba(81,43,215,0.2);color:var(--cyan)}
.next-preview{padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0}
.np-label{font-size:0.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.np-title{font-size:0.82rem;font-weight:700;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.np-title i{color:var(--blue)}
.prog-wrap{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.prog-label{font-size:0.6rem;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.prog-bar{height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--dotnet),var(--cyan));border-radius:3px;transition:width .4s}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-logo"><i class="fa-brands fa-microsoft" style="color:var(--dotnet)"></i> Presenter View <div class="tb-badge">TOP 10 BEST PRACTICES</div></div>
  <div class="tb-right">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="timer-display" id="timer">00:00</div>
      <div class="timer-btns">
        <button class="tbtn" id="timerBtn" onclick="toggleTimer()"><i class="fa-solid fa-play"></i></button>
        <button class="tbtn" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </div>
    <div class="conn-status"><div class="conn-dot" id="connDot"></div><span id="connTxt">সংযুক্ত নেই</span></div>
  </div>
</div>
<div class="main">
  <div class="script-panel">
    <div class="cur-label" id="curLabel">স্লাইড ১</div>
    <div class="cur-title" id="curTitle">পরিচয়</div>
    <div class="script-box"><div class="script-text" id="scriptText"></div></div>
    <div class="cue-box" id="cueBox" style="display:none">
      <div class="cue-label"><i class="fa-solid fa-clapperboard"></i> প্রোডিউশন cue</div>
      <div class="cue-text" id="cueText"></div>
    </div>
  </div>
  <div class="nav-bar">
    <div style="display:flex;gap:10px">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled><i class="fa-solid fa-arrow-left"></i> পেছনে</button>
      <button class="nav-btn" id="nextBtn" onclick="navigate(1)">সামনে <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="slide-counter">স্লাইড <span id="curNum">1</span> / <span id="totNum">13</span></div>
  </div>
  <div class="right-panel">
    <div class="rp-head"><i class="fa-solid fa-list-ul"></i> অধ্যায়সমূহ</div>
    <div class="ch-list-p" id="chListP"></div>
    <div class="next-preview">
      <div class="np-label"><i class="fa-solid fa-forward"></i> পরবর্তী</div>
      <div class="np-title" id="nextTitle"><i class="fa-solid fa-arrow-right"></i> <span>—</span></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>অগ্রগতি</span><span id="progPct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </div>
</div>
<script>
const BC=new BroadcastChannel('aspnet_best_practices_presentation');
let cur=0,timerInterval=null,seconds=0,running=false;
const slides=[
  {title:'পরিচয় — Top 10 ASP.NET Core Best Practices',cue:'৩ প্রশ্ন stagger (~২s) → ~১০s পর Arrow',script:`আসসালামু আলাইকুম! <em>Coding Drop</em> — স্বাগতম।

Developers প্রায়ই তিন প্রশ্ন করেন — production API-তে কোন rules? কোন mistakes avoid? ASP.NET Core-এ কীভাবে apply?

আজকের ভিডিওতে <em>Top 10 ASP.NET Core Best Practices</em> — একে একে দেখব। শুরু করি।`},
  {title:'Top 10 ওভারভিউ',cue:'~২s-এ ১০ কার্ড auto highlight → Arrow',script:`আজ ১০টি rule কভার করব।

<em>DI</em>, <em>Async/Await</em>, <em>Middleware Order</em>, <em>IOptions</em>, <em>Logging</em>, <em>Exception Handling</em>, <em>Health Checks</em>, <em>Validation</em>, <em>HTTPS & Security</em>, <em>Performance</em>।

একে একে বিস্তারিত।`},
  {title:'#1 — Dependency Injection',cue:'DI Flow ~২s → Good code ~৪.৫s auto',script:`Rule #1 — <em>Dependency Injection</em>।

Bad — Controller-এ <em>new OrderService()</em>। Tight coupling, mock impossible।

Good — constructor injection, interface + DI Container।

Rule: <em>new()</em> avoid — interface + DI।`},
  {title:'#2 — Async/Await',cue:'Blocking ~২s → Async ~৬.৫s auto',script:`Rule #2 — <em>Async/Await</em> সঠিকভাবে।

Blocking — <em>.Result</em> / <em>.Wait()</em> thread pool block করে।

Async — thread await করছে, block নয় — অন্য request handle করতে পারছে।

Rule: DB, HTTP, file I/O — async। <em>.Result</em> never।`},
  {title:'#3 — Middleware Order',cue:'~২s-এ correct order auto + green',script:`Rule #3 — <em>Middleware Order</em>।

Exception → HTTPS → Static → Routing → Auth → Authorization → Endpoints।

Auth Routing-এর আগে — user identify হয় না। Interview-এ আসে — মুখস্থ রাখুন।`},
  {title:'#4 — IOptions Pattern',cue:'~২s-এ Config Flow auto',script:`Rule #4 — <em>IOptions&lt;T&gt;</em> configuration।

API key কোডে নয় — <em>appsettings.json</em>।

<em>Configure&lt;T&gt;()</em> register, <em>IOptions&lt;T&gt;</em> inject।

Production-এ Key Vault বা env variable।`},
  {title:'#5 — Structured Logging',cue:'~২s-এ log stream auto',script:`Rule #5 — <em>ILogger</em> structured logging।

<em>Console.WriteLine()</em> production-এ নয়।

<em>LogInformation("Order {OrderId}", orderId)</em> — placeholders।

Serilog / Application Insights production-এ।`},
  {title:'#6 — Exception Handling',cue:'~৩.৫s-এ ProblemDetails auto',script:`Rule #6 — Global exception + <em>ProblemDetails</em>।

Stack trace client-এ — security risk।

RFC 7807 <em>ProblemDetails</em> — clean, secure response।

<em>UseExceptionHandler()</em> middleware-এর প্রথমে।`},
  {title:'#7 — Health Checks',cue:'~২s-এ health checks auto',script:`Rule #7 — <em>Health Checks</em>।

K8s, Docker, Load Balancer — <em>/health</em> দেখে।

<em>AddHealthChecks()</em> + <em>MapHealthChecks("/health")</em>।`},
  {title:'#8 — Input Validation',cue:'~২s-এ validation demo auto',script:`Rule #8 — <em>Input Validation</em>।

User input trust করবেন না।

DataAnnotations বা FluentValidation। <em>ModelState.IsValid</em> check।`},
  {title:'#9 — HTTPS & Security',cue:'~২s-এ security badges auto',script:`Rule #9 — <em>HTTPS</em> + security headers।

Production-এ HTTPS mandatory। HSTS, CSP, CORS configure।

<em>UseHttpsRedirection()</em>, <em>UseHsts()</em> সঠিক order-এ।`},
  {title:'#10 — Performance Optimization',cue:'~২s-এ compression gauge auto',script:`Rule #10 — <em>Performance</em>।

Compression — JSON ছোট। Caching — repeat fast। <em>AsNoTracking()</em> read-only query।

Profiler দিয়ে measure — guess নয়।`},
  {title:'সারসংক্ষেপ — Top 10 Best Practices',cue:'~২s-এ summary list auto',script:`আজ ১০ rule দেখলাম — DI, Async, Middleware, IOptions, Logging, Exception, Health, Validation, Security, Performance।

ভিডিও useful লাগলে like করুন। <em>Coding Drop</em> subscribe করুন। আল্লাহ হাফেজ!`}
];
const chapters=['পরিচয়','Top 10 ওভারভিউ','#1 DI','#2 Async/Await','#3 Middleware','#4 IOptions','#5 Logging','#6 Exception','#7 Health Checks','#8 Validation','#9 Security','#10 Performance','সারসংক্ষেপ'];
const TOTAL=slides.length;document.getElementById('totNum').textContent=TOTAL;
const chListP=document.getElementById('chListP');
chapters.forEach((ch,i)=>{const el=document.createElement('div');el.className='ch-p'+(i===0?' active':'');el.innerHTML=`<div class="cn">${i+1}</div>${ch}`;el.onclick=()=>navigate(i-cur);chListP.appendChild(el)});
function updateUI(){const s=slides[cur];document.getElementById('curLabel').textContent=`স্লাইড ${cur+1}`;document.getElementById('curTitle').textContent=s.title;document.getElementById('scriptText').innerHTML=s.script;const cueBox=document.getElementById('cueBox'),cueText=document.getElementById('cueText');if(s.cue){cueBox.style.display='block';cueText.textContent=s.cue}else{cueBox.style.display='none';cueText.textContent=''}document.getElementById('curNum').textContent=cur+1;const pct=Math.round(((cur+1)/TOTAL)*100);document.getElementById('progPct').textContent=pct+'%';document.getElementById('progFill').style.width=pct+'%';document.getElementById('prevBtn').disabled=cur===0;document.getElementById('nextBtn').disabled=cur===TOTAL-1;document.querySelectorAll('.ch-p').forEach((el,i)=>{el.classList.toggle('active',i===cur);el.classList.toggle('done',i<cur)});const nt=document.getElementById('nextTitle');nt.innerHTML=cur<TOTAL-1?`<i class="fa-solid fa-arrow-right"></i> ${chapters[cur+1]}`:`<i class="fa-solid fa-flag-checkered"></i> শেষ`}
function navigate(delta){const next=Math.max(0,Math.min(TOTAL-1,cur+delta));if(next===cur)return;cur=next;BC.postMessage({type:'nav',idx:cur});updateUI()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')navigate(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')navigate(-1)});
function toggleTimer(){if(running){clearInterval(timerInterval);running=false;document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-play"></i>'}else{timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000);running=true;document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-pause"></i>'}}
function resetTimer(){clearInterval(timerInterval);running=false;seconds=0;document.getElementById('timer').textContent='00:00';document.getElementById('timerBtn').innerHTML='<i class="fa-solid fa-play"></i>'}
BC.postMessage({type:'ping_from_presenter'});setInterval(()=>BC.postMessage({type:'ping_from_presenter'}),3000);
BC.onmessage=e=>{if(e.data.type==='ping'){document.getElementById('connDot').classList.add('live');document.getElementById('connTxt').textContent='সংযুক্ত';setTimeout(()=>{document.getElementById('connDot').classList.remove('live');document.getElementById('connTxt').textContent='সংযুক্ত নেই'},5000)}};
updateUI();
</script>
</body>
</html>
