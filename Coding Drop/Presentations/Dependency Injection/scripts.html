<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View — Dependency Injection Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg:      #020617; /* Very Dark Slate */
  --surface: #0f172a;
  --border:  rgba(255,255,255,0.08);
  --teal:    #14b8a6;
  --coral:   #fb7185;
  --indigo:  #6366f1;
  --fuchsia: #d946ef;
  --text:    #f8fafc;
  --muted:   #94a3b8;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:'Outfit','Noto Sans Bengali',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

/* ── top bar ── */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tb-logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1rem; }
.tb-badge {
  background:linear-gradient(135deg,var(--coral),var(--fuchsia));
  color:#fff; padding:3px 9px; border-radius:6px;
  font-size:0.68rem; font-weight:700; letter-spacing:1px;
}
.tb-right { display:flex; align-items:center; gap:22px; }

/* ── timer ── */
.timer-wrap { display:flex; align-items:center; gap:10px; }
.timer-display {
  font-family:'Fira Code',monospace;
  font-size:1.7rem; font-weight:700;
  color:var(--teal);
  letter-spacing:2px;
  line-height:1;
}
.timer-display.warn { color:var(--coral); }
.timer-display.over { color:#ef4444; animation:blink .7s infinite alternate; }
@keyframes blink { to { opacity:.4; } }
.timer-btns { display:flex; gap:6px; }
.tbtn {
  background:rgba(255,255,255,0.07); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:5px 11px;
  font-size:0.75rem; font-weight:600; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition:all .2s;
}
.tbtn:hover { background:rgba(20,184,166,0.1); border-color:var(--teal); color:var(--teal); }
.tbtn.running { color:var(--coral); border-color:rgba(251,113,133,0.3); }

/* ── connection status ── */
.conn-status {
  display:flex; align-items:center; gap:7px;
  font-size:0.75rem; color:var(--muted);
}
.conn-dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--muted);
  transition:background .3s;
}
.conn-dot.live { background:var(--indigo); box-shadow:0 0 8px rgba(99,102,241,.5); animation:pulse .8s infinite alternate; }
@keyframes pulse { to { opacity:.4; transform:scale(.7); } }

/* ── main grid ── */
.main {
  flex:1; display:grid;
  grid-template-columns:1fr 340px;
  grid-template-rows:1fr auto;
  gap:0; overflow:hidden;
  height:calc(100vh - 66px);
}

/* ── script panel ── */
.script-panel {
  grid-column:1; grid-row:1;
  display:flex; flex-direction:column;
  padding:28px 32px;
  border-right:1px solid var(--border);
  overflow:hidden;
}
.cur-slide-label {
  font-size:0.65rem; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--teal);
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
}
.cur-slide-label::before { content:''; width:18px; height:2px; background:var(--teal); border-radius:1px; }
.cur-slide-title {
  font-size:1.5rem; font-weight:800;
  line-height:1.2; margin-bottom:22px;
  color:var(--text);
}

.script-box {
  flex:1; overflow-y:auto;
  background:rgba(20,184,166,0.03);
  border:1px solid rgba(20,184,166,0.15);
  border-radius:14px;
  padding:24px 28px;
  position:relative;
}
.script-box::before {
  content:'📢 SCRIPT';
  position:absolute; top:-11px; left:20px;
  background:var(--bg); padding:0 8px;
  font-size:0.6rem; font-weight:700; letter-spacing:2px;
  color:var(--teal);
}
.script-text {
  font-size:1.15rem; line-height:2;
  color:var(--text);
  font-weight:400;
  white-space: pre-line;
}
.script-text em {
  color:var(--teal); font-style:normal; font-weight:600;
}

/* scrollbar */
.script-box::-webkit-scrollbar { width:4px; }
.script-box::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* ── nav bar (bottom of script) ── */
.nav-bar {
  grid-column:1; grid-row:2;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 32px;
  border-top:1px solid var(--border);
  border-right:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.nav-arrows { display:flex; gap:10px; }
.nav-btn {
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--text); border-radius:10px;
  padding:10px 20px; font-size:0.85rem;
  font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  transition:all .2s; font-family:'Outfit',sans-serif;
}
.nav-btn:hover { background:rgba(20,184,166,0.1); border-color:var(--teal); color:var(--teal); }
.nav-btn:disabled { opacity:0.3; cursor:not-allowed; }
.slide-counter {
  font-family:'Fira Code',monospace; font-size:1rem;
  color:var(--muted); font-weight:500;
}
.slide-counter span { color:var(--text); font-weight:700; }

/* ── right panel ── */
.right-panel {
  grid-column:2; grid-row:1 / 3;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* chapter list */
.rp-section {
  display:flex; flex-direction:column;
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
.rp-head {
  padding:14px 18px 10px;
  font-size:0.62rem; font-weight:700;
  text-transform:uppercase; letter-spacing:1.5px;
  color:var(--muted); flex-shrink:0;
  display:flex; align-items:center; gap:7px;
}
.ch-list-p {
  overflow-y:auto; flex:1;
  padding:0 10px 10px;
  display:flex; flex-direction:column; gap:3px;
}
.ch-p {
  padding:8px 12px; border-radius:8px;
  font-size:0.78rem; cursor:pointer;
  display:flex; align-items:center; gap:9px;
  transition:all .2s; border:1px solid transparent;
  color:var(--muted);
}
.ch-p:hover { background:rgba(255,255,255,0.04); }
.ch-p.active {
  background:rgba(20,184,166,0.08); border-color:rgba(20,184,166,0.25);
  color:var(--teal); font-weight:600;
}
.ch-p.done { color:var(--text); }
.ch-p .cn {
  width:20px; height:20px; border-radius:5px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:0.62rem; font-weight:700;
  font-family:'Fira Code',monospace;
  background:rgba(255,255,255,0.06); color:var(--muted);
  transition:all .2s;
}
.ch-p.active .cn { background:var(--teal); color:#000; }
.ch-p.done .cn { background:rgba(99,102,241,0.15); color:var(--indigo); }

/* next slide preview */
.next-preview {
  padding:16px 18px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.np-label {
  font-size:0.6rem; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.np-title {
  font-size:0.85rem; font-weight:700;
  color:var(--text); line-height:1.3;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:8px; padding:10px 14px;
  display:flex; align-items:center; gap:9px;
}
.np-title i { color:var(--coral); }

/* progress */
.prog-wrap {
  padding:14px 18px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.prog-bar-thin {
  height:4px; background:rgba(255,255,255,0.07);
  border-radius:2px; overflow:hidden; margin-top:8px;
}
.prog-fill {
  height:100%; width:0%;
  background:linear-gradient(90deg,var(--coral),var(--teal));
  border-radius:2px; transition:width .4s ease;
}
.prog-stats {
  display:flex; justify-content:space-between; align-items:center;
  margin-top:6px; font-size:0.7rem; color:var(--muted);
}
.prog-pct { color:var(--teal); font-weight:700; font-family:'Fira Code',monospace; }

/* open audience btn */
.open-btn {
  display:flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,var(--coral),var(--fuchsia));
  color:#fff; border:none; border-radius:10px;
  padding:10px 16px; font-size:0.8rem; font-weight:700;
  cursor:pointer; transition:all .2s;
  margin:14px 18px; text-decoration:none;
  justify-content:center;
}
.open-btn:hover { transform:scale(1.03); box-shadow:0 0 16px rgba(251,113,133,.3); }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh">

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-logo">
    <img src="coding drop logo.png" alt="logo" style="width:32px;height:32px;border-radius:7px;object-fit:cover">
    <div class="tb-badge">PRESENTER</div>
    <span>DI Masterclass</span>
  </div>
  <div class="tb-right">
    <div class="conn-status">
      <div class="conn-dot" id="connDot"></div>
      <span id="connLabel">Audience window-এর জন্য অপেক্ষা করছে...</span>
    </div>
    <div class="timer-wrap">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-btns">
        <button class="tbtn" id="timerBtn" onclick="toggleTimer()"><i class="fa-solid fa-play"></i> শুরু</button>
        <button class="tbtn" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- Script Panel -->
  <div class="script-panel">
    <div class="cur-slide-label"><i class="fa-solid fa-tv"></i> বর্তমান স্লাইড</div>
    <div class="cur-slide-title" id="curTitle">Chapter 1 — পরিচিতি</div>
    <div class="script-box">
      <div class="script-text" id="scriptText">লোড হচ্ছে...</div>
    </div>
  </div>

  <!-- Nav Bar -->
  <div class="nav-bar">
    <div class="nav-arrows">
      <button class="nav-btn" id="btnPrev" onclick="presNav(-1)" disabled>
        <i class="fa-solid fa-arrow-left"></i> আগের
      </button>
      <button class="nav-btn" id="btnNext" onclick="presNav(1)">
        পরের <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
    <div class="slide-counter"><span id="curNum">1</span> / <span id="totNum">13</span></div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">

    <div class="rp-section" style="flex:1;overflow:hidden">
      <div class="rp-head"><i class="fa-solid fa-list-ul"></i> Chapter তালিকা</div>
      <div class="ch-list-p" id="chListP"></div>
    </div>

    <div class="next-preview">
      <div class="np-label"><i class="fa-solid fa-forward"></i> পরের স্লাইড</div>
      <div class="np-title" id="nextTitle"><i class="fa-solid fa-arrow-right"></i> <span>লোড হচ্ছে...</span></div>
    </div>

    <div class="prog-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--muted)">
        <span><i class="fa-solid fa-chart-line"></i> অগ্রগতি</span>
        <span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-bar-thin"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-stats">
        <span id="elapsedLabel">অতিবাহিত: 00:00</span>
        <span id="remainLabel">বাকি: ~20:00</span>
      </div>
    </div>

    <a class="open-btn" href="main.html" target="_blank" id="openBtn">
      <i class="fa-solid fa-tv"></i> Audience Window খুলুন
    </a>

  </div>

</div>

<script>
/* ─── SLIDES DATA ─── */
const SLIDES = [
  {
    ch:'পরিচিতি',
    narration:`আসসালামু আলাইকুম! Coding Drop-এ স্বাগতম।

আজ আমরা সফটওয়্যার ইঞ্জিনিয়ারিং-এর অন্যতম গুরুত্বপূর্ণ কনসেপ্ট — <em>Dependency Injection</em> বা DI নিয়ে কথা বলব।

DI কোডকে maintainable, testable এবং flexible করার সবচেয়ে জনপ্রিয় ডিজাইন প্যাটার্ন। আজ দেখব Loose Coupling, IoC Container, Service Lifetimes এবং ASP.NET Core-এ বাস্তব ব্যবহার।`
  },
  {
    ch:'Tight Coupling বনাম Loose Coupling',
    narration:`ডিপেনডেন্সি ইনজেকশন বোঝার আগে আমাদের বুঝতে হবে প্রবলেমটা আসলে কোথায়।

যখন একটি ক্লাস সরাসরি 'new' কিওয়ার্ড ব্যবহার করে অন্য একটি ক্লাসের অবজেক্ট তৈরি করে, তখন তাকে বলা হয় Tight Coupling।

<em>Tight Coupling / Loose Coupling</em> সুইচে ক্লিক করলে দুই পাশের কোডের পার্থক্য দেখতে পাবেন — বামে সমস্যা, ডানে Constructor Injection-এর সমাধান।

Loose Coupling-এ ক্লাস ইন্টারফেস ব্যবহার করে, ডিপেনডেন্সি বাইরে থেকে ইনজেক্ট করা হয়।`
  },
  {
    ch:'Dependency Injection কী?',
    narration:`তাহলে Dependency Injection বা DI আসলে কী?

খুব সহজ কথায় বলতে গেলে, "নিজের প্রয়োজনীয় জিনিস নিজে তৈরি না করে, অন্যের কাছ থেকে চেয়ে নেওয়াকেই Dependency Injection বলে।"

যেমনটা আমরা বলছিলাম, Car ক্লাসটি নিজে new Engine() না করে, যদি কেউ বাইরে থেকে তাকে একটি ইঞ্জিন দিয়ে দেয়, সেটাই হলো ইনজেকশন।

এখানে তিনটি মূল চরিত্র কাজ করে:
১. Client (যে ডিপেনডেন্সি ব্যবহার করবে, যেমন: Car)
২. Service (যে কাজটা করবে, যেমন: Engine)
৩. Injector / IoC Container (যে সার্ভিসটি তৈরি করে ক্লায়েন্টকে দিবে)

DI-এর মূল উদ্দেশ্য হলো অবজেক্ট তৈরি করার দায়িত্ব ক্লাসের ভেতর থেকে সরিয়ে বাইরে নিয়ে আসা।`
  },
  {
    ch:'DI এর প্রকারভেদ',
    narration:`Dependency Injection মূলত তিনটি উপায়ে করা যায়।

<em>প্রকারভেদ দেখুন</em> বাটনে ক্লিক করলে Constructor, Method এবং Property Injection একে একে হাইলাইট হবে।

Constructor Injection ASP.NET Core-এ বেস্ট প্র্যাকটিস — অবজেক্ট তৈরি হওয়ার সময়ই সব ডিপেনডেন্সি পেয়ে যায়।`
  },
  {
    ch:'Service Lifetimes (জীবনকাল)',
    narration:`ASP.NET Core-এ DI Container অবজেক্ট তৈরি করার সময় তার জীবনকাল ঠিক করতে পারেন।

<em>Lifetime তুলনা</em> বাটনে ক্লিক করলে Transient, Scoped ও Singleton তিনটি কার্ড হাইলাইট হবে।

Transient = প্রতিবার নতুন, Scoped = প্রতি HTTP Request-এ এক, Singleton = পুরো App-এ এক।`
  },
  {
    ch:'IoC Container (Inversion of Control)',
    narration:`IoC Container হলো DI-এর মূল ইঞ্জিন — অবজেক্ট তৈরির নিয়ন্ত্রণ ফ্রেমওয়ার্কের হাতে।

<em>IoC Phases দেখুন</em> বাটনে ক্লিক করলে Registration → Resolution → Disposal তিনটি ধাপ একে একে দেখাবে।`
  },
  {
    ch:'IoC Resolution Flow',
    narration:`IoC Container কীভাবে অবজেক্ট রিসলভ করে তা ফ্লো ডায়াগ্রামে দেখি।

<em>Resolution Flow চালান</em> বাটনে ক্লিক করলে UserController থেকে শুরু করে Repository পর্যন্ত পুরো রিসলিউশন প্রসেস অ্যানিমেট হবে।`
  },
  {
    ch:'Tight Coupling Code (সমস্যা)',
    narration:`এখানে Tight Coupling-এর একটি বাস্তব উদাহরণ — UserController সরাসরি new UserService() করছে।

<em>কোড প্রকাশ করুন</em> বাটনে ক্লিক করলে কোড লাইন বাই লাইন দেখাবে। এতে Unit Test এবং মেইনটেন্যান্স কঠিন হয়।`
  },
  {
    ch:'DI Code in ASP.NET Core (সমাধান)',
    narration:`ASP.NET Core-এ DI দিয়ে কীভাবে সমাধান করা হয় দেখি।

<em>DI কোড দেখুন</em> বাটনে ক্লিক করলে Program.cs-এ Registration এবং Controller-এ Constructor Injection দুটোই প্রকাশ পাবে।`
  },
  {
    ch:'Live Sandbox — Lifetime Demo',
    narration:`এখন লাইভ স্যান্ডবক্সে Service Lifetimes-এর পার্থক্য দেখি।

<em>Send Request 1</em> ও <em>Send Request 2</em> বাটনে ক্লিক করুন — Transient-এ Guid আলাদা, Scoped-এ এক Request-এ একই, Singleton-এ সবসময় একই থাকে।`
  },
  {
    ch:'DI এর সুবিধাসমূহ',
    narration:`Dependency Injection-এর মূল সুবিধাগুলো একনজরে।

<em>সুবিধা প্রকাশ করুন</em> বাটনে ক্লিক করলে Loose Coupling, Testability, Maintainability সহ ছয়টি সুবিধা একে একে হাইলাইট হবে।`
  },
  {
    ch:'সতর্কতা ও Anti-patterns',
    narration:`DI ব্যবহারে কিছু ভুল থেকে দূরে থাকতে হবে।

<em>সতর্কতা দেখুন</em> বাটনে ক্লিক করলে Service Locator, Over-injection এবং Captive Dependency — তিনটি Anti-pattern দেখাবে।`
  },
  {
    ch:'সারাংশ ও বিদায়',
    narration:`আজকের সেশনে DI-এর কোর কনসেপ্ট থেকে ASP.NET Core ব্যবহার পর্যন্ত দেখলাম।

<em>সারসংক্ষেপ প্রকাশ করুন</em> বাটনে ক্লিক করলে চারটি মূল পয়েন্ট একে একে দেখাবে।

ভিডিওটি ভালো লাগলে লাইক দিন এবং Coding Drop চ্যানেলে সাবস্ক্রাইব করুন। আল্লাহ হাফেজ!`
  }
];

const total = SLIDES.length;
let cur = 0;

/* ─── BroadcastChannel ─── */
const BC = new BroadcastChannel('di_presentation');
let audienceConnected = false;

BC.onmessage = (e) => {
  if(e.data.type === 'nav'){
    audienceConnected = true;
    updateConn(true);
    cur = e.data.idx;
    renderSlide();
  }
  if(e.data.type === 'ping'){
    audienceConnected = true;
    updateConn(true);
  }
};

function updateConn(live){
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  if(live){
    dot.classList.add('live');
    lbl.textContent = 'Audience window সংযুক্ত ✓';
    lbl.style.color = 'var(--indigo)';
  } else {
    dot.classList.remove('live');
    lbl.textContent = 'Audience window-এর জন্য অপেক্ষা করছে...';
    lbl.style.color = 'var(--muted)';
  }
}

/* navigate from presenter */
function presNav(dir){
  const next = cur + dir;
  if(next < 0 || next >= total) return;
  cur = next;
  BC.postMessage({ type: 'nav', idx: cur });
  renderSlide();
}

/* keyboard */
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); presNav(1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); presNav(-1); }
  else if(e.key>='1'&&e.key<='9'){ e.preventDefault(); cur=parseInt(e.key)-1; BC.postMessage({type:'nav',idx:cur}); renderSlide(); }
});

/* ─── RENDER ─── */
function renderSlide(){
  const sl = SLIDES[cur];
  document.getElementById('curTitle').textContent = 'Chapter '+(cur+1)+' — '+sl.ch;
  document.getElementById('scriptText').innerHTML = sl.narration.replace(/"/g,'<em>"</em>').replace(/'([^']+)'/g,"<em>'$1'</em>");
  document.getElementById('curNum').textContent = cur+1;
  document.getElementById('totNum').textContent = total;

  // next title
  const nextSl = SLIDES[cur+1];
  const ntEl = document.getElementById('nextTitle');
  if(nextSl) ntEl.innerHTML = `<i class="fa-solid fa-arrow-right"></i> <span>${nextSl.ch}</span>`;
  else ntEl.innerHTML = `<i class="fa-solid fa-flag-checkered"></i> <span style="color:var(--indigo)">শেষ</span>`;

  // buttons
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === total-1;

  // progress
  const pct = Math.round(((cur+1)/total)*100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';

  // chapter list
  document.querySelectorAll('.ch-p').forEach((el,i)=>{
    el.classList.remove('active','done');
    if(i===cur) el.classList.add('active');
    else if(i<cur) el.classList.add('done');
  });
  const active = document.getElementById('cp-'+cur);
  if(active) active.scrollIntoView({behavior:'smooth',block:'nearest'});

  // scroll script to top
  document.querySelector('.script-box').scrollTop = 0;
}

/* ─── BUILD CHAPTERS ─── */
function buildChapters(){
  const wrap = document.getElementById('chListP');
  SLIDES.forEach((sl,i)=>{
    const d = document.createElement('div');
    d.className = 'ch-p' + (i===0?' active':'');
    d.id = 'cp-'+i;
    d.onclick = ()=>{ cur=i; BC.postMessage({type:'nav',idx:cur}); renderSlide(); };
    d.innerHTML = `<div class="cn">${i+1}</div><span>${sl.ch}</span>`;
    wrap.appendChild(d);
  });
}

/* ─── TIMER ─── */
let timerSec = 0;
let timerRunning = false;
let timerIv = null;

function toggleTimer(){
  const btn = document.getElementById('timerBtn');
  if(timerRunning){
    clearInterval(timerIv); timerRunning = false;
    btn.innerHTML = '<i class="fa-solid fa-play"></i> শুরু';
    btn.classList.remove('running');
  } else {
    timerIv = setInterval(tickTimer, 1000);
    timerRunning = true;
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> বিরতি';
    btn.classList.add('running');
  }
}

function resetTimer(){
  clearInterval(timerIv); timerRunning = false;
  timerSec = 0;
  const btn = document.getElementById('timerBtn');
  btn.innerHTML = '<i class="fa-solid fa-play"></i> শুরু';
  btn.classList.remove('running');
  updateTimerDisplay();
}

function tickTimer(){
  timerSec++;
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const m = Math.floor(timerSec/60).toString().padStart(2,'0');
  const s = (timerSec%60).toString().padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  el.textContent = m+':'+s;
  // color coding
  if(timerSec < 1200) el.className='timer-display';
  else if(timerSec < 1320) el.className='timer-display warn';
  else el.className='timer-display over';

  // elapsed & remaining
  document.getElementById('elapsedLabel').textContent = 'অতিবাহিত: '+m+':'+s;
  const rem = Math.max(0, 1200-timerSec);
  const rm = Math.floor(rem/60).toString().padStart(2,'0');
  const rs = (rem%60).toString().padStart(2,'0');
  document.getElementById('remainLabel').textContent = 'বাকি: '+rm+':'+rs;
}

/* ─── INIT ─── */
buildChapters();
renderSlide();

// Ping audience window periodically
setInterval(()=>{
  BC.postMessage({type:'ping_from_presenter'});
}, 3000);
</script>
</body>
</html>
