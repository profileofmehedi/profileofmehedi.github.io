<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter View — Dependency Injection Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg:      #020617; /* Very Dark Slate */
  --surface: #0f172a;
  --border:  rgba(255,255,255,0.08);
  --teal:    #14b8a6;
  --coral:   #fb7185;
  --indigo:  #6366f1;
  --fuchsia: #d946ef;
  --text:    #f8fafc;
  --muted:   #94a3b8;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:'Outfit','Noto Sans Bengali',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

/* ── top bar ── */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tb-logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1rem; }
.tb-badge {
  background:linear-gradient(135deg,var(--coral),var(--fuchsia));
  color:#fff; padding:3px 9px; border-radius:6px;
  font-size:0.68rem; font-weight:700; letter-spacing:1px;
}
.tb-right { display:flex; align-items:center; gap:22px; }

/* ── timer ── */
.timer-wrap { display:flex; align-items:center; gap:10px; }
.timer-display {
  font-family:'Fira Code',monospace;
  font-size:1.7rem; font-weight:700;
  color:var(--teal);
  letter-spacing:2px;
  line-height:1;
}
.timer-display.warn { color:var(--coral); }
.timer-display.over { color:#ef4444; animation:blink .7s infinite alternate; }
@keyframes blink { to { opacity:.4; } }
.timer-btns { display:flex; gap:6px; }
.tbtn {
  background:rgba(255,255,255,0.07); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:5px 11px;
  font-size:0.75rem; font-weight:600; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition:all .2s;
}
.tbtn:hover { background:rgba(20,184,166,0.1); border-color:var(--teal); color:var(--teal); }
.tbtn.running { color:var(--coral); border-color:rgba(251,113,133,0.3); }

/* ── connection status ── */
.conn-status {
  display:flex; align-items:center; gap:7px;
  font-size:0.75rem; color:var(--muted);
}
.conn-dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--muted);
  transition:background .3s;
}
.conn-dot.live { background:var(--indigo); box-shadow:0 0 8px rgba(99,102,241,.5); animation:pulse .8s infinite alternate; }
@keyframes pulse { to { opacity:.4; transform:scale(.7); } }

/* ── main grid ── */
.main {
  flex:1; display:grid;
  grid-template-columns:1fr 340px;
  grid-template-rows:1fr auto;
  gap:0; overflow:hidden;
  height:calc(100vh - 66px);
}

/* ── script panel ── */
.script-panel {
  grid-column:1; grid-row:1;
  display:flex; flex-direction:column;
  padding:28px 32px;
  border-right:1px solid var(--border);
  overflow:hidden;
}
.cur-slide-label {
  font-size:0.65rem; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--teal);
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
}
.cur-slide-label::before { content:''; width:18px; height:2px; background:var(--teal); border-radius:1px; }
.cur-slide-title {
  font-size:1.5rem; font-weight:800;
  line-height:1.2; margin-bottom:22px;
  color:var(--text);
}

.script-box {
  flex:1; overflow-y:auto;
  background:rgba(20,184,166,0.03);
  border:1px solid rgba(20,184,166,0.15);
  border-radius:14px;
  padding:24px 28px;
  position:relative;
}
.script-box::before {
  content:'🎙️ NARRATION';
  position:absolute; top:-11px; left:20px;
  background:var(--bg); padding:0 8px;
  font-size:0.6rem; font-weight:700; letter-spacing:2px;
  color:var(--teal);
}
.script-text {
  font-size:1.15rem; line-height:2;
  color:var(--text);
  font-weight:400;
  white-space: pre-line;
}
.script-text em {
  color:var(--teal); font-style:normal; font-weight:600;
}

.cue-box {
  margin-top:14px;
  padding:12px 16px;
  background:rgba(251,113,133,0.06);
  border:1px solid rgba(251,113,133,0.2);
  border-radius:10px;
  flex-shrink:0;
}
.cue-label {
  font-size:0.58rem; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--coral);
  margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.cue-text {
  font-size:0.82rem; line-height:1.55;
  color:var(--muted); font-weight:500;
}

/* scrollbar */
.script-box::-webkit-scrollbar { width:4px; }
.script-box::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* ── nav bar (bottom of script) ── */
.nav-bar {
  grid-column:1; grid-row:2;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 32px;
  border-top:1px solid var(--border);
  border-right:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.nav-arrows { display:flex; gap:10px; }
.nav-btn {
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--text); border-radius:10px;
  padding:10px 20px; font-size:0.85rem;
  font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  transition:all .2s; font-family:'Outfit',sans-serif;
}
.nav-btn:hover { background:rgba(20,184,166,0.1); border-color:var(--teal); color:var(--teal); }
.nav-btn:disabled { opacity:0.3; cursor:not-allowed; }
.slide-counter {
  font-family:'Fira Code',monospace; font-size:1rem;
  color:var(--muted); font-weight:500;
}
.slide-counter span { color:var(--text); font-weight:700; }

/* ── right panel ── */
.right-panel {
  grid-column:2; grid-row:1 / 3;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* chapter list */
.rp-section {
  display:flex; flex-direction:column;
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
.rp-head {
  padding:14px 18px 10px;
  font-size:0.62rem; font-weight:700;
  text-transform:uppercase; letter-spacing:1.5px;
  color:var(--muted); flex-shrink:0;
  display:flex; align-items:center; gap:7px;
}
.ch-list-p {
  overflow-y:auto; flex:1;
  padding:0 10px 10px;
  display:flex; flex-direction:column; gap:3px;
}
.ch-p {
  padding:8px 12px; border-radius:8px;
  font-size:0.78rem; cursor:pointer;
  display:flex; align-items:center; gap:9px;
  transition:all .2s; border:1px solid transparent;
  color:var(--muted);
}
.ch-p:hover { background:rgba(255,255,255,0.04); }
.ch-p.active {
  background:rgba(20,184,166,0.08); border-color:rgba(20,184,166,0.25);
  color:var(--teal); font-weight:600;
}
.ch-p.done { color:var(--text); }
.ch-p .cn {
  width:20px; height:20px; border-radius:5px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:0.62rem; font-weight:700;
  font-family:'Fira Code',monospace;
  background:rgba(255,255,255,0.06); color:var(--muted);
  transition:all .2s;
}
.ch-p.active .cn { background:var(--teal); color:#000; }
.ch-p.done .cn { background:rgba(99,102,241,0.15); color:var(--indigo); }

/* next slide preview */
.next-preview {
  padding:16px 18px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.np-label {
  font-size:0.6rem; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.np-title {
  font-size:0.85rem; font-weight:700;
  color:var(--text); line-height:1.3;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:8px; padding:10px 14px;
  display:flex; align-items:center; gap:9px;
}
.np-title i { color:var(--coral); }

/* progress */
.prog-wrap {
  padding:14px 18px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.prog-bar-thin {
  height:4px; background:rgba(255,255,255,0.07);
  border-radius:2px; overflow:hidden; margin-top:8px;
}
.prog-fill {
  height:100%; width:0%;
  background:linear-gradient(90deg,var(--coral),var(--teal));
  border-radius:2px; transition:width .4s ease;
}
.prog-stats {
  display:flex; justify-content:space-between; align-items:center;
  margin-top:6px; font-size:0.7rem; color:var(--muted);
}
.prog-pct { color:var(--teal); font-weight:700; font-family:'Fira Code',monospace; }

/* open audience btn */
.open-btn {
  display:flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,var(--coral),var(--fuchsia));
  color:#fff; border:none; border-radius:10px;
  padding:10px 16px; font-size:0.8rem; font-weight:700;
  cursor:pointer; transition:all .2s;
  margin:14px 18px; text-decoration:none;
  justify-content:center;
}
.open-btn:hover { transform:scale(1.03); box-shadow:0 0 16px rgba(251,113,133,.3); }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh">

<!-- TOP BAR -->
<div class="topbar">

<script>
/* ─── SLIDES DATA ─── */
const SLIDES = [
  {
    ch:'পরিচিতি — ৩ প্রশ্ন',
    narration:`আসসালামু আলাইকুম! Coding Drop — স্বাগতম।

Junior থেকে senior — সবাই Dependency Injection সম্পর্কে প্রায় একই তিন প্রশ্ন করেন।

<em>DI কী?</em> <em>কেন এত popular?</em> এবং <em>ASP.NET Core-এ কীভাবে apply করব?</em>

আজকের ভিডিওতেই এই তিনটার উত্তর। চলুন শুরু করি।`,
    cue:'৩ প্রশ্ন screen-এ stagger (~২s) → ~১০s পর Arrow'
  },
  {
    ch:'Tight Coupling বনাম Loose Coupling',
    narration:`প্রথমে problem — <em>Tight Coupling</em>।

Car ক্লাস নিজে <em>new Engine()</em> করছে। Engine বদলাতে Car edit করতে হবে। Unit test-এ mock Engine বসানো কঠিন।

<em>Loose Coupling</em>-এ Car শুধু <em>IEngine</em> চায়। Engine বাইরে থেকে constructor-এ আসে — flexible, testable।`,
    cue:'Tight বলুন → ~৪s-এ Loose auto switch → শেষে Arrow'
  },
  {
    ch:'Dependency Injection কী?',
    narration:`তাহলে <em>Dependency Injection</em> কী?

সহজ কথায় — নিজের দরকারি জিনিস নিজে বানাবে না, বাইরে থেকে পাবে।

Car Engine বানায় না। <em>IoC Container</em> Engine বানিয়ে Car-কে দেয়।

তিনটি role — <em>Client</em> (Car), <em>Service</em> (Engine), <em>Injector</em> (Container)।`,
    cue:'→ Arrow যখন তিন role clear'
  },
  {
    ch:'DI এর প্রকারভেদ',
    narration:`DI তিন উপায়ে করা যায়।

<em>Constructor Injection</em> — সবচেয়ে common, ASP.NET Core default।

<em>Method Injection</em> — নির্দিষ্ট method-এর জন্য।

<em>Property Injection</em> — optional dependency-র জন্য।

Production-এ Constructor Injection দেখবেন সবচেয়ে বেশি।`,
    cue:'~২s-এ কার্ড auto highlight → Arrow'
  },
  {
    ch:'Service Lifetimes (জীবনকাল)',
    narration:`Container object তৈরি করার সময় <em>lifetime</em> ঠিক করেন।

<em>Transient</em> — প্রতিবার নতুন object।

<em>Scoped</em> — এক HTTP request-এ এক instance। DbContext-এর জন্য perfect।

<em>Singleton</em> — পুরো app-এ এক instance, সব request share করে।`,
    cue:'~২s-এ lifetime কার্ড auto → Arrow'
  },
  {
    ch:'IoC Container (Inversion of Control)',
    narration:`<em>IoC Container</em> হল DI-এর engine।

<em>Registration</em> — startup-এ map করা: <em>AddScoped&lt;IEngine, Engine&gt;()</em>।

<em>Resolution</em> — দরকার হলে object তৈরি।

<em>Disposal</em> — lifetime শেষে cleanup।

Control developer-এর হাতে নয় — framework-এর হাতে।`,
    cue:'~২s-এ phases auto → Arrow'
  },
  {
    ch:'IoC Resolution Flow',
    narration:`এক request-এ chain কীভাবে resolve হয়?

<em>UserController</em> চায় <em>IUserService</em>। Container check করে।

<em>UserRepository</em> resolve → <em>UserService</em> তৈরি → Controller-এ inject।

Nested dependency — স্বয়ংক্রিয়। Developer শুধু interface declare করেন।`,
    cue:'~২s-এ flow animation auto → Arrow'
  },
  {
    ch:'Tight Coupling Code (সমস্যা)',
    narration:`Bad code example — <em>UserController</em> ভিতরে <em>new UserService()</em>।

Concrete class-এ bound। Mock impossible। Unit test practically নেই।

<em>Dependency Inversion Principle</em> ভঙ্গ। Production-এ refactor candidate।`,
    cue:'~২s-এ code typing auto → Arrow'
  },
  {
    ch:'DI Code in ASP.NET Core (সমাধান)',
    narration:`ASP.NET Core-এ দুই ধাপ।

<em>Program.cs</em> — <em>AddScoped&lt;IUserService, UserService&gt;()</em> register।

<em>UserController(IUserService)</em> — container inject করবে।

Controller concrete class জানে না। Implementation swap — config-এ, controller untouched।`,
    cue:'~২s-এ DI code auto reveal → Arrow'
  },
  {
    ch:'Live Sandbox — Lifetime Demo',
    narration:`Lifetime পার্থক্য live দেখি।

প্রথম request — Transient-এ প্রতি call নতুন Guid। Scoped-এ এক request-এ same Guid। Singleton-এ সবসময় same।

দ্বিতীয় request — Scoped নতুন Guid, Singleton same। Guid pattern দেখলেই lifetime clear।`,
    cue:'Request 1 ~৩s, Request 2 ~৯.৫s auto → Arrow'
  },
  {
    ch:'DI এর সুবিধাসমূহ',
    narration:`কেন DI popular?

<em>Loose Coupling</em> — class independent।

<em>Testability</em> — mock দিয়ে test সহজ।

<em>Maintainability</em> — clean code।

<em>Flexibility</em> — implementation swap।

<em>Lifetime Management</em> — memory safe।

Modern framework-এ DI default — optional নয়, standard।`,
    cue:'~২s-এ সুবিধা কার্ড auto → Arrow'
  },
  {
    ch:'সতর্কতা ও Anti-patterns',
    narration:`DI misuse-এ complexity বাড়ে। তিনটি সতর্কতা।

<em>Service Locator</em> — <em>GetService()</em> avoid করুন।

<em>Over-injection</em> — ৫+ dependency = class too fat, refactor করুন।

<em>Captive Dependency</em> — Singleton-এ Scoped inject = memory leak risk।`,
    cue:'~২s-এ warnings auto → Arrow'
  },
  {
    ch:'সারাংশ ও বিদায়',
    narration:`আজ দেখলাম — DI loose coupling ও testability দেয়। IoC Container lifetime manage করে। Transient, Scoped, Singleton — তিন lifetime। Constructor Injection — best practice।

ভিডিও useful লাগলে like করুন। <em>Coding Drop</em> subscribe করুন — backend ও .NET গভীর টপিক নিয়মিত আসে।

পরবর্তী ভিডিওতে দেখা হবে। আল্লাহ হাফেজ!`,
    cue:'~২s-এ summary points auto'
  }
];

const total = SLIDES.length;
let cur = 0;

/* ─── BroadcastChannel ─── */
const BC = new BroadcastChannel('di_presentation');
let audienceConnected = false;

BC.onmessage = (e) => {
  if(e.data.type === 'nav'){
    audienceConnected = true;
    updateConn(true);
    cur = e.data.idx;
    renderSlide();
  }
  if(e.data.type === 'ping'){
    audienceConnected = true;
    updateConn(true);
  }
};

function updateConn(live){
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  if(live){
    dot.classList.add('live');
    lbl.textContent = 'Audience window সংযুক্ত ✓';
    lbl.style.color = 'var(--indigo)';
  } else {
    dot.classList.remove('live');
    lbl.textContent = 'Audience window-এর জন্য অপেক্ষা করছে...';
    lbl.style.color = 'var(--muted)';
  }
}

/* navigate from presenter */
function presNav(dir){
  const next = cur + dir;
  if(next < 0 || next >= total) return;
  cur = next;
  BC.postMessage({ type: 'nav', idx: cur });
  renderSlide();
}

/* keyboard */
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); presNav(1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); presNav(-1); }
  else if(e.key>='1'&&e.key<='9'){ e.preventDefault(); cur=parseInt(e.key)-1; BC.postMessage({type:'nav',idx:cur}); renderSlide(); }
});

/* ─── RENDER ─── */
function renderSlide(){
  const sl = SLIDES[cur];
  document.getElementById('curTitle').textContent = 'Chapter '+(cur+1)+' — '+sl.ch;
  document.getElementById('scriptText').innerHTML = sl.narration;

  const cueBox = document.getElementById('cueBox');
  const cueText = document.getElementById('cueText');
  if(sl.cue){
    cueBox.style.display = 'block';
    cueText.textContent = sl.cue;
  } else {
    cueBox.style.display = 'none';
    cueText.textContent = '';
  }
  document.getElementById('curNum').textContent = cur+1;
  document.getElementById('totNum').textContent = total;

  // next title
  const nextSl = SLIDES[cur+1];
  const ntEl = document.getElementById('nextTitle');
  if(nextSl) ntEl.innerHTML = `<i class="fa-solid fa-arrow-right"></i> <span>${nextSl.ch}</span>`;
  else ntEl.innerHTML = `<i class="fa-solid fa-flag-checkered"></i> <span style="color:var(--indigo)">শেষ</span>`;

  // buttons
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === total-1;

  // progress
  const pct = Math.round(((cur+1)/total)*100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';

  // chapter list
  document.querySelectorAll('.ch-p').forEach((el,i)=>{
    el.classList.remove('active','done');
    if(i===cur) el.classList.add('active');
    else if(i<cur) el.classList.add('done');
  });
  const active = document.getElementById('cp-'+cur);
  if(active) active.scrollIntoView({behavior:'smooth',block:'nearest'});

  // scroll script to top
  document.querySelector('.script-box').scrollTop = 0;
}

/* ─── BUILD CHAPTERS ─── */
function buildChapters(){
  const wrap = document.getElementById('chListP');
  SLIDES.forEach((sl,i)=>{
    const d = document.createElement('div');
    d.className = 'ch-p' + (i===0?' active':'');
    d.id = 'cp-'+i;
    d.onclick = ()=>{ cur=i; BC.postMessage({type:'nav',idx:cur}); renderSlide(); };
    d.innerHTML = `<div class="cn">${i+1}</div><span>${sl.ch}</span>`;
    wrap.appendChild(d);
  });
}

/* ─── TIMER ─── */
let timerSec = 0;
let timerRunning = false;
let timerIv = null;

function toggleTimer(){
  const btn = document.getElementById('timerBtn');
  if(timerRunning){
    clearInterval(timerIv); timerRunning = false;
    btn.innerHTML = '<i class="fa-solid fa-play"></i> শুরু';
    btn.classList.remove('running');
  } else {
    timerIv = setInterval(tickTimer, 1000);
    timerRunning = true;
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> বিরতি';
    btn.classList.add('running');
  }
}

function resetTimer(){
  clearInterval(timerIv); timerRunning = false;
  timerSec = 0;
  const btn = document.getElementById('timerBtn');
  btn.innerHTML = '<i class="fa-solid fa-play"></i> শুরু';
  btn.classList.remove('running');
  updateTimerDisplay();
}

function tickTimer(){
  timerSec++;
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const m = Math.floor(timerSec/60).toString().padStart(2,'0');
  const s = (timerSec%60).toString().padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  el.textContent = m+':'+s;
  // color coding
  if(timerSec < 1200) el.className='timer-display';
  else if(timerSec < 1320) el.className='timer-display warn';
  else el.className='timer-display over';

  // elapsed & remaining
  document.getElementById('elapsedLabel').textContent = 'অতিবাহিত: '+m+':'+s;
  const rem = Math.max(0, 1200-timerSec);
  const rm = Math.floor(rem/60).toString().padStart(2,'0');
  const rs = (rem%60).toString().padStart(2,'0');
  document.getElementById('remainLabel').textContent = 'বাকি: '+rm+':'+rs;
}

/* ─── INIT ─── */
buildChapters();
renderSlide();

// Ping audience window periodically
setInterval(()=>{
  BC.postMessage({type:'ping_from_presenter'});
}, 3000);
</script>
