<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-bn="হোম সলিউশন | আপনার ঘরকে দিন নতুন রূপ" data-en="Home Solution | Give Your Home a New Look">হোম সলিউশন | আপনার ঘরকে দিন নতুন রূপ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" data-bn="হোম সলিউশন" data-en="Home Solution">হোম সলিউশন</a>
            <button class="btn btn-light btn-sm lang-switch ms-auto" data-bn="English" data-en="বাংলা">English</button>
        </div>
    </nav>

    <header class="py-5 bg-light">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-7" data-aos="fade-right">
                    <h1 class="display-4 fw-bold mb-4" data-bn="নির্ভরযোগ্য হোম রিপেয়ার এবং ডেকোরেশন সার্ভিস" data-en="Reliable Home Repair and Decoration Services">নির্ভরযোগ্য হোম রিপেয়ার এবং ডেকোরেশন সার্ভিস</h1>
                    <ul class="list-unstyled mb-5">
                        <li class="mb-2"><i class="fas fa-check-circle text-primary me-2"></i> <span data-bn="ইলেকট্রিক্যাল কাজ" data-en="Electrical Work">ইলেকট্রিক্যাল কাজ</span></li>
                        <li class="mb-2"><i class="fas fa-check-circle text-primary me-2"></i> <span data-bn="প্লাম্বিং সার্ভিস" data-en="Plumbing Service">প্লাম্বিং সার্ভিস</span></li>
                        <li class="mb-2"><i class="fas fa-check-circle text-primary me-2"></i> <span data-bn="ইন্টেরিয়র পেইন্টিং" data-en="Interior Painting">ইন্টেরিয়র পেইন্টিং</span></li>
                    </ul>
                </div>
                <div class="col-lg-5" data-aos="fade-left">
                    <div class="card p-4 shadow border-0">
                        <h4 class="fw-bold mb-3 text-center" data-bn="ফ্রি এস্টিমেট নিন" data-en="Get Free Estimate">ফ্রি এস্টিমেট নিন</h4>
                        <form>
                            <input type="text" class="form-control mb-3" placeholder="ঠিকানা" data-bn="ঠিকানা" data-en="Address">
                            <input type="tel" class="form-control mb-3" placeholder="ফোন নম্বর" data-bn="ফোন নম্বর" data-en="Phone Number">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" data-bn="আবেদন করুন" data-en="Apply Now">আবেদন করুন</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
