<!DOCTYPE html>
<html lang="bn">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .flash-header {
            background: linear-gradient(45deg, #ff0000, #ff4d4d);
            color: white;
            padding: 60px 0;
        }
        .timer-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 2rem;
            font-weight: 800;
            display: inline-block;
            backdrop-filter: blur(5px);
        }
        .progress { height: 10px; border-radius: 5px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html" data-bn="সেলস ধামাকা" data-en="Sales Dhamaka">
                <i class="fas fa-bolt me-2"></i>SalesDhamaka

            <button class="btn btn-warning fw-bold lang-switch ms-auto" data-bn="English" data-en="বাংলা">English</button>
        </div>
    </nav>

    <header class="flash-header text-center">
        <div class="container">
            <h1 class="display-3 fw-bold mb-4" data-aos="zoom-in" data-bn="আজকের সুপার ফ্ল্যাশ সেল!" data-en="Today's Super Flash Sale!">আজকের সুপার ফ্ল্যাশ সেল!</h1>

            <div class="timer-box mb-4 shadow-lg animate-pulse">
                <span id="hours">02</span> : <span id="minutes">45</span> : <span id="seconds">12</span>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <p class="mb-2 fw-bold" data-bn="৮৫% স্টক শেষ!" data-en="85% Stock Sold Out!">৮৫% স্টক শেষ!</p>
                    <div class="progress mb-4">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" role="progressbar" style="width: 85%"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="py-5">

            <div class="row g-4">
                <div class="col-md-4" data-aos="fade-up">
                    <div class="card h-100 border-0 shadow-sm overflow-hidden rounded-4">

                            <span class="badge bg-danger position-absolute top-0 start-0 m-3 fs-6">-৫০%</span>
                        </div>
                        <div class="card-body p-4">
                            <h5 class="fw-bold">Smart Watch Pro</h5>
                            <div class="h4 text-danger fw-bold mb-3">৳ ১,৯৯৯ <del class="text-muted fs-6">৳ ৩,৯৯৯</del></div>
                            <button class="btn btn-dark w-100 py-2 fw-bold" data-bn="এখনই কিনুন" data-en="Buy Now">এখনই কিনুন</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                    <div class="card h-100 border-0 shadow-sm overflow-hidden rounded-4">
                        <div class="position-relative">
                            <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=400&q=80" class="card-img-top">
                            <span class="badge bg-danger position-absolute top-0 start-0 m-3 fs-6">-৩০%</span>
                        </div>
                        <div class="card-body p-4">
                            <h5 class="fw-bold">Classic Sunglasses</h5>
                            <div class="h4 text-danger fw-bold mb-3">৳ ৮৯৯ <del class="text-muted fs-6">৳ ১,২৯৯</del></div>
                            <button class="btn btn-dark w-100 py-2 fw-bold" data-bn="এখনই কিনুন" data-en="Buy Now">এখনই কিনুন</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-5 text-center">
        <p class="mb-0 opacity-75" data-bn="&copy; ২০২৬ ফ্ল্যাশ সেল। সকল অধিকার সংরক্ষিত।" data-en="&copy; 2026 Flash Sale. All Rights Reserved.">&copy; ২০২৬ ফ্ল্যাশ সেল। সকল অধিকার সংরক্ষিত।</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
